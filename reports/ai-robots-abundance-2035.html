SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[9,10,18,19],["AI와 로봇은 '지능'과 '정형화된 물리 작업'의 단가를 빠르게 낮추고 있지만, 2035년까지 생산비가 전반적으로 붕괴해 노후 저축이 무의미해지는 수준의 풍요가 올 가능성은 낮다.",
  "AI and robots are rapidly lowering the unit cost of 'intelligence' and of structured physical work, but abundance on a scale where production costs collapse across the board and retirement saving becomes pointless is unlikely by 2035.",
  "ИИ и роботы быстро снижают себестоимость «интеллекта» и структурированного физического труда, но изобилие такого масштаба, при котором издержки обрушатся повсеместно, а пенсионные накопления потеряют смысл, к 2035 году маловероятно.",
  "AI与机器人正在迅速降低“智能”与格式化体力劳动的单价，但到2035年出现生产成本全面崩塌、养老储蓄变得毫无意义的丰裕，可能性很低。",
  "AIとロボットは「知能」と定型的な物理作業の単価を急速に下げているが、2035年までに生産コストが全般的に崩れ、老後の貯蓄が無意味になるほどの豊かさが来る可能性は低い。"],
  ["디지털 단가 하락(9·10)은 B급 근거로 강하게 지지되지만, 거시 생산성 효과(18·19)는 A급 근거에서 완만하게 추정된다. 두 층위의 속도 차이를 결합한 판단이다.",
   "The fall in digital unit costs (9, 10) is strongly supported by grade-B evidence, while macro productivity effects (18, 19) are estimated as modest by grade-A work. The judgement combines the speed gap between the two levels.",
   "Падение цифровой себестоимости (9, 10) хорошо подтверждено данными класса B, а макроэффекты (18, 19) в работах класса A оцениваются как умеренные. Вывод объединяет разницу скоростей двух уровней.",
   "数字单价下降（9、10）有B级证据强力支持，宏观生产率效应（18、19）则由A级研究估计为温和。该判断综合了两个层面的速度差。",
   "デジタル単価の低下（9・10）はB級の根拠で強く支持される一方、マクロの生産性効果（18・19）はA級の研究で緩やかと推計される。二つの層の速度差を結合した判断である。"],"H"),
 s("D",[3,13,8],["머스크의 AI 로드맵(2026~27년 개별 인간 능가, 2030~31년 인류 총합 능가)은 AI 연구자 예측 분포의 가장 이른 꼬리에 해당하며, 그의 과거 기술 시한은 방향은 맞아도 시점이 크게 늦어졌다.",
  "Musk's AI roadmap (beyond any individual human in 2026–27, beyond all humanity combined in 2030–31) sits in the earliest tail of AI researchers' forecasts, and his past technology deadlines were right in direction but very late in timing.",
  "Дорожная карта Маска (умнее любого человека в 2026–27, умнее всего человечества в 2030–31) лежит в самом раннем «хвосте» прогнозов исследователей ИИ, а его прошлые технологические сроки были верны по направлению, но сильно запаздывали.",
  "马斯克的AI路线图（2026–27年超越任何个人、2030–31年超越全人类总和）处于AI研究者预测分布最早的尾部；他过去的技术期限方向正确，但时间大幅延后。",
  "マスクのAIロードマップ（2026〜27年に個人を超え、2030〜31年に人類総和を超える）はAI研究者の予測分布の最も早い裾に当たり、彼の過去の技術的期限は方向は正しくても時期は大きく遅れた。"],
  ["연구자 설문(13)에서 '모든 과업에서 인간 능가' 확률은 2027년 10%, 2047년 50%다. 로보택시 사례(8)는 단일 사례이므로 기저율로만 쓴다.",
   "In the researcher survey (13), the chance of machines outperforming humans at every task is 10% by 2027 and 50% by 2047. The robotaxi case (8) is a single case, used only as a base rate.",
   "В опросе исследователей (13) вероятность превосходства машин во всех задачах — 10% к 2027 и 50% к 2047 году. Случай с роботакси (8) единичен и используется лишь как базовая частота.",
   "研究者调查（13）中，机器在所有任务上胜过人类的概率为2027年10%、2047年50%。无人驾驶出租车案例（8）只是单一案例，仅作基准率使用。",
   "研究者調査（13）では、全タスクで機械が人間を上回る確率は2027年10%、2047年50%である。ロボタクシーの事例（8）は単一事例であり、基準率としてのみ用いる。"],"M"),
 s("A",[33,34,36,5,6],["옵티머스가 3년 안에 최고 외과의를 능가한다는 주장은 근거가 약하다. 자율수술 연구는 체외·동물 단계에서 인상적 성과를 냈지만, 실제 환자 대상 대규모 무작위 시험과 인허가에는 최소 수년이 걸린다.",
  "The claim that Optimus will beat the best surgeons within three years is weakly supported. Autonomous-surgery research has produced impressive ex vivo and animal results, but large randomised trials in real patients and regulatory approval take years at minimum.",
  "Утверждение, что Optimus за три года превзойдёт лучших хирургов, слабо обосновано. Исследования автономной хирургии дали впечатляющие результаты ex vivo и на животных, но крупные рандомизированные испытания на людях и допуск займут как минимум несколько лет.",
  "“Optimus三年内超越最好的外科医生”这一主张依据薄弱。自主手术研究在离体和动物阶段取得了亮眼成果，但针对真实患者的大型随机试验与审批至少需要数年。",
  "オプティマスが3年以内に最高の外科医を上回るという主張は根拠が弱い。自律手術の研究は体外・動物段階で印象的な成果を上げたが、実際の患者を対象とする大規模無作為化試験と承認には最低でも数年かかる。"],null,"H"),
 s("D",[20,32,46,44],["풍요가 오더라도 균일하게 오지 않는다. 디지털 재화는 싸지지만 돌봄·의료·주택처럼 자동화가 어렵거나 공급이 고정된 항목의 상대가격은 오를 수 있어, 노후 저축의 필요는 오히려 그 항목들에서 커진다.",
  "Even if abundance comes, it will not be uniform. Digital goods get cheaper, but the relative price of hard-to-automate or fixed-supply items — care, medicine, housing — can rise, and that is exactly where the need for retirement saving grows.",
  "Даже если изобилие придёт, оно будет неравномерным. Цифровые блага подешевеют, но относительная цена трудноавтоматизируемых или ограниченных благ — ухода, медицины, жилья — может вырасти, и именно там потребность в накоплениях увеличивается.",
  "即使丰裕到来，也不会均匀到来。数字产品会变便宜，但照护、医疗、住房等难以自动化或供给固定之物的相对价格可能上涨，养老储蓄的需要恰恰在这些项目上变大。",
  "豊かさが来ても均一には来ない。デジタル財は安くなるが、介護・医療・住宅のように自動化が難しいか供給が固定された項目の相対価格は上がり得て、老後の貯蓄の必要はむしろそこで大きくなる。"],
  ["보몰 비용병 논리(20)와 일본 돌봄 인력 수요(32), 한국 노인 빈곤(46)을 결합한 추론이다.",
   "An inference combining the Baumol cost-disease logic (20), Japan's care-worker requirement (32) and Korean old-age poverty (46).",
   "Вывод, объединяющий логику «болезни издержек» Баумоля (20), потребность Японии в работниках по уходу (32) и бедность пожилых в Корее (46).",
   "结合鲍莫尔成本病逻辑（20）、日本照护人力需求（32）与韩国老年贫困（46）的推论。",
   "ボーモルのコスト病の論理（20）、日本の介護人材の必要数（32）、韓国の高齢者の貧困（46）を結合した推論である。"],"M"),
 s("D",[25,24,26],["노동시장 충격은 아직 경제 전체에서는 관측되지 않지만 청년 진입 일자리에서 먼저 나타나고 있어, 위험의 핵심은 '대량 실업'보다 '사다리의 붕괴'와 이익의 집중이다.",
  "Labour-market shocks are not yet visible economy-wide but are appearing first in entry-level jobs for the young, so the core risk is less mass unemployment than a broken ladder and concentrated gains.",
  "Шоки на рынке труда пока не видны в экономике в целом, но уже проявляются на стартовых позициях для молодёжи; главный риск — не массовая безработица, а сломанная «лестница» и концентрация выгод.",
  "劳动力市场冲击尚未在整体经济中显现，却已先在青年入门岗位上出现，因此核心风险与其说是大规模失业，不如说是“阶梯断裂”与收益集中。",
  "労働市場の衝撃は経済全体ではまだ観測されないが、若者の入職職で先に現れており、リスクの核心は「大量失業」より「梯子の崩壊」と利益の集中である。"],null,"M"),
 s("D",[18,24,26,47],["MCMC 시뮬레이션(글로벌 기준)에서 2035년 가장 가능성 높은 경로는 '불균등 풍요'({S2})이고, '과대약속 조정'({S4})과 '공유된 풍요'({S1})가 경합하며, '대체 충격'({S3})이 뒤를 잇는다.",
  "In the MCMC simulation (global baseline), the most likely path to 2035 is 'uneven abundance' ({S2}), with 'hype correction' ({S4}) and 'shared abundance' ({S1}) close behind and 'displacement shock' ({S3}) last.",
  "В MCMC-симуляции (глобальная база) наиболее вероятный путь к 2035 году — «неравное изобилие» ({S2}); за ним близко идут «коррекция обещаний» ({S4}) и «общее изобилие» ({S1}), последним — «шок вытеснения» ({S3}).",
  "在MCMC模拟（全球基准）中，到2035年最可能的路径是“不均衡丰裕”（{S2}），“过度承诺回调”（{S4}）与“共享丰裕”（{S1}）紧随其后，“替代冲击”（{S3}）居末。",
  "MCMCシミュレーション（グローバル基準）では、2035年に最も可能性の高い経路は「偏った豊かさ」（{S2}）で、「過大約束の調整」（{S4}）と「共有された豊かさ」（{S1}）が競り合い、「代替ショック」（{S3}）が続く。"],
  ["수치는 §10 모형의 사후예측분포 평균이며 지역·가정을 바꾸면 달라진다. 지표 코딩 자체가 판단이므로 '정밀 확률'이 아니라 '구조화된 판단'으로 읽어야 한다.",
   "Figures are posterior-predictive means from the §10 model and change with region and assumptions. Indicator coding is itself a judgement, so read them as structured judgement, not precise probability.",
   "Цифры — средние апостериорного прогноза модели §10 и меняются с регионом и допущениями. Кодирование индикаторов само по себе суждение, поэтому это структурированная оценка, а не точная вероятность.",
   "数值为§10模型后验预测分布的均值，随地区和假设而变。指标编码本身即是判断，应读作“结构化判断”而非“精确概率”。",
   "数値は§10のモデルの事後予測分布の平均で、地域・仮定を変えると変わる。指標のコーディング自体が判断であるため「精密な確率」ではなく「構造化された判断」として読むべきである。"],"M")
),KJ(
 s("D",[1,43,44,46],["따라서 '노후 저축이 무의미해진다'는 메시지를 개인의 재무 판단 근거로 삼는 것은 위험하다. 풍요의 혜택을 넓히는 것은 저축 중단이 아니라 분배·검증 제도의 설계다.",
  "Treating 'retirement saving will be pointless' as a basis for personal financial decisions is therefore risky. What widens the benefits of abundance is the design of distribution and validation institutions, not stopping saving.",
  "Поэтому опираться на тезис «пенсионные накопления потеряют смысл» в личных финансовых решениях опасно. Выгоды изобилия расширяет не отказ от накоплений, а устройство институтов распределения и проверки.",
  "因此，把“养老储蓄将毫无意义”当作个人理财决策的依据是危险的。扩大丰裕红利的是分配与验证制度的设计，而不是停止储蓄。",
  "したがって「老後の貯蓄は無意味になる」というメッセージを個人の資産判断の根拠にするのは危険である。豊かさの恩恵を広げるのは貯蓄をやめることではなく、分配・検証の制度設計である。"],null,"H"),
 s("D",[30,31,41,42,46],["한국은 세계 최고 수준의 로봇 밀도와 AI 기본법을 갖췄지만 OECD 최고 수준의 노인 빈곤과 연금 재정 압력을 함께 안고 있어, '불균등 풍요' 위험이 가장 큰 나라 중 하나다.",
  "Korea combines the world's highest robot density and an AI Basic Act with the OECD's highest old-age poverty and pension fiscal pressure — making it one of the countries most exposed to 'uneven abundance'.",
  "У Кореи — самая высокая в мире плотность роботов и рамочный закон об ИИ, но одновременно самая высокая в ОЭСР бедность пожилых и давление на пенсионную систему; это одна из стран, наиболее подверженных «неравному изобилию».",
  "韩国拥有全球最高的机器人密度和AI基本法，同时背负OECD最高的老年贫困与养老金财政压力，是“不均衡丰裕”风险最大的国家之一。",
  "韓国は世界最高水準のロボット密度とAI基本法を備える一方、OECD最高水準の高齢者の貧困と年金財政の圧力を抱えており、「偏った豊かさ」のリスクが最も大きい国の一つである。"],null,"M")
)],
[KJ(
 s("D",[9,18,19],["AI·로봇은 지능과 정형 작업의 단가를 낮추지만, 2035년까지 노후 저축이 무의미해질 만큼의 풍요는 기본 시나리오가 아니다.","AI and robots cut the cost of intelligence and routine work, but abundance that makes retirement saving pointless by 2035 is not the baseline.","ИИ и роботы удешевляют интеллект и рутинный труд, но изобилие, обесценивающее пенсионные накопления к 2035 году, — не базовый сценарий.","AI与机器人降低了智能和常规工作的成本，但到2035年让养老储蓄失去意义的丰裕并非基准情景。","AI・ロボットは知能と定型作業の単価を下げるが、2035年までに老後の貯蓄が無意味になるほどの豊かさは基本シナリオではない。"]),
 s("A",[33,36,5],["'3년 내 최고 외과의 능가' 주장은 임상 검증 일정상 실현 가능성이 낮다.","The 'better than the best surgeon in three years' claim is unlikely given clinical-validation timelines.","Тезис «лучше лучшего хирурга за три года» маловероятен с учётом сроков клинической проверки.","鉴于临床验证所需时间，“三年内超越最好的外科医生”难以实现。","「3年以内に最高の外科医を上回る」という主張は臨床検証の日程上、実現可能性が低い。"]),
 s("D",[20,25,26],["풍요는 불균등하게 오며, 돌봄·의료·주택의 상대가격과 청년 일자리 사다리가 핵심 위험이다.","Abundance arrives unevenly; the relative prices of care, medicine and housing, and the youth job ladder, are the core risks.","Изобилие приходит неравномерно; главные риски — относительные цены ухода, медицины и жилья и «лестница» рабочих мест для молодёжи.","丰裕的到来并不均匀；照护、医疗、住房的相对价格与青年就业阶梯是核心风险。","豊かさは偏って訪れ、介護・医療・住宅の相対価格と若者の雇用の梯子が中核的なリスクである。"]),
 s("D",[18,24],["시뮬레이션상 2035년은 '불균등 풍요'({S2})가 가장 유력하다.","In the simulation, 'uneven abundance' ({S2}) is the most likely 2035 outcome.","По симуляции наиболее вероятный исход 2035 года — «неравное изобилие» ({S2}).","模拟显示，2035年最可能的是“不均衡丰裕”（{S2}）。","シミュレーション上、2035年は「偏った豊かさ」（{S2}）が最も有力である。"])
)]);

SEC("frame",["문제 정의와 분석 틀","Problem Definition and Analytical Framework","Постановка задачи и аналитическая рамка","问题界定与分析框架","問題設定と分析枠組み"],
[P(
 s("C",[1,2,3],["이 보고서는 2026년 1월 일론 머스크가 팟캐스트와 다보스 포럼에서 밝힌 세 가지 주장 — AI가 곧 인간을 넘어선다, 옵티머스가 3년 안에 최고 외과의를 능가한다, 10~20년 뒤 노후 저축은 무의미해진다 — 을 검증 가능한 명제로 바꿔 평가한다.",
  "This report turns three claims Elon Musk made on a podcast and at Davos in January 2026 — AI will soon surpass humans, Optimus will beat the best surgeons within three years, and retirement saving will be pointless in 10–20 years — into testable propositions and evaluates them.",
  "Доклад превращает три тезиса, высказанных Илоном Маском в подкасте и в Давосе в январе 2026 года, — ИИ скоро превзойдёт людей, Optimus за три года превзойдёт лучших хирургов, через 10–20 лет пенсионные накопления потеряют смысл — в проверяемые утверждения и оценивает их.",
  "本报告把埃隆·马斯克2026年1月在播客和达沃斯提出的三项主张——AI即将超越人类、Optimus三年内胜过最好的外科医生、10至20年后养老储蓄将无意义——转化为可检验命题并加以评估。",
  "本報告は、イーロン・マスクが2026年1月にポッドキャストとダボス会議で示した三つの主張――AIはまもなく人間を超える、オプティマスは3年以内に最高の外科医を上回る、10〜20年後に老後の貯蓄は無意味になる――を検証可能な命題に置き換えて評価する。"]),
 s("D",[],["핵심 질문은 셋이다: ① 머스크의 시한은 측정된 추세와 얼마나 맞는가, ② AI·로봇이 생산비를 낮추는 효과는 어디까지 실증되었는가, ③ 그 이익은 누구에게 돌아가며 노후 저축은 정말 불필요해지는가.",
  "There are three core questions: (1) how well do Musk's deadlines match measured trends; (2) how far has the cost-lowering effect of AI and robots been demonstrated; (3) who captures the gains, and does retirement saving really become unnecessary?",
  "Ключевых вопросов три: (1) насколько сроки Маска соответствуют измеренным трендам; (2) в какой мере доказан эффект удешевления от ИИ и роботов; (3) кому достаются выгоды и действительно ли пенсионные накопления становятся ненужными?",
  "核心问题有三个：① 马斯克的期限与已测得的趋势有多吻合；② AI与机器人降低生产成本的效果已被证实到什么程度；③ 收益归谁，养老储蓄是否真的变得不必要。",
  "中核の問いは三つである。①マスクの期限は測定された傾向とどれほど合うか、②AI・ロボットが生産コストを下げる効果はどこまで実証されたか、③その利益は誰に帰属し、老後の貯蓄は本当に不要になるのか。"]),
 s("D",[],["분석은 세 개의 잠재 축으로 구성한다: A(AI·로봇 역량의 실현과 확산), I(검증·안전·분배를 감당하는 제도 흡수력), L(노동·소득의 회복력). 여기에 재정·고령화 압력 D가 제도 흡수력의 성장을 깎는다.",
  "The analysis uses three latent axes: A (realisation and diffusion of AI and robot capability), I (institutional absorption — validation, safety and distribution), and L (resilience of labour and incomes). A fiscal and ageing pressure term D drags on the growth of I.",
  "Анализ строится на трёх латентных осях: A (реализация и распространение возможностей ИИ и роботов), I (институциональная способность — проверка, безопасность, распределение) и L (устойчивость труда и доходов). Фискальное и демографическое давление D тормозит рост I.",
  "分析由三条潜在轴构成：A（AI与机器人能力的实现与扩散）、I（承载验证、安全与分配的制度吸收力）、L（劳动与收入的韧性）。财政与老龄化压力D会削弱I的增长。",
  "分析は三つの潜在軸で構成する。A（AI・ロボット能力の実現と普及）、I（検証・安全・分配を担う制度吸収力）、L（労働・所得の回復力）である。これに財政・高齢化圧力Dが制度吸収力の伸びを削る。"]),
 s("D",[19],["'풍요'는 주장이 아니라 관측으로 확인되어야 한다. 노드하우스가 제시한 것처럼 생산성 통계, 가격, 노동소득 비중에서 신호가 나타나는지를 조기경보 지표로 삼는다.",
  "Abundance must be confirmed by observation, not assertion. Following Nordhaus, we use signals in productivity statistics, prices and the labour share as early-warning indicators.",

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const sig=x=>1/(1+Math.exp(-x)), logit=p=>Math.log(p/(1-p));
function runMCMC(opt){
 const o=Object.assign({},DEFAULTS,opt||{}); const reg=REGIONS[o.region||"global"];
 const ind=INDICATORS.map(d=>({ax:d.ax,v:(reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v),s:d.s}));
 const r=mulberry32(o.seed), N=makeNorm(r);

 function lp(th){let s=0;for(let k=0;k<6;k++){const z=(th[k]-pm[k])/ps[k];s-=.5*z*z;}
  const lv={A:sig(th[0]),I:sig(th[1]),L:sig(th[2])};
  for(const d of ind){const z=(d.v-lv[d.ax])/d.s;s-=.5*z*z;}return s;}

 const draws=[], traces=[[],[],[],[]]; let acc=0,tot=0;
 const perChain=[];
 for(let c=0;c<chains;c++){
  let th=[N()*1.2,N()*1.2,N()*1.2,pm[3]+N()*.1,pm[4]+N()*.1,pm[5]+N()*.06], cur=lp(th); const cd=[];
  for(let t=0;t<iters;t++){
   const pr=th.map((x,k)=>x+step[k]*N()); const np=lp(pr);
   if(Math.log(r())<np-cur){th=pr;cur=np;if(t>=burn)acc++;}
   if(t>=burn)tot++;
   if(t%20===0)traces[c].push(sig(th[1]));
   if(t>=burn&&t%thin===0){cd.push(th.slice());draws.push(th.slice());}
  }
  perChain.push(cd);
 }
 // R-hat per param
 const rhat=[];for(let k=0;k<6;k++){const m=perChain.map(cd=>cd.reduce((s,x)=>s+x[k],0)/cd.length);const n=perChain[0].length;

  const mm=m.reduce((a,b)=>a+b,0)/chains;const B=n*m.reduce((s,x)=>s+(x-mm)**2,0)/(chains-1);
  rhat.push(Math.sqrt(((n-1)/n*W+B/n)/W));}
 // posterior predictive 2035
 const Y=9, M=40, kD=o.kappa*reg.D; const probs=[], pts=[], post={A0:[],I0:[],L0:[],A35:[],I35:[],L35:[]};
 const tally=[0,0,0,0];
 for(let d=0;d<draws.length;d++){const th=draws[d];const cnt=[0,0,0,0];
  post.A0.push(sig(th[0]));post.I0.push(sig(th[1]));post.L0.push(sig(th[2]));
  for(let m=0;m<M;m++){
   const A=sig(th[0]+Y*th[3]+o.tau*N()), I=sig(th[1]+Y*(th[4]-kD)+o.tau*N()), L=sig(th[2]+Y*th[5]+o.tau*N());
   let s; if(A<o.thA)s=3; else if(L<o.thL)s=2; else if(I>=o.thI)s=0; else s=1;

}

 <div class="ctrls">${sl("ga",0,.3,.01,"hga")}${sl("gi",-.05,.3,.01,"hgi")}${sl("gl",-.15,.1,.01,"hgl")}${sl("tau",.1,1,.05,"htau")}${sl("thA",.4,.85,.01)}${sl("thL",.3,.75,.01)}${sl("thI",.3,.8,.01)}<div class="ctrl"><div class="diag" id="mcDiag"></div></div></div>

function syncCtrls(){["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);if(!i)return;i.value=mcOpt[k];$("#o-"+k).textContent=(+mcOpt[k]).toFixed(2);});
 $$("#mcReg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===mcOpt.region));}
function drawMC(){syncCtrls();
 ["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);i.oninput=()=>{mcOpt[k]=+i.value;$("#o-"+k).textContent=(+i.value).toFixed(2);};i.onchange=()=>rerun();});
 $$("#mcReg button").forEach(b=>b.onclick=()=>{mcOpt.region=b.dataset.r;rerun();});
 $("#mcRun").onclick=rerun;$("#mcSeed").onclick=()=>{mcOpt.seed=(Math.random()*1e9)|0;rerun();};$("#mcReset").onclick=()=>{mcOpt=Object.assign({region:mcOpt.region},DEFAULTS);rerun();};
 if(MC)paintMC();}
function rerun(){const t0=performance.now();MC=runMCMC(mcOpt);MC.ms=performance.now()-t0;syncCtrls();paintMC();drawSens();}
function paintMC(){if(!MC||!$("#mcBars"))return;const sc=["--s1","--s2","--s3","--s4"],nm=SCEN.map(s=>s.key+" "+T("scs")[s.key]);
 // bars
 {const W=420,rh=40,H=4*rh+24,l=128,X=v=>l+(W-l-50)*v;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-20}"/><text class="tm" x="${X(v)}" y="${H-6}" text-anchor="middle">${v*100}%</text>`);
  MC.mean.forEach((m,k)=>{const y=6+k*rh,c=MC.ci[k];s+=`<text class="tl" x="${l-8}" y="${y+18}" text-anchor="end">${esc(nm[k])}</text>
  <rect x="${X(c[2])}" y="${y+4}" width="${Math.max(2,X(c[3])-X(c[2]))}" height="20" rx="4" fill="var(${sc[k]})" opacity=".35"/><line x1="${X(c[0])}" x2="${X(c[1])}" y1="${y+14}" y2="${y+14}" stroke="var(${sc[k]})" stroke-width="2"/>
  <rect x="${X(m)-2}" y="${y}" width="4" height="28" rx="2" fill="var(${sc[k]})" data-tip="${esc(nm[k])}: <b>${pct(m)}</b><br>50%: ${pct(c[2])}–${pct(c[3])} · 90%: ${pct(c[0])}–${pct(c[1])}"/><text class="tv" x="${Math.min(X(c[1])+6,W-34)}" y="${y+19}">${pct(m)}</text>`;});
  $("#mcBars").innerHTML=s+`</svg>`;}
 // hist small multiples
 {let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;MC.mean.forEach((m,k)=>{const bins=new Array(10).fill(0);MC.probs.forEach(p=>bins[Math.min(9,Math.floor(p[k]*10))]++);const mx=Math.max(...bins);
  let s=`<svg viewBox="0 0 220 90" width="100%"><text class="tl" x="0" y="11">${esc(nm[k])}</text>`;bins.forEach((v,i)=>{const hh=60*v/mx;s+=`<rect x="${4+i*21}" y="${78-hh}" width="19" height="${Math.max(1,hh)}" rx="3" fill="var(${sc[k]})" data-tip="${i*10}–${i*10+10}%: ${(v/MC.probs.length*100).toFixed(1)}%"/>`;});
  s+=`<line class="ax" x1="2" x2="216" y1="78" y2="78"/><text class="tm" x="4" y="89">0%</text><text class="tm" x="214" y="89" text-anchor="end">100%</text></svg>`;h+=s;});$("#mcHist").innerHTML=h+`</div>`;}
 // scatter
 {const W=440,H=290,l=36,b=30,t=8,r=10,X=v=>l+(W-l-r)*v,Y=v=>t+(H-t-b)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,.25,.5,.75,1].forEach(v=>s+=`<text class="tm" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text><text class="tm" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  MC.pts.slice(0,1400).forEach(p=>s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6" fill="var(${sc[p[3]]})" opacity=".55"/>`);
  s+=`<line x1="${X(MC.opt.thA)}" x2="${X(MC.opt.thA)}" y1="${t}" y2="${H-b}" stroke="var(--text-2)" stroke-dasharray="4 3"/><line x1="${X(MC.opt.thA)}" x2="${W-r}" y1="${Y(MC.opt.thI)}" y2="${Y(MC.opt.thI)}" stroke="var(--text-2)" stroke-dasharray="4 3"/>
  <text class="tm" x="${X(.01)}" y="${Y(.97)}">S4 ← θA</text><text class="tm" x="${W-r-4}" y="${Y(MC.opt.thI)-6}" text-anchor="end">θI ↑ S1 · ↓ S2 (S3: L&lt;θL)</text>
  <text class="tl" x="${(l+W)/2}" y="${H}" text-anchor="middle">A 2035</text><text class="tl" transform="translate(10 ${H/2}) rotate(-90)" text-anchor="middle">I 2035</text></svg>`;
  $("#mcSc").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s;}
 // trace
 {const W=440,H=110,l=30;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const tc=["--s1","--s2","--s3","--s4"];const n=MC.traces[0].length;
  [.2,.4,.6].forEach(v=>s+=`<line class="grid" x1="${l}" x2="${W}" y1="${H-10-(H-20)*v}" y2="${H-10-(H-20)*v}"/><text class="tm" x="${l-4}" y="${H-6-(H-20)*v}" text-anchor="end">${v}</text>`);
  MC.traces.forEach((tr,c)=>{s+=`<polyline fill="none" stroke="var(${tc[c]})" stroke-width="1" opacity=".8" points="${tr.map((v,i)=>(l+(W-l)*i/n).toFixed(1)+","+(H-10-(H-20)*v).toFixed(1)).join(" ")}"/>`;});
  const bx=l+(W-l)*(4000/14000);s+=`<line x1="${bx}" x2="${bx}" y1="0" y2="${H-10}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="tm" x="${bx+4}" y="10">burn-in</text></svg>`;$("#mcTr").innerHTML=s;}
 const rh=Math.max(...MC.rhat);$("#mcDiag").innerHTML=`<span>${T("rhat")} <b class="${rh<1.05?"ok":"warn"}">${rh.toFixed(3)}</b></span><span>${T("acc")} <b>${(MC.acc*100).toFixed(0)}%</b></span><span>${T("draws")} <b>${MC.n.toLocaleString()}</b></span><span>${T("time")} <b>${(MC.ms||0).toFixed(0)}ms</b></span><span>seed <b>${MC.opt.seed}</b></span>`;
 // regions
 if(ALLREG){const W=440,rh=30,H=4*rh+6,l=60;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;Object.keys(ALLREG).forEach((r,i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+16}" text-anchor="end">${X(REGIONS[r])}</text>`;
  ALLREG[r].mean.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="22" rx="4" fill="var(${sc[k]})" data-tip="${X(REGIONS[r])} · ${esc(nm[k])}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+15}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
  $("#mcRegs").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s+`</svg>`;}
 // indicators
 {const reg=REGIONS[MC.region];$("#mcInd").innerHTML=`<div class="tblwrap"><table class="t"><thead><tr><th>${T("indAx")}</th><th>${T("indH")}</th><th>${T("indV")}</th><th>${T("indS")}</th><th>${T("indE")}</th></tr></thead><tbody>`+
  INDICATORS.map(d=>{const v=reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v;return `<tr><td>${d.ax}</td><td>${esc(d[st.lang]||d.en||d.ko)}</td><td>${v.toFixed(2)}${reg.ov[d.k]!==undefined?" *":""}</td><td>${d.s.toFixed(2)}</td><td>${refB(d.refs)}</td></tr>`}).join("")+
  `<tr><td>D</td><td>${esc(T("demoInd"))}</td><td>${reg.D.toFixed(2)}</td><td>—</td><td>${refB(DREFS)}</td></tr></tbody></table></div><div class="fsub" style="font-size:11.5px;color:var(--muted)">* ${esc(T("regAdj"))} · Prior: logit level ~ N(0,1.5); g_A ~ N(${MC.opt.ga},${MC.opt.gaSd}); g_I ~ N(${MC.opt.gi},0.08); g_L ~ N(${MC.opt.gl},0.05); κ=${MC.opt.kappa}; X₂₀₃₅ = σ(logit X₀ + 9·g + τ·ε)</div>`;
  $$("#mcInd .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}
}


// ---------- sensitivity analysis ----------
let SENS=null,SENSREG=null,sensBusy=false;
const SENS_P=[["ga",.05,"g_A"],["gi",.05,"g_I"],["gl",.03,"g_L"],["tau",.15,"τ"],["thA",.05,"θA"],["thL",.05,"θL"],["thI",.05,"θI"]];
function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}
function drawSens(){const el=$("#sensW");if(!el)return;const reg=(MC&&MC.region)||"global";
 if(!SENS||SENSREG!==reg){el.innerHTML=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensRun"))}</div>`;if(MCG)computeSens(reg,()=>drawSens());return;}
 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));
 const cell=x=>{const a=Math.round(Math.min(1,Math.abs(x)/mx)*70);return `<td class="cell" style="background:color-mix(in srgb,var(${x>=0?"--pos":"--neg"}) ${a}%,var(--surface));color:${a>45?"#fff":"var(--text)"}" data-tip="${x>=0?"+":""}${x.toFixed(1)} pp">${x>=0?"+":""}${x.toFixed(1)}</td>`;};
 let h=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensS"))} · ${esc(X(REGIONS[reg]))}</div><div class="tblwrap"><table class="t hm"><thead><tr><th>${esc(T("sensP"))}</th>${SCEN.map(s=>`<th style="text-align:center">Δ${s.key}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

// ---------- persona panel ----------
function pools(){const n=PERSONAS.length;const lin=[0,1,2,3].map(k=>PERSONAS.reduce((s,p)=>s+p.p[k],0)/n);
 let lg=[0,1,2,3].map(k=>Math.exp(PERSONAS.reduce((s,p)=>s+Math.log(p.p[k]),0)/n));const z=lg.reduce((a,b)=>a+b);lg=lg.map(x=>x/z);
 const kl=(p,q)=>p.reduce((s,x,i)=>s+(x>0?x*Math.log(x/q[i]):0),0);const js=PERSONAS.reduce((s,p)=>{const m=p.p.map((x,i)=>(x+lin[i])/2);return s+.5*kl(p.p,m)+.5*kl(lin,m);},0)/n;
 const mc=MCG?MCG.mean:[.25,.25,.25,.25];const bl=mc.map((x,i)=>(x+lin[i])/2);return{lin,lg,js,mc,bl};}
function drawPanel(){const el=$("#panelW");const sc=["--s1","--s2","--s3","--s4"];const L=st.lang;const PL=p=>p[L]||p.en;
 let h=`<div class="wrow"><div class="panelc"><h5>${T("pHeat")}</h5><div class="tblwrap"><table class="t hm"><thead><tr><th>${T("persona")}</th>${SCEN.map(s=>`<th style="text-align:center">${s.key}</th>`).join("")}</tr></thead><tbody>`;
 PERSONAS.forEach((p,i)=>{h+=`<tr data-p="${i}" class="${i===selP?"sel":""}"><td class="pn">${esc(PL(p).n)}<div style="font-weight:400;font-size:11px;color:var(--muted)">${esc(PL(p).r)}</div></td>`+p.p.map((v,k)=>`<td class="cell" style="background:color-mix(in srgb,var(${sc[k]}) ${Math.round(v*100*1.3)}%,var(--surface));color:${v>.4?"#fff":"var(--text)"}" data-tip="${esc(PL(p).n)} · ${SCEN[k].key}: <b>${pct(v)}</b>">${pct(v)}</td>`).join("")+`</tr>`;});
 h+=`</tbody></table></div></div><div class="panelc"><h5>${T("pAgg")}</h5><div id="pAgg"></div><div class="persona-detail" id="pDet"></div></div></div>`;
 el.innerHTML=h;$$("#panelW tr[data-p]").forEach(tr=>tr.onclick=()=>{selP=+tr.dataset.p;drawPanel();});paintAgg();paintPDet();}
function paintAgg(){const P=pools();const sc=["--s1","--s2","--s3","--s4"];const rows=[[T("mc"),P.mc],[T("lin"),P.lin],[T("logp"),P.lg],[T("blend"),P.bl]];
 const W=440,rh=34,l=150,H=rows.length*rh+6;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 rows.forEach(([n,v],i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+17}" text-anchor="end">${esc(n)}</text>`;v.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="24" rx="4" fill="var(${sc[k]})" data-tip="${esc(n)} · ${SCEN[k].key}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+16}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
 $("#pAgg").innerHTML=leg(SCEN.map((s,k)=>[`var(${sc[k]})`,s.key+" "+T("sc")[s.key]]))+s+`</svg><div class="diag" style="margin-top:4px"><span>${T("dis")} <b>${P.js.toFixed(3)}</b></span></div>`;}
function paintPDet(){const p=PERSONAS[selP],d=p[st.lang]||p.en;$("#pDet").innerHTML=`<b>${esc(d.n)}</b> <span class="rl">· ${esc(d.r)}</span>
 <div class="pgrid"><div><b>${T("pLens")}</b>${esc(d.lens)}</div><div><b>${T("pSig")}</b>${esc(d.sig)}</div><div style="grid-column:1/-1"><b>${T("pView")}</b>${esc(d.v)}</div><div style="grid-column:1/-1"><b>${T("pMove")}</b>${esc(d.mv)}</div></div>
 <div style="margin-top:6px;font-size:12px"><span class="g D" style="vertical-align:0">D</span> ${refB(p.refs)}</div>`;
 $$("#pDet .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}

// ---------- chrome / events ----------
function updateTocActive(){const secs=$$("section.sec");let cur=null;const y=window.scrollY+120;secs.forEach(s=>{if(s.offsetTop<=y)cur=s.id.slice(4);});
 $$("#toc a").forEach(a=>a.classList.toggle("on",a.dataset.sec===cur));

$$("#langSeg button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;LS.set("rp_lang_manual",st.lang);keepPos(render);});

$("#tocbtn").onclick=()=>$("#toc").classList.toggle("mob");
$("#toc").addEventListener("click",e=>{if(e.target.closest("a"))$("#toc").classList.remove("mob");});

// boot: run global default MCMC (fixed seed) so numbers in text are reproducible
render();
if(autoLang)setTimeout(()=>toast(T("langAuto")+" · "+I18N[st.lang].langName),600);
setTimeout(()=>{const t0=performance.now();MCG=runMCMC({region:"global"});MCG.ms=performance.now()-t0;MC=MCG;
 ALLREG={};Object.keys(REGIONS).forEach(r=>{ALLREG[r]=r==="global"?MCG:runMCMC({region:r});});render();},30);
})();
