<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI·로봇과 풍요의 미래 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}

/* mobile: keep panel tables and reference filters inside the viewport */
.panelc{min-width:0;overflow-x:auto}.reff .seg{flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar"><button class="iconbtn" id="tocbtn">목차</button><div class="brand" id="brand"></div>
<div class="seg" id="langSeg"></div>
<div class="seg"><button id="bDetail">상세판</button><button id="bConcise">간결판</button></div>
<button class="iconbtn" id="bG" aria-pressed="false">등급</button><button class="iconbtn" id="bTheme">☾</button><button class="iconbtn" id="bPrint">PDF</button>
<div class="progress" id="prog"></div></div>

 "2019年テスラ「オートノミー・デー」の報道である。マスクは翌年に100万台超のロボタクシーを予告しつつ「いつも時間通りではない」と自認した。2020年にその規模のロボタクシーは現れなかった。"],
["머스크의 기술 시한 예측은 방향은 맞더라도 시점이 크게 늦어지는 경향이 있다는 '기저율' 근거로 사용한다. 시뮬레이션에서 시한 할인의 근거가 된다.",
 "Used as base-rate evidence that Musk's technology deadlines tend to be right in direction but late by a wide margin; it underpins the deadline discount in our simulation.",
 "Используем как базовую частоту: технологические сроки Маска обычно верны по направлению, но сильно запаздывают; это основание для «дисконта сроков» в нашей симуляции.",
 "作为“基准率”依据：马斯克的技术时间表往往方向正确但大幅延迟。这是模拟中对期限打折的依据。",
 "マスクの技術的期限の予測は方向は正しくても時期が大きく遅れる傾向がある、という「基準率」の根拠として用いる。シミュレーションでの期限割引の根拠となる。"]);

E(9,"B","io",2025,"Stanford HAI, AI Index Steering Committee","The 2025 AI Index Report","https://hai.stanford.edu/ai-index/2025-ai-index-report",
"dropped over 280-fold between November 2022 and October 2024",
["다수 데이터를 집계한 공신력 있는 연례 보고서다. 다만 비용 하락은 'GPT-3.5 수준'이라는 고정 성능 기준의 추론 비용이며, 최첨단 모델의 학습·운영 총비용은 오히려 커지고 있다. 같은 보고서는 복잡한 추론이 여전히 과제라고 적었다.",
 "An authoritative annual compilation. But the cost drop is inference cost at a fixed GPT-3.5-level capability; total training and operating costs of frontier models are rising. The same report notes that complex reasoning remains a challenge.",
 "Авторитетный ежегодный свод данных. Но падение цены относится к стоимости вывода при фиксированном уровне GPT-3.5; совокупные затраты на обучение и эксплуатацию передовых моделей растут. Тот же доклад отмечает, что сложные рассуждения остаются проблемой.",
 "汇总大量数据的权威年度报告。但成本下降指的是固定在GPT-3.5水平的推理成本，前沿模型的训练与运营总成本反而在上升。同一报告指出复杂推理仍是难题。",
 "多数のデータを集計した権威ある年次報告書である。ただしコスト低下は「GPT-3.5水準」という固定性能での推論コストであり、最先端モデルの学習・運用の総コストはむしろ増えている。同報告は複雑な推論が依然として課題だと記す。"],
["'지능의 단가'가 급락한다는 풍요 서사의 핵심 전제는 디지털 영역에서 강하게 지지된다. 이것이 A축(역량 실현) 현재값을 높게 두는 근거다.",
 "The key premise of the abundance story — that the unit price of intelligence is collapsing — is strongly supported in the digital domain. This is why the current value of axis A (capability realisation) is set high.",
 "Ключевая предпосылка нарратива изобилия — обвал «цены единицы интеллекта» — в цифровой сфере подтверждается сильно. Поэтому текущее значение оси A (реализация возможностей) задано высоким.",
 "丰裕叙事的核心前提——“智能单价”暴跌——在数字领域得到有力支持。这是将A轴（能力实现）当前值设高的依据。",
 "「知能の単価」が急落するという豊かさの物語の中核前提は、デジタル領域では強く支持される。これがA軸（能力実現）の現在値を高く置く根拠である。"]);

E(10,"B","io",2025,"Kwa, West et al. (METR), NeurIPS 2025","Measuring AI Ability to Complete Long Software Tasks","https://arxiv.org/abs/2503.14499",
"frontier AI time horizon has been doubling approximately every seven months since 2019",
["소프트웨어 과제에 한정된 측정이며, '50% 성공 기준 과제 길이'는 실제 업무가 요구하는 신뢰도(99% 이상)와 다르다. 저자들도 2024년 가속 가능성을 언급하는 등 추세 외삽의 불확실성이 크다.",
 "Measured only on software tasks, and a '50% success time horizon' differs from the reliability real work demands (99%+). The authors themselves flag a possible 2024 acceleration, so extrapolation is highly uncertain.",
 "Измерено только на программных задачах, а «горизонт при 50% успеха» далёк от надёжности, которой требует реальная работа (99%+). Авторы сами отмечают возможное ускорение в 2024 году, так что экстраполяция крайне неопределённа.",
 "仅以软件任务测量，“50%成功率的任务时长”与实际工作所需的可靠性（99%以上）不同。作者自己也提到2024年可能加速，外推的不确定性很大。",
 "ソフトウェア課題に限定した測定であり、「50%成功基準の課題時間」は実務が求める信頼性（99%以上）とは異なる。著者自身も2024年の加速の可能性に触れており、外挿の不確実性は大きい。"],
["디지털 업무 자동화 '속도'에 관한 가장 정량적인 근거로 채택한다. 7개월 배증이 유지되면 '2027년 말 디지털 업무 대부분'이라는 주장도 일부 영역에서는 근접할 수 있다.",
 "Adopted as the most quantitative evidence on the speed of digital-work automation. If seven-month doubling holds, the claim of 'most digital work by end-2027' could be approached in some domains.",
 "Принимаем как самое количественное свидетельство о скорости автоматизации цифрового труда. Если удвоение за семь месяцев сохранится, тезис «большая часть цифровой работы к концу 2027 года» в отдельных областях может приблизиться к реальности.",
 "作为数字工作自动化“速度”最量化的依据采用。若七个月翻倍持续，“2027年底胜任多数数字工作”在部分领域可能接近实现。",
 "デジタル業務自動化の「速度」に関する最も定量的な根拠として採用する。7か月倍増が続けば「2027年末にデジタル業務の大半」という主張も一部領域では近づき得る。"]);

E(11,"B","io",2025,"Becker, Rush, Barnes, Rein (METR), arXiv preprint","Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity","https://arxiv.org/abs/2507.09089",
"allowing AI actually increases completion time by 19%",
["숙련 개발자 16명·과제 246개의 무작위 실험으로 표본은 작지만 설계가 엄밀하다. 개발자들은 사전에 24% 단축을 예상했고, 실험 후에도 20% 빨라졌다고 착각했다.",
 "A randomised experiment with 16 experienced developers and 246 tasks — small but rigorous. Developers expected a 24% speed-up beforehand and still believed they had been 20% faster afterwards.",
 "Рандомизированный эксперимент: 16 опытных разработчиков, 246 задач — выборка мала, но дизайн строгий. Разработчики заранее ждали ускорения на 24% и даже после эксперимента считали, что стали быстрее на 20%.",
 "16名资深开发者、246项任务的随机实验，样本小但设计严谨。开发者事前预计提速24%，事后仍误以为快了20%。",
 "熟練開発者16人・課題246件の無作為化実験で、標本は小さいが設計は厳密である。開発者は事前に24%短縮を予想し、実験後も20%速くなったと錯覚していた。"],
["벤치마크 성능과 실제 현장 생산성 사이에 큰 간극이 있다는 핵심 반증 근거다. '체감 생산성'에 기댄 전망은 과대평가될 위험이 크다.",
 "Key disconfirming evidence: there is a wide gap between benchmark performance and real-world productivity. Forecasts that rely on perceived productivity risk large overestimation.",
 "Ключевое опровергающее свидетельство: между результатами бенчмарков и реальной производительностью большой разрыв. Прогнозы, опирающиеся на ощущаемую производительность, рискуют сильно завышать эффект.",
 "关键的反证：基准成绩与真实生产率之间差距很大。依赖“体感生产率”的预测有严重高估的风险。",
 "ベンチマーク性能と実際の現場の生産性の間に大きな隔たりがあることを示す中核的な反証である。「体感生産性」に頼る見通しは過大評価の危険が大きい。"]);

E(12,"B","io",2024,"Sevilla & Roldán (Epoch AI)","Training compute of frontier AI models grows by 4-5x per year","https://epoch.ai/blog/training-compute-of-frontier-ai-models-grows-by-4-5x-per-year",
"best described as increasing by a factor of 4-5x/year",
["공개 모델 데이터베이스 기반의 추정으로 비공개 모델은 누락될 수 있다. 연산 투입 증가가 곧바로 능력 증가를 뜻하지는 않는다.",
 "Estimated from a database of public models, so undisclosed models may be missing. More compute does not automatically mean more capability.",
 "Оценка по базе публичных моделей, закрытые модели могут не учитываться. Рост вычислений сам по себе не означает роста возможностей.",
 "基于公开模型数据库的估计，未公开模型可能遗漏。算力投入增加并不直接等于能力提升。",
 "公開モデルのデータベースに基づく推計で、非公開モデルは漏れ得る。計算投入の増加がそのまま能力向上を意味するわけではない。"],
["역량 상승의 '투입'이 지수적으로 늘고 있음을 보여주며, 동시에 전력·자본 제약(근거 14)이 병목이 될 것임을 시사한다.",
 "Shows that the input behind capability gains is growing exponentially — and implies that power and capital constraints (evidence 14) will become the bottleneck.",
 "Показывает экспоненциальный рост «входа» для роста возможностей и одновременно указывает, что узким местом станут энергия и капитал (свидетельство 14).",
 "显示能力提升的“投入”在指数级增长，同时意味着电力与资本约束（依据14）将成为瓶颈。",
 "能力向上の「投入」が指数的に増えていることを示し、同時に電力・資本の制約（根拠14）がボトルネックになることを示唆する。"]);

E(13,"B","survey",2025,"Grace et al., Journal of Artificial Intelligence Research 84 (2025)","Thousands of AI Authors on the Future of AI","https://arxiv.org/abs/2401.02843",
"estimated at 10% by 2027, and 50% by 2047",
["AI 연구자 2,778명 설문으로 규모는 크지만, 응답은 질문 문구에 민감하고 전문가 예측의 정확도 자체가 검증되지 않았다. 모든 직업의 완전 자동화 중위 시점은 2116년으로 훨씬 늦다.",
 "A large survey of 2,778 AI researchers, but answers are sensitive to question wording and expert forecasting accuracy is itself unvalidated. The median for full automation of all occupations is far later, 2116.",
 "Крупный опрос 2 778 исследователей ИИ, но ответы чувствительны к формулировкам, а точность экспертных прогнозов сама не проверена. Медиана полной автоматизации всех профессий намного позже — 2116 год.",
 "对2,778名AI研究者的大规模调查，但回答对题目措辞敏感，专家预测的准确性本身也未经验证。所有职业完全自动化的中位年份要晚得多，为2116年。",
 "AI研究者2,778人の大規模調査だが、回答は設問の文言に敏感で、専門家予測の精度自体も検証されていない。全職業の完全自動化の中央値は2116年とはるかに遅い。"],
["머스크의 2026~27년 시한은 연구자 분포의 '하위 10% 꼬리'에 해당한다. 가능성은 배제하지 않되 기본 시나리오로 삼지 않는다.",
 "Musk's 2026–27 deadline sits in the earliest 10% tail of researchers' forecasts. We do not rule it out, but it is not our baseline.",
 "Срок Маска 2026–27 попадает в ранний «хвост 10%» распределения прогнозов исследователей. Мы его не исключаем, но не берём за базовый сценарий.",
 "马斯克的2026–27年期限落在研究者预测分布最早的10%尾部。我们不排除其可能，但不作为基准情景。",
 "マスクの2026〜27年という期限は研究者の分布の「早い側10%の裾」に当たる。可能性は排除しないが基本シナリオにはしない。"]);

E(14,"B","io",2025,"International Energy Agency (IEA)","Energy and AI — Executive summary","https://www.iea.org/reports/energy-and-ai/executive-summary",
"set to more than double to around 945 TWh by 2030",
["국제기구의 시나리오 추계로, 2035년 범위가 700~1,700TWh로 넓다. 효율 개선 속도에 따라 결과가 크게 달라진다. 2024년 데이터센터 소비는 약 415TWh였다.",
 "A scenario projection by an international agency; the 2035 range is wide, 700–1,700 TWh, and depends heavily on efficiency gains. Data centres used about 415 TWh in 2024.",
 "Сценарный прогноз международного агентства; диапазон на 2035 год широк — 700–1 700 ТВт·ч — и сильно зависит от роста эффективности. В 2024 году дата-центры потребили около 415 ТВт·ч.",
 "国际机构的情景预测，2035年区间宽达700–1,700太瓦时，结果高度依赖能效提升。2024年数据中心用电约415太瓦时。",
 "国際機関のシナリオ推計で、2035年の範囲は700〜1,700TWhと広く、効率改善の速度で大きく変わる。2024年のデータセンター消費は約415TWhだった。"],
["'풍요'는 연산만이 아니라 전력·전력망이라는 물리적 제약을 통과해야 한다. 에너지 공급 확대는 S1(공유된 풍요) 경로의 필요조건이다.",
 "Abundance must pass through the physical constraints of power and grids, not just compute. Expanding energy supply is a necessary condition for the S1 (shared abundance) path.",
 "Изобилию предстоит пройти через физические ограничения энергии и сетей, а не только вычислений. Расширение энергоснабжения — необходимое условие пути S1 (общее изобилие).",
 "“丰裕”不仅要过算力关，还要过电力和电网这一物理约束。扩大能源供给是S1（共享丰裕）路径的必要条件。",
 "「豊かさ」は計算だけでなく電力・送電網という物理的制約を通過しなければならない。エネルギー供給の拡大はS1（共有された豊かさ）経路の必要条件である。"]);

E(15,"A","q1",2025,"Brynjolfsson, Li, Raymond — Quarterly Journal of Economics 140(2) (NBER w31161)","Generative AI at Work","https://www.nber.org/papers/w31161",
"including a 34% improvement for novice and low-skilled workers",
["상담원 5,179명에게 단계적으로 도입된 사례를 이용한 현장 자료로 인과 식별이 강하다. 다만 단일 기업·단일 직무이며, 워킹페이퍼 수치(평균 +14%)와 게재본 수치가 약간 다를 수 있다.",
 "Field data from a staggered rollout to 5,179 support agents, giving strong causal identification. But it is one firm and one job, and the working-paper figure (+14% on average) may differ slightly from the published version.",
 "Полевые данные о поэтапном внедрении у 5 179 операторов поддержки — сильная причинная идентификация. Но это одна компания и одна профессия, а цифра рабочей версии (+14% в среднем) может немного отличаться от опубликованной.",
 "利用对5,179名客服坐席分阶段推行的现场数据，因果识别较强。但只涉及一家企业、一种岗位，工作论文中的数字（平均+14%）与正式发表版本可能略有差异。",
 "相談員5,179人への段階的導入を利用した現場データで因果識別は強い。ただし単一企業・単一職務であり、ワーキングペーパーの数値（平均+14%）と掲載版の数値は若干異なり得る。"],
["AI가 숙련 격차를 줄이는 방향으로 작동할 수 있다는 A급 근거다. '풍요'의 미시적 기반은 실재한다고 판단한다.",
 "Grade-A evidence that AI can narrow skill gaps. We judge that the micro-level foundation for 'abundance' is real.",
 "Свидетельство класса A: ИИ может сокращать разрыв в квалификации. Мы считаем, что микрооснова «изобилия» реальна.",
 "A级证据表明AI可缩小技能差距。我们判断“丰裕”的微观基础是真实存在的。",
 "AIが熟練格差を縮める方向に働き得ることを示すA級の根拠である。「豊かさ」のミクロな基盤は実在すると判断する。"]);

E(16,"A","q1",2023,"Noy & Zhang — Science 381(6654)","Experimental evidence on the productivity effects of generative artificial intelligence","https://doi.org/10.1126/science.adh2586",
"The average time taken decreased by 40% and output quality rose by 18%.",
["사전등록된 온라인 실험(대졸 전문직 453명)으로 내적 타당도가 높다. 그러나 짧고 정형화된 글쓰기 과제여서 실제 업무 전체로 일반화하기 어렵다.",
 "A preregistered online experiment with 453 college-educated professionals — high internal validity. But the tasks were short, structured writing assignments, hard to generalise to whole jobs.",
 "Предрегистрированный онлайн-эксперимент с 453 специалистами с высшим образованием — высокая внутренняя валидность. Но задания были короткими структурированными текстами, их трудно обобщить на работу в целом.",
 "预注册的在线实验（453名大学学历专业人士），内部效度高。但任务是简短、格式化的写作，难以推广到整份工作。",
 "事前登録されたオンライン実験（大卒の専門職453人）で内的妥当性は高い。しかし短く定型的な文章課題であり、実際の業務全体への一般化は難しい。"],
["정형화된 지식노동에서 큰 시간 절감은 확실하다. 다만 근거 11과 함께 보면 효과는 과제 구조에 강하게 의존한다.",
 "Large time savings in structured knowledge work are solid. Read with evidence 11, though, the effect depends heavily on how the task is structured.",
 "Крупная экономия времени в структурированном интеллектуальном труде несомненна. Но вместе со свидетельством 11 видно: эффект сильно зависит от структуры задачи.",
 "在格式化的知识劳动中节省大量时间是确定的。但结合依据11来看，效果高度依赖任务结构。",
 "定型的な知識労働で大きな時間短縮があることは確実である。ただし根拠11と併せて見ると、効果は課題の構造に強く依存する。"]);

E(17,"B","io",2023,"Peng, Kalliamvakou, Cihon, Demirer — arXiv preprint","The Impact of AI on Developer Productivity: Evidence from GitHub Copilot","https://arxiv.org/abs/2302.06590",
"completed the task 55.8% faster than the control group",
["통제 실험이지만 단일 과제(자바스크립트 HTTP 서버 구현)이고, 저자 일부가 도구 제공사(GitHub·마이크로소프트) 소속이다.",
 "A controlled experiment, but on a single task (building an HTTP server in JavaScript), and some authors work for the tool's maker (GitHub/Microsoft).",
 "Контролируемый эксперимент, но на одной задаче (HTTP-сервер на JavaScript), и часть авторов работает у производителя инструмента (GitHub/Microsoft).",
 "属于对照实验，但只有单一任务（用JavaScript实现HTTP服务器），且部分作者来自工具提供方（GitHub/微软）。",
 "統制実験だが単一課題（JavaScriptでHTTPサーバーを実装）であり、著者の一部はツール提供企業（GitHub・マイクロソフト）所属である。"],
["단순·명확한 과제에서는 효과가 매우 크다. 근거 11(숙련자의 실제 저장소에서 −19%)과의 대비가 '과제 복잡도'의 결정적 역할을 보여준다.",
 "Effects are very large on simple, well-specified tasks. The contrast with evidence 11 (−19% on experts' real repositories) shows how decisive task complexity is.",
 "На простых и чётко заданных задачах эффект очень велик. Контраст со свидетельством 11 (−19% в реальных репозиториях экспертов) показывает решающую роль сложности задачи.",
 "在简单、明确的任务上效果非常大。与依据11（资深者真实代码库中−19%）的对比显示“任务复杂度”起决定作用。",
 "単純・明確な課題では効果が非常に大きい。根拠11（熟練者の実リポジトリで−19%）との対比が「課題の複雑さ」の決定的な役割を示す。"]);

E(18,"A","q1",2025,"Acemoglu — Economic Policy 40(121)","The simple macroeconomics of AI","https://doi.org/10.1093/epolic/eiae042",
"no more than a 0.66% increase in total factor productivity (TFP) over 10 years",
["과업 기반 거시모형으로, 노출 과업 비중·비용 절감률 등 입력값이 기존 연구에 의존한다. 신약·신소재 발견 같은 능력 도약은 반영되지 않아 하한 추정에 가깝다는 비판이 있다.",
 "A task-based macro model whose inputs (share of exposed tasks, cost savings) come from earlier studies. It omits leaps such as new drugs or materials discovery, so critics see it as close to a lower bound.",
 "Макромодель на основе задач; входные параметры (доля затронутых задач, экономия затрат) взяты из прежних исследований. Скачки вроде открытия лекарств и материалов не учтены, поэтому критики считают оценку близкой к нижней границе.",
 "基于任务的宏观模型，暴露任务占比、成本节约率等输入来自既有研究。未纳入新药、新材料发现等能力跃升，因此有批评认为它接近下限估计。",
 "タスクベースのマクロモデルで、露出タスクの比率やコスト削減率などの入力は既存研究に依存する。新薬・新素材の発見のような能力の飛躍は反映されず、下限推計に近いとの批判がある。"],
["향후 10년 거시 생산성 효과는 '혁명'보다 '점진'일 가능성이 높다. 2035년까지 생산비가 전반적으로 붕괴할 정도의 풍요는 기본 시나리오가 아니다.",
 "Over the next decade, macro productivity effects are more likely incremental than revolutionary. Abundance on the scale of a general collapse in production costs by 2035 is not the baseline.",
 "В ближайшее десятилетие макроэффект на производительность скорее постепенный, чем революционный. Изобилие масштаба общего обвала издержек к 2035 году — не базовый сценарий.",
 "未来十年的宏观生产率效应更可能是“渐进”而非“革命”。到2035年生产成本普遍崩塌式下降的丰裕并非基准情景。",
 "今後10年のマクロ生産性効果は「革命」より「漸進」の可能性が高い。2035年までに生産コストが全般的に崩れるほどの豊かさは基本シナリオではない。"]);

E(19,"A","q1",2021,"Nordhaus — American Economic Journal: Macroeconomics 13(1) (NBER w21547)","Are We Approaching an Economic Singularity? Information Technology and the Future of Economic Growth","https://www.nber.org/papers/w21547",
"The tests suggest that the Singularity is not near.",
["생성형 AI 이전의 자료를 쓴 검정이라 최신 상황을 반영하지 못한다. 그러나 특이점이 오면 나타나야 할 거시 신호(자본 비중 상승, 가격 하락 등)를 명시했다는 점에서 지금도 유효한 판별 틀이다.",
 "The tests use pre-generative-AI data and cannot reflect the latest developments. But by specifying which macro signals (rising capital share, falling prices, etc.) a singularity should produce, it remains a valid diagnostic frame.",
 "Тесты используют данные до появления генеративного ИИ и не отражают последних событий. Но статья задаёт макросигналы сингулярности (рост доли капитала, падение цен и т. п.), поэтому остаётся рабочей диагностической рамкой.",
 "检验使用的是生成式AI出现之前的数据，无法反映最新情况。但它明确了奇点来临时应出现的宏观信号（资本份额上升、价格下降等），至今仍是有效的判别框架。",
 "生成AI以前のデータを使った検定で、最新の状況は反映していない。しかし特異点が来れば現れるはずのマクロ信号（資本分配率の上昇、価格の下落など）を明示した点で、今も有効な判別の枠組みである。"],
["본 보고서는 이 검정 지표를 조기경보 틀에 차용한다. 풍요 주장은 생산성 통계와 노동소득 비중에서 확인되어야 한다.",
 "We borrow these test indicators for our early-warning frame: claims of abundance must show up in productivity statistics and the labour share.",
 "Мы заимствуем эти тестовые индикаторы для системы раннего предупреждения: изобилие должно проявиться в статистике производительности и доле труда.",
 "本报告把这些检验指标借用到预警框架中：丰裕之说必须在生产率统计和劳动收入份额中得到印证。",
 "本報告はこの検定指標を早期警戒の枠組みに借用する。豊かさの主張は生産性統計と労働分配率で確認されなければならない。"]);

E(20,"B","io",2017,"Aghion, Jones, Jones — NBER w23928 (book chapter, 2019)","Artificial Intelligence and Economic Growth","https://www.nber.org/papers/w23928",
"growth may be constrained not by what we are good at",
["이론 모형 연구로 실증 근거는 아니다. 하지만 보몰의 '비용병' 논리를 AI에 적용해, 자동화가 어려운 필수 부문이 성장을 제약한다는 메커니즘을 제시한다.",
 "A theoretical paper, not empirical evidence. But it applies Baumol's 'cost disease' to AI, offering a mechanism in which essential, hard-to-automate sectors constrain growth.",
 "Теоретическая работа, а не эмпирика. Но она применяет к ИИ «болезнь издержек» Баумоля и предлагает механизм, при котором рост ограничивают необходимые и трудно автоматизируемые сектора.",
 "理论模型研究，不是实证证据。但它把鲍莫尔“成本病”逻辑用于AI，提出难以自动化的必需部门会制约增长的机制。",
 "理論モデル研究であり実証的根拠ではない。だがボーモルの「コスト病」の論理をAIに適用し、自動化が難しい必需部門が成長を制約するというメカニズムを示す。"],
["AI가 복제 가능한 재화는 싸게 만들어도 돌봄·의료·토지처럼 자동화가 어렵거나 공급이 고정된 항목의 상대가격은 오를 수 있다. 노후 저축의 필요는 바로 이 항목들에서 나온다.",
 "Even if AI makes replicable goods cheap, the relative price of hard-to-automate or fixed-supply items — care, medicine, land — can rise. That is exactly where the need for retirement savings comes from.",
 "Даже если ИИ удешевит воспроизводимые товары, относительная цена трудноавтоматизируемых или ограниченных благ — ухода, медицины, земли — может вырасти. Именно отсюда и берётся потребность в пенсионных накоплениях.",
 "即使AI让可复制的商品变便宜，照护、医疗、土地等难以自动化或供给固定之物的相对价格仍可能上升。养老储蓄的需要恰恰来自这些项目。",
 "AIが複製可能な財を安くしても、介護・医療・土地のように自動化が難しい、あるいは供給が固定された項目の相対価格は上がり得る。老後の貯蓄の必要はまさにこれらの項目から生じる。"]);

E(21,"A","q1",2024,"Eloundou, Manning, Mishkin, Rock — Science 384 (2024); arXiv 2303.10130","GPTs are GPTs: An Early Look at the Labor Market Impact Potential of Large Language Models","https://arxiv.org/abs/2303.10130",
"around 80% of the U.S. workforce could have",
["'노출'은 과업이 영향을 받을 수 있다는 잠재성이지 대체나 고용 감소를 의미하지 않는다. 노출 판정에 언어모델 자체의 평가를 일부 사용했다. 인용 구절은 '업무 과업의 10% 이상이 영향받을 수 있다'로 이어진다.",
 "'Exposure' is the potential for tasks to be affected, not replacement or job loss, and part of the rating was done by a language model. The quoted phrase continues: at least 10% of their work tasks affected.",
 "«Подверженность» — это потенциал влияния на задачи, а не замещение или потеря работы; часть оценок сделала сама языковая модель. Цитата продолжается: затронуто не менее 10% рабочих задач.",
 "“暴露”是任务可能受影响的潜力，并不等于替代或就业减少，部分评估还由语言模型完成。引文后半句为：至少10%的工作任务受影响。",
 "「露出」はタスクが影響を受け得る潜在性であって、代替や雇用減少を意味しない。判定の一部には言語モデル自身の評価を用いた。引用句は「業務タスクの10%以上が影響を受け得る」と続く。"],
["영향 범위는 매우 넓지만 실현 속도는 별개다. L축(노동·소득 회복력)에서는 '범위'와 '속도'를 분리해 코딩한다.",
 "The reach is very broad, but the speed of realisation is a separate question. On axis L (labour & income resilience) we code reach and speed separately.",
 "Охват очень широк, но скорость реализации — отдельный вопрос. На оси L (устойчивость труда и доходов) мы кодируем охват и скорость раздельно.",
 "影响范围非常广，但实现速度是另一回事。在L轴（劳动与收入韧性）上，我们把“范围”与“速度”分开编码。",
 "影響範囲は非常に広いが、実現の速度は別問題である。L軸（労働・所得の回復力）では「範囲」と「速度」を分けてコーディングする。"]);

E(22,"B","io",2024,"IMF Blog (Kristalina Georgieva), 2024-01-14","AI Will Transform the Global Economy. Let's Make Sure It Benefits Humanity.","https://www.imf.org/en/blogs/articles/2024/01/14/ai-will-transform-the-global-economy-lets-make-sure-it-benefits-humanity",
"almost 40 percent of global employment is exposed to AI.",
["IMF 직원 분석(SDN 2024/001)을 요약한 정책 블로그다. 노출 비율은 선진국 약 60%, 신흥국 40%, 저소득국 26%로 차이가 크며, 노출이 곧 대체를 뜻하지는 않는다.",
 "A policy blog summarising IMF staff analysis (SDN 2024/001). Exposure differs sharply — about 60% in advanced economies, 40% in emerging markets, 26% in low-income countries — and exposure is not replacement.",
 "Блог, резюмирующий анализ сотрудников МВФ (SDN 2024/001). Подверженность сильно различается: около 60% в развитых странах, 40% на развивающихся рынках, 26% в странах с низким доходом; подверженность не равна замещению.",
 "概述IMF工作人员分析（SDN 2024/001）的政策博客。暴露比例差异很大：发达经济体约60%、新兴市场40%、低收入国家26%，且暴露不等于替代。",
 "IMF職員の分析（SDN 2024/001）を要約した政策ブログである。露出率は先進国約60%、新興国40%、低所得国26%と差が大きく、露出がそのまま代替を意味するわけではない。"],
["선진국일수록 충격과 이익이 먼저 온다. 한국·미국·일본은 대체와 보완이 동시에 빠르게 진행되는 국가군으로 분류한다.",
 "Advanced economies feel both the shock and the gains first. We classify Korea, the US and Japan as countries where substitution and complementarity advance fast at the same time.",
 "Развитые страны первыми ощутят и удар, и выгоды. Корею, США и Японию мы относим к группе, где замещение и дополнение идут быстро одновременно.",
 "越是发达经济体，冲击与收益来得越早。我们把韩国、美国、日本归为替代与互补同时快速推进的国家组。",
 "先進国ほど衝撃と利益が先に来る。韓国・米国・日本は代替と補完が同時に速く進む国家群に分類する。"]);

E(23,"B","io",2025,"ILO Working Paper 140 (Gmyrek, Berg et al.)","Generative AI and Jobs: A Refined Global Index of Occupational Exposure","https://www.ilo.org/publications/generative-ai-and-jobs-refined-global-index-occupational-exposure",
"Globally, one in four workers are in an occupation with some GenAI exposure.",
["직업 과업 단위의 노출 지수로 국가 간 비교가 가능하다. 최고 노출군은 전체 고용의 3.3%이고, 고소득국 34% 대 저소득국 11%로 격차가 크다.",
 "A task-level exposure index that allows cross-country comparison. The highest-exposure group is 3.3% of global employment, and the gap is large: 34% in high-income vs 11% in low-income countries.",
 "Индекс подверженности на уровне задач, пригодный для межстрановых сравнений. Группа наивысшей подверженности — 3,3% мировой занятости; разрыв велик: 34% в странах с высоким доходом против 11% в бедных.",
 "以职业任务为单位的暴露指数，可做跨国比较。最高暴露组占全球就业3.3%，高收入国34%对低收入国11%，差距很大。",
 "職業タスク単位の露出指数で国際比較が可能である。最高露出層は全雇用の3.3%で、高所得国34%対低所得国11%と格差が大きい。"],
["ILO는 '대체'보다 '직무 변형'을 가장 가능성 높은 영향으로 본다. 2035년까지의 기본 경로는 대규모 실업보다 직무 재편이라고 판단한다.",
 "The ILO sees job transformation, not replacement, as the most likely impact. We judge the baseline path to 2035 to be job restructuring rather than mass unemployment.",
 "МОТ считает наиболее вероятным влиянием трансформацию работы, а не замещение. Базовый путь до 2035 года мы видим как перестройку занятий, а не массовую безработицу.",
 "ILO认为最可能的影响是工作“转型”而非“替代”。我们判断到2035年的基准路径是岗位重组而非大规模失业。",
 "ILOは「代替」より「職務の変容」を最も可能性の高い影響と見る。2035年までの基本経路は大量失業より職務の再編だと判断する。"]);

E(24,"B","io",2025,"Humlum & Vestergaard — NBER w33777 (now titled “Still Waters, Rapid Currents”)","Large Language Models, Small Labor Market Effects","https://www.nber.org/papers/w33777",
"we estimate precise null effects on earnings and recorded hours",
["덴마크 행정자료와 설문을 연결한 강한 데이터이나, 챗GPT 출시 후 2년이라는 초기 시점이며 덴마크의 노동제도가 효과를 완충했을 수 있다. 출시 2년 후 2%를 넘는 효과는 배제된다.",
 "Strong data linking Danish surveys to administrative records, but only two years after ChatGPT's launch, and Danish labour institutions may have cushioned effects. Effects above 2% two years on are ruled out.",
 "Сильные данные: опросы, связанные с административными записями Дании. Но это лишь два года после запуска ChatGPT, а датские институты рынка труда могли смягчить эффект. Эффекты свыше 2% через два года исключены.",
 "把丹麦调查与行政记录相连的强数据，但仅在ChatGPT推出两年后，且丹麦劳动制度可能起了缓冲作用。研究排除了两年后超过2%的效应。",
 "デンマークの調査と行政データを結合した強いデータだが、ChatGPT公開から2年という初期時点であり、デンマークの労働制度が効果を緩衝した可能性がある。2年後に2%を超える効果は排除される。"],
["지금까지 노동시장 전체에서 소득·근로시간 충격은 관측되지 않는다. L축 현재값을 비교적 높게 두는 근거다.",
 "So far no economy-wide shock to earnings or hours is observed. This is why the current value of axis L is set relatively high.",
 "Пока никакого общего шока доходов или рабочего времени не наблюдается. Поэтому текущее значение оси L задано сравнительно высоким.",
 "迄今为止，整体劳动力市场未观察到收入和工时冲击。这是把L轴当前值设得较高的依据。",
 "これまで労働市場全体で所得・労働時間への衝撃は観測されていない。L軸の現在値を比較的高く置く根拠である。"]);

E(25,"B","io",2026,"Brynjolfsson, Chandar, Chen — Stanford Digital Economy Lab (rev. 2026-08)","Canaries in the Coal Mine? Six Facts about the Recent Employment Effects of Artificial Intelligence","https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine/",
"employment of young workers (ages 22–25) in AI-exposed occupations now stands 19% below",
["ADP 급여 데이터로 대표성이 높지만 인과 식별은 제한적이다(금리·경기 요인과 겹친다). 2025년 초판보다 격차가 커졌고, 저자들도 경제 전반의 광범위한 대체 증거는 없다고 밝힌다.",
 "ADP payroll data give good coverage, but causal identification is limited (overlapping with interest-rate and cyclical factors). The gap is wider than in the 2025 first version, and the authors still find no evidence of widespread economy-wide displacement.",
 "Платёжные данные ADP дают хороший охват, но причинная идентификация ограничена (накладываются ставки и цикл). Разрыв больше, чем в первой версии 2025 года, и авторы по-прежнему не видят признаков масштабного вытеснения в экономике в целом.",
 "ADP薪资数据代表性高，但因果识别有限（与利率和经济周期因素重叠）。差距比2025年初版更大，作者也表示没有经济整体大范围替代的证据。",
 "ADPの給与データで代表性は高いが、因果識別は限定的である（金利・景気要因と重なる）。2025年の初版より格差が拡大しており、著者も経済全体の広範な代替の証拠はないと述べる。"],
["충격은 '전체 실업'이 아니라 '청년 진입 사다리'에서 먼저 나타난다고 판단한다. 이것이 S3(대체 충격)의 가장 이른 경보 지표다.",
 "We judge that the shock appears first in the entry-level ladder for young workers, not in overall unemployment. It is the earliest warning indicator for S3 (displacement shock).",
 "Мы считаем, что удар проявляется сначала на «лестнице входа» для молодёжи, а не в общей безработице. Это самый ранний сигнал сценария S3 (шок вытеснения).",
 "我们判断冲击首先出现在年轻人的入职阶梯上，而不是总体失业率中。这是S3（替代冲击）最早的预警指标。",
 "衝撃は「全体の失業」ではなく「若者の入職の梯子」で先に現れると判断する。これがS3（代替ショック）の最も早い警戒指標である。"]);

E(26,"A","q1",2020,"Acemoglu & Restrepo — Journal of Political Economy 128(6) (NBER w23285)","Robots and Jobs: Evidence from US Labor Markets","https://www.nber.org/papers/w23285",
"one more robot per thousand workers reduces the employment to population ratio",
["1990~2007년 미국 지역 노동시장의 산업로봇 노출을 이용한 연구로, 휴머노이드·서비스 로봇에 그대로 적용하기 어렵다. 효과 크기는 고용률 0.18~0.34%p, 임금 0.25~0.5% 감소다.",
 "Uses industrial-robot exposure across US local labour markets in 1990–2007, so it does not transfer directly to humanoid or service robots. Effects: employment-to-population down 0.18–0.34 pp, wages down 0.25–0.5%.",
 "Опирается на подверженность местных рынков труда США промышленным роботам в 1990–2007 годах, поэтому напрямую не переносится на гуманоидов и сервисных роботов. Эффект: занятость −0,18…−0,34 п. п., зарплаты −0,25…−0,5%.",
 "利用1990–2007年美国地方劳动力市场的工业机器人暴露，难以直接套用于人形或服务机器人。效应为：就业人口比下降0.18–0.34个百分点，工资下降0.25–0.5%。",
 "1990〜2007年の米国地域労働市場における産業用ロボットへの露出を用いた研究で、ヒューマノイドやサービスロボットにはそのまま当てはめにくい。効果は就業率0.18〜0.34ポイント、賃金0.25〜0.5%の低下である。"],
["로봇 확산은 보상 정책 없이는 해당 지역 노동자에게 실질적 손실을 남긴다. 풍요의 '총량'과 '분배'를 분리해 봐야 한다는 핵심 근거다.",
 "Without compensating policy, robot diffusion leaves real losses for workers in affected areas. This is core evidence for separating the total size of abundance from its distribution.",
 "Без компенсирующей политики распространение роботов наносит работникам затронутых регионов реальный ущерб. Это ключевое основание разделять «объём» изобилия и его «распределение».",
 "若无补偿政策，机器人扩散会给当地劳动者造成实际损失。这是必须把丰裕的“总量”与“分配”分开看的核心依据。",
 "補償政策がなければ、ロボットの普及は当該地域の労働者に実質的な損失を残す。豊かさの「総量」と「分配」を分けて見るべき中核的な根拠である。"]);

E(27,"B","io",2023,"한국은행 BOK 이슈노트 ‘AI와 노동시장 변화’ (세계일보 보도, 2023-11-16)","한은 “고학력·고소득 일자리, AI로 대체 위험도 커”","https://www.segye.com/newsView/20231116521119",
"약 341만개로, 전체 일자리의 12% 수준으로 추정됐다",
["AI 노출지수 상위 20% 직업의 종사자 수를 합산한 추정치로 '대체 가능성'이지 실제 감소가 아니다(상위 25% 기준 약 398만 개). 원보고서가 아닌 언론 보도를 통한 2차 확인이다.",
 "An estimate summing workers in the top 20% of the AI-exposure index — substitution potential, not actual loss (about 3.98 million at the top-25% cut-off). Confirmed via press coverage, not the original note.",
 "Оценка — сумма занятых в профессиях из верхних 20% индекса подверженности ИИ; это потенциал замещения, а не фактическая потеря (около 3,98 млн при пороге 25%). Подтверждено через прессу, а не по исходной записке.",
 "对AI暴露指数前20%职业从业者数量的加总估计，是“替代可能性”而非实际减少（按前25%口径约398万个）。系通过媒体报道而非原报告二次确认。",
 "AI露出指数上位20%の職業の就業者数を合算した推計で「代替可能性」であって実際の減少ではない（上位25%基準では約398万）。原報告ではなく報道による二次確認である。"],
["한국에서는 의사·회계사 등 고학력·고소득 직업의 노출이 높다. 진단·수술 같은 의료 업무가 AI 논쟁의 중심에 서는 이유와 맞닿아 있다.",
 "In Korea, highly educated, high-income occupations such as doctors and accountants are the most exposed — consistent with medical work like diagnosis and surgery sitting at the centre of the AI debate.",
 "В Корее наиболее подвержены профессии с высоким образованием и доходом — врачи, бухгалтеры. Это согласуется с тем, что медицина (диагностика, хирургия) оказалась в центре споров об ИИ.",
 "在韩国，医生、会计师等高学历、高收入职业暴露度最高，这与诊断、手术等医疗工作成为AI争论焦点相吻合。",
 "韓国では医師・会計士など高学歴・高所得の職業の露出が高い。診断や手術のような医療業務がAI論争の中心にある理由と通じる。"]);

E(28,"A","stat",2026,"U.S. Bureau of Labor Statistics (USDL-26-1422), 2026-08-27","Employment Projections: 2025-2035 Summary","https://www.bls.gov/news.release/ecopro.nr0.htm",
"The U.S. economy is projected to add 5.9 million jobs from 2025 to 2035",
["정부 공식 전망이지만 급격한 자동화 같은 구조적 단절을 반영하기 어려운 추세 기반 모형이다. 이번 전망은 'AI 노출 범주' 자료를 새로 도입했다.",
 "An official projection, but a trend-based model that struggles to capture structural breaks such as rapid automation. This round introduces new 'AI exposure categories'.",
 "Официальный прогноз, но трендовая модель плохо улавливает структурные разрывы вроде быстрой автоматизации. В этом выпуске впервые введены «категории подверженности ИИ».",
 "官方预测，但基于趋势的模型难以反映快速自动化等结构性断裂。本轮预测新引入了“AI暴露类别”数据。",
 "政府の公式見通しだが、急速な自動化のような構造的断絶を反映しにくいトレンド型モデルである。今回の見通しでは「AI露出区分」のデータを新たに導入した。"],
["미국 정부의 기본 전망은 2035년까지 '일자리 소멸'이 아니라 완만한 증가이며, 보건·사회복지 부문이 두 번째로 빠르게 성장한다(+9.5%). '일은 선택'이 되는 세계와는 거리가 멀다.",
 "The US government baseline to 2035 is modest job growth, not job disappearance, with health care and social assistance the second-fastest-growing sector (+9.5%) — far from a world where work is optional.",
 "Базовый прогноз правительства США до 2035 года — умеренный рост занятости, а не исчезновение рабочих мест; здравоохранение и соцпомощь — второй по скорости рост (+9,5%). Это далеко от мира, где работа необязательна.",
 "美国政府的基准预测是到2035年就业温和增长而非消失，医疗与社会救助为增速第二快的部门（+9.5%），与“工作成为可选项”的世界相去甚远。",
 "米国政府の基本見通しは2035年までの「雇用消滅」ではなく緩やかな増加であり、医療・社会福祉が2番目に速く伸びる（+9.5%）。「仕事が選択になる」世界とは程遠い。"]);

E(29,"C","ind",2025,"International Federation of Robotics (IFR), 2025-09-25","World Robotics 2025 report – Industrial Robots (Global Robot Demand in Factories Doubles Over 10 Years)","https://ifr.org/ifr-press-releases/news/global-robot-demand-in-factories-doubles-over-10-years",
"representing 54% of global deployments",
["업계 단체의 통계로 회원사 자료에 의존하지만, 산업로봇 설치 통계로는 사실상 표준이다. 2024년 신규 설치 54.2만 대(10년 전의 두 배), 가동 대수 466만 대, 중국 29.5만 대.",
 "Industry-association statistics relying on member data, but the de facto standard for industrial-robot installations: 542,000 new units in 2024 (double a decade earlier), 4.66 million in operation, 295,000 in China.",
 "Статистика отраслевой ассоциации, опирающаяся на данные членов, но фактический стандарт по установкам промышленных роботов: 542 тыс. новых единиц в 2024 году (вдвое больше, чем десятилетием ранее), 4,66 млн в работе, 295 тыс. в Китае.",
 "行业协会统计，依赖会员数据，但实际上是工业机器人安装量的标准来源：2024年新装54.2万台（十年前的两倍），在役466万台，中国29.5万台。",
 "業界団体の統計で会員企業のデータに依存するが、産業用ロボット設置統計としては事実上の標準である。2024年の新規設置54.2万台（10年前の2倍）、稼働台数466万台、中国29.5万台。"],
["물리적 자동화는 이미 대규모로 진행 중이며 중국이 압도적 수요처다. 다만 이는 고정된 공장 환경의 로봇으로, 범용 휴머노이드와는 다른 기술 단계다.",
 "Physical automation is already happening at scale, with China the dominant market. But these are robots in fixed factory settings — a different technological stage from general-purpose humanoids.",
 "Физическая автоматизация уже идёт масштабно, Китай — доминирующий рынок. Но это роботы в фиксированной заводской среде — иная технологическая стадия, чем универсальные гуманоиды.",
 "物理自动化已在大规模推进，中国是压倒性的需求方。但这些是固定工厂环境中的机器人，与通用人形机器人处于不同技术阶段。",
 "物理的な自動化はすでに大規模に進行しており、中国が圧倒的な需要先である。ただしこれは固定された工場環境のロボットで、汎用ヒューマノイドとは異なる技術段階である。"]);

E(30,"C","ind",2024,"International Federation of Robotics (IFR), 2024-11-20","Global Robot Density in Factories Doubled in Seven Years","https://ifr.org/ifr-press-releases/news/global-robot-density-in-factories-doubled-in-seven-years",
"with 1,012 robots per 10,000 employees",
["제조업 종업원 1만 명당 로봇 수로, 자동차·전자 비중 같은 산업구조에 크게 좌우된다. 2023년 기준 싱가포르 770대, 중국 470대, 세계 평균 162대이며, 2026년 발표에서도 한국(1,066대)이 1위를 유지했다.",
 "Robots per 10,000 manufacturing employees, strongly shaped by industrial mix (cars, electronics). For 2023: Singapore 770, China 470, world average 162; in the 2026 release Korea (1,066) remained first.",
 "Число роботов на 10 000 работников обрабатывающей промышленности; сильно зависит от структуры отраслей (автомобили, электроника). За 2023 год: Сингапур 770, Китай 470, мир в среднем 162; в выпуске 2026 года Корея (1 066) осталась первой.",
 "每万名制造业员工的机器人数，受汽车、电子等产业结构影响大。2023年：新加坡770台、中国470台、全球平均162台；2026年发布中韩国（1,066台）仍居首位。",
 "製造業従業員1万人当たりのロボット数で、自動車・電子の比重など産業構造に大きく左右される。2023年はシンガポール770台、中国470台、世界平均162台で、2026年の発表でも韓国（1,066台）が首位を維持した。"],
["한국은 이미 세계에서 가장 자동화된 제조 현장을 가진 나라다. '로봇이 만드는 풍요'의 효과와 부작용을 가장 먼저 관찰할 수 있는 시험대다.",
 "Korea already has the world's most automated factory floor — the first test bed in which to observe both the benefits and side effects of robot-made abundance.",
 "В Корее уже самое автоматизированное производство в мире — первый полигон, где можно наблюдать и выгоды, и побочные эффекты «изобилия, созданного роботами».",
 "韩国已拥有全球自动化程度最高的制造现场，是最先观察“机器人带来的丰裕”之效果与副作用的试验场。",
 "韓国はすでに世界で最も自動化された製造現場を持つ国である。「ロボットがつくる豊かさ」の効果と副作用を最初に観察できる試験場である。"]);

E(31,"A","stat",2025,"国家统计局 (National Bureau of Statistics of China), 2025-02-28","中华人民共和国2024年国民经济和社会发展统计公报","https://www.stats.gov.cn/sj/zxfb/202502/t20250228_1958817.html",
"服务机器人产量1051.9万套，增长15.6%",
["국가 공식 통계로 신뢰도는 높으나 '서비스 로봇'의 정의가 넓어(가정용 청소 로봇 등 포함) 휴머노이드 역량과 동일시할 수 없다. 산업용 로봇 생산은 55.6만 세트(+14.2%)다.",
 "Official national statistics — reliable, but 'service robots' is a broad category (including household cleaning robots), so it cannot be equated with humanoid capability. Industrial-robot output was 556,000 sets (+14.2%).",
 "Официальная национальная статистика — надёжна, но категория «сервисные роботы» широка (включая бытовые роботы-уборщики) и не равна возможностям гуманоидов. Выпуск промышленных роботов — 556 тыс. комплектов (+14,2%).",
 "国家官方统计，可信度高，但“服务机器人”定义宽泛（含家用清洁机器人等），不能等同于人形机器人能力。工业机器人产量为55.6万套（增长14.2%）。",
 "国の公式統計で信頼性は高いが、「サービスロボット」の定義が広く（家庭用掃除ロボット等を含む）、ヒューマノイドの能力と同一視はできない。産業用ロボットの生産は55.6万セット（+14.2%）。"],
["중국은 로봇 생산·설치 모두에서 규모의 우위를 굳히고 있다. 로봇 단가 하락의 주된 동력은 중국의 제조 생태계일 가능성이 크다.",
 "China is consolidating a scale advantage in both producing and installing robots. Its manufacturing ecosystem is likely the main driver of falling robot prices.",
 "Китай закрепляет масштабное преимущество и в производстве, и в установке роботов. Главным двигателем удешевления роботов, вероятно, станет его производственная экосистема.",
 "中国在机器人生产和安装两方面都在巩固规模优势。机器人单价下降的主要动力很可能是中国的制造生态。",
 "中国はロボットの生産・設置の両面で規模の優位を固めている。ロボット単価下落の主な原動力は中国の製造エコシステムである可能性が高い。"]);

E(32,"B","io",2024,"厚生労働省 (MHLW Japan), 2024-07-12 estimate","介護人材確保に向けた取組について（第9期介護保険事業計画に基づく介護職員の必要数）","https://www.mhlw.go.jp/stf/newpage_02977.html",
"2040年度には約２７２万人（＋約５７万人（3.2万人/年））",
["지자체의 서비스 수요 추계를 집계한 정부 추정치로, 실제 공급을 예측한 값이 아니다. 기준은 2022년도 215만 명이다.",
 "A government estimate aggregating municipal service-demand projections — a requirement, not a forecast of actual supply. The baseline is 2.15 million in FY2022.",
 "Правительственная оценка, сводящая муниципальные прогнозы спроса на услуги; это потребность, а не прогноз фактического предложения. База — 2,15 млн в 2022 финансовом году.",
 "汇总地方服务需求预测的政府估计，是“需求数”而非实际供给的预测。基准为2022财年的215万人。",
 "自治体のサービス需要見込みを集計した政府推計であり、実際の供給を予測した値ではない。基準は2022年度の215万人である。"],
["고령화 사회의 진짜 희소 자원은 '돌봄 노동'이다. 로봇이 이 간극을 메우지 못하면 풍요는커녕 서비스 부족이 심화된다 — 일본은 이 점을 가장 먼저 보여준다.",
 "In an ageing society the truly scarce resource is care labour. If robots cannot fill this gap, the result is a deepening service shortage, not abundance — and Japan shows it first.",
 "В стареющем обществе по-настоящему дефицитен труд по уходу. Если роботы не закроют этот разрыв, итогом станет нарастающий дефицит услуг, а не изобилие — и Япония показывает это первой.",
 "老龄社会真正稀缺的资源是“照护劳动”。机器人若填补不了这一缺口，结果不是丰裕而是服务短缺加剧——日本最先显示了这一点。",
 "高齢社会で本当に希少な資源は「介護労働」である。ロボットがこの隔たりを埋められなければ、豊かさどころかサービス不足が深まる――日本はそれを最初に示している。"]);

E(33,"A","q1",2025,"Kim et al. — Science Robotics (2025)","SRT-H: A hierarchical framework for autonomous surgery via language-conditioned imitation learning","https://doi.org/10.1126/scirobotics.adt5254",
"Our method achieves a 100% success rate across eight different ex vivo gallbladders",
["적출된 돼지 담낭 8개를 쓴 체외(ex vivo) 실험으로, 출혈·호흡 움직임·환자 다양성이 있는 실제 환자 수술과는 거리가 멀다. 저자들도 성과를 '단계 수준의 자율성'이라고 표현한다.",
 "An ex vivo experiment on eight excised porcine gallbladders — far from live patients with bleeding, breathing motion and anatomical variety. The authors themselves describe it as step-level autonomy.",
 "Эксперимент ex vivo на восьми извлечённых свиных желчных пузырях — далеко от живых пациентов с кровотечением, дыхательными движениями и анатомическим разнообразием. Сами авторы называют это автономией на уровне этапа.",
 "使用8个离体猪胆囊的体外（ex vivo）实验，与存在出血、呼吸运动和个体差异的真实患者手术相距甚远。作者自己也称之为“步骤级自主”。",
 "摘出した豚の胆嚢8個を用いた体外（ex vivo）実験で、出血・呼吸運動・患者の多様性がある実際の手術とは隔たりが大きい。著者自身も成果を「ステップレベルの自律性」と表現している。"],
["자율 수술은 실재하는 돌파구이지만 2026년 현재 '임상 이전' 단계다. 3년 안에 최고 외과의를 능가하려면 동물실험·임상시험·인허가를 모두 통과해야 하므로 시한 달성은 극히 어렵다고 판단한다.",
 "Autonomous surgery is a real breakthrough but, as of 2026, still pre-clinical. Beating the best surgeons within three years would require passing animal studies, clinical trials and approval, so we judge the deadline extremely unlikely.",
 "Автономная хирургия — реальный прорыв, но на 2026 год она всё ещё доклиническая. Чтобы превзойти лучших хирургов за три года, нужно пройти исследования на животных, клинические испытания и допуск, поэтому срок мы считаем крайне маловероятным.",
 "自主手术是真实的突破，但截至2026年仍处于“临床前”阶段。三年内超越最好的外科医生需要通过动物实验、临床试验和审批，因此我们判断该期限极难实现。",
 "自律手術は実在する突破口だが、2026年現在は「臨床前」段階である。3年以内に最高の外科医を上回るには動物実験・臨床試験・承認をすべて通過する必要があり、期限の達成は極めて難しいと判断する。"]);

E(34,"A","q1",2022,"Saeidi et al. — Science Robotics (2022)","Autonomous robotic laparoscopic surgery for intestinal anastomosis","https://doi.org/10.1126/scirobotics.abj2908",
"our system outperforms expert surgeons' manual technique and RAS technique",
["돼지 생체 모델(1주 생존)과 팬텀에서 문합이라는 단일 과업의 일관성·정확도를 비교했다. 운영자가 자율 생성된 수술 계획 중 하나를 고르는 '감독형 자율'이다.",
 "Compared consistency and accuracy of a single task — anastomosis — in phantoms and live pigs (one-week survival). It is supervised autonomy: an operator chooses among autonomously generated plans.",
 "Сравнивались стабильность и точность одной задачи — анастомоза — на фантомах и живых свиньях (выживание неделя). Это контролируемая автономия: оператор выбирает один из автоматически созданных планов.",
 "在模型和活体猪（存活一周）上比较吻合这一单一任务的一致性与精度。属“监督式自主”：由操作者从自主生成的方案中选择。",
 "ファントムと生体豚（1週間生存）で吻合という単一タスクの一貫性・精度を比較した。術者が自律生成された計画から選ぶ「監督型自律」である。"],
["'특정 과업에서 인간보다 일관적'이라는 주장에는 이미 근거가 있다. 그러나 이를 '수술 전체'와 '모든 수술'로 확장하는 것은 별개의 문제다.",
 "There is already evidence for 'more consistent than humans on a specific task'. Extending that to whole operations — and to all operations — is a separate matter.",
 "Для тезиса «стабильнее человека в конкретной задаче» доказательства уже есть. Но распространить его на операцию целиком и на все операции — отдельный вопрос.",
 "“在特定任务上比人更稳定”已有证据。但把它扩展到“整台手术”和“所有手术”是另一回事。",
 "「特定のタスクでは人間より一貫している」という主張にはすでに根拠がある。しかしそれを「手術全体」「すべての手術」へ広げるのは別問題である。"]);

E(35,"B","q1",2017,"Yang et al. — Science Robotics 2(4) (editorial)","Medical robotics—Regulatory, ethical, and legal considerations for increasing levels of autonomy","https://doi.org/10.1126/scirobotics.aam8638",
"careful consideration of different levels of autonomy, as well as the context for use",
["실증 연구가 아닌 관점(사설) 논문이어서 B로 분류한다. 그러나 의료 로봇의 자율성 단계(0~5단계) 틀로 가장 널리 인용된다.",
 "A perspective (editorial), not empirical research, hence grade B. It is nonetheless the most widely cited framework for levels of autonomy (0–5) in medical robotics.",
 "Это редакционная статья, а не эмпирическое исследование, поэтому класс B. Тем не менее она — самая цитируемая рамка уровней автономии (0–5) в медицинской робототехнике.",
 "属于观点（社论）文章而非实证研究，故列为B级。但它是医疗机器人自主等级（0–5级）最常被引用的框架。",
 "実証研究ではなく視点（社説）論文のためB等級とする。ただし医療ロボットの自律性段階（0〜5段階）の枠組みとして最も広く引用されている。"],
["'최고 외과의 능가'는 자율성 최고 단계에 해당하며, 그 전에 단계마다 규제·책임 체계가 새로 필요하다. 시한을 결정하는 것은 기술보다 제도다.",
 "'Better than the best surgeon' corresponds to the highest autonomy level, and each step before it needs new regulation and liability rules. Institutions, more than technology, set the timetable.",
 "«Лучше лучшего хирурга» соответствует высшему уровню автономии, и каждый предшествующий шаг требует нового регулирования и правил ответственности. Сроки определяет скорее институциональная сторона, чем техника.",
 "“超越最好的外科医生”对应最高自主等级，此前每一级都需要新的监管与责任体系。决定时间表的与其说是技术，不如说是制度。",
 "「最高の外科医を上回る」は自律性の最高段階に当たり、その前の各段階で新たな規制・責任の仕組みが必要になる。期限を決めるのは技術より制度である。"]);

E(36,"A","q1",2023,"Lång et al. — Lancet Oncology 24(8), MASAI trial","Artificial intelligence-supported screen reading versus standard double reading in the Mammography Screening with Artificial Intelligence trial (MASAI)","https://doi.org/10.1016/S1470-2045(23)00298-X",
"The screen-reading workload was reduced by 44·3% using AI.",
["스웨덴 여성 8만여 명을 대상으로 한 무작위 대조 비열등성 시험의 안전성 분석으로, 의료 AI 검증의 모범 사례다. 다만 판독 보조이지 자율 진단이 아니며, 암 발견율은 1,000명당 6.1 대 5.1이었다.",
 "A safety analysis of a randomised, controlled non-inferiority trial in some 80,000 Swedish women — a model for validating medical AI. But it is reading support, not autonomous diagnosis; cancer detection was 6.1 vs 5.1 per 1,000.",
 "Анализ безопасности рандомизированного контролируемого исследования не меньшей эффективности на ~80 000 шведок — образец проверки медицинского ИИ. Но это помощь в чтении снимков, а не автономная диагностика; выявляемость рака — 6,1 против 5,1 на 1 000.",
 "对约8万名瑞典女性开展的随机对照非劣效性试验的安全性分析，是医疗AI验证的范例。但这是阅片辅助而非自主诊断，癌症检出率为每千人6.1对5.1。",
 "スウェーデンの女性約8万人を対象とした無作為化対照非劣性試験の安全性解析で、医療AI検証の模範例である。ただし読影補助であって自律診断ではなく、がん発見率は1,000人当たり6.1対5.1だった。"],
["의료 AI가 '사람과 동등 이상'임을 보이려면 이런 대규모 RCT가 필요하다는 기준점이다. 수술 로봇에는 아직 이 수준의 시험이 없다.",
 "It sets the bar: showing medical AI is 'as good as or better than humans' takes large RCTs like this. Surgical robots have no trial of this calibre yet.",
 "Это планка: чтобы показать, что медицинский ИИ «не хуже человека», нужны крупные РКИ такого уровня. Для хирургических роботов подобных испытаний пока нет.",
 "这是一个基准：要证明医疗AI“不逊于人”，需要这样的大型RCT。手术机器人目前还没有这一级别的试验。",
 "医療AIが「人と同等以上」であることを示すには、このような大規模RCTが必要だという基準点である。手術ロボットにはまだこの水準の試験がない。"]);

E(37,"B","io",2026,"U.S. Food and Drug Administration (FDA)","List of Artificial Intelligence-Enabled Medical Devices","https://www.fda.gov/medical-devices/software-medical-device-samd/artificial-intelligence-enabled-medical-devices",
"The list is not a comprehensive resource of AI-enabled medical devices.",
["공식 인허가 목록이지만 FDA 스스로 포괄적이지 않다고 밝힌다. 목록에서는 영상의학(Radiology) 분야가 가장 많다.",
 "An official authorisation list, though the FDA itself says it is not comprehensive. Radiology is the most common panel on the list.",
 "Официальный перечень разрешений, хотя FDA сама отмечает его неполноту. Чаще всего в нём встречается радиология.",
 "官方审批清单，但FDA自己说明并不全面。清单中以放射科领域最多。",
 "公式の承認リストだが、FDA自身が網羅的ではないと明言している。リストでは放射線科（Radiology）分野が最も多い。"],
["의료 AI 인허가는 '판독·보조' 중심으로 쌓이고 있으며, 자율 수술 시스템은 아직 이 경로에 본격적으로 들어서지 않았다.",
 "Medical-AI authorisations are accumulating around reading and assistance; autonomous surgical systems have not yet seriously entered this pathway.",
 "Разрешения на медицинский ИИ накапливаются вокруг чтения снимков и поддержки; автономные хирургические системы на этот путь всерьёз ещё не вышли.",
 "医疗AI审批主要集中在“阅片与辅助”，自主手术系统尚未真正进入这一路径。",
 "医療AIの承認は「読影・補助」を中心に積み上がっており、自律手術システムはまだこの経路に本格的に入っていない。"]);

E(38,"B","io",2026,"World Health Organization (WHO)","Health workforce","https://www.who.int/health-topics/health-workforce",
"WHO estimates a projected shortfall of 11 million health workers by 2030",
["국제기구의 수급 추계로, 부족분은 주로 저소득·하위중소득국에 집중된다.",
 "An international supply–demand projection; the shortfall is concentrated mostly in low- and lower-middle-income countries.",
 "Международный прогноз спроса и предложения; дефицит сосредоточен главным образом в странах с низким и ниже среднего доходом.",
 "国际机构的供需预测，缺口主要集中在低收入和中低收入国家。",
 "国際機関の需給推計で、不足は主に低所得国・低中所得国に集中する。"],
["수술 로봇의 사회적 가치는 '최고 외과의 대체'보다 '외과의가 없는 곳의 접근성'에서 더 클 수 있다. 다만 그런 지역일수록 인프라·비용 장벽이 높다.",
 "The social value of surgical robots may lie less in replacing top surgeons than in access where there are no surgeons — though those are exactly the places with the highest infrastructure and cost barriers.",
 "Общественная ценность хирургических роботов может заключаться не столько в замене лучших хирургов, сколько в доступе там, где хирургов нет, — хотя именно там выше всего барьеры инфраструктуры и стоимости.",
 "手术机器人的社会价值或许不在于“替代顶尖外科医生”，而在于“没有外科医生之处的可及性”——但这些地区的基础设施与成本壁垒也最高。",
 "手術ロボットの社会的価値は「最高の外科医の代替」より「外科医がいない地域へのアクセス」の方が大きいかもしれない。ただしそうした地域ほどインフラ・費用の障壁が高い。"]);

E(39,"B","io",2024,"Association of American Medical Colleges (AAMC), 2024-03-21","New AAMC Report Shows Continuing Projected Physician Shortage","https://www.aamc.org/news/press-releases/new-aamc-report-shows-continuing-projected-physician-shortage",
"a physician shortage of up to 86,000 physicians by 2036",
["의과대학 단체의 추계로 의사 증원 정책에 이해관계가 있을 수 있다. 65세 이상 인구 34.1% 증가를 전제로 한다.",
 "A projection by the medical-schools association, which may have a stake in expanding physician supply. It assumes the 65+ population grows 34.1%.",
 "Прогноз ассоциации медицинских школ, которая может быть заинтересована в увеличении числа врачей. Предполагается рост населения 65+ на 34,1%.",
 "医学院协会的预测，可能与扩大医生供给存在利益关联。前提是65岁以上人口增长34.1%。",
 "医科大学団体の推計で、医師増員政策に利害を持ち得る。65歳以上人口の34.1%増加を前提とする。"],
["미국에서도 의료 노동은 부족 자원이다. AI·로봇은 의사를 '없애기'보다 부족분을 메우는 방향으로 먼저 쓰일 것이다.",
 "Even in the US, medical labour is a scarce resource. AI and robots will first be used to fill shortages rather than to eliminate doctors.",
 "Даже в США медицинский труд — дефицитный ресурс. ИИ и роботы сначала будут закрывать нехватку, а не «упразднять» врачей.",
 "即使在美国，医疗劳动力也是稀缺资源。AI和机器人会先用于填补缺口，而不是“消灭”医生。",
 "米国でも医療労働は不足資源である。AI・ロボットは医師を「なくす」より不足分を埋める方向で先に使われるだろう。"]);

E(40,"B","io",2026,"European Commission — Shaping Europe's digital future (updated 2026-10-19)","AI Act","https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai",
"Starting on 2 December 2027, high-risk AI systems will be subject to strict obligations",
["집행위원회 공식 안내로, 2026년 'AI 옴니버스'로 고위험 의무 시점이 연기된 최신 일정을 반영한다. 법은 2024년 8월 발효, 2026년 8월부터 일부 예외를 두고 적용되며, 제품 내장형 고위험 AI는 2028년 8월부터다.",
 "Official Commission guidance reflecting the 2026 'AI Omnibus' delay of high-risk obligations. The Act entered into force in August 2024 and applies from August 2026 with exceptions; high-risk AI embedded in products follows in August 2028.",
 "Официальное разъяснение Комиссии с учётом отсрочки требований к высокорисковым системам по «Омнибусу ИИ» 2026 года. Закон вступил в силу в августе 2024 года и применяется с августа 2026 года с исключениями; встроенные в продукты высокорисковые системы — с августа 2028 года.",
 "欧盟委员会官方说明，反映了2026年“AI综合法案”推迟高风险义务后的最新时间表。该法2024年8月生效，2026年8月起适用（有例外），嵌入产品的高风险AI自2028年8月起适用。",
 "欧州委員会の公式案内で、2026年の「AIオムニバス」で高リスク義務の時期が延期された最新日程を反映する。法は2024年8月に発効、2026年8月から一部例外付きで適用され、製品組込み型の高リスクAIは2028年8月からである。"],
["EU에서 의료기기 등 고위험 AI의 본격 규제는 2027~28년에 시작된다. 수술 로봇이 3년 안에 유럽에서 자율 시술을 하는 것은 제도상 거의 불가능하다.",
 "In the EU, full rules for high-risk AI such as medical devices start in 2027–28. Autonomous robotic surgery in Europe within three years is institutionally all but impossible.",
 "В ЕС полноценное регулирование высокорискового ИИ, включая медизделия, начнётся в 2027–28 годах. Автономные роботизированные операции в Европе за три года институционально почти невозможны.",
 "在欧盟，医疗器械等高风险AI的全面监管于2027–28年开始。三年内在欧洲实现机器人自主手术在制度上几乎不可能。",
 "EUでは医療機器など高リスクAIの本格規制は2027〜28年に始まる。手術ロボットが3年以内に欧州で自律施術を行うことは制度上ほぼ不可能である。"]);

E(41,"B","io",2026,"국가법령정보센터 (법률 제21311호, 2026-01-20 일부개정, 2026-07-21 시행)","인공지능 발전과 신뢰 기반 조성 등에 관한 기본법","https://www.law.go.kr/법령/인공지능발전과신뢰기반조성등에관한기본법",
"인공지능 발전과 신뢰 기반 조성 등에 관한 기본법",
["법령 원문으로 신뢰도는 최고 수준이나, 하위 법령·고시에 위임된 부분이 많아 실제 규제 강도는 시행령에 달려 있다. 2026년 1월 시행 이후 일부 개정되었다.",
 "The statute itself — maximally reliable — but much is delegated to decrees and notices, so actual stringency depends on implementing rules. It took effect in January 2026 and has since been partly amended.",
 "Сам текст закона — максимально надёжен, но многое делегировано подзаконным актам, так что реальная жёсткость зависит от правил применения. Закон вступил в силу в январе 2026 года и затем частично изменён.",
 "法律原文，可信度最高，但大量内容委托给下位法规和告示，实际监管强度取决于实施细则。2026年1月施行后已部分修订。",
 "法令原文で信頼性は最高水準だが、下位法令・告示への委任が多く、実際の規制の強さは施行令次第である。2026年1月の施行後、一部改正された。"],
["한국은 EU에 이어 포괄적 AI 법을 갖춘 초기 국가 중 하나다. 제도 흡수력(I) 측면에서 '틀'은 갖췄지만 집행 역량은 아직 검증되지 않았다.",
 "Korea is among the first after the EU to have a comprehensive AI law. On institutional absorption (I) the framework exists, but enforcement capacity is still untested.",
 "Корея одной из первых после ЕС приняла всеобъемлющий закон об ИИ. По институциональной способности (I) рамка есть, но потенциал исполнения ещё не проверен.",
 "韩国是继欧盟之后率先拥有综合性AI法律的国家之一。在制度吸收力（I）上“框架”已具备，但执行能力尚未经过检验。",
 "韓国はEUに次いで包括的なAI法を備えた国の一つである。制度吸収力（I）の面で「枠組み」は整ったが、執行能力はまだ検証されていない。"]);

E(42,"B","io",2025,"国务院 (State Council of China), 国发〔2025〕11号, 2025-08-26","国务院关于深入实施“人工智能+”行动的意见","https://www.gov.cn/zhengce/content/202508/content_7037861.htm",
"应用普及率超70%",
["정책 목표치이지 실측치가 아니다. '신세대 지능형 단말·에이전트 등'의 보급률이라 정의가 넓다. 2027년 70% 초과, 2030년 90% 초과, 2035년 '지능 경제·지능 사회의 새 단계' 진입을 제시한다.",
 "A policy target, not a measurement, for a broad category ('new-generation intelligent terminals, agents, etc.'). It sets >70% by 2027, >90% by 2030 and entry into a 'new stage of the intelligent economy and society' by 2035.",
 "Это целевой ориентир, а не измерение, для широкой категории («интеллектуальные терминалы нового поколения, агенты и др.»): >70% к 2027, >90% к 2030 и вступление в «новый этап интеллектуальной экономики и общества» к 2035 году.",
 "这是政策目标而非实测值，且口径宽泛（“新一代智能终端、智能体等”）。提出2027年超70%、2030年超90%、2035年全面步入智能经济和智能社会发展新阶段。",
 "政策目標であって実測値ではない。「新世代スマート端末・エージェント等」の普及率で定義が広い。2027年70%超、2030年90%超、2035年に「スマート経済・スマート社会の新段階」入りを掲げる。"],
["중국은 하향식 목표와 제조 역량을 결합해 확산 속도(A)에서 가장 공격적인 경로를 택했다. 분배·안전 제도의 투명성은 상대적으로 낮다.",
 "China combines top-down targets with manufacturing capacity, taking the most aggressive path on diffusion speed (A). Transparency of its distribution and safety institutions is relatively low.",
 "Китай сочетает директивные цели с производственной мощью и выбирает самый агрессивный путь по скорости распространения (A). Прозрачность институтов распределения и безопасности сравнительно низка.",
 "中国把自上而下的目标与制造能力相结合，在扩散速度（A）上走了最激进的路线；分配与安全制度的透明度相对较低。",
 "中国はトップダウンの目標と製造能力を組み合わせ、普及速度（A）で最も攻撃的な経路を選んだ。分配・安全制度の透明性は相対的に低い。"]);

E(43,"A","q1",2026,"Vivalt, Rhodes, Bartik, Broockman, Krause, Miller — NBER w32719 (QJE 141(4), 2026)","The Employment Effects of a Guaranteed Income: Experimental Evidence from Two U.S. States","https://www.nber.org/papers/w32719",
"Participants reduced their work hours as a result of the transfers by 1-2 hours/week",
["월 1,000달러를 3년간 무조건 지급한 무작위 실험(처치 1,000명, 대조 2,000명)으로 인과 증거가 강하다. 다만 '전 국민·영구' 기본소득의 일반균형 효과는 측정할 수 없다. 노동시장 참여율은 4.2%p 낮아졌다.",
 "A randomised experiment paying $1,000 a month unconditionally for three years (1,000 treated, 2,000 controls) — strong causal evidence. But it cannot measure the general-equilibrium effects of a universal, permanent income. Labour-force participation fell 4.2 pp.",
 "Рандомизированный эксперимент: 1 000 долларов в месяц без условий три года (1 000 получателей, 2 000 в контроле) — сильное причинное свидетельство. Но общеравновесные эффекты всеобщего и постоянного дохода он измерить не может. Участие в рабочей силе снизилось на 4,2 п. п.",
 "每月无条件发放1,000美元、持续三年的随机实验（处理组1,000人、对照组2,000人），因果证据强。但无法衡量“全民、永久”基本收入的一般均衡效应。劳动参与率下降4.2个百分点。",
 "月1,000ドルを3年間無条件で支給した無作為化実験（処置1,000人、対照2,000人）で因果的証拠は強い。ただし「全国民・恒久」のベーシックインカムの一般均衡効果は測れない。労働参加率は4.2ポイント低下した。"],
["소득 보장은 노동 공급을 소폭 줄일 뿐 급격히 붕괴시키지 않는다. AI 풍요를 나눌 장치로서 현금 이전은 실행 가능하지만, 핵심은 재원이다.",
 "Guaranteed income trims labour supply modestly rather than collapsing it. Cash transfers are a workable channel for sharing AI abundance — the real question is financing.",
 "Гарантированный доход умеренно снижает предложение труда, а не обрушивает его. Денежные трансферты — рабочий канал распределения «изобилия ИИ»; главный вопрос — финансирование.",
 "收入保障只会小幅减少劳动供给而非使其崩塌。作为分享AI丰裕的渠道，现金转移可行，关键在于资金来源。",
 "所得保障は労働供給をわずかに減らすだけで急激に崩しはしない。AIの豊かさを分ける仕組みとして現金給付は実行可能だが、核心は財源である。"]);

E(44,"B","survey",2025,"Board of Governors of the Federal Reserve System (SHED), 2025-05","Economic Well-Being of U.S. Households in 2024 — Executive Summary","https://www.federalreserve.gov/publications/2025-economic-well-being-of-us-households-in-2024-executive-summary.htm",
"Thirty-five percent of non-retirees thought their retirement savings plan was on track",
["연준의 대표 표본 조사로 방법이 공개되어 있다. 자기평가 지표라 실제 적립액과 다를 수 있으며, 2021년(40%)보다는 낮은 수준이다.",
 "A Federal Reserve representative survey with published methods. It is a self-assessment and may differ from actual balances; the share is below its 2021 level (40%).",
 "Репрезентативный опрос ФРС с открытой методикой. Это самооценка, она может расходиться с реальными накоплениями; доля ниже уровня 2021 года (40%).",
 "美联储的代表性抽样调查，方法公开。属自我评估，可能与实际储蓄额不同，且低于2021年水平（40%）。",
 "連邦準備制度の代表標本調査で方法が開示されている。自己評価の指標で実際の積立額とは異なり得て、2021年（40%）より低い水準である。"],
["미국 비은퇴자 3명 중 2명은 이미 노후 준비가 부족하다고 느낀다. '저축할 필요가 없다'는 메시지는 가장 취약한 집단의 행동을 잘못된 방향으로 이끌 위험이 있다.",
 "Two in three US non-retirees already feel their retirement preparation falls short. The message 'no need to save' risks steering the most vulnerable in the wrong direction.",
 "Двое из трёх американцев, не вышедших на пенсию, уже считают свою подготовку недостаточной. Посыл «копить не нужно» рискует подтолкнуть самых уязвимых в неверном направлении.",
 "三分之二的美国未退休者已觉得养老准备不足。“无需储蓄”的信息可能把最脆弱的人群引向错误方向。",
 "米国の非退職者の3人に2人はすでに老後の備えが足りないと感じている。「貯蓄の必要はない」というメッセージは最も脆弱な層の行動を誤った方向へ導く危険がある。"]);

E(45,"B","io",2023,"보건복지부 제5차 국민연금 재정추계 (뉴시스 보도, 2023-01-29)","국민연금 바닥나면 90년생 정말 못 받나…전문가들 “있을 수 없는 일”","https://www.newsis.com/view/NISX20230127_0002172292",
"복지부 추계 결과 2055년에 연금 기금 소진",
["현행 제도 유지를 가정한 공식 추계로, 이후 연금개혁 입법에 따라 소진 시점은 달라질 수 있다. 원자료가 아닌 언론 보도를 통한 확인이다. 4차 추계(2057년)보다 2년 앞당겨졌다.",
 "An official projection assuming no change to the current system; later pension-reform legislation can shift the depletion date. Confirmed through press coverage rather than the source document. It is two years earlier than the 4th projection (2057).",
 "Официальный прогноз при неизменной системе; последующие пенсионные реформы могут сдвинуть дату исчерпания. Подтверждено через прессу, а не по первоисточнику. На два года раньше 4-го прогноза (2057).",
 "以维持现行制度为前提的官方测算，此后的养老金改革立法可能改变耗尽时点。系通过媒体报道而非原始文件确认。较第4次测算（2057年）提前两年。",
 "現行制度の維持を前提とした公式推計で、その後の年金改革の立法で枯渇時期は変わり得る。原資料ではなく報道による確認である。第4次推計（2057年）より2年早まった。"],
["한국의 공적 노후 안전판은 재정 압력 아래 있다. 이 '재정·고령화 압력(D)'이 제도 흡수력의 성장을 깎는다고 모형에 반영한다.",
 "Korea's public old-age safety net is under fiscal pressure. Our model encodes this 'fiscal and ageing pressure (D)' as a drag on the growth of institutional absorption.",
 "Государственная пенсионная защита Кореи под фискальным давлением. В модели это «фискальное и демографическое давление (D)» снижает рост институциональной способности.",
 "韩国的公共养老安全网正承受财政压力。模型把这一“财政与老龄化压力（D）”设定为削弱制度吸收力增长的因素。",
 "韓国の公的な老後のセーフティネットは財政圧力の下にある。この「財政・高齢化圧力（D）」が制度吸収力の伸びを削るとモデルに反映する。"]);

E(46,"B","io",2026,"SBS Biz (윤진섭), 2026-07-09 — 국민연금연구원의 OECD 『한눈에 보는 연금 2025』 분석 보도","“아픈데 돈도 없어서 서럽네”…한국 노인 빈곤율 OECD 1위","https://biz.sbs.co.kr/article/20000321463",
"노인 소득 빈곤율은 39.7%로 집계됐습니다",
["OECD 비교 통계를 국책연구기관이 분석하고 언론이 보도한 3차 자료다. OECD 평균 14.8%의 약 2.7배이며, 한국은 2015년 이후 줄곧 회원국 최고다.",
 "Tertiary reporting: OECD comparative data analysed by a national research institute and relayed by the press. About 2.7 times the OECD average (14.8%); Korea has had the highest rate among members since 2015.",
 "Третичный источник: сравнительные данные ОЭСР, проанализированные государственным институтом и пересказанные прессой. Примерно в 2,7 раза выше среднего по ОЭСР (14,8%); Корея лидирует среди стран-членов с 2015 года.",
 "三手资料：国家研究机构分析OECD比较统计、再由媒体报道。约为OECD平均（14.8%）的2.7倍，韩国自2015年以来一直居成员国最高。",
 "OECDの比較統計を国の研究機関が分析し報道が伝えた三次資料である。OECD平均14.8%の約2.7倍で、韓国は2015年以降ずっと加盟国で最も高い。"],
["한국은 '노후 저축이 무의미한 세계'와 가장 먼 출발점에 있다. 풍요가 오더라도 분배 장치 없이는 현재의 노인 빈곤이 자동으로 해소되지 않는다.",
 "Korea starts furthest from a world where retirement saving is pointless. Even if abundance arrives, today's old-age poverty will not resolve itself without distribution mechanisms.",
 "Корея стартует дальше всех от мира, где пенсионные накопления бессмысленны. Даже при наступлении изобилия нынешняя бедность пожилых без механизмов распределения сама не исчезнет.",
 "韩国离“养老储蓄无意义的世界”起点最远。即使丰裕到来，没有分配机制，当前的老年贫困也不会自动消失。",
 "韓国は「老後の貯蓄が無意味な世界」から最も遠い出発点にいる。豊かさが来ても分配の仕組みがなければ、現在の高齢者の貧困は自然には解消されない。"]);

E(47,"B","survey",2025,"Pew Research Center (McClain, Kennedy, Gottfried, Anderson, Pasquini), 2025-04-03","How the U.S. Public and AI Experts View Artificial Intelligence","https://www.pewresearch.org/internet/2025/04/03/how-the-us-public-and-ai-experts-view-artificial-intelligence/",
"Experts are far more positive and enthusiastic about AI than the public.",
["일반인 대표 표본과 AI 전문가 표본을 비교한 조사로, 전문가 표본은 학회 발표자 등으로 구성되어 대표성이 다르다. 향후 20년 일자리 감소를 예상한 비율은 일반인 64%, 전문가 39%다.",
 "Compares a representative public sample with an AI-expert sample (drawn from conference authors, etc.), whose representativeness differs. 64% of the public vs 39% of experts expect fewer jobs over the next 20 years.",
 "Сравнение репрезентативной выборки населения с выборкой экспертов по ИИ (авторы конференций и т. п.) с иной репрезентативностью. Сокращения рабочих мест за 20 лет ждут 64% населения и 39% экспертов.",
 "比较公众代表性样本与AI专家样本（来自会议作者等，代表性不同）。预计未来20年工作岗位减少的比例：公众64%，专家39%。",
 "一般の代表標本とAI専門家の標本（学会発表者等で構成）を比較した調査で、代表性が異なる。今後20年で雇用が減ると予想した割合は一般64%、専門家39%である。"],
["기술 낙관론과 대중 인식의 간극이 크다. 이 '신뢰 간극'은 규제 반동(S4)이나 분배 요구 강화의 정치적 연료가 된다.",
 "The gap between technologists' optimism and public perception is wide. This trust gap fuels either regulatory backlash (S4) or stronger demands for redistribution.",
 "Разрыв между оптимизмом технологов и восприятием общества велик. Этот «разрыв доверия» питает либо регуляторную реакцию (S4), либо требования перераспределения.",
 "技术乐观派与公众认知之间差距很大。这一“信任鸿沟”会成为监管反弹（S4）或再分配诉求增强的政治燃料。",
 "技術楽観論と一般の認識の隔たりは大きい。この「信頼の隔たり」は規制の反動（S4）や分配要求の強まりの政治的燃料になる。"]);
