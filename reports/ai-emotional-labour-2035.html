<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 시대와 일터의 감정노동 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}

/* mobile: keep panel tables and reference filters inside the viewport */
.panelc{min-width:0;overflow-x:auto}.reff .seg{flex-wrap:wrap}

/* evidence tables on narrow screens: scroll the table sideways instead of crushing CJK columns to one character */
.tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;max-width:15em}
@media (max-width:760px){
 .tblwrap table.t:has(tr.sent){width:auto;min-width:100%}
 .tblwrap table.t:has(tr.sent) td,.tblwrap table.t:has(tr.sent) th{min-width:8.5em}
 .tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;min-width:6.5em;max-width:10em}

<script>
// ===== Core helpers (data authoring format) =====
// Text arrays are always in the order [ko, en, ru, zh, ja].
// grade: A/B/C = strongest evidence class behind a sentence; D = Claude's analytic inference (sentences only)
// type codes: q1 = Q1 peer-reviewed paper, stat = official statistics, io = international org / government / public research report,
//             survey = methodologically disclosed survey, press = news report, ind = industry/company data
const LANGS=["ko","en","ru","zh","ja"];
function tx(o,lang){if(!o)return "";if(typeof o==="string")return o;return o[lang]??o.en??o.ko??"";}
const L5=a=>{if(!a)return null;if(!Array.isArray(a))return a;const o={};LANGS.forEach((l,i)=>o[l]=a[i]);return o;};
// sentence: s(grade, refs, [ko,en,ru,zh,ja], note[5]?, conf?)  conf: "H" | "M" | "L"
const s=(g,refs,t,note,conf)=>({g:g,refs:refs||[],t:L5(t),note:note?L5(note):null,conf:conf||null});
const P=(...x)=>({p:x}), KJ=(...x)=>({kj:x}), H=t=>({h:L5(t)}), CH=c=>({chart:c}), TB=k=>({table:k}), SCN={scen:1}, W=w=>({widget:w}), REFL={reflist:1};
const EVIDENCE=[];
function E(id,grade,type,year,src,title,url,quote,crit,judg){const e={id,grade,type,year,src,title,url,quote};LANGS.forEach((l,i)=>e[l]={crit:crit[i],judg:judg[i]});EVIDENCE.push(e);}
const SECTIONS=[];
function SEC(id,t,detail,concise){SECTIONS.push({id:id,t:L5(t),detail:detail,concise:concise});}
// evidence behind the cost & efficiency pressure term D in the MCMC indicator table
const DREFS=[39,31,32];

// ===== Evidence 1–14: concepts, health costs, international comparisons =====
E(1,"B","q1",1983,"Arlie Russell Hochschild, University of California Press (1983; 2012 ed.)","The Managed Heart: Commercialization of Human Feeling","https://www.ucpress.edu/flyer/books/the-managed-heart/paper",
"closely examines two groups of public-contact workers: flight attendants and bill collectors",
["감정노동 개념의 출발점이 된 고전으로, 표면행위·심층행위·감정 규칙이라는 분석 틀을 제공한다. 다만 1980년대 미국 항공사·추심 업체에 대한 질적 연구여서 수치나 국가 비교의 근거는 아니다.",
 "The classic that founded the concept of emotional labour, supplying the framework of surface acting, deep acting and feeling rules. It is a qualitative study of a US airline and debt collection in the 1980s, so it is no basis for figures or cross-country comparison.",
 "Классическая работа, заложившая понятие эмоционального труда и давшая рамку «поверхностной» и «глубокой» игры и правил чувств. Это качественное исследование американских авиакомпании и коллекторов 1980-х, поэтому для цифр и межстрановых сравнений оно не подходит.",
 "这部奠定“情绪劳动”概念的经典提供了表层扮演、深层扮演与情感规则的分析框架。但它是对1980年代美国航空公司与催收行业的质性研究，不能作为数字或国际比较的依据。",
 "感情労働という概念の出発点となった古典で、表層演技・深層演技・感情規則という分析枠組みを与える。ただし1980年代の米国の航空会社と取り立て業者に関する質的研究であり、数値や国際比較の根拠にはならない。"],
["개념 정의와 '항공 승무원·채권 추심원'이라는 고전적 고강도 직군을 확인하는 근거로만 쓴다.",
 "Used only to define the concept and to identify flight attendants and bill collectors as the classic high-intensity occupations.",
 "Используется только для определения понятия и указания на бортпроводников и коллекторов как классические профессии высокой интенсивности.",
 "仅用于界定概念，并确认空乘与催收员这两类经典高强度职业。",
 "概念の定義と、客室乗務員・債権回収員という古典的な高強度職種を確認する根拠としてのみ用いる。"]);

E(2,"A","q1",2011,"Ute R. Hülsheger & Anna F. Schewe, Journal of Occupational Health Psychology 16(3): 361–389 (2011), PMID 21728441","On the costs and benefits of emotional labor: a meta-analysis of three decades of research","https://pubmed.ncbi.nlm.nih.gov/21728441/",
"substantial relationships of emotion-rule dissonance and surface acting with indicators of impaired well-being",
["95개 독립 연구(상관계수 494개)를 종합한 메타분석으로, 표면행위와 건강 악화의 연관(ρ .39~.48)을 가장 견고하게 보여준다. 대부분 횡단 상관이라 인과를 단정할 수 없고, 표본은 서구 국가에 치우쳐 있다.",
 "A meta-analysis of 95 independent studies (494 correlations), and the most robust evidence linking surface acting to impaired well-being (ρ .39–.48). Most data are cross-sectional correlations, so causality cannot be asserted, and samples lean towards Western countries.",
 "Метаанализ 95 независимых исследований (494 корреляции) — самое надёжное свидетельство связи поверхностной игры с ухудшением благополучия (ρ 0,39–0,48). Данные в основном кросс-секционные, причинность утверждать нельзя, выборки смещены к западным странам.",
 "这项汇总95项独立研究（494个相关系数）的元分析，最稳健地显示了表层扮演与健康受损之间的关联（ρ .39–.48）。但多为横断面相关，不能断定因果，样本也偏向西方国家。",
 "95件の独立研究（相関係数494件）を統合したメタ分析で、表層演技と健康悪化の関連（ρ .39〜.48）を最も頑健に示す。大半は横断的な相関で因果は断定できず、標本は欧米に偏っている。"],
["'감정을 꾸며내야 하는 일'이 건강을 해친다는 핵심 근거로 쓰고, 심층행위는 상대적으로 덜 해롭다는 점도 함께 반영한다.",
 "Used as the core evidence that jobs requiring faked emotion harm health, while noting that deep acting is comparatively less harmful.",
 "Используется как ключевое свидетельство вреда для здоровья от работы, требующей изображать чувства, с учётом того, что глубокая игра относительно менее вредна.",
 "作为“需要伪装情绪的工作损害健康”的核心依据，同时反映深层扮演危害相对较小这一点。",
 "「感情を装わなければならない仕事」が健康を損なうという中核的根拠とし、深層演技は相対的に害が小さい点もあわせて反映する。"]);

E(3,"A","q1",2019,"Liu J. et al., Occupational and Environmental Medicine 76(12): 927–937 (2019), PMID 31611310","Prevalence of workplace violence against healthcare workers: a systematic review and meta-analysis","https://pubmed.ncbi.nlm.nih.gov/31611310/",
"61.9% (95% CI 56.1% to 67.6%) reported exposure to any form of WPV",
["253개 연구, 33만 1,544명을 종합한 체계적 문헌고찰·메타분석이다. 지난 1년간 어떤 형태든 직장 폭력 경험 61.9%, 폭언 57.6%로 수치가 견고하지만, 연구 간 이질성이 크고 자기보고에 의존한다. 아시아·북미, 정신과·응급실, 간호사·의사에서 높았다.",
 "A systematic review and meta-analysis of 253 studies and 331,544 participants. The figures — 61.9% exposed to any workplace violence in the past year, 57.6% to verbal abuse — are robust, but heterogeneity is large and the data are self-reported. Rates were higher in Asia and North America, psychiatric and emergency settings, and among nurses and physicians.",
 "Систематический обзор и метаанализ 253 исследований с 331 544 участниками. Цифры — 61,9% сталкивались с насилием за год, 57,6% с вербальной агрессией — надёжны, но неоднородность велика, а данные самоотчётные. Выше всего — в Азии и Северной Америке, в психиатрии и неотложной помощи, у медсестёр и врачей.",
 "这是一项汇总253项研究、331,544名参与者的系统综述与元分析。过去一年遭受任何形式工作场所暴力61.9%、言语辱骂57.6%，数字稳健，但研究间异质性大且依赖自我报告。亚洲与北美、精神科与急诊、护士与医生中比例更高。",
 "253件の研究、33万1,544人を統合した系統的レビュー・メタ分析である。過去1年間に何らかの職場暴力を経験61.9%、暴言57.6%と数値は頑健だが、研究間の異質性が大きく自己申告に依存する。アジア・北米、精神科・救急、看護師・医師で高かった。"],
["보건의료가 폭언에서 폭력까지 이어지는 '극단형' 감정노동의 최상위 직군이라는 근거로 쓴다.",
 "Used as evidence that healthcare is the top occupational group for the extreme form of emotional labour that runs from verbal abuse to violence.",
 "Используется как свидетельство того, что здравоохранение — главная группа для крайней формы эмоционального труда, от брани до насилия.",
 "作为医疗是从辱骂延伸到暴力的“极端型”情绪劳动最高职业群的依据。",
 "医療が暴言から暴力にまで至る「極端型」感情労働の最上位職種であるという根拠として用いる。"]);

E(4,"B","io",2022,"World Health Organization & International Labour Organization, 2022-09-28","WHO and ILO call for new measures to tackle mental health issues at work","https://www.who.int/news/item/28-09-2022-who-and-ilo-call-for-new-measures-to-tackle-mental-health-issues-at-work",
"An estimated 12 billion workdays are lost annually due to depression and anxiety",
["WHO의 직장 정신건강 지침과 WHO·ILO 정책 요약을 소개한 공식 발표다. 연간 120억 근로일 손실은 우울·불안 전체에 대한 세계 추정치로, 감정노동만의 비용은 아니다.",
 "The official release introducing the WHO guidelines on mental health at work and a WHO/ILO policy brief. The 12 billion lost workdays are a global estimate for all depression and anxiety, not the cost of emotional labour alone.",
 "Официальное сообщение о руководстве ВОЗ по психическому здоровью на работе и аналитической записке ВОЗ/МОТ. 12 млрд потерянных рабочих дней — глобальная оценка для всей депрессии и тревожности, а не только эмоционального труда.",
 "这是介绍世卫组织《工作场所心理健康指南》与世卫组织/国际劳工组织政策简报的官方发布。每年损失120亿个工作日是针对全部抑郁与焦虑的全球估计，并非仅指情绪劳动的代价。",
 "WHOの職場のメンタルヘルス指針とWHO・ILOの政策要約を紹介した公式発表である。年間120億労働日の損失はうつ・不安全体の世界推計であり、感情労働だけのコストではない。"],
["감정노동 비용의 거시적 맥락과, 심리사회적 위험 관리가 사업주의 과제라는 국제 기준의 근거로만 쓴다.",
 "Used only as macro context for the cost of emotional labour and as the international norm that managing psychosocial risk is the employer's task.",
 "Используется только как макроконтекст цены эмоционального труда и как международная норма: управление психосоциальными рисками — задача работодателя.",
 "仅作为情绪劳动代价的宏观背景，以及“管理心理社会风险是雇主责任”这一国际标准的依据。",
 "感情労働のコストのマクロな文脈と、心理社会的リスク管理は事業主の課題だという国際基準の根拠としてのみ用いる。"]);

E(5,"B","survey",2022,"ILO, Lloyd's Register Foundation & Gallup, 2022-12-05","Experiences of Violence and Harassment at Work: A global first survey","https://www.ilo.org/resource/news/violence-and-harassment-work-has-affected-more-one-five-people",
"17.9 per cent of employed men and women said they had experienced psychological violence",
["121개국 약 7만 5천 명(2021년)을 조사한 첫 세계 조사로, 평생 경험 기준 약 23%가 폭력·괴롭힘을 겪었다. 피해자의 절반만 털어놓았다는 결과는 국가별 수치가 응답 문화에 따라 과소 측정될 수 있음을 뜻하며, 고객에 의한 것과 조직 내부의 것을 구분하지 않는다.",
 "The first global survey, covering about 75,000 people in 121 countries (2021): about 23% had experienced violence or harassment over their working life. That only half of victims had told anyone means national figures may be undercounted depending on reporting culture, and the survey does not separate customer-originated from internal harassment.",
 "Первый глобальный опрос около 75 000 человек в 121 стране (2021): примерно 23% сталкивались с насилием или домогательствами за трудовую жизнь. То, что лишь половина жертв кому-то рассказала, означает возможный недоучёт в зависимости от культуры, а опрос не разделяет притеснения со стороны клиентов и внутри организации.",
 "首次全球调查覆盖121个国家约7.5万人（2021年），按职业生涯经历计约23%遭受过暴力或骚扰。仅一半受害者曾向他人倾诉，说明各国数字可能因报告文化而被低估；该调查也未区分来自顾客与来自组织内部的骚扰。",
 "121か国・約7万5千人（2021年）を対象にした初の世界調査で、職業生活を通じて約23%が暴力・ハラスメントを経験した。被害者の半数しか打ち明けていないという結果は、国別の数値が回答文化によって過少に測られうることを意味し、顧客によるものと組織内部のものを区別していない。"],
["세계적 기준선과 '심리적 폭력이 가장 흔하다'는 근거로 쓰고, 국가 순위에는 쓰지 않는다.",
 "Used as a global baseline and as evidence that psychological violence is the most common form, not for national rankings.",
 "Используется как глобальная точка отсчёта и свидетельство того, что психологическое насилие — самая частая форма, но не для рейтинга стран.",
 "作为全球基准和“心理暴力最为常见”的依据，不用于国家排名。",
 "世界的な基準線と「心理的暴力が最も多い」ことの根拠として用い、国別順位には用いない。"]);

E(6,"B","io",2020,"Eurofound (Eiffe et al.), Policy brief, 2020-07-15","At your service: Working conditions of interactive service workers","https://www.eurofound.europa.eu/en/publications/all/your-service-working-conditions-interactive-service-workers",
"exposed to high emotional demands – such as having to hide their feelings",
["유럽 노동조건조사(EWCS 2015, EU27+영국)를 바탕으로 대면 서비스 노동자의 22%, 보건 최전선의 32%가 높은 감정 요구에 놓여 있다(전체 14%)고 분석했다. 대면 서비스직의 61%, 보건 최전선의 85%가 여성이다. 자료가 2015년이라 AI 확산 이전 상태다.",
 "Based on the European Working Conditions Survey (EWCS 2015, EU27 + UK), it finds 22% of interactive service workers and 32% of frontline health workers face high emotional demands (14% of all employees). Women make up 61% of interactive service workers and 85% of frontline health workers. The data predate the spread of AI.",
 "На основе Европейского обследования условий труда (EWCS 2015, ЕС-27 + Великобритания): высокие эмоциональные требования у 22% работников интерактивного обслуживания и 32% медиков «первой линии» (14% всех занятых). Женщины — 61% и 85% соответственно. Данные относятся ко времени до распространения ИИ.",
 "基于欧洲工作条件调查（EWCS 2015，欧盟27国+英国），分析显示22%的面对面服务劳动者和32%的一线医疗人员面临高情绪要求（全体雇员为14%）。面对面服务人员61%、一线医疗人员85%为女性。数据早于AI普及。",
 "欧州労働条件調査（EWCS 2015、EU27＋英国）をもとに、対面サービス労働者の22%、医療の最前線の32%が高い感情的要求にさらされている（全体14%）と分析した。対面サービスの61%、医療最前線の85%が女性である。データは2015年でAI普及以前の状態である。"],
["유럽에서 대면 서비스·보건 직군의 감정 요구가 평균보다 높고, 그 부담이 여성에게 집중된다는 근거로 쓴다.",
 "Used as evidence that in Europe emotional demands in face-to-face service and health jobs exceed the average, and that the burden falls mainly on women.",
 "Используется как свидетельство того, что в Европе эмоциональные требования в сфере обслуживания и здравоохранения выше средних и ложатся в основном на женщин.",
 "作为欧洲面对面服务与医疗岗位情绪要求高于平均、且负担集中于女性的依据。",
 "欧州で対面サービス・医療職の感情的要求が平均より高く、その負担が女性に集中するという根拠として用いる。"]);

E(7,"B","survey",2025,"EU-OSHA, ESENER 2024 first findings (press release 2025-02-07)","Prolonged sitting, psychosocial risks and digitalisation top workplace safety and health concerns, new EU survey reveals","https://osha.europa.eu/en/about-eu-osha/press-room/prolonged-sitting-psychosocial-risks-and-digitalisation-top-workplace-safety-and-health-concerns-new-eu-survey-reveals",
"56% of organisations identifying the challenge of dealing with difficult customers, patients or pupils",
["30개국 4만 1천여 사업장을 조사한 유럽 기업 위험 조사의 첫 결과다. 노동자가 아니라 사업장 응답자의 인식이며, 2019년 59%에서 2024년 56%로 소폭 낮아졌다. 조직의 25%는 심리사회적 위험의 존재를 인식하지 못했다.",
 "First results of the European enterprise risk survey of over 41,000 workplaces in 30 countries. It reflects respondents' perceptions at establishment level, not workers', and the share fell slightly from 59% in 2019 to 56% in 2024. A quarter of organisations did not recognise the presence of psychosocial risks.",
 "Первые результаты европейского опроса предприятий о рисках: более 41 000 рабочих мест в 30 странах. Это восприятие респондентов на уровне предприятия, а не работников; доля немного снизилась с 59% (2019) до 56% (2024). Четверть организаций не признаёт наличия психосоциальных рисков.",
 "这是覆盖30国4.1万余个工作场所的欧洲企业风险调查首批结果。反映的是机构层面受访者的认知而非劳动者本人，比例从2019年的59%小幅降至2024年的56%。25%的组织未认识到心理社会风险的存在。",
 "30か国・4万1千余りの事業所を対象とした欧州企業リスク調査の初回結果である。労働者ではなく事業所回答者の認識であり、2019年の59%から2024年の56%へやや低下した。組織の25%は心理社会的リスクの存在を認識していなかった。"],
["유럽 사업장에서 '까다로운 고객 응대'가 가장 흔한 심리사회적 위험이라는 근거로 쓴다.",
 "Used as evidence that dealing with difficult customers is the most common psychosocial risk in European workplaces.",
 "Используется как свидетельство того, что работа с трудными клиентами — самый частый психосоциальный риск на европейских предприятиях.",
 "作为“应对难缠顾客”是欧洲工作场所最常见心理社会风险的依据。",
 "欧州の事業所で「難しい顧客への対応」が最も多い心理社会的リスクであるという根拠として用いる。"]);

E(8,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — South Korea (data Jan–Dec 2025)","State of the Global Workplace: South Korea Country-Level Data","https://www.gallup.com/workplace/707186/state-global-workplace-south-korea-country-level-data.aspx",
"In South Korea, 39% of employees experienced stress a lot of the previous day",
["모든 나라에 같은 문항을 쓰는 갤럽 세계 조사라 국가 비교에 적합하지만, '전날 경험한 정서'를 묻는 일반 지표여서 감정노동을 직접 측정하지 않는다. 한국은 스트레스 39%, 분노 19%, 몰입 13%이고, '좋은 일자리를 구하기 쉽다'는 응답이 27%로 동아시아 평균(58%)의 절반 이하다.",
 "Gallup's world survey asks the same items in every country, which suits comparison, but it measures emotions felt the previous day in general, not emotional labour itself. Korea: stress 39%, anger 19%, engagement 13%; only 27% say it is a good time to find a job, under half the East Asian average (58%).",
 "Глобальный опрос Gallup задаёт одинаковые вопросы во всех странах, что удобно для сравнения, но измеряет общие эмоции предыдущего дня, а не сам эмоциональный труд. Корея: стресс 39%, гнев 19%, вовлечённость 13%; лишь 27% считают, что сейчас легко найти работу, — менее половины среднего по Восточной Азии (58%).",
 "盖洛普全球调查在各国使用相同问题，适合比较，但它询问的是前一天体验到的一般情绪，并不直接测量情绪劳动。韩国压力39%、愤怒19%、敬业13%；认为“现在容易找到好工作”的仅27%，不到东亚平均（58%）的一半。",
 "すべての国で同じ設問を使うギャラップ世界調査で国際比較に適するが、「前日に経験した感情」を尋ねる一般指標であり、感情労働を直接測定してはいない。韓国はストレス39%、怒り19%、エンゲージメント13%で、「良い仕事を見つけやすい」は27%と東アジア平均（58%）の半分以下である。"],
["한국의 일반 스트레스는 세계 평균 수준이지만 이직이 어려운 노동시장이 감정노동을 '참게 만드는' 조건이라는 배경 근거로 쓴다.",
 "Used as background: Korea's general stress is at the world average, but a labour market where switching jobs is hard is a condition that makes workers endure emotional labour.",
 "Используется как фон: общий стресс в Корее на уровне мирового, но рынок труда, где трудно сменить работу, вынуждает терпеть эмоциональный труд.",
 "作为背景依据：韩国的一般压力处于世界平均水平，但难以换工作的劳动力市场是让人“忍受”情绪劳动的条件。",
 "韓国の一般的ストレスは世界平均並みだが、転職しにくい労働市場が感情労働を「我慢させる」条件であるという背景の根拠として用いる。"]);

E(9,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — Japan (data Jan–Dec 2025)","State of the Global Workplace: Japan Country-Level Data","https://www.gallup.com/workplace/705794/state-global-workplace-japan-country-level-data.aspx",
"In Japan, 8% of employees are engaged at work.",
["일본은 스트레스 39%, 분노 13%, 슬픔 9%, 외로움 11%로 부정 정서 응답이 비교국 중 가장 낮지만, 직무 몰입은 8%로 가장 낮다. 낮은 부정 정서가 실제로 덜 느껴서인지, 표현을 억제하는 응답 문화 때문인지는 이 자료로 가릴 수 없다.",
 "Japan reports the lowest negative emotions among the comparison countries — stress 39%, anger 13%, sadness 9%, loneliness 11% — but also the lowest engagement, 8%. These data cannot tell whether low negative emotion reflects feeling less or a response culture that suppresses expression.",
 "В Японии самые низкие среди сравниваемых стран показатели негативных эмоций — стресс 39%, гнев 13%, грусть 9%, одиночество 11%, — но и самая низкая вовлечённость, 8%. Эти данные не позволяют понять, чувствуют ли японцы меньше или культура ответов подавляет выражение эмоций.",
 "日本的负面情绪在比较国中最低——压力39%、愤怒13%、悲伤9%、孤独11%——但敬业度也最低，仅8%。这些数据无法判断负面情绪低是因为感受少，还是因为抑制表达的回答文化。",
 "日本はストレス39%、怒り13%、悲しみ9%、孤独11%と負の感情の回答が比較国中で最も低いが、エンゲージメントも8%と最も低い。負の感情が低いのが実際に感じていないためか、表出を抑える回答文化のためかは、この資料では判別できない。"],
["낮은 정서 응답을 '가벼운 감정노동'으로 읽지 않고, 감정 억제와 낮은 몰입이 겹친 상태로 해석하는 근거로 쓴다.",
 "Used to interpret Japan not as a case of light emotional labour but as a combination of emotional suppression and low engagement.",
 "Используется, чтобы трактовать Японию не как случай «лёгкого» эмоционального труда, а как сочетание подавления эмоций и низкой вовлечённости.",
 "用于把日本解读为情绪抑制与低敬业度叠加的状态，而不是“情绪劳动较轻”。",
 "日本を「軽い感情労働」ではなく、感情の抑制と低いエンゲージメントが重なった状態と解釈する根拠として用いる。"]);

E(10,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — United States (data Jan–Dec 2025)","State of the Global Workplace: United States Country-Level Data","https://www.gallup.com/workplace/704063/state-global-workplace-united-states-country-level-data.aspx",
"50% of employees experienced stress a lot of the previous day",
["미국은 스트레스 50%로 비교국 중 가장 높지만 몰입 32%, 삶 평가 '번영' 51%도 가장 높다. 분노는 18%로 세계 평균(22%)보다 낮다. 고강도이지만 보상도 큰 노동 환경일 가능성을 시사하나, 업종·직군별 분해는 없다.",
 "The US has the highest stress among the comparison countries (50%) but also the highest engagement (32%) and share 'thriving' (51%); anger is 18%, below the global 22%. It suggests a high-intensity but high-reward work environment, though there is no breakdown by industry or occupation.",
 "В США самый высокий стресс среди сравниваемых стран (50%), но и самая высокая вовлечённость (32%) и доля «процветающих» (51%); гнев 18%, ниже мировых 22%. Это указывает на интенсивную, но хорошо вознаграждаемую среду, хотя разбивки по отраслям нет.",
 "美国压力50%为比较国最高，但敬业度32%、生活评价“兴旺”51%也最高；愤怒18%，低于全球22%。这暗示高强度但高回报的工作环境，但没有按行业或职业的细分。",
 "米国はストレス50%で比較国中最も高いが、エンゲージメント32%、生活評価「繁栄」51%も最も高い。怒りは18%で世界平均（22%）より低い。高強度だが報酬も大きい労働環境の可能性を示すが、業種・職種別の分解はない。"],
["미국을 '일반 스트레스 최상위' 국가로 분류하는 근거로 쓴다.",
 "Used to classify the US as the top country for general work stress.",
 "Используется для отнесения США к странам с наивысшим общим рабочим стрессом.",
 "用于把美国归为“一般压力最高”的国家。",
 "米国を「一般的ストレス最上位」の国に分類する根拠として用いる。"]);

E(11,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — United Kingdom (data Jan–Dec 2025)","State of the Global Workplace: United Kingdom Country-Level Data","https://www.gallup.com/workplace/707546/state-global-workplace-united-kingdom-country-level-data.aspx",
"This reflects a 5-point increase from the prior three-year rolling average",
["영국은 스트레스 46%로 유럽 평균(39%)보다 높고 직전 3년 평균보다 5%p 올랐다. 슬픔 22%, 외로움 18%도 유럽 평균보다 높다. 분노는 15%로 유럽 평균과 같다.",
 "UK stress is 46%, above the European average (39%) and up 5 points on the prior three-year average. Sadness (22%) and loneliness (18%) are also above the European average; anger (15%) equals it.",
 "Стресс в Великобритании — 46%, выше среднеевропейских 39% и на 5 п.п. выше среднего за три предыдущих года. Грусть (22%) и одиночество (18%) тоже выше средних по Европе; гнев (15%) — на уровне среднего.",
 "英国压力46%，高于欧洲平均（39%），比前三年滚动平均上升5个百分点。悲伤22%、孤独18%也高于欧洲平均；愤怒15%与欧洲平均持平。",
 "英国はストレス46%で欧州平均（39%）より高く、直前3年平均より5ポイント上昇した。悲しみ22%、孤独18%も欧州平均より高い。怒りは15%で欧州平均と同じである。"],
["영국의 스트레스가 유럽에서 높고 상승 중이라는 근거로, 업계 조사(20)의 적대 경험과 같은 방향인지 확인하는 데 쓴다.",
 "Used as evidence that UK stress is high for Europe and rising, and to check that it points the same way as the hostility reported in the industry survey (20).",
 "Используется как свидетельство высокого и растущего для Европы стресса в Великобритании и для проверки согласия с данными отраслевого опроса о враждебности (20).",
 "作为英国压力在欧洲偏高且上升的依据，并用于确认其与行业调查（20）中的敌意经历方向一致。",
 "英国のストレスが欧州で高く上昇中であることの根拠とし、業界調査（20）の敵対経験と同じ方向かを確かめるのに用いる。"]);

E(12,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — Germany (data Jan–Dec 2025)","State of the Global Workplace: Germany Country-Level Data","https://www.gallup.com/workplace/705434/state-global-workplace-germany-country-level-data.aspx",
"13% of employees experienced anger a lot of the previous day",
["독일은 스트레스 38%, 분노 13%로 비교국 가운데 가장 낮은 축이며, '좋은 일자리를 구하기 쉽다'는 응답이 67%로 높다. 다만 몰입은 11%로 낮아, 정서 부담이 낮다는 것이 곧 일에 대한 만족을 뜻하지는 않는다.",
 "Germany is at the low end of the comparison countries for stress (38%) and anger (13%), and 67% say it is a good time to find a job. Engagement is only 11%, though, so a low emotional burden does not equal satisfaction with work.",
 "Германия — на нижнем краю среди сравниваемых стран по стрессу (38%) и гневу (13%), 67% считают, что найти работу сейчас легко. Но вовлечённость лишь 11%, так что низкая эмоциональная нагрузка не равна удовлетворённости работой.",
 "德国压力38%、愤怒13%，处于比较国最低一档，认为“容易找到好工作”的达67%。但敬业度仅11%，情绪负担低并不等于对工作满意。",
 "ドイツはストレス38%、怒り13%で比較国の中で最も低い側にあり、「良い仕事を見つけやすい」は67%と高い。ただしエンゲージメントは11%と低く、感情的負担が低いことが仕事への満足を意味するわけではない。"],
["유럽(독일)을 비교국 중 정서 부담이 가장 낮은 축으로 두고, 노동시장 여건이 완충일 가능성을 추론하는 데 쓴다.",
 "Used to place Europe (Germany) at the low end of emotional burden among the comparison countries and to infer that labour-market conditions may act as a buffer.",
 "Используется, чтобы поместить Европу (Германию) на нижний край эмоциональной нагрузки и предположить буферную роль рынка труда.",
 "用于把欧洲（德国）置于比较国中情绪负担最低的一端，并推断劳动力市场条件可能起到缓冲作用。",
 "欧州（ドイツ）を比較国中で感情的負担が最も低い側に置き、労働市場の状況が緩衝になっている可能性を推論するのに用いる。"]);

E(13,"B","survey",2026,"Gallup, State of the Global Workplace: 2026 Report — China (data Jan–Dec 2025)","State of the Global Workplace: China Country-Level Data","https://www.gallup.com/workplace/704906/state-global-workplace-china-country-level-data.aspx",
"In China, 48% of employees experienced stress a lot of the previous day",
["중국은 스트레스 48%, 분노 21%, 외로움 25%로 부정 정서가 비교국 상위권이며, 분노는 직전 평균보다 3%p 올랐다. 조사 환경상 응답 편향이 있을 수 있고, 중국의 감정노동을 직접 측정한 국제 비교 자료는 본 보고서 근거 범위에서 찾지 못했다.",
 "China ranks high among the comparison countries for negative emotions — stress 48%, anger 21%, loneliness 25% — with anger up 3 points on the prior average. The survey context may bias responses, and this report found no internationally comparable data directly measuring emotional labour in China.",
 "Китай — в верхней части по негативным эмоциям: стресс 48%, гнев 21%, одиночество 25%, гнев вырос на 3 п.п. Условия опроса могут смещать ответы, а сопоставимых данных, прямо измеряющих эмоциональный труд в Китае, в рамках источников этого доклада не найдено.",
 "中国压力48%、愤怒21%、孤独25%，负面情绪居比较国前列，愤怒比此前平均上升3个百分点。调查环境可能带来回答偏差，本报告依据范围内也未找到直接测量中国情绪劳动的国际可比数据。",
 "中国はストレス48%、怒り21%、孤独25%と負の感情が比較国の上位で、怒りは直前平均より3ポイント上昇した。調査環境による回答の偏りがありうるうえ、中国の感情労働を直接測った国際比較資料は本報告の根拠範囲では見つからなかった。"],
["중국을 일반 정서 부담이 높은 국가로 분류하되, 감정노동 순위에는 신중하게 쓴다.",
 "Used to classify China as a country with a high general emotional burden, but used cautiously in any emotional-labour ranking.",
 "Используется для отнесения Китая к странам с высокой общей эмоциональной нагрузкой, но осторожно в рейтинге эмоционального труда.",
 "用于把中国归为一般情绪负担较高的国家，但在情绪劳动排名中谨慎使用。",
 "中国を一般的な感情的負担の高い国に分類するが、感情労働の順位づけには慎重に用いる。"]);

E(14,"B","io",2025,"OECD, Results from TALIS 2024, Chapter 'The demands of teaching' (2025)","The demands of teaching: Results from TALIS 2024","https://www.oecd.org/en/publications/results-from-talis-2024_90df6235-en/full-report/the-demands-of-teaching_0e941e2f.html",
"for more than 50% in Japan, Korea, Lithuania, Portugal and Slovenia",
["같은 문항으로 여러 나라 교사를 조사한 OECD 교원 국제조사로, '학부모·보호자 민원 대응'을 스트레스 원인으로 꼽은 비율이 평균 약 42%였고 일본·한국 등 5개국은 50%를 넘었다. 여성 교사 44%, 남성 35%로 성별 차이도 크다. 자기보고 지표다.",
 "The OECD international teacher survey asks the same items across countries: on average about 42% of teachers cite addressing parents' or guardians' concerns as a source of stress, and in five systems including Japan and Korea it exceeds 50%. The gender gap is large (44% of women, 35% of men). It is a self-reported measure.",
 "Международный опрос учителей ОЭСР с одинаковыми вопросами: в среднем около 42% учителей называют работу с претензиями родителей источником стресса, а в пяти системах, включая Японию и Корею, — более 50%. Разрыв по полу велик (44% женщин, 35% мужчин). Это самоотчётный показатель.",
 "这是在多国用相同问题调查教师的经合组织国际调查：平均约42%的教师把应对家长或监护人的诉求视为压力来源，日本、韩国等5个体系超过50%。女教师44%、男教师35%，性别差距也大。属自我报告指标。",
 "同じ設問で各国の教員を調べたOECD国際教員調査で、「保護者の懸念への対応」をストレス要因に挙げた割合は平均約42%、日本・韓国など5か国は50%を超えた。女性教員44%、男性35%と男女差も大きい。自己申告の指標である。"],
["교사의 '학부모 감정노동'이 한·일에서 국제적으로 가장 무겁다는 직접 국가 비교 근거로 쓴다.",
 "Used as direct cross-country evidence that teachers' emotional labour towards parents is among the heaviest internationally in Korea and Japan.",
 "Используется как прямое межстрановое свидетельство того, что эмоциональный труд учителей в отношениях с родителями в Корее и Японии один из самых тяжёлых в мире.",
 "作为韩日教师面向家长的情绪劳动在国际上最为沉重的直接国家比较依据。",
 "教員の「保護者に対する感情労働」が日韓で国際的に最も重いという直接の国際比較の根拠として用いる。"]);
