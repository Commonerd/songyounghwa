E(15,"B","io",2015,"고용노동부·한국고용정보원 보도자료, 2015-10-13 (2014 재직자조사, 730개 직업)","감정노동 강도 가장 센 직업은 텔레마케터","https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=6049",
"감정노동의 강도가 가장 센 직업은 텔레마케터(전화통신판매원)인 것으로 나타났다",
["730개 직업 종사자 조사로 대인 접촉 빈도, 외부 고객·민원인 대응 중요도, 불쾌하거나 화난 사람을 대하는 빈도를 합산했다. 감정 숨기기 같은 정서 억제는 직접 재지 않았고, 10년 전 자료라 AI 상담 도입 이후의 변화는 담지 못한다.",
 "A survey of workers in 730 occupations that sums frequency of interpersonal contact, importance of dealing with external customers or the public, and frequency of dealing with unpleasant or angry people. It does not directly measure emotional suppression such as hiding feelings, and at ten years old it predates AI contact centres.",
 "Опрос работников 730 профессий, суммирующий частоту межличностных контактов, важность работы с внешними клиентами и гражданами и частоту общения с неприятными или рассерженными людьми. Подавление эмоций напрямую не измерялось, а данным десять лет — до появления ИИ-контакт-центров.",
 "这项对730种职业从业者的调查汇总了人际接触频率、应对外部顾客或民众的重要性、以及应对令人不快或愤怒之人的频率。未直接测量隐藏情绪等情绪抑制，且是十年前的数据，未能反映AI客服引入后的变化。",
 "730職業の従事者調査で、対人接触の頻度、外部の顧客・住民対応の重要度、不快な人や怒った人に対応する頻度を合算した。感情を隠すといった感情抑制は直接測っておらず、10年前の資料のためAI応対導入後の変化は反映していない。"],
["한국 직군 순위의 기준선으로 쓴다: 감정노동 강도 상위는 텔레마케터·호텔관리자·네일아티스트·중독치료사, 화난 고객 빈도 상위는 텔레마케터·경찰관·보건위생 및 환경검사원·항공기 객실승무원이다.",
 "Used as the baseline for Korea's occupational ranking: highest intensity for telemarketers, hotel managers, nail artists and addiction counsellors; highest frequency of angry customers for telemarketers, police officers, health and environmental inspectors and flight attendants.",
 "Используется как базовая линия корейского рейтинга: наибольшая интенсивность — телемаркетологи, управляющие отелей, мастера маникюра, консультанты по зависимостям; чаще всего с рассерженными клиентами — телемаркетологи, полицейские, санитарные инспекторы и бортпроводники.",
 "作为韩国职业排名的基准：情绪劳动强度最高的是电话营销员、酒店管理者、美甲师、成瘾治疗师；应对愤怒顾客最频繁的是电话营销员、警察、卫生与环境检查员、空乘。",
 "韓国の職種順位の基準線として用いる。感情労働の強度上位はテレマーケター・ホテル管理者・ネイリスト・依存症治療士、怒った顧客への対応頻度上位はテレマーケター・警察官・保健衛生及び環境検査員・客室乗務員である。"]);

E(16,"A","stat",2026,"U.S. Department of Labor, O*NET OnLine — Work Context (accessed 2026-11)","Work Context — Dealing With Unpleasant, Angry, or Discourteous People","https://www.onetonline.org/find/descriptor/result/4.C.1.d.2",
"How frequently does the worker have to deal with unpleasant, angry, or discourteous individuals",
["미국 노동부가 재직자 조사를 바탕으로 운영하는 공식 직업 데이터베이스로, 911개 직업을 0~100(100=매일) 척도로 비교한다. 직업 간 비교에는 가장 정밀하지만 미국 직업 구조 기준이며, 빈도만 재고 강도나 피해는 재지 않는다.",
 "The official occupational database the US Department of Labor maintains from incumbent surveys, comparing 911 occupations on a 0–100 scale (100 = every day). It is the most precise basis for comparing occupations, but it reflects the US occupational structure and measures frequency only, not intensity or harm.",
 "Официальная база данных профессий Министерства труда США на основе опросов работников: 911 профессий по шкале 0–100 (100 = каждый день). Это самая точная основа для сравнения профессий, но отражает структуру занятости США и измеряет лишь частоту, а не интенсивность или вред.",
 "美国劳工部基于在职者调查运营的官方职业数据库，以0–100（100=每天）比较911种职业。是职业比较最精确的依据，但以美国职业结构为准，只测频率不测强度或伤害。",
 "米国労働省が在職者調査に基づいて運営する公式の職業データベースで、911職業を0〜100（100＝毎日）の尺度で比較する。職業間比較には最も精密だが米国の職業構造が基準で、頻度のみを測り強度や被害は測らない。"],
["직군별 '화난 사람 상대 빈도'의 공식 비교 기준으로 쓴다: 교정직·응급의학 의사 94, 긴급신고 접수원 93, 채권 추심원 91, 객실승무원 90, 고객상담원 80, 간호사 79, 텔레마케터 79, 계산원 78, 초등교사 76, 소매 판매원 72, 소프트웨어 개발자 12.",
 "Used as the official benchmark for how often each occupation deals with angry people: correctional officers and emergency physicians 94, public-safety telecommunicators 93, bill collectors 91, flight attendants 90, customer service representatives 80, registered nurses 79, telemarketers 79, cashiers 78, elementary teachers 76, retail salespersons 72, software developers 12.",
 "Используется как официальный ориентир частоты общения с рассерженными людьми: сотрудники исправительных учреждений и врачи неотложной помощи 94, операторы экстренных служб 93, коллекторы 91, бортпроводники 90, операторы клиентской службы 80, медсёстры 79, телемаркетологи 79, кассиры 78, учителя начальной школы 76, продавцы 72, разработчики ПО 12.",
 "作为各职业“应对愤怒之人频率”的官方比较基准：狱警与急诊医生94、紧急呼叫接线员93、催收员91、空乘90、客服代表80、注册护士79、电话营销员79、收银员78、小学教师76、零售销售员72、软件开发者12。",
 "職種別の「怒った人に対応する頻度」の公式比較基準として用いる。矯正職員・救急医94、緊急通報受付員93、債権回収員91、客室乗務員90、顧客サービス担当80、看護師79、テレマーケター79、レジ係78、小学校教員76、小売販売員72、ソフトウェア開発者12。"]);

E(17,"A","stat",2020,"U.S. Bureau of Labor Statistics, Fact sheet (April 2020)","Workplace Violence in Healthcare, 2018","https://www.bls.gov/iif/factsheets/workplace-violence-healthcare-2018.htm",
"accounted for 73 percent of all nonfatal workplace injuries and illnesses due to violence",
["미국 공식 산재 통계로, 2018년 폭력으로 인한 비치명적 재해의 73%가 보건의료 종사자에게 발생했다. 민간 산업의 휴업 사례만 포함하고 신고되지 않은 폭언·위협은 빠져 있어 실제 규모의 하한이다.",
 "Official US injury statistics: in 2018, 73% of nonfatal injuries due to violence occurred among healthcare workers. Only private-industry days-away cases are counted, and unreported verbal abuse and threats are excluded, so it is a lower bound.",
 "Официальная статистика травматизма США: в 2018 году 73% нефатальных травм от насилия пришлись на медиков. Учтены лишь случаи с потерей рабочих дней в частном секторе, а незаявленные оскорбления и угрозы не входят, так что это нижняя граница.",
 "美国官方工伤统计：2018年因暴力导致的非致命伤害中，73%发生在医疗卫生从业者身上。只计入私营行业的误工案例，未报告的辱骂与威胁未计入，因此是实际规模的下限。",
 "米国の公式労災統計で、2018年に暴力による非致死的災害の73%が医療従事者に発生した。民間産業の休業事例のみを含み、届け出のない暴言・脅迫は含まれないため、実際の規模の下限である。"],
["감정노동이 신체 위험으로 이어지는 지점이 의료 현장이라는 공식 근거로 쓴다.",
 "Used as official evidence that the point where emotional labour turns into physical danger is healthcare.",
 "Используется как официальное свидетельство того, что точка перехода эмоционального труда в физическую опасность — здравоохранение.",
 "作为情绪劳动演变为身体危险的场所是医疗现场的官方依据。",
 "感情労働が身体的危険につながる地点が医療現場であるという公式の根拠として用いる。"]);

E(18,"B","survey",2024,"厚生労働省 委託事業（PwCコンサルティング）, 令和5年度「職場のハラスメントに関する実態調査」報告書概要, 2024-05-17","職場のハラスメントに関する実態調査 報告書（概要）","https://www.mhlw.go.jp/content/11909000/001259093.pdf",
"顧客等からの著しい迷惑行為は10.8%（－4.2％）",
["노동자 8,000명(최근 3년)과 기업을 조사한 일본 정부 위탁 조사다. 고객 괴롭힘 경험은 10.8%로 2020년보다 4.2%p 낮지만, 상담을 받은 기업은 27.9%(+8.4%p)로 늘었다. 업종별로 생활 관련 서비스·오락 16.6%, 도소매 16.0%, 숙박·음식 16.0%, 의료·복지 15.1%, 제조 4.6%이고, 고객을 거의 매일 대하면 17.4%, 거의 대하지 않으면 5.3%였다. 온라인 패널 조사라 대표성에 한계가 있다.",
 "A Japanese government-commissioned survey of 8,000 workers (past three years) and of firms. Experience of customer harassment was 10.8%, down 4.2 points from 2020, but firms receiving complaints rose to 27.9% (+8.4 points). By industry: living-related services and entertainment 16.6%, wholesale and retail 16.0%, accommodation and food 16.0%, medical and welfare 15.1%, manufacturing 4.6%; 17.4% among those dealing with customers almost daily versus 5.3% among those rarely doing so. As an online-panel survey, representativeness is limited.",
 "Опрос по заказу правительства Японии: 8000 работников (за три года) и компании. С притеснениями клиентов сталкивались 10,8% — на 4,2 п.п. меньше, чем в 2020, но доля компаний с обращениями выросла до 27,9% (+8,4). По отраслям: бытовые услуги и развлечения 16,6%, торговля 16,0%, гостиницы и общепит 16,0%, медицина и соцобеспечение 15,1%, производство 4,6%; при почти ежедневном контакте с клиентами — 17,4%, почти без контакта — 5,3%. Онлайн-панель ограничивает репрезентативность.",
 "日本政府委托、对8000名劳动者（近三年）及企业的调查。遭受顾客骚扰的比例为10.8%，比2020年低4.2个百分点，但收到相关咨询的企业升至27.9%（+8.4）。按行业：生活相关服务与娱乐16.6%、批发零售16.0%、住宿餐饮16.0%、医疗福利15.1%、制造业4.6%；几乎每天接待顾客者17.4%，几乎不接触者5.3%。属在线样本调查，代表性有限。",
 "労働者8,000人（過去3年）と企業を対象にした政府委託調査である。顧客からの著しい迷惑行為の経験は10.8%で2020年度より4.2ポイント低いが、相談があった企業は27.9%（＋8.4ポイント）に増えた。業種別では生活関連サービス・娯楽16.6%、卸売・小売16.0%、宿泊・飲食16.0%、医療・福祉15.1%、製造4.6%、顧客とほぼ毎日接する人は17.4%、ほとんど接しない人は5.3%だった。オンラインパネル調査で代表性に限界がある。"],
["일본의 업종별·접객 빈도별 비교와 '접객이 잦을수록 피해가 크다'는 용량-반응 관계의 근거로 쓴다.",
 "Used for Japan's comparisons by industry and contact frequency, and as evidence of a dose–response relation: the more customer contact, the more harassment.",
 "Используется для сравнения Японии по отраслям и частоте контактов и как свидетельство зависимости «доза — эффект»: чем больше контактов, тем больше притеснений.",
 "用于日本按行业和接待频率的比较，以及“接待越频繁、受害越多”的剂量反应关系依据。",
 "日本の業種別・接客頻度別の比較と、「接客が多いほど被害が大きい」という用量反応関係の根拠として用いる。"]);

E(19,"C","survey",2024,"労働政策研究・研修機構（JILPT）ビジネス・レーバー・トレンド 2024年8・9月号（UAゼンセン調査, 2024年1〜3月, 3万3千件超）","迷惑行為の被害にあった人の割合は46.8％に低下したものの、勤務先の4割で対策が見えず","https://www.jil.go.jp/kokunai/blt/backnumber/2024/08_09/shuzai_01.html",
"直近2年以内で迷惑行為の被害にあった人の割合は46.8％",
["유통·서비스 노동조합 조합원 3만 3천여 명의 응답으로, 무작위 표본이 아니고 고객 접점이 많은 직무에 치우쳐 있다. 2020년 56.7%에서 낮아졌지만 '특별한 대책이 없다'는 응답이 42.2%로 거의 변하지 않았다.",
 "Responses from over 33,000 members of a retail and service union — not a random sample, and skewed to customer-facing jobs. The rate fell from 56.7% in 2020, but 42.2% still said there were no particular measures at work, almost unchanged.",
 "Ответы более 33 000 членов профсоюза торговли и услуг — выборка не случайная и смещена к работе с клиентами. Доля снизилась с 56,7% в 2020 году, но 42,2% по-прежнему говорят, что никаких особых мер нет, почти без изменений.",
 "来自零售与服务业工会3.3万余名会员的回答，并非随机样本，偏向接触顾客较多的岗位。比例从2020年的56.7%下降，但回答“没有特别对策”的仍有42.2%，几乎没有变化。",
 "流通・サービス産業の労働組合員3万3千人超の回答で、無作為標本ではなく顧客接点の多い職務に偏っている。2020年の56.7%から低下したが、「特に対策はなされていない」は42.2%でほとんど変わらなかった。"],
["일본 서비스 현장의 피해율이 노동자 전체(10.8%)보다 훨씬 높고 현장 대책이 느리다는 방향성 근거로만 쓴다.",
 "Used only as directional evidence that victimisation in Japanese service workplaces is far higher than among all workers (10.8%) and that workplace measures lag.",
 "Используется лишь как свидетельство направления: в японской сфере услуг доля пострадавших намного выше, чем среди всех работников (10,8%), а меры на местах запаздывают.",
 "仅作为方向性依据：日本服务现场的受害率远高于全体劳动者（10.8%），且现场对策迟缓。",
 "日本のサービス現場の被害率が労働者全体（10.8%）よりはるかに高く、現場の対策が遅いことの方向性を示す根拠としてのみ用いる。"]);

E(20,"C","survey",2023,"The Institute of Customer Service, press release 2023-11-15","Nearly one-third (31%) of UK service workers consider leaving their role after abuse","https://www.instituteofcustomerservice.com/uk-service-workers-abuse/",
"more than a third (36%) experiencing hostility in the last six months",
["영국 고객서비스 업계 단체의 조사로, 최근 6개월 적대 경험 36%, 그로 인한 병가 20%(평균 9일), 신고 44%, 이직 고려 31%를 보고했다. 방법 공개가 제한적이고 업계 캠페인의 일부다.",
 "A survey by the UK customer-service industry body reporting hostility in the past six months for 36%, sick leave as a result for 20% (nine days on average), reporting by 44% and thoughts of leaving for 31%. Methodological disclosure is limited and it is part of an industry campaign.",
 "Опрос британской отраслевой организации клиентского сервиса: враждебность за полгода — 36%, больничный из-за неё — 20% (в среднем 9 дней), сообщили о случаях 44%, думали об уходе 31%. Методика раскрыта ограниченно, опрос — часть отраслевой кампании.",
 "英国客户服务行业机构的调查：近6个月遭遇敌意36%，因此请病假20%（平均9天），上报44%，考虑离职31%。方法披露有限，且属于行业宣传活动的一部分。",
 "英国の顧客サービス業界団体の調査で、直近6か月の敵対経験36%、それによる病欠20%（平均9日）、報告44%、離職検討31%を報告した。方法の開示は限られ、業界キャンペーンの一部である。"],
["영국 대면 서비스직의 적대 경험과 병가·이직이라는 '비용의 마지막 단계'를 보여주는 방향성 근거로 쓴다.",
 "Used as directional evidence of hostility towards UK front-line service staff and of the last stage of the cost — sick leave and quitting.",
 "Используется как свидетельство направления: враждебность к британскому персоналу и «последняя стадия» издержек — больничные и уходы.",
 "作为英国面对面服务人员遭遇敌意及“代价最后阶段”（病假与离职）的方向性依据。",
 "英国の対面サービス職の敵対経験と、病欠・離職という「コストの最終段階」を示す方向性の根拠として用いる。"]);

E(21,"C","press",2026,"한국교육신문 (한국교육개발원 김나영, 「통계로 본 교육활동 침해 현황」), 2026-09-01","교육활동 침해 심의 감소세 불구 여전히 높은 수준","https://www.hangyo.com/news/article.html?no=109077",
"초등학교는 보호자에 의한 침해 비중이 상대적으로 높아",
["교원단체 신문이 한국교육개발원 분석을 전한 기사다. 교권보호위원회 개최는 2020학년도 1,197건 → 2023학년도 5,050건 → 2025학년도 4,034건이며, 2024년 3월 심의 기관이 교육지원청으로 옮겨져 건수 변화를 실제 침해 증감으로 보기 어렵다. 신고되지 않은 사례도 많다.",
 "A teachers' association newspaper reporting an analysis by the Korean Educational Development Institute. Teacher-rights committee hearings went from 1,197 (2020 school year) to 5,050 (2023) to 4,034 (2025); because hearings moved to district offices in March 2024, changes in counts are hard to read as changes in actual infringements. Many cases go unreported.",
 "Газета учительской ассоциации пересказывает анализ Корейского института развития образования. Заседания комитетов по защите прав учителей: 1197 (2020 уч. год) → 5050 (2023) → 4034 (2025); с марта 2024 года они перенесены в районные управления, поэтому динамику трудно трактовать как изменение реальных нарушений. Многие случаи не заявляются.",
 "这是教师团体报纸转述韩国教育开发院分析的报道。教权保护委员会审议从2020学年1197件增至2023学年5050件，2025学年为4034件；2024年3月审议机构移至教育支援厅，件数变化难以视为实际侵害的增减。未报告的案例也很多。",
 "教員団体の新聞が韓国教育開発院の分析を伝えた記事である。教権保護委員会の開催は2020学年度1,197件→2023学年度5,050件→2025学年度4,034件で、2024年3月に審議機関が教育支援庁へ移ったため、件数の変化を実際の侵害の増減とみなすのは難しい。届け出のない事例も多い。"],
["한국 교사의 학부모 관련 감정노동의 크기와 추세를 보여주는 방향성 근거로 쓴다.",
 "Used as directional evidence of the size and trend of Korean teachers' emotional labour involving parents.",
 "Используется как свидетельство направления — масштаба и динамики эмоционального труда корейских учителей, связанного с родителями.",
 "作为反映韩国教师与家长相关情绪劳动规模与趋势的方向性依据。",
 "韓国の教員の保護者に関わる感情労働の大きさと推移を示す方向性の根拠として用いる。"]);

E(22,"B","io",2024,"대한민국 정책브리핑 (행정안전부·인사혁신처), 2024-05-02","욕설·협박 등 악성민원인 전화, 공무원이 먼저 끊어도 된다","https://www.korea.kr/news/policyNewsView.do?newsId=148928768",
"민원인이 통화 중 욕설·협박 등 '폭언'을 하면 먼저 전화를 끊어도 된다",
["정부의 '악성민원 방지 및 민원공무원 보호 강화 대책' 발표로, 2024년 3월 김포시 공무원 사망을 계기로 통화 전체 녹음, 폭언 시 선종료, 공무원 개인정보 공개 축소 등을 담았다. 대국민 설문에서 93.2%가 민원공무원 보호가 필요하다고 답했다. 시행 효과는 아직 확인되지 않았다.",
 "The government's announcement of measures to prevent malicious complaints and protect civil servants handling them, prompted by the death of a Gimpo city official in March 2024: recording entire calls, letting officials hang up first on abuse, and reducing disclosure of officials' personal details. In a public survey 93.2% said such protection was needed. Effects are not yet verified.",
 "Объявление правительства о мерах против злонамеренных жалоб и защите госслужащих, принятых после гибели чиновника города Кимпхо в марте 2024 года: запись всех звонков, право первым прервать разговор при оскорблениях, сокращение раскрытия личных данных. В опросе 93,2% поддержали защиту. Эффект пока не подтверждён.",
 "政府公布的“防止恶意投诉与加强保护投诉处理公务员对策”，以2024年3月金浦市公务员死亡事件为契机，包括全程录音、遭辱骂时可先挂断、减少公开公务员个人信息等。民意调查中93.2%认为需要保护。实施效果尚未确认。",
 "2024年3月の金浦市職員の死亡を受けた政府の「悪質苦情防止及び苦情担当公務員保護強化対策」の発表で、通話の全録音、暴言時の先切り、公務員の個人情報公開の縮小などを盛り込んだ。国民アンケートでは93.2%が保護が必要と回答した。施行効果はまだ確認されていない。"],
["공공 민원 창구를 감정노동 고위험 직무로 공식 인정한 근거로 쓴다.",
 "Used as evidence that public complaint counters have been officially recognised as high-risk emotional-labour jobs.",
 "Используется как свидетельство официального признания приёма граждан работой с высоким риском эмоционального труда.",
 "作为公共投诉窗口被正式认定为情绪劳动高风险岗位的依据。",
 "行政の苦情窓口が感情労働の高リスク職務として公式に認められた根拠として用いる。"]);

E(23,"B","io",2021,"국가법령정보센터, 「산업안전보건법」 제41조 (2018년 도입, 2021-04-13 개정)","산업안전보건법 제41조(고객의 폭언 등으로 인한 건강장해 예방조치 등)","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EB%B2%95/%EC%A0%9C41%EC%A1%B0",
"업무의 일시적 중단 또는 전환 등 대통령령으로 정하는 필요한 조치를 하여야 한다",
["고객응대근로자에 대한 예방 조치(제1항), 고객 등 제3자의 폭언 등으로 건강장해 우려가 있을 때의 업무 일시 중단·전환(제2항), 요구를 이유로 한 불리한 처우 금지(제3항)를 규정한 현행 조문이다. 법 조문은 확인되지만 집행·위반 통계와 하청·플랫폼 노동에 대한 실효성은 본 보고서에서 확인하지 못했다.",
 "The current article providing preventive measures for customer-facing workers (para. 1), temporary suspension or reassignment where abuse by customers or other third parties threatens health (para. 2), and a ban on detrimental treatment for requesting this (para. 3). The text is verified, but enforcement statistics and effectiveness for subcontracted and platform work were not verified in this report.",
 "Действующая статья: профилактические меры для работников, обслуживающих клиентов (ч. 1), временная приостановка или перевод при угрозе здоровью из-за оскорблений клиентов и третьих лиц (ч. 2), запрет неблагоприятного обращения за такое требование (ч. 3). Текст подтверждён, но статистика применения и эффективность для субподрядного и платформенного труда в докладе не проверены.",
 "现行条文规定：对顾客接待劳动者采取预防措施（第1款）；因顾客等第三方的辱骂等有损健康之虞时暂停或调换工作（第2款）；禁止因提出该要求而给予不利待遇（第3款）。条文已确认，但执法与违规统计以及对分包与平台劳动的实效，本报告未能确认。",
 "顧客応対労働者への予防措置（第1項）、顧客等の第三者の暴言等で健康障害のおそれがある場合の業務の一時中断・転換（第2項）、その要求を理由とした不利益取扱いの禁止（第3項）を定めた現行条文である。条文は確認できるが、執行・違反統計や下請・プラットフォーム労働への実効性は本報告では確認できなかった。"],
["한국이 고객 폭언으로부터의 보호를 산업안전 법에 명시한 선발 국가라는 근거로 쓴다.",
 "Used as evidence that Korea was an early mover in writing protection from customer abuse into occupational safety law.",
 "Используется как свидетельство того, что Корея одной из первых закрепила защиту от оскорблений клиентов в законе об охране труда.",
 "作为韩国率先在职业安全法中明确规定免受顾客辱骂保护的依据。",
 "韓国が顧客の暴言からの保護を労働安全法に明記した先行国であるという根拠として用いる。"]);

E(24,"B","io",2019,"국가법령정보센터, 「근로기준법」 제76조의2 (2019-01-15 신설)","근로기준법 제76조의2(직장 내 괴롭힘의 금지)","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C76%EC%A1%B0%EC%9D%982",
"업무상 적정범위를 넘어 다른 근로자에게 신체적ㆍ정신적 고통을 주거나",
["사용자·근로자가 직장 내 우위를 이용해 다른 근로자를 괴롭히는 것을 금지한 조항으로, 고객은 행위자에 포함되지 않는다. 고객 유래 감정노동은 산업안전보건법 제41조가 맡는 이원 구조다.",
 "The article prohibiting employers and workers from using workplace superiority to harass other workers; customers are not covered as perpetrators. Customer-originated emotional labour is left to Article 41 of the Occupational Safety and Health Act — a two-track structure.",
 "Статья запрещает работодателям и работникам травлю коллег с использованием превосходства на работе; клиенты в число нарушителей не входят. Эмоциональный труд, исходящий от клиентов, регулирует ст. 41 Закона об охране труда — двухуровневая структура.",
 "该条禁止雇主或劳动者利用职场优势欺凌其他劳动者，顾客不属于行为人。源自顾客的情绪劳动由《职业安全卫生法》第41条负责，形成双轨结构。",
 "使用者・労働者が職場での優位性を利用して他の労働者をいじめることを禁じた条項で、顧客は行為者に含まれない。顧客由来の感情労働は産業安全保健法第41条が担う二元構造である。"],
["한국의 보호 체계가 내부 괴롭힘과 고객 폭언을 서로 다른 법으로 다룬다는 근거로 쓴다.",
 "Used as evidence that Korea's protection system handles internal harassment and customer abuse under different laws.",
 "Используется как свидетельство того, что в Корее внутренняя травля и оскорбления клиентов регулируются разными законами.",
 "作为韩国保护体系以不同法律处理内部欺凌与顾客辱骂的依据。",
 "韓国の保護体系が内部のいじめと顧客の暴言を別々の法律で扱っているという根拠として用いる。"]);

E(25,"B","io",2026,"厚生労働省「職場におけるハラスメントの防止のために」（改正労働施策総合推進法・令和7年法律第63号, 2026-10-01施行）","職場におけるハラスメントの防止のために","https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/seisaku06/",
"カスタマーハラスメント…対策が全ての事業主の義務となりました",
["2026년 10월 1일부터 모든 사업주에게 고객 괴롭힘 대책(방침 명확화, 상담 체제 정비 등 지침상의 고용관리 조치)을 의무화했다는 일본 후생노동성의 공식 안내다. 시행 직후라 효과는 확인되지 않았다.",
 "The Japanese labour ministry's official notice that from 1 October 2026 all employers must take measures against customer harassment (employment-management measures set by guidelines, such as clarifying policy and setting up consultation systems). Effects are unverified so soon after entry into force.",
 "Официальное уведомление министерства труда Японии: с 1 октября 2026 года все работодатели обязаны принимать меры против притеснений со стороны клиентов (меры по руководству — политика, система консультаций и т. д.). Эффект сразу после вступления в силу не подтверждён.",
 "日本厚生劳动省的官方通知：自2026年10月1日起，所有雇主都有义务采取防范顾客骚扰的措施（依据指针的雇用管理措施，如明确方针、完善咨询体制等）。刚刚施行，效果尚未确认。",
 "2026年10月1日からすべての事業主にカスタマーハラスメント対策（方針の明確化、相談体制の整備など指針に基づく雇用管理上の措置）を義務づけたという厚生労働省の公式案内である。施行直後で効果は確認されていない。"],
["일본이 2026년부터 전 사업주를 대상으로 고객 괴롭힘 대책을 법적 의무로 만든 근거로 쓴다.",
 "Used as evidence that from 2026 Japan made customer-harassment measures a legal duty for all employers.",
 "Используется как свидетельство того, что с 2026 года Япония сделала меры против притеснений клиентов обязанностью всех работодателей.",
 "作为日本自2026年起把防范顾客骚扰措施定为所有雇主法定义务的依据。",
 "日本が2026年からすべての事業主を対象にカスハラ対策を法的義務とした根拠として用いる。"]);

E(26,"B","io",2025,"東京都 産業労働局 報道発表, 2025-03-28（令和6年東京都条例第140号）","東京都カスタマー・ハラスメント防止条例施行","https://www.metro.tokyo.lg.jp/information/press/2025/03/2025032804",
"令和7年4月1日から「東京都カスタマー・ハラスメント防止条例」が施行します",
["고객 괴롭힘 방지에 특화된 일본 첫 조례의 시행 안내다. '누구든 어디서든 카스하라를 해서는 안 된다'고 고객에게 직접 규범을 제시하지만 벌칙은 없고, 효과는 아직 평가되지 않았다.",
 "Notice of entry into force of Japan's first ordinance specifically against customer harassment. It addresses customers directly — no one, anywhere, may engage in customer harassment — but carries no penalties, and its effects have not yet been evaluated.",
 "Уведомление о вступлении в силу первого в Японии постановления именно против притеснений клиентов. Оно обращено прямо к клиентам — никто и нигде не должен этого делать, — но санкций не содержит, а эффект ещё не оценён.",
 "这是日本首部专门防止顾客骚扰的条例的施行通知。它直接向顾客提出规范——任何人在任何场所都不得实施顾客骚扰——但没有罚则，效果尚未评估。",
 "カスタマーハラスメント防止に特化した日本初の条例の施行案内である。「何人も、あらゆる場において」カスハラを行ってはならないと顧客に直接規範を示すが罰則はなく、効果はまだ評価されていない。"],
["고객의 행동 규범을 직접 정하는 '고객 책임' 접근의 사례로 쓴다.",
 "Used as an example of the customer-responsibility approach that sets norms for customer behaviour directly.",
 "Используется как пример подхода «ответственности клиента», прямо задающего нормы поведения клиентов.",
 "作为直接规定顾客行为规范的“顾客责任”路径的案例。",
 "顧客の行動規範を直接定める「顧客責任」アプローチの事例として用いる。"]);

E(27,"B","io",2023,"legislation.gov.uk, Worker Protection (Amendment of Equality Act 2010) Act 2023 c. 51","Worker Protection (Amendment of Equality Act 2010) Act 2023","https://www.legislation.gov.uk/ukpga/2023/51/enacted",
"An employer (A) must take reasonable steps to prevent sexual harassment of employees",
["평등법에 사업주의 성희롱 예방 의무를 신설한 영국 법률 원문이다. 대상은 성희롱이며, 고객의 폭언·적대 일반을 다루는 전용 규정은 아니다.",
 "The text of the UK act inserting an employer's duty to prevent sexual harassment into the Equality Act. It covers sexual harassment, not a dedicated rule on customer abuse or hostility in general.",
 "Текст британского закона, вводящего в Закон о равенстве обязанность работодателя предотвращать сексуальные домогательства. Он касается сексуальных домогательств, а не специально оскорблений и враждебности клиентов в целом.",
 "这是在《平等法》中新增雇主防止性骚扰义务的英国法律原文。对象是性骚扰，并非针对顾客辱骂与敌意的一般性专门规定。",
 "平等法に事業主のセクシュアルハラスメント予防義務を新設した英国の法律原文である。対象はセクハラで、顧客の暴言・敵対全般を扱う専用規定ではない。"],
["영국이 '사업주 예방 의무' 방식으로 괴롭힘에 대응한다는 근거로만 쓴다.",
 "Used only as evidence that the UK addresses harassment through a preventive duty on employers.",
 "Используется лишь как свидетельство того, что Великобритания действует через превентивную обязанность работодателя.",
 "仅作为英国以“雇主预防义务”方式应对骚扰的依据。",
 "英国が「事業主の予防義務」方式でハラスメントに対応しているという根拠としてのみ用いる。"]);

E(28,"B","io",2026,"ILO NORMLEX, Ratifications of C190 (accessed 2026-11)","Ratifications of C190 - Violence and Harassment Convention, 2019 (No. 190)","https://normlex.ilo.org/dyn/nrmlx_en/f?p=NORMLEXPUB:11300:0::NO::P11300_INSTRUMENT_ID:3999810",
"58 ratifications",
["ILO 공식 비준 목록으로 2021년 발효 후 58개국이 비준했다. 영국(2022-03-07), 프랑스(2023-04-12), 독일(2023-06-14)은 비준했고 한국·일본·중국·미국은 목록에 없다. 비준이 곧 현장 이행을 뜻하지는 않는다.",
 "The ILO's official ratification list: 58 states have ratified since entry into force in 2021. The UK (7 Mar 2022), France (12 Apr 2023) and Germany (14 Jun 2023) have ratified; Korea, Japan, China and the US are not on the list. Ratification does not by itself mean implementation.",
 "Официальный список ратификаций МОТ: после вступления в силу в 2021 году — 58 государств. Ратифицировали Великобритания (07.03.2022), Франция (12.04.2023), Германия (14.06.2023); Кореи, Японии, Китая и США в списке нет. Ратификация сама по себе не означает выполнения.",
 "国际劳工组织官方批准名单：2021年生效后已有58国批准。英国（2022-03-07）、法国（2023-04-12）、德国（2023-06-14）已批准，韩国、日本、中国、美国不在名单上。批准本身并不等于现场落实。",
 "ILOの公式批准一覧で、2021年の発効後58か国が批准した。英国（2022-03-07）、フランス（2023-04-12）、ドイツ（2023-06-14）は批准し、日本・韓国・中国・米国は一覧にない。批准がそのまま現場での履行を意味するわけではない。"],
["국제 기준 수용 여부를 국가별로 비교하는 지표로 쓴다.",
 "Used as an indicator for comparing countries' acceptance of the international standard.",
 "Используется как показатель для сравнения стран по принятию международного стандарта.",
 "作为按国家比较是否接受国际标准的指标。",
 "国際基準の受け入れの有無を国別に比較する指標として用いる。"]);

// ===== Evidence 29–42: AI in customer service, emotion surveillance, regulation =====
E(29,"A","q1",2025,"Erik Brynjolfsson, Danielle Li & Lindsey Raymond, Quarterly Journal of Economics 140(2): 889–942 (2025); NBER w31161","Generative AI at Work","https://www.nber.org/papers/w31161",
"AI assistance improves customer sentiment, increases employee retention",
["고객지원 상담원 5,179명에게 생성형 AI 보조를 단계적으로 도입한 현장 준실험으로, 시간당 해결 건수가 평균 14%, 초보·저숙련 상담원은 34% 늘었다. 고객 정서 개선, 관리자 연결 요청 감소, 상담원 이직 감소도 보고했다. 한 기업 사례이고 숙련 상담원에게는 효과가 미미했다.",
 "A field quasi-experiment in which generative-AI assistance was rolled out in stages to 5,179 customer-support agents: issues resolved per hour rose 14% on average and 34% for novice and low-skilled agents. It also reports better customer sentiment, fewer requests for a manager and lower agent attrition. It is one firm, and effects on experienced agents were minimal.",
 "Полевой квазиэксперимент: ИИ-помощник поэтапно внедрён для 5179 операторов поддержки; число решённых обращений в час выросло в среднем на 14%, у новичков и низкоквалифицированных — на 34%. Также отмечены улучшение настроения клиентов, меньше требований позвать менеджера и снижение текучести. Это одна компания, а для опытных операторов эффект минимален.",
 "这是一项对5179名客服坐席分阶段引入生成式AI辅助的现场准实验：每小时解决问题数平均提高14%，新手与低技能坐席提高34%。研究还报告了顾客情绪改善、要求转主管的情况减少、坐席流失下降。仅为一家企业，对熟练坐席效果甚微。",
 "顧客サポート担当5,179人に生成AI支援を段階的に導入した現場の準実験で、1時間あたりの解決件数が平均14%、新人・低スキル担当では34%増えた。顧客感情の改善、管理者への取り次ぎ要求の減少、離職の減少も報告した。1社の事例で、熟練担当への効果はわずかだった。"],
["AI가 상담원의 감정 부담을 '덜어줄 수 있다'는 가장 강한 인과 근거로 쓰되, 보조형 설계에 한정된 결과로 읽는다.",
 "Used as the strongest causal evidence that AI can lighten agents' emotional load, read as a result specific to assistive design.",
 "Используется как самое сильное причинное свидетельство того, что ИИ может облегчить эмоциональную нагрузку операторов, — но лишь при вспомогательном дизайне.",
 "作为AI“能够减轻”坐席情绪负担的最强因果依据，但理解为仅限于辅助型设计的结果。",
 "AIがオペレーターの感情的負担を「軽減しうる」最も強い因果的根拠として用いるが、支援型の設計に限られた結果として読む。"]);

E(30,"A","q1",2022,"Cammy Crolic, Felipe Thomaz, Rhonda Hadi & Andrew T. Stephen, Journal of Marketing (2022); AMA press release 2021-10-20","Blame the Bot: Anthropomorphism and Anger in Customer–Chatbot Interactions","https://www.ama.org/2021/10/20/press-release-from-the-journal-of-marketing-when-humanlike-chatbots-miss-the-mark-in-customer-service-interactions/",
"when customers are angry, humanlike chatbots can negatively impact customer satisfaction",
["실험과 현장 데이터를 결합한 마케팅 분야 최상위 학술지 연구로, 화난 고객에게 사람처럼 보이는 챗봇이 높은 기대를 만들고 실망을 키워 만족·기업 평가·재구매 의향을 떨어뜨린다고 보고했다. 생성형 AI 이전 챗봇 기준이다.",
 "A study in a top marketing journal combining experiments and field data: for angry customers, humanlike chatbots raise expectations and deepen disappointment, lowering satisfaction, firm evaluations and purchase intentions. It concerns pre-generative-AI chatbots.",
 "Исследование в ведущем маркетинговом журнале, сочетающее эксперименты и полевые данные: для рассерженных клиентов человекоподобные чат-боты завышают ожидания и усиливают разочарование, снижая удовлетворённость, оценку компании и намерение покупать. Речь о чат-ботах до генеративного ИИ.",
 "这项结合实验与现场数据的营销学顶级期刊研究表明：对愤怒的顾客而言，拟人化聊天机器人会抬高期待、加深失望，从而降低满意度、企业评价与再购意愿。针对的是生成式AI之前的聊天机器人。",
 "実験と現場データを組み合わせたマーケティング分野の最上位学術誌の研究で、怒った顧客には人間らしく見えるチャットボットが期待を高めて失望を大きくし、満足・企業評価・再購入意向を下げると報告した。生成AI以前のチャットボットが対象である。"],
["화난 고객은 AI로 '흡수'되지 않고 결국 사람에게 넘어온다는 근거로 쓴다.",
 "Used as evidence that angry customers are not absorbed by AI but end up with humans.",
 "Используется как свидетельство того, что гнев клиентов не поглощается ИИ, а в итоге достаётся людям.",
 "作为愤怒的顾客不会被AI“吸收”、最终转到人工的依据。",
 "怒った顧客はAIに「吸収」されず、結局は人に回ってくるという根拠として用いる。"]);

E(31,"C","ind",2024,"Gartner, press release 2024-07-09 (survey of 5,728 customers, December 2023)","Gartner Survey Finds 64% of Customers Would Prefer That Companies Didn't Use AI For Customer Service","https://www.gartner.com/en/newsroom/press-releases/2024-07-09-gartner-survey-finds-64-percent-of-customers-would-prefer-that-companies-didnt-use-ai-for-customer-service",
"Sixty-four percent of customers would prefer that companies didn't use artificial intelligence",
["민간 조사기관 발표로 표본 구성은 제한적으로 공개됐다. 고객 53%는 AI 상담을 쓰는 기업에서 경쟁사로 옮길 수 있다고 답했고, 고객 서비스 책임자의 60%는 AI 도입 압박을 받고 있었다.",
 "A private research firm's release with limited disclosure of sample composition. 53% of customers would consider switching to a competitor over AI service, while 60% of customer-service leaders felt pressure to adopt AI.",
 "Сообщение частной исследовательской компании с ограниченным раскрытием выборки. 53% клиентов готовы уйти к конкуренту из-за ИИ-обслуживания, а 60% руководителей клиентских служб ощущают давление с требованием внедрять ИИ.",
 "这是民间研究机构的发布，样本构成披露有限。53%的顾客表示可能因AI客服转向竞争对手，而60%的客服负责人感到引入AI的压力。",
 "民間調査会社の発表で、標本構成の開示は限られる。顧客の53%はAI応対を使う企業から競合に移りうると答え、顧客サービス責任者の60%はAI導入の圧力を受けていた。"],
["고객 거부감이 AI 확산을 늦추는 요인(S4)이자, 비용 압박이 AI 도입을 밀어붙이는 요인(D)이라는 방향성 근거로 쓴다.",
 "Used as directional evidence both that customer aversion slows AI diffusion (S4) and that cost pressure pushes adoption (D).",
 "Используется как свидетельство направления: неприятие клиентов замедляет распространение ИИ (S4), а давление издержек толкает к внедрению (D).",
 "作为方向性依据：顾客抵触会减缓AI扩散（S4），成本压力又推动AI引入（D）。",
 "顧客の忌避がAI普及を遅らせる要因（S4）であり、コスト圧力がAI導入を押し進める要因（D）でもあるという方向性の根拠として用いる。"]);

E(32,"C","press",2026,"뉴시스 (한국노총 중앙연구원 AICC 실태조사), 2026-01-22","AI 상담 불만 짜증, 사람 상담사가 받아…61% '도입 후 노동조건 악화'","https://www.newsis.com/view/NISX20260122_0003486565",
"콜센터 상담사 10명 중 6명은 AI상담(AICC) 도입 후 노동조건이 악화됐다고 응답했다",
["노동조합 연구원의 조사를 전한 보도로, 표본·방법은 기사로만 확인된다. 상담사 61%가 AI 상담 도입 후 노동조건 악화, 일평균 민원 17.9% 증가를 답했고, 시민 54.2%가 AI 상담에 불만족, 87.5%가 사람 상담사를 선호했다. 조사 주체에 이해관계가 있을 수 있다.",
 "A news report on a trade-union research institute survey; sample and method are known only from the article. 61% of agents said conditions worsened after AI contact centres were introduced and daily complaints rose 17.9%; 54.2% of citizens were dissatisfied with AI service and 87.5% preferred human agents. The surveying body may have an interest.",
 "Сообщение СМИ об опросе исследовательского института профсоюза; выборка и метод известны лишь из статьи. 61% операторов сообщили об ухудшении условий после внедрения ИИ-контакт-центров, ежедневные жалобы выросли на 17,9%; 54,2% граждан недовольны ИИ-обслуживанием, 87,5% предпочитают людей. У заказчика может быть заинтересованность.",
 "这是转述工会研究院调查的报道，样本与方法只能从报道中得知。61%的坐席称引入AI联络中心后劳动条件恶化、日均投诉增加17.9%；54.2%的市民对AI客服不满意，87.5%更喜欢人工坐席。调查主体可能存在利害关系。",
 "労働組合の研究院の調査を伝えた報道で、標本・方法は記事でしか確認できない。オペレーターの61%がAI応対導入後に労働条件が悪化、1日平均の苦情が17.9%増加と答え、市民の54.2%がAI応対に不満、87.5%が人のオペレーターを好んだ。調査主体に利害関係がありうる。"],
["'잔여 감정노동 집중' 가설을 뒷받침하는 한국 현장의 방향성 근거로만 쓴다.",
 "Used only as directional evidence from Korean workplaces supporting the concentrated-residual-emotional-labour hypothesis.",
 "Используется лишь как свидетельство направления из корейской практики в пользу гипотезы концентрации остаточного эмоционального труда.",
 "仅作为支持“残余情绪劳动集中”假说的韩国现场方向性依据。",
 "「残余感情労働の集中」仮説を支える韓国の現場からの方向性の根拠としてのみ用いる。"]);

E(33,"C","ind",2026,"SoftBank Corp. (SoftBank News), 2026-02-19","SoftBank Corp. Commercializes “SoftVoice,” an AI System That Moderates Aggressive Customer Calls","https://www.softbank.jp/en/sbnews/entry/20260219_01",
"soften aggressive customer tones during calls while preserving the original content",
["도쿄대와 공동 연구한 음성 변환 기술을 2026년 2월 상용화했다는 기업 발표로, 개발 단계 시험에서 인지된 분노 지표가 30% 이상 줄었다는 수치는 자체 평가다. 폭언의 '내용'은 그대로 전달된다는 한계가 있다.",
 "A company announcement that voice-conversion technology developed with the University of Tokyo was commercialised in February 2026; the reported 30%+ reduction in a perceived-anger index in development tests is a self-assessment. The content of abusive speech still comes through.",
 "Сообщение компании о коммерческом запуске в феврале 2026 года технологии преобразования голоса, разработанной с Токийским университетом; снижение индекса воспринимаемого гнева более чем на 30% в испытаниях — собственная оценка. Содержание оскорблений по-прежнему доходит.",
 "这是企业关于与东京大学联合研发的语音转换技术于2026年2月商用化的发布，开发阶段测试中感知愤怒指数下降30%以上的数字属于自我评估。辱骂的“内容”仍会原样传达。",
 "東京大学と共同研究した音声変換技術を2026年2月に商用化したという企業発表で、開発段階の試験で知覚された怒りの指標が30%以上下がったという数値は自社評価である。暴言の「内容」はそのまま伝わる限界がある。"],
["'노동자를 보호하는 방향의 감정 AI' 사례로만 쓰고, 효과의 크기 근거로는 쓰지 않는다.",
 "Used only as an example of emotion AI that protects workers, not as evidence of effect size.",
 "Используется лишь как пример эмоционального ИИ, защищающего работников, а не как доказательство величины эффекта.",
 "仅作为“保护劳动者方向的情绪AI”案例，不作为效果大小的依据。",
 "「労働者を守る方向の感情AI」の事例としてのみ用い、効果の大きさの根拠には用いない。"]);

E(34,"B","io",2024,"Regulation (EU) 2024/1689 (AI Act), Article 5(1)(f), EUR-Lex; applies from 2025-02-02","Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act)","https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng",
"AI systems to infer emotions of a natural person in the areas of workplace",
["EU AI 법 원문으로, 직장과 교육기관에서 감정을 추론하는 AI의 출시·사용을 금지하고 의료·안전 목적만 예외로 둔다. 금지 조항은 2025년 2월부터 적용되지만 집행 사례는 아직 축적되지 않았다.",
 "The text of the EU AI Act, which prohibits placing on the market or using AI to infer emotions in workplaces and educational institutions, except for medical or safety reasons. The prohibition applies from February 2025, but enforcement cases have yet to accumulate.",
 "Текст Закона ЕС об ИИ: запрещены вывод на рынок и использование ИИ для распознавания эмоций на рабочих местах и в учебных заведениях, кроме медицинских целей и целей безопасности. Запрет действует с февраля 2025 года, практика применения ещё не накоплена.",
 "欧盟《人工智能法》原文：禁止在工作场所和教育机构投放或使用推断情绪的AI，仅医疗或安全目的除外。禁令自2025年2月起适用，但执法案例尚未积累。",
 "EU AI法の原文で、職場と教育機関で感情を推論するAIの上市・使用を禁止し、医療・安全目的のみを例外とする。禁止規定は2025年2月から適用されるが、執行事例はまだ蓄積されていない。"],
["직장 감정 인식을 법으로 금지한 유일한 주요 경제권이라는 근거로 쓴다.",
 "Used as evidence that the EU is the only major economy to ban workplace emotion recognition by law.",
 "Используется как свидетельство того, что ЕС — единственная крупная экономика, запретившая законом распознавание эмоций на работе.",
 "作为欧盟是唯一以法律禁止职场情绪识别的主要经济体的依据。",
 "職場での感情認識を法律で禁止した唯一の主要経済圏であるという根拠として用いる。"]);

E(35,"B","io",2025,"European Commission (Shaping Europe's digital future), 2025-02-04","Commission publishes the Guidelines on prohibited artificial intelligence (AI) practices, as defined by the AI Act","https://digital-strategy.ec.europa.eu/en/library/commission-publishes-guidelines-prohibited-artificial-intelligence-ai-practices-defined-ai-act",
"These guidelines provide an overview of AI practices that are deemed unacceptable",
["구속력 없는 해석 지침이다. 콜센터가 웹캠·음성 인식으로 직원의 분노 같은 감정을 추적하는 것은 금지, 직원 감정을 함께 추적하지 않는 고객 감정 분석은 이 조항의 금지 대상이 아니라는 예시는 지침 본문을 다룬 여러 법률 해설로 확인했다.",
 "Non-binding interpretive guidelines. The examples — a call centre tracking employees' emotions such as anger via webcams and voice recognition is prohibited, while analysing customers' emotions without tracking employees' is not caught by this provision — were confirmed through several legal commentaries on the guideline text.",
 "Необязательное толковательное руководство. Примеры — отслеживание колл-центром эмоций сотрудников (например, гнева) через веб-камеры и распознавание голоса запрещено, а анализ эмоций клиентов без отслеживания эмоций сотрудников под эту норму не подпадает — подтверждены рядом юридических комментариев к тексту.",
 "属于无约束力的解释性指南。其中的示例——呼叫中心用网络摄像头和语音识别追踪员工的愤怒等情绪属于禁止，而不同时追踪员工情绪的顾客情绪分析不属于该条款禁止范围——是通过多篇关于指南正文的法律评析确认的。",
 "拘束力のない解釈ガイドラインである。コールセンターがウェブカメラや音声認識で従業員の怒りなどの感情を追跡するのは禁止、従業員の感情を同時に追跡しない顧客の感情分析はこの条項の禁止対象ではないという例示は、ガイドライン本文を扱った複数の法律解説で確認した。"],
["콜센터에서 '보호 기술'과 '감시 기술'의 법적 경계를 판단하는 근거로 쓰되, 해석은 바뀔 수 있다고 본다.",
 "Used to judge the legal line between protective and surveillance technology in call centres, with the caveat that interpretation may change.",
 "Используется для определения правовой границы между защитными и надзорными технологиями в колл-центрах, с оговоркой, что толкование может измениться.",
 "用于判断呼叫中心“保护技术”与“监控技术”的法律界限，但认为解释可能变化。",
 "コールセンターにおける「保護技術」と「監視技術」の法的境界を判断する根拠として用いるが、解釈は変わりうるとみる。"]);

E(36,"B","io",2024,"EU Agency for Fundamental Rights (FRA), law reference — Directive (EU) 2024/2831, Article 7","Directive (EU) 2024/2831 of the European Parliament and of the Council of 23 October 2024 on improving working conditions in platform work","https://fra.europa.eu/en/law-reference/directive-eu-20242831-european-parliament-and-council-23-october-2024-improving",
"personal data on the emotional or psychological state of a person performing platform work",
["플랫폼 노동 지침 원문(유럽연합 기본권청 게재)으로, 자동화된 감시·의사결정 시스템이 노동자의 감정·심리 상태에 관한 개인정보를 처리하는 것을 금지한다. 플랫폼 노동에 한정되며 회원국 국내법 전환 기한은 2026년 12월이다.",
 "The text of the Platform Work Directive (as published by the EU Agency for Fundamental Rights), prohibiting automated monitoring and decision-making systems from processing personal data on workers' emotional or psychological state. It is limited to platform work, and member states must transpose it by December 2026.",
 "Текст Директивы о платформенном труде (опубликован Агентством ЕС по основным правам): автоматизированным системам мониторинга и принятия решений запрещено обрабатывать данные об эмоциональном или психологическом состоянии работников. Касается только платформенного труда; срок транспозиции — декабрь 2026 года.",
 "平台劳动指令原文（欧盟基本权利署刊载），禁止自动化监控与决策系统处理劳动者情绪或心理状态的个人数据。仅限平台劳动，成员国转化为国内法的期限为2026年12月。",
 "プラットフォーム労働指令の原文（EU基本権機関掲載）で、自動化された監視・意思決定システムが労働者の感情・心理状態に関する個人データを処理することを禁止する。プラットフォーム労働に限られ、加盟国の国内法化期限は2026年12月である。"],
["EU가 AI 법에 더해 플랫폼 노동에서도 감정 데이터 처리 자체를 금지했다는 근거로 쓴다.",
 "Used as evidence that, on top of the AI Act, the EU bans processing emotional data altogether in platform work.",
 "Используется как свидетельство того, что помимо Закона об ИИ ЕС запрещает и саму обработку эмоциональных данных в платформенном труде.",
 "作为欧盟在《人工智能法》之外，在平台劳动中也禁止处理情绪数据本身的依据。",
 "EUがAI法に加え、プラットフォーム労働でも感情データの処理そのものを禁止したという根拠として用いる。"]);

E(37,"B","io",2022,"国家互联网信息办公室 等四部门,《互联网信息服务算法推荐管理规定》, 2022-01-04","互联网信息服务算法推荐管理规定（第二十条）","https://www.cac.gov.cn/2022-01/04/c_1642894606364259.htm",
"建立完善平台订单分配、报酬构成及支付、工作时间、奖惩等相关算法",
["중국 인터넷정보판공실 등이 공포한 알고리즘 추천 규정 원문으로, 업무 배정 서비스를 제공하는 플랫폼이 노동자의 보수·휴식권을 보호하도록 했다. 원칙 규정이며 감정 데이터를 직접 다루지는 않고, 집행 정보는 제한적이다.",
 "The text of China's algorithmic recommendation provisions issued by the Cyberspace Administration and others, requiring platforms that dispatch work to protect workers' pay and rest rights. It is a principle-level rule that does not address emotional data directly, and enforcement information is limited.",
 "Текст китайских положений об алгоритмических рекомендациях (Управление по делам киберпространства и др.): платформы, распределяющие работу, обязаны защищать право работников на оплату и отдых. Это рамочная норма, эмоциональные данные прямо не затрагивает, сведения о применении ограничены.",
 "国家网信办等发布的算法推荐管理规定原文，要求提供工作调度服务的平台保护劳动者取得报酬与休息休假的权益。属原则性规定，未直接涉及情绪数据，执法信息有限。",
 "中国のインターネット情報弁公室などが公布したアルゴリズム推薦規定の原文で、業務配分サービスを提供するプラットフォームに労働者の報酬・休息の権利を保護させる。原則規定で感情データを直接扱わず、執行情報は限られる。"],
["중국이 감정 자체보다 '알고리즘에 의한 노동 통제'를 규율 대상으로 삼는다는 근거로 쓴다.",
 "Used as evidence that China regulates algorithmic control of labour rather than emotion as such.",
 "Используется как свидетельство того, что Китай регулирует алгоритмический контроль труда, а не эмоции как таковые.",
 "作为中国把“算法对劳动的控制”而非情绪本身作为规制对象的依据。",
 "中国が感情そのものより「アルゴリズムによる労働統制」を規律の対象としているという根拠として用いる。"]);

E(38,"B","io",2021,"国家发展和改革委员会 就业司, 2021-10-20（市场监管总局等7部门《关于落实网络餐饮平台责任切实维护外卖送餐员权益的指导意见》介绍）","筑牢灵活就业人员保障网","https://www.ndrc.gov.cn/fggz/jyysr/jysrsbxf/202110/t20211020_1300151.html",
"明确不得将“最严算法”作为考核要求",
["중국 국가발전개혁위원회가 7개 부처 지침(2021년 7월)을 소개한 공식 글로, 배달원 평가에 '가장 엄격한 알고리즘'을 쓰지 말고 '알고리즘 중간값' 방식으로 주문량·정시율을 정하며 배달 시한을 완화하라고 했다. 배달원은 770만 명 규모다. 이행 정도는 확인되지 않았다.",
 "An official article by China's National Development and Reform Commission introducing a seven-agency guideline (July 2021): delivery riders must not be assessed by the 'strictest algorithm'; order volume and punctuality targets should be set by a 'middle-value algorithm', and delivery deadlines relaxed. Riders number about 7.7 million. Implementation is unverified.",
 "Официальная статья Госкомитета по развитию и реформам Китая о руководстве семи ведомств (июль 2021): курьеров нельзя оценивать по «самому строгому алгоритму», нормы заказов и пунктуальности следует задавать по «срединному алгоритму», а сроки доставки смягчить. Курьеров около 7,7 млн. Исполнение не подтверждено.",
 "国家发展改革委介绍七部门指导意见（2021年7月）的官方文章：明确不得将“最严算法”作为外卖送餐员考核要求，应通过“算法取中”合理确定订单数量、准时率等，并适当放宽配送时限。外卖送餐员规模达770万人。落实程度未经确认。",
 "中国国家発展改革委員会が7省庁の指針（2021年7月）を紹介した公式記事で、配達員の評価に「最も厳しいアルゴリズム」を使わず「アルゴリズムの中間値」方式で注文量・定時率を定め、配達時限を緩めるよう求めた。配達員は770万人規模である。履行の程度は確認されていない。"],
["플랫폼 노동의 '시간 압박형' 부담에 대한 중국식 대응의 근거로 쓴다.",
 "Used as evidence of China's approach to the time-pressure burden of platform work.",
 "Используется как свидетельство китайского подхода к нагрузке платформенного труда, связанной с давлением времени.",
 "作为中国应对平台劳动“时间压迫型”负担方式的依据。",
 "プラットフォーム労働の「時間圧迫型」負担への中国式対応の根拠として用いる。"]);

E(39,"B","io",2025,"Milanez, Lemmens & Ruggiu, OECD Artificial Intelligence Papers, 2025-02-06","Algorithmic management in the workplace: New evidence from an OECD employer survey","https://www.oecd.org/en/publications/algorithmic-management-in-the-workplace_287c13c4-en.html",
"algorithmic management tools are already commonly used in most countries studied",
["프랑스·독일·이탈리아·일본·스페인·미국의 6,000여 기업 관리자를 조사했다. 노동자를 지시·감시·평가하는 도구를 하나 이상 쓰는 기업은 미국 90%, 유럽 4개국 평균 79%, 일본 40%였다. 관리자 응답이라 노동자 경험과 다를 수 있고, 관리자들도 노동자 건강 보호가 부족하다고 우려했다.",
 "A survey of managers at over 6,000 firms in France, Germany, Italy, Japan, Spain and the US: firms using at least one tool to instruct, monitor or evaluate workers were 90% in the US, 79% on average in the four European countries and 40% in Japan. These are managers' responses and may differ from workers' experience; managers themselves voiced concern about inadequate protection of workers' health.",
 "Опрос руководителей более 6000 фирм во Франции, Германии, Италии, Японии, Испании и США: хотя бы один инструмент для указаний, мониторинга или оценки работников используют 90% фирм в США, в среднем 79% в четырёх европейских странах и 40% в Японии. Это ответы менеджеров, опыт работников может отличаться; сами менеджеры тревожатся о недостаточной защите здоровья работников.",
 "对法国、德国、意大利、日本、西班牙、美国6000多家企业管理者的调查：使用至少一种指令、监控或评估劳动者工具的企业，美国90%、欧洲四国平均79%、日本40%。系管理者回答，可能与劳动者体验不同；管理者自己也担心对劳动者健康的保护不足。",
 "フランス・ドイツ・イタリア・日本・スペイン・米国の6,000社超の管理者を調査した。労働者への指示・監視・評価のツールを一つ以上使う企業は米国90%、欧州4か国平均79%、日本40%だった。管理者の回答で労働者の経験とは異なりうるうえ、管理者自身も労働者の健康保護が不十分だと懸念していた。"],
["감시·평가 도구 확산의 국가 차이(미국 최고·일본 최저)와 비용 압력 D의 근거로 쓴다.",
 "Used as evidence of national differences in the spread of monitoring and appraisal tools (highest in the US, lowest in Japan) and for the cost-pressure term D.",
 "Используется как свидетельство различий между странами в распространении инструментов надзора и оценки (максимум в США, минимум в Японии) и для члена D.",
 "作为监控与评估工具扩散存在国家差异（美国最高、日本最低）以及成本压力D的依据。",
 "監視・評価ツール普及の国別差（米国最高・日本最低）とコスト圧力Dの根拠として用いる。"]);

E(40,"B","survey",2023,"Pew Research Center (Rainie, Anderson, McClain, Vogels & Gelles-Watnick), 2023-04-20","AI in Hiring and Evaluating Workers: What Americans Think","https://www.pewresearch.org/internet/2023/04/20/ai-in-hiring-and-evaluating-workers-what-americans-think/",
"oppose this as a way to analyze employees' facial expressions",
["2022년 12월 미국 성인 11,004명을 조사한 대표성 있는 여론조사로, 얼굴 인식으로 직원 표정을 분석하는 데 70% 대 9%로 반대했고 73%는 표정이 잘못 해석될 것이라고 봤다. 미국 한정이고 3년 전 자료다.",
 "A representative poll of 11,004 US adults in December 2022: Americans opposed using face recognition to analyse employees' facial expressions by 70% to 9%, and 73% thought expressions would be misinterpreted. It covers the US only and is three years old.",
 "Репрезентативный опрос 11 004 взрослых американцев (декабрь 2022): против анализа выражений лиц сотрудников с помощью распознавания лиц — 70% против 9%, а 73% считают, что выражения будут истолкованы неверно. Только США, данным три года.",
 "2022年12月对11004名美国成年人的代表性民调：对用人脸识别分析员工面部表情，反对与支持之比为70%比9%，73%认为表情会被误读。仅限美国，为三年前的数据。",
 "2022年12月に米国の成人11,004人を調べた代表性のある世論調査で、顔認識で従業員の表情を分析することに70%対9%で反対し、73%は表情が誤って解釈されると考えた。米国限定で3年前の資料である。"],
["감정 감시에 대한 사회적 거부감이 크다는 근거로 쓴다.",
 "Used as evidence of strong public aversion to emotion surveillance.",
 "Используется как свидетельство сильного общественного неприятия слежки за эмоциями.",
 "作为社会对情绪监控强烈抵触的依据。",
 "感情監視への社会的な拒否感が大きいという根拠として用いる。"]);

E(41,"B","io",2025,"ILO & NASK (Gmyrek et al.), ILO Working Paper 140, 2025-05-20","Generative AI and Jobs: A Refined Global Index of Occupational Exposure","https://www.ilo.org/resource/news/one-four-jobs-risk-being-transformed-genai-new-ilo%E2%80%93nask-global-index-shows",
"1 in 4 jobs worldwide is potentially exposed to generative artificial intelligence",
["약 3만 개 직무 과업을 전문가 검증과 AI 채점으로 평가한 ILO 지수로, 노출은 대체가 아니라 변화 가능성을 뜻한다. 세계 고용의 25%(고소득국 34%)가 노출되고, 사무직이 가장 높으며, 고소득국 여성 고용의 9.6%가 최고위험 범주(남성 3.5%)에 속했다.",
 "An ILO index scoring some 30,000 occupational tasks with expert validation and AI-assisted ratings; exposure means potential transformation, not replacement. 25% of global employment (34% in high-income countries) is exposed, clerical work most of all, and 9.6% of women's employment in high-income countries is in the highest-risk category (3.5% for men).",
 "Индекс МОТ, оценивающий около 30 000 трудовых задач с экспертной проверкой и оценками ИИ; подверженность означает возможную трансформацию, а не замену. Подвержены 25% мировой занятости (34% в богатых странах), сильнее всего — офисные служащие; в богатых странах 9,6% занятости женщин — в категории наивысшего риска (у мужчин 3,5%).",
 "国际劳工组织以专家验证与AI辅助评分评估约3万项职业任务的指数，“暴露”指可能被改变而非被替代。全球就业的25%（高收入国家34%）暴露于生成式AI，文职最高；高收入国家女性就业的9.6%处于最高风险类别（男性3.5%）。",
 "約3万の職務タスクを専門家の検証とAIによる採点で評価したILOの指数で、曝露は代替ではなく変化の可能性を意味する。世界の雇用の25%（高所得国34%）が曝露し、事務職が最も高く、高所得国の女性雇用の9.6%が最高リスク区分（男性3.5%）に属した。"],
["AI 영향이 사무·고객 응대의 여성 일자리에 집중될 수 있다는 근거로 쓴다.",
 "Used as evidence that AI's impact may concentrate on women's jobs in clerical and customer-facing work.",
 "Используется как свидетельство того, что влияние ИИ может сосредоточиться на женских рабочих местах в офисной работе и обслуживании клиентов.",
 "作为AI影响可能集中于文职与顾客接待类女性岗位的依据。",
 "AIの影響が事務・顧客応対の女性の仕事に集中しうるという根拠として用いる。"]);

E(42,"C","ind",2025,"Kiran Tomlinson, Sonia Jaffe, Will Wang, Scott Counts & Siddharth Suri (Microsoft Research), arXiv:2507.07935","Working with AI: Measuring the Applicability of Generative AI to Occupations","https://arxiv.org/abs/2507.07935",
"the most common and successful AI-assisted work activities involve information work",
["Microsoft Bing Copilot 대화 20만 건으로 직업별 AI 적용 가능성을 측정한 기업 연구 프리프린트다. '적용 가능성'은 사용 흔적이지 대체·임금 효과가 아니며, 자사 제품 데이터라는 한계가 있다.",
 "A company-research preprint measuring AI applicability by occupation from 200,000 Microsoft Bing Copilot conversations. Applicability reflects traces of use, not replacement or wage effects, and the data come from the company's own product.",
 "Препринт корпоративного исследования, измеряющий применимость ИИ к профессиям по 200 000 диалогов Microsoft Bing Copilot. Применимость отражает следы использования, а не замещение или влияние на зарплату; данные — из собственного продукта компании.",
 "这是基于20万条Microsoft Bing Copilot对话衡量各职业AI适用性的企业研究预印本。“适用性”反映的是使用痕迹，而非替代或工资效应，且数据来自其自家产品。",
 "Microsoft Bing Copilotの会話20万件で職業別のAI適用可能性を測った企業研究のプレプリントである。「適用可能性」は利用の痕跡であって代替や賃金への効果ではなく、自社製品のデータという限界がある。"],
["정보를 만들고 전달하는 응대 업무가 AI 적용의 중심에 있다는 방향성 근거로만 쓴다.",
 "Used only as directional evidence that service work creating and communicating information is at the centre of AI application.",
 "Используется лишь как свидетельство направления: обслуживание, связанное с созданием и передачей информации, находится в центре применения ИИ.",
 "仅作为生成与传递信息的接待业务处于AI应用中心的方向性依据。",
 "情報をつくり伝える応対業務がAI適用の中心にあるという方向性の根拠としてのみ用いる。"]);

// ===== Evidence 43–60: emotional labour among colleagues (asking, mediation, hiding AI use, books) =====
E(43,"C","press",2026,"ZDNet Korea (다나와 'AI다나와' 이용자 5,586명 조사, 2026-10-13~26; 응답자 직장인 62%), 2026-11-16","직장인 4명 중 3명 \"AI 결과물, 내가 한 듯 보고\"","https://zdnet.co.kr/view/?no=20261116084140",
"모르는 것이 생겼을 때 AI에게 묻는 것이 편하다는 응답은 72.4%에 달했다",
["가격비교 기업이 자사 AI 커뮤니티 이용자를 대상으로 이벤트 형식으로 실시한 조사를 보도한 기사다. AI를 이미 즐겨 쓰는 사람들이 표본이어서 'AI가 편하다'는 응답이 과대 추정되었을 가능성이 크고, 직장인만 따로 본 수치는 일부 문항에 한정된다.",
 "A news report on an event-style survey that a price-comparison company ran among users of its own AI community. Because the sample consists of people who already like using AI, 'AI is easier' is probably overstated, and figures for employees alone are limited to some questions.",
 "Новостной материал об опросе в формате акции, который компания по сравнению цен провела среди пользователей собственного ИИ-сообщества. Выборка состоит из тех, кто уже охотно пользуется ИИ, поэтому ответ «с ИИ проще» скорее завышен, а данные только по работникам есть лишь для части вопросов.",
 "这是一篇报道比价企业以活动形式对其自有AI社区用户进行调查的新闻。样本是本来就爱用AI的人，“问AI更自在”的比例很可能被高估，单独列出的上班族数据也仅限部分问题。",
 "価格比較企業が自社AIコミュニティの利用者を対象にイベント形式で行った調査を報じた記事である。すでにAIを好んで使う人が標本なので「AIの方が気楽」という回答は過大になりやすく、会社員だけの数値は一部の設問に限られる。"],
["수치의 크기보다 '정확성(5.1%)이 아니라 눈치·민망함·핀잔 회피(65.5%)'라는 이유의 구성이 한국 일터의 질문 비용을 보여주는 방향성 근거로 쓴다.",
 "Used as directional evidence on the cost of asking in Korean workplaces — less for the size of the figures than for the mix of reasons: avoiding others' moods, embarrassment and scolding (65.5%) rather than accuracy (5.1%).",
 "Используется как свидетельство направления о «цене вопроса» на корейской работе — не столько из-за величины цифр, сколько из-за структуры причин: избежать чужого настроения, неловкости и упрёков (65,5%), а не точность (5,1%).",
 "与其看数值大小，不如看理由构成——是回避看人脸色、难为情和挨训（65.5%），而非准确性（5.1%）——以此作为韩国职场“提问成本”的方向性依据。",
 "数値の大きさよりも、正確さ（5.1%）ではなく気遣い・気恥ずかしさ・小言の回避（65.5%）という理由の構成を、韓国の職場の「質問コスト」を示す方向性の根拠として用いる。"]);

E(44,"C","press",2026,"한경 MONEY (피앰아이 'AI와의 감정교류 인식 조사', 전국 만 20~59세 대화형 AI 이용자 1,000명), 2026-09-18","\"사람보다 AI가 편해\"…이용자 57% 고민·감정 털어놨다","https://magazine.hankyung.com/money/article/202609183239c",

 "这是一篇报道调研公司在线调查的新闻，样本限于对话式AI用户，“情感对话”的定义较宽，并未单独统计关于职场关系的烦恼。",
 "調査会社のオンライン調査を報じた記事で、標本は対話型AIの利用者に限られ、「感情の会話」の範囲は広く定義されている。職場の人間関係の悩みだけを別に集計したものではない。"],
["AI가 감정을 털어놓는 상대로 쓰이고 젊은 층일수록 그 비율이 높다는 방향을 확인하는 데만 쓴다.",
 "Used only to confirm the direction that AI is used as a confidant for feelings, and more so among younger people.",

E(45,"C","press",2026,"AIsmiley (インディードリクルートパートナーズ「AIと仕事に関する日米実態調査」, 日米の20〜59歳就業者20,608人, 2026年3月実施), 最終更新 2026-09-08","仕事の相談相手「生成AI」は日本で約1割、米国では約3割で「同僚」上回る。AIと仕事に関する日米実態調査","https://aismiley.co.jp/ai_news/indeed-recruit-partners-ai-survey/",
"日本では1位が「同僚」で2位が「上司」となり、それぞれ約3割で拮抗し",
["채용 플랫폼 기업의 대규모 일·미 비교 조사를 AI 전문 매체가 정리한 기사다. 같은 문항으로 두 나라를 비교한 드문 자료지만, 원 보도자료를 직접 확인하지 못했고 수치가 '약 3할'처럼 반올림되어 있어 정밀 비교에는 한계가 있다.",
 "An AI trade outlet's summary of a large Japan–US comparison survey by a recruitment-platform company. It is a rare same-question comparison of the two countries, but the original press release could not be checked directly and figures are rounded (e.g. 'about 30%'), limiting precise comparison.",
 "Обзор отраслевого ИИ-издания о большом японско-американском сравнительном опросе компании-платформы найма. Это редкое сравнение двух стран по одинаковому вопросу, но исходный пресс-релиз проверить напрямую не удалось, а цифры округлены («около 30%»), что ограничивает точное сравнение.",
 "这是AI专业媒体对招聘平台企业大型日美比较调查的整理报道。虽是少见的同一问题两国比较资料，但未能直接查到原始新闻稿，且数字经过“约三成”式的取整，精确比较有限。",
 "採用プラットフォーム企業による大規模な日米比較調査をAI専門メディアがまとめた記事である。同じ設問で両国を比べた貴重な資料だが、元のプレスリリースは直接確認できず、数値も「約3割」のように丸められているため、精密な比較には限界がある。"],
["일본은 여전히 사람(동료·상사)에게 먼저 상의하고 미국은 AI가 상사와 같은 비중이라는 국가 차이, 그리고 '상대에게 폐가 될까 봐'라는 공통 이유의 근거로 쓴다.",
 "Used as evidence for the country difference — Japanese workers still consult people (colleagues, bosses) first, while in the US AI is on a par with the boss — and for the shared reason 'it might be a burden to the other person'.",
 "Используется как свидетельство различия стран — в Японии сначала советуются с людьми (коллеги, начальник), а в США ИИ наравне с начальником — и общей причины «могу доставить человеку неудобство».",
 "用作国家差异的依据——日本仍先找人（同事、上司）商量，而美国AI与上司比重相当——以及“怕给对方添麻烦”这一共同理由的依据。",
 "日本では今も人（同僚・上司）に先に相談し、米国ではAIが上司と同じ比重であるという国の違い、そして「相手に迷惑がかかるかもしれない」という共通の理由の根拠として用いる。"]);

E(46,"C","survey",2026,"レバレジーズ株式会社（ハタラクティブ）調査リリース, 20代の会社員595名, 2026-03-24","相談相手は“否定されないAI”へ、若手社員の約4人に1人が「上司より生成AI」を信頼","https://leverages.jp/news/2026/0324/5851/",
"「直属の上司よりも生成AIを信頼する（26.5%）」と回答した人が約4人に1人",
["전직 지원 서비스를 운영하는 기업의 온라인 조사로, 전직 의향이 있는 청년이 과대 대표될 수 있다. '생성형 AI를 더 신뢰한다'는 응답은 '어느 쪽이냐면 AI'를 합친 값이다.",
 "An online survey by a company that runs a job-change support service, so young people open to changing jobs may be over-represented. 'Trust generative AI more' combines 'AI' and 'rather AI'.",
 "Онлайн-опрос компании, которая ведёт сервис помощи в смене работы, поэтому молодёжь, настроенная сменить работу, может быть представлена с перекосом. «Больше доверяю ИИ» объединяет ответы «ИИ» и «скорее ИИ».",
 "这是运营跳槽支持服务的企业所做的在线调查，有跳槽意愿的年轻人可能被过度代表。“更信任生成式AI”是“AI”和“偏向AI”两项之和。",
 "転職支援サービスを運営する企業のオンライン調査で、転職志向の若者が多めに含まれうる。「生成AIの方を信頼する」は「生成AI」「どちらかといえば生成AI」の合計である。"],
["사내 상담 창구의 형식화(35.1%)가 청년의 상담을 AI로 옮기는 요인이라는 방향의 근거로만 쓴다.",
 "Used only as directional evidence that hollowed-out internal consultation channels (35.1%) push young workers' consultations towards AI.",
 "Используется только как свидетельство направления: формальность внутренних каналов консультаций (35,1%) толкает молодых работников к ИИ.",
 "仅作为方向性依据：企业内部咨询渠道流于形式（35.1%）促使年轻员工转向AI。",
 "社内の相談窓口の形骸化（35.1%）が若手の相談をAIへ向かわせる要因であるという方向の根拠としてのみ用いる。"]);

E(47,"C","ind",2025,"Microsoft WorkLab, 2025 Work Trend Index (Edelman Data x Intelligence; 31,000 knowledge workers in 31 markets, 2025-02-06–03-24)","2025: The Year the Frontier Firm Is Born","https://www.microsoft.com/en-us/worklab/work-trend-index/2025-the-year-the-frontier-firm-is-born",
"employees cited 24/7 availability (42%), machine speed and quality (30%)",
["AI 제품을 파는 기업이 독립 조사기관에 맡긴 31개 시장 조사로 표본은 크지만, 응답자가 지식노동자이고 조사 주체가 AI 확산에 이해관계를 가진다.",
 "A 31-market survey commissioned by a company that sells AI products from an independent research firm; the sample is large, but respondents are knowledge workers and the sponsor has a stake in AI adoption.",
 "Опрос в 31 стране, заказанный продавцом ИИ-продуктов у независимой исследовательской фирмы; выборка большая, но респонденты — работники умственного труда, а заказчик заинтересован в распространении ИИ.",
 "这是销售AI产品的企业委托独立调研机构在31个市场开展的调查，样本大，但受访者为知识工作者，且主办方与AI普及存在利害关系。",
 "AI製品を販売する企業が独立調査機関に委託した31市場の調査で、標本は大きいが、回答者は知識労働者であり、主体がAI普及に利害を持つ。"],
["동료 대신 AI를 찾는 이유가 세계 평균으로는 '평가 회피'보다 효율(24시간·속도)이라는 비교 기준선으로 쓴다.",
 "Used as the comparative baseline that, on the global average, people turn to AI instead of colleagues for efficiency (24/7, speed) rather than to avoid judgement.",
 "Используется как сравнительная база: в среднем по миру к ИИ вместо коллег обращаются ради эффективности (круглосуточно, скорость), а не чтобы избежать оценки.",
 "用作比较基准：就全球平均而言，人们用AI代替同事是为了效率（全天候、速度），而不是为了回避评判。",
 "同僚の代わりにAIを使う理由は、世界平均では「評価の回避」より効率（24時間・速度）であるという比較の基準線として用いる。"]);

E(48,"C","ind",2024,"Slack Workforce Lab, Fall 2024 Workforce Index (17,000+ desk workers; fieldwork August 2024)","The Fall 2024 Workforce Index Shows Executives and Employees Investing in AI, but Uncertainty Holding Back Adoption","https://slack.com/blog/news/the-fall-2024-workforce-index-shows-executives-and-employees-investing-in-ai-but-uncertainty-holding-back-adoption",
"Nearly half (48%) of all desk workers would be uncomfortable admitting to their manager",
["협업 도구 기업이 발표한 데스크 노동자 조사로, 대상이 사무직에 한정되고 자사 제품 맥락에서 해석된다. 사용자의 언어 설정에 따라 같은 주소에서 현지어판이 열릴 수 있다.",
 "A desk-worker survey published by a collaboration-software company; it covers office workers only and is interpreted in the context of the company's products. The same address may open a localised version depending on the reader's language.",
 "Опрос офисных работников, опубликованный компанией — разработчиком ПО для совместной работы; охватывает только офисных сотрудников и трактуется в контексте её продуктов. По тому же адресу может открыться локализованная версия.",
 "这是协作软件企业发布的办公室员工调查，对象仅限白领，并在其产品语境下解读。同一网址可能因读者语言设置而打开本地语言版。",
 "コラボレーションツール企業が公表したデスクワーカー調査で、対象は事務職に限られ、自社製品の文脈で解釈されている。同じアドレスでも言語設定によって現地語版が開くことがある。"],
["AI 사용을 상사에게 밝히기 꺼리는 '은폐의 감정노동'이 널리 퍼져 있다는 방향의 근거로 쓴다.",
 "Used as directional evidence that the 'emotional labour of concealment' — reluctance to tell one's manager about AI use — is widespread.",
 "Используется как свидетельство направления: «эмоциональный труд сокрытия» — нежелание говорить руководителю об использовании ИИ — широко распространён.",
 "用作方向性依据：不愿向上司承认使用AI的“隐瞒型情绪劳动”普遍存在。",
 "AI利用を上司に打ち明けにくい「隠すことの感情労働」が広がっているという方向の根拠として用いる。"]);

E(49,"B","survey",2025,"University of Melbourne (Gillespie, Lockey et al.) & KPMG, Trust, attitudes and use of AI: A global study 2025 (48,000+ people, 47 countries, Nov 2024–Jan 2025); MBS news release","Global study reveals trust of AI remains a critical challenge","https://mbs.edu/news/global-study-reveals-trust-of-ai-remains-a-critical-challenge",
"over half (57%) of employees say they hide their use of AI",
["대학 연구진이 회계법인과 함께 47개국에서 같은 문항으로 실시한 대규모 조사로 국가 비교에 유용하다. 다만 온라인 패널 조사이고, '숨긴다'에는 결과물을 자기 것처럼 제출하는 행위가 함께 묶여 있다.",
 "A large same-question survey across 47 countries by university researchers with an accounting firm, useful for country comparison. It is an online-panel survey, however, and 'hiding' is bundled with presenting AI output as one's own.",
 "Крупный опрос в 47 странах с одинаковыми вопросами, проведённый университетскими исследователями совместно с аудиторской компанией; полезен для сравнения стран. Однако это опрос онлайн-панели, и «сокрытие» объединено с выдачей результатов ИИ за свои.",
 "这是大学研究团队与会计师事务所在47国以相同问题开展的大型调查，适合国家比较；但属于在线样本调查，“隐瞒”与把AI产出当作自己的成果提交被合并在一起。",
 "大学の研究チームが会計事務所と共同で47か国に同じ設問で行った大規模調査で、国際比較に有用である。ただしオンラインパネル調査であり、「隠す」にはAIの成果物を自分のものとして出す行為が一緒に含まれている。"],
["AI 사용의 은폐가 특정 국가가 아닌 세계적 현상이라는 판단의 핵심 근거로 쓴다.",
 "Used as the core evidence that concealing AI use is a global phenomenon, not a national one.",
 "Используется как основное свидетельство того, что сокрытие использования ИИ — мировое, а не национальное явление.",
 "作为“隐瞒使用AI是全球现象而非个别国家现象”这一判断的核心依据。",
 "AI利用の隠蔽が特定の国ではなく世界的な現象であるという判断の中心的な根拠として用いる。"]);

E(50,"A","q1",2025,"Jessica A. Reif, Richard P. Larrick & Jack B. Soll, PNAS 122(19): e2426766122 (2025), PMID 40339114","Evidence of a social evaluation penalty for using AI","https://pmc.ncbi.nlm.nih.gov/articles/PMC12088386/",
"observers perceive people who get help from AI as lazier, less competent",
["사전 등록된 네 개 실험(4,400여 명)으로 'AI 사용자 낙인'을 측정한 동료심사 논문이다. 실험·시나리오 상황이라 실제 직장의 장기 평가로 그대로 옮기기는 어렵고, 미국 온라인 표본 중심이다.",
 "A peer-reviewed paper measuring the stigma of AI use in four pre-registered experiments (4,400+ participants). Being experimental and scenario-based, it does not transfer directly to long-term appraisal in real workplaces, and it relies mainly on US online samples.",
 "Рецензируемая статья, измеряющая стигму использования ИИ в четырёх предрегистрированных экспериментах (более 4400 участников). Эксперименты и сценарии нельзя напрямую перенести на долгосрочную оценку на реальной работе; выборки в основном американские онлайн.",
 "这是通过四项预注册实验（4,400余人）测量“AI使用者污名”的同行评审论文。实验与情景设置难以直接推及真实职场的长期评价，且以美国在线样本为主。",
 "事前登録した四つの実験（4,400人余り）で「AI利用者へのスティグマ」を測った査読論文である。実験・シナリオ状況なので実際の職場の長期的評価にそのまま移すのは難しく、米国のオンライン標本が中心である。"],
["AI에게 물어 핀잔을 피한 사람이 이번에는 'AI를 썼다'는 사실로 평가받는다는 메커니즘의 근거로 쓴다.",
 "Used as evidence for the mechanism by which someone who avoided scolding by asking AI is now judged for having used AI.",
 "Используется как свидетельство механизма: человек, избежавший упрёков благодаря ИИ, теперь оценивается за сам факт использования ИИ.",
 "用作以下机制的依据：靠问AI躲开训斥的人，转而因“用了AI”而被评判。",
 "AIに聞いて小言を避けた人が、今度は「AIを使った」こと自体で評価されるというメカニズムの根拠として用いる。"]);

E(51,"A","q1",2023,"Jana Holthöwer & Jenny van Doorn, Journal of the Academy of Marketing Science 51(4): 767–784 (2023), PMID 35463183","Robots do not judge: service robots can alleviate embarrassment in service encounters","https://pmc.ncbi.nlm.nih.gov/articles/PMC9019535/",
"consumers feel less judged by a robot (vs. a human)",
["실험실·현장(페이스북 광고)·온라인의 다섯 개 연구로 '평가받는 느낌'의 차이를 확인한 동료심사 논문이다. 대상은 고객의 민망한 구매 상황이어서, 직장 동료 사이의 질문에 적용하는 것은 유추다.",
 "A peer-reviewed paper confirming the difference in 'feeling judged' across five lab, field (Facebook ads) and online studies. The setting is customers' embarrassing purchases, so applying it to questions between colleagues is an analogy.",
 "Рецензируемая статья, подтвердившая разницу в ощущении «меня оценивают» в пяти лабораторных, полевых (реклама в Facebook) и онлайн-исследованиях. Речь о неловких покупках клиентов, поэтому перенос на вопросы между коллегами — аналогия.",
 "这是通过实验室、现场（Facebook广告）和在线共五项研究确认“被评判感”差异的同行评审论文。研究情境是顾客的尴尬购买，推及同事之间的提问属于类比。",
 "実験室・フィールド（Facebook広告）・オンラインの五つの研究で「評価されている感覚」の差を確かめた査読論文である。対象は顧客の気恥ずかしい購買場面なので、職場の同僚間の質問に当てはめるのは類推である。"],
["AI가 '평가하지 않는 상대'로 느껴진다는 심리 메커니즘의 근거로 쓴다.",
 "Used as evidence for the psychological mechanism by which AI feels like a counterpart that does not judge.",
 "Используется как свидетельство психологического механизма: ИИ воспринимается как собеседник, который не оценивает.",
 "用作AI被感知为“不评判的对象”这一心理机制的依据。",
 "AIが「評価しない相手」と感じられるという心理メカニズムの根拠として用いる。"]);

E(52,"A","q1",2023,"Jess Hohenstein, Rene F. Kizilcec, Dominic DiFranzo, Zhila Aghajari, Hannah Mieczkowski, Karen Levy, Mor Naaman, Jeffrey Hancock & Malte F. Jung, Scientific Reports 13: 5487 (2023), PMID 37015964","Artificial intelligence in communication impacts language and social relationships","https://pmc.ncbi.nlm.nih.gov/articles/PMC10073210/",
"people are evaluated more negatively if they are suspected to be using algorithmic responses",
["무작위 실험으로 AI 답장 추천의 사회적 효과를 측정한 동료심사 논문이다. 낯선 사람 간 짧은 대화 과제여서, 위계가 있는 장기 직장 관계에 그대로 적용하기는 어렵다.",
 "A peer-reviewed paper measuring the social effects of AI reply suggestions in randomised experiments. The task was a short conversation between strangers, so it does not carry over directly to long-term, hierarchical workplace relationships.",
 "Рецензируемая статья, измерившая социальные эффекты подсказок ответов ИИ в рандомизированных экспериментах. Задача — короткий разговор незнакомцев, поэтому прямо переносить её на долгие иерархические рабочие отношения нельзя.",
 "这是用随机实验测量AI回复建议社会效应的同行评审论文。任务是陌生人之间的短对话，难以直接推及有层级的长期职场关系。",
 "ランダム化実験でAIの返信候補の社会的効果を測った査読論文である。見知らぬ人どうしの短い会話課題なので、上下関係のある長期的な職場関係にそのまま当てはめるのは難しい。"],
["AI가 대화의 정서를 부드럽게 하는 '중재' 효과와, AI 개입이 드러나면 그 효과가 깎이는 한계를 함께 보여주는 근거로 쓴다.",
 "Used as evidence both for AI's 'mediating' effect of softening the emotional tone of conversation and for its limit — the effect erodes once AI involvement is suspected.",
 "Используется как свидетельство и «посреднического» эффекта ИИ, смягчающего эмоциональный тон разговора, и его предела: эффект исчезает, если заподозрят участие ИИ.",
 "既用作AI缓和对话情绪的“调解”效果的依据，也用作其局限的依据——一旦被怀疑用了AI，效果便打折扣。",
 "AIが会話の感情を和らげる「仲介」効果と、AIの関与が疑われるとその効果が削がれる限界の両方を示す根拠として用いる。"]);

E(53,"A","q1",2024,"Michael Henry Tessler, Michiel A. Bakker et al., Science (2024); Google DeepMind publication page, 2024-10-18","AI can help humans find common ground in democratic deliberation","https://deepmind.google/research/publications/ai-can-help-humans-find-common-ground-in-democratic-deliberation/",
"preferred AI-generated statements to those written by human mediators",
["영국 시민 5,734명이 참여한 실험으로 AI 중재자의 합의문 작성 능력을 검증한 동료심사 논문이며, 게시 페이지는 개발 기업의 것이다. 정치 쟁점의 숙의 실험이어서 직장 갈등 중재로의 확장은 유추이고, '합의 최적화'가 깊은 숙의를 대체한다는 비판도 있다.",
 "A peer-reviewed paper testing an AI mediator's ability to draft group statements with 5,734 UK participants; the linked page belongs to the developer. It concerns deliberation on political issues, so extending it to workplace conflict mediation is an analogy, and critics argue that optimising for agreement can replace deep deliberation.",
 "Рецензируемая статья, проверившая способность ИИ-посредника составлять общие заявления с участием 5734 жителей Великобритании; страница принадлежит разработчику. Речь о обсуждении политических вопросов, поэтому перенос на посредничество в рабочих конфликтах — аналогия; критики считают, что оптимизация согласия может подменять глубокое обсуждение.",
 "这是有5,734名英国公民参与、检验AI调解员撰写共识声明能力的同行评审论文，所链页面属于开发企业。它针对政治议题的审议，推及职场冲突调解属于类比；也有批评认为“为共识而优化”会取代深度审议。",
 "英国市民5,734人が参加し、AI仲介者の合意文作成能力を検証した査読論文で、掲載ページは開発企業のものである。政治的争点の熟議実験なので職場の対立の仲介への拡張は類推であり、「合意の最適化」が深い熟議を置き換えるという批判もある。"],
["AI가 서로 다른 의견을 정리해 공통점을 찾는 '중재자' 역할을 할 수 있다는 가능성의 근거로 쓴다.",
 "Used as evidence that AI can act as a 'mediator' that organises differing views and finds common ground.",
 "Используется как свидетельство того, что ИИ может играть роль «посредника», который упорядочивает разные мнения и находит общее.",
 "用作AI可以充当整理分歧、寻找共同点的“调解员”这一可能性的依据。",
 "AIが異なる意見を整理して共通点を見つける「仲介者」の役割を果たしうるという可能性の根拠として用いる。"]);

E(54,"B","io",2025,"Fabrizio Dell'Acqua, Charles Ayoubi, Hila Lifshitz, Raffaella Sadun, Ethan Mollick, Lilach Mollick, Yi Han, Jeff Goldman, Hari Nair, Stewart Taub, Karim Lakhani et al., NBER Working Paper 33641 (2025)","The Cybernetic Teammate: A Field Experiment on Generative AI Reshaping Teamwork and Expertise","https://www.nber.org/papers/w33641",
"individuals with AI matched the performance of teams without AI",
["P&G 전문가 776명을 무작위 배정한 사전 등록 현장 실험이지만, 하루짜리 혁신 과제이고 연구진 일부가 AI 활용을 연구·자문하는 입장이다. 워킹페이퍼 단계의 결과로 본다.",
 "A pre-registered field experiment that randomly assigned 776 P&G professionals, but the task was a one-day innovation challenge and some authors research and advise on AI use. Treated as a working-paper result.",
 "Предрегистрированный полевой эксперимент со случайным распределением 776 специалистов P&G, но задача была однодневной инновационной, а часть авторов изучает и консультирует по использованию ИИ. Рассматривается как результат рабочего доклада.",
 "这是对776名宝洁专业人员随机分组的预注册现场实验，但任务是为期一天的创新挑战，部分作者本身研究并咨询AI应用。视为工作论文阶段的结果。",
 "P&Gの専門職776人を無作為に割り当てた事前登録のフィールド実験だが、1日の革新課題であり、著者の一部はAI活用を研究・助言する立場にある。ワーキングペーパー段階の結果として扱う。"],
["AI가 성과뿐 아니라 동료가 주던 정서적·동기적 역할 일부를 대신할 수 있다는 근거로 쓴다.",
 "Used as evidence that AI can take over not only performance but part of the emotional and motivational role that teammates provided.",
 "Используется как свидетельство того, что ИИ может взять на себя не только результат, но и часть эмоциональной и мотивационной роли коллег.",
 "用作AI不仅能提升绩效、还能替代同事所提供的部分情感与激励作用的依据。",
 "AIが成果だけでなく、同僚が担っていた感情面・動機づけの役割の一部を代わりうるという根拠として用いる。"]);

E(55,"A","q1",2023,"Pok Man Tang, Joel Koopman, Ke Michael Mai, David De Cremer, Jack H. Zhang, Philipp Reynders, Chin Tung Stewart Ng & I-Heng Chen, Journal of Applied Psychology 108(11): 1766–1789 (2023), PMID 37307359","No person is an island: Unpacking the work and after-work consequences of interacting with artificial intelligence","https://pubmed.ncbi.nlm.nih.gov/37307359/",
"a feeling of loneliness (maladaptive), which then further impair employee well-being after work",
["대만·인도네시아·미국·말레이시아 노동자 794명을 대상으로 설문·현장 실험·시뮬레이션을 결합한 동료심사 논문이다. 생성형 AI 이전의 업무용 AI 시스템을 다루며, 일부 결과는 상관관계여서 인과로 단정하기 어렵다.",
 "A peer-reviewed paper combining surveys, a field experiment and a simulation with 794 workers in Taiwan, Indonesia, the US and Malaysia. It concerns workplace AI systems from before generative AI, and some results are correlational, so causation cannot be asserted.",
 "Рецензируемая статья, сочетающая опросы, полевой эксперимент и симуляцию с 794 работниками Тайваня, Индонезии, США и Малайзии. Речь о рабочих ИИ-системах до генеративного ИИ, часть результатов корреляционная, поэтому причинность утверждать нельзя.",
 "这是结合问卷、现场实验与模拟、以台湾、印度尼西亚、美国和马来西亚794名员工为对象的同行评审论文。研究的是生成式AI之前的工作用AI系统，部分结果属相关关系，难以断定因果。",
 "台湾・インドネシア・米国・マレーシアの労働者794人を対象に、調査・フィールド実験・シミュレーションを組み合わせた査読論文である。生成AI以前の業務用AIシステムを扱い、一部の結果は相関関係なので因果とは断定しにくい。"],
["AI가 사람 사이의 상호작용을 대신할 때 외로움이라는 비용과 '사람을 찾는' 반작용이 함께 생긴다는 핵심 근거로 쓴다.",
 "Used as the core evidence that when AI replaces human interaction, a cost (loneliness) and a counter-reaction (seeking people out) arise together.",
 "Используется как основное свидетельство того, что, когда ИИ заменяет человеческое общение, одновременно возникают цена (одиночество) и ответная реакция (поиск людей).",
 "作为核心依据：当AI取代人际互动时，孤独这一代价与“去找人”的反作用会同时出现。",
 "AIが人どうしのやり取りを代わるとき、孤独というコストと「人を求める」反作用が同時に生じるという中心的な根拠として用いる。"]);

E(56,"A","q1",2024,"R. Maria del Rio-Chanona, Nadzeya Laurentsyeva & Johannes Wachs, PNAS Nexus 3(9): pgae400 (2024); Institute for New Economic Thinking at Oxford news, 2024-09-26","New Study Reveals Impact of ChatGPT on Public Knowledge Sharing","https://www.inet.ox.ac.uk/news/new-study-reveals-impact-of-chatgpt-on-public-knowledge-sharing",
"ChatGPT led to a 25% drop in activity on Stack Overflow",
["비교 플랫폼을 대조군으로 쓴 이중차분 설계의 동료심사 논문을 연구소가 소개한 글이다. 공개 사이트의 활동만 측정하므로 사내 메신저나 대면 질문의 변화는 알 수 없고, 감소는 ChatGPT 이전부터 일부 시작되었다는 지적도 있다.",
 "A research institute's summary of a peer-reviewed difference-in-differences study using comparable platforms as controls. It measures only activity on a public site, so it cannot capture changes in internal chat or face-to-face questions, and some note the decline began partly before ChatGPT.",
 "Обзор научного института о рецензируемом исследовании «разность разностей» со сравнимыми платформами в качестве контроля. Измеряется лишь активность на публичном сайте, поэтому изменения во внутренних чатах и личных вопросах не видны; отмечают также, что спад частично начался до ChatGPT.",
 "这是研究机构对一篇以可比平台为对照组的双重差分同行评审论文的介绍。只测量公开网站上的活动，无法反映内部聊天或当面提问的变化，也有人指出下降在ChatGPT之前已部分开始。",
 "比較可能なプラットフォームを対照群にした差分の差分法による査読論文を、研究所が紹介した記事である。公開サイトの活動だけを測るため社内チャットや対面での質問の変化はわからず、減少はChatGPT以前から一部始まっていたという指摘もある。"],
["개발자 업계에서 '사람에게 묻는 공개 대화'가 AI로 옮겨 가 공동체의 지식 공유가 줄어든다는 근거로 쓴다.",
 "Used as evidence that, in software development, public 'asking people' conversations are moving to AI and community knowledge-sharing is shrinking.",
 "Используется как свидетельство того, что в разработке ПО публичные «вопросы людям» переходят к ИИ и обмен знаниями в сообществе сокращается.",
 "用作依据：在软件开发领域，“向人提问”的公开对话正转向AI，社区的知识共享随之减少。",
 "ソフトウェア開発で「人に聞く公開の対話」がAIへ移り、コミュニティの知識共有が減っているという根拠として用いる。"]);

E(57,"B","io",2025,"Manuel Hoffmann, Sam Boysel, Frank Nagle, Sida Peng & Kevin Xu, 'Generative AI and the Nature of Work' (CESifo WP 11479); MIT Initiative on the Digital Economy summary (Beth LaMontagne)","Beyond Productivity: GenAI and the Changing Nature of Work","https://ide.mit.edu/insights/beyond-productivity-genai-and-the-changing-nature-of-work",
"they turned to GitHub Copilot, instead of seeking advice and solutions from peers",
["오픈소스 개발자 18만 7천여 명의 GitHub 활동을 분석한 워킹페이퍼를 연구소가 요약한 글로, 저자 일부가 GitHub·Microsoft 소속이다. 오픈소스 환경이라 회사 안의 사수·신입 관계로 일반화하는 데는 한계가 있다.",
 "A research institute's summary of a working paper analysing the GitHub activity of more than 187,000 open-source developers; some authors work at GitHub and Microsoft. The open-source setting limits generalisation to mentor–junior relationships inside companies.",
 "Обзор научного института о рабочем докладе, анализирующем активность на GitHub более 187 000 разработчиков открытого ПО; часть авторов работает в GitHub и Microsoft. Среда открытого ПО ограничивает перенос на отношения наставника и новичка внутри компаний.",
 "这是研究机构对一篇分析18.7万余名开源开发者GitHub活动的工作论文所作的摘要，部分作者任职于GitHub和微软。开源环境限制了其推及企业内部师徒关系的程度。",
 "オープンソース開発者18万7千人余りのGitHub活動を分析したワーキングペーパーを研究所が要約した記事で、著者の一部はGitHub・Microsoft所属である。オープンソース環境のため、社内の先輩・新人関係への一般化には限界がある。"],
["AI가 동료에게 묻는 일을 대신하면서 독립적 작업이 늘고 멘토링 기회가 줄 수 있다는 근거로 쓴다.",
 "Used as evidence that as AI replaces asking colleagues, independent work rises and mentoring opportunities may shrink.",
 "Используется как свидетельство того, что, когда ИИ заменяет вопросы коллегам, растёт самостоятельная работа и могут сокращаться возможности наставничества.",
 "用作依据：AI取代向同事提问后，独立工作增加，带教机会可能减少。",
 "AIが同僚に聞くことを代わることで独立した作業が増え、メンタリングの機会が減りうるという根拠として用いる。"]);

E(58,"C","book",2023,"조경숙, 『액세스가 거부되었습니다』, 휴머니스트 (2023; 전자책 ISBN 9791170870111) — 리디 도서 정보(목차·출판사 서평)","액세스가 거부되었습니다","https://ridibooks.com/books/243000481",
"이런 것도 모르면서 개발자라고 할 수 있나요?",
["개발자 출신 테크-페미 활동가가 여성 노동자로서의 경험을 바탕으로 쓴 테크 업계 관찰기로, 체계적 조사가 아니라 현장 경험과 사례에 기반한 논증이다. 본 보고서는 목차와 출판사 서평에서 확인되는 범위의 논지만 인용했다.",
 "An observational book on the tech industry by a former developer and tech-feminist activist, drawing on her experience as a woman worker; its argument rests on field experience and cases, not systematic surveys. This report cites only the argument visible in the table of contents and the publisher's review.",
 "Книга-наблюдение о технологической отрасли бывшей разработчицы и техно-феминистской активистки, основанная на её опыте работницы; аргументация опирается на полевой опыт и случаи, а не на систематические опросы. Доклад цитирует лишь тезисы, видимые в оглавлении и издательской аннотации.",
 "这是一位开发者出身的科技女性主义活动家基于自身女性劳动者经历写成的科技业观察记，论证建立在现场经验与案例上，而非系统调查。本报告仅引用目录与出版社书评中可确认的论点。",
 "開発者出身のテック・フェミニスト活動家が、女性労働者としての経験をもとに書いたテック業界の観察記で、体系的な調査ではなく現場経験と事例に基づく論証である。本報告は目次と出版社の書評で確認できる範囲の論旨のみを引用した。"],
["'독성 말투'라는 질문의 감정 비용, 6장의 「감정노동 없이 물어볼 수 있는 사수, 챗GPT」와 「기계의 윤리적 태도를 위해 희생되는 건 누구일까」라는 문제 설정을 이 장의 출발점으로 쓴다.",
 "Used as the starting point of this section: the emotional cost of asking under a 'toxic tone', and Chapter 6's framing — 'ChatGPT, a senior you can ask without emotional labour' and 'Who is sacrificed for the machine's ethical manners?'",
 "Используется как отправная точка раздела: эмоциональная цена вопроса при «токсичном тоне» и постановка проблемы в главе 6 — «ChatGPT — наставник, которого можно спросить без эмоционального труда» и «Кем жертвуют ради этичного поведения машины?»",
 "作为本章的出发点：“毒舌”带来的提问情绪成本，以及第6章的问题设定——“无需情绪劳动就能请教的师傅ChatGPT”与“为了机器的伦理姿态，牺牲的是谁？”",
 "「毒舌」による質問の感情コストと、第6章の「感情労働なしで聞ける先輩、ChatGPT」「機械の倫理的態度のために犠牲になるのは誰か」という問題設定を、この章の出発点として用いる。"]);

E(59,"B","book",2015,"Sherry Turkle (MIT), Reclaiming Conversation: The Power of Talk in a Digital Age, Penguin Press (2015) — publisher's page","Reclaiming Conversation: The Power of Talk in a Digital Age","https://www.penguinrandomhouse.com/books/313732/reclaiming-conversation-by-sherry-turkle/",
"we have sacrificed conversation for mere connection",
["5년간 가정·학교·직장에서의 면접과 관찰에 기반한 연구서로, 스마트폰 시대를 다루며 생성형 AI 이전에 쓰였다. 대면 대화의 가치를 강하게 주장하는 규범적 입장이 섞여 있다.",
 "A research-based book drawing on five years of interviews and observation in homes, schools and workplaces; it addresses the smartphone era and predates generative AI, and it mixes in a strongly normative case for face-to-face talk.",
 "Исследовательская книга на основе пяти лет интервью и наблюдений в семьях, школах и на работе; посвящена эпохе смартфонов и написана до генеративного ИИ, с сильной нормативной позицией в пользу живого разговора.",
 "这是基于五年间在家庭、学校和职场的访谈与观察写成的研究型著作，针对智能手机时代、写于生成式AI之前，并夹杂着强烈主张面对面交谈价值的规范立场。",
 "家庭・学校・職場での5年間のインタビューと観察に基づく研究書で、スマートフォン時代を扱い生成AI以前に書かれた。対面の会話の価値を強く主張する規範的な立場が混じっている。"],
["대면 대화가 공감과 신뢰를 기르는 장이라는 관점에서 '줄어드는 대화'의 비용을 해석하는 틀로 쓴다.",
 "Used as a framework for interpreting the cost of 'disappearing conversations', from the view that face-to-face talk is where empathy and trust grow.",
 "Используется как рамка для толкования цены «исчезающих разговоров» с точки зрения того, что живой разговор взращивает эмпатию и доверие.",
 "以“面对面交谈是培养共情与信任之所”的观点，作为解读“减少的对话”之代价的框架。",
 "対面の会話が共感と信頼を育てる場であるという観点から、「減っていく会話」のコストを解釈する枠組みとして用いる。"]);

E(60,"B","book",2019,"Mary L. Gray & Siddharth Suri, Ghost Work: How to Stop Silicon Valley from Building a New Global Underclass, Houghton Mifflin Harcourt (2019) — book website","Ghost Work","https://ghostwork.info/",
"the invisible human workforce that powers the web",
["인도·미국의 플랫폼 노동자에 대한 민족지와 조사에 기반한 연구서이며, 저자들은 집필 당시 마이크로소프트 리서치 소속이었다. 생성형 AI 이전의 크라우드 노동을 다루지만, 데이터 레이블링 노동의 구조는 이어진다.",
 "A research-based book drawing on ethnography and surveys of platform workers in India and the US; the authors were at Microsoft Research at the time. It covers crowd work before generative AI, but the structure of data-labelling work carries over.",
 "Исследовательская книга на основе этнографии и опросов платформенных работников Индии и США; авторы тогда работали в Microsoft Research. Речь о краудработе до генеративного ИИ, но структура труда по разметке данных сохраняется.",
 "这是基于对印度和美国平台劳动者的民族志与调查写成的研究型著作，作者写作时任职于微软研究院。书中讨论的是生成式AI之前的众包劳动，但数据标注劳动的结构延续至今。",
 "インドと米国のプラットフォーム労働者への民族誌と調査に基づく研究書で、著者らは執筆当時マイクロソフトリサーチに所属していた。生成AI以前のクラウドワークを扱うが、データラベリング労働の構造は続いている。"],
["AI가 걸러 주는 감정의 비용이 보이지 않는 노동자에게 옮겨 간다는 논지의 근거로 쓴다.",
 "Used as evidence for the argument that the cost of the emotions AI filters out is shifted onto invisible workers.",
 "Используется как свидетельство тезиса о том, что цена эмоций, которые фильтрует ИИ, перекладывается на невидимых работников.",
 "用作以下论点的依据：AI替人过滤掉的情绪，其代价被转移到看不见的劳动者身上。",
 "AIがこしとる感情のコストが見えない労働者へ移るという論旨の根拠として用いる。"]);
