SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[10,13,11,8,9,12],["같은 문항으로 비교한 갤럽 2025년 자료에서 '전날 스트레스를 많이 느꼈다'는 직장인은 미국 50%, 중국 48%, 영국 46%로 높았고 한국·일본(각 39%)과 독일(38%)은 세계 평균(40%) 수준이어서, 일반 스트레스로만 보면 한국은 최상위가 아니다.",
  "In Gallup's 2025 data, which use the same question everywhere, the share of employees who felt a lot of stress the previous day was highest in the US (50%), China (48%) and the UK (46%), while Korea and Japan (39% each) and Germany (38%) were near the global average (40%) — on general stress alone, Korea is not at the top.",
  "По данным Gallup за 2025 год (одинаковый вопрос во всех странах), доля работников, испытавших сильный стресс накануне, выше всего в США (50%), Китае (48%) и Великобритании (46%), а Корея и Япония (по 39%) и Германия (38%) — около мирового среднего (40%): по общему стрессу Корея не лидер.",
  "在各国使用相同问题的盖洛普2025年数据中，“前一天感到很大压力”的员工比例以美国（50%）、中国（48%）、英国（46%）最高，韩国和日本（各39%）与德国（38%）接近全球平均（40%）——仅看一般压力，韩国并不在最前列。",
  "同じ設問で比べたギャラップの2025年データでは、「前日に強いストレスを感じた」従業員は米国50%、中国48%、英国46%と高く、日本・韓国（各39%）とドイツ（38%）は世界平均（40%）並みで、一般的なストレスだけで見れば韓国は最上位ではない。"],
  ["갤럽 지표는 감정노동이 아니라 일반 정서를 측정하므로, 이 문장은 배경 조건에 대한 판단이다.","Gallup measures general emotions, not emotional labour, so this is a judgement about background conditions.","Gallup измеряет общие эмоции, а не эмоциональный труд, поэтому это суждение о фоновых условиях.","盖洛普测量的是一般情绪而非情绪劳动，因此这是对背景条件的判断。","ギャラップは感情労働ではなく一般的な感情を測るため、これは背景条件についての判断である。"],"H"),
 s("D",[14,21,22,23,25],["그러나 감정노동의 핵심인 '고객·민원인·학부모의 화를 견디며 감정을 억제하는 일'로 좁히면 한국과 일본이 가장 무거운 축에 선다: 학부모 민원을 스트레스로 꼽은 교사는 OECD 평균 약 42%지만 한·일은 50%를 넘고, 두 나라는 고객 괴롭힘을 별도 법으로 다룰 만큼 문제가 커졌다.",
  "But narrowed to the core of emotional labour — enduring the anger of customers, the public and parents while suppressing one's own feelings — Korea and Japan carry the heaviest load: about 42% of teachers across the OECD cite parents' concerns as a stressor, but over 50% in Korea and Japan, and both countries now treat customer harassment in dedicated law.",
  "Но если сузить понятие до сути эмоционального труда — терпеть гнев клиентов, граждан и родителей, подавляя свои чувства, — тяжелее всего Корее и Японии: в среднем по ОЭСР около 42% учителей называют претензии родителей источником стресса, а в Корее и Японии — более 50%, и обе страны регулируют притеснения клиентов отдельными законами.",
  "但若聚焦情绪劳动的核心——在压抑自身情绪的同时承受顾客、民众和家长的怒气——韩国和日本负担最重：经合组织平均约42%的教师把家长诉求视为压力来源，韩日则超过50%，两国的问题已严重到用专门法律处理顾客骚扰。",
  "しかし感情労働の核心である「顧客・住民・保護者の怒りに耐えつつ自分の感情を抑える仕事」に絞ると、日本と韓国が最も重い側に立つ。保護者の懸念への対応をストレスに挙げる教員はOECD平均約42%だが日韓は50%を超え、両国は顧客によるハラスメントを専用の法で扱うほど問題が大きくなった。"],null,"M"),
 s("D",[16,15,3,17],["직군별로는 국가와 관계없이 같은 순서가 반복된다: 교정·경찰·긴급신고 접수, 채권 추심, 항공 객실승무, 응급·급성기 의료가 '화난 사람을 거의 매일 상대하는' 최상위이고, 콜센터 상담원·간호사·계산원·초등교사가 그 뒤를 잇는다.",
  "By occupation the same order recurs regardless of country: corrections, police and emergency call-taking, debt collection, cabin crew and emergency or acute medicine top the list of jobs that deal with angry people almost daily, followed by call-centre agents, nurses, cashiers and elementary teachers.",
  "По профессиям порядок повторяется независимо от страны: исправительные учреждения, полиция и приём экстренных вызовов, взыскание долгов, бортпроводники, неотложная медицина — наверху списка тех, кто почти ежедневно имеет дело с рассерженными людьми; за ними — операторы колл-центров, медсёстры, кассиры и учителя начальной школы.",
  "按职业看，无论哪个国家都重复同样的顺序：监狱与警察、紧急呼叫受理、债务催收、空乘、急诊与急症医疗位居“几乎每天面对愤怒之人”的最前列，其后是呼叫中心坐席、护士、收银员和小学教师。",
  "職種別では国にかかわらず同じ順序が繰り返される。矯正・警察・緊急通報受付、債権回収、客室乗務、救急・急性期医療が「ほぼ毎日怒った人に対応する」最上位で、コールセンター担当・看護師・レジ係・小学校教員が続く。"],null,"H"),
 s("D",[29,30,32,31],["AI는 감정노동을 덜 수도, 한곳에 몰아넣을 수도 있다: 상담 AI 보조는 고객 정서를 개선하고 이직을 줄였지만(A급 현장연구), 한국 콜센터 상담사의 61%는 AI 상담 도입 후 노동조건이 나빠졌다고 답했다 — 쉬운 문의는 AI가, 화난 고객은 사람이 맡는 '잔여 감정노동'의 집중이다.",
  "AI can lighten emotional labour or pile it into one place: AI assistance for agents improved customer sentiment and cut attrition (a grade-A field study), yet 61% of Korean call-centre agents said conditions worsened after AI contact centres arrived — easy queries go to AI, angry customers to people, concentrating the residual emotional labour.",
  "ИИ может облегчить эмоциональный труд или собрать его в одном месте: ИИ-помощник улучшил настроение клиентов и снизил текучесть (полевое исследование класса A), но 61% операторов корейских колл-центров сообщили об ухудшении условий после внедрения ИИ — простые запросы уходят ИИ, рассерженные клиенты людям, и остаточный эмоциональный труд концентрируется.",
  "AI既可能减轻情绪劳动，也可能把它集中到一处：坐席AI辅助改善了顾客情绪、降低了流失（A级现场研究），但韩国61%的呼叫中心坐席称引入AI客服后劳动条件恶化——简单咨询交给AI、愤怒顾客交给人，形成“残余情绪劳动”的集中。",
  "AIは感情労働を軽くもし、一か所に押し込めもする。応対AIの支援は顧客感情を改善し離職を減らした（A級の現場研究）が、韓国のコールセンター担当の61%はAI応対の導入後に労働条件が悪化したと答えた。簡単な問い合わせはAIが、怒った顧客は人が受け持つ「残余感情労働」の集中である。"],
  ["61%는 노동조합 연구원 조사(C)이므로 크기보다 방향을 나타낸다.","The 61% comes from a union research institute (C), so it indicates direction rather than size.","61% — данные исследовательского института профсоюза (C), они показывают направление, а не величину.","61%来自工会研究院的调查（C），表示方向而非大小。","61%は労組研究院の調査（C）であり、大きさより方向を示す。"],"M"),
 s("D",[34,36,39,40],["가장 큰 제도적 갈림길은 '감정 감시'다: EU는 직장에서 AI로 감정을 추론하는 것을 금지했지만, 미국 기업의 90%는 이미 노동자를 지시·감시·평가하는 알고리즘 도구를 쓰고 있고 미국인 70%는 표정 분석 감시에 반대한다.",
  "The biggest institutional fork is emotion surveillance: the EU has banned AI that infers emotions at work, while 90% of US firms already use algorithmic tools to instruct, monitor or evaluate workers and 70% of Americans oppose facial-expression monitoring.",
  "Главная институциональная развилка — слежка за эмоциями: ЕС запретил ИИ, распознающий эмоции на работе, тогда как 90% американских фирм уже используют алгоритмические инструменты указаний, мониторинга и оценки, а 70% американцев против анализа выражений лиц.",
  "最大的制度分岔是“情绪监控”：欧盟已禁止在工作场所用AI推断情绪，而美国90%的企业已在使用指令、监控、评估劳动者的算法工具，70%的美国人反对表情分析监控。",
  "最大の制度的分岐点は「感情監視」である。EUは職場でAIにより感情を推論することを禁止したが、米国企業の90%はすでに労働者への指示・監視・評価のアルゴリズムツールを使い、米国人の70%は表情分析による監視に反対している。"],null,"H"),
 s("D",[],["MCMC 시뮬레이션(글로벌 기준)에서 2035년 가장 가능성 높은 경로는 '불균등한 완화'({S2})이고, '잔여 감정노동의 집중'이 {S3}, '더딘 확산'이 {S4}, '보호된 증강'이 {S1}이다.",
  "In the MCMC simulation (global baseline) the most likely path to 2035 is uneven relief ({S2}), followed by concentrated residual emotional labour ({S3}), slow diffusion ({S4}) and protected augmentation ({S1}).",
  "В MCMC-симуляции (глобальный базовый вариант) наиболее вероятный путь к 2035 году — неравномерное облегчение ({S2}), затем концентрация остаточного эмоционального труда ({S3}), медленное распространение ({S4}) и защищённое усиление ({S1}).",
  "在MCMC模拟（全球基准）中，2035年最可能的路径是“不均衡的缓解”（{S2}），其次是“残余情绪劳动的集中”（{S3}）、“缓慢扩散”（{S4}）和“受保护的增强”（{S1}）。",
  "MCMCシミュレーション（グローバル基準）で2035年に最も可能性が高い経路は「不均等な緩和」（{S2}）で、「残余感情労働の集中」が{S3}、「緩やかな普及」が{S4}、「保護された増強」が{S1}である。"],
  ["확률은 판단에 의존하는 모형의 산출물이며 정밀한 예측이 아니다.","Probabilities are outputs of a judgement-dependent model, not precise forecasts.","Вероятности — результат модели, зависящей от суждений, а не точный прогноз.","概率是依赖判断的模型产出，并非精确预测。","確率は判断に依存するモデルの出力であり、精密な予測ではない。"],"L"),
 s("D",[23,25,28,32],["한국은 고객 폭언 보호를 2018년 산업안전보건법에 넣은 선발국이지만, ILO 폭력·괴롭힘 협약(C190)을 비준하지 않았고 AI 상담의 확산 속도가 빨라 '사람에게 남는 화'를 다루도록 보호 장치를 다시 설계해야 할 첫 번째 나라가 될 가능성이 크다.",
  "Korea moved early, writing protection from customer abuse into occupational safety law in 2018, but it has not ratified the ILO Violence and Harassment Convention (C190) and AI contact centres are spreading fast, so it is likely to be the first country that must redesign its safeguards around the anger left for humans.",
  "Корея одной из первых закрепила защиту от оскорблений клиентов в законе об охране труда (2018), но не ратифицировала Конвенцию МОТ C190, а ИИ-контакт-центры распространяются быстро, поэтому ей, вероятно, первой придётся перестроить защиту под «гнев, остающийся людям».",
  "韩国在2018年率先把免受顾客辱骂的保护写入职业安全卫生法，但尚未批准国际劳工组织《暴力和骚扰公约》（C190），且AI客服扩散迅速，很可能成为首个必须围绕“留给人的怒气”重新设计保护机制的国家。",
  "韓国は顧客の暴言からの保護を2018年に産業安全保健法へ盛り込んだ先行国だが、ILO暴力・ハラスメント条約（C190）を批准しておらず、AI応対の普及も速いため、「人に残る怒り」に対応できるよう保護の仕組みを設計し直す最初の国になる可能性が高い。"],null,"M")
)],
[KJ(
 s("D",[10,13,11,8,14],["일반 스트레스는 미국·중국·영국이 높지만, 고객·민원인·학부모의 화를 견디는 좁은 의미의 감정노동은 한국·일본이 가장 무겁다.","General stress is highest in the US, China and the UK, but emotional labour in the narrow sense — enduring the anger of customers, the public and parents — weighs most in Korea and Japan.","Общий стресс выше всего в США, Китае и Великобритании, но эмоциональный труд в узком смысле — терпеть гнев клиентов, граждан и родителей — тяжелее всего в Корее и Японии.","一般压力以美国、中国、英国最高，但狭义的情绪劳动——承受顾客、民众和家长的怒气——以韩国、日本最重。","一般的なストレスは米国・中国・英国が高いが、顧客・住民・保護者の怒りに耐える狭い意味の感情労働は日韓が最も重い。"]),
 s("D",[16,15],["직군별로는 교정·경찰·긴급신고·추심·객실승무·응급의료가 최상위이고, 콜센터·간호·계산·초등교사가 뒤를 잇는다.","By occupation, corrections, police, emergency call-taking, debt collection, cabin crew and emergency medicine rank highest, followed by call centres, nursing, cashiering and elementary teaching.","По профессиям лидируют исправительные учреждения, полиция, экстренные вызовы, взыскание долгов, бортпроводники и неотложная медицина, за ними — колл-центры, медсёстры, кассиры и учителя начальной школы.","按职业看，监狱、警察、紧急呼叫、催收、空乘、急诊医疗最高，其后是呼叫中心、护理、收银和小学教师。","職種別では矯正・警察・緊急通報・債権回収・客室乗務・救急医療が最上位で、コールセンター・看護・レジ・小学校教員が続く。"]),
 s("D",[29,32],["AI는 상담원의 부담을 덜 수도 있지만, 화난 고객만 사람에게 넘기는 '잔여 감정노동'을 집중시킬 수도 있다.","AI can lighten agents' load, but it can also concentrate residual emotional labour by passing only angry customers to humans.","ИИ может облегчить нагрузку операторов, но может и сконцентрировать остаточный эмоциональный труд, передавая людям только рассерженных клиентов.","AI可能减轻坐席负担，也可能只把愤怒的顾客转给人，从而集中“残余情绪劳动”。","AIはオペレーターの負担を軽くしうるが、怒った顧客だけを人に回して「残余感情労働」を集中させることもある。"]),
 s("D",[],["시뮬레이션상 2035년은 '불균등한 완화'({S2})가 가장 유력하고, '잔여 감정노동의 집중'은 {S3}이다.","In the simulation, uneven relief ({S2}) is the most likely outcome for 2035, with concentrated residual emotional labour at {S3}.","В симуляции наиболее вероятный исход к 2035 году — неравномерное облегчение ({S2}), концентрация остаточного эмоционального труда — {S3}.","模拟显示，2035年最可能的是“不均衡的缓解”（{S2}），“残余情绪劳动的集中”为{S3}。","シミュレーションでは2035年は「不均等な緩和」（{S2}）が最も有力で、「残余感情労働の集中」は{S3}である。"])
)]);

// ===== §1 Problem definition & framework =====
SEC("frame",["문제 정의와 분석 틀","Problem Definition and Analytical Framework","Постановка задачи и аналитическая рамка","问题界定与分析框架","問題の定義と分析枠組み"],
[P(
 s("B",[1],["감정노동은 사회학자 혹실드가 항공 승무원과 채권 추심원을 연구하며 정의한 개념으로, 임금을 받고 고객에게 보여줄 감정을 관리하는 노동을 뜻한다.",
  "Emotional labour is the concept sociologist Arlie Hochschild defined by studying flight attendants and bill collectors: work in which people manage, for a wage, the feelings they display to customers.",
  "Эмоциональный труд — понятие, которое социолог Арли Хокшилд ввела, изучая бортпроводников и коллекторов: работа, в которой за плату управляют чувствами, демонстрируемыми клиентам.",
  "情绪劳动是社会学家霍克希尔德在研究空乘与催收员时提出的概念，指为获取报酬而管理向顾客展示之情绪的劳动。",
  "感情労働は社会学者ホックシールドが客室乗務員と債権回収員を研究して定義した概念で、賃金を得て顧客に見せる感情を管理する労働を指す。"]),
 s("A",[2],["30년간 95개 연구를 종합한 메타분석에 따르면, 느끼지 않는 감정을 꾸며내는 '표면행위'는 건강 악화와 뚜렷하게 연관되지만(ρ .39~.48), 실제 감정을 바꾸려는 '심층행위'는 그 연관이 약하다.",
  "A meta-analysis of 95 studies over three decades finds that surface acting — faking emotions one does not feel — is clearly associated with impaired well-being (ρ .39–.48), whereas deep acting, trying to change one's actual feelings, is only weakly associated.",
  "Метаанализ 95 исследований за три десятилетия показал: поверхностная игра — изображение несуществующих чувств — явно связана с ухудшением благополучия (ρ 0,39–0,48), а глубокая игра, попытка изменить сами чувства, связана слабо.",
  "一项汇总30年间95项研究的元分析发现，伪装并未感受到的情绪的“表层扮演”与健康受损明显相关（ρ .39–.48），而试图改变真实感受的“深层扮演”相关性较弱。",
  "30年間の95研究を統合したメタ分析によれば、感じていない感情を装う「表層演技」は健康悪化と明確に関連する（ρ .39〜.48）が、実際の感情を変えようとする「深層演技」の関連は弱い。"]),
 s("D",[],["핵심 질문은 셋이다: ① 감정노동은 어느 나라·어느 직군에서 가장 무거운가, ② AI는 감정노동을 덜어주는가 아니면 사람에게 남는 화를 더 집중시키는가, ③ 2035년까지 어떤 제도와 설계가 그 차이를 만드는가.",
  "There are three core questions: (1) in which countries and occupations does emotional labour weigh most; (2) does AI lighten it or concentrate the anger left for humans; (3) which institutions and designs will make the difference by 2035?",
  "Три ключевых вопроса: (1) в каких странах и профессиях эмоциональный труд тяжелее всего; (2) облегчает ли его ИИ или концентрирует гнев, остающийся людям; (3) какие институты и решения определят разницу к 2035 году?",
  "核心问题有三：①情绪劳动在哪些国家、哪些职业最沉重；②AI是在减轻情绪劳动，还是让留给人的怒气更加集中；③到2035年，哪些制度与设计会造成差别。",
  "中心的な問いは三つである。①感情労働はどの国・どの職種で最も重いか、②AIは感情労働を軽くするのか、それとも人に残る怒りをさらに集中させるのか、③2035年までにどの制度と設計がその差を生むのか。"]),
 s("D",[6,8,16],["나라별 비교의 가장 큰 함정은 측정이다: 감정 요구(감정 숨기기), 고객 적대(폭언·괴롭힘 경험), 일반 정서(전날 스트레스·분노)는 서로 다른 지표이고, 나라마다 문항·표본·응답 문화가 달라 하나의 순위로 합칠 수 없다.",
  "The biggest trap in country comparison is measurement: emotional demands (hiding feelings), customer hostility (experience of abuse or harassment) and general emotions (stress or anger the previous day) are different indicators, and questions, samples and response cultures differ by country, so they cannot be merged into one ranking.",
  "Главная ловушка межстранового сравнения — измерение: эмоциональные требования (скрывать чувства), враждебность клиентов (опыт оскорблений и притеснений) и общие эмоции (стресс или гнев накануне) — разные показатели, а вопросы, выборки и культура ответов различаются, поэтому свести их в один рейтинг нельзя.",
  "国家比较最大的陷阱在于测量：情绪要求（隐藏情绪）、顾客敌意（辱骂与骚扰经历）和一般情绪（前一天的压力与愤怒）是不同的指标，各国问题、样本与回答文化不同，无法合并成一个排名。",
  "国別比較の最大の落とし穴は測定である。感情的要求（感情を隠す）、顧客の敵対（暴言・ハラスメントの経験）、一般的な感情（前日のストレス・怒り）は別々の指標であり、国ごとに設問・標本・回答文化が異なるため、一つの順位にまとめることはできない。"],null,"H"),
 s("D",[],["따라서 본 보고서는 ① 같은 조사 안의 국가 비교(갤럽·OECD 교원 조사·ILO 협약 비준)와 ② 나라별 조사의 '방향 일치' 여부를 나누어 보고, 직군 비교는 직업별 공식 데이터베이스(미국 O*NET, 한국 고용정보원)를 기준으로 삼는다.",
  "This report therefore separates (1) comparisons within a single survey (Gallup, the OECD teacher survey, ILO convention ratification) from (2) whether national surveys point the same way, and bases occupational comparison on official occupational databases (US O*NET, Korea Employment Information Service).",
  "Поэтому доклад разделяет (1) сравнения в рамках одного опроса (Gallup, опрос учителей ОЭСР, ратификация конвенции МОТ) и (2) совпадение направления национальных опросов, а сравнение профессий строит на официальных базах данных (O*NET США, Корейская служба информации о занятости).",
  "因此，本报告区分①同一调查内的国家比较（盖洛普、经合组织教师调查、国际劳工组织公约批准）与②各国调查是否“方向一致”，职业比较则以官方职业数据库（美国O*NET、韩国雇佣信息院）为基准。",
  "そこで本報告は、①同じ調査の中での国別比較（ギャラップ・OECD教員調査・ILO条約批准）と、②各国の調査が「同じ方向を示すか」を分けて見て、職種比較は職業別の公式データベース（米国O*NET、韓国雇用情報院）を基準とする。"]),
 s("D",[],["분석은 세 개의 잠재 축으로 구성한다: A(고객 응대 AI·알고리즘 관리의 확산), I(고객 괴롭힘·감정 감시를 다루는 보호 제도), L(현장의 완충력 — 인력·재량·응대 중단권·사람 연결), 그리고 비용 절감 압력 D가 보호 제도의 성장을 깎는다.",
  "The analysis rests on three latent axes: A (diffusion of customer-facing AI and algorithmic management), I (protective institutions covering customer harassment and emotion surveillance) and L (the frontline buffer — staffing, discretion, the right to stop an abusive contact, access to a human), with cost-cutting pressure D eroding the growth of protective institutions.",
  "Анализ строится на трёх латентных осях: A (распространение ИИ в обслуживании клиентов и алгоритмического управления), I (защитные институты против притеснений клиентов и слежки за эмоциями) и L (буфер на местах — штат, свобода действий, право прервать оскорбительный контакт, доступ к человеку); давление на издержки D тормозит рост защитных институтов.",
  "分析由三个潜在轴构成：A（面向顾客的AI与算法管理的扩散）、I（应对顾客骚扰与情绪监控的保护制度）、L（现场缓冲力——人手、自主权、中止接待权、转接人工），成本削减压力D则会削弱保护制度的增长。",
  "分析は三つの潜在軸で構成する。A（顧客応対AI・アルゴリズム管理の普及）、I（カスハラ・感情監視を扱う保護制度）、L（現場の緩衝力――人員・裁量・応対中断権・人への接続）であり、コスト削減圧力Dが保護制度の伸びを削る。"]),
 s("D",[],["모든 문장에는 근거 등급(A~D)과 참조 근거 번호가 붙어 있으며, 업계·노동단체·기업 발표(C)는 방향을 확인하는 데만 쓰고 크기 판단에는 쓰지 않는다.",
  "Every sentence carries an evidence grade (A–D) and reference numbers; industry, union and company material (C) is used only to confirm direction, never to judge magnitude.",
  "Каждое предложение имеет класс доказательности (A–D) и номера источников; материалы отраслевых организаций, профсоюзов и компаний (C) используются лишь для подтверждения направления, но не величины.",
  "每句话都附有依据等级（A–D）和参考依据编号；行业、工会与企业材料（C）仅用于确认方向，不用于判断大小。",
  "すべての文に根拠等級（A〜D）と参照根拠番号を付け、業界・労働団体・企業の資料（C）は方向の確認にのみ使い、大きさの判断には使わない。"])
),CH("grades")],
[P(
 s("D",[1,2],["감정노동은 고객에게 보일 감정을 관리하는 노동이며, 감정을 꾸며내는 '표면행위'가 건강을 가장 크게 해친다.","Emotional labour is work managing the feelings shown to customers, and surface acting — faking emotion — does the most harm to health.","Эмоциональный труд — это управление чувствами, демонстрируемыми клиентам, и больше всего здоровью вредит поверхностная игра — изображение эмоций.","情绪劳动是管理向顾客展示之情绪的劳动，伪装情绪的“表层扮演”对健康伤害最大。","感情労働は顧客に見せる感情を管理する労働であり、感情を装う「表層演技」が最も健康を損なう。"]),
 s("D",[6,8],["나라별 비교는 측정 방식이 달라 하나의 순위로 합칠 수 없으므로, 같은 조사 안의 비교와 방향 일치 여부를 나눠 본다.","Because measurement differs by country, comparisons cannot be merged into one ranking, so within-survey comparisons are separated from checks on whether national surveys agree in direction.","Поскольку измерения в странах различаются, свести их в один рейтинг нельзя, поэтому сравнения внутри одного опроса отделены от проверки совпадения направлений.","由于各国测量方式不同，无法合并为一个排名，因此把同一调查内的比较与方向是否一致分开来看。","国ごとに測定方法が異なり一つの順位にまとめられないため、同じ調査内の比較と方向の一致を分けて見る。"])
),CH("grades")]);

// ===== §2 Current ①: the cost of emotional labour =====
SEC("cost",["현재 ①: 감정노동의 비용 — 소진·폭력·이직","Current ①: The Cost of Emotional Labour — Burnout, Violence, Exit","Сейчас ①: цена эмоционального труда — выгорание, насилие, уход","现状①：情绪劳动的代价——耗竭、暴力、离职","現在①：感情労働のコスト――消耗・暴力・離職"],
[P(
 s("A",[2],["같은 메타분석에서 표면행위와 '감정 규칙과 실제 감정의 불일치'는 직무 태도와도 음(-)의 관계(ρ −.24~−.40)를 보였고 성과와는 약한 음의 관계를 보여, 감정노동은 노동자와 조직 모두의 비용이다.",
  "In the same meta-analysis, surface acting and dissonance between feeling rules and actual feelings were negatively related to job attitudes (ρ −.24 to −.40) and weakly negatively to performance, so emotional labour is a cost to both workers and organisations.",
  "В том же метаанализе поверхностная игра и рассогласование правил чувств с реальными чувствами отрицательно связаны с отношением к работе (ρ от −0,24 до −0,40) и слабо отрицательно — с результативностью: эмоциональный труд — издержка и для работников, и для организаций.",
  "同一元分析中，表层扮演以及“情感规则与真实感受的失调”与工作态度呈负相关（ρ −.24至−.40），与绩效呈弱负相关，因此情绪劳动对劳动者和组织都是代价。",
  "同じメタ分析で、表層演技と「感情規則と実際の感情の不一致」は職務態度とも負の関係（ρ −.24〜−.40）を示し、成果とも弱い負の関係を示しており、感情労働は労働者と組織の双方にとってのコストである。"]),
 s("B",[5],["ILO·갤럽의 첫 세계 조사(121개국 약 7만 5천 명)에서 취업자의 약 23%가 일터에서 폭력·괴롭힘을 겪었고, 가장 흔한 형태는 심리적 폭력·괴롭힘(17.9%)이었다.",
  "In the first global ILO–Gallup survey (about 75,000 people in 121 countries), roughly 23% of the employed had experienced violence or harassment at work, the most common form being psychological (17.9%).",
  "В первом глобальном опросе МОТ и Gallup (около 75 000 человек в 121 стране) примерно 23% занятых сталкивались с насилием или домогательствами на работе; самая частая форма — психологическая (17,9%).",
  "在国际劳工组织与盖洛普的首次全球调查（121个国家约7.5万人）中，约23%的就业者在工作中遭受过暴力或骚扰，最常见的是心理暴力与骚扰（17.9%）。",
  "ILOとギャラップによる初の世界調査（121か国・約7万5千人）で、就業者の約23%が職場で暴力・ハラスメントを経験し、最も多い形態は心理的暴力・ハラスメント（17.9%）だった。"]),
 s("B",[5],["피해자의 절반 정도만 경험을 누군가에게 털어놓았고, 말하지 않은 이유로는 '시간 낭비'와 '평판에 대한 두려움'이 가장 많아 실제 규모는 더 클 수 있다.",
  "Only about half of victims had told anyone, the most common reasons for silence being that it was a waste of time and fear for their reputation, so the true scale may be larger.",
  "Лишь около половины пострадавших кому-то рассказали; чаще всего молчат, считая это пустой тратой времени и опасаясь за репутацию, — реальный масштаб может быть больше.",
  "只有约一半的受害者向他人倾诉过，不说的主要理由是“浪费时间”和“担心名声”，实际规模可能更大。",
  "被害者の半数ほどしか経験を誰かに打ち明けておらず、話さなかった理由は「時間の無駄」と「評判への不安」が最も多いため、実際の規模はさらに大きい可能性がある。"]),
 s("A",[3],["보건의료 종사자 33만여 명을 다룬 메타분석에서는 61.9%가 지난 1년간 어떤 형태든 직장 폭력을 경험했고, 가장 흔한 것은 폭언(57.6%)이었다.",
  "A meta-analysis covering more than 330,000 healthcare workers found that 61.9% had experienced some form of workplace violence in the past year, verbal abuse being the most common (57.6%).",
  "Метаанализ, охвативший более 330 000 медицинских работников, показал: 61,9% за последний год сталкивались с той или иной формой насилия на работе, чаще всего — с вербальной агрессией (57,6%).",
  "一项涵盖33万余名医疗卫生从业者的元分析显示，61.9%在过去一年经历过某种形式的工作场所暴力，最常见的是言语辱骂（57.6%）。",
  "医療従事者33万人余りを扱ったメタ分析では、61.9%が過去1年間に何らかの職場暴力を経験し、最も多いのは暴言（57.6%）だった。"]),
 s("A",[17],["미국에서는 폭력으로 인한 비치명적 산업재해의 73%가 보건의료 종사자에게 발생해(2018년), 감정노동이 신체 위험으로 넘어가는 지점이 의료 현장임을 보여준다.",
  "In the US, 73% of nonfatal occupational injuries due to violence occurred among healthcare workers (2018), showing that the point where emotional labour turns into physical danger is healthcare.",
  "В США 73% нефатальных производственных травм от насилия пришлись на медиков (2018), что показывает: эмоциональный труд переходит в физическую опасность прежде всего в здравоохранении.",
  "在美国，因暴力导致的非致命职业伤害中73%发生在医疗卫生从业者身上（2018年），表明情绪劳动演变为身体危险的场所是医疗现场。",
  "米国では暴力による非致死的労働災害の73%が医療従事者に発生しており（2018年）、感情労働が身体的危険へと移る地点が医療現場であることを示す。"]),
 s("C",[20],["영국에서는 고객 적대를 겪은 서비스 노동자의 20%가 그 때문에 최근 6개월 안에 병가를 냈고(평균 9일), 31%는 일을 그만두는 것을 고려했다.",
  "In the UK, 20% of service workers who faced customer hostility took sick leave because of it in the past six months (nine days on average), and 31% considered leaving their job.",
  "В Великобритании 20% работников сферы услуг, столкнувшихся с враждебностью клиентов, за полгода брали из-за этого больничный (в среднем 9 дней), а 31% думали об уходе.",
  "在英国，遭遇顾客敌意的服务人员中有20%在最近6个月因此请了病假（平均9天），31%考虑过辞职。",
  "英国では顧客の敵対を経験したサービス労働者の20%がそのために直近6か月で病欠し（平均9日）、31%が仕事を辞めることを考えた。"]),
 s("B",[4],["세계적으로 우울·불안으로 매년 약 120억 근로일이 손실되는 것으로 추정되며, WHO·ILO는 심리사회적 위험의 관리를 사업주의 과제로 제시했다.",
  "Globally an estimated 12 billion workdays are lost each year to depression and anxiety, and the WHO and ILO frame the management of psychosocial risks as a task for employers.",
  "По оценкам, в мире ежегодно теряется около 12 млрд рабочих дней из-за депрессии и тревожности, а ВОЗ и МОТ считают управление психосоциальными рисками задачей работодателя.",
  "据估计，全球每年因抑郁与焦虑损失约120亿个工作日，世卫组织与国际劳工组织把管理心理社会风险定为雇主的责任。",
  "世界でうつ・不安により毎年約120億労働日が失われると推計され、WHOとILOは心理社会的リスクの管理を事業主の課題として示した。"]),
 s("D",[2,3,5,20],["종합하면 감정노동의 비용은 '참는 감정'(표면행위의 소진) → '받는 공격'(폭언·괴롭힘) → '떠나는 사람'(병가·이직)의 세 단계로 이어지며, 뒤로 갈수록 측정은 쉬워지지만 이미 피해가 커진 뒤다.",
  "Taken together, the cost of emotional labour runs in three stages — suppressed feeling (burnout from surface acting), received aggression (abuse and harassment) and people leaving (sick leave and quits); the later the stage, the easier it is to measure, but by then the damage is done.",
  "В целом цена эмоционального труда проходит три стадии: подавленные чувства (выгорание от поверхностной игры) → полученная агрессия (оскорбления и притеснения) → уход людей (больничные и увольнения); чем дальше, тем легче измерить, но вред уже нанесён.",
  "综合来看，情绪劳动的代价沿着三个阶段发展：“忍住的情绪”（表层扮演导致的耗竭）→“承受的攻击”（辱骂与骚扰）→“离开的人”（病假与离职）；越往后越容易测量，但伤害已经扩大。",
  "総合すると、感情労働のコストは「こらえる感情」（表層演技による消耗）→「受ける攻撃」（暴言・ハラスメント）→「去る人」（病欠・離職）の三段階で続き、後になるほど測定は容易になるが、すでに被害が大きくなった後である。"],null,"M"),
 s("D",[5,20],["신고율이 낮다는 점(영국 44%, 전 세계 피해자의 절반)은 나라 간 피해율의 차이가 실제 차이보다 '말할 수 있는 문화'의 차이를 반영할 수 있음을 뜻한다.",
  "Low reporting (44% in the UK, half of victims worldwide) means that differences in victimisation rates between countries may reflect differences in a culture of speaking up more than real differences.",
  "Низкая доля сообщений (44% в Великобритании, половина пострадавших в мире) означает, что различия в уровне притеснений между странами могут отражать скорее культуру «можно ли говорить», чем реальную разницу.",
  "报告率低（英国44%，全球受害者的一半）意味着国家间受害率的差异可能更多反映“能否说出口”的文化差异，而不是真实差异。",
  "報告率が低いこと（英国44%、世界の被害者の半数）は、国による被害率の差が実際の差よりも「声を上げられる文化」の差を反映しうることを意味する。"],null,"M")
)],
[P(
 s("A",[2,3],["표면행위는 소진과 뚜렷이 연관되고, 보건의료 종사자의 61.9%가 지난 1년간 직장 폭력을 경험했다.","Surface acting is clearly linked to burnout, and 61.9% of healthcare workers experienced workplace violence in the past year.","Поверхностная игра явно связана с выгоранием, а 61,9% медиков за последний год сталкивались с насилием на работе.","表层扮演与耗竭明显相关，61.9%的医疗卫生从业者在过去一年经历过工作场所暴力。","表層演技は消耗と明確に関連し、医療従事者の61.9%が過去1年間に職場暴力を経験した。"]),
 s("D",[5,20],["감정노동의 비용은 소진→폭언·괴롭힘→병가·이직으로 이어지지만, 낮은 신고율 때문에 실제 규모는 과소 측정된다.","The cost of emotional labour runs from burnout to abuse and harassment to sick leave and quitting, but low reporting means its true size is undercounted.","Цена эмоционального труда идёт от выгорания к оскорблениям и притеснениям и далее к больничным и уходам, но из-за низкой доли сообщений реальный масштаб недооценивается.","情绪劳动的代价从耗竭延伸到辱骂与骚扰，再到病假与离职，但因报告率低，实际规模被低估。","感情労働のコストは消耗→暴言・ハラスメント→病欠・離職へと続くが、報告率の低さから実際の規模は過小に測られる。"])
)]);

SEC("countries",["현재 ②: 나라별 비교 — 감정노동은 어디가 가장 무거운가","Current ②: Country Comparison — Where Does Emotional Labour Weigh Most?","Сейчас ②: сравнение стран — где эмоциональный труд тяжелее всего?","现状②：国家比较——情绪劳动在哪里最沉重？","現在②：国別比較――感情労働はどこが最も重いか"],
[P(
 s("B",[10,13,11],["같은 문항을 쓰는 갤럽의 2025년 자료에서 전날 스트레스를 많이 느낀 직장인은 미국 50%, 중국 48%, 영국 46%로 비교국 가운데 가장 높았다.",
  "In Gallup's 2025 data, which use the same question in every country, the share of employees who felt a lot of stress the previous day was highest among the comparison countries in the US (50%), China (48%) and the UK (46%).",
  "По данным Gallup за 2025 год (одинаковый вопрос во всех странах), доля работников, испытавших сильный стресс накануне, среди сравниваемых стран выше всего в США (50%), Китае (48%) и Великобритании (46%).",
  "在各国使用相同问题的盖洛普2025年数据中，前一天感到很大压力的员工比例在比较国中以美国（50%）、中国（48%）、英国（46%）最高。",
  "同じ設問を使うギャラップの2025年データで、前日に強いストレスを感じた従業員は米国50%、中国48%、英国46%と比較国の中で最も高かった。"]),
 s("B",[8,9,12,13,10,11],["한국과 일본은 각각 39%, 독일은 38%로 세계 평균(40%)과 비슷하거나 낮았고, 전날 분노는 중국 21%, 한국 19%, 미국 18%, 영국 15%, 일본·독일 13% 순이었다.",
  "Korea and Japan were at 39% and Germany at 38%, close to or below the global average (40%); anger the previous day ran China 21%, Korea 19%, US 18%, UK 15%, Japan and Germany 13%.",
  "Корея и Япония — по 39%, Германия — 38%, около мирового среднего (40%) или ниже; гнев накануне: Китай 21%, Корея 19%, США 18%, Великобритания 15%, Япония и Германия по 13%.",
  "韩国和日本各为39%，德国为38%，与全球平均（40%）相近或更低；前一天的愤怒依次为中国21%、韩国19%、美国18%、英国15%、日本与德国13%。",
  "日本と韓国はそれぞれ39%、ドイツは38%で世界平均（40%）と同程度かそれ以下で、前日の怒りは中国21%、韓国19%、米国18%、英国15%、日本・ドイツ13%の順だった。"]),
 s("B",[9,8],["일본은 직무 몰입도가 8%로 비교국 중 가장 낮고 한국도 13%에 그쳤으며, 한국은 '지금 사는 곳에서 좋은 일자리를 구하기 쉽다'는 응답이 27%로 동아시아 평균(58%)의 절반에도 못 미쳤다.",
  "Japan had the lowest engagement among the comparison countries at 8%, and Korea only 13%; in Korea just 27% said it was a good time to find a job where they live, under half the East Asian average (58%).",
  "В Японии самая низкая среди сравниваемых стран вовлечённость — 8%, в Корее — лишь 13%; в Корее только 27% считают, что сейчас легко найти хорошую работу там, где они живут, — меньше половины среднего по Восточной Азии (58%).",
  "日本的敬业度为8%，是比较国中最低的，韩国也仅13%；在韩国，认为“现在在居住地容易找到好工作”的仅27%，不到东亚平均（58%）的一半。",
  "日本はエンゲージメントが8%と比較国中で最も低く、韓国も13%にとどまり、韓国では「今住む地域で良い仕事を見つけやすい」が27%と東アジア平均（58%）の半分にも満たなかった。"])
),CH("countries"),P(
 s("B",[14],["같은 조사로 비교한 교사의 경우, 학부모·보호자 민원 대응을 스트레스 원인으로 꼽은 비율은 OECD 평균 약 42%였지만 일본·한국은 50%를 넘어 최상위권이었다.",
  "For teachers compared in the same survey, the share citing parents' or guardians' concerns as a source of stress averaged about 42% across the OECD, but exceeded 50% in Japan and Korea, among the highest.",
  "Среди учителей в том же опросе доля называющих претензии родителей источником стресса в среднем по ОЭСР около 42%, а в Японии и Корее — более 50%, среди самых высоких.",
  "在同一调查比较的教师中，把应对家长或监护人诉求视为压力来源的比例经合组织平均约42%，日本和韩国则超过50%，位居前列。",
  "同じ調査で比べた教員では、保護者の懸念への対応をストレス要因に挙げた割合はOECD平均約42%だったが、日本・韓国は50%を超え最上位圏だった。"]),
 s("B",[7],["유럽 30개국 사업장 4만 1천여 곳 가운데 56%가 '까다로운 고객·환자·학생 응대'를 위험 요인으로 꼽아, 이 항목은 유럽에서 가장 흔한 심리사회적 위험이다.",
  "Of over 41,000 workplaces in 30 European countries, 56% identified dealing with difficult customers, patients or pupils as a risk factor — the most common psychosocial risk in Europe.",
  "Из более чем 41 000 рабочих мест в 30 европейских странах 56% назвали работу с трудными клиентами, пациентами или учениками фактором риска — это самый частый психосоциальный риск в Европе.",
  "在欧洲30国4.1万余个工作场所中，56%把“应对难缠的顾客、患者或学生”列为风险因素，这是欧洲最常见的心理社会风险。",
  "欧州30か国の4万1千余りの事業所のうち56%が「難しい顧客・患者・生徒への対応」をリスク要因に挙げ、これは欧州で最も多い心理社会的リスクである。"]),
 s("B",[6],["유럽 대면 서비스 노동자의 22%, 보건 최전선 노동자의 32%는 감정을 숨겨야 하는 등 높은 감정 요구에 놓여 있어 전체 피고용자(14%)보다 높다.",
  "In Europe, 22% of interactive service workers and 32% of frontline health workers face high emotional demands such as having to hide their feelings, against 14% of all employees.",
  "В Европе высокие эмоциональные требования — например, необходимость скрывать чувства — у 22% работников интерактивного обслуживания и 32% медиков «первой линии» против 14% всех занятых.",
  "在欧洲，22%的面对面服务劳动者和32%的一线医疗人员面临需要隐藏情绪等高情绪要求，高于全体雇员的14%。",
  "欧州の対面サービス労働者の22%、医療最前線の労働者の32%は感情を隠さなければならないなど高い感情的要求にさらされており、全被雇用者（14%）より高い。"]),
 s("B",[18],["일본 노동자 8,000명 조사에서 최근 3년간 고객의 현저한 괴롭힘을 겪은 비율은 10.8%였지만, 관련 상담을 받은 기업은 27.9%로 3년 전보다 8.4%p 늘었다.",
  "In a survey of 8,000 Japanese workers, 10.8% had experienced serious harassment by customers in the past three years, while firms receiving related consultations rose to 27.9%, up 8.4 points in three years.",
  "В опросе 8000 японских работников 10,8% за три года сталкивались с серьёзными притеснениями со стороны клиентов, а доля компаний, получавших такие обращения, выросла до 27,9% — на 8,4 п.п. за три года.",
  "在对8000名日本劳动者的调查中，近三年遭受顾客严重骚扰的比例为10.8%，而收到相关咨询的企业升至27.9%，三年间增加8.4个百分点。",
  "日本の労働者8,000人の調査で、直近3年間に顧客からの著しい迷惑行為を受けた割合は10.8%だったが、関連の相談があった企業は27.9%で3年前より8.4ポイント増えた。"]),
 s("C",[19,20],["현장 노조·업계 조사는 더 높은 피해율을 보인다: 일본 유통·서비스 노조원의 46.8%가 최근 2년 안에 고객 괴롭힘을 겪었고, 영국 고객 응대 노동자의 36%가 최근 6개월 안에 적대를 경험했다.",
  "Union and industry surveys on the front line show higher rates: 46.8% of Japanese retail and service union members experienced customer harassment in the past two years, and 36% of UK customer-facing workers faced hostility in the past six months.",
  "Профсоюзные и отраслевые опросы на местах показывают более высокие цифры: 46,8% членов японского профсоюза торговли и услуг сталкивались с притеснениями клиентов за два года, а 36% британских работников, обслуживающих клиентов, — с враждебностью за полгода.",
  "现场工会与行业调查显示更高的受害率：日本零售与服务业工会会员中46.8%在近两年遭受顾客骚扰，英国顾客接待劳动者中36%在近6个月遭遇敌意。",
  "現場の労組・業界の調査はより高い被害率を示す。日本の流通・サービス労組員の46.8%が直近2年以内にカスハラを受け、英国の顧客応対労働者の36%が直近6か月以内に敵対を経験した。"]),
 s("D",[8,9,10,11,13,14,18],["종합 판단: 일반 스트레스로는 미국·중국·영국이 가장 무겁고, '고객·학부모의 화를 견디며 감정을 억제하는' 좁은 의미의 감정노동은 한국·일본이 가장 무거운 축에 속한다 — 두 나라는 낮은 몰입, 학부모 민원 스트레스 50% 이상, 이직의 어려움(한국)이 겹친다.",
  "Overall judgement: on general stress the US, China and the UK weigh most, while on emotional labour in the narrow sense — enduring customers' and parents' anger while suppressing one's own — Korea and Japan are the heaviest; both combine low engagement, over 50% of teachers stressed by parents and, in Korea, difficulty changing jobs.",
  "Общий вывод: по общему стрессу тяжелее всего США, Китаю и Великобритании, а по эмоциональному труду в узком смысле — терпеть гнев клиентов и родителей, подавляя свои чувства, — Корее и Японии: в обеих сочетаются низкая вовлечённость, более 50% учителей в стрессе из-за родителей и (в Корее) трудность смены работы.",
  "综合判断：就一般压力而言，美国、中国、英国最重；就“在压抑自身情绪的同时承受顾客与家长怒气”的狭义情绪劳动而言，韩国与日本最重——两国都叠加了低敬业度、超过50%的教师因家长而感到压力，以及（韩国的）换工作困难。",
  "総合判断：一般的なストレスでは米国・中国・英国が最も重く、「顧客・保護者の怒りに耐えて感情を抑える」狭い意味の感情労働では日本・韓国が最も重い側に属する。両国では低いエンゲージメント、保護者対応ストレス50%超、転職の難しさ（韓国）が重なる。"],
  ["국가 순위가 아니라 '어떤 의미의 감정노동에서 무거운가'에 대한 판단이다.","This is a judgement about which kind of emotional labour weighs most where, not a national ranking.","Это суждение о том, какой вид эмоционального труда где тяжелее, а не рейтинг стран.","这是关于“哪种意义的情绪劳动在哪里更重”的判断，而非国家排名。","国別順位ではなく「どの意味の感情労働で重いか」についての判断である。"],"M"),
 s("D",[7,6,12],["유럽은 고객 응대 위험을 사업장 차원에서 가장 널리 인식하는 지역이고, 독일은 비교국 중 스트레스·분노가 가장 낮아 노동시장 여건과 제도가 완충 역할을 할 가능성이 있다.",
  "Europe is the region where risks from dealing with customers are most widely recognised at workplace level, and Germany has the lowest stress and anger among the comparison countries, suggesting labour-market conditions and institutions may act as a buffer.",
  "Европа — регион, где риски работы с клиентами шире всего признаются на уровне предприятий, а в Германии самые низкие среди сравниваемых стран стресс и гнев; возможно, буфером служат рынок труда и институты.",
  "欧洲是在工作场所层面最广泛认识到顾客接待风险的地区，德国在比较国中压力与愤怒最低，劳动力市场条件与制度可能起到缓冲作用。",
  "欧州は顧客対応のリスクを事業所レベルで最も広く認識している地域で、ドイツは比較国中でストレス・怒りが最も低く、労働市場の状況と制度が緩衝の役割を果たしている可能性がある。"],null,"L"),
 s("D",[5,9],["다만 일본의 낮은 분노·슬픔 응답(13%·9%)은 감정이 적어서라기보다 감정 표현을 억제하는 응답 문화일 수 있어, 낮은 수치를 '가벼운 감정노동'으로 읽으면 안 된다.",
  "Japan's low reported anger and sadness (13% and 9%), however, may reflect a response culture that suppresses emotional expression rather than less emotion, so the low figures should not be read as light emotional labour.",
  "Однако низкие показатели гнева и грусти в Японии (13% и 9%) могут отражать культуру ответов, подавляющую выражение эмоций, а не меньшее их количество, поэтому их нельзя читать как «лёгкий» эмоциональный труд.",
  "不过，日本较低的愤怒与悲伤回答（13%、9%）可能反映的是抑制情绪表达的回答文化，而不是情绪更少，因此不应把低数字解读为“情绪劳动较轻”。",
  "ただし日本の怒り・悲しみの回答の低さ（13%・9%）は感情が少ないからというより感情表出を抑える回答文化でありうるため、低い数値を「軽い感情労働」と読んではならない。"],null,"L")
)],
[P(
 s("B",[10,13,11,8,9,12],["갤럽 2025년 전날 스트레스는 미국 50%·중국 48%·영국 46%가 높았고, 한국·일본 39%·독일 38%는 세계 평균 수준이었다.","In Gallup's 2025 data, stress the previous day was highest in the US (50%), China (48%) and the UK (46%), while Korea and Japan (39%) and Germany (38%) were near the global average.","По данным Gallup за 2025 год, стресс накануне выше всего в США (50%), Китае (48%) и Великобритании (46%), а Корея и Япония (39%) и Германия (38%) — около мирового среднего.","盖洛普2025年数据中，前一天压力以美国50%、中国48%、英国46%最高，韩国与日本39%、德国38%接近全球平均。","ギャラップ2025年の前日のストレスは米国50%・中国48%・英国46%が高く、日韓39%・ドイツ38%は世界平均並みだった。"])
),CH("countries"),P(
 s("B",[14],["교사의 학부모 민원 스트레스는 OECD 평균 약 42%지만 일본·한국은 50%를 넘었다.","About 42% of teachers across the OECD are stressed by parents' concerns, but over 50% in Japan and Korea.","В среднем по ОЭСР около 42% учителей испытывают стресс из-за претензий родителей, а в Японии и Корее — более 50%.","经合组织平均约42%的教师因家长诉求感到压力，日本与韩国超过50%。","保護者対応で教員がストレスを感じる割合はOECD平均約42%だが、日韓は50%を超えた。"]),
 s("D",[8,9,14,18],["일반 스트레스는 미국·중국·영국이, 고객·학부모의 화를 견디는 좁은 의미의 감정노동은 한국·일본이 가장 무거운 축이다.","The US, China and the UK carry the most general stress; Korea and Japan carry the most emotional labour in the narrow sense of enduring customers' and parents' anger.","Больше всего общего стресса — в США, Китае и Великобритании, а эмоционального труда в узком смысле (терпеть гнев клиентов и родителей) — в Корее и Японии.","一般压力以美中英最重，承受顾客与家长怒气的狭义情绪劳动以韩日最重。","一般的ストレスは米中英が、顧客・保護者の怒りに耐える狭い意味の感情労働は日韓が最も重い。"])
)]);

SEC("jobs",["현재 ③: 직군별 비교 — 누가 가장 자주 화난 사람을 상대하나","Current ③: Occupational Comparison — Who Deals With Angry People Most Often?","Сейчас ③: сравнение профессий — кто чаще всего имеет дело с рассерженными людьми?","现状③：职业比较——谁最常面对愤怒之人？","現在③：職種別比較――誰が最も頻繁に怒った人に対応するか"],
[P(
 s("A",[16],["미국 노동부 O*NET의 911개 직업 가운데 '불쾌하거나 화난 사람을 상대하는 빈도'(0~100, 100=매일)가 가장 높은 직업은 교정직 공무원·응급의학 의사(94), 긴급신고 접수원(93), 채권 추심원(91), 항공기 객실승무원(90)이었다.",
  "Among the 911 occupations in the US Department of Labor's O*NET, those dealing most often with unpleasant or angry people (0–100, 100 = every day) were correctional officers and emergency medicine physicians (94), public-safety telecommunicators (93), bill and account collectors (91) and flight attendants (90).",
  "Из 911 профессий в базе O*NET Минтруда США чаще всего имеют дело с неприятными или рассерженными людьми (0–100, 100 = каждый день) сотрудники исправительных учреждений и врачи неотложной помощи (94), операторы экстренных служб (93), коллекторы (91) и бортпроводники (90).",
  "在美国劳工部O*NET的911种职业中，“应对令人不快或愤怒之人的频率”（0–100，100=每天）最高的是狱警与急诊医生（94）、紧急呼叫接线员（93）、债务催收员（91）和空乘（90）。",
  "米国労働省O*NETの911職業のうち「不快な人や怒った人に対応する頻度」（0〜100、100＝毎日）が最も高い職業は、矯正職員・救急医（94）、緊急通報受付員（93）、債権回収員（91）、客室乗務員（90）だった。"]),
 s("A",[16],["고객상담원(80), 간호사(79), 텔레마케터(79), 계산원(78), 초등교사(76), 소매 판매원(72)이 그 뒤를 이었고, 회계사(35)와 소프트웨어 개발자(12)는 크게 낮았다.",

  "Далее идут операторы клиентской службы (80), медсёстры (79), телемаркетологи (79), кассиры (78), учителя начальной школы (76) и продавцы (72), а бухгалтеры (35) и разработчики ПО (12) — намного ниже.",

  "顧客サービス担当（80）、看護師（79）、テレマーケター（79）、レジ係（78）、小学校教員（76）、小売販売員（72）が続き、会計士（35）とソフトウェア開発者（12）は大きく低かった。"])

 s("B",[15],["한국고용정보원이 730개 직업을 분석한 결과 감정노동 강도가 가장 센 직업은 텔레마케터였고 호텔관리자·네일아티스트·중독치료사가 뒤를 이었으며, 화난 고객을 대하는 빈도는 텔레마케터·경찰관·보건위생 및 환경검사원·항공기 객실승무원 순으로 높았다.",
  "In the Korea Employment Information Service's analysis of 730 occupations, telemarketers had the most intense emotional labour, followed by hotel managers, nail artists and addiction counsellors; for frequency of angry customers the order was telemarketers, police officers, health and environmental inspectors and flight attendants.",
  "По анализу 730 профессий Корейской службы информации о занятости, самый интенсивный эмоциональный труд — у телемаркетологов, затем управляющих отелей, мастеров маникюра и консультантов по зависимостям; по частоте рассерженных клиентов — телемаркетологи, полицейские, санитарные инспекторы и бортпроводники.",
  "韩国雇佣信息院对730种职业的分析显示，情绪劳动强度最高的是电话营销员，其后是酒店管理者、美甲师、成瘾治疗师；应对愤怒顾客的频率依次为电话营销员、警察、卫生与环境检查员、空乘。",
  "韓国雇用情報院が730職業を分析した結果、感情労働の強度が最も高い職業はテレマーケターで、ホテル管理者・ネイリスト・依存症治療士が続き、怒った顧客に対応する頻度はテレマーケター・警察官・保健衛生及び環境検査員・客室乗務員の順に高かった。"]),
 s("D",[1,15,16],["혹실드가 40여 년 전 연구한 두 직업(객실승무원·채권 추심원)이 오늘날 미국 공식 데이터에서도 상위 5위 안에 있고 한국에서도 텔레마케터·객실승무원이 상위권이어서, 직군 순위는 국가를 넘어 매우 안정적이다.",
  "The two occupations Hochschild studied over 40 years ago — flight attendants and bill collectors — are still in the top five of official US data today, and telemarketers and flight attendants rank high in Korea too, so the occupational ranking is remarkably stable across countries.",
  "Две профессии, изученные Хокшилд более 40 лет назад, — бортпроводники и коллекторы — и сегодня в первой пятёрке официальных данных США, а в Корее высоко стоят телемаркетологи и бортпроводники: рейтинг профессий очень устойчив между странами.",
  "霍克希尔德四十多年前研究的两种职业（空乘与催收员）在今天美国的官方数据中仍居前五，韩国的电话营销员与空乘也位居前列，说明职业排名跨越国家而高度稳定。",
  "ホックシールドが40年余り前に研究した二つの職業（客室乗務員・債権回収員）は今日の米国の公式データでも上位5位以内にあり、韓国でもテレマーケター・客室乗務員が上位で、職種の順位は国を越えて非常に安定している。"],null,"H"),
 s("B",[18],["일본에서는 고객 괴롭힘 경험률이 생활 관련 서비스·오락업(16.6%), 도소매(16.0%), 숙박·음식(16.0%), 의료·복지(15.1%)에서 높고 제조업(4.6%)에서 가장 낮았다.",
  "In Japan, experience of customer harassment was highest in living-related services and entertainment (16.6%), wholesale and retail (16.0%), accommodation and food (16.0%) and medical and welfare (15.1%), and lowest in manufacturing (4.6%).",
  "В Японии притеснения со стороны клиентов чаще всего встречаются в бытовых услугах и развлечениях (16,6%), торговле (16,0%), гостиницах и общепите (16,0%), медицине и соцобеспечении (15,1%), реже всего — в производстве (4,6%).",
  "在日本，遭受顾客骚扰的比例以生活相关服务与娱乐（16.6%）、批发零售（16.0%）、住宿餐饮（16.0%）、医疗福利（15.1%）最高，制造业（4.6%）最低。",
  "日本では顧客からの迷惑行為の経験率が生活関連サービス・娯楽業（16.6%）、卸売・小売（16.0%）、宿泊・飲食（16.0%）、医療・福祉（15.1%）で高く、製造業（4.6%）で最も低かった。"]),
 s("B",[18],["같은 조사에서 고객을 거의 매일 대하는 노동자의 피해율은 17.4%로 거의 대하지 않는 노동자(5.3%)의 세 배를 넘어, 접객 빈도에 따른 뚜렷한 '용량-반응' 관계가 나타났다.",

 s("A",[3,17],["의료는 폭언에서 신체 폭력까지 이어지는 가장 극단적인 직군으로, 메타분석상 보건의료 종사자의 61.9%가 1년간 직장 폭력을 겪었고 정신과·응급실과 간호사·의사에서 특히 높았다.",
  "Healthcare is the most extreme group, where abuse escalates into physical violence: in the meta-analysis 61.9% of healthcare workers experienced workplace violence within a year, especially in psychiatric and emergency settings and among nurses and physicians.",
  "Здравоохранение — самая крайняя группа, где оскорбления перерастают в физическое насилие: по метаанализу 61,9% медиков за год сталкивались с насилием на работе, особенно в психиатрии и неотложной помощи, среди медсестёр и врачей.",
  "医疗是从辱骂延伸到身体暴力的最极端职业群：元分析显示61.9%的医疗卫生从业者一年内遭受过工作场所暴力，在精神科与急诊、护士与医生中尤其高。",
  "医療は暴言から身体的暴力にまで至る最も極端な職種で、メタ分析では医療従事者の61.9%が1年間に職場暴力を経験し、精神科・救急と看護師・医師で特に高かった。"]),
 s("C",[21],["한국 학교에서는 교권보호위원회 심의가 2020학년도 1,197건에서 2023학년도 5,050건으로 늘었다가 2025학년도 4,034건으로 줄었으며, 초등학교는 학부모 등 보호자에 의한 침해 비중이 상대적으로 높다.",
  "In Korean schools, teacher-rights committee hearings rose from 1,197 in the 2020 school year to 5,050 in 2023 before falling to 4,034 in 2025, and in elementary schools a relatively high share of infringements comes from parents and guardians.",

  "韓国の学校では教権保護委員会の審議が2020学年度の1,197件から2023学年度の5,050件に増えた後、2025学年度は4,034件に減り、小学校では保護者による侵害の比重が相対的に高い。"]),
 s("B",[22],["한국 정부는 2024년 김포시 공무원 사망을 계기로 민원 공무원이 폭언 전화를 먼저 끊을 수 있게 하는 등 민원 창구를 감정노동 고위험 직무로 다루기 시작했다.",
  "After the death of a Gimpo city official in 2024, the Korean government began treating public complaint counters as high-risk emotional-labour jobs, for example letting officials hang up first on abusive callers.",
  "После гибели чиновника города Кимпхо в 2024 году правительство Кореи стало относиться к приёму граждан как к работе с высоким риском эмоционального труда, в частности разрешив служащим первыми прерывать оскорбительные звонки.",
  "以2024年金浦市公务员死亡为契机，韩国政府开始把公共投诉窗口作为情绪劳动高风险岗位对待，例如允许公务员遇辱骂电话时先挂断。",
  "韓国政府は2024年の金浦市職員の死亡を契機に、苦情担当公務員が暴言の電話を先に切れるようにするなど、行政の苦情窓口を感情労働の高リスク職務として扱い始めた。"]),
 s("D",[16,15,18,14],["직군 비교를 종합하면 감정노동의 무게는 ① 상대가 이미 화난 상태로 오는 직무(교정·경찰·추심·민원·응급), ② 감정 표현이 상품인 직무(객실승무·호텔·판매), ③ 돌봄·교육처럼 관계가 지속되는 직무로 나뉘며, ①은 빈도, ②는 감정 억제, ③은 학부모·보호자 같은 제3자의 민원이 핵심이다.",
  "Taken together, the weight of emotional labour falls into (1) jobs where the other party arrives already angry (corrections, police, debt collection, public complaints, emergency care), (2) jobs where emotional display is the product (cabin crew, hotels, sales) and (3) jobs with ongoing relationships such as care and teaching — the key factor being frequency in (1), suppression in (2) and complaints from third parties such as parents in (3).",
  "В сумме вес эмоционального труда распадается на (1) работу, где собеседник приходит уже рассерженным (исправительные учреждения, полиция, взыскание долгов, приём граждан, неотложка), (2) работу, где проявление эмоций — сам продукт (бортпроводники, отели, продажи), и (3) работу с длительными отношениями — уход и обучение; ключевое в (1) — частота, в (2) — подавление чувств, в (3) — претензии третьих лиц, например родителей.",
  "综合职业比较，情绪劳动的分量可分为：①对方已带着怒气而来的工作（监狱、警察、催收、投诉、急诊），②情绪表达本身就是产品的工作（空乘、酒店、销售），③照护与教育等关系持续的工作；①的关键是频率，②是情绪抑制，③是家长等第三方的诉求。",
  "職種比較を総合すると、感情労働の重さは①相手がすでに怒った状態で来る職務（矯正・警察・債権回収・苦情窓口・救急）、②感情表現が商品である職務（客室乗務・ホテル・販売）、③ケアや教育のように関係が続く職務に分かれ、①は頻度、②は感情の抑制、③は保護者など第三者の苦情が核心である。"],null,"M"),
 s("B",[6],["이 직군들은 여성 비중이 높아(유럽 대면 서비스직의 61%, 보건 최전선의 85%), 감정노동의 무게는 성별 불평등과 겹친다.",
  "These occupations are female-dominated (61% of interactive service workers and 85% of frontline health workers in Europe), so the weight of emotional labour overlaps with gender inequality.",

  "这些职业中女性比例高（欧洲面对面服务人员的61%、一线医疗人员的85%），情绪劳动的分量与性别不平等相互重叠。",
  "これらの職種は女性の比率が高く（欧州の対面サービス職の61%、医療最前線の85%）、感情労働の重さは男女間の不平等と重なる。"])

[P(
 s("A",[16],["O*NET에서 화난 사람을 가장 자주 상대하는 직업은 교정직·응급의학 의사(94), 긴급신고 접수원(93), 채권 추심원(91), 객실승무원(90)이었다.","In O*NET, the occupations dealing most often with angry people were correctional officers and emergency physicians (94), public-safety telecommunicators (93), bill collectors (91) and flight attendants (90).","В O*NET чаще всего имеют дело с рассерженными людьми сотрудники исправительных учреждений и врачи неотложной помощи (94), операторы экстренных служб (93), коллекторы (91) и бортпроводники (90).","在O*NET中，最常面对愤怒之人的职业是狱警与急诊医生（94）、紧急呼叫接线员（93）、催收员（91）和空乘（90）。","O*NETで怒った人に最も頻繁に対応する職業は矯正職員・救急医（94）、緊急通報受付員（93）、債権回収員（91）、客室乗務員（90）だった。"])

 s("B",[15,18],["한국에서는 텔레마케터가 감정노동 강도 1위였고, 일본에서는 고객을 거의 매일 대하는 노동자의 피해율이 거의 대하지 않는 노동자의 세 배를 넘었다.","In Korea telemarketers ranked first for emotional-labour intensity, and in Japan workers dealing with customers almost daily were harassed more than three times as often as those who rarely do.","В Корее первое место по интенсивности эмоционального труда — у телемаркетологов, а в Японии почти ежедневно контактирующие с клиентами страдают более чем втрое чаще почти не контактирующих.","在韩国，电话营销员的情绪劳动强度居首；在日本，几乎每天接待顾客者的受害率是几乎不接触者的三倍多。","韓国ではテレマーケターが感情労働の強度1位で、日本では顧客とほぼ毎日接する労働者の被害率がほとんど接しない労働者の3倍を超えた。"]),
 s("D",[16,15,3],["감정노동은 화난 상대를 맞는 직무, 감정이 상품인 직무, 관계가 지속되는 돌봄·교육 직무에서 가장 무겁다.","Emotional labour weighs most in jobs that receive angry people, jobs where emotion is the product, and care and teaching jobs with ongoing relationships.","Эмоциональный труд тяжелее всего там, где встречают рассерженных людей, где эмоции — продукт, и в уходе и обучении с длительными отношениями.","情绪劳动在迎接愤怒之人的工作、情绪即产品的工作以及关系持续的照护与教育工作中最为沉重。","感情労働は怒った相手を迎える職務、感情が商品である職務、関係が続くケア・教育の職務で最も重い。"])

SEC("ai",["현재 ④: AI는 감정노동을 덜어주는가 — 고객 응대 AI의 두 얼굴","Current ④: Does AI Lighten Emotional Labour? The Two Faces of Customer-Service AI","Сейчас ④: облегчает ли ИИ эмоциональный труд? Два лица ИИ в обслуживании клиентов","现状④：AI会减轻情绪劳动吗？——客服AI的两张面孔","現在④：AIは感情労働を軽くするか――顧客応対AIの二つの顔"],
[P(
 s("A",[29],["상담원 5,179명을 대상으로 한 현장 연구에서 생성형 AI 보조는 시간당 해결 건수를 평균 14%, 초보·저숙련 상담원은 34% 높였고, 고객 정서를 개선하며 상담원 이직을 줄였다.",
  "In a field study of 5,179 agents, generative-AI assistance raised issues resolved per hour by 14% on average and by 34% for novice and low-skilled agents, while improving customer sentiment and reducing agent attrition.",
  "В полевом исследовании 5179 операторов ИИ-помощник увеличил число решённых обращений в час в среднем на 14%, а у новичков и низкоквалифицированных — на 34%, улучшив настроение клиентов и снизив текучесть.",
  "在一项针对5179名坐席的现场研究中，生成式AI辅助使每小时解决问题数平均提高14%，新手与低技能坐席提高34%，同时改善了顾客情绪并降低了坐席流失。",
  "オペレーター5,179人を対象とした現場研究で、生成AIの支援は1時間あたりの解決件数を平均14%、新人・低スキル担当では34%高め、顧客感情を改善し離職を減らした。"]),
 s("A",[29],["같은 연구에서 AI 보조를 받은 상담에서는 고객이 관리자 연결을 요구하는 일이 줄어, AI가 화가 커지기 전에 대화를 진정시키는 '완충' 역할을 할 수 있음을 보여주었다.",
  "In the same study, customers asked for a manager less often in AI-assisted conversations, showing that AI can act as a buffer that calms an exchange before anger escalates.",
  "В том же исследовании в разговорах с ИИ-помощью клиенты реже требовали позвать руководителя — ИИ может служить буфером, успокаивая беседу до того, как гнев разгорится.",
  "同一研究中，在AI辅助的对话里顾客要求转接主管的情况减少，表明AI可以在怒气升级之前平复对话，起到“缓冲”作用。",
  "同じ研究で、AI支援を受けた応対では顧客が管理者への取り次ぎを求めることが減り、AIが怒りが大きくなる前に会話を落ち着かせる「緩衝」の役割を果たしうることを示した。"],
  ["관리자 연결 요청 감소는 논문의 초기 판본 요약에 명시된 결과다.","The fall in requests for a manager is stated in the summary of an earlier version of the paper.","Снижение требований позвать руководителя указано в резюме ранней версии статьи.","转接主管请求减少的结果见于论文早期版本的摘要。","管理者への取り次ぎ要求の減少は論文の初期版の要約に明記された結果である。"],"M"),
 s("A",[30],["반면 실험 연구에서는 고객이 화가 난 상태일 때 사람처럼 보이는 챗봇이 오히려 고객 만족과 기업 평가를 떨어뜨려, AI가 분노를 흡수하지 못하는 조건이 확인되었다.",
  "Experimental research, by contrast, found that when customers are angry, humanlike chatbots actually lower satisfaction and evaluations of the firm — identifying conditions under which AI cannot absorb anger.",
  "Экспериментальные исследования, напротив, показали: когда клиенты рассержены, человекоподобные чат-боты снижают удовлетворённость и оценку компании — то есть есть условия, при которых ИИ не поглощает гнев.",
  "相反，实验研究发现，当顾客处于愤怒状态时，拟人化聊天机器人反而降低顾客满意度和企业评价，证实了AI无法吸收怒气的条件。",
  "一方で実験研究では、顧客が怒っているときには人間らしく見えるチャットボットがかえって満足と企業評価を下げ、AIが怒りを吸収できない条件が確認された。"]),
 s("C",[31],["고객 5,728명 조사에서 64%는 기업이 고객 서비스에 AI를 쓰지 않기를 바랐고, 가장 큰 우려는 '사람과 연결되기 어려워진다'는 것이었다.",
  "In a survey of 5,728 customers, 64% preferred that companies not use AI in customer service, the top concern being that it would become harder to reach a person.",
  "В опросе 5728 клиентов 64% предпочли бы, чтобы компании не использовали ИИ в обслуживании; главное опасение — станет труднее связаться с человеком.",
  "在对5728名顾客的调查中，64%希望企业不要在客服中使用AI，最大的担忧是“更难联系到真人”。",
  "顧客5,728人の調査で64%は企業が顧客サービスにAIを使わないことを望み、最大の懸念は「人につながりにくくなる」ことだった。"]),
 s("C",[32],["한국노총 중앙연구원 조사에서는 콜센터 상담사의 61%가 AI 상담 도입 후 노동조건이 악화됐다고 답했고, 일평균 민원은 17.9% 늘었으며 시민의 87.5%는 사람 상담사를 선호했다.",
  "In a survey by the research institute of the Federation of Korean Trade Unions, 61% of call-centre agents said conditions worsened after AI contact centres were introduced, daily complaints rose 17.9%, and 87.5% of citizens preferred human agents.",

  "在韩国劳总中央研究院的调查中，61%的呼叫中心坐席称引入AI客服后劳动条件恶化，日均投诉增加17.9%，87.5%的市民更喜欢人工坐席。",
  "韓国労総中央研究院の調査では、コールセンター担当の61%がAI応対の導入後に労働条件が悪化したと答え、1日平均の苦情は17.9%増え、市民の87.5%は人のオペレーターを好んだ。"])

 s("C",[33],["일본 소프트뱅크는 화난 고객의 음성 톤만 실시간으로 부드럽게 바꾸고 내용은 유지하는 'SoftVoice'를 2026년 2월 상용화했으며, 개발 단계 시험에서 인지된 분노 지표가 30% 이상 줄었다고 밝혔다.",
  "Japan's SoftBank commercialised SoftVoice in February 2026, which softens only the tone of an angry customer's voice in real time while keeping the content, and reported a more than 30% fall in a perceived-anger index in development tests.",
  "Японская SoftBank в феврале 2026 года коммерциализировала SoftVoice, которая в реальном времени смягчает лишь тон голоса рассерженного клиента, сохраняя содержание, и сообщила о снижении индекса воспринимаемого гнева более чем на 30% в испытаниях.",
  "日本软银于2026年2月将“SoftVoice”商用化，它实时只柔化愤怒顾客的语气而保留内容，并称在开发测试中感知愤怒指数下降了30%以上。",
  "日本のソフトバンクは怒った顧客の声のトーンだけをリアルタイムで和らげ内容は保つ「SoftVoice」を2026年2月に商用化し、開発段階の試験で知覚された怒りの指標が30%以上下がったと明らかにした。"]),
 s("B",[41],["ILO 분석에서 전 세계 일자리의 25%(고소득국 34%)가 생성형 AI에 노출되어 있고, 사무직의 노출이 가장 높으며 고소득국 여성 고용의 9.6%가 최고위험 범주(남성 3.5%)에 속했다.",
  "In ILO analysis, 25% of jobs worldwide (34% in high-income countries) are exposed to generative AI, clerical work most of all, and 9.6% of women's employment in high-income countries falls into the highest-risk category (3.5% for men).",
  "По анализу МОТ, генеративному ИИ подвержены 25% рабочих мест в мире (34% в странах с высоким доходом), сильнее всего — офисный труд, а в богатых странах 9,6% занятости женщин относится к категории наивысшего риска (у мужчин 3,5%).",
  "国际劳工组织分析显示，全球25%的工作岗位（高收入国家34%）暴露于生成式AI，文职暴露最高，高收入国家女性就业的9.6%处于最高风险类别（男性3.5%）。",
  "ILOの分析で世界の仕事の25%（高所得国34%）が生成AIにさらされ、事務職の曝露が最も高く、高所得国の女性雇用の9.6%が最高リスク区分（男性3.5%）に属した。"]),
 s("C",[42],["실제 AI 사용 대화 20만 건을 분석한 연구는 정보의 생성·처리·전달 업무에서 AI 적용이 가장 활발하다고 보고해, 정보 제공형 고객 응대가 AI 적용의 중심에 있음을 시사한다.",
  "A study of 200,000 real AI conversations reports that AI is applied most in work creating, processing and communicating information, suggesting that information-giving customer service is at the centre of AI application.",
  "Исследование 200 000 реальных диалогов с ИИ показывает, что ИИ чаще всего применяется в работе по созданию, обработке и передаче информации, — значит, информационное обслуживание клиентов в центре применения ИИ.",
  "一项分析20万条真实AI对话的研究报告称，AI在信息的生成、处理与传递工作中应用最活跃，暗示信息提供型客服处于AI应用的中心。",
  "実際のAI利用の会話20万件を分析した研究は、情報の作成・処理・伝達の業務でAIの適用が最も活発だと報告しており、情報提供型の顧客応対がAI適用の中心にあることを示唆する。"]),
 s("D",[29,30,31,32],["종합하면 AI는 '쉬운 문의'를 먼저 가져가고 화난 고객과 복잡한 민원을 사람에게 남긴다 — 이 '잔여 감정노동'이 더 적은 인력에 집중되면 상담 1건당 감정 부담은 오히려 커진다.",
  "In sum, AI takes the easy queries first and leaves angry customers and complex complaints to people — and if this residual emotional labour is concentrated on fewer staff, the emotional burden per contact actually grows.",
  "Итак, ИИ первым забирает простые запросы и оставляет людям рассерженных клиентов и сложные жалобы; если этот остаточный эмоциональный труд концентрируется на меньшем числе сотрудников, нагрузка на одно обращение даже растёт.",
  "综上，AI先拿走“简单咨询”，把愤怒的顾客和复杂投诉留给人——如果这些“残余情绪劳动”集中到更少的人手上，每次接待的情绪负担反而加重。",
  "総合すると、AIは「簡単な問い合わせ」を先に引き取り、怒った顧客と複雑な苦情を人に残す。この「残余感情労働」がより少ない人員に集中すれば、応対1件あたりの感情的負担はかえって大きくなる。"],null,"M"),
 s("D",[29,33,30],["같은 기술이라도 설계가 결과를 가른다: 상담원을 돕는 응답 보조·톤 완화·자동 경고는 부담을 덜지만, 상담원을 대체하고 화난 고객만 넘기는 구조는 부담을 집중시킨다.",

 s("D",[9,14,18,25,33],["일본은 직무 몰입도(8%)가 가장 낮고 교사의 학부모 민원 스트레스가 높으며, 2026년 전 사업주 의무화와 음성 완화 AI처럼 법과 기술 양쪽에서 가장 빠르게 대응하는 '사후 대응 가속' 유형이다.",

 s("D",[10,16,17,39,40],["미국은 스트레스(50%)가 가장 높고 알고리즘 관리(90%)도 가장 널리 퍼졌으며 의료 현장 폭력이 집중되지만, 연방 차원의 고객 괴롭힘 전용 규칙은 본 보고서 근거 범위에서 확인되지 않는 '고강도·자율 규제' 유형이다.",

 s("D",[11,20,27,28],["영국은 스트레스(46%)가 유럽 평균보다 높고 상승 중이며 서비스직 적대 경험이 36%에 이르지만, C190 비준과 사업주의 성희롱 예방 의무로 '국제 기준 수용' 쪽에 서 있다.",
  "The UK's stress (46%) is above the European average and rising, and 36% of service workers face hostility, but with C190 ratification and an employer duty to prevent sexual harassment it stands on the side of adopting international standards.",

  "The EU (Germany and others) is a 'prevent and prohibit' type that recognises difficult customers as the most common risk and bans emotion-recognition AI, and Germany has the lowest stress and anger among the comparison countries.",
  "ЕС (Германия и др.) — тип «профилактика и запрет»: трудные клиенты признаны самым частым риском, ИИ распознавания эмоций запрещён, а в Германии самые низкие среди сравниваемых стран стресс и гнев.",

 s("D",[13,37,38],["중국은 스트레스·분노·외로움이 모두 높은 편이고, 감정노동 자체보다 알고리즘에 의한 시간 압박(배달·플랫폼)을 규율하는 '알고리즘 통제' 유형이다.",

  "中国的压力、愤怒与孤独都偏高，属于规制算法造成的时间压力（外卖、平台）而非情绪劳动本身的“算法控制”类型。",

  "下の表は職種別の感情労働の類型と強度を国別データとともに整理し、AIが各職種に与える影響についての判断を加えたものである。"])

SEC("scen",["미래 전망: 2035년 4대 시나리오","Outlook: Four Scenarios for 2035","Прогноз: четыре сценария на 2035 год","未来展望：2035年四大情景","将来展望：2035年の四つのシナリオ"],

 s("D",[],["네 시나리오는 2035년 A(고객 응대 AI 확산)·L(현장 완충력)·I(보호 제도) 수준이 임계값을 넘는지로 판정하며, 어느 것도 '감정노동의 소멸'을 뜻하지 않는다.",

  "四つのシナリオは2035年のA（顧客応対AIの普及）・L（現場の緩衝力）・I（保護制度）が閾値を超えるかで判定し、いずれも「感情労働の消滅」を意味しない。"]),
 s("D",[29,32],["S3는 AI가 확산되지만 현장 완충력이 약해 남은 화가 소수에게 집중되는 경로이고, S1은 같은 확산이 보조·완화 기술과 보호 제도에 결합되는 경로다.",
  "S3 is the path where AI spreads but the frontline buffer is weak, so the remaining anger concentrates on a few; S1 is the path where the same spread is combined with assistive and softening technology and protective institutions.",
  "S3 — путь, где ИИ распространяется, но буфер на местах слаб и оставшийся гнев концентрируется на немногих; S1 — путь, где то же распространение сочетается с вспомогательными и смягчающими технологиями и защитными институтами.",
  "S3是AI扩散但现场缓冲力薄弱、剩下的怒气集中到少数人的路径；S1是同样的扩散与辅助、柔化技术及保护制度相结合的路径。",
  "S3はAIが普及するが現場の緩衝力が弱く残った怒りが少数に集中する経路で、S1は同じ普及が支援・緩和技術と保護制度に結びつく経路である。"]),
 s("D",[31,30],["S4는 고객의 거부감과 AI의 한계 때문에 확산이 더딘 경로로, 감정노동은 줄지도 늘지도 않고 지금의 모습으로 남는다.",
  "S4 is the path where diffusion is slow because of customer aversion and AI's limits; emotional labour neither shrinks nor grows and stays as it is.",

  "S4は顧客の忌避とAIの限界のために普及が遅い経路で、感情労働は減りも増えもせず今の姿のまま残る。"])
),SCN,TB("timeline")],
[P(
 s("D",[],["2035년 네 시나리오는 AI 확산·현장 완충력·보호 제도의 임계값으로 판정한다.","The four 2035 scenarios are classified by thresholds for AI diffusion, the frontline buffer and protective institutions.","Четыре сценария на 2035 год определяются порогами распространения ИИ, буфера на местах и защитных институтов.","2035年四个情景依据AI扩散、现场缓冲力与保护制度的阈值判定。","2035年の四つのシナリオはAI普及・現場の緩衝力・保護制度の閾値で判定する。"])

SEC("mcmc",["MCMC 시뮬레이션: 시나리오 확률분포","MCMC Simulation: Scenario Probability Distribution","MCMC-симуляция: распределение вероятностей сценариев","MCMC模拟：情景概率分布","MCMCシミュレーション：シナリオ確率分布"],
[P(
 s("D",[],["모형은 16개 지표(0~1 코딩, 근거 등급에 따라 오차 σ 부여)로 2026년 A·I·L의 잠재 수준을 추정하고, 4개 체인 메트로폴리스 MCMC로 사후분포를 구한 뒤 2035년까지 9년을 투영한다.",
  "The model estimates 2026 latent levels of A, I and L from 16 indicators (coded 0–1, with error σ set by evidence grade), obtains the posterior with four-chain Metropolis MCMC, and projects nine years to 2035.",
  "Модель оценивает латентные уровни A, I и L в 2026 году по 16 индикаторам (кодировка 0–1, погрешность σ по классу доказательности), получает апостериорное распределение четырёхцепочечным MCMC Метрополиса и проецирует на девять лет до 2035 года.",
  "模型用16个指标（0–1编码，按依据等级赋予误差σ）估计2026年A、I、L的潜在水平，以4条链的Metropolis MCMC求得后验分布，再向后投射9年至2035年。",
  "モデルは16の指標（0〜1でコード化、根拠等級に応じて誤差σを付与）で2026年のA・I・Lの潜在水準を推定し、4チェーンのメトロポリスMCMCで事後分布を求めたうえで2035年まで9年間を投影する。"]),
 s("D",[],["판정 규칙은 A<θA이면 S4(더딘 확산), 아니고 L<θL이면 S3(잔여 감정노동의 집중), 아니고 I≥θI이면 S1(보호된 증강), 나머지는 S2(불균등한 완화)이다.",
  "The rule: if A<θA, S4 (slow diffusion); otherwise if L<θL, S3 (concentrated residual emotional labour); otherwise if I≥θI, S1 (protected augmentation); else S2 (uneven relief).",
  "Правило: если A<θA — S4 (медленное распространение); иначе если L<θL — S3 (концентрация остаточного эмоционального труда); иначе если I≥θI — S1 (защищённое усиление); в остальных случаях — S2 (неравномерное облегчение).",
  "判定规则：若A<θA则为S4（缓慢扩散）；否则若L<θL则为S3（残余情绪劳动的集中）；否则若I≥θI则为S1（受保护的增强）；其余为S2（不均衡的缓解）。",
  "判定規則は、A<θAならS4（緩やかな普及）、そうでなくL<θLならS3（残余感情労働の集中）、そうでなくI≥θIならS1（保護された増強）、残りはS2（不均等な緩和）である。"]),
 s("D",[39,41,42],["AI 확산 성장률의 사전평균 g_A는 알고리즘 관리와 생성형 AI 노출의 확산 추세를 반영하되, 고객 거부감과 화난 고객 응대의 한계를 고려해 분산을 넓게 두었다.",
  "The prior mean of AI-diffusion growth, g_A, reflects the spread of algorithmic management and generative-AI exposure, with a wide variance to allow for customer aversion and the limits of handling angry customers.",
  "Априорное среднее роста распространения ИИ g_A отражает распространение алгоритмического управления и подверженности генеративному ИИ, а дисперсия взята широкой с учётом неприятия клиентов и ограничений в работе с рассерженными людьми.",
  "AI扩散增长率的先验均值g_A反映算法管理与生成式AI暴露的扩散趋势，并考虑顾客抵触及应对愤怒顾客的局限而设定较宽的方差。",
  "AI普及の成長率の事前平均g_Aはアルゴリズム管理と生成AI曝露の拡大傾向を反映しつつ、顧客の忌避と怒った顧客への対応の限界を考慮して分散を広く取った。"]),
 s("D",[39,31,32],["비용·효율 압력 D는 미국 0.80, 한국 0.70, 글로벌 0.60, 유럽 0.55, 일본 0.50으로 두었고, 이 값이 클수록 보호 제도의 성장률이 κ·D만큼 깎인다.",
  "Cost and efficiency pressure D is set at 0.80 for the US, 0.70 for Korea, 0.60 globally, 0.55 for Europe and 0.50 for Japan; the higher it is, the more κ·D is subtracted from the growth of protective institutions.",
  "Давление издержек и эффективности D задано так: США 0,80, Корея 0,70, мир 0,60, Европа 0,55, Япония 0,50; чем оно выше, тем больше κ·D вычитается из роста защитных институтов.",
  "成本与效率压力D设为美国0.80、韩国0.70、全球0.60、欧洲0.55、日本0.50，数值越大，保护制度的增长率被扣减的κ·D越多。",
  "コスト・効率の圧力Dは米国0.80、韓国0.70、グローバル0.60、欧州0.55、日本0.50とし、値が大きいほど保護制度の成長率がκ·Dだけ削られる。"])
),W("mcmc"),P(

[P(
 s("D",[58,1],["지금까지 다룬 감정노동이 고객을 향한 것이었다면, 일터에는 상사·선배·동료를 향한 또 하나의 감정노동이 있다: 모르는 것을 물을 때 무능해 보일까 걱정하고, '이런 것도 모르냐'는 핀잔을 견디는 일이다.",
  "If the emotional labour discussed so far is directed at customers, the workplace holds another kind directed at bosses, seniors and colleagues: worrying about looking incompetent when asking what you don't know, and enduring the put-down 'you don't even know this?'",
