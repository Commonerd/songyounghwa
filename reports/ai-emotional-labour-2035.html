  "同书第6章《对人工智能乐观或悲观都为时尚早》的第一节题为《无需情绪劳动就能请教的师傅，ChatGPT》，紧接着一节是《为了机器的伦理姿态，牺牲的是谁？》——在同一章里同时追问AI减轻的情绪劳动与转移到AI背后的情绪劳动。",
  "同書の第6章「楽観するにも悲観するにも早い人工知能」の最初の節は「感情労働なしで聞ける先輩、ChatGPT」で、すぐ次の節は「機械の倫理的態度のために犠牲になるのは誰か」であり、AIが減らす感情労働とAIの背後へ移る感情労働を一つの章で問う構成になっている。"],
  ["장·꼭지 제목의 우리말은 원문 그대로이고, 다른 언어는 본 보고서의 번역이다.","Chapter and section titles are quoted verbatim in Korean; other languages are this report's translations.","Названия главы и разделов приведены дословно по-корейски; на других языках — перевод доклада.","章节标题的韩文为原文，其他语言为本报告的翻译。","章・節の題は韓国語が原文どおりで、他の言語は本報告の翻訳である。"],"H"),
 s("A",[51],["AI가 '평가하지 않는 상대'라는 감각은 실험으로도 확인된다: 실험실·현장·온라인의 다섯 개 연구에서 사람들은 민망한 상황에서 사람보다 로봇에게 덜 평가받는다고 느꼈고, 그래서 로봇의 응대를 더 선호했다.",
  "The sense that AI is a counterpart that does not judge is confirmed experimentally: across five lab, field and online studies, people in embarrassing situations felt less judged by a robot than by a human and therefore preferred to be served by the robot.",
  "Ощущение, что ИИ — собеседник, который не оценивает, подтверждается экспериментально: в пяти лабораторных, полевых и онлайн-исследованиях люди в неловких ситуациях чувствовали, что робот оценивает их меньше, чем человек, и поэтому предпочитали обслуживание роботом.",
  "“AI是不评判的对象”这种感觉也得到了实验证实：在实验室、现场和在线的五项研究中，人们在尴尬情境下觉得机器人比人更少评判自己，因而更愿意由机器人提供服务。",
  "AIが「評価しない相手」だという感覚は実験でも確かめられている。実験室・フィールド・オンラインの五つの研究で、人は気恥ずかしい場面では人よりロボットの方が評価されていないと感じ、そのためロボットによる応対を好んだ。"],
  ["대상은 고객의 민망한 구매 상황이어서, 동료 사이의 질문에 적용하는 것은 유추다.","The setting is customers' embarrassing purchases, so applying it to questions between colleagues is an analogy.","Речь о неловких покупках клиентов, поэтому перенос на вопросы между коллегами — аналогия.","研究情境是顾客的尴尬购买，推及同事间提问属于类比。","対象は顧客の気恥ずかしい購買場面なので、同僚間の質問への適用は類推である。"],"M")
),
H(["① 묻는 일의 감정 비용 — 나라마다 다르게 나타난다","1. The emotional cost of asking — it differs by country","① Эмоциональная цена вопроса — в разных странах она разная","① 提问的情绪成本——各国表现不同","① 聞くことの感情コスト――国によって表れ方が違う"]),
P(
 s("C",[43],["한국 AI 커뮤니티 이용자 5,586명(직장인 62%) 조사에서 모르는 것이 생겼을 때 사람보다 AI에게 묻는 것이 더 편하다는 응답은 72.4%로, 사람에게 묻는 것이 더 편하다는 응답(5.4%)의 13배를 넘었다.",
  "In a survey of 5,586 users of a Korean AI community (62% employees), 72.4% said that when they don't know something it is easier to ask AI than a person — more than 13 times the 5.4% who found asking a person easier.",
  "В опросе 5586 пользователей корейского ИИ-сообщества (62% — наёмные работники) 72,4% ответили, что, когда чего-то не знают, им проще спросить ИИ, чем человека, — более чем в 13 раз больше, чем тех, кому проще спросить человека (5,4%).",
  "在对韩国某AI社区5,586名用户（上班族占62%）的调查中，72.4%表示遇到不懂的事时问AI比问人更自在，是“问人更自在”（5.4%）的13倍以上。",
  "韓国のAIコミュニティ利用者5,586人（会社員62%）の調査では、わからないことがあるとき人よりAIに聞く方が気楽だという回答が72.4%で、人に聞く方が気楽という回答（5.4%）の13倍を超えた。"],
  ["AI를 즐겨 쓰는 커뮤니티 이용자 표본이라 크기는 과대 추정되었을 수 있다.","The sample of AI-community users who like AI may overstate the size.","Выборка пользователей ИИ-сообщества может завышать величину.","样本为爱用AI的社区用户，数值可能被高估。","AIを好む利用者の標本なので大きさは過大かもしれない。"],"M"),
 s("C",[43],["이유는 정확성이 아니라 눈치였다: '바쁜 사람 눈치를 안 봐도 돼서'(31.3%), '기초적인 질문도 부끄럽지 않아서'(27.3%), '핀잔이나 잔소리를 안 들어도 돼서'(6.9%)를 합하면 65.5%였고, 'AI가 사람보다 정확해서'는 5.1%에 그쳤다.",
  "The reason was not accuracy but social anxiety: 'no need to read a busy person's mood' (31.3%), 'not embarrassed to ask even basic questions' (27.3%) and 'no scolding or nagging' (6.9%) together made up 65.5%, while 'AI is more accurate than people' was only 5.1%.",
  "Причина — не точность, а оглядка на других: «не нужно ловить настроение занятого человека» (31,3%), «не стыдно задавать даже простые вопросы» (27,3%) и «не услышишь упрёков и нотаций» (6,9%) в сумме дали 65,5%, а «ИИ точнее людей» — лишь 5,1%.",
  "原因不是准确性，而是看人脸色：“不用看忙碌的人的脸色”（31.3%）、“问基础问题也不难为情”（27.3%）、“不会挨数落和唠叨”（6.9%）合计65.5%，而“AI比人更准确”仅占5.1%。",
  "理由は正確さではなく気遣いだった。「忙しい人の顔色をうかがわなくていい」（31.3%）、「基本的な質問でも恥ずかしくない」（27.3%）、「小言やお説教を聞かなくていい」（6.9%）を合わせると65.5%で、「AIの方が人より正確」は5.1%にとどまった。"]),
 s("C",[45],["일·미 취업자 2만 608명 조사에서 일의 고민을 가장 먼저 상의하는 상대는 일본에서는 동료와 상사(각 약 30%)가 앞서고 생성형 AI는 약 10%였지만, 미국에서는 생성형 AI가 상사와 함께 30%를 넘어 동료(20%대 초반)를 앞섰다.",
  "In a survey of 20,608 workers in Japan and the US, the first person consulted about work worries in Japan was a colleague or boss (about 30% each), with generative AI at about 10%; in the US, generative AI, together with the boss, exceeded 30% and overtook colleagues (just over 20%).",
  "В опросе 20 608 работников Японии и США первым, с кем советуются о рабочих проблемах, в Японии оказались коллега и начальник (около 30% каждый), а генеративный ИИ — около 10%; в США генеративный ИИ вместе с начальником превысил 30% и обогнал коллег (немногим более 20%).",
  "在对日美20,608名在职者的调查中，日本人遇到工作烦恼时最先商量的对象是同事和上司（各约30%），生成式AI约为10%；而在美国，生成式AI与上司一样超过30%，超过了同事（20%出头）。",
  "日米の就業者20,608人の調査では、仕事の悩みを最初に相談する相手は、日本では同僚と上司（各約3割）が上位で生成AIは約1割だったが、米国では生成AIが上司とともに3割を超え、同僚（2割強）を上回った。"]),
 s("C",[45],["사람에게 상의하지 않는 이유로는 두 나라 모두 '상대에게 폐가 될 수 있어서'가 많았고, 일본은 '상의해도 바뀌지 않는다'는 체념이, 미국은 평가 영향이나 기밀 유출을 걱정하는 실무적 위험 회피가 두드러졌다.",
  "As reasons for not consulting people, 'it might be a burden to them' was common in both countries; Japan stood out for resignation — 'nothing changes even if I ask' — and the US for practical risk avoidance, such as worry about effects on evaluations or leaks of confidential information.",
  "Среди причин не советоваться с людьми в обеих странах часто называли «могу доставить человеку неудобство»; в Японии выделялась покорность — «ничего не изменится, даже если спрошу», — а в США практическое избегание рисков, например страх повлиять на оценку или допустить утечку конфиденциальной информации.",
  "关于不找人商量的理由，两国都常见“可能给对方添麻烦”；日本突出的是“商量了也不会改变”的无奈，美国突出的则是担心影响考评或泄露机密等务实的风险回避。",
  "人に相談しない理由としては、両国とも「相手に迷惑がかかるかもしれない」が多く、日本では「相談しても変わらない」というあきらめが、米国では評価への影響や機密漏洩を心配する実務的なリスク回避が目立った。"]),
 s("C",[46],["일본 20대 회사원 595명 조사에서는 26.5%가 커리어의 속마음을 털어놓을 상대로 직속 상사보다 생성형 AI를 더 신뢰한다고 답했고, 사내 상담 창구가 '형식만 있고 실제로는 쓰기 어렵다'는 응답도 35.1%였다.",
  "In a survey of 595 Japanese company employees in their twenties, 26.5% said they trust generative AI more than their direct boss as someone to confide in about their career, and 35.1% said the internal consultation system 'exists in form but is hard to use in practice'.",
  "В опросе 595 японских сотрудников компаний в возрасте 20–29 лет 26,5% ответили, что доверяют генеративному ИИ больше, чем непосредственному начальнику, когда хотят откровенно поговорить о карьере, а 35,1% — что внутренняя система консультаций «есть формально, но на деле ею трудно пользоваться».",
  "在对日本595名20多岁公司职员的调查中，26.5%表示在吐露职业真心话时，比起直属上司更信任生成式AI；还有35.1%表示公司的咨询渠道“形式上有，实际上难以使用”。",
  "日本の20代会社員595人の調査では、26.5%がキャリアの本音を話せる相手として直属の上司より生成AIを信頼すると答え、社内の相談体制が「形としてはあるが実際には利用しにくい」という回答も35.1%あった。"]),
 s("C",[47],["반면 31개 시장 지식노동자 3만 1천 명 조사에서 동료 대신 AI를 찾은 이유는 24시간 이용 가능(42%), 속도와 품질(30%), 무한한 아이디어(28%)가 중심이었고, 조급함·설명 요구·평가 같은 '사람의 특성'을 피하려는 이유는 가장 낮았다.",
  "By contrast, in a survey of 31,000 knowledge workers in 31 markets, the main reasons for turning to AI instead of a colleague were 24/7 availability (42%), speed and quality (30%) and unlimited ideas (28%), while reasons of avoiding human traits — impatience, the need for explanation, judgement — ranked lowest.",
  "Напротив, в опросе 31 000 работников умственного труда на 31 рынке главными причинами обращаться к ИИ вместо коллеги были круглосуточная доступность (42%), скорость и качество (30%) и неограниченные идеи (28%), а желание избежать человеческих черт — нетерпения, необходимости объяснять, оценки — оказалось на последнем месте.",
  "相比之下，在对31个市场3.1万名知识工作者的调查中，用AI代替同事的主要理由是全天候可用（42%）、速度与质量（30%）和无限的点子（28%），而为回避急躁、需要解释、评判等“人的特性”的理由排名最低。",
  "一方、31市場の知識労働者3万1千人の調査では、同僚の代わりにAIを使う理由は24時間使える（42%）、速さと質（30%）、尽きないアイデア（28%）が中心で、せっかちさ・説明の必要・評価といった「人の特性」を避けるための理由は最も低かった。"]),
 s("D",[43,45,46,47],["종합하면 'AI에게 묻는 편안함'의 성격은 나라마다 다르다: 한국은 눈치와 체면(평가 회피), 일본은 '말해도 소용없다'는 체념과 폐를 끼치기 싫은 마음, 미국은 위험 회피와 효율, 31개 시장 평균은 효율(24시간·속도)이 앞서며 — 한국 조사에서 '해방감'이 가장 두드러지는 것도 이 때문으로 보인다.",
  "Taken together, the comfort of asking AI has a different character in each country: in Korea, social anxiety and face (avoiding judgement); in Japan, resignation that speaking up is pointless and reluctance to impose; in the US, risk avoidance and efficiency; and on the 31-market average, efficiency (24/7, speed) — which seems to be why the sense of relief stands out most in the Korean survey.",
  "В целом «удобство спросить ИИ» имеет в каждой стране свой характер: в Корее — оглядка на других и сохранение лица (избежать оценки), в Японии — покорность («говорить бесполезно») и нежелание обременять, в США — избегание рисков и эффективность, а в среднем по 31 рынку — эффективность (круглосуточно, быстро); видимо, поэтому чувство облегчения сильнее всего выражено в корейском опросе.",
  "综合来看，“问AI的自在”在各国性质不同：韩国是看脸色和面子（回避评判），日本是“说了也没用”的无奈和不愿添麻烦，美国是风险回避与效率，31个市场平均则以效率（全天候、速度）为先——这似乎正是韩国调查中“解脱感”最突出的原因。",
  "まとめると、「AIに聞く気楽さ」の性格は国ごとに異なる。韓国は気遣いと体面（評価の回避）、日本は「言っても無駄」というあきらめと迷惑をかけたくない気持ち、米国はリスク回避と効率、31市場平均は効率（24時間・速さ）が前に出る――韓国の調査で「解放感」が最も際立つのもこのためとみられる。"],
  ["표본과 문항이 서로 다른 조사를 비교한 판단이므로, 수치의 크기가 아니라 이유의 구성만 비교했다.","A judgement comparing surveys with different samples and questions, so only the mix of reasons is compared, not the size of figures.","Суждение сравнивает опросы с разными выборками и вопросами, поэтому сопоставляется только структура причин, а не величины.","此判断比较的是样本与问题各异的调查，只比较理由构成，不比较数值大小。","標本と設問が異なる調査を比べた判断なので、数値の大きさではなく理由の構成だけを比べた。"],"M")
),
CH("ask"),
H(["② AI가 '사수'가 될 때 — 업종·기업별 현장 증거","2. When AI becomes the senior — field evidence by industry and company","② Когда ИИ становится наставником — данные по отраслям и компаниям","② 当AI成为“师傅”——分行业、分企业的现场证据","② AIが「先輩」になるとき――業種・企業別の現場の証拠"]),
P(
 s("A",[29],["한 소프트웨어 기업의 고객지원 상담원 5,179명을 다룬 현장 연구에서 AI 보조의 이득은 초보·저숙련 상담원에게 가장 컸고(34%), 연구진은 AI가 숙련자의 모범 사례를 퍼뜨려 신입이 경험 곡선을 더 빨리 내려가도록 돕는다는 시사적 증거를 제시했다 — AI가 '사수' 역할을 한 셈이다.",
  "In a field study of 5,179 customer-support agents at a software company, the gains from AI assistance were largest for novice and low-skilled agents (34%), and the researchers presented suggestive evidence that the AI spreads the best practices of more able workers and helps newer workers move down the experience curve — in effect, AI acted as the senior.",
  "В полевом исследовании 5179 операторов поддержки клиентов одной компании-разработчика ПО выигрыш от помощи ИИ был максимальным у новичков и низкоквалифицированных операторов (34%), а исследователи привели предварительные свидетельства того, что ИИ распространяет лучшие практики более умелых работников и помогает новичкам быстрее проходить кривую опыта, — по сути, ИИ сыграл роль наставника.",
  "在对某软件企业5,179名客服人员的现场研究中，AI辅助的收益在新手和低技能客服身上最大（34%），研究者还提供了提示性证据：AI传播了能干员工的最佳做法，帮助新人更快走过经验曲线——AI实际上扮演了“师傅”。",
  "あるソフトウェア企業の顧客サポート担当者5,179人の現場研究では、AI支援の効果は初心者・低スキルの担当者で最も大きく（34%）、研究者はAIが熟練者のベストプラクティスを広め、新人が経験曲線を早く下るのを助けるという示唆的な証拠を示した――AIが「先輩」の役割を果たしたことになる。"]),
 s("B",[54],["소비재 기업 P&G의 전문가 776명을 무작위 배정한 현장 실험에서는 AI와 혼자 일한 사람이 AI 없는 2인 팀과 같은 성과를 냈고, AI 사용자는 더 긍정적인 정서를 보고해 AI가 팀 동료가 주던 사회적·동기적 역할의 일부를 대신할 수 있음을 시사했다.",
  "In a field experiment that randomly assigned 776 professionals at the consumer-goods company P&G, individuals working with AI matched the performance of two-person teams without AI, and AI users reported more positive emotions, suggesting that AI can take over part of the social and motivational role that teammates used to provide.",
  "В полевом эксперименте со случайным распределением 776 специалистов компании потребительских товаров P&G работавшие в одиночку с ИИ показали результаты на уровне команд из двух человек без ИИ, а пользователи ИИ сообщали о более позитивных эмоциях — это говорит о том, что ИИ может взять на себя часть социальной и мотивационной роли коллег по команде.",
  "在对消费品企业宝洁776名专业人员随机分组的现场实验中，与AI单独工作的人达到了无AI两人团队的水平，AI使用者报告的正面情绪也更多，表明AI可以替代团队同事原本提供的部分社交与激励作用。",
  "消費財企業P&Gの専門職776人を無作為に割り当てたフィールド実験では、AIと一人で働いた人がAIなしの2人チームと同等の成果を出し、AI利用者はより前向きな感情を報告して、AIがチームの同僚が担っていた社会的・動機づけの役割の一部を代わりうることを示唆した。"]),
 s("A",[56],["개발자 업계에서는 ChatGPT 이후 공개 질의응답 사이트 스택오버플로의 활동이 약 25% 줄었고, 감소는 초보부터 전문가까지 모든 경력 수준에서 나타났다.",
  "In software development, activity on the public Q&A site Stack Overflow fell by about 25% after ChatGPT, and the decline appeared at every experience level, from novices to experts.",
  "В разработке ПО активность на публичном сайте вопросов и ответов Stack Overflow после появления ChatGPT снизилась примерно на 25%, причём спад наблюдался на всех уровнях опыта — от новичков до экспертов.",
  "在软件开发领域，ChatGPT问世后公开问答网站Stack Overflow的活跃度下降约25%，且从新手到专家各个经验层级都出现了下降。",
  "ソフトウェア開発では、ChatGPT以降、公開Q&AサイトStack Overflowの活動が約25%減り、減少は初心者から専門家まですべての経験レベルで見られた。"]),
 s("B",[57],["GitHub Copilot을 쓴 개발자 18만 7천여 명을 분석한 연구에서는 문제가 생겼을 때 동료에게 조언을 구하는 대신 Copilot에 묻는 쪽으로 바뀌면서 관리 업무가 줄고 독립적 작업이 늘었으며, 연구진은 이것이 멘토링 기회를 제한할 수 있다고 경고했다.",
  "A study of more than 187,000 developers using GitHub Copilot found that, when they hit problems, they turned to Copilot instead of seeking advice from peers, so managerial tasks shrank and independent work grew — and the researchers warned this could limit opportunities for mentorship.",
  "Исследование более 187 000 разработчиков, пользующихся GitHub Copilot, показало: столкнувшись с проблемой, они обращались к Copilot, а не за советом к коллегам, поэтому доля управленческих задач сократилась, а самостоятельной работы выросла; исследователи предупредили, что это может ограничить возможности наставничества.",
  "一项分析18.7万余名使用GitHub Copilot的开发者的研究发现，遇到问题时他们转而问Copilot，而不是向同事求教，于是管理性工作减少、独立工作增加；研究者警告这可能限制带教机会。",
  "GitHub Copilotを使う開発者18万7千人余りを分析した研究では、問題が起きたとき同僚に助言を求める代わりにCopilotに聞くようになり、管理業務が減って独立した作業が増え、研究者はこれがメンタリングの機会を狭めうると警告した。"]),
 s("D",[29,54,56,57],["업종별로 보면 '묻는 대화'가 가장 먼저 AI로 옮겨 가는 곳은 답이 비교적 분명한 코딩·고객 상담 같은 정보 업무이며, 개인의 질문 비용이 줄어드는 대신 공개 지식 공유와 동료 사이의 학습 기회가 줄어드는 형태로 대가가 나타난다.",
  "By industry, 'asking conversations' move to AI first in information work with relatively clear answers, such as coding and customer support; the individual's cost of asking falls, but the price shows up as less public knowledge-sharing and fewer chances to learn from colleagues.",
  "По отраслям «разговоры-вопросы» раньше всего уходят к ИИ в информационной работе с относительно ясными ответами — программировании и поддержке клиентов; личная цена вопроса снижается, но расплатой становится сокращение публичного обмена знаниями и возможностей учиться у коллег.",
  "按行业看，“提问式对话”最先转向AI的是答案相对明确的信息型工作，如编程和客服；个人的提问成本下降了，代价则表现为公开知识共享与同事间学习机会的减少。",
  "業種別に見ると、「聞く会話」が最初にAIへ移るのは、答えが比較的はっきりしたコーディングや顧客サポートのような情報業務であり、個人の質問コストが下がる代わりに、公開の知識共有と同僚から学ぶ機会が減るという形で代価が現れる。"],null,"M")
),
H(["③ 줄어드는 대화의 대가 — 외로움과 '숨기는 감정노동'","3. The price of fewer conversations — loneliness and the emotional labour of hiding","③ Цена исчезающих разговоров — одиночество и эмоциональный труд сокрытия","③ 对话减少的代价——孤独与“隐瞒型情绪劳动”","③ 減る会話の代価――孤独と「隠す感情労働」"]),
P(
 s("A",[55],["대만·인도네시아·미국·말레이시아 노동자 794명을 다룬 네 개 연구에서 업무상 AI와 상호작용이 많을수록 외로움이 커지고 퇴근 후 불면과 음주가 늘었으며, 동시에 동료를 돕는 행동도 늘어 '사람과 연결되고 싶은 욕구'가 커지는 양면이 확인되었다.",
  "Four studies covering 794 workers in Taiwan, Indonesia, the US and Malaysia found that the more employees interacted with AI at work, the lonelier they felt and the more insomnia and drinking they reported after work — yet they also helped colleagues more, revealing both sides of a growing need to connect with people.",
  "Четыре исследования 794 работников Тайваня, Индонезии, США и Малайзии показали: чем больше сотрудники взаимодействовали с ИИ на работе, тем сильнее было одиночество и тем больше бессонницы и алкоголя после работы, — но они же чаще помогали коллегам, что выявило обе стороны растущей потребности в связи с людьми.",
  "四项涉及台湾、印度尼西亚、美国和马来西亚794名员工的研究发现，工作中与AI互动越多，孤独感越强，下班后失眠和饮酒也越多；但与此同时帮助同事的行为也增加了，呈现出“想与人连接”的需求增强的两面。",
  "台湾・インドネシア・米国・マレーシアの労働者794人を扱った四つの研究では、仕事でAIとのやり取りが多いほど孤独感が強まり、退勤後の不眠と飲酒が増えた一方、同僚を助ける行動も増え、「人とつながりたい」欲求が高まる両面が確かめられた。"],
  ["생성형 AI 이전의 업무용 AI 시스템을 다루며 일부 결과는 상관관계다.","It concerns workplace AI systems from before generative AI, and some results are correlational.","Речь о рабочих ИИ-системах до генеративного ИИ; часть результатов корреляционная.","研究的是生成式AI之前的工作用AI系统，部分结果属相关关系。","生成AI以前の業務用AIシステムを扱い、一部の結果は相関関係である。"],"M"),
 s("B",[8,9,10,11,12,13],["갤럽 2025년 자료에서 전날 외로움을 많이 느낀 직장인은 중국 25%, 미국 19%, 영국 18%, 한국 15%, 독일 12%, 일본 11%로, 한국과 일본은 세계 평균(22%)과 동아시아 평균(23%)보다 낮았다.",
  "In Gallup's 2025 data, the share of employees who felt a lot of loneliness the previous day was 25% in China, 19% in the US, 18% in the UK, 15% in Korea, 12% in Germany and 11% in Japan — Korea and Japan below both the global (22%) and East Asian (23%) averages.",
  "По данным Gallup за 2025 год, доля работников, сильно испытывавших одиночество накануне, составила 25% в Китае, 19% в США, 18% в Великобритании, 15% в Корее, 12% в Германии и 11% в Японии; Корея и Япония ниже и мирового (22%), и восточноазиатского (23%) среднего.",
  "盖洛普2025年数据显示，前一天感到很孤独的员工比例为中国25%、美国19%、英国18%、韩国15%、德国12%、日本11%，韩国和日本低于全球平均（22%）和东亚平均（23%）。",
  "ギャラップの2025年データで、前日に強い孤独を感じた従業員は中国25%、米国19%、英国18%、韓国15%、ドイツ12%、日本11%で、韓国と日本は世界平均（22%）と東アジア平均（23%）を下回った。"]),
 s("D",[55,8,9],["한·일의 낮은 외로움 응답은 대면 중심 조직 문화의 완충일 수도, 감정 표현을 억제하는 응답 문화일 수도 있으며, AI가 동료와의 대화를 대신하기 시작할 때 이 수치가 어느 쪽으로 움직일지는 아직 관측되지 않았다.",
  "The low loneliness figures in Korea and Japan may reflect the buffer of face-to-face organisational cultures or a response culture that suppresses emotional expression; which way they will move once AI starts replacing conversations with colleagues has not yet been observed.",
  "Низкие показатели одиночества в Корее и Японии могут отражать буфер очной организационной культуры или культуру ответов, сдерживающую выражение эмоций; куда они сдвинутся, когда ИИ начнёт заменять разговоры с коллегами, пока не наблюдалось.",
  "韩日较低的孤独比例，可能反映了以面对面为主的组织文化的缓冲，也可能是抑制情绪表达的作答文化；当AI开始取代与同事的对话时，这一数字会朝哪个方向变化，目前尚无观测。",
  "韓日の低い孤独の回答は、対面中心の組織文化の緩衝かもしれないし、感情表現を抑える回答文化かもしれず、AIが同僚との会話を代わり始めたとき、この数値がどちらへ動くかはまだ観測されていない。"],null,"L"),
 s("A",[50],["4,400여 명이 참여한 네 개 실험에서 AI의 도움을 받은 사람은 다른 방식의 도움을 받은 사람보다 더 게으르고 덜 유능하며 덜 성실하다고 평가받았고, 당사자도 그렇게 평가받을 것이라고 예상했다.",
  "In four experiments with more than 4,400 participants, people who got help from AI were judged lazier, less competent and less diligent than those who got other kinds of help — and they themselves expected to be judged that way.",
  "В четырёх экспериментах с более чем 4400 участниками тех, кто получал помощь ИИ, считали более ленивыми, менее компетентными и менее старательными, чем получавших помощь иного рода, — и сами они ожидали такой оценки.",
  "在4,400余人参与的四项实验中，借助AI的人比获得其他形式帮助的人被评价为更懒惰、能力更差、更不勤勉，当事人自己也预料会得到这样的评价。",
  "4,400人余りが参加した四つの実験で、AIの助けを得た人は他の形の助けを得た人より怠惰で有能さに欠け、勤勉でないと評価され、本人もそう評価されると予想していた。"]),
 s("C",[48],["데스크 노동자 1만 7천여 명 조사에서 48%는 일상 업무에 AI를 쓴 사실을 상사에게 밝히기 불편하다고 답했고, 주된 이유는 '부정행위 같아서', '능력이 부족해 보일까 봐', '게을러 보일까 봐'였다.",
  "In a survey of more than 17,000 desk workers, 48% said they would be uncomfortable admitting to their manager that they used AI for common tasks, mainly because it felt like cheating or they feared looking less competent or lazy.",
  "В опросе более 17 000 офисных работников 48% сказали, что им было бы неловко признаться руководителю в использовании ИИ для обычных задач, — прежде всего потому, что это похоже на жульничество или они боятся показаться менее компетентными или ленивыми.",
  "在对1.7万余名办公室员工的调查中，48%表示向上司承认在日常工作中用了AI会感到不自在，主要原因是“感觉像作弊”“怕显得能力不足”“怕显得懒惰”。",
  "1万7千人余りのデスクワーカーの調査で、48%は日常業務にAIを使ったことを上司に打ち明けるのは抵抗があると答え、主な理由は「不正行為のように感じる」「能力不足と見られるおそれ」「怠惰に見られるおそれ」だった。"]),
 s("B",[49,43],["47개국 4만 8천여 명 조사에서는 직장인의 57%가 AI 사용을 숨기고 AI가 만든 결과물을 자기 것처럼 제출한다고 답했고, 한국 AI 이용자 조사에서도 직장인 응답자의 74.6%가 AI 결과물을 별도 언급 없이 직접 한 것처럼 제출·보고한 경험이 있었다.",
  "In a survey of more than 48,000 people in 47 countries, 57% of employees said they hide their use of AI and present AI-generated work as their own, and in the Korean AI-user survey 74.6% of employee respondents had submitted or reported AI output as their own work without mentioning AI.",
  "В опросе более 48 000 человек в 47 странах 57% работников ответили, что скрывают использование ИИ и выдают созданное им за своё, а в корейском опросе пользователей ИИ 74,6% респондентов-работников сдавали или докладывали результаты ИИ как собственную работу, не упоминая ИИ.",
  "在对47国4.8万余人的调查中，57%的员工表示会隐瞒使用AI并把AI生成的成果当作自己的提交；韩国AI用户调查中，74.6%的上班族受访者也有过不加说明地把AI成果当作自己完成的来提交或汇报的经历。",
  "47か国4万8千人余りの調査では従業員の57%がAI利用を隠し、AIが作った成果物を自分のものとして出していると答え、韓国のAI利用者調査でも会社員回答者の74.6%がAIの成果物をことわりなく自分でやったように提出・報告した経験があった。"],
  ["74.6%는 C급 커뮤니티 조사여서 크기보다 방향을 보는 용도다.","The 74.6% comes from a grade-C community survey and indicates direction rather than size.","74,6% — из опроса сообщества класса C и показывает направление, а не величину.","74.6%来自C级社区调查，用于看方向而非大小。","74.6%はC級のコミュニティ調査なので、大きさより方向を見るためのものである。"],"M"),
 s("D",[50,48,49,43],["결국 '물어볼 때의 감정노동'은 사라지기보다 모양을 바꾼다: 핀잔을 피해 AI에게 물은 사람은 이제 AI를 썼다는 사실이 드러날까 봐 관리하는 '숨기는 감정노동'을 떠안는다.",
  "In the end, the emotional labour of asking changes shape rather than disappearing: the person who asked AI to avoid a put-down now carries the emotional labour of hiding — managing the risk that their AI use will come to light.",
  "В итоге эмоциональный труд вопроса не исчезает, а меняет форму: тот, кто спросил ИИ, чтобы избежать упрёка, теперь несёт эмоциональный труд сокрытия — следит, чтобы не открылось, что он пользовался ИИ.",
  "归根结底，“提问时的情绪劳动”并未消失，而是换了形态：为躲开数落而问AI的人，如今要承担“隐瞒型情绪劳动”——提防自己用了AI的事被发现。",
  "結局、「聞くときの感情労働」は消えるのではなく形を変える。小言を避けてAIに聞いた人は、今度はAIを使ったことがばれないよう気を配る「隠す感情労働」を背負う。"],null,"H")
),
H(["④ AI는 감정의 대리 판단자·중재자가 될 수 있나","4. Can AI be an emotional proxy and mediator?","④ Может ли ИИ быть эмоциональным посредником и «судить за нас»?","④ AI能否成为情绪上的代理判断者与调解者？","④ AIは感情の代理判断者・仲介者になれるか"]),
P(
 s("A",[52],["AI 답장 추천을 쓰게 한 무작위 실험에서 대화는 빨라지고 긍정적 감정 표현이 늘었으며 서로를 더 가깝고 협조적으로 평가했지만, AI 답장을 쓴다고 의심받은 사람은 더 부정적으로 평가받았다.",
  "In randomised experiments with AI reply suggestions, conversations became faster, positive emotional language increased and partners rated each other as closer and more cooperative — but people suspected of using AI replies were evaluated more negatively.",
  "В рандомизированных экспериментах с подсказками ответов ИИ разговоры шли быстрее, позитивных эмоциональных выражений стало больше, а собеседники оценивали друг друга как более близких и склонных к сотрудничеству, — но тех, кого подозревали в использовании ответов ИИ, оценивали хуже.",
  "在使用AI回复建议的随机实验中，对话变快、正面情绪表达增多，双方也觉得彼此更亲近、更合作；但被怀疑使用AI回复的人得到的评价更负面。",
  "AIの返信候補を使わせたランダム化実験では、会話が速くなり前向きな感情表現が増え、互いをより親しく協力的だと評価したが、AIの返信を使っていると疑われた人はより否定的に評価された。"]),
 s("A",[53],["영국 참가자 5,734명이 참여한 숙의 실험에서 참가자들은 AI 중재자가 쓴 합의문을 사람 중재자가 쓴 것보다 선호했고, 더 유익하고 명확하며 덜 편향적이라고 평가했다.",
  "In deliberation experiments with 5,734 UK participants, people preferred group statements written by an AI mediator to those by human mediators, rating them more informative, clear and unbiased.",
  "В экспериментах по обсуждению с 5734 участниками из Великобритании люди предпочитали общие заявления, написанные ИИ-посредником, заявлениям посредников-людей и оценивали их как более информативные, ясные и непредвзятые.",
  "在有5,734名英国参与者的审议实验中，人们更喜欢AI调解员撰写的共识声明而非人类调解员所写，认为其更有信息量、更清晰、更不偏颇。",
  "英国の5,734人が参加した熟議実験では、参加者はAI仲介者が書いた合意文を人の仲介者が書いたものより好み、より有益で明確で偏りが少ないと評価した。"],
  ["정치 쟁점의 숙의 실험이므로 직장 갈등 중재로의 확장은 유추다.","It is a deliberation experiment on political issues, so extending it to workplace conflict is an analogy.","Это эксперимент по обсуждению политических вопросов, поэтому перенос на рабочие конфликты — аналогия.","这是政治议题的审议实验，推及职场冲突属类比。","政治的争点の熟議実験なので、職場の対立への拡張は類推である。"],"M"),
 s("C",[33],["고객 응대에서도 같은 원리가 쓰인다: 화난 고객의 음성 톤만 부드럽게 바꾸는 AI는 감정을 사람 대신 한 번 걸러 주는 '완충 중재자'다.",
  "The same principle is used in customer service: AI that softens only the tone of an angry customer's voice is a 'buffer mediator' that filters emotion once on the worker's behalf.",
  "Тот же принцип применяется в обслуживании клиентов: ИИ, смягчающий лишь тон голоса рассерженного клиента, — это «буферный посредник», который один раз фильтрует эмоции вместо работника.",
  "客户服务中也用到同样的原理：只把愤怒顾客的语气变柔和的AI，是替员工先过滤一遍情绪的“缓冲调解者”。",
  "顧客応対でも同じ原理が使われる。怒った顧客の声のトーンだけを和らげるAIは、感情を人の代わりに一度こしとる「緩衝の仲介者」である。"]),
 s("C",[44],["한국의 대화형 AI 이용자 1,000명 가운데 57.1%가 AI에게 개인적인 고민이나 감정을 털어놓은 적이 있었고, 20대는 67.6%로 가장 높았다.",
  "Among 1,000 conversational-AI users in Korea, 57.1% had told AI about personal worries or feelings, highest among people in their twenties (67.6%).",
  "Из 1000 пользователей диалогового ИИ в Корее 57,1% делились с ИИ личными переживаниями или чувствами; выше всего доля среди 20–29-летних (67,6%).",
  "在韩国1,000名对话式AI用户中，57.1%曾向AI倾诉个人烦恼或情感，20多岁人群最高，为67.6%。",
  "韓国の対話型AI利用者1,000人のうち57.1%がAIに個人的な悩みや気持ちを打ち明けたことがあり、20代が67.6%で最も高かった。"]),
 s("D",[51,52,53],["AI가 감정의 대리 판단자·중재자로 편안한 이유는 셋으로 정리된다: 평가하지 않는다(체면 보호), 감정을 한 번 걸러 준다(톤 완화), 서로의 말을 정리해 공통점을 찾는다(합의문 작성) — 다만 그 효과는 AI가 끼어들었다는 사실이 드러나는 순간 약해진다.",
  "AI is comfortable as an emotional proxy and mediator for three reasons: it does not judge (protecting face), it filters emotion once (softening tone), and it organises what each side says to find common ground (drafting statements) — though the effect weakens the moment AI's involvement becomes visible.",
  "ИИ удобен как эмоциональный посредник по трём причинам: он не оценивает (сохранение лица), один раз фильтрует эмоции (смягчение тона) и упорядочивает сказанное сторонами, находя общее (составление заявлений), — но эффект слабеет, как только участие ИИ становится заметным.",
  "AI之所以让人觉得适合充当情绪上的代理判断者与调解者，可归结为三点：不评判（保住面子）、先过滤一遍情绪（缓和语气）、整理各方说法找出共同点（起草共识）——但一旦AI的介入被察觉，这种效果就会减弱。",
  "AIが感情の代理判断者・仲介者として気楽な理由は三つにまとめられる。評価しない（体面を守る）、感情を一度こしとる（トーンを和らげる）、互いの言い分を整理して共通点を探す（合意文を書く）――ただしその効果は、AIが介在したことが見えた瞬間に弱まる。"],null,"M")
),
H(["⑤ 책이 말하는 것 — 대화, 숨은 노동, 그리고 '접근'의 문제","5. What the books argue — conversation, hidden labour and the question of access","⑤ Что говорят книги — разговор, скрытый труд и вопрос доступа","⑤ 书里怎么说——对话、隐形劳动与“准入”问题","⑤ 本が語ること――会話、見えない労働、そして「アクセス」の問題"]),
P(
 s("B",[59],["MIT의 셰리 터클은 『Reclaiming Conversation』(2015)에서 우리가 단순한 '연결'을 위해 '대화'를 희생했다고 진단하고, 얼굴을 맞댄 대화가 공감·우정·창의성을 기르며 일터의 생산성과 몰입에도 이롭다고 주장한다.",
  "MIT's Sherry Turkle, in Reclaiming Conversation (2015), diagnoses that we have sacrificed conversation for mere connection and argues that face-to-face talk builds empathy, friendship and creativity and is good for workplace productivity and engagement.",
  "Шерри Тёркл из MIT в книге «Reclaiming Conversation» (2015) констатирует, что мы пожертвовали разговором ради простой связи, и утверждает, что живой разговор развивает эмпатию, дружбу и творчество и полезен для продуктивности и вовлечённости на работе.",
  "麻省理工学院的雪莉·特克尔在《Reclaiming Conversation》（2015）中指出，我们为了单纯的“连接”牺牲了“对话”，并主张面对面交谈能培养共情、友谊和创造力，也有益于职场的生产力与投入。",
  "MITのシェリー・タークルは『Reclaiming Conversation』（2015）で、私たちは単なる「つながり」のために「会話」を犠牲にしたと診断し、顔を合わせた会話が共感・友情・創造性を育て、職場の生産性と没入にも役立つと主張する。"],
  ["스마트폰 시대를 다룬 책으로 생성형 AI 이전에 쓰였다.","The book addresses the smartphone era and predates generative AI.","Книга посвящена эпохе смартфонов и написана до генеративного ИИ.","该书针对智能手机时代，写于生成式AI之前。","スマートフォン時代を扱った本で、生成AI以前に書かれた。"],"M"),
 s("B",[60,58],["메리 그레이와 시다스 수리는 『Ghost Work』(2019)에서 자동화된 것처럼 보이는 디지털 서비스를 떠받치는 보이지 않는 사람의 노동을 드러냈는데, 조경숙이 6장에서 던지는 '기계의 윤리적 태도를 위해 희생되는 건 누구일까'라는 질문도 같은 구조를 겨눈다.",
  "Mary Gray and Siddharth Suri, in Ghost Work (2019), exposed the invisible human labour that props up apparently automated digital services; Cho Kyung-sook's question in Chapter 6 — who is sacrificed for the machine's ethical manners? — targets the same structure.",
  "Мэри Грей и Сиддхарт Сури в книге «Ghost Work» (2019) показали невидимый человеческий труд, на котором держатся будто бы автоматизированные цифровые сервисы; вопрос Чо Кёнсук в главе 6 — кем жертвуют ради этичного поведения машины? — нацелен на ту же структуру.",
  "玛丽·格雷与西达尔特·苏里在《Ghost Work》（2019）中揭示了支撑看似自动化的数字服务的隐形人力劳动；조경숙（Cho Kyung-sook）在第6章提出的“为了机器的伦理姿态，牺牲的是谁？”也指向同一结构。",
  "メアリー・グレイとシッダールト・スリは『Ghost Work』（2019）で、自動化されたように見えるデジタルサービスを支える見えない人間の労働を明らかにしたが、チョ・ギョンスクが第6章で投げかける「機械の倫理的態度のために犠牲になるのは誰か」という問いも同じ構造を狙っている。"]),
 s("C",[58],["조경숙의 책 출판사 서평은 '안전한 챗봇'이 혐오 표현을 걸러내는 데이터 레이블링에 동원된 제3세계 노동자와, 챗봇을 쓰며 상처받는 폭력·소수자성에 민감한 사람들의 희생 위에서 가능해진다는 점을 짚는다.",
  "The publisher's review of Cho's book points out that a 'safe chatbot' becomes possible on the backs of Global South workers mobilised for the data labelling that filters hate speech, and of people sensitive to violence and minority status who are hurt while using chatbots.",
  "Издательская аннотация к книге Чо подчёркивает, что «безопасный чат-бот» становится возможен ценой работников стран глобального Юга, привлечённых к разметке данных для фильтрации языка вражды, и людей, чувствительных к насилию и положению меньшинств, которых ранит общение с чат-ботами.",
  "该书的出版社书评指出，“安全的聊天机器人”之所以可能，是建立在被动员去做过滤仇恨言论的数据标注的第三世界劳动者，以及在使用聊天机器人时受到伤害、对暴力与少数群体处境敏感的人们的牺牲之上。",
  "同書の出版社の書評は、「安全なチャットボット」が、ヘイト表現をこしとるデータラベリングに動員された第三世界の労働者と、チャットボットを使って傷つく、暴力やマイノリティ性に敏感な人々の犠牲の上に成り立つことを指摘する。"]),
 s("D",[1,58,60],["혹실드의 감정노동 개념에 비추면 AI는 감정노동을 없애기보다 누가 그것을 떠맡는지를 바꾼다: 질문하는 사람의 민망함은 줄지만, 그 감정을 걸러내는 노동은 데이터 레이블러와 남은 상담원처럼 보이지 않는 곳으로 옮겨 간다.",
  "In the light of Hochschild's concept, AI changes who carries emotional labour rather than eliminating it: the asker's embarrassment shrinks, but the labour of filtering emotion moves somewhere less visible — to data labellers and to the human agents who remain.",
  "В свете концепции Хокшилд ИИ не устраняет эмоциональный труд, а меняет того, кто его несёт: неловкость спрашивающего уменьшается, но труд фильтрации эмоций уходит в менее заметные места — к разметчикам данных и оставшимся операторам-людям.",
  "对照霍克希尔德的情绪劳动概念，AI与其说消除了情绪劳动，不如说改变了由谁来承担：提问者的难为情减少了，但过滤情绪的劳动转移到了看不见的地方——数据标注员和留下来的人工客服。",
  "ホックシールドの感情労働の概念に照らせば、AIは感情労働をなくすより誰がそれを背負うかを変える。質問する人の気恥ずかしさは減るが、感情をこしとる労働はデータのラベラーや残った応対担当者のような見えにくい場所へ移る。"],null,"M"),
 s("D",[58,59,57],["세 권을 겹쳐 읽은 본 보고서의 판단은 이렇다: 'AI 사수'는 독성 말투가 쌓은 질문의 문턱을 낮추는 실질적 해방이지만, 조직이 이를 문화를 고치지 않아도 되는 핑계로 쓰면 신입이 사람에게 배우고 연결될 기회 — 책 제목이 말하는 '액세스' — 는 오히려 더 닫힐 수 있다.",
  "Reading the three books together, this report judges that the 'AI senior' is a real liberation that lowers the threshold for asking built up by toxic talk, but if organisations use it as an excuse not to fix their culture, newcomers' chances to learn from and connect with people — the 'access' of the book's title — may close even further.",
  "Сопоставив три книги, доклад приходит к выводу: «ИИ-наставник» — реальное освобождение, снижающее порог для вопросов, выстроенный токсичным тоном, но если организации используют его как повод не менять культуру, возможности новичков учиться у людей и устанавливать связи — тот самый «доступ» из названия книги — могут закрыться ещё сильнее.",
  "把三本书叠在一起读，本报告的判断是：“AI师傅”确实降低了毒舌文化筑起的提问门槛，是实实在在的解脱；但如果组织把它当作不必改变文化的借口，新人向人学习、与人建立联系的机会——即书名所说的“准入”——反而可能更加关闭。",
  "三冊を重ねて読んだ本報告の判断はこうだ。「AIの先輩」は毒舌が積み上げた質問の敷居を下げる実質的な解放だが、組織がこれを文化を直さなくてよい口実にすれば、新人が人から学び人とつながる機会――書名のいう「アクセス」――はかえって閉ざされうる。"],null,"M")
),
TB("peers"),
P(
 s("C",[45],["AI가 사람 사이의 대화를 '줄이기만' 하는 것은 아니다: 일·미 조사에서 미국은 생성형 AI가 상의의 문턱을 낮춰 사람에게 상의하는 빈도도 늘어나는 경향을 보였고, 일본은 약 70%가 '변화 없음'이었다.",
  "AI does not only reduce conversations between people: in the Japan–US survey, US workers tended to consult people more often as generative AI lowered the threshold for consulting, while about 70% in Japan reported no change.",
  "ИИ не только сокращает разговоры между людьми: в японско-американском опросе в США генеративный ИИ, снизив порог для обращения за советом, сопровождался тенденцией чаще советоваться и с людьми, а в Японии около 70% не заметили изменений.",
  "AI并非只会“减少”人与人之间的对话：在日美调查中，美国呈现出生成式AI降低商量门槛、找人商量的频率也随之增加的趋势，日本则约70%表示“没有变化”。",
  "AIは人どうしの会話を「減らす」だけではない。日米調査では、米国で生成AIが相談の敷居を下げ人への相談頻度も増える傾向が見られ、日本では約7割が「変わらない」だった。"]),
 s("D",[29,45,57],["따라서 관건은 AI가 사람 사이의 대화를 '대체'하느냐 '준비'시키느냐다: 기초 질문은 AI에게 묻고 맥락·판단·관계가 필요한 질문을 사람에게 가져가는 구조라면, 질문의 감정 비용은 줄고 사람 사이 대화의 질은 오히려 높아질 수 있다.",
  "The key question is therefore whether AI replaces conversations between people or prepares people for them: if basic questions go to AI and questions needing context, judgement or relationships go to people, the emotional cost of asking can fall while the quality of human conversation rises.",
  "Поэтому главный вопрос — заменяет ли ИИ разговоры между людьми или готовит к ним: если простые вопросы задаются ИИ, а вопросы, требующие контекста, суждения и отношений, — людям, эмоциональная цена вопроса может снизиться, а качество человеческих разговоров — даже вырасти.",
  "因此关键在于AI是“取代”还是“铺垫”人与人之间的对话：如果基础问题问AI，需要语境、判断和关系的问题再找人，那么提问的情绪成本会下降，人与人对话的质量反而可能提高。",
  "したがって鍵は、AIが人どうしの会話を「代替」するのか「準備」させるのかである。基本的な質問はAIに聞き、文脈・判断・関係が必要な質問を人に持っていく構造なら、質問の感情コストは下がり、人どうしの会話の質はむしろ高まりうる。"],null,"M"),
 s("D",[43,46,57,58],["한국처럼 위계와 눈치가 강한 일터일수록 'AI 사수'의 해방감이 크지만, 같은 이유로 조직이 사람 사수와 멘토링을 줄이는 핑계로 삼을 위험도 크다 — 해방이 고립으로 바뀌지 않으려면 '물어도 되는 문화'와 'AI에게 먼저 물어도 되는 규범'이 함께 필요하다.",
  "The stronger the hierarchy and social anxiety in a workplace, as in Korea, the greater the relief an 'AI senior' brings — and, for the same reason, the greater the risk that organisations use it as an excuse to cut human mentors and mentoring; for relief not to turn into isolation, a culture where asking is safe and a norm that asking AI first is acceptable are both needed.",
  "Чем сильнее иерархия и оглядка на других на работе, как в Корее, тем больше облегчение от «ИИ-наставника» — и по той же причине тем выше риск, что организации используют его как повод сократить наставников-людей и наставничество; чтобы облегчение не обернулось изоляцией, нужны и культура, где спрашивать безопасно, и норма, что сначала спросить ИИ — нормально.",
  "像韩国这样等级森严、讲究看脸色的职场，“AI师傅”带来的解脱感越大，但出于同样的原因，组织借此削减真人师傅和带教的风险也越大——要让解脱不变成孤立，既需要“可以放心提问的文化”，也需要“先问AI也无妨的规范”。",
  "韓国のように上下関係と気遣いが強い職場ほど「AIの先輩」の解放感は大きいが、同じ理由で組織が人の先輩やメンタリングを減らす口実にする危険も大きい――解放が孤立に変わらないためには、「聞いてもいい文化」と「先にAIに聞いてもいい規範」の両方が必要だ。"],null,"M")
)],
[P(
 s("C",[43],["한국 AI 이용자 조사에서 72.4%가 모르는 것을 사람보다 AI에게 묻는 게 편하다고 답했고, 이유는 합쳐서 65.5%가 정확성이 아니라 눈치·민망함·핀잔을 피하려는 것이었다.",
  "In a Korean AI-user survey, 72.4% said it is easier to ask AI than a person about things they don't know, and the reasons — 65.5% combined — were about avoiding others' moods, embarrassment and put-downs, not accuracy.",
  "В корейском опросе пользователей ИИ 72,4% ответили, что спрашивать о непонятном у ИИ проще, чем у человека, а причины — в сумме 65,5% — касались не точности, а желания избежать оглядки, неловкости и упрёков.",
  "韩国AI用户调查中，72.4%表示不懂的事问AI比问人更自在，理由合计65.5%是为了回避看脸色、难为情和挨数落，而非准确性。",

 ["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);i.oninput=()=>{mcOpt[k]=+i.value;$("#o-"+k).textContent=(+i.value).toFixed(2);};i.onchange=()=>rerun();});
 $$("#mcReg button").forEach(b=>b.onclick=()=>{mcOpt.region=b.dataset.r;rerun();});
 $("#mcRun").onclick=rerun;$("#mcSeed").onclick=()=>{mcOpt.seed=(Math.random()*1e9)|0;rerun();};$("#mcReset").onclick=()=>{mcOpt=Object.assign({region:mcOpt.region},DEFAULTS);rerun();};
 if(MC)paintMC();}

function paintMC(){if(!MC||!$("#mcBars"))return;const sc=["--s1","--s2","--s3","--s4"],nm=SCEN.map(s=>s.key+" "+T("scs")[s.key]);
 // bars
 {const W=420,rh=40,H=4*rh+24,l=128,X=v=>l+(W-l-50)*v;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-20}"/><text class="tm" x="${X(v)}" y="${H-6}" text-anchor="middle">${v*100}%</text>`);
  MC.mean.forEach((m,k)=>{const y=6+k*rh,c=MC.ci[k];s+=`<text class="tl" x="${l-8}" y="${y+18}" text-anchor="end">${esc(nm[k])}</text>
  <rect x="${X(c[2])}" y="${y+4}" width="${Math.max(2,X(c[3])-X(c[2]))}" height="20" rx="4" fill="var(${sc[k]})" opacity=".35"/><line x1="${X(c[0])}" x2="${X(c[1])}" y1="${y+14}" y2="${y+14}" stroke="var(${sc[k]})" stroke-width="2"/>
  <rect x="${X(m)-2}" y="${y}" width="4" height="28" rx="2" fill="var(${sc[k]})" data-tip="${esc(nm[k])}: <b>${pct(m)}</b><br>50%: ${pct(c[2])}–${pct(c[3])} · 90%: ${pct(c[0])}–${pct(c[1])}"/><text class="tv" x="${Math.min(X(c[1])+6,W-34)}" y="${y+19}">${pct(m)}</text>`;});
  $("#mcBars").innerHTML=s+`</svg>`;}
 // hist small multiples
 {let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;MC.mean.forEach((m,k)=>{const bins=new Array(10).fill(0);MC.probs.forEach(p=>bins[Math.min(9,Math.floor(p[k]*10))]++);const mx=Math.max(...bins);
  let s=`<svg viewBox="0 0 220 90" width="100%"><text class="tl" x="0" y="11">${esc(nm[k])}</text>`;bins.forEach((v,i)=>{const hh=60*v/mx;s+=`<rect x="${4+i*21}" y="${78-hh}" width="19" height="${Math.max(1,hh)}" rx="3" fill="var(${sc[k]})" data-tip="${i*10}–${i*10+10}%: ${(v/MC.probs.length*100).toFixed(1)}%"/>`;});
  s+=`<line class="ax" x1="2" x2="216" y1="78" y2="78"/><text class="tm" x="4" y="89">0%</text><text class="tm" x="214" y="89" text-anchor="end">100%</text></svg>`;h+=s;});$("#mcHist").innerHTML=h+`</div>`;}
 // scatter
 {const W=440,H=290,l=36,b=30,t=8,r=10,X=v=>l+(W-l-r)*v,Y=v=>t+(H-t-b)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,.25,.5,.75,1].forEach(v=>s+=`<text class="tm" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text><text class="tm" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  MC.pts.slice(0,1400).forEach(p=>s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6" fill="var(${sc[p[3]]})" opacity=".55"/>`);
  s+=`<line x1="${X(MC.opt.thA)}" x2="${X(MC.opt.thA)}" y1="${t}" y2="${H-b}" stroke="var(--text-2)" stroke-dasharray="4 3"/><line x1="${X(MC.opt.thA)}" x2="${W-r}" y1="${Y(MC.opt.thI)}" y2="${Y(MC.opt.thI)}" stroke="var(--text-2)" stroke-dasharray="4 3"/>
  <text class="tm" x="${X(.01)}" y="${Y(.97)}">S4 ← θA</text><text class="tm" x="${W-r-4}" y="${Y(MC.opt.thI)-6}" text-anchor="end">θI ↑ S1 · ↓ S2 (S3: L&lt;θL)</text>
  <text class="tl" x="${(l+W)/2}" y="${H}" text-anchor="middle">A 2035</text><text class="tl" transform="translate(10 ${H/2}) rotate(-90)" text-anchor="middle">I 2035</text></svg>`;
  $("#mcSc").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s;}
 // trace
 {const W=440,H=110,l=30;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const tc=["--s1","--s2","--s3","--s4"];const n=MC.traces[0].length;
  [.2,.4,.6].forEach(v=>s+=`<line class="grid" x1="${l}" x2="${W}" y1="${H-10-(H-20)*v}" y2="${H-10-(H-20)*v}"/><text class="tm" x="${l-4}" y="${H-6-(H-20)*v}" text-anchor="end">${v}</text>`);
  MC.traces.forEach((tr,c)=>{s+=`<polyline fill="none" stroke="var(${tc[c]})" stroke-width="1" opacity=".8" points="${tr.map((v,i)=>(l+(W-l)*i/n).toFixed(1)+","+(H-10-(H-20)*v).toFixed(1)).join(" ")}"/>`;});
  const bx=l+(W-l)*(4000/14000);s+=`<line x1="${bx}" x2="${bx}" y1="0" y2="${H-10}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="tm" x="${bx+4}" y="10">burn-in</text></svg>`;$("#mcTr").innerHTML=s;}
 const rh=Math.max(...MC.rhat);$("#mcDiag").innerHTML=`<span>${T("rhat")} <b class="${rh<1.05?"ok":"warn"}">${rh.toFixed(3)}</b></span><span>${T("acc")} <b>${(MC.acc*100).toFixed(0)}%</b></span><span>${T("draws")} <b>${MC.n.toLocaleString()}</b></span><span>${T("time")} <b>${(MC.ms||0).toFixed(0)}ms</b></span><span>seed <b>${MC.opt.seed}</b></span>`;
 // regions
 if(ALLREG){const W=440,rh=30,H=Object.keys(ALLREG).length*rh+6,l=60;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;Object.keys(ALLREG).forEach((r,i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+16}" text-anchor="end">${X(REGIONS[r])}</text>`;
  ALLREG[r].mean.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="22" rx="4" fill="var(${sc[k]})" data-tip="${X(REGIONS[r])} · ${esc(nm[k])}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+15}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
  $("#mcRegs").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s+`</svg>`;}
 // indicators
 {const reg=REGIONS[MC.region];$("#mcInd").innerHTML=`<div class="tblwrap"><table class="t"><thead><tr><th>${T("indAx")}</th><th>${T("indH")}</th><th>${T("indV")}</th><th>${T("indS")}</th><th>${T("indE")}</th></tr></thead><tbody>`+
  INDICATORS.map(d=>{const v=reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v;return `<tr><td>${d.ax}</td><td>${esc(d[st.lang]||d.en||d.ko)}</td><td>${v.toFixed(2)}${reg.ov[d.k]!==undefined?" *":""}</td><td>${d.s.toFixed(2)}</td><td>${refB(d.refs)}</td></tr>`}).join("")+
  `<tr><td>D</td><td>${esc(T("demoInd"))}</td><td>${reg.D.toFixed(2)}</td><td>—</td><td>${refB(DREFS)}</td></tr></tbody></table></div><div class="fsub" style="font-size:11.5px;color:var(--muted)">* ${esc(T("regAdj"))} · Prior: logit level ~ N(0,1.5); g_A ~ N(${MC.opt.ga},${MC.opt.gaSd}); g_I ~ N(${MC.opt.gi},0.08); g_L ~ N(${MC.opt.gl},0.05); κ=${MC.opt.kappa}; X₂₀₃₅ = σ(logit X₀ + 9·g + τ·ε)</div>`;
  $$("#mcInd .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}

// ---------- sensitivity analysis ----------
let SENS=null,SENSREG=null,sensBusy=false;
const SENS_P=[["ga",.05,"g_A"],["gi",.05,"g_I"],["gl",.03,"g_L"],["tau",.15,"τ"],["thA",.05,"θA"],["thL",.05,"θL"],["thI",.05,"θI"]];
function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}
function drawSens(){const el=$("#sensW");if(!el)return;const reg=(MC&&MC.region)||"global";
 if(!SENS||SENSREG!==reg){el.innerHTML=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensRun"))}</div>`;if(MCG)computeSens(reg,()=>drawSens());return;}
 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));
 const cell=x=>{const a=Math.round(Math.min(1,Math.abs(x)/mx)*70);return `<td class="cell" style="background:color-mix(in srgb,var(${x>=0?"--pos":"--neg"}) ${a}%,var(--surface));color:${a>45?"#fff":"var(--text)"}" data-tip="${x>=0?"+":""}${x.toFixed(1)} pp">${x>=0?"+":""}${x.toFixed(1)}</td>`;};
 let h=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensS"))} · ${esc(X(REGIONS[reg]))}</div><div class="tblwrap"><table class="t hm"><thead><tr><th>${esc(T("sensP"))}</th>${SCEN.map(s=>`<th style="text-align:center">Δ${s.key}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

// ---------- persona panel ----------
function pools(){const n=PERSONAS.length;const lin=[0,1,2,3].map(k=>PERSONAS.reduce((s,p)=>s+p.p[k],0)/n);
 let lg=[0,1,2,3].map(k=>Math.exp(PERSONAS.reduce((s,p)=>s+Math.log(p.p[k]),0)/n));const z=lg.reduce((a,b)=>a+b);lg=lg.map(x=>x/z);
 const kl=(p,q)=>p.reduce((s,x,i)=>s+(x>0?x*Math.log(x/q[i]):0),0);const js=PERSONAS.reduce((s,p)=>{const m=p.p.map((x,i)=>(x+lin[i])/2);return s+.5*kl(p.p,m)+.5*kl(lin,m);},0)/n;
 const mc=MCG?MCG.mean:[.25,.25,.25,.25];const bl=mc.map((x,i)=>(x+lin[i])/2);return{lin,lg,js,mc,bl};}

 let h=`<div class="wrow"><div class="panelc"><h5>${T("pHeat")}</h5><div class="tblwrap"><table class="t hm"><thead><tr><th>${T("persona")}</th>${SCEN.map(s=>`<th style="text-align:center">${s.key}</th>`).join("")}</tr></thead><tbody>`;
 PERSONAS.forEach((p,i)=>{h+=`<tr data-p="${i}" class="${i===selP?"sel":""}"><td class="pn">${esc(PL(p).n)}<div style="font-weight:400;font-size:11px;color:var(--muted)">${esc(PL(p).r)}</div></td>`+p.p.map((v,k)=>`<td class="cell" style="background:color-mix(in srgb,var(${sc[k]}) ${Math.round(v*100*1.3)}%,var(--surface));color:${v>.4?"#fff":"var(--text)"}" data-tip="${esc(PL(p).n)} · ${SCEN[k].key}: <b>${pct(v)}</b>">${pct(v)}</td>`).join("")+`</tr>`;});
 h+=`</tbody></table></div></div><div class="panelc"><h5>${T("pAgg")}</h5><div id="pAgg"></div><div class="persona-detail" id="pDet"></div></div></div>`;
 el.innerHTML=h;$$("#panelW tr[data-p]").forEach(tr=>tr.onclick=()=>{selP=+tr.dataset.p;drawPanel();});paintAgg();paintPDet();}

 const W=440,rh=34,l=150,H=rows.length*rh+6;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 rows.forEach(([n,v],i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+17}" text-anchor="end">${esc(n)}</text>`;v.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="24" rx="4" fill="var(${sc[k]})" data-tip="${esc(n)} · ${SCEN[k].key}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+16}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
 $("#pAgg").innerHTML=leg(SCEN.map((s,k)=>[`var(${sc[k]})`,s.key+" "+T("sc")[s.key]]))+s+`</svg><div class="diag" style="margin-top:4px"><span>${T("dis")} <b>${P.js.toFixed(3)}</b></span></div>`;}
function paintPDet(){const p=PERSONAS[selP],d=p[st.lang]||p.en;$("#pDet").innerHTML=`<b>${esc(d.n)}</b> <span class="rl">· ${esc(d.r)}</span>

 <div style="margin-top:6px;font-size:12px"><span class="g D" style="vertical-align:0">D</span> ${refB(p.refs)}</div>`;
 $$("#pDet .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}
