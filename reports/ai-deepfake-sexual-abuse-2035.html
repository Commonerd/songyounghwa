SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[1,5,3],["AI로 만든 성적 딥페이크는 더 이상 유명인만의 문제가 아니다: 호주·영국·미국 성인 7,230명 조사에서 7.0%가 AI 이미지 성적 학대를 겪었고, 2023년 10개국 조사(2.2%)보다 높은 수준이다.",
  "AI-made sexual deepfakes are no longer a celebrity problem: in a survey of 7,230 adults in Australia, the UK and the US, 7.0% had experienced AI-image sexual abuse — higher than the 2.2% found in a ten-country survey fielded in 2023.",
  "Сексуальные дипфейки, созданные ИИ, больше не проблема одних знаменитостей: в опросе 7230 взрослых в Австралии, Великобритании и США 7,0% столкнулись с сексуальным насилием с ИИ-изображениями — выше, чем 2,2% в опросе 10 стран 2023 года.",
  "AI制作的性深度伪造已不只是名人的问题：在澳大利亚、英国、美国7,230名成人的调查中，7.0%遭遇过AI图像性侵害，高于2023年十国调查的2.2%。",
  "AIで作られた性的ディープフェイクはもはや著名人だけの問題ではない。豪・英・米の成人7,230人の調査では7.0%がAI画像による性的虐待を経験しており、2023年の10か国調査（2.2%）より高い水準である。"],
  ["두 조사는 국가·문항·시점이 달라 직접 비교가 아니라 방향을 보는 판단이다.","The two surveys differ in countries, items and timing, so this is a judgement of direction, not a direct comparison.","Опросы различаются странами, вопросами и временем, поэтому это суждение о направлении, а не прямое сравнение.","两项调查的国家、题目和时间不同，这是方向判断而非直接比较。","二つの調査は国・設問・時期が異なるため、直接比較ではなく方向についての判断である。"],"M"),
 s("D",[7,9,11,8],["아동 피해 신호는 더 가파르다: 미국 NCMEC에 접수된 생성형 AI 관련 신고는 2023년 4,700건에서 2025년 40만 건 이상으로 늘었고(차일드라이트는 8,400% 증가로 발표), 영국 IWF가 판정한 AI 아동 성학대 영상은 13건에서 3,443건이 됐다. 다만 신고 급증의 상당 부분은 기업의 탐지 방식 변화에서 온다.",
  "Child-harm signals are steeper: generative-AI reports to the US NCMEC grew from 4,700 in 2023 to more than 400,000 in 2025 (announced by Childlight as an 8,400% rise), and AI child sexual abuse videos assessed by the UK's IWF went from 13 to 3,443. Much of the reporting surge, however, reflects changes in how companies detect.",
  "Сигналы о вреде детям круче: сообщения о генеративном ИИ в американский NCMEC выросли с 4700 в 2023 году до более чем 400 000 в 2025 году (Childlight объявил о росте на 8400%), а число ИИ-видео с насилием над детьми, оценённых британским IWF, — с 13 до 3443. Однако значительная часть всплеска отражает изменения в способах обнаружения у компаний.",
  "儿童受害信号更为陡峭：向美国NCMEC提交的生成式AI相关举报从2023年的4,700件增至2025年的40万件以上（Childlight宣布增长8,400%），英国IWF判定的AI儿童性虐待视频从13件增至3,443件。不过，举报激增的相当部分源于企业检测方式的变化。",
  "子どもの被害のシグナルはさらに急である。米国NCMECに寄せられた生成AI関連の通報は2023年の4,700件から2025年には40万件超に増え（チャイルドライトは8,400%増と発表）、英国IWFが判定したAIによる児童性的虐待動画は13件から3,443件になった。ただし通報急増のかなりの部分は企業の検知方法の変化による。"],null,"H"),
 s("D",[33,32,36,30],["한국은 가해자가 10대에 몰린 '학교형' 위기의 대표 사례다: 2024년 11월~2025년 10월 경찰이 검거한 딥페이크 성범죄 피의자 1,438명 중 61.8%가 10대였고, 합성·편집 피해자의 91.2%가 10~20대였다. 한국은 2024년 시청·소지까지 처벌하는 가장 넓은 형사법을 갖췄다.",
  "Korea is the leading case of a school-centred crisis with offenders concentrated among teenagers: of 1,438 deepfake sex-crime suspects arrested between November 2024 and October 2025, 61.8% were teenagers, and 91.2% of synthesis/editing victims were in their teens or twenties. In 2024 Korea adopted the broadest criminal law, reaching viewing and possession.",
  "Корея — главный пример «школьного» кризиса с подростками среди виновных: из 1438 подозреваемых в дипфейк-преступлениях, задержанных с ноября 2024 по октябрь 2025 года, 61,8% — подростки, а 91,2% жертв синтеза/монтажа — 10–29 лет. В 2024 году Корея приняла самый широкий уголовный закон — вплоть до просмотра и хранения.",
  "韩国是加害者集中于青少年的“校园型”危机的典型：2024年11月至2025年10月警方抓获的1,438名深度伪造性犯罪嫌疑人中61.8%为十几岁，合成·编辑受害者中91.2%为十几岁至二十几岁。韩国在2024年建立了连观看与持有都处罚的最宽泛刑法。",
  "韓国は加害者が10代に集中する「学校型」危機の代表例である。2024年11月〜2025年10月に警察が検挙したディープフェイク性犯罪の被疑者1,438人のうち61.8%が10代で、合成・編集被害者の91.2%が10〜20代だった。韓国は2024年に視聴・所持まで処罰する最も広い刑事法を整えた。"],null,"H"),
 s("D",[21,18,23],["위험은 '전용 앱'에서 '범용 AI'로 옮겨가고 있다: 2023년 누디파이 서비스 34곳이 한 달 2,400만 순방문자를 모았고, 2026년 1월에는 범용 챗봇 그록이 11일간 약 300만 장의 성적 이미지를 만든 것으로 추정됐다.",
  "The risk is moving from dedicated apps to mainstream AI: in 2023, 34 nudify services drew 24 million unique visitors in a month, and in January 2026 the mainstream chatbot Grok was estimated to have produced about 3 million sexualised images in 11 days.",
  "Риск смещается от специализированных приложений к массовому ИИ: в 2023 году 34 nudify-сервиса собрали 24 млн уникальных посетителей за месяц, а в январе 2026 года массовый чат-бот Grok, по оценке, создал около 3 млн сексуализированных изображений за 11 дней.",
  "风险正从“专用应用”转向“通用AI”：2023年34个脱衣服务一个月吸引2,400万独立访客；2026年1月，通用聊天机器人Grok估计在11天内生成约300万张性化图像。",
  "リスクは「専用アプリ」から「汎用AI」へ移りつつある。2023年にはヌーディファイ・サービス34か所が1か月で2,400万人のユニーク訪問者を集め、2026年1月には汎用チャットボットGrokが11日間で約300万枚の性的画像を作ったと推計された。"],null,"M"),
 s("D",[30,27,24,28,37],["나라별 대응은 네 갈래로 나뉜다: 한국(시청까지 처벌), 영국(제작 처벌+도구 금지 추진), 미국(48시간 삭제 의무), EU(공개 시 처벌, 2027년 전환) 그리고 직접 규율이 없는 일본이다. 처벌이 넓다고 삭제가 빨라지지는 않는다.",
  "National responses split four ways — Korea (punishing even viewing), the UK (punishing creation and moving to ban tools), the US (a 48-hour takedown duty) and the EU (punishing publication, transposed by 2027) — with Japan lacking direct regulation. Broader punishment does not by itself make removal faster.",
  "Ответы стран расходятся на четыре пути — Корея (наказание даже за просмотр), Великобритания (наказание за создание и запрет инструментов), США (48-часовое удаление), ЕС (наказание за обнародование, транспозиция к 2027 году), — а в Японии прямого регулирования нет. Широкое наказание само по себе не ускоряет удаление.",
  "各国应对分为四条路线——韩国（连观看都处罚）、英国（处罚制作并推进工具禁令）、美国（48小时删除义务）、欧盟（公开即处罚，2027年前转化）——日本则缺乏直接规范。处罚范围广并不意味着删除更快。",
  "各国の対応は四つに分かれる。韓国（視聴まで処罰）、英国（制作の処罰とツール禁止の推進）、米国（48時間削除義務）、EU（公開時に処罰、2027年までに国内法化）であり、日本には直接の規律がない。処罰が広いからといって削除が速くなるわけではない。"],null,"M"),
 s("D",[],["고정 시드 MCMC에서 2035년 글로벌 전망은 '일상화된 피해'(S3) {S3}, '불균등한 방어'(S2) {S2}, '통제된 피해'(S1) {S1}, '도구 억제'(S4) {S4}로, 세 시나리오가 비슷해 결과는 앞으로 10년의 선택에 달려 있다.",
  "In the fixed-seed MCMC, the global outlook for 2035 is normalised abuse (S3) {S3}, patchy defence (S2) {S2}, contained harm (S1) {S1} and tool containment (S4) {S4}: three scenarios are close, so the outcome depends on choices over the next decade.",
  "В MCMC с фиксированным зерном глобальный прогноз на 2035 год: обыденное насилие (S3) {S3}, неравномерная защита (S2) {S2}, сдерживаемый вред (S1) {S1}, сдерживание инструментов (S4) {S4}. Три сценария близки, поэтому исход зависит от решений следующего десятилетия.",
  "在固定种子的MCMC中，2035年全球展望为“常态化的伤害”（S3）{S3}、“不均衡的防御”（S2）{S2}、“受控的伤害”（S1）{S1}、“工具遏制”（S4）{S4}；三个情景接近，结果取决于未来十年的选择。",
  "固定シードのMCMCでは、2035年のグローバル見通しは「日常化した被害」（S3）{S3}、「不均等な防御」（S2）{S2}、「抑え込まれた被害」（S1）{S1}、「ツールの抑え込み」（S4）{S4}で、三つのシナリオが拮抗しているため、結果は今後10年の選択にかかっている。"],null,"M")
)],
[KJ(
 s("D",[1,3],["AI 성적 딥페이크 피해는 성인 7.0%(3개국)로, 유명인을 넘어 일반인의 위험이 됐다.","AI sexual-deepfake victimisation stands at 7.0% of adults (three countries): it has become a risk for ordinary people, not just celebrities.","Виктимизация сексуальными ИИ-дипфейками — 7,0% взрослых (три страны): это риск для обычных людей, а не только знаменитостей.","AI性深度伪造受害率为成人7.0%（三国），已从名人扩及普通人。","AI性的ディープフェイクの被害は成人の7.0%（3か国）で、著名人を超えて一般人のリスクになった。"]),
 s("D",[7,11,8],["아동 관련 AI 신고는 2년 새 4,700건→40만 건 이상으로 늘었지만, 신고 수는 탐지 관행에 크게 좌우된다.","AI-related child reports rose from 4,700 to over 400,000 in two years, though report counts depend heavily on detection practices.","Сообщения о детях, связанные с ИИ, за два года выросли с 4700 до более чем 400 000, хотя их число сильно зависит от практики обнаружения.","涉及儿童的AI举报两年内由4,700件增至40万件以上，但举报数高度取决于检测做法。","子どもに関するAI通報は2年で4,700件から40万件超に増えたが、通報数は検知慣行に大きく左右される。"]),
 s("D",[33,30],["한국은 가해자의 61.8%가 10대인 '학교형' 위기이며, 시청까지 처벌하는 가장 넓은 법을 갖췄다.","Korea faces a school-centred crisis with 61.8% of suspects teenagers, and has the broadest law, punishing even viewing.","В Корее «школьный» кризис (61,8% подозреваемых — подростки) и самый широкий закон, наказывающий даже за просмотр.","韩国是嫌疑人61.8%为青少年的“校园型”危机，并拥有连观看都处罚的最宽泛法律。","韓国は被疑者の61.8%が10代の「学校型」危機で、視聴まで処罰する最も広い法を備えた。"]),
 s("D",[],["2035년 전망은 S3 {S3}, S2 {S2}, S1 {S1}, S4 {S4}로 팽팽하다.","The 2035 outlook is finely balanced: S3 {S3}, S2 {S2}, S1 {S1}, S4 {S4}.","Прогноз на 2035 год сбалансирован: S3 {S3}, S2 {S2}, S1 {S1}, S4 {S4}.","2035年展望势均力敌：S3 {S3}、S2 {S2}、S1 {S1}、S4 {S4}。","2035年の見通しは拮抗している：S3 {S3}、S2 {S2}、S1 {S1}、S4 {S4}。"])

SEC("frame",["문제 정의와 분석 틀","Problem Definition and Analytical Framework","Постановка задачи и аналитическая рамка","问题界定与分析框架","問題の定義と分析枠組み"],
[P(
 s("D",[4,28],["이 보고서가 다루는 문제는 실존 인물의 얼굴·몸 사진을 AI로 변형해 동의 없이 성적인 이미지·영상을 만들고, 보관·공유·판매·협박에 쓰는 '이미지 기반 성적 학대'의 AI 버전이다.",
  "The problem addressed is the AI version of image-based sexual abuse: using AI to alter photos of a real person's face or body to create sexual images or video without consent, then keeping, sharing, selling or using them for threats.",
  "Предмет доклада — ИИ-версия сексуального насилия с использованием изображений: изменение фотографий лица или тела реального человека с помощью ИИ для создания сексуальных изображений или видео без согласия и их хранение, распространение, продажа или использование для угроз.",
  "本报告讨论的问题是“基于图像的性侵害”的AI版本：用AI篡改真实人物的面部或身体照片，未经同意制作性图像或视频，并用于保存、分享、出售或胁迫。",
  "本報告が扱うのは「画像を用いた性的虐待」のAI版、すなわち実在の人物の顔や体の写真をAIで改変し、同意なく性的な画像・動画を作り、保管・共有・販売・脅迫に使う行為である。"]),
 s("D",[],["핵심 질문은 셋이다: ① 피해는 실제로 얼마나, 누구에게 늘고 있는가, ② 나라마다 다른 법·플랫폼 규제는 피해를 줄이는가, ③ 2035년까지 어떤 조건이 '통제'와 '일상화'를 가르는가.",
  "There are three core questions: (1) how much, and for whom, is the harm actually growing; (2) do countries' differing laws and platform rules reduce it; (3) what conditions will separate containment from normalisation by 2035.",
  "Три ключевых вопроса: (1) насколько и для кого реально растёт вред; (2) снижают ли его различные законы и правила для платформ; (3) какие условия к 2035 году разделят сдерживание и обыденность.",
  "核心问题有三：①伤害实际增长了多少、落在谁身上；②各国不同的法律与平台监管能否减少伤害；③到2035年哪些条件将区分“受控”与“常态化”。",
  "中心的な問いは三つである。①被害は実際にどれだけ、誰に増えているのか、②国ごとに異なる法・プラットフォーム規制は被害を減らすのか、③2035年までにどの条件が「抑え込み」と「日常化」を分けるのか。"]),
 s("D",[6,8,1],["가장 큰 함정은 측정이다: 기업 신고 건수, 전문기관의 판정 건수, 경찰 검거 건수, 인구 대표 조사의 피해 경험률은 서로 다른 것을 재며, 특히 신고 건수는 기업이 무엇을 어떻게 탐지하느냐에 따라 크게 달라진다.",
  "The biggest trap is measurement: company report counts, specialist assessments, police arrests and population-survey victimisation rates measure different things, and report counts in particular swing with what companies detect and how.",
  "Главная ловушка — измерение: число сообщений компаний, оценки специализированных организаций, задержания полиции и доля пострадавших в репрезентативных опросах измеряют разное, а число сообщений особенно сильно зависит от того, что и как обнаруживают компании.",
  "最大的陷阱在于测量：企业举报数、专业机构判定数、警方抓获数与人口代表性调查的受害率衡量的是不同事物，尤其举报数会随企业检测什么、如何检测而大幅变化。",
  "最大の落とし穴は測定である。企業の通報件数、専門機関の判定件数、警察の検挙件数、人口代表調査の被害経験率は別々のものを測り、とくに通報件数は企業が何をどう検知するかで大きく変わる。"],null,"H"),
 s("D",[],["분석은 세 잠재 축으로 구성한다: A(성적 딥페이크를 만들 수 있는 AI 도구의 확산·용이성), I(제작·소지 처벌, 플랫폼 삭제 의무, 도구 금지 등 제도 대응), L(피해 지원·신속 삭제·학교 예방·신고 문화 같은 사회적 완충력)이며, 국경 간 집행 마찰 D가 제도의 성장을 깎는다.",
  "The analysis rests on three latent axes: A (diffusion and ease of AI tools able to make sexual deepfakes), I (institutional response — offences for creation and possession, platform takedown duties, tool bans) and L (social buffer — victim support, fast removal, school prevention, reporting culture), with cross-border enforcement friction D subtracting from institutional growth.",
  "Анализ строится на трёх латентных осях: A (распространение и доступность ИИ-инструментов для сексуальных дипфейков), I (институциональный ответ — наказание за создание и хранение, обязанность удаления, запрет инструментов) и L (социальный буфер — помощь жертвам, быстрое удаление, профилактика в школах, культура сообщений); трансграничное трение D снижает рост институтов.",
  "分析由三个潜在轴构成：A（能制作性深度伪造的AI工具的扩散与易用性）、I（处罚制作与持有、平台删除义务、工具禁令等制度应对）、L（受害支援、快速删除、学校预防、举报文化等社会缓冲力），跨境执法摩擦D会削弱制度的增长。",
  "分析は三つの潜在軸で構成する。A（性的ディープフェイクを作れるAIツールの普及・容易さ）、I（制作・所持の処罰、プラットフォームの削除義務、ツール禁止などの制度対応）、L（被害支援・迅速な削除・学校での予防・申告文化などの社会的緩衝力）であり、国境を越えた執行の摩擦Dが制度の伸びを削る。"]),
 s("D",[],["모든 문장에는 근거 등급(A~D)과 참조 근거 번호가 붙어 있으며, 언론·기업·시민단체 자료(C)는 방향 확인에만 쓰고 규모 판단에는 쓰지 않는다; 한국 경찰·정부 통계는 원문 보도자료를 열 수 없어 이를 전한 언론 보도(C)로 인용했다.",
  "Every sentence carries an evidence grade (A–D) and reference numbers; press, company and NGO material (C) is used only to confirm direction, not size. Korean police and government statistics are cited through the press reports relaying them (C), as the original releases could not be opened.",
  "Каждое предложение имеет класс (A–D) и номера источников; материалы прессы, компаний и НКО (C) служат лишь для подтверждения направления, а не масштаба. Статистика корейской полиции и правительства цитируется по пересказу в прессе (C), так как исходные релизы открыть не удалось.",
  "每句话都附有依据等级（A–D）与参考编号；媒体、企业和民间团体材料（C）仅用于确认方向，不用于判断规模。韩国警方与政府统计因无法打开原始新闻稿，经由转述报道（C）引用。",
  "すべての文に根拠等級（A〜D）と参照番号を付け、報道・企業・市民団体の資料（C）は方向の確認にのみ使い、規模の判断には使わない。韓国の警察・政府統計は原資料を開けなかったため、それを伝える報道（C）で引用した。"])
),CH("grades")],
[P(
 s("D",[4,28],["문제는 실존 인물의 사진을 AI로 변형해 동의 없이 성적 이미지를 만들고 쓰는 '이미지 기반 성적 학대'의 AI 버전이다.","The problem is the AI version of image-based sexual abuse: altering real people's photos with AI to make and use sexual images without consent.","Предмет — ИИ-версия сексуального насилия с изображениями: изменение фото реальных людей с помощью ИИ для создания и использования сексуальных изображений без согласия.","问题在于“基于图像的性侵害”的AI版本：用AI篡改真实人物照片，未经同意制作并使用性图像。","問題は「画像を用いた性的虐待」のAI版、すなわち実在の人物の写真をAIで改変し同意なく性的画像を作って使う行為である。"]),
 s("D",[6,8],["신고·판정·검거·조사 수치는 서로 다른 것을 재므로, 신고 급증을 피해 급증으로 직역하지 않는다.","Report, assessment, arrest and survey figures measure different things, so a surge in reports is not read directly as a surge in harm.","Сообщения, оценки, задержания и опросы измеряют разное, поэтому всплеск сообщений не читается напрямую как всплеск вреда.","举报、判定、抓获与调查数字衡量的是不同事物，因此不把举报激增直接解读为伤害激增。","通報・判定・検挙・調査の数値は別々のものを測るため、通報の急増を被害の急増とそのまま読まない。"])

SEC("scale",["현재 ①: 규모 — 신고는 폭증했지만 무엇이 늘었나","Current ①: Scale — Reports Have Exploded, but What Has Grown?","Сейчас ①: масштаб — сообщений взрывной рост, но что именно выросло?","现状①：规模——举报激增，但增长的是什么？","現在①：規模――通報は爆発的に増えたが、何が増えたのか"],
[P(
 s("B",[6,7],["미국 NCMEC가 생성형 AI 관련 신고를 따로 집계하기 시작한 2023년 4,700건이던 신고는 2024년 6만7천 건(1,325% 증가), 2025년 40만 건 이상으로 늘었다; 같은 기간 전체 신고는 3,620만 건에서 2,050만 건으로 오히려 줄었다.",
  "Generative-AI reports to the US NCMEC, tracked separately from 2023, rose from 4,700 that year to 67,000 in 2024 (up 1,325%) and more than 400,000 in 2025 — while total reports actually fell from 36.2 million to 20.5 million.",
  "Сообщения о генеративном ИИ в американский NCMEC, учитываемые отдельно с 2023 года, выросли с 4700 в том году до 67 000 в 2024 году (+1325%) и более 400 000 в 2025 году, тогда как общее число сообщений упало с 36,2 до 20,5 млн.",
  "美国NCMEC自2023年起单独统计的生成式AI相关举报，从当年4,700件增至2024年6.7万件（增长1,325%），2025年超过40万件；同期举报总数反而从3,620万件降至2,050万件。",
  "米国NCMECが2023年から別集計し始めた生成AI関連の通報は、同年の4,700件から2024年に6万7千件（1,325%増）、2025年に40万件超へ増えた。同じ期間に通報全体はむしろ3,620万件から2,050万件に減った。"]),
 s("C",[9,10],["에든버러대 차일드라이트는 2026년 11월 이 수치를 '2년 새 8,400% 증가'로 발표하며, 기술 매개 아동 성착취를 겪는 아동을 연간 3억 명 이상으로 추정했다.",
  "In November 2026 Childlight at the University of Edinburgh presented this as an 8,400% rise in two years, estimating that over 300 million children a year experience technology-facilitated sexual exploitation or abuse.",
  "В ноябре 2026 года Childlight (Эдинбургский университет) представил это как рост на 8400% за два года, оценив, что более 300 млн детей ежегодно подвергаются сексуальной эксплуатации с использованием технологий.",
  "爱丁堡大学Childlight于2026年11月将此发布为“两年增长8,400%”，并估计每年有3亿多名儿童遭受技术介导的性剥削或虐待。",
  "エディンバラ大学のチャイルドライトは2026年11月、この数値を「2年で8,400%増」と発表し、技術を介した性的搾取・虐待を受ける子どもを年3億人超と推計した。"]),
 s("B",[8,7],["그러나 스탠퍼드 인터넷·사회 센터는 2025년 상반기 '생성형 AI' 표시 신고 약 48만5천 건 가운데 최소 78%가 AI로 만든 아동 성착취물과 무관했고 상당수가 아마존의 학습 데이터 검사에서 나왔다고 지적했다; NCMEC 분류에서도 2025년 신고의 최대 유형은 '프롬프트 없이 기존 파일을 변형'(14만5천 건 이상)이다.",
  "Stanford's Center for Internet and Society, however, found that at least 78% of roughly 485,000 reports flagged “generative AI” in the first half of 2025 involved no AI-generated abuse material, many coming from Amazon's training-data scanning; in NCMEC's own breakdown the largest 2025 category is users altering existing files without prompts (145,000+).",
  "Однако Стэнфордский центр интернета и общества указал, что не менее 78% из примерно 485 000 сообщений с пометкой «генеративный ИИ» за первое полугодие 2025 года не содержали ИИ-материалов, а многие пришли от проверки обучающих данных Amazon; в классификации NCMEC крупнейшая категория 2025 года — изменение файлов без запросов (145 000+).",
  "但斯坦福互联网与社会中心指出，2025年上半年约48.5万件标注“生成式AI”的举报中至少78%与AI生成的儿童性剥削材料无关，许多来自亚马逊对训练数据的扫描；在NCMEC自己的分类中，2025年最大的类型是“无提示修改已有文件”（14.5万件以上）。",
  "しかしスタンフォード大学インターネットと社会センターは、2025年上半期に「生成AI」と表示された約48万5千件の通報のうち少なくとも78%はAI生成の児童性的虐待物と無関係で、多くがアマゾンの学習データ検査から出たと指摘した。NCMECの分類でも2025年の最大類型は「指示なしで既存ファイルを改変」（14万5千件超）である。"],null,"H"),
 s("B",[12,11],["전문 분석가가 직접 판정한 영국 IWF 자료는 더 보수적이지만 방향은 같다: 실제 아동 성학대로 판정된 AI 이미지·영상은 2025년 8,029건이고, AI 영상은 2024년 13건에서 3,443건으로 260배 넘게 늘었으며 그 65%가 가장 심각한 A등급이었다.",
  "The UK IWF's analyst-assessed data are more conservative but point the same way: 8,029 AI images and videos were judged realistic child sexual abuse in 2025, and AI videos rose more than 260-fold from 13 in 2024 to 3,443, 65% of them in the most severe Category A.",
  "Данные британского IWF, оценённые аналитиками, осторожнее, но указывают в ту же сторону: в 2025 году 8029 ИИ-изображений и видео признаны реалистичным насилием над детьми, а ИИ-видео выросли более чем в 260 раз — с 13 в 2024 году до 3443, 65% из них — самой тяжёлой категории A.",
  "由专业分析员直接判定的英国IWF数据更保守，但方向相同：2025年被判定为逼真儿童性虐待的AI图像和视频8,029件；AI视频从2024年的13件增至3,443件，超过260倍，其中65%为最严重的A类。",
  "専門分析者が直接判定した英国IWFのデータはより保守的だが方向は同じである。2025年に現実的な児童性的虐待と判定されたAI画像・動画は8,029件、AI動画は2024年の13件から3,443件へと260倍超に増え、その65%が最も深刻なA区分だった。"]),
 s("B",[13],["피해 아동 스스로의 신호도 늘었다: 영국 'Report Remove'에서 '조작된 이미지'라는 신고는 2025년 한 해 397건이었지만 2026년 상반기에만 420건이었다.",
  "Signals from children themselves are rising too: reports of faked imagery to the UK's Report Remove were 397 in all of 2025 but 420 in the first half of 2026 alone.",
  "Растут и сигналы от самих детей: сообщений о поддельных изображениях в британский Report Remove было 397 за весь 2025 год и 420 только за первое полугодие 2026 года.",
  "受害儿童本人的信号也在增加：英国“Report Remove”中称图像“被伪造”的举报2025年全年为397件，2026年上半年就达420件。",
  "被害児童自身のシグナルも増えている。英国「Report Remove」への「改変された画像」という申告は2025年通年で397件だったが、2026年上半期だけで420件に上った。"]),
 s("D",[6,8,11,13],["판단: 신고 건수의 '수십~수백 배' 증가는 과장일 가능성이 크지만, 직접 판정 자료와 아동 본인의 신고가 함께 늘고 있어 '실제 피해가 늘고 심각해지고 있다'는 결론은 견고하다.",
  "Judgement: increases of tens or hundreds of times in report counts are probably overstated, but because assessed material and children's own reports are rising together, the conclusion that real harm is growing and becoming more severe is robust.",
  "Вывод: рост числа сообщений в десятки и сотни раз, вероятно, преувеличен, но поскольку растут одновременно оценённые материалы и сообщения самих детей, вывод о реальном росте и утяжелении вреда устойчив.",
  "判断：举报数“几十到几百倍”的增长很可能被夸大，但由于直接判定数据和儿童本人的举报同时增加，“实际伤害在增加且更严重”这一结论是稳健的。",
  "判断：通報件数の「数十〜数百倍」の増加は誇張の可能性が高いが、直接判定のデータと子ども本人の申告がともに増えているため、「実際の被害が増え、深刻化している」という結論は堅い。"],null,"H")

 s("B",[7,12],["AI 관련 아동 신고는 4,700건(2023)→40만 건 이상(2025), IWF 판정 AI 영상은 13건→3,443건으로 늘었다.","AI-related child reports rose from 4,700 (2023) to over 400,000 (2025); IWF-assessed AI videos from 13 to 3,443.","Сообщения о детях с ИИ выросли с 4700 (2023) до более чем 400 000 (2025); ИИ-видео по оценке IWF — с 13 до 3443.","涉及儿童的AI举报从4,700件（2023）增至40万件以上（2025），IWF判定的AI视频从13件增至3,443件。","子どもに関するAI通報は4,700件（2023）→40万件超（2025）、IWF判定のAI動画は13件→3,443件に増えた。"]),
 s("D",[8,13],["신고 수치는 부풀려졌을 수 있지만, 판정 자료와 아동 본인의 신고가 함께 늘어 실제 피해 증가는 견고하다.","Report figures may be inflated, but assessed material and children's own reports are rising together, so real growth in harm is robust.","Число сообщений может быть завышено, но оценённые материалы и сообщения детей растут вместе, поэтому реальный рост вреда устойчив.","举报数字可能被夸大，但判定数据与儿童本人举报同时增加，实际伤害增长是稳健的。","通報数は膨らんでいる可能性があるが、判定データと子ども本人の申告がともに増えており、実際の被害増加は堅い。"])

SEC("victims",["현재 ②: 피해자 — 성인·아동·10대, 그리고 두 개의 성별 격차","Current ②: Victims — Adults, Children, Teenagers and Two Gender Gaps","Сейчас ②: жертвы — взрослые, дети, подростки и два гендерных разрыва","现状②：受害者——成人、儿童、青少年与两种性别差距","現在②：被害者――成人・子ども・10代、そして二つの性差"],
[P(
 s("A",[1],["호주·영국·미국 성인 7,230명(2024년 7~8월) 조사에서 15.1%가 디지털로 변조된 이미지가 얽힌 이미지 기반 성적 학대를, 7.0%가 AI 이미지에 의한 성적 학대를 겪었다고 답했다.",
  "In a survey of 7,230 adults in Australia, the UK and the US (July–August 2024), 15.1% reported image-based sexual abuse involving digitally altered images and 7.0% reported AI-image sexual abuse specifically.",
  "В опросе 7230 взрослых в Австралии, Великобритании и США (июль–август 2024) 15,1% сообщили о сексуальном насилии с изменёнными изображениями, а 7,0% — именно с ИИ-изображениями.",
  "在澳大利亚、英国、美国7,230名成人（2024年7–8月）的调查中，15.1%报告遭遇过涉及数字篡改图像的基于图像的性侵害，7.0%报告遭遇过AI图像性侵害。",
  "豪・英・米の成人7,230人（2024年7〜8月）の調査で、15.1%がデジタル改変画像を含む画像を用いた性的虐待を、7.0%がAI画像による性的虐待を経験したと答えた。"]),
 s("B",[5,1],["피해 경험률은 남성(10.2%)이 여성(3.8%)의 두 배를 넘었지만, 여성이 더 넓은 범위의 피해와 더 큰 정서·사회적 영향을 보고했고, 피해자의 약 87%가 하나 이상의 영향을 겪었다.",
  "Men reported victimisation at more than twice the rate of women (10.2% vs 3.8%), yet women reported a broader range of harms and greater emotional and social impact; almost 87% of victim-survivors reported at least one impact.",
  "Мужчины сообщали о виктимизации более чем вдвое чаще женщин (10,2% против 3,8%), но женщины указывали на более широкий спектр вреда и более сильные эмоциональные и социальные последствия; почти 87% пострадавших отметили хотя бы одно последствие.",
  "男性的受害率（10.2%）是女性（3.8%）的两倍多，但女性报告的伤害范围更广、情绪与社会影响更大；约87%的受害者至少经历了一种影响。",
  "被害経験率は男性（10.2%）が女性（3.8%）の2倍を超えたが、女性の方がより広い範囲の被害と大きな感情的・社会的影響を報告し、被害者の約87%が一つ以上の影響を受けた。"]),
 s("D",[11,19,26,5],["따라서 성별 격차는 두 개다: '누가 표적이 되느냐'는 조사마다 다르지만, 대량 유통되는 자료와 심각한 피해는 압도적으로 여성·여아에 쏠린다(IWF 판정 AI 이미지의 97%가 여아, 한 전용 사이트 성적 딥페이크의 96%가 여성).",
  "So there are two gender gaps: who gets targeted varies by survey, but mass-circulated material and severe harm fall overwhelmingly on women and girls (girls in 97% of IWF-assessed AI images; women in 96% of sexual deepfakes on one dedicated site).",
  "Поэтому гендерных разрывов два: кто становится мишенью, зависит от опроса, но массово распространяемые материалы и тяжёлый вред подавляюще приходятся на женщин и девочек (девочки — на 97% ИИ-изображений, оценённых IWF; женщины — на 96% сексуальных дипфейков одного специализированного сайта).",
  "因此存在两种性别差距：“谁成为目标”因调查而异，但大量流通的材料与严重伤害压倒性地集中在女性和女童身上（IWF判定的AI图像97%为女童；某专门网站性深度伪造的96%为女性）。",
  "したがって性差は二つある。「誰が標的になるか」は調査ごとに異なるが、大量に流通する素材と深刻な被害は圧倒的に女性・女児に偏る（IWF判定のAI画像の97%が女児、ある専用サイトの性的ディープフェイクの96%が女性）。"],null,"M"),
 s("B",[15,16],["미국 13~20세 1,200명 중 8명 중 1명이 피해자를 직접 알고, 17명 중 1명은 본인이 피해자였으며, 피해자의 34%만 부모에게 알렸다.",
  "Among 1,200 US young people aged 13–20, one in eight personally knew a victim, one in 17 had been targeted themselves, and only 34% of victims told a parent.",
  "Среди 1200 молодых американцев 13–20 лет каждый восьмой лично знал жертву, каждый 17-й сам стал мишенью, и лишь 34% жертв рассказали родителям.",
  "在1,200名美国13–20岁青少年中，每8人有1人认识受害者，每17人有1人本人是受害者，而只有34%的受害者告诉了父母。",
  "米国の13〜20歳1,200人のうち、8人に1人が被害者を直接知り、17人に1人が本人の被害者で、保護者に伝えた被害者は34%にとどまった。"]),
 s("B",[14],["유니세프·ECPAT·인터폴의 11개국 가구 조사에서는 지난 1년간 최소 120만 명의 아동이 성적 딥페이크 피해를 밝혔고, 일부 국가에서는 25명 중 1명, 한 학급에 1명꼴이었다.",
  "In UNICEF, ECPAT and INTERPOL household surveys across 11 countries, at least 1.2 million children disclosed sexual-deepfake victimisation in the past year — one in 25 in some countries, roughly one child per classroom.",
  "В опросах домохозяйств ЮНИСЕФ, ECPAT и Интерпола в 11 странах не менее 1,2 млн детей за последний год сообщили о сексуальных дипфейках — в некоторых странах каждый 25-й, примерно по ребёнку на класс.",
  "在联合国儿童基金会、ECPAT和国际刑警组织对11国的入户调查中，过去一年至少120万名儿童披露遭受性深度伪造，部分国家达每25人中1人，约每班1人。",
  "ユニセフ・ECPAT・インターポールの11か国の世帯調査では、過去1年に少なくとも120万人の子どもが性的ディープフェイク被害を明かし、一部の国では25人に1人、1クラスに1人の割合だった。"]),
 s("A",[4],["생성형 AI 이전의 영국·뉴질랜드·호주 연구는 이 학대가 다른 학대와 겹쳐 나타나고, 이동·의사소통 지원이 필요한 사람에게 불균형하게 집중된다는 점을 보여, 취약 집단의 위험이 평균보다 크다는 점을 시사한다.",

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNorm(r){let sp=null;return function(){if(sp!==null){const v=sp;sp=null;return v;}let u=0,v=0;while(u===0)u=r();v=r();const m=Math.sqrt(-2*Math.log(u));sp=m*Math.sin(2*Math.PI*v);return m*Math.cos(2*Math.PI*v);}}
const sig=x=>1/(1+Math.exp(-x)), logit=p=>Math.log(p/(1-p));

 const draws=[], traces=[[],[],[],[]]; let acc=0,tot=0;

 for(let c=0;c<chains;c++){
  let th=[N()*1.2,N()*1.2,N()*1.2,pm[3]+N()*.1,pm[4]+N()*.1,pm[5]+N()*.06], cur=lp(th); const cd=[];

 $("#mcRun").onclick=rerun;$("#mcSeed").onclick=()=>{mcOpt.seed=(Math.random()*1e9)|0;rerun();};$("#mcReset").onclick=()=>{mcOpt=Object.assign({region:mcOpt.region},DEFAULTS);rerun();};
 if(MC)paintMC();}

 // bars
 {const W=420,rh=40,H=4*rh+24,l=128,X=v=>l+(W-l-50)*v;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-20}"/><text class="tm" x="${X(v)}" y="${H-6}" text-anchor="middle">${v*100}%</text>`);

 {let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;MC.mean.forEach((m,k)=>{const bins=new Array(10).fill(0);MC.probs.forEach(p=>bins[Math.min(9,Math.floor(p[k]*10))]++);const mx=Math.max(...bins);

 // scatter
 {const W=440,H=290,l=36,b=30,t=8,r=10,X=v=>l+(W-l-r)*v,Y=v=>t+(H-t-b)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,.25,.5,.75,1].forEach(v=>s+=`<text class="tm" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text><text class="tm" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);

  $("#mcSc").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s;}
 // trace
 {const W=440,H=110,l=30;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const tc=["--s1","--s2","--s3","--s4"];const n=MC.traces[0].length;

  MC.traces.forEach((tr,c)=>{s+=`<polyline fill="none" stroke="var(${tc[c]})" stroke-width="1" opacity=".8" points="${tr.map((v,i)=>(l+(W-l)*i/n).toFixed(1)+","+(H-10-(H-20)*v).toFixed(1)).join(" ")}"/>`;});
  const bx=l+(W-l)*(4000/14000);s+=`<line x1="${bx}" x2="${bx}" y1="0" y2="${H-10}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="tm" x="${bx+4}" y="10">burn-in</text></svg>`;$("#mcTr").innerHTML=s;}
 const rh=Math.max(...MC.rhat);$("#mcDiag").innerHTML=`<span>${T("rhat")} <b class="${rh<1.05?"ok":"warn"}">${rh.toFixed(3)}</b></span><span>${T("acc")} <b>${(MC.acc*100).toFixed(0)}%</b></span><span>${T("draws")} <b>${MC.n.toLocaleString()}</b></span><span>${T("time")} <b>${(MC.ms||0).toFixed(0)}ms</b></span><span>seed <b>${MC.opt.seed}</b></span>`;
 // regions
 if(ALLREG){const W=440,rh=30,H=Object.keys(ALLREG).length*rh+6,l=60;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;Object.keys(ALLREG).forEach((r,i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+16}" text-anchor="end">${X(REGIONS[r])}</text>`;
  ALLREG[r].mean.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="22" rx="4" fill="var(${sc[k]})" data-tip="${X(REGIONS[r])} · ${esc(nm[k])}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+15}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
  $("#mcRegs").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s+`</svg>`;}

// ---------- sensitivity analysis ----------
let SENS=null,SENSREG=null,sensBusy=false;
const SENS_P=[["ga",.05,"g_A"],["gi",.05,"g_I"],["gl",.03,"g_L"],["tau",.15,"τ"],["thA",.05,"θA"],["thL",.05,"θL"],["thI",.05,"θI"]];
function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}
function drawSens(){const el=$("#sensW");if(!el)return;const reg=(MC&&MC.region)||"global";
 if(!SENS||SENSREG!==reg){el.innerHTML=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensRun"))}</div>`;if(MCG)computeSens(reg,()=>drawSens());return;}
 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));
 const cell=x=>{const a=Math.round(Math.min(1,Math.abs(x)/mx)*70);return `<td class="cell" style="background:color-mix(in srgb,var(${x>=0?"--pos":"--neg"}) ${a}%,var(--surface));color:${a>45?"#fff":"var(--text)"}" data-tip="${x>=0?"+":""}${x.toFixed(1)} pp">${x>=0?"+":""}${x.toFixed(1)}</td>`;};
 let h=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensS"))} · ${esc(X(REGIONS[reg]))}</div><div class="tblwrap"><table class="t hm"><thead><tr><th>${esc(T("sensP"))}</th>${SCEN.map(s=>`<th style="text-align:center">Δ${s.key}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

function pools(){const n=PERSONAS.length;const lin=[0,1,2,3].map(k=>PERSONAS.reduce((s,p)=>s+p.p[k],0)/n);
 let lg=[0,1,2,3].map(k=>Math.exp(PERSONAS.reduce((s,p)=>s+Math.log(p.p[k]),0)/n));const z=lg.reduce((a,b)=>a+b);lg=lg.map(x=>x/z);
 const kl=(p,q)=>p.reduce((s,x,i)=>s+(x>0?x*Math.log(x/q[i]):0),0);const js=PERSONAS.reduce((s,p)=>{const m=p.p.map((x,i)=>(x+lin[i])/2);return s+.5*kl(p.p,m)+.5*kl(lin,m);},0)/n;
 const mc=MCG?MCG.mean:[.25,.25,.25,.25];const bl=mc.map((x,i)=>(x+lin[i])/2);return{lin,lg,js,mc,bl};}

 h+=`</tbody></table></div></div><div class="panelc"><h5>${T("pAgg")}</h5><div id="pAgg"></div><div class="persona-detail" id="pDet"></div></div></div>`;

 $$("#pDet .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}
