<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 성적 딥페이크와 이미지 성착취 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}

/* mobile: keep panel tables and reference filters inside the viewport */
.panelc{min-width:0;overflow-x:auto}.reff .seg{flex-wrap:wrap}

/* evidence tables on narrow screens: scroll the table sideways instead of crushing CJK columns to one character */
.tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;max-width:15em}
@media (max-width:760px){
 .tblwrap table.t:has(tr.sent){width:auto;min-width:100%}
 .tblwrap table.t:has(tr.sent) td,.tblwrap table.t:has(tr.sent) th{min-width:8.5em}
 .tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;min-width:6.5em;max-width:10em}

<script>
// ===== Core helpers (data authoring format) =====
// Text arrays are always in the order [ko, en, ru, zh, ja].
// grade: A/B/C = strongest evidence class behind a sentence; D = Claude's analytic inference (sentences only)
// type codes: q1 = Q1 peer-reviewed paper, stat = official statistics, io = international org / government / public research report,
//             survey = methodologically disclosed survey, press = news report, ind = industry/company data
const LANGS=["ko","en","ru","zh","ja"];
function tx(o,lang){if(!o)return "";if(typeof o==="string")return o;return o[lang]??o.en??o.ko??"";}
const L5=a=>{if(!a)return null;if(!Array.isArray(a))return a;const o={};LANGS.forEach((l,i)=>o[l]=a[i]);return o;};
// sentence: s(grade, refs, [ko,en,ru,zh,ja], note[5]?, conf?)  conf: "H" | "M" | "L"
const s=(g,refs,t,note,conf)=>({g:g,refs:refs||[],t:L5(t),note:note?L5(note):null,conf:conf||null});
const P=(...x)=>({p:x}), KJ=(...x)=>({kj:x}), H=t=>({h:L5(t)}), CH=c=>({chart:c}), TB=k=>({table:k}), SCN={scen:1}, W=w=>({widget:w}), REFL={reflist:1};
const EVIDENCE=[];
function E(id,grade,type,year,src,title,url,quote,crit,judg){const e={id,grade,type,year,src,title,url,quote};LANGS.forEach((l,i)=>e[l]={crit:crit[i],judg:judg[i]});EVIDENCE.push(e);}
const SECTIONS=[];
function SEC(id,t,detail,concise){SECTIONS.push({id:id,t:L5(t),detail:detail,concise:concise});}
// evidence behind the cross-border enforcement friction term D in the MCMC indicator table
const DREFS=[39,23,8];

// ===== Evidence 1–20: prevalence studies, child-abuse reporting data, youth surveys, the nudify industry =====
E(1,"A","q1",2026,"Nicola Henry, Rebecca Umbach, Renee Shelby & Kwynn Gonzalez-Pons, International Journal of Human-Computer Interaction (2026)","“That Experience Still Haunts Me to This Day”: A Multi-Country Survey of AI-Image based Sexual Abuse Victimization","https://research.google/pubs/that-experience-still-haunts-me-to-this-day-a-multi-country-survey-of-ai-image-based-sexual-abuse-victimization/",
"Overall, 15.1% of respondents reported experiences of IBSA involving digitally altered images",
["호주·영국·미국 성인 7,230명(2024년 7~8월)을 조사한 동료심사 논문으로, 디지털 변조 이미지 피해 15.1%, AI 이미지 성적 학대 피해 7.0%를 보고한다. 온라인 패널 자기보고라 본인이 모르는 피해는 빠지고, 연구비를 구글이 지원했다는 점도 공개돼 있다.",
 "A peer-reviewed survey of 7,230 adults in Australia, the UK and the US (July–August 2024) reporting 15.1% victimisation by digitally altered images and 7.0% by AI-image sexual abuse. It relies on self-report in online panels, so abuse victims never learn of is missed, and its Google funding is disclosed.",
 "Рецензируемый опрос 7230 взрослых в Австралии, Великобритании и США (июль–август 2024): 15,1% пострадали от изменённых изображений, 7,0% — именно от сексуального насилия с ИИ-изображениями. Это самоотчёт онлайн-панелей, поэтому неизвестное жертвам насилие не учтено; финансирование Google раскрыто.",
 "这篇同行评审论文调查了澳大利亚、英国、美国7,230名成人（2024年7–8月），报告15.1%遭遇过数字篡改图像的侵害，7.0%遭遇过AI图像性侵害。它依赖在线样本的自我报告，受害者本人不知情的侵害无法计入，且已披露由谷歌资助。",
 "豪・英・米の成人7,230人（2024年7〜8月）を調べた査読論文で、デジタル改変画像による被害15.1%、AI画像による性的虐待の被害7.0%を報告する。オンラインパネルの自己申告のため本人が知らない被害は漏れ、グーグルの資金提供も開示されている。"],
["성인 피해 규모의 가장 강한 근거로 쓰되, '최소 추정치'로 읽는다.",
 "Used as the strongest evidence on adult prevalence, read as a lower-bound estimate.",
 "Используется как самое сильное свидетельство о распространённости среди взрослых — как нижняя оценка.",
 "作为成人受害规模最有力的依据使用，但视为“下限估计”。",
 "成人の被害規模を示す最も強い根拠として使い、「下限の推計」として読む。"]);

E(2,"A","q1",2026,"Lisa Given, Nicola Henry, Gemma Beard, Rebecca Umbach & Renee Shelby, Information, Communication & Society (2026)","‘It’s still abuse’: Community attitudes and perceptions on AI-generated image-based sexual abuse","https://research.google/pubs/its-still-abuse-community-attitudes-and-perceptions-on-ai-generated-image-based-sexual-abuse/",
"Our findings reveal strong condemnation of AI-IBSA, yet respondents demonstrated low familiarity",
["같은 3개국 7,231명 자료로 태도를 분석했다. 사회적 비난은 강하지만 기술에 대한 이해는 낮다는 결과로, 응답 문항이 가상 상황이어서 실제 행동과 다를 수 있다.",
 "Analyses attitudes in the same three-country dataset (7,231 respondents): condemnation is strong but familiarity with the technology is low. Items are hypothetical vignettes, so stated attitudes may diverge from behaviour.",
 "Анализ установок на тех же данных трёх стран (7231 респондент): осуждение сильное, но знакомство с технологией слабое. Вопросы построены на гипотетических ситуациях, поэтому заявленные установки могут расходиться с поведением.",
 "利用同一三国数据（7,231人）分析态度：谴责强烈，但对技术的了解很低。题目为假设情境，所述态度可能与实际行为不同。",
 "同じ3か国7,231人のデータで態度を分析した。強い非難がある一方で技術への理解は低い。設問は仮想場面なので、表明された態度が実際の行動と異なりうる。"],
["'규범은 이미 형성됐고, 부족한 것은 인식과 대응 수단'이라는 판단의 근거로 쓴다.",
 "Supports the judgement that the norm already exists and what is missing is awareness and means of response.",
 "Подкрепляет вывод: норма уже сложилась, не хватает осведомлённости и средств реагирования.",
 "支撑“规范已形成，缺的是认知与应对手段”这一判断。",
 "「規範はすでにでき、足りないのは認識と対応手段」という判断の根拠とする。"]);

E(3,"B","q1",2024,"Rebecca Umbach, Nicola Henry, Gemma Beard & Colleen Berryessa, CHI ’24 (arXiv:2402.01721)","Non-Consensual Synthetic Intimate Imagery: Prevalence, Attitudes, and Knowledge in 10 Countries","https://arxiv.org/abs/2402.01721",
"Respondents from countries with specific legislation still reported perpetration and victimization experiences",
["한국을 포함한 10개국 1만6천여 명을 조사한 유일한 대규모 다국가 비교로, 피해 2.2%·가해 1.8%를 보고한다. 학회 논문(사전공개본)이고 2023년 조사라 생성형 이미지 도구가 대중화되기 직전의 수준을 보여준다.",
 "The only large multi-country comparison (over 16,000 respondents in 10 countries, including South Korea), reporting 2.2% victimisation and 1.8% perpetration. It is a conference paper (preprint) and its fieldwork predates the mass spread of generative image tools.",
 "Единственное крупное сравнение многих стран (более 16 000 респондентов в 10 странах, включая Южную Корею): 2,2% жертв и 1,8% совершивших. Это доклад конференции (препринт), и опрос проведён до массового распространения генеративных инструментов.",
 "这是唯一的大规模多国比较（含韩国在内10国1.6万余人），报告受害2.2%、加害1.8%。属会议论文（预印本），调查早于生成式图像工具的普及。",
 "韓国を含む10か国1万6千人余りを調べた唯一の大規模多国比較で、被害2.2%・加害1.8%を報告する。学会論文（プレプリント）で、生成画像ツールが大衆化する直前の水準を示す。"],
["'법만으로는 억제되지 않는다'는 판단과 국가 간 비교의 출발점으로 쓴다.",
 "Used as the starting point for cross-country comparison and for the judgement that law alone does not deter.",
 "Используется как отправная точка межстранового сравнения и вывода о том, что один закон не сдерживает.",
 "作为国际比较的起点，以及“仅靠法律无法遏制”判断的依据。",
 "国際比較の出発点と、「法だけでは抑止できない」という判断の根拠とする。"]);

E(4,"A","q1",2022,"Asher Flynn, Anastasia Powell, Adrian J. Scott & Elena Cama, British Journal of Criminology 62(6): 1341–1358 (2022)","Deepfakes and Digitally Altered Imagery Abuse: A Cross-Country Exploration of an Emerging form of Image-Based Sexual Abuse","https://ideas.repec.org/a/oup/crimin/v62y2022i6p1341-1358..html",
"This abuse involves poly-victimization and poly-perpetration",
["영국·뉴질랜드·호주의 혼합방법 연구로, 피해가 다른 학대와 겹쳐 나타나고 이동·의사소통 지원이 필요한 사람에게 더 많이 발생한다고 보고한다. 생성형 AI 이전 자료라 규모 추정에는 쓰지 않는다.",
 "A multi-method study in the UK, New Zealand and Australia finding that this abuse overlaps with other abuse and falls disproportionately on people with mobility or communication assistance needs. It predates generative AI, so it is not used for scale.",
 "Смешанное исследование в Великобритании, Новой Зеландии и Австралии: такое насилие сочетается с другими формами и непропорционально затрагивает людей, нуждающихся в помощи с передвижением или общением. Данные до генеративного ИИ, поэтому для оценки масштаба не используются.",
 "这项英国、新西兰、澳大利亚的混合方法研究发现，此类侵害与其他虐待交织，并更多发生在需要行动或沟通辅助的人身上。数据早于生成式AI，故不用于规模估计。",
 "英国・ニュージーランド・豪州の混合研究法による研究で、被害が他の虐待と重なって現れ、移動・意思疎通の支援を要する人により多く生じると報告する。生成AI以前のデータなので規模の推計には使わない。"],
["취약 집단에 대한 보호 설계가 필요하다는 판단의 근거로 쓴다.",
 "Supports the judgement that protection must be designed for vulnerable groups.",
 "Подкрепляет вывод о необходимости защиты, рассчитанной на уязвимые группы.",
 "支撑“需要为弱势群体设计保护”的判断。",
 "脆弱な集団に向けた保護設計が必要だという判断の根拠とする。"]);

E(5,"B","survey",2026,"RMIT University (news release on Henry et al.), 4 November 2026","One in 15 adults has experienced AI-generated image-based abuse, study finds","https://www.rmit.edu.au/news/all-news/2026/nov/image-based-abuse",
"The true scale may be even greater because some people may never know",
["근거 1의 대학 보도자료로, 성별(남 10.2%, 여 3.8%)·국가(호주 7.7%)·피해 영향(약 87%)을 추가로 제시한다. 연구진 자신의 요약이므로 원 논문과 함께 읽어야 한다.",
 "The university's release on evidence 1, adding figures by sex (men 10.2%, women 3.8%), by country (Australia 7.7%) and on impact (almost 87%). It is the researchers' own summary and should be read alongside the paper.",
 "Пресс-релиз университета о свидетельстве 1 с дополнительными цифрами по полу (мужчины 10,2%, женщины 3,8%), стране (Австралия 7,7%) и последствиям (почти 87%). Это резюме самих авторов, читать вместе со статьёй.",
 "这是关于依据1的大学新闻稿，补充了按性别（男10.2%、女3.8%）、国家（澳大利亚7.7%）和影响（近87%）的数字。属研究者自己的摘要，应与原论文对照阅读。",
 "根拠1に関する大学の発表資料で、性別（男性10.2%、女性3.8%）・国（豪州7.7%）・影響（約87%）の数値を補う。研究者自身の要約なので原論文と併せて読む。"],
["남성 피해율이 높지만 여성의 피해 영향이 더 넓다는 '두 개의 성별 격차'를 설명하는 데 쓴다.",
 "Used to explain the two gender gaps: men report more victimisation, women broader harm.",
 "Используется для объяснения «двух гендерных разрывов»: мужчины чаще сообщают о насилии, женщины — о более широком вреде.",
 "用于说明“两种性别差距”：男性报告的受害率更高，女性的伤害更广。",
 "男性の被害率が高い一方、女性の被害影響がより広いという「二つの性差」の説明に使う。"]);

E(6,"B","io",2025,"National Center for Missing & Exploited Children (NCMEC), Emma Henderson Vaughan, 2025","NCMEC Releases New Data: 2024 in Numbers","https://www.missingkids.org/blog/2025/ncmec-releases-new-data-2024-in-numbers",
"In 2024 alone, NCMEC saw a 1,325% increase in CyberTipline reports that involved",
["미국 법정 신고센터의 연간 집계로, 생성형 AI 관련 신고가 1,325% 늘었고 전체 신고는 3,620만 건에서 2,050만 건으로 줄었다. 신고 수는 기업의 탐지·신고 관행에 좌우되므로 실제 발생량과 같지 않다.",
 "Annual figures from the US statutory reporting centre: generative-AI-related reports rose 1,325% while total reports fell from 36.2 million to 20.5 million. Report counts depend on companies' detection and reporting practices, not just on underlying abuse.",
 "Годовые данные американского уполномоченного центра: сообщения, связанные с генеративным ИИ, выросли на 1325%, а общее число сообщений упало с 36,2 до 20,5 млн. Число сообщений зависит от практики обнаружения у компаний, а не только от реального насилия.",
 "美国法定举报中心的年度统计：与生成式AI相关的举报增加1,325%，而举报总数从3,620万降至2,050万。举报数取决于企业的检测与举报做法，并不等同于实际发生量。",
 "米国の法定通報センターの年次集計で、生成AI関連の通報は1,325%増え、通報全体は3,620万件から2,050万件に減った。通報数は企業の検知・通報慣行に左右され、実際の発生量とは一致しない。"],
["증가의 '방향'은 확실하지만 '크기'는 신고 체계 변화와 분리해 읽는다.",
 "The direction of growth is certain; its size must be separated from changes in the reporting system.",
 "Направление роста несомненно, а его величину нужно отделять от изменений системы сообщений.",
 "增长“方向”确定，但“幅度”需与举报体系的变化分开解读。",
 "増加の「方向」は確かだが、「大きさ」は通報制度の変化と切り分けて読む。"]);

E(7,"B","io",2026,"National Center for Missing & Exploited Children (NCMEC)","Generative AI (GAI)","https://www.ncmec.org/GAI",
"NCMEC began tracking GAI-related reports submitted to the CyberTipline in January 2023",
["생성형 AI 관련 신고 4,700건(2023)→6만7천 건(2024)→40만 건 이상(2025)과, 2025년 신고 중 '기존 파일을 프롬프트 없이 변형' 14만5천여 건 등 유형을 제시한다. 2023~2025년에 AI 생성물로 제출된 이미지·영상은 15만8천여 건, 확인된 직접 피해 아동은 275명 이상이다.",
 "Gives generative-AI reports of 4,700 (2023), 67,000 (2024) and more than 400,000 (2025), with 2025 types such as 145,000+ reports of users altering a file without text prompts. Over 158,000 images and videos were submitted as AI-generated in 2023–2025, and more than 275 direct victims were identified.",
 "Приводит число сообщений с генеративным ИИ: 4700 (2023), 67 000 (2024), более 400 000 (2025), и типы за 2025 год, например 145 000+ случаев изменения файла без текстового запроса. За 2023–2025 годы как ИИ-материал подано более 158 000 изображений и видео, выявлено более 275 прямых жертв.",
 "给出生成式AI相关举报：4,700件（2023）→6.7万件（2024）→40万件以上（2025），以及2025年的类型，如“无文字提示修改已有文件”14.5万余件。2023–2025年作为AI生成物提交的图像和视频超过15.8万件，确认的直接受害儿童超过275人。",
 "生成AI関連の通報4,700件（2023）→6万7千件（2024）→40万件超（2025）と、2025年の類型（テキスト指示なしで既存ファイルを改変した利用者14万5千件超など）を示す。2023〜2025年にAI生成物として提出された画像・動画は15万8千件超、特定された直接の被害児童は275人超である。"],
["'40만 건'은 AI가 관여한 신고의 총량이고, 확인된 AI 아동 성착취물 수가 아님을 분명히 하는 근거로 쓴다.",
 "Used to make clear that “400,000” is the total of AI-linked reports, not a count of confirmed AI child abuse images.",
 "Используется, чтобы подчеркнуть: «400 000» — это все сообщения с участием ИИ, а не число подтверждённых ИИ-материалов.",
 "用于明确“40万件”是涉及AI的举报总数，而非已确认的AI儿童性剥削材料数量。",
 "「40万件」はAIが関与した通報の総数であり、確認されたAIによる児童性的虐待物の数ではないことを明確にする根拠とする。"]);

E(8,"B","io",2026,"Riana Pfefferkorn, Stanford Center for Internet and Society, 29 January 2026","Letter to NCMEC about AI-CSAM Report Statistics","https://cyberlaw.stanford.edu/letter-to-ncmec-about-ai-csam-report-statistics",
"at least 78% did not involve any AI-generated CSAM at all.",
["2025년 상반기 '생성형 AI' 표시 신고 약 48만5천 건 중 대부분이 아마존의 학습데이터 검사에서 나왔고, 최소 78%는 AI 생성 아동 성착취물이 아니었다고 지적한다. 연구자 서한이지만 통계 해석의 핵심 경고다.",
 "Points out that most of the roughly 485,000 “generative AI” reports in the first half of 2025 came from Amazon's training-data scanning, and that at least 78% involved no AI-generated abuse material. A researcher's letter, but a key warning on interpreting the statistics.",
 "Указывает, что большинство из примерно 485 000 сообщений с пометкой «генеративный ИИ» за первое полугодие 2025 года пришли от проверки обучающих данных Amazon и не менее 78% не содержали ИИ-материалов. Это письмо исследователя, но ключевое предупреждение о трактовке статистики.",
 "指出2025年上半年约48.5万件标注“生成式AI”的举报大多来自亚马逊对训练数据的扫描，且至少78%不涉及AI生成的儿童性剥削材料。虽是研究者信函，却是解读统计的关键警示。",
 "2025年上半期に「生成AI」と表示された約48万5千件の通報の多くはアマゾンの学習データ検査から出たもので、少なくとも78%はAI生成の児童性的虐待物ではなかったと指摘する。研究者の書簡だが、統計解釈の重要な警告である。"],
["신고 급증 수치를 '피해 급증'으로 직역하지 않도록 하는 반대 근거로 쓴다.",
 "Used as counter-evidence against reading the surge in reports directly as a surge in harm.",
 "Используется как контраргумент против прямого прочтения роста сообщений как роста вреда.",
 "作为反向依据，防止把举报激增直接解读为“伤害激增”。",
 "通報の急増を「被害の急増」とそのまま読まないための反証として使う。"]);

E(9,"C","press",2026,"PA Media (Danyel VanReenen) via The Irish News, 16 November 2026, on Childlight’s Into the Light Index 2026","Reports of AI-generated child sex abuse images soar 8,400%, Scottish group finds","https://www.irishnews.com/news/uk/reports-of-ai-generated-child-sex-abuse-images-soar-8400-scottish-group-finds-C4PTNZMPO5PUXMF3CZYEQFJI3E/",
"nothing inevitable about child sexual exploitation and abuse",
["에든버러대 차일드라이트의 2026 지수를 전한 통신 기사로, AI 관련 신고 4,700건(2023)→40만 건 이상(2025)과 '연간 3억 명 이상의 아동'이라는 추정을 전한다. 103개 국가·지역 중 대표 표본 조사가 있는 곳은 22개뿐이라는 점도 기사에 나온다. 원 보고서를 직접 열람하지 못해 C로 둔다.",
 "A wire report on Childlight's (University of Edinburgh) 2026 index, relaying AI-related reports of about 4,700 (2023) to more than 400,000 (2025) and an estimate of over 300 million children a year. It also notes only 22 of 103 countries and areas had representative survey data. The original report could not be read directly, so it is graded C.",
 "Агентское сообщение об индексе Childlight (Эдинбургский университет) 2026 года: сообщения, связанные с ИИ, выросли примерно с 4700 (2023) до более чем 400 000 (2025); оценка — более 300 млн детей в год. Отмечено, что лишь 22 из 103 стран и территорий имеют репрезентативные опросы. Сам доклад прочитать не удалось, поэтому класс C.",
 "这是一篇转述爱丁堡大学Childlight 2026年指数的通讯社报道：AI相关举报从约4,700件（2023）增至40万件以上（2025），并估计每年超过3亿名儿童受害。报道还指出103个国家和地区中只有22个有代表性调查数据。未能直接查阅原报告，故定为C级。",
 "エディンバラ大学チャイルドライトの2026年指数を伝える通信記事で、AI関連通報約4,700件（2023）→40万件超（2025）と「年3億人超の子ども」という推計を伝える。103の国・地域のうち代表性のある調査データがあるのは22にとどまる点も記されている。原報告を直接読めなかったためC級とする。"],
["본 보고서 주제 선정의 계기가 된 뉴스이며, 수치는 근거 7(NCMEC)로 교차 확인한다.",
 "The news that prompted this report; its figures are cross-checked against evidence 7 (NCMEC).",
 "Новость, ставшая поводом для доклада; цифры сверяются со свидетельством 7 (NCMEC).",
 "这是促成本报告选题的新闻，数字以依据7（NCMEC）交叉核实。",
 "本報告のテーマ選定のきっかけとなったニュースで、数値は根拠7（NCMEC）で照合する。"]);

E(10,"C","press",2026,"Resultsense, 16 November 2026 (summary of Guardian coverage of Childlight)","Reports of AI-related child abuse material up 8,400%, Childlight says","https://www.resultsense.com/news/2026-11-16-childlight-ai-child-abuse-material-reports-rise/",
"a preventable public health emergency",
["같은 지수 보도를 요약하면서 미국의 신고·통지 비율이 2024→2025년 63%, 캐나다는 18% 늘었고 IWF가 2026년 들어 6,310건의 AI 이미지를 확인했다고 전한다. 2차 요약 기사이므로 방향 확인용이다.",
 "Summarises the same index coverage, adding that the rate of recorded reports and notices grew 63% in the US and 18% in Canada from 2024 to 2025, and that the IWF had logged 6,310 AI images so far in 2026. A secondary summary, used only for direction.",
 "Резюмирует те же сообщения об индексе: в 2024–2025 годах частота сообщений и уведомлений выросла на 63% в США и на 18% в Канаде, а IWF с начала 2026 года выявил 6310 ИИ-изображений. Вторичное резюме — только для направления.",
 "汇总同一指数的报道，补充称2024→2025年美国记录的举报与通知比率增长63%，加拿大增长18%，IWF在2026年已确认6,310张AI图像。属二次摘要，仅用于确认方向。",
 "同じ指数の報道を要約し、2024→2025年に米国の通報・通知率が63%、カナダが18%増え、IWFが2026年に入って6,310件のAI画像を確認したと伝える。二次的な要約記事なので方向の確認に限る。"],
["국가 간 증가 속도 차이를 시사하는 보조 자료로만 쓴다.",
 "Used only as supporting material suggesting different growth rates by country.",
 "Используется лишь как вспомогательный материал о разной скорости роста по странам.",
 "仅作为提示各国增速差异的辅助材料。",
 "国ごとの増加速度の違いを示唆する補助資料としてのみ使う。"]);

E(11,"B","io",2026,"Internet Watch Foundation (IWF), 2026","AI-Generated Child Sexual Abuse: 2026 Report on Trends, Data & Human Impact (Harm without limits)","https://www.iwf.org.uk/aireport",
"Realistic full-motion AI video content is now commonplace.",
["분석가가 직접 판정한 자료로, 2025년 실제 아동 성학대로 판정된 AI 이미지·영상 8,029건, 피해 묘사의 97%가 여아, 기존 이미지 20장·15분이면 특정 아동용 모델을 만들 수 있다는 관찰을 담는다. 영국 신고 기반이라 세계 규모의 일부만 보여준다.",
 "Analyst-assessed data: 8,029 AI images and videos judged as realistic child sexual abuse in 2025, girls in 97% of the illegal AI images, and the observation that a model of a specific child can be fine-tuned from as few as 20 images in 15 minutes. Based on UK reports, it shows only part of the global picture.",
 "Данные, оценённые аналитиками: 8029 ИИ-изображений и видео признаны реалистичным сексуальным насилием над детьми в 2025 году, девочки — на 97% незаконных ИИ-изображений; модель конкретного ребёнка можно дообучить всего на 20 снимках за 15 минут. Основано на сообщениях из Великобритании и показывает лишь часть картины.",
 "由分析员直接判定的数据：2025年被判定为逼真儿童性虐待的AI图像和视频8,029件，非法AI图像中97%描绘女童，并观察到仅用20张图、15分钟即可微调出针对特定儿童的模型。基于英国举报，只反映全球的一部分。",
 "分析者が直接判定したデータで、2025年に現実的な児童性的虐待と判定されたAI画像・動画8,029件、違法なAI画像の97%が女児、既存画像20枚・15分で特定の子ども用モデルを作れるという観察を含む。英国の通報に基づくため世界規模の一部しか示さない。"],
["'판정된 불법물' 기준의 증가와 피해의 성별 편중을 보여주는 핵심 근거로 쓴다.",
 "Core evidence for growth measured by assessed illegal material and for the gendered pattern of harm.",
 "Ключевое свидетельство роста по критерию оценённого незаконного материала и гендерной асимметрии вреда.",
 "作为以“已判定非法材料”衡量的增长及伤害性别偏向的核心依据。",
 "「判定済みの違法物」基準での増加と、被害の性別の偏りを示す中核的根拠とする。"]);

E(12,"B","io",2026,"Internet Watch Foundation, Annual Data & Insights Report 2025","AI-generated Child Sexual Abuse Videos: 2025 Data and Trends","https://www.iwf.org.uk/annual-data-insights-report-2025/video-insights/ai-generated-videos/",
"Nearly two-thirds (65%) of AI videos were assessed as Category A.",
["AI 아동 성학대 영상이 2024년 13건에서 2025년 3,443건으로 260배 넘게 늘었고, 65%가 가장 심각한 A등급(비AI 영상은 43%)이었다. 영상 생성 기술의 질적 도약을 보여주지만, 탐지 역량 확대 효과와 분리하기 어렵다.",
 "AI child sexual abuse videos rose from 13 in 2024 to 3,443 in 2025 — over 260-fold — and 65% were Category A, the most severe (43% for non-AI videos). It shows a qualitative leap in video generation, though hard to separate from expanded detection.",
 "ИИ-видео с сексуальным насилием над детьми выросли с 13 в 2024 году до 3443 в 2025 году — более чем в 260 раз; 65% отнесены к самой тяжёлой категории A (у не-ИИ видео — 43%). Это качественный скачок генерации видео, хотя его трудно отделить от расширения обнаружения.",
 "AI儿童性虐待视频从2024年的13件增至2025年的3,443件，超过260倍，其中65%为最严重的A类（非AI视频为43%）。显示视频生成技术的质变，但难以与检测能力扩大的效应分开。",
 "AIによる児童性的虐待動画は2024年の13件から2025年の3,443件へと260倍超に増え、65%が最も深刻なA区分（非AI動画は43%）だった。動画生成技術の質的飛躍を示すが、検知能力拡大の効果と切り分けにくい。"],
["AI가 '더 많이'뿐 아니라 '더 심각한' 자료를 만든다는 판단의 근거로 쓴다.",
 "Supports the judgement that AI produces not only more but more severe material.",
 "Подкрепляет вывод, что ИИ производит не только больше, но и более тяжёлый материал.",
 "支撑“AI不仅制造更多、而且更严重的材料”的判断。",
 "AIが「より多く」だけでなく「より深刻な」素材を生むという判断の根拠とする。"]);

E(13,"B","io",2026,"Internet Watch Foundation, 10 August 2026","Hundreds of British under-18s reporting nude or sexual imagery of themselves say it's faked or manipulated","https://www.iwf.org.uk/news-media/news/hundreds-of-british-under-18s-reporting-nude-or-sexual-imagery-of-themselves-say-its-faked-or-manipulated/",
"New tools should be built with safety in mind from the offset",
["아동이 직접 삭제를 요청하는 'Report Remove' 창구에서, 2025년 한 해 397건이던 '조작됐다'는 신고가 2026년 상반기에만 420건이 됐다. 피해 아동 스스로의 신고라 실제 피해에 가깝지만, 창구 인지도 상승의 영향도 있다.",
 "On Report Remove, where children themselves ask for removal, reports of faked imagery went from 397 in all of 2025 to 420 in the first half of 2026 alone. Self-reports by children are close to real harm, but rising awareness of the service also plays a part.",
 "В сервисе Report Remove, где дети сами просят удалить изображения, сообщений о поддельных снимках было 397 за весь 2025 год и уже 420 за первое полугодие 2026 года. Самоотчёты детей близки к реальному вреду, но влияет и рост известности сервиса.",
 "在儿童自行申请删除的“Report Remove”渠道，称图像“被伪造”的举报2025年全年为397件，2026年上半年就达420件。儿童本人的举报接近真实伤害，但渠道知名度上升也有影响。",
 "子ども自身が削除を求める「Report Remove」窓口で、「偽造された」とする通報は2025年通年の397件に対し、2026年上半期だけで420件に達した。子ども本人の申告で実際の被害に近いが、窓口の認知度上昇の影響もある。"],
["아동 피해의 증가가 기업 신고 통계만의 착시가 아니라는 판단의 근거로 쓴다.",
 "Supports the judgement that rising child victimisation is not merely an artefact of company reporting.",
 "Подкрепляет вывод, что рост числа детей-жертв — не просто артефакт отчётности компаний.",
 "支撑“儿童受害增加并非仅是企业举报统计的错觉”这一判断。",
 "子どもの被害増加が企業の通報統計だけの錯覚ではないという判断の根拠とする。"]);

E(14,"B","io",2026,"UN News (UNICEF, ECPAT & INTERPOL, Disrupting Harm Phase 2), 4 February 2026","‘Deepfake abuse is abuse,’ UNICEF warns","https://news.un.org/en/story/2026/02/1166886",
"Children cannot wait for the law to catch up.",
["11개국 가구 대표 표본 조사를 토대로 지난 1년간 최소 120만 명의 아동이 성적 딥페이크 피해를 밝혔고, 일부 국가에서는 25명 중 1명꼴이라고 전한다. 국가 목록과 문항의 세부는 이 기사에 없어 국가별 비교에는 쓰지 않는다.",
 "Based on nationally representative household surveys in 11 countries, at least 1.2 million children disclosed having their images made into sexual deepfakes in the past year — one in 25 in some countries. The article lacks the country list and item wording, so it is not used for country-by-country comparison.",
 "По данным репрезентативных опросов домохозяйств в 11 странах, не менее 1,2 млн детей за последний год сообщили, что их изображения превратили в сексуальные дипфейки, — в некоторых странах это каждый 25-й. Списка стран и формулировок в статье нет, поэтому для сравнения стран она не используется.",
 "基于11国具有全国代表性的入户调查，过去一年至少120万名儿童披露其图像被做成性深度伪造，部分国家达到每25人中1人。报道未列国家名单与题目细节，故不用于国别比较。",
 "11か国の世帯代表標本調査に基づき、過去1年に少なくとも120万人の子どもが性的ディープフェイク被害を明かし、一部の国では25人に1人にあたると伝える。国名や設問の詳細は記事にないため国別比較には使わない。"],
["아동 피해가 고소득국만의 문제가 아니라 세계적 규모라는 판단의 근거로 쓴다.",
 "Supports the judgement that child victimisation is global, not confined to rich countries.",
 "Подкрепляет вывод о глобальном, а не только «богатом» характере проблемы.",
 "支撑“儿童受害是全球性问题，而非仅限于高收入国家”的判断。",
 "子どもの被害が高所得国だけでなく世界的規模の問題だという判断の根拠とする。"]);

E(15,"B","survey",2025,"Thorn, press release, 3 March 2025 (Deepfake Nudes & Young People)","1 in 8 Teens Know Someone Targeted by Deepfake Nudes, New Report Finds","https://www.thorn.org/press-releases/1-in-8-teens-know-someone-targeted-by-deepfake-nudes-new-report-finds/",
"1 in 8 reported personally knowing someone who has been victimized by them.",
["미국 13~20세 1,200명 조사로, 3명 중 1명꼴이 '딥페이크 누드'를 알고 8명 중 1명이 피해자를 직접 알며, 2%는 만든 적이 있다고 답했다. 피해 아동 보호 단체의 조사라 문제 부각 동기가 있을 수 있으나 방법은 공개돼 있다.",
 "A survey of 1,200 US young people aged 13–20: nearly one in three know the term “deepfake nudes”, one in eight personally know a victim and 2% admit creating them. Run by a child-protection nonprofit with an advocacy interest, but its method is disclosed.",
 "Опрос 1200 молодых американцев 13–20 лет: почти каждый третий знает термин «дипфейк-нюдсы», каждый восьмой лично знает жертву, 2% признали, что создавали их. Проведён правозащитной организацией, заинтересованной в огласке, но метод раскрыт.",
 "对美国1,200名13–20岁青少年的调查：近三分之一知道“深度伪造裸照”，八分之一认识受害者，2%承认制作过。由儿童保护机构开展，可能有倡导动机，但方法公开。",
 "米国の13〜20歳1,200人の調査で、3人に1人近くが「ディープフェイク・ヌード」を知り、8人に1人が被害者を直接知り、2%が作ったことがあると答えた。児童保護団体の調査で問題を強調する動機はありうるが、方法は公開されている。"],
["청소년 사이에서 이미 '주변의 일'이 됐다는 판단의 근거로 쓴다.",
 "Supports the judgement that among teenagers this is already something that happens to people they know.",
 "Подкрепляет вывод, что среди подростков это уже происходит с их знакомыми.",
 "支撑“在青少年中这已是身边事”的判断。",
 "10代の間ではすでに「身近な出来事」になっているという判断の根拠とする。"]);

E(16,"B","survey",2025,"Thorn, research blog, 3 March 2025","Deepfake nudes are a harmful reality for youth: New research from Thorn","https://www.thorn.org/blog/deepfake-nudes-are-a-harmful-reality-for-youth-new-research-from-thorn/",
"Victims often stay silent.",
["같은 조사의 연구 해설로, 17명 중 1명이 직접 피해자이고, 피해자의 34%만 부모에게 알렸으며, 16%는 여전히 '진짜가 아니'라고 여긴다는 수치를 담는다. 자기보고 표본의 한계가 있다.",
 "The research write-up of the same survey: one in 17 teens were direct victims, only 34% of victims told a parent, and 16% still think the images are “not real”. Limited by self-reported sampling.",
 "Научный разбор того же опроса: каждый 17-й подросток — прямая жертва, лишь 34% жертв рассказали родителям, 16% до сих пор считают такие изображения «ненастоящими». Ограничение — самоотчётная выборка.",
 "同一调查的研究解读：每17名青少年中有1名是直接受害者，只有34%的受害者告诉了父母，16%仍认为这些图像“不是真的”。受自我报告样本所限。",
 "同じ調査の研究解説で、17人に1人が直接の被害者、被害者のうち保護者に伝えたのは34%のみ、16%がいまだに「本物ではない」と考えているという数値を含む。自己申告標本の限界がある。"],
["피해의 '침묵'과 '가짜니까 괜찮다'는 인식이 지원 공백을 만든다는 판단의 근거로 쓴다.",
 "Supports the judgement that silence and the belief that fakes are harmless create a support gap.",
 "Подкрепляет вывод, что молчание и убеждение «это же подделка» создают пробел в помощи.",
 "支撑“沉默与‘反正是假的’的认知造成支援空白”的判断。",
 "被害の「沈黙」と「偽物だから大丈夫」という認識が支援の空白を生むという判断の根拠とする。"]);

E(17,"B","survey",2024,"Center for Democracy & Technology (CDT), press release on ‘In Deep Trouble’ (surveys July–August 2024)","CDT Research Reveals Widespread Tech-Powered Sexual Harassment in K-12 Public Schools","https://cdt.org/press/cdt-research-reveals-widespread-tech-powered-sexual-harassment-in-k-12-public-schools/",
"Without meaningful efforts toward prevention, everyone involved is worse off.",
["미국 공립 고교생·교사·학부모 대표 표본 조사로, 학생 15%(약 230만 명)가 학교 관련 딥페이크 성적 이미지를 안다고 답했고, 피해자 지원을 받았다는 교사는 5%에 그친 반면 71%는 가해 학생이 경찰 회부·퇴학·장기 정학됐다고 답했다. 2023~24학년도 기준이다.",
 "Nationally representative surveys of US public high-school students, teachers and parents: 15% of students (about 2.3 million) know of deepfake sexual imagery tied to their school; only 5% of teachers say victims got support, while 71% say offenders were referred to police, expelled or suspended long-term. Covers the 2023–24 school year.",
 "Репрезентативные опросы школьников, учителей и родителей государственных школ США: 15% учеников (около 2,3 млн) знают о сексуальных дипфейках, связанных со школой; лишь 5% учителей говорят о помощи жертвам, тогда как 71% — о передаче нарушителей полиции, исключении или длительном отстранении. Данные за 2023/24 учебный год.",
 "对美国公立高中学生、教师和家长的代表性调查：15%的学生（约230万人）知道与学校相关的深度伪造性图像；只有5%的教师称受害者获得支援，而71%称加害学生被移送警方、开除或长期停学。数据为2023–24学年。",
 "米国の公立高校生・教員・保護者の代表標本調査で、生徒の15%（約230万人）が学校に関わるディープフェイク性的画像を知っていると答え、被害者が支援を受けたとする教員は5%にとどまる一方、71%は加害生徒が警察送致・退学・長期停学になったと答えた。2023〜24学年度が対象。"],
["학교가 '처벌 중심·지원 부재'라는 판단의 근거로 쓴다.",
 "Supports the judgement that schools are punishment-heavy and support-light.",
 "Подкрепляет вывод, что школы делают ставку на наказание, а не на помощь.",
 "支撑“学校重惩罚、缺支援”的判断。",
 "学校が「処罰中心・支援不在」だという判断の根拠とする。"]);

E(18,"C","ind",2023,"Graphika (Santiago Lakatos), 8 December 2023","A Revealing Picture: AI-Generated ‘Undressing’ Images Move from Niche Pornography Discussion Forums to a Scaled and Monetized Online Business","https://graphika.com/reports/a-revealing-picture",
"synthetic NCII providers now operate as a fully-fledged online industry",
["34개 '옷 벗기기' 서비스가 2023년 9월 한 달 2,400만 순방문자를 기록했고, 레딧·X의 추천 링크 스팸이 2023년 들어 2,000% 넘게 늘었다는 업계 분석이다. 웹 트래픽 추정 업체 자료에 기반한다.",
 "An industry analysis finding that 34 “undressing” services drew over 24 million unique visitors in September 2023 and that referral-link spam on Reddit and X rose more than 2,000% during 2023. Based on a web-traffic estimation vendor's data.",
 "Отраслевой анализ: 34 сервиса «раздевания» получили более 24 млн уникальных посетителей в сентябре 2023 года, а спам с реферальными ссылками на Reddit и X вырос в 2023 году более чем на 2000%. Основан на данных сервиса оценки веб-трафика.",
 "业界分析指出，34个“脱衣”服务在2023年9月一个月获得逾2,400万独立访客，2023年Reddit和X上的推荐链接垃圾信息增长逾2,000%。基于网站流量估算公司的数据。",
 "34の「脱衣」サービスが2023年9月の1か月で2,400万人超のユニーク訪問者を集め、RedditとXの紹介リンクスパムが2023年に2,000%超増えたとする業界分析。ウェブトラフィック推計会社のデータに基づく。"],
["'누디파이'가 수익 모델을 갖춘 산업이라는 방향 판단에만 쓴다.",
 "Used only for the directional judgement that nudify services are a monetised industry.",
 "Используется только для вывода о том, что nudify-сервисы — монетизированная индустрия.",
 "仅用于“脱衣应用已成有盈利模式的产业”这一方向性判断。",
 "「ヌーディファイ」が収益モデルを備えた産業だという方向の判断にのみ使う。"]);

E(19,"C","ind",2023,"Security Hero (Brandon King), 18 October 2023","State Of Deepfakes (2023): Realities, Threats, And Impact","https://www.securityhero.io/state-of-deepfakes/",
"Deepfake pornography makes up 98% of all deepfake videos online.",
["온라인 딥페이크 영상 95,820건을 분석해 98%가 성적 영상이고 그 대상의 99%가 여성이라고 추정한다. 보안 업체의 자체 수집 자료로 표본 틀이 불분명하다.",
 "Analyses 95,820 deepfake videos online, estimating that 98% are pornographic and 99% of those targeted are women. A security vendor's own collection with an unclear sampling frame.",
 "Анализ 95 820 дипфейк-видео в сети: по оценке, 98% — порнографические, 99% жертв — женщины. Собственная выборка компании по безопасности с неясной рамкой.",
 "分析网上95,820段深度伪造视频，估计98%为色情内容，其中99%的对象为女性。安全企业自行收集，抽样框不明。",
 "オンラインのディープフェイク動画95,820件を分析し、98%が性的動画で対象の99%が女性と推計する。セキュリティ企業の独自収集データで標本枠が不明確。"],
["'딥페이크의 대다수는 여성 대상 성적 콘텐츠'라는 방향 판단에만 쓴다.",
 "Used only for the directional judgement that most deepfakes are sexual content targeting women.",
 "Используется только для вывода о направлении: большинство дипфейков — сексуальный контент о женщинах.",
 "仅用于“多数深度伪造是针对女性的性内容”这一方向判断。",
 "「ディープフェイクの大半は女性を対象とする性的コンテンツ」という方向の判断にのみ使う。"]);

E(20,"C","press",2024,"The Korea Times (Hankook Ilbo, AI-translated), 29 August 2024, on Security Hero","South Korea most targeted by deepfake crimes worldwide","https://www.koreatimes.co.kr/southkorea/law-crime/20240829/south-korea-most-targeted-by-deepfake-crimes-worldwide",
"It identified South Korea as the most vulnerable country to deepfake crimes.",
["시큐리티 히어로 자료를 인용해 딥페이크 성적 콘텐츠 등장인물의 53%가 한국 국적(미국 20%, 일본 10%, 영국 6%)이고 상위 10명 중 8명이 한국 가수라고 전한다. 유명인 위주의 표본이라 일반인 피해 국가 순위로 읽으면 안 된다.",
 "Citing Security Hero, it reports that 53% of people depicted in deepfake sexual content were South Korean (US 20%, Japan 10%, UK 6%) and eight of the top ten were Korean singers. The sample is celebrity-heavy and must not be read as a ranking of ordinary victims by country.",
 "Со ссылкой на Security Hero сообщает, что 53% изображённых в сексуальных дипфейках — граждане Южной Кореи (США 20%, Япония 10%, Великобритания 6%), а восемь из десяти самых частых — корейские певицы. Выборка смещена к знаменитостям и не является рейтингом стран по обычным жертвам.",
 "引用Security Hero称，深度伪造性内容中53%的人物为韩国籍（美国20%、日本10%、英国6%），前十名中有8名是韩国歌手。样本以名人为主，不能读作普通受害者的国家排名。",
 "セキュリティ・ヒーローの資料を引き、ディープフェイク性的コンテンツの登場人物の53%が韓国籍（米国20%、日本10%、英国6%）で、上位10人中8人が韓国の歌手だと伝える。著名人中心の標本であり、一般人の被害の国別順位として読んではならない。"],
["한국 K-팝 산업의 노출도를 보여주는 방향 근거로만 쓴다.",
 "Used only as directional evidence of the exposure of Korea's pop-music industry.",
 "Используется лишь как свидетельство уязвимости корейской поп-индустрии.",
 "仅作为显示韩国流行音乐产业暴露程度的方向性依据。",
 "韓国のK-POP産業の露出度を示す方向の根拠としてのみ使う。"]);

E(21,"C","press",2026,"AFP via CP24, 22 January 2026, on the Center for Countering Digital Hate (CCDH)","Musk's Grok created 3 million sexualized images, research says","https://www.cp24.com/news/world/2026/01/22/musks-grok-created-3-million-sexualized-images-research-says/",
"a factory for the production of sexual abuse material",
["CCDH가 그록(Grok)의 공개 이미지 표본 2만 장을 AI로 분류해 11일간 약 300만 장(분당 190장)의 성적 이미지, 그중 아동으로 보이는 2만3천 장을 추정했다고 전한다. 동의 없이 만들어진 비율은 보고서가 밝히지 않았고, 분류에도 AI를 썼다.",
 "Reports that CCDH, classifying a sample of 20,000 public Grok images with AI, estimated about 3 million sexualised images over 11 days (190 a minute), including 23,000 that appear to depict children. The report did not say how many were non-consensual, and the classification itself used AI.",
 "Сообщает, что CCDH, классифицировав с помощью ИИ выборку из 20 000 публичных изображений Grok, оценил около 3 млн сексуализированных изображений за 11 дней (190 в минуту), в том числе 23 000, похожих на детей. Доля созданных без согласия не указана, а сама классификация выполнена ИИ.",
 "报道称CCDH用AI对2万张Grok公开图像样本分类，估计11天内生成约300万张性化图像（每分钟190张），其中约2.3万张似乎描绘儿童。报告未说明非自愿图像比例，分类本身也使用了AI。",
 "CCDHがGrokの公開画像2万枚の標本をAIで分類し、11日間で約300万枚（毎分190枚）の性的画像、うち子どもと見られるもの2万3千枚と推計したと伝える。同意なしに作られた割合は示されず、分類にもAIを使っている。"],
["범용 AI 서비스에 기능 하나가 붙는 순간 규모가 폭발한다는 방향 판단에 쓴다.",
 "Used for the directional judgement that scale explodes once a single feature is added to a mass AI service.",
 "Используется для вывода: масштаб взрывается, как только к массовому ИИ-сервису добавляют одну функцию.",
 "用于“大众AI服务一旦加上一个功能，规模便会爆发”的方向判断。",
 "汎用AIサービスに機能が一つ加わった途端に規模が爆発するという方向の判断に使う。"]);

E(22,"C","press",2026,"The Register (Connor Jones), 12 January 2026","Ofcom officially investigating X as Grok's nudify button stays switched on","https://www.theregister.com/2026/01/12/xai_grok_uk_regulation/",
"sexualised images of children that may amount to child sexual abuse material",
["영국 오프콤이 온라인안전법에 따라 X를 공식 조사하기 시작했고(최대 1,800만 파운드 또는 세계 매출 10%), 말레이시아·인도네시아는 X 접속을 차단했다고 전한다. 규제기관 원문은 자동 접근이 막혀 언론 보도로 확인했다.",
 "Reports that Ofcom opened a formal Online Safety Act investigation into X (fines up to £18 million or 10% of worldwide revenue) and that Malaysia and Indonesia blocked access to X. The regulator's own page refused automated access, so this is confirmed via press.",
 "Сообщает, что Ofcom начал официальное расследование в отношении X по Закону о безопасности в интернете (штраф до 18 млн фунтов или 10% мировой выручки), а Малайзия и Индонезия заблокировали доступ к X. Страница регулятора недоступна для автоматического чтения, поэтому подтверждено по прессе.",
 "报道称英国Ofcom依《网络安全法》对X展开正式调查（最高罚款1,800万英镑或全球营收10%），马来西亚和印度尼西亚屏蔽了X。监管机构原文拒绝自动访问，故经媒体报道确认。",
 "英国オフコムがオンライン安全法に基づきXの正式調査を始め（最大1,800万ポンドまたは世界売上の10%）、マレーシアとインドネシアがXへの接続を遮断したと伝える。規制当局の原文は自動アクセスが拒否されたため報道で確認した。"],
["플랫폼 책임 규제가 실제로 작동하기 시작했다는 방향 근거로 쓴다.",
 "Directional evidence that platform-duty regulation has begun to bite.",
 "Свидетельство направления: регулирование обязанностей платформ начало работать.",
 "作为平台责任监管开始实际运作的方向性依据。",
 "プラットフォーム責任の規制が実際に機能し始めたという方向の根拠とする。"]);

E(23,"C","ind",2025,"Meta Newsroom, 12 June 2025 (updated 26 June 2025)","Taking Action Against ‘Nudify’ Apps","https://about.fb.com/news/2025/06/taking-action-against-nudify-apps/",
"we've provided more than 3,800 unique URLs to participating tech companies",
["메타가 크러시AI 앱 운영사를 홍콩에서 제소하고, 3월 이후 3,800개 이상의 누디파이 관련 URL을 다른 기업과 공유했다는 기업 발표다. 자사 광고망이 홍보 통로였다는 비판을 받은 뒤의 조치라 자기 홍보 성격이 있다.",
 "A company announcement that Meta sued the operator of the CrushAI apps in Hong Kong and has shared more than 3,800 nudify-related URLs with other firms since March. It followed criticism that Meta's own ad network promoted such apps, so it is partly self-promotional.",
 "Заявление компании: Meta подала иск в Гонконге против оператора приложений CrushAI и с марта передала другим компаниям более 3800 URL, связанных с nudify. Мера последовала за критикой рекламы таких приложений в сети Meta, поэтому отчасти носит рекламный характер.",
 "企业声明：Meta在香港起诉CrushAI应用运营方，并自3月起向其他企业共享3,800多个脱衣应用相关URL。此举是在其广告网络被批评为推广渠道之后作出的，带有自我宣传性质。",
 "メタがCrushAIアプリの運営会社を香港で提訴し、3月以降3,800件超のヌーディファイ関連URLを他社と共有したとする企業発表。自社広告網が宣伝経路だと批判された後の措置で、自己宣伝の性格がある。"],
["광고·앱스토어 등 유통 경로 차단이 하나의 개입 지점이라는 판단에 쓴다.",
 "Used for the judgement that distribution channels such as ads and app stores are an intervention point.",
 "Используется для вывода, что каналы распространения (реклама, магазины приложений) — точка вмешательства.",
 "用于“广告、应用商店等分发渠道是干预点之一”的判断。",
 "広告・アプリストアなどの流通経路の遮断が介入点の一つだという判断に使う。"]);

E(24,"B","io",2026,"US Federal Trade Commission, Bureau of Consumer Protection (Christopher G. Mufarrige), 19 May 2026","Take It Down Act enforcement starts now: What to know about the FTC and TIDA","https://www.ftc.gov/node/332128",
"potential civil penalties of $53,088 per violation.",
["2025년 5월 19일 서명된 '테이크 잇 다운 법'의 플랫폼 조항 집행이 2026년 5월 시작됐음을 알리는 규제기관 안내다. 유효한 요청 후 48시간 안에 동일 사본까지 삭제해야 하고, 위반마다 최대 53,088달러의 민사 제재가 가능하다. 남용 신고에 따른 과잉 삭제 우려는 다루지 않는다.",
 "Regulator guidance announcing that enforcement of the platform provisions of the TAKE IT DOWN Act (signed 19 May 2025) began in May 2026. Platforms must remove content and known identical copies within 48 hours of a valid request, with civil penalties of up to $53,088 per violation. It does not address concerns about over-removal from abusive requests.",
 "Разъяснение регулятора о начале в мае 2026 года применения платформенных положений Закона TAKE IT DOWN (подписан 19 мая 2025). Платформы обязаны удалять контент и известные копии в течение 48 часов после обоснованного запроса; штраф до 53 088 долларов за нарушение. Опасения чрезмерного удаления по недобросовестным жалобам не рассматриваются.",
 "监管机构说明：2025年5月19日签署的《TAKE IT DOWN法》平台条款于2026年5月开始执行。平台须在有效请求后48小时内删除内容及已知相同副本，每次违规最高可处53,088美元民事罚款。未涉及滥用举报导致过度删除的担忧。",
 "2025年5月19日に署名された「テイク・イット・ダウン法」のプラットフォーム条項の執行が2026年5月に始まったことを知らせる規制当局の案内。有効な要請から48時間以内に同一の複製まで削除する義務があり、違反ごとに最大53,088ドルの民事制裁が可能。悪用申請による過剰削除の懸念は扱っていない。"],
["미국형 '신속 삭제 의무' 모델의 근거로 쓴다.",
 "Evidence for the US model of a rapid takedown duty.",
 "Свидетельство американской модели обязанности быстрого удаления.",
 "作为美国式“快速删除义务”模式的依据。",
 "米国型「迅速削除義務」モデルの根拠とする。"]);

E(25,"B","io",2024,"UK Ministry of Justice (Laura Farris MP), 16 April 2024","Government cracks down on ‘deepfakes’ creation","https://www.gov.uk/government/news/government-cracks-down-on-deepfakes-creation",
"This offence will apply to images of adults.",
["유포할 의도가 없어도 성인의 성적 딥페이크를 '만드는 것' 자체를 범죄로 하겠다는 첫 발표로, 전과와 무제한 벌금을 예고했다. 당시 법안은 회기 종료로 무산됐고, 실제 시행은 근거 27의 2026년 법으로 이어졌다.",
 "The first announcement that creating a sexual deepfake of an adult would itself be an offence, even with no intent to share, carrying a criminal record and an unlimited fine. That bill lapsed; the offence came into force through the 2026 law in evidence 27.",
 "Первое заявление о том, что само создание сексуального дипфейка взрослого станет преступлением даже без намерения распространять — с судимостью и неограниченным штрафом. Тот законопроект не был принят; норма вступила в силу через закон 2026 года (свидетельство 27).",
 "首次宣布即使无传播意图，“制作”成人性深度伪造本身也将入罪，可留案底并处无上限罚款。该法案因议会会期结束而搁浅，实际施行通过依据27所述2026年法律实现。",
 "拡散の意図がなくても成人の性的ディープフェイクを「作ること」自体を犯罪にするという最初の発表で、前科と上限なしの罰金を予告した。当時の法案は会期終了で廃案となり、実際の施行は根拠27の2026年の法へ引き継がれた。"],
["'제작 자체 처벌'로의 전환 시점을 보여주는 근거로 쓴다.",
 "Marks the turn towards criminalising creation itself.",
 "Отмечает поворот к криминализации самого создания.",
 "标志着转向“处罚制作本身”的时点。",
 "「制作そのものの処罰」への転換点を示す根拠とする。"]);

E(26,"B","io",2025,"UK Home Office & DSIT, 18 December 2025","Protecting young people online at the heart of new VAWG strategy","https://www.gov.uk/government/news/protecting-young-people-online-at-the-heart-of-new-vawg-strategy",
"will also be banned, under plans announced today",
["누디파이 도구의 제작·공급 금지 계획을 밝히며, 한 전용 사이트의 성적 딥페이크 27만6,149건 중 96%가 여성이고, Report Remove 신고자의 19%가 AI 조작을 언급했다는 수치를 제시한다. 시행 시기와 법적 경로는 확인되지 않았다.",
 "Announces plans to ban the creation and supply of nudification tools, citing 276,149 sexual deepfakes on a single dedicated site (96% depicting women) and 19% of Report Remove reporters citing AI manipulation. Timing and legislative vehicle were not confirmed.",
 "Объявляет планы запретить создание и распространение инструментов «раздевания», ссылаясь на 276 149 сексуальных дипфейков на одном специализированном сайте (96% — женщины) и на 19% обращений в Report Remove с упоминанием ИИ-манипуляции. Сроки и законодательный путь не подтверждены.",
 "宣布计划禁止制作和提供脱衣工具，并引用单一专门网站上276,149件性深度伪造中96%为女性、Report Remove举报者中19%提到AI篡改等数字。实施时间与立法途径尚未确认。",
 "ヌーディファイ・ツールの制作・供給を禁止する計画を示し、ある専用サイトの性的ディープフェイク276,149件の96%が女性、Report Removeの申告者の19%がAIによる改変に言及したという数値を挙げる。施行時期と立法経路は確認できなかった。"],
["'도구 자체 금지'라는 새 규제 층위의 근거로 쓴다.",
 "Evidence for a new regulatory layer: banning the tools themselves.",
 "Свидетельство нового уровня регулирования — запрета самих инструментов.",
 "作为“禁止工具本身”这一新监管层级的依据。",
 "「ツールそのものの禁止」という新たな規制層の根拠とする。"]);

E(27,"C","press",2026,"End Violence Against Women Coalition (EVAW), 6 February 2026","Survivors and campaigners welcome new deepfake law but call on government to go further","https://www.endviolenceagainstwomen.org.uk/?p=7189",
"It does not automatically ensure abusive images are removed from the internet",
["2026년 2월 6일 데이터(이용·접근)법에 따라 성적 딥페이크 '제작 또는 제작 요청'이 범죄가 됐다고 전하면서, 삭제가 자동으로 보장되지 않는다며 48시간 삭제 명령을 요구한다. 시민단체의 옹호 자료다.",
 "Reports that from 6 February 2026, under the Data (Use and Access) Act 2025, creating or requesting a sexual deepfake became an offence, while warning that removal is not guaranteed and calling for 48-hour takedown orders. An advocacy source.",
 "Сообщает, что с 6 февраля 2026 года по Закону о данных (использование и доступ) 2025 года создание или заказ сексуального дипфейка стали преступлением, но предупреждает, что удаление не гарантировано, и требует 48-часовых предписаний. Правозащитный источник.",
 "报道称自2026年2月6日起，依据《2025年数据（使用与访问）法》，制作或要求制作性深度伪造即构成犯罪；同时警告删除并无自动保障，呼吁48小时删除令。属倡导团体材料。",
 "2026年2月6日にデータ（利用・アクセス）法により性的ディープフェイクの「制作または制作の依頼」が犯罪になったと伝える一方、削除は自動的に保証されないとして48時間削除命令を求める。市民団体の主張資料である。"],
["처벌과 삭제가 서로 다른 문제라는 판단의 근거로 쓴다.",
 "Supports the judgement that punishment and removal are separate problems.",
 "Подкрепляет вывод, что наказание и удаление — разные задачи.",
 "支撑“惩罚与删除是两个不同问题”的判断。",
 "処罰と削除は別の問題だという判断の根拠とする。"]);

E(28,"B","io",2024,"European Parliament & Council, Directive (EU) 2024/1385 of 14 May 2024 (OJ L, 24.5.2024)","Directive on combating violence against women and domestic violence","https://eur-lex.europa.eu/eli/dir/2024/1385/oj",
"producing, manipulating or altering and subsequently making accessible to the public",
["제5조 1항 (b)는 동의 없이 성적 행위를 하는 것처럼 보이게 만든 이미지를 '제작·조작한 뒤 공개'하는 행위를 범죄화하도록 회원국에 요구하고, 최소 1년 이상의 최고형, 2027년 6월 14일까지의 국내법 전환을 정한다. 공개를 요건으로 해 '제작만'은 포함하지 않는다.",
 "Article 5(1)(b) requires member states to criminalise producing or manipulating material that makes a person appear sexually explicit without consent and then making it public, with a maximum penalty of at least one year and transposition by 14 June 2027. Because publication is required, creation alone is not covered.",
 "Статья 5(1)(b) обязывает государства-члены криминализировать создание или изменение материала, изображающего человека в сексуальных действиях без согласия, с последующим публичным распространением; максимальное наказание — не менее года, транспозиция — до 14 июня 2027 года. Поскольку требуется обнародование, само создание не охватывается.",
 "第5条第1款(b)要求成员国将未经同意“制作或篡改并随后公开”使人看似从事性行为的材料入罪，最高刑不少于1年，须于2027年6月14日前转化为国内法。因以公开为要件，“仅制作”不在其内。",
 "第5条1項(b)は、同意なく性的行為をしているように見せる素材を「制作・改変したうえで公開する」行為の犯罪化を加盟国に求め、最高刑1年以上、2027年6月14日までの国内法化を定める。公開を要件とするため「制作のみ」は含まない。"],
["EU 최저 기준과 '공개 요건'의 공백을 비교하는 근거로 쓴다.",
 "Used to compare the EU floor and its publication-requirement gap.",
 "Используется для сравнения минимального стандарта ЕС и пробела, связанного с требованием обнародования.",
 "用于比较欧盟最低标准及其“公开要件”的空白。",
 "EUの最低基準と「公開要件」の空白を比較する根拠とする。"]);

E(29,"B","io",2025,"Cyberspace Administration of China, MIIT, Ministry of Public Security & NRTA, 7 March 2025 (国信办通字〔2025〕2号)","关于印发《人工智能生成合成内容标识办法》的通知 (Measures for Labelling AI-Generated Synthetic Content)","https://www.cac.gov.cn/2025-03/14/c_1743654684782215.htm",
"本办法自2025年9月1日起施行",
["AI 생성 텍스트·음성·이미지·영상에 '보이는 표시'와 메타데이터 속 '숨은 표시'를 의무화하고, 배포 플랫폼이 이를 확인하게 하며 표시 삭제·위조를 금지한다(2025년 9월 1일 시행). 성범죄 처벌 규정이 아니라 출처 표시 규정이며, 집행 실태 자료는 없다.",
 "Mandates visible labels and hidden metadata labels on AI-generated text, audio, images and video, requires distribution platforms to check them and bans removing or forging labels (in force 1 September 2025). It is a provenance rule, not a sexual-offence law, and no enforcement data are available.",
 "Обязывает ставить видимые метки и скрытые метаданные на созданные ИИ тексты, аудио, изображения и видео, требует от платформ их проверять и запрещает удаление или подделку меток (действует с 1 сентября 2025 года). Это правило о происхождении, а не закон о половых преступлениях; данных о применении нет.",
 "要求对AI生成的文本、音频、图像、视频添加显式标识和元数据中的隐式标识，要求传播平台核验，并禁止删除或伪造标识（2025年9月1日施行）。这是来源标识规定而非性犯罪处罚规定，缺乏执行情况数据。",
 "AI生成のテキスト・音声・画像・動画に「見える表示」とメタデータ内の「隠れた表示」を義務づけ、配信プラットフォームに確認させ、表示の削除・偽造を禁じる（2025年9月1日施行）。性犯罪の処罰規定ではなく出所表示の規定であり、執行実態のデータはない。"],
["'출처 표시형' 규제 모델의 근거로 쓴다.",
 "Evidence for the provenance-labelling model of regulation.",
 "Свидетельство модели регулирования через маркировку происхождения.",
 "作为“来源标识型”监管模式的依据。",
 "「出所表示型」規制モデルの根拠とする。"]);

E(30,"B","io",2024,"Ministry of Justice of Korea (법무부 형사법제과), 16 October 2024","「성폭력범죄의 처벌 등에 관한 특례법」 및 「형사소송법」 일부개정법률 공포·시행 알림","https://www.moj.go.kr/bbs/moj/159/588549/artclView.do",
"허위영상물 등을 소지·구입·저장 또는 시청한 자에 대한 처벌 규정 신설(제14조의2제4항 신설)",
["2024년 10월 16일 공포·시행된 개정 성폭력처벌법(제20459호)으로 허위영상물의 소지·구입·저장·시청 처벌 조항이 신설됐음을 알리는 정부 공지다. 형량은 이 공지에 없고 근거 31에서 확인했다.",
 "A government notice that the amended Sexual Violence Punishment Act (No. 20459), promulgated and in force on 16 October 2024, created an offence of possessing, buying, storing or viewing fabricated sexual images. Penalties are not on this notice and were confirmed from evidence 31.",
 "Правительственное уведомление: поправками к Закону о наказании за сексуальное насилие (№ 20459), вступившими в силу 16 октября 2024 года, введена ответственность за хранение, покупку, сохранение или просмотр поддельных сексуальных изображений. Санкций в уведомлении нет; они подтверждены по свидетельству 31.",
 "政府公告：2024年10月16日公布并施行的修订版《性暴力犯罪处罚特例法》（第20459号）新设了持有、购买、保存、观看虚假影像物的处罚条款。公告未载刑度，已由依据31确认。",
 "2024年10月16日に公布・施行された改正性暴力処罰法（第20459号）により、虚偽映像物の所持・購入・保存・視聴の処罰規定が新設されたことを知らせる政府の告知。刑量は告知になく、根拠31で確認した。"],
["한국이 '시청자까지 처벌'하는 가장 넓은 형사 규율국이라는 판단의 근거로 쓴다.",
 "Supports the judgement that Korea has the broadest criminal coverage, reaching viewers.",
 "Подкрепляет вывод, что у Кореи самый широкий уголовный охват — вплоть до зрителей.",
 "支撑“韩国是处罚范围最广、连观看者也处罚的国家”这一判断。",
 "韓国が「視聴者まで処罰する」最も広い刑事規律国だという判断の根拠とする。"]);

// ===== Evidence 31–39: Korea press on official figures, Japan, Australia =====
E(31,"C","press",2024,"Segye Ilbo (Yonhap, 류미나), 26 September 2024","딥페이크 성착취물 소지·시청하면 최대 징역 3년…국회 통과","https://www.segye.com/newsView/20240926519805",
"딥페이크 성 착취물을 소지하거나 시청한 사람에 대해 징역형 처벌이 가능해진다.",
["국회 통과 개정안의 내용으로 소지·구입·저장·시청 3년 이하 징역 또는 3천만 원 이하 벌금, 제작 처벌 상향(7년 이하), 허위영상물 이용 협박 1년 이상을 전한다. 법령 원문 대신 통신 기사다.",
 "Reports the amendment passed by the National Assembly: up to three years' prison or a ₩30 million fine for possessing, buying, storing or viewing; a higher penalty for production (up to seven years); at least one year for threats using such images. A wire story, not the statute text.",
 "Сообщает о принятой парламентом поправке: до трёх лет лишения свободы или штраф до 30 млн вон за хранение, покупку, сохранение или просмотр; более строгое наказание за изготовление (до семи лет); не менее года за угрозы с использованием таких материалов. Агентская заметка, а не текст закона.",
 "报道国会通过的修正案：持有、购买、保存、观看者处3年以下徒刑或3,000万韩元以下罚金；制作者刑度上调（7年以下）；利用虚假影像物胁迫者处1年以上徒刑。为通讯社报道而非法条原文。",
 "国会を通過した改正案の内容として、所持・購入・保存・視聴に3年以下の懲役または3千万ウォン以下の罰金、制作の処罰引き上げ（7年以下）、虚偽映像物を使った脅迫に1年以上を伝える。法令原文ではなく通信記事である。"],
["근거 30의 정부 공지와 함께 한국 법제의 범위와 형량을 확인하는 데 쓴다.",
 "Used with the government notice in evidence 30 to confirm the scope and penalties of Korean law.",
 "Используется вместе с уведомлением правительства (свидетельство 30) для подтверждения охвата и санкций корейского закона.",
 "与依据30的政府公告一起，用于确认韩国法律的范围与刑度。",
 "根拠30の政府告知と併せて韓国法制の範囲と刑量を確認するのに使う。"]);

E(32,"C","press",2024,"Financial News (Yonhap, 윤보람), 30 October 2024, on Korean National Police Agency figures","경찰, 올해 딥페이크 성범죄 964건 수사…506명 검거","https://www.fnnews.com/news/202410301102016945",
"10대가 411명으로 81.2%의 비중을 차지해 가장 많았다.",
["경찰청 발표를 전한 기사로 2024년 1월~10월 25일 딥페이크 성범죄 964건 수사·506명 검거, 검거 피의자의 81.2%가 10대이며 집중단속 이후 일평균 신고가 늘었다고 전한다. 집계 기간이 짧고 단속 효과가 섞여 있다.",
 "Relays police figures: 964 deepfake sex-crime cases investigated and 506 suspects arrested from 1 January to 25 October 2024, with teenagers 81.2% of those arrested, and daily reports rising after the crackdown began. The period is short and crackdown effects are mixed in.",
 "Передаёт данные полиции: с 1 января по 25 октября 2024 года расследовано 964 дела о дипфейк-преступлениях, задержаны 506 подозреваемых, 81,2% из них — подростки; после начала спецоперации ежедневные заявления выросли. Период короткий, эффекты спецоперации смешаны.",
 "转述警察厅发布：2024年1月1日至10月25日侦办深度伪造性犯罪964件、抓获嫌疑人506名，其中81.2%为十几岁青少年，专项打击后日均举报增加。统计期短且混有打击效应。",
 "警察庁の発表を伝える記事で、2024年1月〜10月25日にディープフェイク性犯罪964件を捜査し506人を検挙、検挙者の81.2%が10代で、集中取締り後に1日平均の通報が増えたと伝える。集計期間が短く、取締りの効果が混在する。"],
["2024년 '한국 딥페이크 사태'의 규모와 가해자 연령을 보여주는 기준점으로 쓴다.",
 "A baseline for the scale and offender age profile of Korea's 2024 deepfake crisis.",
 "Точка отсчёта для масштаба и возраста виновных во время корейского «дипфейкового кризиса» 2024 года.",
 "作为2024年“韩国深度伪造事件”规模与加害者年龄的基准点。",
 "2024年の「韓国ディープフェイク事態」の規模と加害者の年齢を示す基準点とする。"]);

E(33,"C","press",2025,"Newsis (최은수), 16 November 2025, on Korean National Police Agency crackdown results","'딥페이크 성범죄' 1438명 검거…피의자 62%가 10대","https://www.newsis.com/view/NISX20251114_0003403877",
"딥페이크 성범죄 피의자 10명 중 6명이 10대로 나타났다.",
["2024년 11월~2025년 10월 집중단속 결과로 딥페이크 성범죄 1,827건 발생, 1,462건 단속, 1,438명 검거(구속 72명), 피의자의 61.8%가 10대·30.2%가 20대라고 전한다. 사이버성폭력 전체의 35.2%가 딥페이크였다. 공식 발표를 옮긴 언론 보도다.",
 "Crackdown results for November 2024–October 2025: 1,827 deepfake sex crimes, 1,462 handled, 1,438 arrested (72 detained), with 61.8% of suspects teenagers and 30.2% in their twenties; deepfakes were 35.2% of all cyber sexual violence. A press report of an official release.",
 "Итоги спецоперации ноябрь 2024 — октябрь 2025: 1827 дипфейк-преступлений, 1462 раскрыто, 1438 задержаны (72 арестованы); 61,8% подозреваемых — подростки, 30,2% — 20–29 лет; дипфейки составили 35,2% всего киберсексуального насилия. Пресса пересказывает официальный релиз.",
 "2024年11月至2025年10月专项打击结果：深度伪造性犯罪发生1,827件，查处1,462件，抓获1,438人（逮捕72人），嫌疑人中十几岁占61.8%、二十几岁占30.2%；深度伪造占全部网络性暴力的35.2%。系媒体转述官方发布。",
 "2024年11月〜2025年10月の集中取締りの結果として、ディープフェイク性犯罪1,827件発生、1,462件取締り、1,438人検挙（拘束72人）、被疑者の61.8%が10代・30.2%が20代と伝える。サイバー性暴力全体の35.2%がディープフェイクだった。公式発表を伝える報道である。"],
["한국에서 가해의 중심이 10대이며 사건 규모가 1년 새 커졌다는 판단의 근거로 쓴다.",
 "Supports the judgement that teenagers are the core of offending in Korea and that case volume grew within a year.",
 "Подкрепляет вывод, что в Корее основная часть виновных — подростки, а число дел за год выросло.",
 "支撑“韩国加害主体为青少年、案件规模一年内扩大”的判断。",
 "韓国では加害の中心が10代で、事件規模が1年で大きくなったという判断の根拠とする。"]);

E(34,"C","press",2025,"News Tomato (신상민), 27 March 2025, on Statistics Korea’s SDG report 2025","딥페이크 성범죄 느는데 검거율 하락…AI 기본법 '한계'","https://www.newstomato.com/ReadNews.aspx?no=1257321",
"관련 범죄의 검거율은 오히려 낮아지고 있는 것으로 나타났습니다.",
["통계청 국가통계연구원의 '한국의 SDG 이행 현황 2025'를 인용해 2023년 허위영상물 편집·반포 168건, 검거율 48.2%(전년 대비 10.6%p 하락)라고 전한다. 2024년 사태 이전 수치다.",
 "Citing Statistics Korea's SDG implementation report 2025: 168 cases of editing or distributing fabricated images in 2023, with an arrest rate of 48.2%, down 10.6 points on the year. Figures from before the 2024 crisis.",
 "Со ссылкой на доклад Статистического управления Кореи о ЦУР 2025: в 2023 году 168 дел о монтаже или распространении поддельных изображений, раскрываемость 48,2% (минус 10,6 п. п. за год). Данные до кризиса 2024 года.",
 "引用韩国统计厅国家统计研究院《韩国可持续发展目标履行现状2025》：2023年虚假影像物编辑与散布168件，破案率48.2%（同比下降10.6个百分点）。为2024年事件之前的数据。",
 "統計庁国家統計研究院の「韓国のSDG履行状況2025」を引き、2023年の虚偽映像物の編集・頒布168件、検挙率48.2%（前年比10.6ポイント低下）と伝える。2024年の事態以前の数値である。"],
["단속 강화 이전에는 검거율이 낮았다는 비교 기준으로 쓴다.",
 "A comparison baseline showing low clearance before enforcement was stepped up.",
 "Точка сравнения: до усиления правоприменения раскрываемость была низкой.",
 "作为“加强打击前破案率偏低”的比较基准。",
 "取締り強化前は検挙率が低かったことを示す比較基準とする。"]);

E(35,"C","press",2025,"Kyunghyang Shinmun (플랫팀), 11 April 2025, on the Ministry of Gender Equality’s 2024 victim-support report","1만명 넘은 ‘디지털성범죄’ 피해자…‘딥페이크’ 피해 99.6%는 여성","https://www.khan.co.kr/article/202504111006011",
"지난해 정부에 디지털성범죄 피해지원을 받은 피해자가 1만명을 넘어섰다.",
["정부 피해자 지원 보고서 기사로 2024년 지원 피해자 10,305명, 합성·편집 피해 1,384건(2023년 423건 대비 227.2% 증가), 딥페이크 피해자의 92.6%가 10~20대라고 전한다. 여성 비율이 제목(99.6%)과 본문(96.6%)에서 다르므로 본 보고서는 본문 수치를 쓴다.",
 "Reports the government's victim-support report: 10,305 victims supported in 2024, 1,384 synthesis/editing cases (up 227.2% from 423 in 2023), and 92.6% of deepfake victims in their teens or twenties. The share of women differs between headline (99.6%) and body (96.6%); this report uses the body figure.",
 "Сообщает о правительственном отчёте о помощи жертвам: в 2024 году помощь получили 10 305 человек, случаев синтеза/монтажа — 1384 (рост на 227,2% с 423 в 2023 году), 92,6% жертв дипфейков — 10–29 лет. Доля женщин в заголовке (99,6%) и тексте (96,6%) расходится; используется цифра из текста.",
 "报道政府受害者支援报告：2024年获支援受害者10,305名，合成·编辑受害1,384件（较2023年423件增加227.2%），深度伪造受害者92.6%为十几岁至二十几岁。女性比例标题（99.6%）与正文（96.6%）不一致，本报告采用正文数字。",
 "政府の被害者支援報告書の記事で、2024年の支援被害者10,305人、合成・編集被害1,384件（2023年の423件比227.2%増）、ディープフェイク被害者の92.6%が10〜20代と伝える。女性の割合が見出し（99.6%）と本文（96.6%）で異なるため、本報告は本文の数値を用いる。"],
["2023→2024년 피해 지원의 급증을 보여주는 근거로 쓴다.",
 "Evidence for the jump in victim-support cases from 2023 to 2024.",
 "Свидетельство резкого роста обращений за помощью в 2023→2024 годах.",
 "作为2023→2024年受害支援激增的依据。",
 "2023→2024年の被害支援の急増を示す根拠とする。"]);

E(36,"C","press",2026,"Newsis (박정영), 16 April 2026, on the Ministry of Gender Equality and Family’s 2025 victim-support report","작년 디지털성범죄 피해자 1만637명…10·20대 77% 차지","https://www.newsis.com/view/NISX20260416_0003593532",
"특히 합성·편집 피해의 경우 10대와 20대가 91.2%를 차지해",
["2025년 지원 피해자 10,637명(3.2% 증가), 10~20대 77.6%, 합성·편집 피해자의 91.2%가 10~20대, 가해자 특정 불가 29.0%라고 전한다. 지원기관을 찾은 피해만 집계된다.",
 "Reports 10,637 victims supported in 2025 (up 3.2%), 77.6% in their teens or twenties, 91.2% of synthesis/editing victims in that age group, and 29.0% of cases where the perpetrator could not be identified. Counts only victims who reached the support centre.",
 "Сообщает: в 2025 году помощь получили 10 637 жертв (+3,2%), 77,6% — 10–29 лет; среди жертв синтеза/монтажа таких 91,2%; в 29,0% случаев виновного установить не удалось. Учитываются лишь обратившиеся в центр.",
 "报道2025年获支援受害者10,637名（增加3.2%），十几岁至二十几岁占77.6%，合成·编辑受害者中该年龄段占91.2%，无法确定加害者的占29.0%。仅统计到访支援机构的受害者。",
 "2025年の支援被害者10,637人（3.2%増）、10〜20代77.6%、合成・編集被害者の91.2%が10〜20代、加害者を特定できない29.0%と伝える。支援機関に来た被害のみが集計される。"],
["급증 이후 '높은 수준의 고착'과 가해자 익명성 증가를 보여주는 근거로 쓴다.",
 "Evidence that after the surge, victimisation has plateaued at a high level while perpetrator anonymity grows.",
 "Свидетельство того, что после всплеска уровень закрепился на высоком плато, а анонимность виновных растёт.",
 "作为激增之后“高位固化”与加害者匿名性上升的依据。",
 "急増後の「高水準での定着」と加害者の匿名性の高まりを示す根拠とする。"]);

E(37,"C","press",2025,"The Japan News / Asia News Network via The Star, 26 October 2025","Japan grapples with deepfake pornography, with laws yet to catch up","https://www.thestar.com.my/aseanplus/aseanplus-news/2025/10/26/japan-grapples-with-deepfake-pornography-with-laws-yet-to-catch-up",
"Japan does not have laws that directly regulate deepfake pornography",
["일본 경찰청이 2024년 학교 행사·졸업앨범 사진으로 만든 미성년자 성적 딥페이크 신고를 100건 넘게 받았고, 도쿄 경시청이 262명의 이미지로 2만 장을 만든 남성을 체포했다고 전한다. 딥페이크 자체를 직접 규율하는 법은 없다고 지적한다.",
 "Reports that Japan's National Police Agency received over 100 reports in 2024 of sexual deepfakes of minors made from school-event and yearbook photos, and that Tokyo police arrested a man who made 20,000 images from pictures of 262 people. It notes Japan has no law directly regulating deepfake pornography.",
 "Сообщает, что Национальное полицейское агентство Японии в 2024 году получило более 100 сообщений о сексуальных дипфейках несовершеннолетних из фото школьных мероприятий и выпускных альбомов, а полиция Токио задержала мужчину, создавшего 20 000 изображений по снимкам 262 человек. В Японии нет закона, прямо регулирующего дипфейк-порнографию.",
 "报道日本警察厅2024年收到100多起利用学校活动和毕业相册照片制作未成年人性深度伪造的举报，东京警视厅逮捕了一名用262人的照片制作2万张图像的男子。文章指出日本没有直接规范深度伪造色情的法律。",
 "警察庁が2024年に学校行事や卒業アルバムの写真から作られた未成年者の性的ディープフェイクについて100件超の相談を受け、警視庁が262人の画像で2万枚を作った男を逮捕したと伝える。ディープフェイク自体を直接規律する法はないと指摘する。"],
["일본은 기존 법으로 간접 대응하는 '간접 규율형'이라는 판단의 근거로 쓴다.",
 "Supports the judgement that Japan regulates only indirectly, through existing laws.",
 "Подкрепляет вывод, что Япония регулирует лишь косвенно — через существующие законы.",
 "支撑“日本以现行法律间接应对，属间接规范型”的判断。",
 "日本は既存の法で間接的に対応する「間接規律型」だという判断の根拠とする。"]);

E(38,"C","io",2026,"OECD.AI AI Incidents and Hazards Monitor (AIM), incident 2026-08-02 (AI-generated summary)","AI-Generated Sexual Deepfakes of Minors Lead to Arrests in Japan","https://oecd.ai/en/incidents/2026-08-02-aeca",
"used generative AI to create and post hundreds of sexually explicit deepfake images",
["일본에서 고교생의 의뢰로 미성년자를 포함한 실존 여성의 성적 딥페이크 수백 장을 만든 남성과 의뢰자가 함께 체포된 사건 기록이다. 요약 자체가 AI 생성이며 OECD 공식 견해가 아니라고 명시돼 있다.",
 "An incident record of a man in Japan who, at a high-school student's request, made hundreds of sexual deepfakes of real women including minors; both were arrested. The summary itself is AI-generated and labelled as not the OECD's official view.",
 "Запись инцидента: в Японии мужчина по просьбе старшеклассника создал сотни сексуальных дипфейков реальных женщин, включая несовершеннолетних; оба задержаны. Само резюме сгенерировано ИИ и не является официальной позицией ОЭСР.",
 "事件记录：日本一名男子应高中生请求，制作了包括未成年人在内的真实女性性深度伪造数百张，二人均被逮捕。摘要本身由AI生成，并注明不代表经合组织官方观点。",
 "日本で高校生の依頼により未成年者を含む実在女性の性的ディープフェイク数百枚を作った男と依頼者が共に逮捕された事件の記録。要約自体がAI生成で、OECDの公式見解ではないと明記されている。"],
["'의뢰형 제작'이라는 새 가해 형태를 보여주는 사례로만 쓴다.",
 "Used only as a case of a new form of offending: commissioned creation.",
 "Используется лишь как пример новой формы — «изготовления на заказ».",
 "仅作为显示“委托制作”这一新加害形态的案例。",
 "「依頼による制作」という新しい加害形態を示す事例としてのみ使う。"]);

E(39,"C","press",2025,"Al Jazeera English (John Power), 27 November 2025","Australia clamps downs on ‘nudify’ sites used for AI-generated child abuse","https://www.aljazeera.com/news/2025/11/27/australia-clamps-downs-on-nudify-sites-used-for-ai-generated-child-abuse",
"approximately 100,000 visits a month from Australians",
["호주 eSafety 위원회가 최대 4,950만 호주달러 제재를 경고하자, 호주에서 월 약 10만 회 방문을 받던 영국 기반 누디파이 사이트 3곳이 호주 접속을 차단했다고 전한다. 규제기관 원문은 접속 시간 초과로 열지 못했다.",
 "Reports that after Australia's eSafety Commissioner warned of penalties up to A$49.5 million, three UK-based nudify sites that had drawn about 100,000 Australian visits a month withdrew from Australia. The regulator's own release timed out and could not be opened.",
 "Сообщает, что после предупреждения уполномоченного eSafety Австралии о штрафах до 49,5 млн австралийских долларов три британских nudify-сайта, получавших около 100 000 посещений в месяц из Австралии, закрыли доступ для австралийцев. Релиз регулятора открыть не удалось (тайм-аут).",
 "报道澳大利亚eSafety专员警告最高4,950万澳元处罚后，每月约有10万次澳大利亚访问的3个英国脱衣网站停止对澳服务。监管机构原文因超时未能打开。",
 "豪州のeセーフティ委員が最大4,950万豪ドルの制裁を警告すると、豪州から月約10万回の訪問を受けていた英国拠点のヌーディファイ・サイト3つが豪州からの接続を遮断したと伝える。規制当局の原文はタイムアウトで開けなかった。"],
["국가 규제기관이 해외 서비스의 접속을 실제로 끊을 수 있다는 방향 근거로 쓴다.",
 "Directional evidence that a national regulator can actually cut off access to offshore services.",
 "Свидетельство направления: национальный регулятор способен реально отключить зарубежные сервисы.",
 "作为国家监管机构能够实际切断境外服务访问的方向性依据。",
 "国の規制当局が海外サービスへの接続を実際に断てるという方向の根拠とする。"]);
