E(36,"C","ind",2025,"Yutaro Yamada, Robert Tjarko Lange, Cong Lu, Shengran Hu, Chris Lu, Jakob Foerster, Jeff Clune & David Ha (Sakana AI et al.) (arXiv:2504.08066)","The AI Scientist-v2: Workshop-Level Automated Scientific Discovery via Agentic Tree Search","https://arxiv.org/abs/2504.08066",
"the first instance of a fully AI-generated paper successfully navigating a peer review",
["가설·실험·분석·작성을 자동으로 하는 에이전트가 ICLR 워크숍에 낸 원고 3편 중 1편이 사람 채택 평균선을 넘는 점수를 받았다고 개발 기업이 보고했다. 워크숍은 본회의보다 기준이 낮고, 개발사의 자기 평가라 C로 둔다.",
 "The developer reports that one of three manuscripts its agent produced end-to-end (hypothesis, experiments, analysis, writing) scored above the average human acceptance threshold at an ICLR workshop. Workshops have lower bars than main conferences, and this is the developer's self-assessment, so it is graded C.",
 "Разработчик сообщает, что одна из трёх рукописей, полностью созданных агентом (гипотеза, эксперименты, анализ, текст), получила баллы выше среднего порога принятия на воркшопе ICLR. Планка воркшопов ниже основной конференции, а это самооценка разработчика, поэтому класс C.",
 "开发企业报告，其智能体全自动完成（假设、实验、分析、写作）的3篇稿件中有1篇在ICLR研讨会上得分超过人类录用平均线。研讨会标准低于主会，且为开发者自评，故定为C。",
 "仮説・実験・分析・執筆を自動で行うエージェントがICLRのワークショップに出した原稿3本のうち1本が、人の採択平均線を上回る点数を得たと開発企業が報告した。ワークショップは本会議より基準が低く、開発元の自己評価なのでCとする。"],
["'AI가 논문 전체를 쓰는 시대'의 초기 신호로 쓰고, 연구 능력의 증거로 과장하지 않는다.",
 "An early signal of AI writing whole papers, not overstated as proof of research capability.",
 "Ранний сигнал эпохи, когда ИИ пишет статьи целиком, без преувеличения как доказательство исследовательских способностей.",
 "作为“AI撰写整篇论文时代”的早期信号，不夸大为研究能力的证据。",
 "「AIが論文全体を書く時代」の初期シグナルとして使い、研究能力の証拠として誇張しない。"]);

E(37,"A","q1",2024,"Conner Ganjavi et al. (incl. Gary S. Collins & Giovanni E. Cacciamani), BMJ (2024)","Publishers' and journals' instructions to authors on use of generative artificial intelligence in academic and scientific publishing: bibliometric analysis","https://pubmed.ncbi.nlm.nih.gov/38296328/",
"Among the top 100 highly ranked journals, 87% provided guidance on GAI",
["2023년 기준 상위 100개 학술지의 87%, 상위 100개 출판사의 24%가 생성형 AI 지침을 두었고, 지침이 있는 곳의 96~98%가 AI의 저자 인정을 금지했다. 원고 생성 자체를 금지한 학술지는 1곳뿐이었고 공개 방법은 제각각이었으며 12개 학술지는 출판사 지침과 충돌했다.",
 "As of 2023, 87% of the top 100 journals and 24% of the top 100 publishers had generative-AI guidance, and 96–98% of those with guidance barred AI authorship. Only one journal banned using AI to generate manuscripts, disclosure methods varied widely, and 12 journals conflicted with their publisher's guidance.",
 "На 2023 год руководства по генеративному ИИ имели 87% из 100 ведущих журналов и 24% из 100 крупнейших издателей; 96–98% из них запрещали ИИ быть автором. Лишь один журнал запретил генерировать рукописи с ИИ, способы раскрытия различались, а у 12 журналов правила противоречили издательским.",
 "截至2023年，前100名期刊的87%、前100大出版社的24%制定了生成式AI指南，有指南者中96–98%禁止AI署名。禁止用AI生成稿件的期刊仅1家，披露方式五花八门，12家期刊与出版社指南冲突。",
 "2023年時点で上位100誌の87%、上位100出版社の24%が生成AIの指針を設け、指針のある所の96〜98%がAIを著者と認めることを禁じた。原稿生成そのものを禁じた学術誌は1誌だけで、開示方法はまちまち、12誌は出版社の指針と矛盾していた。"],
["학술지 규칙은 '저자 불인정·공개 의무'로 수렴했지만 세부는 혼란스럽다는 판단의 근거로 쓴다.",
 "Supports the judgement that journal rules converged on 'no AI authors, disclose use' but remain inconsistent in detail.",
 "Подкрепляет вывод: правила журналов сошлись на «ИИ не автор, раскрывай использование», но в деталях хаотичны.",
 "支撑“期刊规则已收敛于‘不认可AI署名、须披露’，但细节混乱”的判断。",
 "学術誌の規則は「著者として認めない・開示義務」に収束したが細部は混乱しているという判断の根拠とする。"]);

E(38,"B","io",2023,"U.S. National Science Foundation, Notice to Research Community, 14 December 2023","Notice to Research Community: Use of Generative Artificial Intelligence Technology in the NSF Merit Review Process","https://www.nsf.gov/policies/ai/merit-review",
"NSF reviewers are prohibited from uploading any content from proposals",
["NSF 심사자는 신청서·심사 정보를 승인되지 않은 생성형 AI에 올릴 수 없고, 이를 어기면 기밀 서약 위반으로 본다. 신청자에게는 AI 사용 정도를 연구계획서에 밝히도록 권장한다. 금지의 근거가 '기밀 유지'라는 점이 핵심이며, 기관이 승인한 도구는 열어 두었다.",
 "NSF reviewers may not upload proposal or review content to non-approved generative AI tools; doing so is treated as a breach of the confidentiality pledge. Proposers are encouraged to state the extent of AI use in the project description. The ban rests on confidentiality, and it leaves room for agency-approved tools.",
 "Рецензентам NSF запрещено загружать материалы заявок и экспертизы в неодобренные генеративные ИИ — это нарушение обязательства о конфиденциальности. Заявителям рекомендуется указывать степень использования ИИ. Основание запрета — конфиденциальность, а одобренные агентством инструменты допускаются.",
 "NSF审稿人不得将申请书与评审信息上传至未经批准的生成式AI，违者视为违反保密承诺。鼓励申请人在项目说明中说明AI使用程度。禁止的依据是“保密”，并为机构批准的工具留有余地。",
 "NSFの審査者は申請書・審査情報を承認されていない生成AIにアップロードできず、違反は守秘誓約の違反とみなされる。申請者にはAIの使用程度を研究計画書に記すよう推奨する。禁止の根拠が「守秘」である点が核心で、機関が承認したツールには余地を残した。"],
["미국 연구비 심사 규칙의 1차 근거로 쓴다(NIH 공지는 자동 접속 차단으로 직접 확인하지 못해 제외).",
 "Primary evidence for US grant-review rules (NIH notices were excluded because automated access was blocked).",
 "Первичное основание для правил грантовой экспертизы в США (уведомления NIH исключены: автоматический доступ заблокирован).",
 "作为美国科研经费评审规则的一手依据（NIH公告因自动访问被拦截未能直接核实，故未纳入）。",
 "米国の研究費審査規則の一次根拠とする（NIHの告知は自動アクセスが遮断され直接確認できなかったため除外）。"]);

E(39,"B","io",2024,"UK Research and Innovation (UKRI), policy, 23 September 2024","Use of generative artificial intelligence in application preparation and assessment","https://www.ukri.org/publications/generative-artificial-intelligence-in-application-and-assessment-policy/use-of-generative-artificial-intelligence-in-application-preparation-and-assessment/",
"not use generative AI tools as part of their assessment activities",
["UKRI 심사자는 언어 다듬기 외에는 평가에 생성형 AI를 쓸 수 없고, 그때도 신청서 내용을 넣거나 요약·평가를 맡겨선 안 된다. 특히 '신청서가 AI로 쓰였는지 추측해 평가에 반영하지 말라'는 조항은 탐지기 오판을 막는 장치로 의미가 크다.",
 "UKRI assessors may not use generative AI in assessment except to refine language, and even then must not enter application content or task AI with summarising or evaluating it. The clause forbidding assessors to speculate whether an application used AI is a meaningful safeguard against detector misjudgement.",
 "Экспертам UKRI запрещено использовать генеративный ИИ в оценке, кроме правки языка, и даже тогда нельзя вводить содержание заявки или поручать ИИ её резюмировать и оценивать. Пункт, запрещающий гадать, писалась ли заявка с ИИ, — важная защита от ошибок детекторов.",
 "UKRI评审人除润色语言外不得在评审中使用生成式AI，即便润色也不得输入申请内容或让AI总结、评价。尤其“不得揣测申请书是否由AI撰写并据此评分”的条款，作为防止检测误判的机制意义重大。",
 "UKRIの審査者は言語の推敲以外で評価に生成AIを使えず、その場合も申請書の内容を入れたり要約・評価を任せたりしてはならない。とくに「申請書がAIで書かれたかを推測して評価に反映するな」という条項は、検出器の誤判定を防ぐ仕組みとして意義が大きい。"],
["영국 규칙의 1차 근거이자 '탐지보다 내용 평가'라는 원칙의 근거로 쓴다.",
 "Primary evidence for UK rules and for the principle of judging content rather than detecting AI.",
 "Первичное основание британских правил и принципа «оценивать содержание, а не искать ИИ».",
 "作为英国规则的一手依据，以及“评内容而非查AI”原则的依据。",
 "英国の規則の一次根拠であり、「検出より内容の評価」という原則の根拠とする。"]);

E(40,"B","io",2024,"European Commission, DG Research and Innovation, news article, 20 March 2024","Guidelines on the responsible use of generative AI in research developed by the European Research Area Forum","https://research-and-innovation.ec.europa.eu/news/all-research-and-innovation-news/guidelines-responsible-use-generative-ai-research-developed-european-research-area-forum-2024-03-20_en",
"refrain from using generative AI tools in sensitive activities such as peer reviews",
["EU 집행위원회와 유럽연구지역(ERA) 국가들이 만든 '살아 있는 지침'으로, 연구자는 동료심사·평가 같은 민감한 활동에서 생성형 AI 사용을 삼가고 연구기관은 사용을 지원·감시하도록 권고한다. 법적 구속력이 없는 권고이며, 회원국·기관마다 이행이 다르다.",
 "A 'living guidelines' document from the European Commission and European Research Area countries: researchers should refrain from generative AI in sensitive activities such as peer review and evaluation, and research organisations should support and monitor use. It is non-binding, and implementation differs across member states and institutions.",
 "«Живые руководства» Еврокомиссии и стран Европейского исследовательского пространства: исследователям следует воздерживаться от генеративного ИИ в чувствительных видах деятельности (рецензирование, оценка), а организациям — поддерживать и отслеживать использование. Документ необязателен, исполнение в странах и организациях различается.",
 "欧盟委员会与欧洲研究区（ERA）国家制定的“动态指南”，建议研究者在同行评审、评估等敏感活动中避免使用生成式AI，研究机构支持并监测使用。属无法律约束力的建议，各成员国与机构执行不一。",
 "EU欧州委員会と欧州研究圏（ERA）の国々が作った「生きた指針」で、研究者は査読・評価のような慎重を要する活動で生成AIの使用を控え、研究機関は利用を支援・監視するよう勧告する。法的拘束力のない勧告で、加盟国・機関ごとに実施が異なる。"],
["유럽의 '권고형' 접근의 1차 근거로 쓴다.",
 "Primary evidence for Europe's recommendation-based approach.",
 "Первичное основание «рекомендательного» подхода Европы.",
 "作为欧洲“建议型”路径的一手依据。",
 "欧州の「勧告型」アプローチの一次根拠とする。"]);

E(41,"B","io",2023,"National Natural Science Foundation of China (NSFC), Research Integrity Handbook (科研诚信规范手册), December 2023","国家自然科学基金《科研诚信规范手册》","https://www.nsfc.gov.cn/Portals/0/fj/fj20231221_01.pdf",
"使用生成式人工智能直接生成申报材料",
["중국 국가자연과학기금위원회 지침으로, 신청서를 생성형 AI로 '직접 생성'하는 것을 금지 행위로 열거하고, AI 생성 내용은 표시·설명하며 AI를 공동 성과자로 올리지 못하게 했다. 심사위원은 생성형 AI로 심사하려면 '사전에 기금위의 허가'를 받아야 한다. 과기부의 같은 시기 지침과 내용이 겹친다.",
 "The NSFC handbook lists 'directly generating application materials with generative AI' as prohibited, requires AI-generated content to be labelled and explained, and bars listing AI as a co-contributor. Reviewers must obtain NSFC's prior permission to use generative AI in review. It overlaps with the science ministry's guidance of the same period.",
 "Руководство NSFC относит к запрещённому «прямую генерацию заявочных материалов генеративным ИИ», требует маркировать и пояснять ИИ-содержание и запрещает указывать ИИ соисполнителем. Рецензенты для использования ИИ должны получить предварительное разрешение NSFC. Совпадает с руководством министерства науки того же времени.",
 "国家自然科学基金委手册将“使用生成式人工智能直接生成申报材料”列为禁止行为，要求标注并说明AI生成内容，不得将AI列为成果共同完成人。评审专家使用生成式AI评审须事先征得基金委许可。与科技部同期指引内容重叠。",
 "中国国家自然科学基金委員会の手引きで、申請書を生成AIで「直接生成」することを禁止行為に挙げ、AI生成内容は表示・説明し、AIを成果の共同完成者に挙げられないようにした。審査委員が生成AIで審査するには「事前に基金委の許可」が要る。同時期の科学技術部の指針と内容が重なる。"],
["중국의 '허가제' 접근(심사 AI는 기관 승인 하에)의 1차 근거로 쓴다.",
 "Primary evidence for China's permission-based approach (review AI only with the funder's approval).",
 "Первичное основание «разрешительного» подхода Китая (ИИ в экспертизе — только с одобрения фонда).",
 "作为中国“许可制”路径（评审用AI须经机构批准）的一手依据。",
 "中国の「許可制」アプローチ（審査AIは機関の承認の下で）の一次根拠とする。"]);

E(42,"B","io",2024,"中华人民共和国学位法 (Degree Law of the PRC), adopted 26 April 2024, effective 1 January 2025 (text via 12371.cn)","中华人民共和国学位法","https://www.12371.cn/2024/04/28/ARTI1714265542656277.shtml",
"被认定为存在代写、剽窃、伪造等学术不端行为",
["확정된 학위법 제37조는 학위논문의 '대필·표절·위조 등 학술 부정'이 인정되면 학위를 주지 않거나 취소하도록 했다. 2023년 초안에 있던 '인공지능 대필'이라는 표현은 확정 조문에 없다. 언론이 초안 표현을 확정 법률처럼 전한 사례가 많아 원문 대조가 필요했다. 조문은 공산당원망 게재본으로 확인했다.",
 "Article 37 of the final Degree Law withholds or revokes degrees when a thesis is found to involve 'ghostwriting, plagiarism, fabrication or other academic misconduct'. The 2023 draft's explicit phrase 'AI ghostwriting' is absent from the final text — many news reports presented the draft wording as law, so checking the original mattered. The text was verified on the version published by 12371.cn.",
 "Статья 37 окончательного Закона о степенях лишает степени или отказывает в ней при установлении «написания за автора, плагиата, фальсификации и иной недобросовестности». Формулировки «написание с помощью ИИ» из проекта 2023 года в окончательном тексте нет — многие СМИ подавали формулировку проекта как закон. Текст сверен по публикации 12371.cn.",
 "确定版《学位法》第三十七条规定，学位论文被认定存在“代写、剽窃、伪造等学术不端行为”的，不授予或撤销学位。2023年草案中的“人工智能代写”字样未出现在正式条文中。不少报道把草案措辞当作已生效法律转述，因此需要对照原文。条文依共产党员网刊载版本核实。",
 "確定した学位法第37条は、学位論文に「代筆・剽窃・偽造などの学術不正」が認定されれば学位を与えないか取り消すと定めた。2023年草案にあった「人工知能による代筆」という表現は確定条文にない。報道が草案の表現を確定した法律のように伝えた例が多く、原文との照合が必要だった。条文は共産党員網の掲載版で確認した。"],
["언론 보도를 1차 자료로 바로잡은 사례이자, 중국이 AI 대필을 '일반 대필' 조항으로 다룬다는 근거로 쓴다.",
 "A case of correcting press reports with the primary text, and evidence that China handles AI ghostwriting under the general ghostwriting clause.",
 "Пример исправления сообщений СМИ по первоисточнику и свидетельство, что Китай рассматривает ИИ-«гострайтинг» по общей норме о написании за автора.",
 "以一手资料纠正媒体报道的案例，并作为中国以“一般代写”条款处理AI代写的依据。",
 "報道を一次資料で正した事例であり、中国がAI代筆を「一般の代筆」条項で扱う根拠とする。"]);

E(43,"B","io",2026,"Ministry of Education, Culture, Sports, Science and Technology (MEXT), Council for Science and Technology, research funding subcommittee material, 2 June 2026","学術審査とAI（資料1）・審査支援AIエージェントの開発に向けた調査研究について（資料2）","https://www.mext.go.jp/content/20260602-mxt_gakjokik-000050033_1.pdf",
"審査においては直接に生成 AI を使用することを禁止している",
["문부과학성 심의회 자료로, 일본학술진흥회(JSPS)와 미국 NSF 등은 정보 유출 위험 때문에 심사에서 생성형 AI의 직접 사용을 금지한다고 정리하고, 국립정보학연구소(NII)가 2026~2027년 2,500만 엔으로 '국산 기반의 심사 지원 AI 에이전트'를 조사·설계한다고 밝혔다. AI for Science 신규 공모(SPReAD)에 1차에만 1만5천 건 넘게 응모했다는 내용도 담겼다.",
 "A MEXT council document summarising that JSPS, the US NSF and others prohibit direct use of generative AI in review because of leakage risk, and announcing that the National Institute of Informatics (NII) will study and design a review-support AI agent on a domestic platform in 2026–2027 with ¥25 million. It also notes the new AI for Science call (SPReAD) drew over 15,000 applications in its first round.",
 "Материал совета MEXT: JSPS, NSF США и другие запрещают прямое использование генеративного ИИ в экспертизе из-за риска утечек; Национальный институт информатики (NII) в 2026–2027 годах за 25 млн иен изучит и спроектирует ИИ-агента поддержки экспертизы на отечественной платформе. Также сообщается, что новый конкурс AI for Science (SPReAD) уже в первом раунде получил более 15 000 заявок.",
 "文部科学省审议会资料，归纳日本学术振兴会（JSPS）与美国NSF等因信息泄露风险禁止在评审中直接使用生成式AI，并宣布国立情报学研究所（NII）将于2026–2027年以2,500万日元调查设计“基于国产平台的评审支援AI智能体”。还提到AI for Science新征集（SPReAD）首轮申请即超过1.5万件。",
 "文部科学省の審議会資料で、日本学術振興会（JSPS）や米国NSFなどは情報流出の危険から審査で生成AIを直接使うことを禁じていると整理し、国立情報学研究所（NII）が2026〜2027年度に2,500万円で「国産基盤の審査支援AIエージェント」を調査・設計すると示した。AI for Scienceの新規公募（SPReAD）の第1回だけで応募が1万5千件を超えたことも記している。"],
["일본의 '금지 + 안전한 국산 AI 개발' 경로의 1차 근거로 쓴다.",
 "Primary evidence for Japan's path: prohibit now, build a secure domestic AI for review.",
 "Первичное основание японского пути: запрет сейчас и разработка безопасного отечественного ИИ для экспертизы.",
 "作为日本“当前禁止+开发安全国产AI”路径的一手依据。",
 "日本の「禁止＋安全な国産AIの開発」という経路の一次根拠とする。"]);

E(44,"B","io",2026,"National Research Foundation of Korea (NRF), guide (author: Lee Hyo-bin; published 30 June 2026), file hosted by Wonkwang University","대학 연구자를 위한 생성형 AI 연구윤리 가이드","https://wgs.wku.ac.kr/wp-content/uploads/sites/93/2026/07/대학_연구자를_위한_생성형_AI_연구윤리_가이드_배포용.pdf",
"생성형 AI가 생성한 문장은 반드시 연구자가 직접 검토하고 수정하여",
["한국연구재단이 발행한 연구 설계·수행·보고 단계별 생성형 AI 연구윤리 안내서로, 가짜 인용(환각)·잘못된 서지·저작권·보안 문제와 대응, 학술지 정책, 점검표를 담았다. 재단 누리집 원문 위치를 찾지 못해 대학이 배포한 같은 파일(발행처·발행일 표기 확인)로 인용했다. 구속력 있는 규정이 아니라 안내서다.",
 "An NRF-published guide to generative-AI research ethics at the design, conduct and reporting stages, covering fake (hallucinated) citations, wrong bibliographic data, copyright and security, with responses, journal policies and a checklist. Its location on the NRF site could not be found, so the identical file distributed by a university (publisher and date verified) is cited. It is guidance, not a binding rule.",
 "Руководство NRF по этике генеративного ИИ на этапах планирования, проведения и представления исследований: фальшивые (галлюцинированные) ссылки, ошибочные библиографические данные, авторское право, безопасность, меры реагирования, политики журналов и чек-лист. На сайте NRF файл не найден, поэтому цитируется идентичный файл, распространённый университетом (издатель и дата проверены). Это руководство, а не обязательная норма.",
 "韩国研究财团发行的按研究设计·实施·报告阶段划分的生成式AI研究伦理指南，涵盖虚假引用（幻觉）、错误书目、版权与安全问题及对策、期刊政策和检查表。未能在财团网站找到原文位置，故引用大学分发的同一文件（已核实发行方与日期）。属指南而非有约束力的规定。",
 "韓国研究財団が発行した、研究の設計・実施・報告の段階別の生成AI研究倫理の手引きで、偽の引用（幻覚）・誤った書誌・著作権・セキュリティの問題と対応、学術誌の方針、チェックリストを収める。財団サイト上の原文の場所が見つからなかったため、大学が配布した同じファイル（発行元・発行日の表記を確認）で引用した。拘束力のある規定ではなく手引きである。"],
["한국 대학 현장의 기준이 '공개와 연구자 책임'에 맞춰져 있다는 근거로 쓴다.",
 "Evidence that Korean university norms centre on disclosure and researcher responsibility.",
 "Свидетельство того, что нормы корейских вузов строятся на раскрытии и ответственности исследователя.",
 "作为韩国大学现场标准以“披露与研究者责任”为核心的依据。",
 "韓国の大学現場の基準が「開示と研究者の責任」に合わせられている根拠とする。"]);

E(45,"B","io",2026,"Ministry of Science and ICT (MSIT), Research Ethics and Rights Protection Division, press release of 20 September 2026 (reposted by KDI Economic Information and Education Center)","국가연구개발 AI 연구윤리 가이드 마련","https://eiec.kdi.re.kr/policy/materialView.do?num=287178",
"평가자가 대상 자료를 외부 AI에 입력하지 않고",
["과기정통부가 확정한 국가연구개발 AI 연구윤리 가이드의 보도자료(KDI 재게시본)로, AI를 연구 도구로 한정하고 책임은 연구자에게 두며 7대 권고(사실 검증·주체적 판단·투명성·결과 신뢰성·규정 준수·보안·개인정보)를 제시했다. 과제 평가·논문 심사에서 평가자의 외부 AI 입력 금지와 피평가자의 AI를 통한 평가 왜곡 금지를 명시했다. 관련 보도는 '숨은 프롬프트'가 연구부정이 될 수 있다고 전한다.",
 "MSIT's press release (reposted by KDI) on the finalised national R&D AI research-ethics guide: AI is limited to a research tool, responsibility stays with researchers, and seven recommendations are set (fact-checking, independent judgement, transparency, reliability of results, compliance, security, privacy). It states that evaluators must not enter materials into external AI and that those evaluated must not try to distort evaluation through AI; press coverage reports that hidden prompts can count as misconduct.",
 "Пресс-релиз MSIT (перепубликован KDI) об утверждённом руководстве по этике ИИ в госНИОКР: ИИ — лишь инструмент, ответственность — на исследователе, семь рекомендаций (проверка фактов, самостоятельное суждение, прозрачность, надёжность результатов, соблюдение правил, безопасность, защита данных). Эксперты не вводят материалы во внешний ИИ, а оцениваемым запрещено искажать оценку через ИИ; по данным СМИ, скрытые подсказки могут считаться недобросовестностью.",
 "科学技术信息通信部确定的国家研发AI研究伦理指南新闻稿（KDI转载）：将AI限定为研究工具、责任归于研究者，提出7项建议（事实核查、自主判断、透明、结果可靠、合规、安全、个人信息保护）。明确在课题评审与论文审稿中评审者不得将材料输入外部AI、被评审者不得借AI歪曲评审；相关报道称“隐藏提示词”可能构成科研不端。",
 "科学技術情報通信部が確定した国家研究開発AI研究倫理ガイドの報道資料（KDI再掲）で、AIを研究の道具に限り責任は研究者に置き、7つの勧告（事実検証・主体的判断・透明性・結果の信頼性・規定遵守・セキュリティ・個人情報）を示した。課題評価・論文審査で評価者が外部AIに資料を入力しないこと、被評価者がAIで評価を歪めようとしないことを明記した。関連報道は「隠しプロンプト」が研究不正になりうると伝える。"],
["한국의 국가 차원 규칙(2026.9)의 1차 근거로 쓴다.",
 "Primary evidence for Korea's national-level rule (September 2026).",
 "Первичное основание для общенационального правила Кореи (сентябрь 2026).",
 "作为韩国国家层面规则（2026.9）的一手依据。",
 "韓国の国レベルの規則（2026.9）の一次根拠とする。"]);

E(46,"C","press",2024,"ComNews (Russia), 25 October 2024","Новый ГОСТ разрешил ученым использовать ИИ","https://www.comnews.ru/content/235914/2024-10-25/2024-w43/1008/novyy-gost-razreshil-uchenym-ispolzovat-ii",
"но писать научные статьи ученым придется самостоятельно",
["러시아 연방기술규제청이 공표한 국가표준 GOST R 71657-2024(2025.1.1 시행)가 정보 수집·저장·처리에 AI를 허용하되 논문은 연구자가 직접 써야 하고 AI는 저자가 될 수 없다고 정했다고 전한다. 표준 원문은 확인하지 못해 언론 보도(C)로 인용했고, 표준은 권고적 성격이 강하다.",
 "Reports that Russia's national standard GOST R 71657-2024 (in force 1 January 2025), published by the federal standards agency, allows AI for collecting, storing and processing information but requires researchers to write papers themselves and bars AI authorship. The standard's text could not be checked, so it is cited via the press (C); standards are largely advisory.",
 "Сообщает, что ГОСТ Р 71657-2024 (вступил в силу 1 января 2025 года), опубликованный Росстандартом, допускает ИИ для сбора, хранения и обработки информации, но статьи учёные должны писать сами, а ИИ не может быть автором. Текст стандарта проверить не удалось, поэтому цитируется по СМИ (C); стандарты носят во многом рекомендательный характер.",
 "报道俄罗斯联邦技术监管与计量署发布的国家标准GOST R 71657-2024（2025年1月1日实施）允许AI用于信息收集、存储与处理，但论文须由研究者亲自撰写，AI不能成为作者。未能核对标准原文，故以媒体报道（C）引用；标准多为推荐性质。",
 "ロシア連邦技術規制庁が公表した国家規格GOST R 71657-2024（2025年1月1日施行）が、情報の収集・保存・処理にAIを認める一方、論文は研究者自身が書かねばならずAIは著者になれないと定めたと伝える。規格の原文は確認できなかったため報道（C）で引用し、規格は勧告的な性格が強い。"],
["러시아의 '표준·권고 중심' 접근의 단서로만 쓴다.",
 "Used only as a clue to Russia's standards-and-guidance approach.",
 "Используется лишь как указание на подход России через стандарты и рекомендации.",
 "仅作为俄罗斯“以标准和建议为主”路径的线索。",
 "ロシアの「規格・勧告中心」のアプローチの手がかりとしてのみ使う。"]);

E(47,"C","press",2026,"Nikita Shevtsev, Inc. Russia (incrussia.ru), 2026","ВАК предлагает разрешить использование ИИ в диссертациях, но с ограничениями","https://incrussia.ru/news/vak-predlagaet-razreshit-ispolzovanie-ii-v-dissertatsiyah-no-s-ogranicheniyami/",
"Галажинский предложил ВАК занять разграничительную, а не запретительную позицию",
["러시아 고등학위위원회(VAK) 부위원장인 톰스크국립대 총장이 인문사회 분야 학위논문에서 AI를 맞춤법·형식·서지 점검과 초벌 문헌 탐색에는 허용하고, 문헌 검토·신규성·결론·심사평에는 금지하자는 메모를 냈다고 전한다. 제안 단계이고 언론 보도라 C로 둔다.",
 "Reports that the rector of Tomsk State University, a deputy chair of Russia's Higher Attestation Commission (VAK), proposed for social sciences and humanities theses that AI be allowed for spelling, formatting, bibliography checks and initial literature search, but banned for literature reviews, novelty claims, conclusions and reviews. It is a proposal reported by the press, so it is graded C.",
 "Сообщает, что ректор ТГУ, заместитель председателя ВАК, предложил для социально-гуманитарных диссертаций допускать ИИ для орфографии, оформления, проверки библиографии и первичного подбора литературы, но запретить его в обзоре литературы, формулировке новизны, выводах и рецензиях. Это предложение, изложенное в СМИ, поэтому класс C.",
 "报道俄罗斯高等学位委员会（VAK）副主席、托木斯克国立大学校长提出备忘录：人文社科学位论文中允许AI用于拼写、格式、书目核对与初步文献检索，禁止用于文献综述、创新性表述、结论与评审意见。属建议阶段且为媒体报道，故定为C。",
 "ロシア高等学位委員会（VAK）副委員長のトムスク国立大学学長が、人文社会系の学位論文でAIを綴り・書式・書誌点検や下調べの文献探索には認め、文献レビュー・新規性・結論・審査意見には禁じるべきだとするメモを出したと伝える。提案段階で報道なのでCとする。"],
["러시아의 '구분형' 규칙 논의의 단서로만 쓴다.",
 "Used only as a clue to Russia's debate on a differentiated rule.",
 "Используется лишь как указание на российскую дискуссию о разграничительном правиле.",
 "仅作为俄罗斯“区分型”规则讨论的线索。",
 "ロシアの「区分型」規則の議論の手がかりとしてのみ使う。"]);

SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[1,2,3,7],["AI는 이미 학계의 '보이지 않는 공동 저자이자 공동 심사자'다: 컴퓨터과학 논문 문장의 최대 22%, 2024년 생의학 초록의 최소 13.5%에 LLM의 흔적이 있고, AI 학회 심사평의 6.5~16.9%가 LLM으로 상당히 고쳐 쓰였으며, 한 출판사 조사에서는 심사자의 53%가 AI 도구를 쓴다고 답했다.",
  "AI is already academia's invisible co-author and co-reviewer: up to 22% of sentences in computer-science papers and at least 13.5% of 2024 biomedical abstracts carry LLM traces, 6.5–16.9% of AI-conference review text was substantially rewritten by LLMs, and in one publisher's survey 53% of reviewers said they use AI tools.",
  "ИИ уже стал «невидимым соавтором и сорецензентом» науки: следы LLM есть в до 22% предложений статей по информатике и как минимум в 13,5% биомедицинских аннотаций 2024 года, 6,5–16,9% текста рецензий на конференциях по ИИ существенно переписаны LLM, а в опросе одного издательства 53% рецензентов сообщили, что пользуются ИИ.",
  "AI已是学术界“看不见的共同作者与共同审稿人”：计算机科学论文中最多22%的句子、2024年生物医学摘要中至少13.5%带有LLM痕迹，AI学会审稿意见中6.5–16.9%的文字被LLM大幅改写，一家出版社的调查中53%的审稿人表示使用AI工具。",
  "AIはすでに学界の「見えない共著者であり共同査読者」である。コンピュータ科学論文の文の最大22%、2024年の生物医学抄録の少なくとも13.5%にLLMの痕跡があり、AI学会の査読コメントの6.5〜16.9%がLLMで大きく書き換えられ、ある出版社の調査では査読者の53%がAIツールを使うと答えた。"],
  ["수치마다 대상·방법·시점이 달라 하나의 비율로 합치지 않는다. 53%는 자발 응답 조사(C)다.","Each figure differs in population, method and timing, so they are not merged into one rate. The 53% comes from a self-selected survey (C).","Цифры различаются по совокупности, методу и времени, поэтому их не сводят в одну долю. 53% — опрос самоотбора (C).","各数字的对象、方法、时间不同，不合并为单一比例。53%来自自愿应答调查（C）。","数値ごとに対象・方法・時点が異なるため一つの割合にはまとめない。53%は自発回答の調査（C）である。"],"H"),
 s("D",[30,32,33],["논문의 양은 심사 능력보다 빠르게 늘고 있다: arXiv 신규 투고는 2022년 18만5,692건에서 2025년 28만4,486건으로 53% 늘었고 2026년은 11월에 이미 2025년을 넘었다. 다만 'LLM이 연구자 생산성을 23.7~89.3% 높였다'는 추정은 측정 방식 자체가 가짜 효과를 만든다는 반박을 받고 있다.",
  "Paper volume is outgrowing review capacity: new arXiv submissions rose 53% from 185,692 in 2022 to 284,486 in 2025, and 2026 had already passed 2025 by November. But the estimate that LLMs raised researchers' output by 23.7–89.3% faces a rebuttal showing that its measurement design itself creates spurious effects.",
  "Объём статей растёт быстрее возможностей рецензирования: новые подачи в arXiv выросли на 53% — с 185 692 в 2022 году до 284 486 в 2025-м, а 2026 год уже в ноябре превзошёл 2025-й. Однако оценку, что LLM повысили выпуск исследователей на 23,7–89,3%, оспаривают: сам способ измерения порождает ложный эффект.",
  "论文数量的增长快于审稿能力：arXiv新投稿从2022年的185,692篇增至2025年的284,486篇，增长53%，2026年在11月就已超过2025年。不过“LLM使研究者产出提高23.7–89.3%”的估计受到反驳：其测量方式本身就会制造虚假效应。",
  "論文の量は査読能力より速く増えている。arXivの新規投稿は2022年の18万5,692件から2025年の28万4,486件へ53%増え、2026年は11月の時点で2025年を上回った。ただし「LLMが研究者の生産性を23.7〜89.3%高めた」という推定は、測定方法そのものが見かけの効果を生むという反論を受けている。"],null,"H"),
 s("D",[34,32],["개인에게는 이득, 과학 전체에는 시야 축소라는 역설이 가장 강한 근거로 확인된다: AI를 활용한 연구자는 논문 3.02배, 피인용 4.84배의 이득을 보지만 과학 전체의 연구 주제 범위는 4.63%, 연구자 간 교류는 22% 줄었고, 화려한 문장은 더 이상 좋은 연구의 신호가 아니다.",
  "The strongest evidence confirms a paradox — gains for individuals, narrowing for science: AI-using scientists publish 3.02 times more papers and receive 4.84 times more citations, yet science as a whole studies 4.63% less topic volume with 22% less engagement among scientists, and polished prose is no longer a signal of good research.",
  "Самые сильные данные подтверждают парадокс — выгода для отдельных учёных, сужение для науки: использующие ИИ публикуют в 3,02 раза больше и получают в 4,84 раза больше цитирований, но наука в целом сужает объём тем на 4,63% и взаимодействие учёных на 22%, а гладкий текст больше не сигнал хорошего исследования.",
  "最有力的依据证实了一个悖论——个人获益、科学整体视野收窄：使用AI的研究者论文多3.02倍、引用多4.84倍，但科学整体的研究主题范围缩小4.63%、研究者间互动减少22%，华丽的文字也不再是好研究的信号。",
  "個人には利益、科学全体には視野の縮小という逆説が最も強い根拠で確認される。AIを活用する研究者は論文3.02倍、被引用4.84倍の利益を得るが、科学全体の研究テーマの範囲は4.63%、研究者間の交流は22%縮み、凝った文章はもはや良い研究のシグナルではない。"],
  ["4.63%·22%는 주로 기계학습 활용 연구에 대한 결과로, 생성형 AI 글쓰기의 효과와 같지 않다.","The 4.63% and 22% mainly concern machine-learning-based research, not the effect of generative-AI writing.","4,63% и 22% относятся главным образом к исследованиям с машинным обучением, а не к эффекту письма с генеративным ИИ.","4.63%与22%主要针对使用机器学习的研究，不等同于生成式AI写作的效果。","4.63%・22%は主に機械学習を用いた研究についての結果で、生成AIによる執筆の効果と同じではない。"],"H"),
 s("D",[21,22,20,10],["가짜 인용은 최상위 학회까지 뚫었다: NeurIPS 2025 채택 논문 53편(약 1%)에서 가짜 인용 100개가 3~5명의 심사를 통과했고, 자연어처리 학회에서는 약 300편이 발견됐으며 절반이 가장 최근 학회에 몰렸다. ICLR은 이를 단순 실수가 아니라 윤리 위반으로 규정했다.",
  "Fake citations have reached the top venues: 100 fabricated citations in 53 NeurIPS 2025 accepted papers (about 1%) passed 3–5 reviewers each, nearly 300 papers were found at NLP conferences with half at the most recent one, and ICLR has defined them as an ethics violation rather than a slip.",
  "Фальшивые ссылки дошли до ведущих конференций: 100 выдуманных ссылок в 53 принятых статьях NeurIPS 2025 (около 1%) прошли 3–5 рецензентов, на конференциях по обработке языка найдено почти 300 таких статей, половина — на последней, а ICLR квалифицировала это как нарушение этики, а не оплошность.",
  "虚假引用已攻破顶级学会：NeurIPS 2025录用论文中有53篇（约1%）的100条虚假引用通过了每篇3–5名审稿人的审查，自然语言处理学会发现约300篇，其中一半集中在最近一届；ICLR将其定性为违反伦理而非简单失误。",
  "偽の引用は最上位の学会まで突破した。NeurIPS 2025の採択論文53本（約1%）で偽の引用100件が3〜5人の査読を通過し、自然言語処理の学会では約300本が見つかりその半数が最新の学会に集中した。ICLRはこれを単なるミスではなく倫理違反と規定した。"],null,"H"),
 s("D",[16,18,19,15],["새로운 부정 유형도 나타났다: 사람 눈에 안 보이게 'AI 심사자는 긍정 평가만 하라'는 지시문을 숨긴 원고가 2025년 여러 나라 대학에서 발견됐고(KAIST 3편 철회 포함), 2026년 11월에는 그런 지시문이 든 출판 논문이 철회됐다. 실험에서는 심사의 5%만 조작돼도 논문 12%가 상위권에서 밀려날 수 있었다.",
  "A new form of misconduct has appeared: in 2025 manuscripts from universities in several countries were found with invisible instructions telling AI reviewers to give only positive reviews (including three KAIST papers, since withdrawn), and in November 2026 a published paper containing such an instruction was retracted. In experiments, manipulating just 5% of reviews could push 12% of papers out of the top ranks.",
  "Появился новый вид недобросовестности: в 2025 году в рукописях вузов нескольких стран нашли невидимые человеку указания ИИ-рецензентам давать только положительные отзывы (включая три статьи KAIST, отозванные), а в ноябре 2026 года отозвана опубликованная статья с такой инструкцией. В экспериментах манипуляция лишь 5% рецензий могла вытеснить 12% статей из верхних позиций.",
  "新型不端也已出现：2025年在多国大学的原稿中发现了人眼看不见、要求“AI审稿人只给正面评价”的隐藏指令（包括已撤回的3篇KAIST论文），2026年11月一篇含此类指令的正式出版论文被撤稿。实验中仅操纵5%的审稿，就可能使12%的论文跌出前列。",
  "新しい不正の類型も現れた。人の目に見えないように「AI査読者は肯定的な評価だけをせよ」という指示を隠した原稿が2025年に複数国の大学で見つかり（KAISTの3本の撤回を含む）、2026年11月にはそうした指示を含む出版論文が撤回された。実験では査読の5%を操作するだけで論文の12%が上位から押し出されうる。"],null,"H"),
 s("D",[37,38,39,40,41,43,45,8],["규칙은 빠르게 수렴했다: 상위 학술지의 87%가 지침을 두고 거의 모두가 AI의 저자 인정을 금지하며, 미국 NSF·영국 UKRI·일본 JSPS·한국 과기정통부(2026.9)는 심사자가 신청서·원고를 외부 AI에 넣지 못하게 했고, EU는 심사에서 AI 사용을 삼가도록 권고했으며, 중국은 기관 허가제를 택했다. ICML 2026은 규정을 어긴 심사자 398명의 논문 497편을 탈락시켜 실제 제재를 시작했다.",
  "Rules have converged quickly: 87% of top journals have guidance and nearly all bar AI authorship; the US NSF, UK UKRI, Japan's JSPS and Korea's science ministry (September 2026) bar reviewers from entering applications or manuscripts into external AI, the EU recommends refraining from AI in review, and China chose a funder-permission system. ICML 2026 began real sanctions by desk-rejecting 497 papers of 398 rule-breaking reviewers.",
  "Правила быстро сошлись: у 87% ведущих журналов есть руководства, и почти все запрещают ИИ быть автором; NSF США, UKRI Великобритании, японское JSPS и корейское министерство науки (сентябрь 2026) запрещают рецензентам вводить заявки и рукописи во внешний ИИ, ЕС рекомендует воздерживаться от ИИ в рецензировании, а Китай выбрал систему разрешений фонда. ICML 2026 перешла к реальным санкциям, отклонив 497 статей 398 нарушивших правила рецензентов.",
  "规则迅速收敛：前列期刊87%制定了指南，几乎全部禁止AI署名；美国NSF、英国UKRI、日本JSPS和韩国科学技术信息通信部（2026.9）禁止审稿人把申请书或稿件输入外部AI，欧盟建议在评审中避免使用AI，中国则采取机构许可制。ICML 2026直接拒绝398名违规审稿人的497篇论文，开始实际制裁。",
  "規則は急速に収束した。上位学術誌の87%が指針を持ちほぼすべてがAIを著者と認めず、米NSF・英UKRI・日本のJSPS・韓国の科学技術情報通信部（2026.9）は審査者が申請書や原稿を外部AIに入れることを禁じ、EUは審査でのAI使用を控えるよう勧告し、中国は機関の許可制を選んだ。ICML 2026は規定に違反した査読者398人の論文497本を不採択にし、実際の制裁を始めた。"],null,"H"),
 s("D",[28,29,13,6],["그러나 병목은 금지가 아니라 검증이다: AI 탐지기는 비영어권 연구자의 글을 AI로 오판하고, 전문가도 AI 초록의 68%만 가려냈으며, AI의 연구비 지원서 채점은 전문가 점수와의 상관이 평균 0.22에 그쳤다. 처벌을 탐지기에 맡기면 한국·일본·중국 연구자가 먼저 억울한 피해를 볼 수 있다.",
  "Yet the bottleneck is verification, not prohibition: AI detectors misclassify non-native writers' text as AI, experts spotted only 68% of AI abstracts, and AI scoring of grant proposals correlated with expert scores at only 0.22 on average. If sanctions rest on detectors, Korean, Japanese and Chinese researchers may be the first to be wrongly penalised.",
  "Но узкое место — проверка, а не запрет: детекторы принимают тексты неносителей английского за ИИ, эксперты распознали лишь 68% ИИ-аннотаций, а ИИ-оценки грантовых заявок коррелировали с экспертными в среднем лишь на 0,22. Если санкции опираются на детекторы, первыми несправедливо пострадать могут корейские, японские и китайские исследователи.",
  "但瓶颈在核查而非禁止：AI检测器会把非英语母语研究者的文字误判为AI，专家也只识别出68%的AI摘要，AI对科研经费申请书的打分与专家评分的相关平均仅0.22。若把处罚交给检测器，韩、日、中研究者可能最先蒙受冤屈。",
  "しかし隘路は禁止ではなく検証である。AI検出器は非英語圏の研究者の文章をAI作と誤判定し、専門家もAI抄録の68%しか見抜けず、AIによる研究費申請書の採点は専門家の点数との相関が平均0.22にとどまった。処罰を検出器に任せれば、韓国・日本・中国の研究者が真っ先に不当な被害を受けかねない。"],null,"M"),
 s("D",[],["MCMC 시뮬레이션의 2035년 글로벌 확률은 S2 이중 트랙의 과학 {S2}, S3 검증 붕괴 {S3}, S1 증강된 과학 {S1}, S4 제동 걸린 도입 {S4}이며, AI 도입 자체보다 '검증 인프라가 양을 따라잡느냐'가 갈림길이다.",
  "The MCMC simulation's 2035 global probabilities are S2 Two-tier science {S2}, S3 Verification collapse {S3}, S1 Augmented science {S1} and S4 Restrained adoption {S4}; the fork is not AI adoption itself but whether verification infrastructure keeps up with volume.",
  "Глобальные вероятности MCMC-симуляции на 2035 год: S2 «Двухуровневая наука» {S2}, S3 «Крах проверки» {S3}, S1 «Усиленная наука» {S1}, S4 «Сдержанное внедрение» {S4}; развилка — не само внедрение ИИ, а то, успеет ли инфраструктура проверки за объёмом.",
  "MCMC模拟的2035年全球概率为：S2双轨科学{S2}、S3核查崩溃{S3}、S1增强的科学{S1}、S4受抑制的引入{S4}；分岔点不在AI引入本身，而在核查基础设施能否跟上数量。",
  "MCMCシミュレーションによる2035年のグローバル確率は、S2二層の科学{S2}、S3検証の崩壊{S3}、S1増強された科学{S1}、S4歯止めのかかった導入{S4}であり、AI導入そのものより「検証インフラが量に追いつけるか」が分かれ道である。"],null,"M")
)],
[KJ(
 s("D",[1,2,3],["컴퓨터과학 논문 문장의 최대 22%, 생의학 초록의 최소 13.5%, AI 학회 심사평의 6.5~16.9%에 LLM의 흔적이 있다.","LLM traces appear in up to 22% of computer-science sentences, at least 13.5% of biomedical abstracts and 6.5–16.9% of AI-conference review text.","Следы LLM — в до 22% предложений по информатике, не менее 13,5% биомедицинских аннотаций и 6,5–16,9% текста рецензий конференций по ИИ.","计算机科学论文最多22%的句子、生物医学摘要至少13.5%、AI学会审稿意见6.5–16.9%带有LLM痕迹。","コンピュータ科学論文の文の最大22%、生物医学抄録の少なくとも13.5%、AI学会の査読コメントの6.5〜16.9%にLLMの痕跡がある。"],null,"H"),
 s("D",[34,30],["논문은 늘고(arXiv 3년 새 +53%) 개인은 이득을 보지만, 과학 전체의 주제 범위는 4.63% 줄었다.","Papers multiply (arXiv +53% in three years) and individuals gain, but science's topic range shrank by 4.63%.","Статей больше (arXiv +53% за три года), отдельные учёные выигрывают, но тематический охват науки сузился на 4,63%.","论文在增加（arXiv三年+53%），个人获益，但科学整体主题范围缩小4.63%。","論文は増え（arXivは3年で+53%）個人は得をするが、科学全体のテーマの範囲は4.63%縮んだ。"],null,"H"),
 s("D",[21,19,8],["가짜 인용은 NeurIPS 채택 논문의 약 1%에 들어갔고, AI 심사자를 속이는 숨은 지시문은 출판 논문 철회로까지 이어졌으며, 학회는 497편 탈락이라는 제재를 시작했다.","Fake citations entered about 1% of NeurIPS acceptances, hidden prompts to fool AI reviewers led to a published paper's retraction, and conferences began sanctions with 497 desk rejections.","Фальшивые ссылки попали примерно в 1% принятых статей NeurIPS, скрытые подсказки для ИИ-рецензентов привели к отзыву опубликованной статьи, а конференции начали санкции — 497 отклонений.","虚假引用进入了约1%的NeurIPS录用论文，欺骗AI审稿人的隐藏指令已导致正式论文撤稿，学会开始以497篇拒稿实施制裁。","偽の引用はNeurIPS採択論文の約1%に入り、AI査読者を欺く隠し指示は出版論文の撤回にまで至り、学会は497本の不採択という制裁を始めた。"],null,"H"),
 s("D",[28,13],["갈림길은 금지가 아니라 검증 인프라이며, 2035년 확률은 S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}이다.","The fork is verification infrastructure, not prohibition; 2035 probabilities are S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","Развилка — инфраструктура проверки, а не запрет; вероятности на 2035 год: S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","分岔点是核查基础设施而非禁止；2035年概率为S2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}。","分かれ道は禁止ではなく検証インフラで、2035年の確率はS2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}である。"],null,"M")
)]);

SEC("frame",["문제 정의와 분석 틀","Problem Definition and Analytical Framework","Постановка проблемы и аналитическая рамка","问题界定与分析框架","問題の定義と分析の枠組み"],
[P(
 s("D",[],["이 보고서의 '학계'는 연구를 만들고(쓰기·실험), 검증하고(동료심사·편집·연구비 심사), 공로를 나누는(저자·인용·학위·승진) 체계를 뜻하며, 대학 교육과 사교육은 2026년 11월 22일 보고서에서 따로 다뤘다.",
  "In this report 'academia' means the system that produces research (writing, experiments), verifies it (peer review, editing, grant review) and allocates credit (authorship, citation, degrees, promotion); university teaching and private tutoring were covered separately in the report of 22 November 2026.",
  "«Наука» в этом докладе — система, которая производит исследования (письмо, эксперименты), проверяет их (рецензирование, редактура, грантовая экспертиза) и распределяет заслуги (авторство, цитирование, степени, продвижение); вузовское обучение и репетиторство рассмотрены отдельно в докладе от 22 ноября 2026 года.",
  "本报告中的“学术界”指生产研究（写作、实验）、核查研究（同行评审、编辑、经费评审）并分配功劳（署名、引用、学位、晋升）的体系；大学教学与课外辅导已在2026年11月22日的报告中另行讨论。",
  "本報告の「学界」とは、研究を生み出し（執筆・実験）、検証し（査読・編集・研究費審査）、功績を分け合う（著者・引用・学位・昇進）仕組みを指し、大学教育と私教育は2026年11月22日の報告で別に扱った。"]),
 s("D",[],["핵심 질문은 세 가지다: AI는 연구 생산과 검증에 실제로 얼마나 들어왔나, 그 결과 과학의 신뢰와 다양성은 강해지는가 약해지는가, 그리고 한국·일본·중국·러시아·미국·영국·EU의 규칙은 이 변화를 따라가고 있나.",
  "There are three core questions: how far AI has actually entered research production and verification; whether trust in and diversity of science are strengthening or weakening as a result; and whether the rules in Korea, Japan, China, Russia, the US, the UK and the EU are keeping up.",
  "Три ключевых вопроса: насколько ИИ реально вошёл в производство и проверку исследований; укрепляются или слабеют в результате доверие к науке и её разнообразие; и поспевают ли за переменами правила Кореи, Японии, Китая, России, США, Великобритании и ЕС.",
  "核心问题有三：AI实际进入研究生产与核查的程度如何；科学的可信度与多样性因此增强还是削弱；韩国、日本、中国、俄罗斯、美国、英国、欧盟的规则是否跟上这一变化。",
  "中心となる問いは三つである。AIは研究の生産と検証に実際どれほど入り込んだか、その結果として科学の信頼と多様性は強まるのか弱まるのか、そして韓国・日本・中国・ロシア・米国・英国・EUの規則はこの変化に追いついているか。"]),
 s("D",[1,30,37],["분석 틀은 세 축이다: A(연구 생산·심사에 AI가 스며든 정도), I(학술지·학회·연구비 기관·정부의 무결성 대응), L(심사 역량·연구 다양성·탐지의 공정성 같은 신뢰의 완충력).",
  "The framework has three axes: A (how far AI permeates research production and review), I (the integrity response of journals, conferences, funders and governments) and L (the trust buffer — review capacity, research diversity, fairness of detection).",
  "Рамка из трёх осей: A (степень проникновения ИИ в производство исследований и рецензирование), I (ответ журналов, конференций, фондов и правительств в сфере добросовестности) и L (буфер доверия — потенциал рецензирования, разнообразие исследований, справедливость детекции).",
  "分析框架有三轴：A（AI渗入研究生产与审稿的程度）、I（期刊、学会、资助机构、政府的诚信应对）、L（信任缓冲力：审稿能力、研究多样性、检测公平性）。",
  "分析の枠組みは三軸である。A（研究の生産・査読にAIが浸透した程度）、I（学術誌・学会・研究費配分機関・政府の公正さへの対応）、L（査読能力・研究の多様性・検出の公平性といった信頼の緩衝力）。"]),
 s("D",[25,26,27],["여기에 D(실적 압박 마찰)를 더한다: 논문 수로 평가받는 압력이 클수록 같은 규칙도 덜 작동한다는 가정으로, 논문공장 산업과 국가별 철회율 자료를 근거로 국가별로 다르게 둔다.",
  "We add D (publication-pressure friction): the assumption that the stronger the pressure to be judged by paper counts, the less the same rules work, set differently by country on the basis of evidence on the paper-mill industry and national retraction rates.",
  "Добавляется D (трение публикационного давления): чем сильнее давление оценивать по числу статей, тем хуже работают те же правила; значения различаются по странам на основе данных о «фабриках статей» и национальных долях отзывов.",
  "再加上D（业绩压力摩擦）：假设以论文数量评价的压力越大，同样的规则越难奏效，并依据论文工厂产业与各国撤稿率资料按国家设定不同数值。",
  "ここにD（業績圧力の摩擦）を加える。論文数で評価される圧力が大きいほど同じ規則も効きにくいという仮定で、論文工場の産業と国別の撤回率の資料を根拠に国ごとに異なる値を置く。"]),
 s("D",[],["문장마다 근거 등급을 붙였다: A는 동료심사 실증 논문·공식 통계, B는 정부·국제기구·학회의 공식 문서와 방법이 공개된 연구, C는 언론·기업 자료, D는 여러 근거를 종합한 분석적 추론이다.",
  "Every sentence carries an evidence grade: A for peer-reviewed empirical papers and official statistics, B for official documents of governments, international bodies and conferences and for studies with disclosed methods, C for press and company material, and D for analytic inference synthesising several sources.",
  "Каждое предложение имеет класс доказательности: A — рецензируемые эмпирические статьи и официальная статистика, B — официальные документы правительств, международных органов и конференций и исследования с раскрытой методикой, C — СМИ и данные компаний, D — аналитический вывод из нескольких источников.",

 s("D",[5,6,28],["측정 문제를 먼저 밝힌다: 'AI가 쓴 글' 비율은 집단 추정(근거 1·2·3)과 개별 탐지기(근거 5·6)가 크게 다르며, 개별 탐지기는 오판과 편향이 있어 이 보고서는 집단 추정을 우선한다.",

SEC("write",["현재 ①: 논문 쓰기 — AI 문장은 이미 표준이 됐다","Now ①: Writing — AI Prose Is Already the Norm","Сейчас ①: письмо — ИИ-текст уже стал нормой","现状①：论文写作——AI文字已成常态","現在①：論文執筆——AIの文章はすでに標準になった"],
[P(

 s("A",[2],["생의학은 더 넓다: 펍메드 초록 1,500만여 편의 '초과 단어' 분석에서 2024년 초록의 최소 13.5%가 LLM을 거쳤고, 일부 분야·국가·학술지 집단에서는 하한이 40%에 이르렀으며, 그 충격은 코로나19 같은 세계적 사건이 학술 문체에 준 영향을 넘어섰다.",
  "Biomedicine is broader still: an excess-word analysis of over 15 million PubMed abstracts found at least 13.5% of 2024 abstracts went through an LLM, with the lower bound reaching 40% in some field, country and journal groups — an impact on scientific writing exceeding that of world events such as COVID-19.",
  "В биомедицине охват ещё шире: анализ «избыточных слов» в более чем 15 млн аннотаций PubMed показал, что минимум 13,5% аннотаций 2024 года прошли через LLM, а в ряде групп по областям, странам и журналам нижняя граница доходила до 40% — влияние на научный стиль сильнее, чем у таких событий, как COVID-19.",

 s("D",[1,2,37,44],["판단: 문장을 다듬는 데 AI를 쓰는 것 자체는 이미 학계의 표준 관행이고 대부분의 학술지·지침도 이를 허용하므로, 쟁점은 '썼느냐'가 아니라 '밝혔느냐'와 '내용을 연구자가 검증했느냐'로 옮겨 갔다.",

  "For researchers whose first language is not English, AI writing also reduces a long-standing disadvantage, so rules that treat all writing use with suspicion can actually harm fairness.",

[P(
 s("B",[3],["ChatGPT 출시 이후 주요 AI 학회 4곳의 심사평 문장 중 6.5~16.9%가 맞춤법 수준을 넘어 LLM으로 상당히 고쳐 쓰였고, 마감 직전에 낸 심사와 저자 답변에 덜 반응하는 심사자에게서 비율이 높았다.",

  "После выхода ChatGPT 6,5–16,9% текста рецензий на четырёх крупных конференциях по ИИ были существенно переписаны LLM сверх орфографии; доля выше у рецензий, поданных перед дедлайном, и у рецензентов, реже отвечающих авторам.",
  "ChatGPT发布后，四个主要AI学会审稿意见中有6.5–16.9%的文字被LLM大幅改写（超出拼写检查），临近截止提交的审稿和较少回应作者答辩的审稿人比例更高。",

 s("B",[4],["점수도 움직인다: ICLR 2024 심사평의 최소 15.8%가 AI 도움을 받았고, 같은 논문의 점수 쌍에서 AI 도움 심사가 더 높은 점수를 준 경우가 53.4%, 채택 경계선 논문은 AI 도움 심사를 받으면 채택 확률이 4.9%p 높았다.",
  "Scores move too: at least 15.8% of ICLR 2024 reviews were AI-assisted; within score pairs for the same paper the AI-assisted review scored higher 53.4% of the time, and borderline papers that received one were 4.9 percentage points more likely to be accepted.",

 s("C",[5,6],["2026년 ICLR에서는 심사평 7만5,800건 중 21%가 '전부 AI가 쓴 것'으로 판정됐다는 탐지 기업 분석이 논란을 일으켰지만, 이 수치는 기업 자체 모델에 의존하고 사람과 AI가 섞인 글에서 탐지기가 가장 약하다는 한계가 있다.",
  "At ICLR 2026 a detection firm's analysis that 21% of 75,800 reviews were 'fully AI-written' caused uproar, but the figure depends on the company's own model, and detectors are weakest on text that mixes human and AI writing.",
  "На ICLR 2026 вызвал скандал вывод компании-детектора, что 21% из 75 800 рецензий «полностью написаны ИИ», но цифра зависит от собственной модели компании, а детекторы слабее всего на смешанных текстах человека и ИИ.",
  "ICLR 2026上，检测公司称75,800份审稿中21%“完全由AI撰写”的分析引发争议，但该数字依赖公司自有模型，且检测器在人机混合文字上最弱。",
  "2026年のICLRでは、査読7万5,800件の21%が「全面的にAIが書いた」と判定されたという検出企業の分析が論争を呼んだが、この数値は同社のモデルに依存し、人とAIが混じった文章で検出器が最も弱いという限界がある。"],null,"L"),
 s("C",[7],["출판사 프런티어스의 2025년 자발 응답 조사에서는 심사자의 53%가 AI 도구를 쓴다고 답했고, 중국(77%)과 초기 경력 연구자(87%)에서 채택이 특히 높았다.",
  "In a 2025 self-selected survey by the publisher Frontiers, 53% of reviewers said they use AI tools, with especially high adoption in China (77%) and among early-career researchers (87%).",
  "В опросе издательства Frontiers 2025 года (самоотбор) 53% рецензентов сообщили, что пользуются ИИ; особенно высока доля в Китае (77%) и среди молодых исследователей (87%).",
  "在出版社Frontiers 2025年的自愿应答调查中，53%的审稿人表示使用AI工具，中国（77%）与早期职业研究者（87%）采用率尤其高。",
  "出版社フロンティアーズの2025年の自発回答調査では査読者の53%がAIツールを使うと答え、中国（77%）と若手研究者（87%）で採用がとくに高かった。"],null,"L"),
 s("B",[12],["AI 의견이 쓸모없는 것은 아니다: GPT-4가 네이처 계열 논문 3,096편과 ICLR 논문 1,709편에 단 지적은 사람 심사자와 30.85%·39.23% 겹쳐, 사람 심사자 둘 사이의 겹침(28.58%·35.25%)과 비슷했다.",
  "AI comments are not useless: GPT-4's points on 3,096 Nature-family and 1,709 ICLR papers overlapped with human reviewers' by 30.85% and 39.23%, similar to the overlap between two human reviewers (28.58% and 35.25%).",
  "ИИ-замечания не бесполезны: пункты GPT-4 по 3096 статьям журналов Nature и 1709 статьям ICLR совпали с замечаниями рецензентов на 30,85% и 39,23% — примерно как между двумя людьми (28,58% и 35,25%).",
  "AI意见并非无用：GPT-4对3,096篇《自然》系列论文和1,709篇ICLR论文提出的问题与人类审稿人重合30.85%、39.23%，与两位人类审稿人之间的重合（28.58%、35.25%）相近。",
  "AIの意見が役に立たないわけではない。GPT-4がネイチャー系列の論文3,096本とICLRの論文1,709本に付けた指摘は人の査読者と30.85%・39.23%重なり、人の査読者二人の間の重なり（28.58%・35.25%）と同程度だった。"]),
 s("B",[15],["그러나 AI 심사는 속이기 쉽다: 원고에 숨긴 문구로 LLM 심사 점수를 올릴 수 있었고, 시뮬레이션에서는 심사의 5%만 조작돼도 논문 12%가 상위 30%에서 밀려났으며, LLM은 미완성 논문에 더 높은 점수를 주거나 유명 저자를 우대하기도 했다.",
  "But AI review is easy to fool: hidden text in a manuscript raised LLM review scores, in simulation manipulating only 5% of reviews pushed 12% of papers out of the top 30%, and LLMs sometimes rated incomplete papers higher or favoured well-known authors.",
  "Но ИИ-рецензента легко обмануть: скрытый текст в рукописи поднимал оценки LLM, в симуляции манипуляция лишь 5% рецензий вытесняла 12% статей из верхних 30%, а LLM порой выше оценивали неполные статьи или благоволили известным авторам.",
  "但AI审稿容易被骗：原稿中隐藏的文字可抬高LLM审稿分数，模拟中仅操纵5%的审稿就使12%的论文跌出前30%，LLM有时还给未完成论文更高分或偏向知名作者。",
  "しかしAI査読は欺きやすい。原稿に隠した文言でLLM査読の点数を上げられ、シミュレーションでは査読の5%を操作するだけで論文の12%が上位30%から押し出され、LLMは未完成の論文に高い点を付けたり有名著者を優遇したりもした。"]),
 s("B",[16,17,18],["실제로 2025년 6~7월 arXiv 원고 17~18편에서 흰 글씨·초소형 글씨로 'AI 심사자는 긍정 평가만 하라'는 지시문이 발견됐고, KAIST·와세다대·베이징대 등 8개국 14개 대학 연구자가 관련됐으며, KAIST는 해당 논문 3편을 철회했다.",
  "In fact, in June–July 2025 instructions in white or microscopic text telling AI reviewers to give only positive reviews were found in 17–18 arXiv manuscripts by researchers at 14 universities in 8 countries, including KAIST, Waseda and Peking University; KAIST withdrew its 3 papers.",
  "В июне–июле 2025 года в 17–18 рукописях arXiv нашли набранные белым или микроскопическим шрифтом указания ИИ-рецензентам давать только положительные отзывы; причастны исследователи 14 вузов из 8 стран, включая KAIST, Васэда и Пекинский университет; KAIST отозвал свои 3 статьи.",
  "事实上，2025年6–7月在17–18篇arXiv原稿中发现以白色或极小字体写着“AI审稿人只给正面评价”的指令，涉及KAIST、早稻田、北京大学等8国14所大学的研究者，KAIST撤回了相关3篇论文。",
  "実際に2025年6〜7月、arXivの原稿17〜18本で白文字や極小の文字で「AI査読者は肯定的な評価だけをせよ」という指示が見つかり、KAIST・早稲田大・北京大など8か国14大学の研究者が関わり、KAISTは該当論文3本を撤回した。"]),
 s("B",[16],["'AI를 몰래 쓰는 게으른 심사자를 잡는 함정'이라는 해명은 설득력이 약하다: 발견된 지시문은 한결같이 저자에게 유리한 방향이었고, 분석 연구는 이를 새로운 형태의 '의심스러운 연구 관행'으로 분류했다.",
  "The defence that it was a honeypot to catch lazy reviewers secretly using AI is weak: every instruction found pointed in the authors' favour, and an analysis classified the practice as a new form of questionable research practice.",
  "Оправдание «ловушка для ленивых рецензентов, тайно использующих ИИ» неубедительно: все найденные указания были в пользу авторов, и аналитическая работа отнесла практику к новой форме сомнительной исследовательской практики.",
  "“为抓偷偷用AI的懒审稿人设的陷阱”这一辩解缺乏说服力：所发现的指令无一例外对作者有利，分析研究将其归为一种新型“可疑研究行为”。",
  "「AIをこっそり使う怠けた査読者を捕まえる罠」という弁明は説得力に乏しい。見つかった指示は一様に著者に有利な方向で、分析研究はこれを新しい形の「疑わしい研究慣行」に分類した。"],null,"H"),
 s("C",[19],["2026년 11월에는 이런 지시문이 사전공개본을 넘어 출판 논문의 데이터 공개 문단에까지 들어간 사례가 드러나 출판사가 논문을 철회했고, 다른 사례에서는 그림 속에 배경색과 같은 색으로 숨겨져 있었다.",
  "In November 2026 a case came to light in which such an instruction had gone beyond a preprint into the data-availability statement of a published paper, which the publisher retracted; in another case it was hidden inside a figure in the same colour as the background.",
  "В ноябре 2026 года выяснилось, что такая инструкция вышла за пределы препринта и попала в раздел о доступности данных опубликованной статьи — издатель её отозвал; в другом случае текст был спрятан в рисунке цветом фона.",
  "2026年11月曝出此类指令越过预印本、进入正式出版论文数据可用性声明的案例，出版社已撤回该论文；另一案例中指令以与背景同色的字体藏在图中。",
  "2026年11月には、こうした指示がプレプリントを越えて出版論文のデータ公開の段落にまで入った例が明らかになり出版社が論文を撤回し、別の例では図の中に背景と同じ色で隠されていた。"]),
 s("B",[9,8,10,11],["학회의 대응은 '선택·제재·공식 보조'의 세 갈래다: ICML 2026은 심사자와 저자가 AI 금지·제한 허용 정책을 고르게 한 뒤 위반한 심사자 398명의 논문 497편을 탈락시켰고, ICLR은 질 낮은 AI 심사를 쓴 심사자의 논문도 탈락시킬 수 있다고 했으며, AAAI는 사람 심사를 돕는 공식 AI 의견을 시범 도입했다.",
  "Conferences respond on three tracks — choice, sanctions and official assistance: ICML 2026 let reviewers and authors choose a no-AI or limited-AI policy and then desk-rejected 497 papers of 398 violating reviewers; ICLR said reviewers posting poor AI reviews could have their own papers rejected; and AAAI piloted official AI input to support human reviewers.",
  "Ответ конференций идёт по трём линиям — выбор, санкции и официальное содействие: ICML 2026 дала рецензентам и авторам выбрать политику «без ИИ» или «ограниченно», затем отклонила 497 статей 398 нарушителей; ICLR заявила, что может отклонять статьи авторов низкокачественных ИИ-рецензий; AAAI запустила пилот официальных ИИ-отзывов в помощь людям.",
  "学会的应对分三路——选择、制裁、官方辅助：ICML 2026让审稿人与作者选择“禁止AI”或“有限允许”政策，随后拒绝398名违规审稿人的497篇论文；ICLR表示可拒绝发布低质量AI审稿者本人的论文；AAAI试行为人类审稿提供官方AI意见。",
  "学会の対応は「選択・制裁・公式の補助」の三方向である。ICML 2026は査読者と著者にAI禁止・限定許可の方針を選ばせたうえで違反した査読者398人の論文497本を不採択とし、ICLRは質の低いAI査読を書いた査読者の論文も不採択にしうるとし、AAAIは人の査読を助ける公式のAI意見を試行導入した。"]),
 s("D",[3,4,15,19,8],["판단: AI 심사는 '게으른 심사(품질)'와 '조작 가능한 심사(보안)'라는 두 문제를 동시에 만들며, 금지만으로는 사용이 음지로 숨을 뿐이므로, 기밀이 보장되는 공식 도구와 심사자 책임·보상을 묶은 설계가 필요하다.",
  "Judgement: AI reviewing creates two problems at once — lazy review (quality) and manipulable review (security) — and bans alone only drive use underground, so the design needs confidential official tools tied to reviewer accountability and recognition.",
  "Вывод: ИИ-рецензирование одновременно порождает две проблемы — «ленивую рецензию» (качество) и «манипулируемую рецензию» (безопасность), — а запреты лишь загоняют использование в тень; нужен дизайн, связывающий конфиденциальные официальные инструменты с ответственностью и признанием рецензентов.",
  "判断：AI审稿同时制造“偷懒的审稿（质量）”和“可被操纵的审稿（安全）”两个问题，仅靠禁止只会让使用转入地下，因此需要把保密有保障的官方工具与审稿人的责任及回报捆绑设计。",
  "判断：AI査読は「怠けた査読（質）」と「操作されうる査読（安全）」という二つの問題を同時に生み、禁止だけでは使用が地下に潜るだけなので、守秘が保証された公式ツールと査読者の責任・報酬を結びつけた設計が要る。"],null,"M")
),CH("review")],
[P(
 s("B",[3,4],["AI 학회 심사평의 6.5~16.9%가 LLM으로 고쳐 쓰였고, AI 도움 심사는 점수와 채택 확률을 높였다.","6.5–16.9% of AI-conference review text was LLM-rewritten, and AI-assisted reviews raised scores and acceptance odds.","6,5–16,9% текста рецензий конференций по ИИ переписаны LLM, а ИИ-рецензии повышали оценки и шансы принятия.","AI学会审稿意见6.5–16.9%被LLM改写，AI辅助审稿提高了分数与录用概率。","AI学会の査読コメントの6.5〜16.9%がLLMで書き換えられ、AI支援の査読は点数と採択確率を押し上げた。"],null,"M"),
 s("B",[15,18,19],["원고에 숨긴 지시문으로 AI 심사자를 속이는 시도가 KAIST 등 여러 대학에서 나왔고, 2026년 11월에는 출판 논문 철회로 이어졌다.","Attempts to fool AI reviewers with hidden instructions came from several universities including KAIST, and in November 2026 led to a published paper's retraction.","Попытки обмануть ИИ-рецензентов скрытыми инструкциями исходили из нескольких вузов, включая KAIST, а в ноябре 2026 года привели к отзыву опубликованной статьи.","以隐藏指令欺骗AI审稿人的尝试出现在KAIST等多所大学，2026年11月已导致正式论文撤稿。","原稿に隠した指示でAI査読者を欺く試みはKAISTなど複数の大学から出ており、2026年11月には出版論文の撤回に至った。"]),
 s("D",[8,9,11],["학회는 정책 선택·제재(497편 탈락)·공식 AI 보조로 대응하고 있으며, 금지보다 기밀이 보장되는 공식 도구와 책임 설계가 관건이다.","Conferences respond with policy choice, sanctions (497 desk rejections) and official AI assistance; the key is confidential official tools and accountability, not bans.","Конференции отвечают выбором политики, санкциями (497 отклонений) и официальным ИИ-содействием; ключ — конфиденциальные официальные инструменты и ответственность, а не запреты.","学会以政策选择、制裁（拒稿497篇）与官方AI辅助应对，关键在保密有保障的官方工具与责任设计，而非禁止。","学会は方針の選択・制裁（497本の不採択）・公式のAI補助で対応しており、禁止より守秘が保証された公式ツールと責任の設計が鍵である。"],null,"M")
),CH("review")]);

// ===== §4 Integrity: hallucinated citations, paper mills, detection =====
SEC("integrity",["현재 ③: 무결성 — 가짜 인용, 논문공장, 그리고 탐지의 함정","Now ③: Integrity — Fake Citations, Paper Mills and the Detection Trap","Сейчас ③: добросовестность — фальшивые ссылки, «фабрики статей» и ловушка детекции","现状③：诚信——虚假引用、论文工厂与检测陷阱","現在③：公正さ——偽の引用、論文工場、そして検出の落とし穴"],
[P(
 s("A",[20],["가짜 인용은 도구의 구조적 성질이다: 2023년 실험에서 ChatGPT가 쓴 짧은 문헌 검토의 인용 636개 중 존재하지 않는 인용이 GPT-3.5에서 55%, GPT-4에서 18%였고, 실제 문헌 인용도 43%·24%가 서지 오류를 담았다.",
  "Fake citations are a structural property of the tools: in a 2023 experiment, of 636 citations in short literature reviews written by ChatGPT, 55% (GPT-3.5) and 18% (GPT-4) did not exist, and 43% and 24% of citations to real works contained bibliographic errors.",
  "Фальшивые ссылки — структурное свойство инструментов: в эксперименте 2023 года из 636 ссылок в кратких обзорах, написанных ChatGPT, не существовали 55% (GPT-3.5) и 18% (GPT-4), а 43% и 24% ссылок на реальные работы содержали ошибки.",
  "虚假引用是工具的结构性特征：2023年的实验中，ChatGPT所写短综述的636条引用里，不存在的引用在GPT-3.5中占55%、GPT-4中占18%，真实文献的引用也有43%、24%存在书目错误。",
  "偽の引用は道具の構造的な性質である。2023年の実験で、ChatGPTが書いた短い文献レビューの引用636件のうち存在しない引用はGPT-3.5で55%、GPT-4で18%で、実在文献の引用も43%・24%が書誌の誤りを含んでいた。"]),
 s("B",[21],["그 가짜가 최상위 학회의 심사를 통과했다: NeurIPS 2025 채택 논문 53편(약 1%)에서 가짜 인용 100개가 발견됐고, 66%는 완전 날조였으며, 모두가 실제 저자명이나 식별자를 섞어 그럴듯하게 보이는 '복합 실패' 구조였다.",
  "Such fakes passed review at a top conference: 100 fabricated citations were found in 53 NeurIPS 2025 accepted papers (about 1%); 66% were total fabrications, and every one was a compound failure mixing in real author names or identifiers to look plausible.",
  "Такие подделки прошли рецензирование на ведущей конференции: в 53 принятых статьях NeurIPS 2025 (около 1%) нашли 100 выдуманных ссылок; 66% — полная фабрикация, и все — «составные сбои» с реальными именами авторов или идентификаторами для правдоподобия.",
  "这些伪造通过了顶级学会的审稿：NeurIPS 2025录用论文中53篇（约1%）发现100条虚假引用，66%为完全捏造，且全部混入真实作者名或标识符以显得可信，属“复合失效”结构。",
  "その偽物が最上位の学会の査読を通過した。NeurIPS 2025の採択論文53本（約1%）で偽の引用100件が見つかり、66%は完全な捏造で、すべてが実在の著者名や識別子を混ぜてもっともらしく見せる「複合的な失敗」の構造だった。"]),
 s("B",[21],["오염된 논문의 92%는 가짜 인용이 1~2개(가벼운 AI 사용)였고 8%는 4~13개(과도한 의존)여서, 문제의 대부분은 악의보다 '확인하지 않은 편의'에서 나온다.",
  "92% of contaminated papers had one or two fake citations (light AI use) and 8% had four to thirteen (heavy reliance), so most of the problem comes from unchecked convenience rather than malice.",

 s("A",[25],["기존의 부정 산업은 AI로 비용이 더 낮아진다: 논문공장·중개인·약탈적 학술지가 협력해 특정 학술지와 하위 분야를 노리며, 개입을 피하는 능력 때문에 부정 출판이 정상 과학보다 훨씬 빠르게 늘고 있다.",
  "The existing misconduct industry gets cheaper with AI: paper mills, brokers and predatory journals cooperate to target specific journals and subfields, and their ability to evade interventions lets fraudulent publishing grow far faster than legitimate science.",

 s("A",[27],["공개 데이터와 AI가 만나면 정형화된 저품질 논문이 쏟아진다: 미국 국민건강영양조사 자료로 '변수 하나와 질병 하나'를 묶는 논문은 2014~2021년 연평균 4편이었지만 2024년에는 10월 9일까지만 190편이었고, 상당수가 부적절한 설계와 거짓 발견을 담았다.",

 s("C",[26],["철회도 기록을 갈아치웠다: 2023년 철회 논문은 1만 건을 넘었고, 지난 20년간 주요 연구국 중 철회율은 사우디아라비아·파키스탄·러시아·중국이 가장 높았다.",

 s("A",[28],["탐지기는 해법이 되기 어렵다: 널리 쓰이는 GPT 탐지기는 비영어권 작성자의 글을 AI가 쓴 것으로 일관되게 잘못 분류했고, 간단한 프롬프트로 쉽게 속일 수 있었다.",

  "检测器难成解决之道：常用GPT检测器一贯把非英语母语作者的文字误判为AI生成，且用简单提示就能轻易骗过。",

 s("B",[39,10],["그래서 앞선 기관은 '탐지로 처벌'하지 않는다: 영국 UKRI는 심사자가 신청서의 AI 사용 여부를 추측해 평가에 반영하지 말라고 못박았고, ICLR은 탐지 도구 결과만으로는 조치하지 않고 담당 심사위원이 구체적 증거를 확인할 때만 제재한다.",

 s("D",[21,25,28,44],["판단: 확장 가능한 방어선은 '누가 썼는지'를 문체로 추측하는 것이 아니라, 인용이 실재하는지·데이터와 코드가 재현되는지처럼 '확인할 수 있는 것'을 투고 단계에서 자동으로 확인하는 것이다.",

 s("A",[20,21],["ChatGPT 인용의 18~55%가 가짜였고, 가짜 인용은 NeurIPS 2025 채택 논문의 약 1%에 들어갔다.","18–55% of ChatGPT citations were fake, and fake citations entered about 1% of NeurIPS 2025 accepted papers.","18–55% ссылок ChatGPT были фальшивыми, а фальшивые ссылки попали примерно в 1% принятых статей NeurIPS 2025.","ChatGPT引用的18–55%为虚假，虚假引用进入约1%的NeurIPS 2025录用论文。","ChatGPTの引用の18〜55%が偽物で、偽の引用はNeurIPS 2025の採択論文の約1%に入った。"]),

SEC("output",["현재 ④: 양과 질 — 논문은 늘고, 과학의 시야는 좁아진다","Now ④: Quantity and Quality — More Papers, a Narrower Science","Сейчас ④: количество и качество — статей больше, кругозор науки уже","现状④：数量与质量——论文更多，科学视野更窄","現在④：量と質——論文は増え、科学の視野は狭まる"],
[P(
 s("B",[30],["arXiv의 연간 신규 투고는 2022년 18만5,692건, 2023년 20만8,493건, 2024년 24만4,031건, 2025년 28만4,486건으로 3년 새 53% 늘었고, 2026년은 11월 26일까지 34만5,962건으로 이미 전년 전체를 넘었다.",

  "arXiv年度新投稿从2022年的185,692篇增至2023年208,493篇、2024年244,031篇、2025年284,486篇，三年增长53%；2026年截至11月26日已达345,962篇，超过上一年全年。",
  "arXivの年間新規投稿は2022年18万5,692件、2023年20万8,493件、2024年24万4,031件、2025年28万4,486件と3年で53%増え、2026年は11月26日までに34万5,962件と、すでに前年全体を上回った。"]),
 s("B",[31],["양의 압력은 이미 인프라의 규칙을 바꿨다: arXiv 컴퓨터과학 분야는 2025년 10월, 생성형 AI로 '새 결과 없는 논문'을 쉽게 쓰게 된 탓에 감당할 수 없는 유입이 생겼다며 동료심사를 통과하지 않은 리뷰·입장 논문을 받지 않기로 했다.",
  "The pressure of volume has already changed infrastructure rules: in October 2025 arXiv's computer science category stopped accepting review and position papers that had not passed peer review, citing an unmanageable influx because generative AI made papers without new results easy to write.",
  "Давление объёма уже изменило правила инфраструктуры: в октябре 2025 года раздел информатики arXiv перестал принимать обзорные и позиционные статьи без рецензирования, сославшись на неуправляемый поток, поскольку генеративный ИИ облегчил написание статей без новых результатов.",
  "数量压力已改变基础设施规则：2025年10月，arXiv计算机科学类别以生成式AI使“无新结果的论文”易于撰写、涌入无法应付为由，不再接收未通过同行评审的综述与立场论文。",
  "量の圧力はすでにインフラの規則を変えた。arXivのコンピュータ科学分野は2025年10月、生成AIで「新しい結果のない論文」を簡単に書けるようになり手に負えない流入が生じたとして、査読を通っていないレビュー・立場論文を受け付けないことにした。"]),
 s("B",[43],["일본 문부과학성 심의회도 생성형 AI가 연구계획서 작성을 쉽게 해 응모 건수를 늘리고 심사 체계를 압박할 수 있다고 보고, 논문 수 급증과 환각으로 보이는 오류 증가를 과제로 꼽았다.",
  "A council of Japan's MEXT likewise judged that generative AI, by making proposal writing easier, could raise application numbers and strain the review system, listing the surge in paper numbers and rising errors that appear to be hallucinations as issues.",
  "Совет японского MEXT также счёл, что генеративный ИИ, облегчая написание заявок, может увеличить их число и перегрузить экспертизу, и назвал проблемами резкий рост числа статей и ошибок, похожих на галлюцинации.",
  "日本文部科学省审议会也认为，生成式AI使研究计划书写作变容易，可能增加申请数量并压迫评审体系，并将论文数激增与疑似幻觉的错误增加列为课题。",
  "日本の文部科学省の審議会も、生成AIが研究計画書の作成を容易にして応募件数を増やし審査体制を圧迫しうるとみて、論文数の急増と幻覚とみられる誤りの増加を課題に挙げた。"]),
 s("A",[32],["210만 편의 사전공개본을 분석한 『사이언스』 연구는 LLM으로 원고를 쓰기 시작한 연구자의 논문 생산이 분야·배경에 따라 23.7~89.3% 늘었고, 문장이 복잡할수록 질이 높던 관계가 뒤집혀 '언어는 화려하지만 내용은 약한' 원고가 몰려든다고 보고했다.",
  "A Science study of 2.1 million preprints reported that researchers who began drafting with LLMs increased output by 23.7–89.3% depending on field and background, and that the link between complex writing and higher quality reversed, bringing an influx of manuscripts that are linguistically ornate but substantively weak.",
  "Исследование в Science по 2,1 млн препринтов сообщило, что учёные, начавшие писать с LLM, увеличили выпуск на 23,7–89,3% в зависимости от области и происхождения, а связь «сложный текст — высокое качество» перевернулась: хлынули рукописи с изысканным языком и слабым содержанием.",
  "《科学》一项分析210万篇预印本的研究报告，开始用LLM撰稿的研究者论文产出按领域与背景增长23.7–89.3%，且“文字越复杂质量越高”的关系发生逆转，“语言华丽而内容薄弱”的稿件大量涌入。",
  "プレプリント210万本を分析した『サイエンス』の研究は、LLMで原稿を書き始めた研究者の論文生産が分野・背景により23.7〜89.3%増え、文章が複雑なほど質が高いという関係が逆転し「言葉は華やかだが中身は弱い」原稿が押し寄せていると報告した。"]),
 s("A",[33],["그러나 2026년 PNAS 반론은 'LLM 사용으로 처음 탐지된 논문'을 채택 시점으로 삼으면 논문을 많이 낸 달일수록 탐지될 확률이 높아, 효과가 전혀 없어도 같은 증가 패턴이 기계적으로 생긴다는 것을 챗GPT 이전 위약 기간 분석으로 보였다.",
  "But a 2026 PNAS rebuttal showed, including with pre-ChatGPT placebo periods, that dating adoption by the first paper detected as LLM-assisted mechanically produces the same rising pattern even with no effect at all, because high-output months are more likely to yield a detected paper.",
  "Однако опровержение в PNAS (2026) показало, в том числе на плацебо-периодах до ChatGPT, что датировка внедрения по первой распознанной LLM-статье механически даёт тот же рост даже при нулевом эффекте: в продуктивные месяцы вероятность распознавания выше.",
  "但2026年PNAS的反驳以ChatGPT之前的安慰剂时期等分析表明：若以“首篇被检测为LLM辅助的论文”为采用时点，由于高产月份更易被检测，即使毫无效果也会机械地出现同样的增长模式。",
  "しかし2026年のPNASの反論は、「LLM使用と最初に検出された論文」を採用時点とすると論文を多く出した月ほど検出されやすいため、効果がまったくなくても同じ増加パターンが機械的に生じることを、ChatGPT以前の偽薬期間の分析で示した。"],null,"H"),
 s("A",[34],["자연과학 논문 4,130만 편을 분석한 『네이처』 연구에서 AI를 활용한 연구자는 논문 3.02배, 피인용 4.84배를 기록하고 연구책임자가 1.37년 빨리 됐다.",
  "In a Nature study of 41.3 million natural-science papers, AI-using scientists published 3.02 times more papers, received 4.84 times more citations and became project leaders 1.37 years earlier.",
  "В исследовании Nature по 41,3 млн статей естественных наук учёные, использующие ИИ, публиковали в 3,02 раза больше, получали в 4,84 раза больше цитирований и становились руководителями проектов на 1,37 года раньше.",
  "《自然》一项分析4,130万篇自然科学论文的研究中，使用AI的研究者论文多3.02倍、引用多4.84倍，成为项目负责人早1.37年。",
  "自然科学の論文4,130万本を分析した『ネイチャー』の研究では、AIを活用する研究者は論文3.02倍、被引用4.84倍を記録し、研究責任者に1.37年早くなった。"]),
 s("A",[34],["같은 연구에서 과학 전체로는 연구 주제의 범위가 4.63% 줄고 연구자 사이 교류가 22% 줄었는데, AI 활용 연구가 데이터가 풍부한 같은 영역으로 함께 몰리기 때문이다.",
  "In the same study, science as a whole saw topic volume shrink by 4.63% and engagement among scientists fall by 22%, because AI-augmented work moves collectively towards the same data-rich areas.",
  "В том же исследовании наука в целом сузила объём тем на 4,63%, а взаимодействие учёных — на 22%, поскольку ИИ-работы коллективно смещаются в одни и те же богатые данными области.",
  "同一研究中，科学整体的研究主题范围缩小4.63%、研究者间互动减少22%，原因是AI增强的研究集体涌向同样数据丰富的领域。",
  "同じ研究で、科学全体では研究テーマの範囲が4.63%縮み研究者間の交流が22%減ったが、これはAI活用研究がデータの豊富な同じ領域へ一斉に集まるためである。"],null,"H"),
 s("B",[35],["긍정적 상한도 분명하다: 2024년 노벨화학상의 알파폴드2는 알려진 단백질 2억 개 거의 전부의 구조를 예측했고 190개국 200만 명 이상이 썼는데, 잘 정의된 문제와 대규모 공개 데이터가 있었기에 가능했다.",
  "The positive ceiling is clear too: AlphaFold2, honoured by the 2024 Nobel Prize in Chemistry, predicted the structures of virtually all 200 million known proteins and was used by over two million people in 190 countries — possible because of a well-defined problem and large open data.",
  "Есть и явный позитивный потолок: AlphaFold2, отмеченная Нобелевской премией по химии 2024 года, предсказала структуры почти всех 200 млн известных белков, ею пользовались более 2 млн человек в 190 странах — благодаря чёткой задаче и большим открытым данным.",
  "正面上限同样清晰：获2024年诺贝尔化学奖的AlphaFold2预测了几乎全部2亿种已知蛋白质的结构，190个国家200多万人使用，这得益于定义清晰的问题与大规模公开数据。",
  "肯定的な上限もはっきりしている。2024年のノーベル化学賞のアルファフォールド2は既知のタンパク質2億個のほぼすべての構造を予測し、190か国の200万人以上が使ったが、明確な問題と大規模な公開データがあったから可能だった。"]),
 s("C",[36],["논문 전체를 쓰는 AI도 나왔다: 가설·실험·분석·작성을 자동으로 한 에이전트의 원고 3편 중 1편이 ICLR 워크숍에서 사람 채택 평균선을 넘는 점수를 받았다고 개발사가 보고했다.",
  "AI that writes entire papers has arrived: the developer reported that one of three manuscripts produced end-to-end by its agent (hypothesis, experiments, analysis, writing) scored above the average human acceptance threshold at an ICLR workshop.",
  "Появился ИИ, пишущий статьи целиком: разработчик сообщил, что одна из трёх рукописей, полностью созданных его агентом (гипотеза, эксперименты, анализ, текст), получила на воркшопе ICLR баллы выше среднего порога принятия.",
  "撰写整篇论文的AI已经出现：开发者报告，其智能体全自动完成（假设、实验、分析、写作）的3篇稿件中有1篇在ICLR研讨会上得分超过人类录用平均线。",
  "論文全体を書くAIも現れた。仮説・実験・分析・執筆を自動で行ったエージェントの原稿3本のうち1本がICLRのワークショップで人の採択平均線を上回る点数を得たと開発元が報告した。"],null,"L"),
 s("D",[32,33,34,30],["판단: 'AI가 개인의 생산성을 얼마나 높이나'는 아직 논쟁 중이지만, '심사자 한 명이 읽어야 할 논문이 늘고 과학이 같은 주제로 몰린다'는 것은 여러 근거가 같은 방향을 가리키므로, 위험의 핵심은 양 자체보다 검증 부담과 다양성 축소다.",
  "Judgement: how much AI raises individual productivity is still contested, but several lines of evidence point the same way on more papers per reviewer and science crowding into the same topics, so the core risk is verification burden and narrowing diversity rather than volume itself.",
  "Вывод: насколько ИИ повышает индивидуальную продуктивность, ещё спорно, но несколько линий данных согласно указывают на рост числа статей на одного рецензента и скучивание науки вокруг одних тем; ядро риска — нагрузка на проверку и сужение разнообразия, а не объём как таковой.",
  "判断：“AI使个人生产率提高多少”仍有争议，但“每位审稿人要读的论文增加、科学向相同主题聚集”有多项依据指向同一方向，因此风险核心不在数量本身，而在核查负担与多样性收缩。",
  "判断：「AIが個人の生産性をどれだけ高めるか」はまだ論争中だが、「査読者一人が読むべき論文が増え、科学が同じテーマに集まる」ことは複数の根拠が同じ方向を指すので、リスクの核心は量そのものより検証の負担と多様性の縮小である。"],null,"M")
),CH("flood"),CH("prod")],
[P(
 s("B",[30,31],["arXiv 투고는 3년 새 53% 늘었고, 컴퓨터과학 분야는 심사받지 않은 리뷰 논문을 더는 받지 않는다.","arXiv submissions rose 53% in three years, and its computer science category no longer accepts unreviewed review papers.","Подачи в arXiv выросли на 53% за три года, а раздел информатики больше не принимает нерецензированные обзоры.","arXiv投稿三年增长53%，计算机科学类别不再接收未经评审的综述论文。","arXivの投稿は3年で53%増え、コンピュータ科学分野は査読を経ていないレビュー論文をもう受け付けない。"]),
 s("A",[32,33],["LLM이 생산성을 23.7~89.3% 높였다는 추정은 측정 방식이 가짜 효과를 만든다는 반박을 받고 있다.","The estimate that LLMs raised output by 23.7–89.3% is contested on the grounds that its measurement creates spurious effects.","Оценку роста выпуска на 23,7–89,3% благодаря LLM оспаривают: метод измерения порождает ложный эффект.","LLM使产出提高23.7–89.3%的估计受到“测量方式制造虚假效应”的反驳。","LLMが生産性を23.7〜89.3%高めたという推定は、測定方法が見かけの効果を生むという反論を受けている。"],null,"H"),
 s("A",[34],["AI를 쓴 연구자는 논문 3.02배·피인용 4.84배의 이득을 보지만, 과학 전체의 주제 범위는 4.63% 줄었다.","AI-using scientists gain 3.02 times the papers and 4.84 times the citations, but science's topic range shrank by 4.63%.","Использующие ИИ получают в 3,02 раза больше статей и в 4,84 раза больше цитирований, но тематический охват науки сузился на 4,63%.","使用AI的研究者论文多3.02倍、引用多4.84倍，但科学整体主题范围缩小4.63%。","AIを使う研究者は論文3.02倍・被引用4.84倍の利益を得るが、科学全体のテーマの範囲は4.63%縮んだ。"],null,"H")
),CH("flood"),CH("prod")]);

SEC("rules",["현재 ⑤: 규칙 — 학술지·학회·연구비 기관·정부의 대응","Now ⑤: Rules — How Journals, Conferences, Funders and Governments Respond","Сейчас ⑤: правила — ответ журналов, конференций, фондов и правительств","现状⑤：规则——期刊、学会、资助机构与政府的应对","現在⑤：規則——学術誌・学会・研究費配分機関・政府の対応"],
[P(
 s("A",[37],["학술지 규칙은 빠르게 생겼다: 2023년 기준 상위 100개 학술지의 87%, 상위 100개 출판사의 24%가 생성형 AI 지침을 두었고, 지침이 있는 곳의 96~98%가 AI를 저자로 인정하지 않았다.",
  "Journal rules appeared quickly: as of 2023, 87% of the top 100 journals and 24% of the top 100 publishers had generative-AI guidance, and 96–98% of those with guidance did not accept AI as an author.",
  "Правила журналов появились быстро: на 2023 год руководства по генеративному ИИ имели 87% из 100 ведущих журналов и 24% из 100 крупнейших издателей, и 96–98% из них не признавали ИИ автором.",
  "期刊规则迅速出台：截至2023年，前100名期刊的87%、前100大出版社的24%制定了生成式AI指南，有指南者96–98%不认可AI为作者。",
  "学術誌の規則は急速に生まれた。2023年時点で上位100誌の87%、上位100出版社の24%が生成AIの指針を設け、指針のある所の96〜98%がAIを著者と認めなかった。"]),
 s("A",[37,16],["하지만 세부는 제각각이다: 원고 생성 자체를 금지한 학술지는 1곳뿐이었고 공개 위치와 방법이 달랐으며 12개 학술지는 출판사 지침과 충돌했고, 심사에서도 엘스비어는 AI를 전면 금지하는 반면 스프링거 네이처는 공개를 전제로 제한 허용한다.",
  "But the details vary: only one journal banned generating manuscripts with AI, disclosure locations and methods differed, 12 journals conflicted with their publisher's guidance, and in peer review Elsevier bans AI outright while Springer Nature allows limited use with disclosure.",
  "Но детали различаются: лишь один журнал запретил генерировать рукописи с ИИ, место и способ раскрытия разнились, у 12 журналов правила противоречили издательским, а в рецензировании Elsevier полностью запрещает ИИ, тогда как Springer Nature допускает ограниченно с раскрытием.",
  "但细节各不相同：禁止用AI生成稿件的期刊仅1家，披露位置与方式不一，12家期刊与出版社指南冲突；审稿方面，爱思唯尔全面禁止AI，施普林格·自然则在披露前提下有限允许。",
  "しかし細部はまちまちである。原稿生成そのものを禁じた学術誌は1誌だけで、開示の場所と方法が異なり、12誌は出版社の指針と矛盾し、査読でもエルゼビアはAIを全面禁止する一方、シュプリンガー・ネイチャーは開示を前提に限定的に認める。"]),
 s("B",[38,39],["연구비 심사는 더 엄격하다: 미국 NSF(2023.12)는 심사자가 신청서를 승인되지 않은 생성형 AI에 올리면 기밀 서약 위반으로 보고, 영국 UKRI(2024.9)는 언어 다듬기 외의 평가 활동에 AI를 쓰지 못하게 하며 그때도 신청서 내용을 넣지 못하게 했다.",
  "Grant review is stricter: the US NSF (December 2023) treats reviewers uploading proposals to non-approved generative AI as a breach of the confidentiality pledge, and UK UKRI (September 2024) bars AI in assessment except for language refinement, and even then forbids entering application content.",
  "Грантовая экспертиза строже: NSF США (декабрь 2023) считает загрузку заявок рецензентами в неодобренный генеративный ИИ нарушением обязательства о конфиденциальности, а UKRI Великобритании (сентябрь 2024) запрещает ИИ в оценке, кроме правки языка, и даже тогда — ввод содержания заявки.",
  "经费评审更严格：美国NSF（2023.12）将审稿人把申请书上传至未获批准的生成式AI视为违反保密承诺；英国UKRI（2024.9）禁止在语言润色以外的评审活动中使用AI，即使润色也不得输入申请内容。",
  "研究費審査はより厳しい。米国NSF（2023.12）は審査者が申請書を承認されていない生成AIにアップロードすれば守秘誓約の違反とみなし、英国UKRI（2024.9）は言語の推敲以外の評価活動でAIを使えないようにし、その場合も申請書の内容を入れられないようにした。"]),
 s("B",[40],["EU는 법보다 권고를 택했다: 2024년 3월의 '살아 있는 지침'은 연구자가 동료심사·평가 같은 민감한 활동에서 생성형 AI를 삼가고 연구기관이 사용을 지원·감시하도록 권고하지만 구속력은 없다.",
  "The EU chose recommendation over law: its 'living guidelines' of March 2024 advise researchers to refrain from generative AI in sensitive activities such as peer review and evaluation and research organisations to support and monitor its use, but they are non-binding.",
  "ЕС выбрал рекомендации вместо закона: «живые руководства» марта 2024 года советуют исследователям воздерживаться от генеративного ИИ в чувствительных видах деятельности (рецензирование, оценка), а организациям — поддерживать и отслеживать его использование, но они необязательны.",
  "欧盟选择了建议而非法律：2024年3月的“动态指南”建议研究者在同行评审、评估等敏感活动中避免使用生成式AI，研究机构支持并监测使用，但无约束力。",
  "EUは法より勧告を選んだ。2024年3月の「生きた指針」は、研究者が査読・評価のような慎重を要する活動で生成AIを控え、研究機関が利用を支援・監視するよう勧告するが、拘束力はない。"]),
 s("B",[41],["중국은 '허가제'다: 국가자연과학기금위원회는 신청서를 생성형 AI로 직접 생성하는 것을 금지 행위로 열거하고 AI를 공동 성과자로 올리지 못하게 했으며, 심사위원이 생성형 AI로 심사하려면 기금위의 사전 허가를 받도록 했다.",
  "China uses permission: the NSFC lists directly generating application materials with generative AI as prohibited, bars listing AI as a co-contributor, and requires reviewers to obtain the foundation's prior permission before reviewing with generative AI.",
  "Китай применяет разрешительный порядок: NSFC относит прямую генерацию заявочных материалов генеративным ИИ к запрещённому, запрещает указывать ИИ соисполнителем и требует от рецензентов предварительного разрешения фонда на экспертизу с ИИ.",
  "中国采取“许可制”：国家自然科学基金委将使用生成式AI直接生成申报材料列为禁止行为，不得将AI列为成果共同完成人，评审专家使用生成式AI评审须事先征得基金委许可。",
  "中国は「許可制」である。国家自然科学基金委員会は申請書を生成AIで直接生成することを禁止行為に挙げ、AIを成果の共同完成者に挙げられないようにし、審査委員が生成AIで審査するには基金委の事前許可を得るよう定めた。"]),
 s("B",[42],["언론 보도와 원문이 다른 경우도 있다: 2023년 학위법 초안에는 '인공지능 대필'이 학위 취소 사유로 명시돼 널리 보도됐지만, 2025년 시행된 확정 조문 제37조는 '대필·표절·위조 등 학술 부정'만 열거해 AI 대필을 일반 대필 조항으로 다룬다.",
  "Press reports and the original sometimes differ: the 2023 draft Degree Law, widely reported, named 'AI ghostwriting' as grounds for revoking degrees, but the final Article 37, in force since 2025, lists only 'ghostwriting, plagiarism, fabrication and other academic misconduct', handling AI ghostwriting under the general ghostwriting clause.",
  "Сообщения СМИ и первоисточник порой расходятся: в проекте Закона о степенях 2023 года, широко освещённом, основанием лишения степени называлось «написание с помощью ИИ», но окончательная статья 37 (действует с 2025 года) перечисляет лишь «написание за автора, плагиат, фальсификацию и иную недобросовестность», рассматривая ИИ по общей норме.",
  "媒体报道与原文也有出入：2023年《学位法》草案把“人工智能代写”明列为撤销学位事由并被广泛报道，但2025年施行的正式条文第三十七条只列举“代写、剽窃、伪造等学术不端行为”，以一般代写条款处理AI代写。",
  "報道と原文が異なる場合もある。2023年の学位法草案には「人工知能による代筆」が学位取消しの事由として明記され広く報じられたが、2025年施行の確定条文第37条は「代筆・剽窃・偽造などの学術不正」だけを挙げ、AI代筆を一般の代筆条項で扱う。"],null,"H"),
 s("B",[43],["일본은 '금지 + 국산 AI'다: 문부과학성 자료는 일본학술진흥회(JSPS)가 정보 유출 위험 때문에 심사에서 생성형 AI의 직접 사용을 금지한다고 정리하고, 국립정보학연구소가 2026~2027년 2,500만 엔으로 안전한 국산 기반의 심사 지원 AI 에이전트를 조사·설계한다고 밝혔다.",
  "Japan pairs a ban with domestic AI: a MEXT document states that JSPS prohibits direct use of generative AI in review because of leakage risk, and that the National Institute of Informatics will study and design a review-support AI agent on a secure domestic platform in 2026–2027 with ¥25 million.",
  "Япония сочетает запрет с отечественным ИИ: документ MEXT указывает, что JSPS запрещает прямое использование генеративного ИИ в экспертизе из-за риска утечек, а Национальный институт информатики в 2026–2027 годах за 25 млн иен изучит и спроектирует ИИ-агента поддержки экспертизы на безопасной отечественной платформе.",
  "日本是“禁止+国产AI”：文部科学省资料指出，日本学术振兴会（JSPS）因信息泄露风险禁止在评审中直接使用生成式AI，并宣布国立情报学研究所将于2026–2027年以2,500万日元调查设计基于安全国产平台的评审支援AI智能体。",
  "日本は「禁止＋国産AI」である。文部科学省の資料は、日本学術振興会（JSPS）が情報流出の危険から審査で生成AIを直接使うことを禁じていると整理し、国立情報学研究所が2026〜2027年度に2,500万円で安全な国産基盤の審査支援AIエージェントを調査・設計すると示した。"]),
 s("B",[44,45],["한국은 2026년에 두 단계로 정리했다: 한국연구재단은 6월 30일 대학 연구자용 생성형 AI 연구윤리 가이드를 냈고, 과기정통부는 9월 20일 국가연구개발 AI 연구윤리 가이드를 확정해 평가자의 외부 AI 입력 금지와 피평가자의 AI를 통한 평가 왜곡 금지를 명시했다.",
  "Korea set its rules in two steps in 2026: the NRF issued a generative-AI research ethics guide for university researchers on 30 June, and on 20 September the science ministry finalised a national R&D AI research ethics guide stating that evaluators must not enter materials into external AI and that those evaluated must not try to distort evaluation through AI.",
  "Корея оформила правила в два шага в 2026 году: NRF 30 июня выпустил руководство по этике генеративного ИИ для вузовских исследователей, а 20 сентября министерство науки утвердило руководство по этике ИИ в госНИОКР: эксперты не вводят материалы во внешний ИИ, а оцениваемые не пытаются исказить оценку через ИИ.",
  "韩国在2026年分两步完成规范：韩国研究财团6月30日发布面向大学研究者的生成式AI研究伦理指南；科学技术信息通信部9月20日确定国家研发AI研究伦理指南，明确评审者不得将材料输入外部AI、被评审者不得借AI歪曲评审。",
  "韓国は2026年に二段階で整えた。韓国研究財団は6月30日に大学の研究者向けの生成AI研究倫理ガイドを出し、科学技術情報通信部は9月20日に国家研究開発AI研究倫理ガイドを確定し、評価者が外部AIに資料を入力しないことと、被評価者がAIで評価を歪めようとしないことを明記した。"]),
 s("C",[46,47],["러시아는 표준과 제안 단계에 있다: 2025년 시행된 국가표준 GOST R 71657-2024는 AI의 정보 수집·처리를 허용하되 논문은 연구자가 직접 쓰도록 했고, 고등학위위원회(VAK) 부위원장은 학위논문에서 맞춤법·서지 점검은 허용하고 문헌 검토·결론·심사평은 금지하자는 구분안을 냈다.",
  "Russia is at the stage of standards and proposals: the national standard GOST R 71657-2024, in force since 2025, allows AI for gathering and processing information but requires researchers to write papers themselves, and a deputy chair of the Higher Attestation Commission (VAK) proposed allowing AI for spelling and bibliography checks in theses while banning it for literature reviews, conclusions and reviews.",
  "Россия на стадии стандартов и предложений: ГОСТ Р 71657-2024 (действует с 2025 года) допускает ИИ для сбора и обработки информации, но статьи учёные пишут сами, а заместитель председателя ВАК предложил разграничение: в диссертациях ИИ допустим для орфографии и проверки библиографии, но запрещён в обзоре литературы, выводах и рецензиях.",
  "俄罗斯处于标准与提案阶段：2025年实施的国家标准GOST R 71657-2024允许AI用于信息收集与处理，但论文须由研究者亲自撰写；高等学位委员会（VAK）副主席提出区分方案：学位论文中允许AI用于拼写与书目核对，禁止用于文献综述、结论与评审意见。",
  "ロシアは規格と提案の段階にある。2025年施行の国家規格GOST R 71657-2024はAIによる情報の収集・処理を認める一方で論文は研究者自身が書くよう定め、高等学位委員会（VAK）の副委員長は学位論文で綴り・書誌の点検は認め、文献レビュー・結論・審査意見は禁じる区分案を出した。"],null,"L"),
 s("D",[37,38,41,43,45,21],["판단: 규칙은 'AI는 저자가 아니다·사용은 밝힌다·심사 자료는 외부 AI에 넣지 않는다'라는 세 원칙으로 수렴했지만, 집행 방식은 금지(미·영)·허가(중)·자체 AI 개발(일)·가이드(한)로 갈리며, 어느 나라도 투고 단계의 인용 자동 검증을 의무화하지 않았다.",
  "Judgement: rules have converged on three principles — AI is not an author, use is disclosed, review materials stay out of external AI — but enforcement models diverge into prohibition (US, UK), permission (China), building one's own AI (Japan) and guidance (Korea), and no country mandates automated citation checks at submission.",
  "Вывод: правила сошлись на трёх принципах — ИИ не автор, использование раскрывается, материалы экспертизы не попадают во внешний ИИ, — но модели исполнения расходятся: запрет (США, Великобритания), разрешение (Китай), собственный ИИ (Япония) и руководства (Корея); ни одна страна не требует автоматической проверки ссылок при подаче.",
  "判断：规则已收敛于“AI不是作者、使用须披露、评审材料不入外部AI”三原则，但执行模式分化为禁止（美、英）、许可（中）、自研AI（日）与指南（韩），且没有任何国家强制在投稿阶段自动核查引用。",
  "判断：規則は「AIは著者ではない・使用は開示する・審査資料は外部AIに入れない」という三原則に収束したが、執行の方式は禁止（米・英）・許可（中）・自前のAI開発（日）・ガイド（韓）に分かれ、どの国も投稿段階での引用の自動検証を義務化していない。"],null,"M")

  "Every rule says AI cannot be an author and responsibility lies with people, but once a manuscript produced end-to-end from hypothesis to writing can pass workshop review, the substance of responsibility becomes a contribution statement recording what the human authors actually verified.",

  "所有规则都规定“AI不能成为作者、责任在人”，但当从假设到写作全自动完成的稿件能通过研讨会审稿时，记录“人类作者实际核查了什么”的贡献声明才是责任的实质。",

  "The common reason the US, Japan and Korea bar entering review materials into external AI is confidentiality: grant applications describe future research and are more sensitive than papers, and reviewers cannot control where content entered into an external service is stored or trained on.",

  "Detectors misclassify non-native writers' text as AI, and human reviewers wrongly flagged 14% of genuine abstracts, so punishing on detection results systematically disadvantages researchers whose first language is not English.",

 s("D",[32,25,27,26],["논문 수와 피인용으로 평가하는 한, AI는 '같은 내용을 더 많이, 더 그럴듯하게' 쓰는 쪽에 보상을 주므로, 논문 수 대신 소수 대표 성과를 깊이 읽는 평가로 바꾸지 않으면 규칙만으로는 논문공장식 생산을 막기 어렵다.",

[P(
 s("D",[18,44,45],["한국은 '사건이 먼저, 규칙이 뒤따른' 경우다: 2025년 KAIST 논문 3편이 숨은 프롬프트로 철회된 뒤 2026년에 연구재단(6월)과 과기정통부(9월)가 연달아 가이드를 냈지만, 위반 조사·제재 절차는 기관 자율에 남아 있다.",
  "Korea is a case of the incident coming first and rules following: after three KAIST papers were withdrawn over hidden prompts in 2025, the NRF (June) and the science ministry (September) issued guides in quick succession in 2026, but procedures to investigate and sanction violations are left to institutions.",
  "Корея — случай, где сначала инцидент, потом правила: после отзыва трёх статей KAIST из-за скрытых подсказок в 2025 году NRF (июнь) и министерство науки (сентябрь) в 2026 году одно за другим выпустили руководства, но процедуры расследования и санкций оставлены на усмотрение организаций.",
  "韩国属于“事件在先、规则在后”：2025年KAIST三篇论文因隐藏提示词撤回后，2026年研究财团（6月）与科学技术信息通信部（9月）相继发布指南，但违规调查与制裁程序仍交由各机构自主。",

 s("D",[43,22],["일본은 '금지하면서 안전한 국산 AI를 만드는' 경로로, 심사 부담을 줄일 공식 도구를 국가가 직접 설계하는 유일한 사례이며, 일본 연구진은 자연어처리 학회의 환각 인용 실태를 전수 조사해 문제 측정에서도 앞서 있다.",

 s("D",[41,42,7,26],["중국은 기금위 허가제와 학위법으로 규칙이 가장 촘촘한 편이지만, 심사자의 AI 채택이 77%로 높게 응답되고 장기 철회율도 높아 실적 압박 마찰(D)이 가장 큰 축에 속한다.",

  "Правила Китая — одни из самых плотных (разрешительный порядок NSFC и Закон о степенях), но доля рецензентов с ИИ указана на уровне 77%, а долгосрочная доля отзывов высока, поэтому трение публикационного давления (D) — одно из самых сильных.",
  "中国凭基金委许可制与《学位法》规则较为严密，但审稿人AI采用率自报高达77%，长期撤稿率也高，业绩压力摩擦（D）属最大之列。",
  "中国は基金委の許可制と学位法で規則が最も緻密な部類だが、査読者のAI採用が77%と高く回答され長期の撤回率も高いため、業績圧力の摩擦（D）が最も大きい部類に入る。"],null,"M"),
 s("D",[46,47,26],["러시아는 국가표준과 VAK의 구분안처럼 '허용 범위를 정하는' 논의가 진행 중이지만, 이 보고서는 집행 자료를 찾지 못했고 장기 철회율이 높아, 근거가 가장 약한 비교 대상으로 둔다.",
  "Russia is debating where to draw the line, through the national standard and the VAK proposal, but this report found no enforcement data and its long-run retraction rate is high, so it is the comparison case with the weakest evidence.",
  "В России обсуждают границы допустимого — через национальный стандарт и предложение ВАК, — но данных о правоприменении доклад не нашёл, а долгосрочная доля отзывов высока, поэтому это объект сравнения с самыми слабыми данными.",
  "俄罗斯正通过国家标准与VAK区分方案讨论“划定允许范围”，但本报告未找到执行资料，长期撤稿率也高，因此列为依据最弱的比较对象。",
  "ロシアは国家規格やVAKの区分案のように「許容範囲を決める」議論が進むが、本報告は執行の資料を見つけられず長期の撤回率も高いため、根拠が最も弱い比較対象とする。"],null,"L"),
 s("D",[8,10,38,39,40],["미국은 정부 규칙(NSF)보다 학회(ICML·ICLR·NeurIPS)의 자율 집행이 앞서 있고, 영국은 '탐지로 추측하지 말라'는 공정 원칙이 가장 명확하며, EU는 회원국 공통 권고에 머물러 있다.",
  "In the US, self-governing enforcement by conferences (ICML, ICLR, NeurIPS) is ahead of government rules (NSF); the UK has the clearest fairness principle — do not speculate by detection; and the EU remains at common recommendations for member states.",
  "В США самоуправляемое правоприменение конференций (ICML, ICLR, NeurIPS) опережает государственные правила (NSF); у Великобритании самый ясный принцип справедливости — не гадать по детекции; ЕС остаётся на уровне общих рекомендаций.",
  "美国学会（ICML、ICLR、NeurIPS）的自律执行领先于政府规则（NSF）；英国“不得凭检测揣测”的公平原则最为明确；欧盟仍停留在成员国共同建议层面。",
  "米国は政府の規則（NSF）より学会（ICML・ICLR・NeurIPS）の自主的な執行が先行し、英国は「検出で推測するな」という公平の原則が最も明確で、EUは加盟国共通の勧告にとどまっている。"],null,"M")

SEC("scen",["미래 전망: 2035년 4대 시나리오","Outlook: Four Scenarios for 2035","Прогноз: четыре сценария на 2035 год","未来展望：2035年四大情景","将来展望：2035年の4つのシナリオ"],
[P(
 s("D",[],["네 시나리오는 2035년 A(AI의 침투)·L(신뢰의 완충력)·I(무결성 대응) 수준이 임계값을 넘는지로 판정한다: 침투가 억제되면 S4, 침투했는데 완충력이 무너지면 S3, 완충력이 버티면 제도 대응의 강도에 따라 S1 또는 S2다.",
  "The four scenarios are decided by whether 2035 levels of A (AI permeation), L (trust buffer) and I (integrity response) cross thresholds: S4 if permeation is held back; S3 if AI permeates and the buffer collapses; if the buffer holds, S1 or S2 depending on the strength of the institutional response.",
  "Четыре сценария определяются тем, превышают ли уровни 2035 года A (проникновение ИИ), L (буфер доверия) и I (ответ институтов) пороги: S4 — если проникновение сдержано; S3 — если ИИ проник, а буфер рухнул; если буфер держится — S1 или S2 в зависимости от силы институционального ответа.",

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNorm(r){let sp=null;return function(){if(sp!==null){const v=sp;sp=null;return v;}let u=0,v=0;while(u===0)u=r();v=r();const m=Math.sqrt(-2*Math.log(u));sp=m*Math.sin(2*Math.PI*v);return m*Math.cos(2*Math.PI*v);}}
const sig=x=>1/(1+Math.exp(-x)), logit=p=>Math.log(p/(1-p));
function runMCMC(opt){
