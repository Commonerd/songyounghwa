<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI와 일, 그리고 책임의 문제 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}

/* mobile: keep panel tables and reference filters inside the viewport */
.panelc{min-width:0;overflow-x:auto}.reff .seg{flex-wrap:wrap}

/* evidence tables on narrow screens: scroll the table sideways instead of crushing CJK columns to one character */
.tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;max-width:15em}
@media (max-width:760px){
 .tblwrap table.t:has(tr.sent){width:auto;min-width:100%}
 .tblwrap table.t:has(tr.sent) td,.tblwrap table.t:has(tr.sent) th{min-width:8.5em}
 .tblwrap table.t:has(tr.sent) td:first-child,.tblwrap table.t:has(tr.sent) th:first-child{white-space:normal;min-width:6.5em;max-width:10em}

<script>
// ===== Core helpers (data authoring format) =====
// Text arrays are always in the order [ko, en, ru, zh, ja].
// grade: A/B/C = strongest evidence class behind a sentence; D = Claude's analytic inference (sentences only)
// type codes: q1 = Q1 peer-reviewed paper, stat = official statistics, io = international org / government / public research report,
//             survey = methodologically disclosed survey, press = news report, ind = industry/company data
const LANGS=["ko","en","ru","zh","ja"];
function tx(o,lang){if(!o)return "";if(typeof o==="string")return o;return o[lang]??o.en??o.ko??"";}
const L5=a=>{if(!a)return null;if(!Array.isArray(a))return a;const o={};LANGS.forEach((l,i)=>o[l]=a[i]);return o;};
// sentence: s(grade, refs, [ko,en,ru,zh,ja], note[5]?, conf?)  conf: "H" | "M" | "L"
const s=(g,refs,t,note,conf)=>({g:g,refs:refs||[],t:L5(t),note:note?L5(note):null,conf:conf||null});
const P=(...x)=>({p:x}), KJ=(...x)=>({kj:x}), H=t=>({h:L5(t)}), CH=c=>({chart:c}), TB=k=>({table:k}), SCN={scen:1}, W=w=>({widget:w}), REFL={reflist:1};
const EVIDENCE=[];
function E(id,grade,type,year,src,title,url,quote,crit,judg){const e={id,grade,type,year,src,title,url,quote};LANGS.forEach((l,i)=>e[l]={crit:crit[i],judg:judg[i]});EVIDENCE.push(e);}
const SECTIONS=[];
function SEC(id,t,detail,concise){SECTIONS.push({id:id,t:L5(t),detail:detail,concise:concise});}
const DREFS=[11,12,14];

// ===== Evidence 1–20: responsibility theory, outcome/hindsight bias, job strain, project delay, procrastination, culture =====
E(1,"A","q1",2019,"Madeleine Clare Elish, Engaging Science, Technology, and Society 5 (2019)","Moral Crumple Zones: Cautionary Tales in Human-Robot Interaction","https://estsjournal.org/index.php/ests/article/view/260",
"the moral crumple zone protects the integrity of the technological system",
["자동차의 충격 흡수 구역처럼, 자동화 시스템에서 통제권이 제한된 사람이 도덕적·법적 책임을 떠안아 시스템의 무결성을 지켜 주는 구조를 개념화했다. 여러 대형 사고를 사례로 분석한 질적 연구라 빈도를 재지는 않지만, '사람의 감독'이 비난 흡수 장치로 바뀌는 경로를 가장 정확히 이름 붙였다.",
 "Conceptualises how, like a car's crumple zone, a human with limited control over an automated system absorbs moral and legal responsibility and so protects the system's integrity. A qualitative analysis of several high-profile accidents, it does not measure frequency, but it names most precisely how 'human oversight' can become a blame-absorbing device.",
 "Концептуализирует, как человек с ограниченным контролем над автоматизированной системой, подобно зоне деформации автомобиля, принимает на себя моральную и правовую ответственность и тем защищает целостность системы. Качественный анализ нескольких громких аварий не измеряет частоту, но точнее всего называет путь, по которому «человеческий надзор» превращается в поглотитель вины.",
 "将自动化系统中控制权有限的人如汽车吸能区一般承担道德与法律责任、从而保护系统完整性的结构概念化。这是以多起重大事故为案例的质性研究，未测量频率，但最准确地命名了“人的监督”转变为吸收指责装置的路径。",
 "自動車の衝撃吸収ゾーンのように、自動化システムで統制権の限られた人が道徳的・法的責任を負い、システムの無欠性を守る構造を概念化した。複数の大事故を事例とする質的研究で頻度は測らないが、「人の監督」が非難の吸収装置に変わる経路を最も正確に名づけた。"],
["사람-AI 협업에서 책임이 통제권이 가장 적은 사람에게 몰리는 구조를 설명하는 핵심 틀로 쓴다.","Used as the core frame for how responsibility in human–AI work concentrates on the person with the least control.","Используется как ключевая рамка того, как ответственность в работе человека и ИИ концентрируется на том, у кого меньше всего контроля.","作为解释人机协作中责任集中到控制权最少者身上的核心框架。","人とAIの協働で責任が統制権の最も少ない人に集中する構造を説明する中核的な枠組みとして使う。"]);

E(2,"A","q1",2004,"A. Matthias, Ethics and Information Technology (2004)","The responsibility gap: Ascribing responsibility for the actions of learning automata","https://link.springer.com/article/10.1007/s10676-004-3422-1",
"facing a responsibility gap, which cannot be bridged by traditional concepts",
["학습하는 기계는 제조사·운영자도 행동을 예측할 수 없으므로 전통적 책임 귀속이 성립하지 않는 '책임 공백'이 생긴다고 논증했다. 철학적 논증이라 실증 자료는 없고, 이후 연구(근거 3)는 공백이 학습 시스템에만 생기는 것이 아니라고 비판한다.",
 "Argues that because neither manufacturer nor operator can predict a learning machine's behaviour, a 'responsibility gap' opens where traditional ascription fails. It is a philosophical argument without empirical data, and later work (evidence 3) criticises the idea that gaps arise only with learning systems.",
 "Утверждает, что поскольку ни производитель, ни оператор не могут предсказать поведение обучающейся машины, возникает «разрыв ответственности», где традиционное приписывание не работает. Это философский аргумент без эмпирических данных; позднейшая работа (источник 3) оспаривает, что разрывы возникают лишь у обучающихся систем.",
 "论证由于制造者与操作者都无法预测学习型机器的行为，传统责任归属失效，出现“责任空白”。这是哲学论证，缺乏实证数据；后续研究（依据3）批评空白并非只出现在学习系统中。",
 "学習する機械は製造者も運用者も行動を予測できないため、伝統的な責任帰属が成り立たない「責任の空白」が生じると論証した。哲学的論証で実証データはなく、後の研究（根拠3）は空白が学習システムにだけ生じるわけではないと批判する。"],
["'아무도 책임지지 않는' 시나리오(S3)의 이론적 출발점으로 쓴다.","Used as the theoretical starting point for the 'nobody is accountable' scenario (S3).","Используется как теоретическая отправная точка сценария «никто не отвечает» (S3).","作为“无人负责”情景（S3）的理论起点。","「誰も責任を負わない」シナリオ（S3）の理論的な出発点として使う。"]);

E(3,"A","q1",2021,"F. Santoni de Sio & G. Mecacci, Philosophy & Technology (2021)","Four Responsibility Gaps with Artificial Intelligence: Why they Matter and How to Address them","https://link.springer.com/article/10.1007/s13347-021-00450-x",
"not one problem but a set of at least four interconnected problems",
["책임 공백을 비난 가능성(culpability)·도덕적 해명·공적 해명·능동적 책임의 네 갈래로 나누고, 원인이 기술만이 아니라 조직·법·윤리·사회에도 있으며 비학습 시스템에서도 생긴다고 봤다. '숙명론·부정론·해결주의'를 모두 비판하고 '의미 있는 인간 통제' 설계를 제안한다.",
 "Splits the responsibility gap into four — culpability, moral accountability, public accountability and active responsibility — with sources that are organisational, legal, ethical and societal as well as technical, and notes gaps also arise with non-learning systems. It criticises 'fatalism', 'deflationism' and 'solutionism' and proposes designing for 'meaningful human control'.",
 "Делит разрыв ответственности на четыре — виновность, моральная и публичная подотчётность, активная ответственность — с источниками не только техническими, но и организационными, правовыми, этическими и социальными; разрывы возникают и у необучающихся систем. Критикует «фатализм», «дефляционизм» и «солюционизм» и предлагает проектировать «значимый человеческий контроль».",
 "将责任空白分为可谴责性、道德问责、公共问责与积极责任四类，原因不仅是技术，也包括组织、法律、伦理与社会，且非学习系统也会出现。它批评“宿命论、否认论、技术解决主义”，提出以“有意义的人类控制”为设计原则。",
 "責任の空白を非難可能性・道徳的説明責任・公的説明責任・能動的責任の4つに分け、原因は技術だけでなく組織・法・倫理・社会にもあり、学習しないシステムでも生じるとした。「宿命論・否定論・解決主義」をすべて批判し、「意味ある人間の統制」の設計を提案する。"],
["'책임의 해상도'라는 이 보고서의 중심 주장을 뒷받침하는 가장 직접적인 학술 근거로 쓴다.","Used as the most direct scholarly support for this report's central claim about the 'resolution' of responsibility.","Используется как самое прямое научное обоснование главного тезиса доклада о «разрешении» ответственности.","作为支撑本报告“责任分辨率”核心主张最直接的学术依据。","本報告の中心的主張である「責任の解像度」を支える最も直接的な学術根拠として使う。"]);

E(4,"A","q1",2006,"Iris Marion Young, Social Philosophy and Policy 23(1) (2006)","Responsibility and Global Justice: A Social Connection Model","https://doi.org/10.1017/S0265052506060043",
"its responsibility is essentially shared",
["가해자를 골라내는 '책임 귀속(liability) 모델'과 달리, 구조적 부정의에 참여한 모두가 앞을 보며 함께 지는 '사회적 연결 모델'을 제시했다. 원래 의류 공급망 사례로 논의됐고, 조직 안의 실패에 적용하는 것은 이 보고서의 해석(D)이다.",
 "Offers a 'social connection model' in which everyone who participates in structural injustice shares a forward-looking responsibility, in contrast to a 'liability model' that singles out perpetrators. It was developed with the example of clothing supply chains; applying it to failures inside organisations is this report's interpretation (D).",
 "Предлагает «модель социальной связи», в которой все участники структурной несправедливости разделяют ответственность, обращённую в будущее, в отличие от «модели вины», выделяющей виновника. Модель разработана на примере цепочек поставок одежды; применение к сбоям внутри организаций — интерпретация доклада (D).",
 "提出与挑出加害者的“责任归咎模型”不同的“社会连接模型”：所有参与结构性不正义者共同承担面向未来的责任。原以服装供应链为例，将其应用于组织内部失败是本报告的解读（D）。",
 "加害者を選び出す「責任帰属モデル」と違い、構造的不正義に参加した全員が前を向いて共に負う「社会的つながりモデル」を示した。もとは衣料のサプライチェーンの事例で論じられ、組織内の失敗に適用するのは本報告の解釈（D）である。"],
["'개인 책임이냐 구조 책임이냐'의 양자택일을 넘는 인문학적 틀로 쓴다.","Used as the humanities frame that goes beyond the either/or of individual versus structural responsibility.","Используется как гуманитарная рамка, выходящая за рамки выбора «индивидуальная или структурная ответственность».","作为超越“个人责任还是结构责任”二选一的人文学框架。","「個人の責任か構造の責任か」の二者択一を超える人文学の枠組みとして使う。"]);

E(5,"B","book",2025,"Stanford Encyclopedia of Philosophy, entry 'Moral Luck' (first published 2004; substantive revision 20 Jan 2025)","Moral Luck","https://plato.stanford.edu/entries/moral-luck/",
"Resultant luck is luck in the way things turn out.",
["윌리엄스와 네이글의 도덕적 운 논쟁과 결과적·상황적·구성적·인과적 운의 구분을 정리한 동료심사 백과사전 항목이다. 2차 문헌이므로 원전 대신 개념 정리에만 쓰며, 집필자 이름은 확인된 본문에서 보지 못해 표기하지 않았다.",
 "A peer-reviewed encyclopedia entry summarising the Williams–Nagel debate on moral luck and the distinction between resultant, circumstantial, constitutive and causal luck. As secondary literature it is used only for the concepts, not as a substitute for the originals; the author's name was not visible in the verified text and is omitted.",
 "Рецензируемая энциклопедическая статья, излагающая спор Уильямса и Нагеля о моральной удаче и различение удачи результата, обстоятельств, конституции и причинности. Как вторичный источник используется только для понятий; имя автора в проверенном тексте не видно и не указано.",
 "这是一篇经同行评审的百科条目，整理了威廉斯与内格尔关于道德运气的争论，以及结果、情境、构成与因果运气的区分。作为二手文献仅用于概念梳理；在核实的正文中未见作者姓名，故不标注。",
 "ウィリアムズとネーゲルの道徳的運の論争と、結果的・状況的・構成的・因果的な運の区別を整理した査読付き百科事典の項目である。二次文献なので概念整理にだけ使い、確認した本文で執筆者名が見えなかったため表記しない。"],
["같은 판단도 결과가 나쁘면 더 비난받는 현상(근거 7)의 철학적 배경으로 쓴다.","Used as the philosophical background to the finding that the same judgement is blamed more when the outcome is bad (evidence 7).","Используется как философский фон того, что одно и то же решение осуждают сильнее при плохом исходе (источник 7).","作为“同一判断在结果不好时受到更多指责”（依据7）的哲学背景。","同じ判断でも結果が悪いとより非難される現象（根拠7）の哲学的背景として使う。"]);

E(6,"B","book",2023,"Stanford Encyclopedia of Philosophy, entry 'Computing and Moral Responsibility' (first published 2012; substantive revision 2 Feb 2023)","Computing and Moral Responsibility","https://plato.stanford.edu/entries/computing-responsibility/",
"it is difficult to determine who was responsible for what",
["톰슨이 말한 '많은 손의 문제'를 컴퓨터 시스템 사고(테락-25 등)에 적용한 논의와 마티아스의 책임 공백 논쟁을 정리한다. 2차 문헌이며, 톰슨의 1980년 원 논문은 출판사 페이지가 자동 접속을 막아 이 항목으로 대신 확인했다.",
 "Summarises how Thompson's 'problem of many hands' has been applied to computer-system accidents such as Therac-25, and the debate on Matthias's responsibility gap. It is secondary literature; Thompson's 1980 original could not be opened because the publisher's page blocks automated access, so this entry was used instead.",
 "Излагает применение «проблемы многих рук» Томпсона к авариям компьютерных систем (Therac-25 и др.) и спор о разрыве ответственности Маттиаса. Это вторичный источник; оригинал Томпсона 1980 года открыть не удалось — страница издателя блокирует автоматический доступ.",
 "整理了汤普森“多手问题”在计算机系统事故（如Therac-25）中的应用以及马蒂亚斯责任空白的争论。属二手文献；汤普森1980年原文因出版社页面阻止自动访问而无法打开，故以此条目代替核实。",
 "トンプソンの「多くの手の問題」をコンピュータシステムの事故（セラック25など）に当てはめた議論と、マティアスの責任の空白をめぐる論争を整理する。二次文献で、トンプソンの1980年の原論文は出版社のページが自動アクセスを遮断するためこの項目で代わりに確認した。"],
["'여러 사람이 조금씩 관여해 아무도 책임지지 않는' 구조를 설명하는 데 쓴다.","Used to explain the structure in which many people each contribute a little and no one is responsible.","Используется для объяснения структуры, где многие понемногу участвуют и никто не отвечает.","用于解释“许多人各参与一点而无人负责”的结构。","「多くの人が少しずつ関わり誰も責任を負わない」構造の説明に使う。"]);

E(7,"A","q1",1988,"J. Baron & J. C. Hershey, Journal of Personality and Social Psychology (1988)","Outcome bias in decision evaluation","https://pubmed.ncbi.nlm.nih.gov/3367280/",
"they should not consider outcomes in making these evaluations, they did so",
["5개 실험에서 같은 정보로 내린 결정이라도 결과가 좋으면 사고의 질과 결정자의 역량을 더 높게 평가했다. 대학생 참가자와 가상 시나리오라는 한계가 있지만, 참가자가 '결과를 보면 안 된다'고 알면서도 결과에 휘둘렸다는 점이 핵심이다.",
 "Across five studies, the same decision made with the same information was rated as better thinking, and its maker as more competent, when the outcome was favourable. Participants were undergraduates with hypothetical scenarios, but the key point is that they were swayed by outcomes even while believing they should not be.",
 "В пяти исследованиях одно и то же решение при той же информации оценивали как лучшее мышление, а его автора — как более компетентного, если исход был благоприятным. Участники — студенты, сценарии гипотетические, но главное: на них влиял исход, хотя они считали, что не должен.",
 "五项实验显示，以相同信息做出的同一决定，结果好时其思考质量与决策者能力被评价得更高。参与者为大学生、情景为假设，但关键在于参与者明知不应考虑结果，却仍受结果左右。",
 "5つの実験で、同じ情報で下した同じ決定でも結果が良いと思考の質と決定者の能力をより高く評価した。参加者は大学生で仮想シナリオという限界はあるが、「結果を見てはいけない」と分かっていても結果に左右された点が核心である。"],
["실패한 프로젝트의 담당자 평가가 사전 판단이 아니라 결과로 왜곡되는 메커니즘의 근거로 쓴다.","Used as evidence for the mechanism by which evaluations of those in charge of failed projects are distorted by outcomes rather than prior judgement.","Используется как доказательство механизма, при котором оценку ответственных за провальный проект искажает исход, а не исходное суждение.","作为失败项目负责人评价被结果而非事前判断扭曲之机制的依据。","失敗したプロジェクトの担当者の評価が事前の判断ではなく結果で歪む仕組みの根拠として使う。"]);

E(8,"A","q1",1975,"B. Fischhoff, J. Exp. Psychology: Human Perception and Performance (1975); reprinted Qual Saf Health Care 12(4) (2003)","Hindsight ≠ foresight: the effect of outcome knowledge on judgment under uncertainty","https://pubmed.ncbi.nlm.nih.gov/12897366/",
"can seriously restrict one's ability to judge or learn from the past",
["결과를 알게 되면 그 결과가 원래 더 그럴듯했다고 느끼고, 자신이 결과 없이도 알았을 것이라고 과대평가한다는 '사후확신 편향'의 고전 실험이다. 확인한 것은 2003년 의료 안전 학술지의 재수록본 기록이며, 1975년 원판 기록은 데이터베이스에서 따로 찾지 못했다.",
 "The classic experiments on hindsight bias: once people know the outcome they judge it to have been more likely and overestimate what they would have known without it. What was verified is the 2003 reprint record in a health-care safety journal; the original 1975 record was not separately found in the database.",
 "Классические эксперименты о ретроспективном искажении: узнав исход, люди считают его более вероятным и переоценивают, что знали бы без него. Проверена запись перепечатки 2003 года в журнале о безопасности медпомощи; запись оригинала 1975 года отдельно не найдена.",
 "关于“后见之明偏差”的经典实验：得知结果后，人们会认为结果本来就更可能，并高估自己在不知道结果时也能知道。核实的是2003年医疗安全期刊的重刊记录，1975年原版记录未在数据库中单独找到。",
 "結果を知ると、その結果がもともともっともらしかったと感じ、結果なしでも分かったはずだと過大評価する「後知恵バイアス」の古典的実験である。確認したのは2003年の医療安全誌の再録版の記録で、1975年の原版の記録はデータベースで別途見つけられなかった。"],
["'왜 미리 몰랐나'라는 사후 책임 추궁이 공정하지 않을 수 있다는 근거로 쓴다.","Used as evidence that after-the-fact blame — 'why didn't you know earlier?' — can be unfair.","Используется как довод, что ретроспективные упрёки «почему не знали раньше?» могут быть несправедливы.","用作“为何不早知道”式事后追责可能不公平的依据。","「なぜ事前に分からなかったのか」という事後の責任追及が公正でない場合があることの根拠として使う。"]);

E(9,"A","q1",2012,"M. Kivimäki et al. (IPD-Work Consortium), The Lancet (2012)","Job strain as a risk factor for coronary heart disease: a collaborative meta-analysis of individual participant data","https://europepmc.org/article/MED/22981903",
"30,214 (15%) of 197,473 participants reported job strain",
["유럽 13개 코호트 19만7,473명의 개인 자료를 통합해, 요구는 높고 재량(통제)은 낮은 '직무 긴장'이 관상동맥질환 위험을 23% 높인다(위험비 1.23)고 추정했다. 출판 연구(1.43)가 미출판 연구(1.16)보다 효과가 커 출판 편향을 보정했다는 점이 강점이고, 유럽 자료라 아시아 일반화에는 한계가 있다.",
 "Pooling individual data on 197,473 people from 13 European cohorts, it estimates that job strain — high demands with low decision latitude (control) — raises coronary heart disease risk by 23% (hazard ratio 1.23). A strength is its correction for publication bias (published studies 1.43 vs unpublished 1.16); being European data limits generalisation to Asia.",
 "Объединив индивидуальные данные 197 473 человек из 13 европейских когорт, оценивает, что «напряжение на работе» — высокие требования при низкой свободе решений (контроле) — повышает риск ИБС на 23% (ОР 1,23). Сильная сторона — поправка на публикационное смещение (опубликованные 1,43 против неопубликованных 1,16); европейские данные ограничивают перенос на Азию.",
 "整合欧洲13个队列共197,473人的个人数据，估计需求高而决策自主（控制）低的“工作紧张”使冠心病风险提高23%（风险比1.23）。其优点是校正了发表偏倚（已发表1.43对未发表1.16）；欧洲数据推广到亚洲有局限。",
 "欧州13のコホート19万7,473人の個人データを統合し、要求が高く裁量（統制）が低い「職務緊張」が冠動脈疾患のリスクを23%高める（ハザード比1.23）と推定した。公表研究（1.43）が未公表研究（1.16）より効果が大きく公表バイアスを補正した点が強みで、欧州のデータなのでアジアへの一般化には限界がある。"],
["'통제 없는 책임'이 건강을 해친다는 요구-통제 모델의 가장 강한 실증 근거로 쓴다.","Used as the strongest empirical support for the demand–control model's claim that responsibility without control harms health.","Используется как самое сильное эмпирическое подтверждение модели «требования–контроль»: ответственность без контроля вредит здоровью.","作为需求—控制模型“无控制的责任损害健康”最有力的实证依据。","「統制なき責任」が健康を損なうという要求-統制モデルの最も強い実証根拠として使う。"]);

E(10,"B","io",2019,"World Health Organization, departmental update (28 May 2019)","Burn-out an \"occupational phenomenon\": International Classification of Diseases","https://www.who.int/news/item/28-05-2019-burn-out-an-occupational-phenomenon-international-classification-of-diseases",
"Burn-out refers specifically to phenomena in the occupational context",
["ICD-11은 번아웃을 의학적 질병이 아닌 '직업 현상'으로 분류하고, 에너지 고갈, 일과의 정신적 거리·냉소, 직업적 효능감 저하의 세 차원으로 정의했다. 정의일 뿐 유병률 자료는 아니며, 나라마다 측정 도구가 달라 국가 비교에는 쓰지 않는다.",
 "ICD-11 classifies burn-out as an 'occupational phenomenon', not a medical condition, defined by three dimensions: energy depletion, mental distance or cynicism towards one's job, and reduced professional efficacy. It is a definition, not prevalence data, and since countries use different instruments it is not used for country comparison.",
 "МКБ-11 относит выгорание к «профессиональному феномену», а не к болезни, и определяет его тремя измерениями: истощение, психологическая дистанция или цинизм к работе, снижение профессиональной эффективности. Это определение, а не данные о распространённости; из-за разных инструментов для сравнения стран не используется.",
 "ICD-11将职业倦怠归类为“职业现象”而非医学疾病，以精力耗竭、与工作的心理距离或犬儒、职业效能降低三个维度定义。这只是定义而非患病率数据，且各国测量工具不同，故不用于国家比较。",
 "ICD-11はバーンアウトを医学的疾患ではなく「職業上の現象」に分類し、エネルギーの枯渇、仕事との心理的距離・冷笑、職業的効力感の低下の3次元で定義した。定義であって有病率のデータではなく、国ごとに測定道具が違うため国の比較には使わない。"],
["번아웃을 개인의 나약함이 아니라 '관리되지 못한 직장 스트레스'의 결과로 보는 공식 정의로 쓴다.","Used as the official definition that treats burn-out as the result of unmanaged workplace stress, not personal weakness.","Используется как официальное определение, рассматривающее выгорание как следствие неуправляемого стресса на работе, а не слабости человека.","作为把倦怠视为“未被管理的职场压力”结果而非个人软弱的官方定义。","バーンアウトを個人の弱さではなく「管理されなかった職場のストレス」の結果とみる公式の定義として使う。"]);

E(11,"A","stat",2025,"厚生労働省 労働基準局 (Japan, Ministry of Health, Labour and Welfare), press release 25 Jun 2025","令和6年度「過労死等の労災補償状況」","https://www.mhlw.go.jp/stf/newpage_59039.html",
"支給決定件数は1,056件で前年度比173件の増加。",
["2024년도 일본의 정신장애 산재 청구는 3,780건, 인정은 1,056건(자살·미수 88건 포함)으로 늘었다. 인정 원인 1위는 상사 등의 괴롭힘(224건), 2위는 '업무 내용·업무량의 큰 변화'(120건)였다. 인정 기준을 통과한 사례만 잡히므로 실제 피해의 일부만 보여 준다.",
 "In fiscal 2024 Japan recorded 3,780 workers' compensation claims for mental disorders and 1,056 approvals (including 88 suicides and attempts). The top cause among approvals was harassment by superiors (224), followed by 'a major change in work content or workload' (120). Only cases meeting the approval criteria are counted, so it shows part of the harm.",
 "В 2024 финансовом году в Японии подано 3 780 заявлений о компенсации за психические расстройства, признано 1 056 (включая 88 самоубийств и попыток). Главная причина среди признанных — притеснения начальства (224), затем «резкое изменение содержания или объёма работы» (120). Учитываются только случаи, прошедшие критерии, — это часть вреда.",
 "2024财年日本精神障碍工伤申请3,780件、认定1,056件（含自杀及未遂88件）。认定原因第一是上司等的职权骚扰（224件），第二是“工作内容或工作量的重大变化”（120件）。只统计通过认定标准的案例，仅反映部分损害。",
 "2024年度の日本の精神障害の労災請求は3,780件、支給決定は1,056件（自殺・未遂88件を含む）に増えた。決定の出来事の1位は上司等からのパワーハラスメント（224件）、2位は「仕事内容・仕事量の大きな変化」（120件）だった。認定基準を通った事例だけが数えられるため、実際の被害の一部しか示さない。"],
["사양·업무량 변화가 공식 산재 원인으로 집계된다는, 비교 가능한 정부 통계로 쓴다.","Used as government statistics showing that changes in specifications and workload are officially counted as causes of occupational injury.","Используется как госстатистика, показывающая, что изменения задач и объёма работы официально учитываются как причины производственного вреда.","作为显示规格与工作量变化被正式计为工伤原因的政府统计。","仕様・業務量の変化が公式の労災の原因として集計されることを示す政府統計として使う。"]);

E(12,"B","survey",2022,"European Agency for Safety and Health at Work (EU-OSHA), Flash Eurobarometer OSH Pulse (30 Sep 2022)","OSH Pulse — Occupational safety and health in post-pandemic workplaces","https://osha.europa.eu/en/publications/osh-pulse-occupational-safety-and-health-post-pandemic-workplaces",
"exposed to severe time pressure or overload of work",
["EU·아이슬란드·노르웨이 취업자 2만7천여 명(2022년 4~5월) 대표 표본 조사에서 46%가 심한 시간 압박·업무 과부하, 26%가 조직 내 소통·협력 부족, 18%가 자율성·업무 속도 통제 부족에 노출된다고 답했고, 27%가 일로 생기거나 악화된 스트레스·우울·불안을 겪었다. 자기 보고라 과대·과소 응답 가능성이 있다.",
 "In a representative survey of over 27,000 workers in the EU, Iceland and Norway (April–May 2022), 46% reported severe time pressure or work overload, 26% poor communication or cooperation, and 18% lack of autonomy or influence over the pace of work; 27% reported stress, depression or anxiety caused or worsened by work. Self-reports may over- or under-state.",
 "В репрезентативном опросе более 27 000 работников ЕС, Исландии и Норвегии (апрель–май 2022) 46% сообщили о сильном дефиците времени или перегрузке, 26% — о плохой коммуникации, 18% — о нехватке автономии и влияния на темп работы; 27% — о стрессе, депрессии или тревоге, вызванных или усиленных работой. Самоотчёты могут искажать.",
 "在欧盟、冰岛与挪威2.7万余名就业者的代表性调查（2022年4–5月）中，46%表示面临严重时间压力或工作过载，26%为组织内沟通协作不足，18%为缺乏自主或对工作节奏的控制；27%经历由工作引起或加重的压力、抑郁或焦虑。属自我报告，可能高估或低估。",
 "EU・アイスランド・ノルウェーの就業者2万7千人超の代表標本調査（2022年4〜5月）で、46%が強い時間的圧迫・業務過多、26%が組織内の意思疎通・協力不足、18%が自律性・作業ペースへの影響力の不足にさらされると答え、27%が仕事で生じた・悪化したストレス・うつ・不安を経験した。自己申告なので過大・過小の可能性がある。"],
["유럽 노동자가 겪는 '통제 없는 압박'의 규모를 보여 주는 대표 조사로 쓴다.","Used as the representative survey showing the scale of 'pressure without control' among European workers.","Используется как репрезентативный опрос о масштабе «давления без контроля» у европейских работников.","作为显示欧洲劳动者“无控制压力”规模的代表性调查。","欧州の労働者が受ける「統制なき圧迫」の規模を示す代表的調査として使う。"]);

E(13,"A","q1",2026,"H. Park & K. Lee, Journal of Occupational Health (2026)","Bounded autonomy or unbounded work? Work-time control, boundary intrusion, and exhaustion in the Korean Working Conditions Survey","https://europepmc.org/article/MED/42911141",
"repeated work during free time (unbounded autonomy) was associated with greater exhaustion",
["한국 근로환경조사(2023년 2만2,036명, 2020년 2만3,971명)에서 일하는 시간을 스스로 정할 수 있는 노동자라도 여가 시간에 반복해서 일하면 소진이 더 컸다(2023년 β=0.36). 횡단 자료라 인과는 확정할 수 없고, 소진 척도가 2문항으로 짧다.",
 "In the Korean Working Conditions Survey (22,036 workers in 2023; 23,971 in 2020), even workers with high control over their working time showed more exhaustion when they repeatedly worked during free time (β=0.36 in 2023). The data are cross-sectional, so causality is not established, and the exhaustion scale has only two items.",
 "В Корейском обследовании условий труда (22 036 человек в 2023 г., 23 971 в 2020 г.) даже работники с высоким контролем над рабочим временем были более истощены, если регулярно работали в свободное время (β=0,36 в 2023 г.). Данные поперечные — причинность не установлена; шкала истощения из двух вопросов.",
 "在韩国工作条件调查（2023年22,036人、2020年23,971人）中，即使能自行决定工作时间的劳动者，若反复在闲暇时间工作，耗竭也更严重（2023年β=0.36）。横断面数据无法确定因果，耗竭量表仅2题。",
 "韓国の労働環境調査（2023年2万2,036人、2020年2万3,971人）で、働く時間を自分で決められる労働者でも余暇に繰り返し働くと消耗が大きかった（2023年β=0.36）。横断データなので因果は確定できず、消耗の尺度は2項目と短い。"],
["'재량이 있으니 책임도 네 몫'이라는 논리가 경계 없는 노동으로 이어질 수 있다는 한국 근거로 쓴다.","Used as Korean evidence that the logic 'you have discretion, so it's on you' can turn into boundless work.","Используется как корейское свидетельство, что логика «у тебя есть свобода — значит, это твоя ответственность» может превращаться в работу без границ.","作为韩国依据，说明“你有自主权所以责任归你”的逻辑可能导致无边界劳动。","「裁量があるのだから責任もあなたのもの」という論理が境界のない労働につながりうるという韓国の根拠として使う。"]);

E(14,"B","io",2026,"厚生労働省 (Japan, Ministry of Health, Labour and Welfare), workplace harassment page (accessed Nov 2026)","職場におけるハラスメントの防止のために","https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/koyou_roudou/koyoukintou/seisaku06/index.html",
"パワーハラスメント対策が事業主の義務となりました",
["일본은 2020년 6월부터(중소기업은 2022년 4월부터) 직장 내 괴롭힘(파워하라) 방지 조치를 사업주 의무로 정했고, 2026년 10월부터 고객 괴롭힘 대책도 모든 사업주의 의무가 됐다. 법은 조치 의무를 정할 뿐 결과를 보장하지 않으며, 근거 11은 괴롭힘이 여전히 정신장애 산재 원인 1위임을 보여 준다.",
 "Japan made power-harassment prevention measures an employer duty from June 2020 (April 2022 for SMEs), and from October 2026 measures against customer harassment became a duty for all employers. The law sets duties to act but does not guarantee outcomes; evidence 11 shows harassment remains the top cause of approved mental-disorder claims.",
 "Япония сделала меры против «пауэр-харассмента» обязанностью работодателя с июня 2020 г. (для МСП — с апреля 2022 г.), а с октября 2026 г. меры против притеснений со стороны клиентов стали обязательны для всех работодателей. Закон задаёт обязанность действовать, но не гарантирует результат; источник 11 показывает, что притеснения остаются главной причиной признанных случаев.",
 "日本自2020年6月起（中小企业自2022年4月起）将防止职权骚扰措施定为雇主义务，2026年10月起针对顾客骚扰的对策也成为所有雇主的义务。法律只规定措施义务而不保证结果；依据11显示骚扰仍是精神障碍工伤认定的首要原因。",
 "日本は2020年6月から（中小企業は2022年4月から）パワハラ防止措置を事業主の義務とし、2026年10月からカスタマーハラスメント対策もすべての事業主の義務となった。法は措置義務を定めるだけで結果を保証せず、根拠11はパワハラが依然として精神障害の労災の原因の1位であることを示す。"],
["비난이 괴롭힘으로 번지는 경로에 대한 일본의 제도적 대응으로 쓴다.","Used as Japan's institutional response to the path by which blame turns into harassment.","Используется как институциональный ответ Японии на путь, по которому обвинения перерастают в притеснения.","作为日本对“指责演变为骚扰”路径的制度回应。","非難がハラスメントへ広がる経路に対する日本の制度的対応として使う。"]);

E(15,"A","q1",2022,"Bent Flyvbjerg, Alexander Budzier, Jong Seok Lee, Mark Keil, Daniel Lunn & Dirk W. Bester, Journal of Management Information Systems 39(3) (2022)","The Empirical Reality of IT Project Cost Overruns: Discovering A Power-Law Distribution","https://arxiv.org/abs/2210.01573",
"IT project cost overruns follow a power-law distribution",
["IT 프로젝트 5,392개를 분석해 비용 초과가 정규분포가 아니라 극단값이 자주 나오는 멱법칙 분포를 따른다고 보고했다. 꼬리가 두꺼우면 '평균적 지연'을 기준으로 개인 성과를 판단하는 것이 통계적으로 맞지 않는다는 함의가 있다. 확인한 초록에는 초과 비율 수치가 없어 숫자는 쓰지 않는다.",
 "Analysing 5,392 IT projects, it reports that cost overruns follow a power-law distribution with frequent extremes rather than a normal one. With fat tails, judging individuals against an 'average delay' is statistically unsound. The verified abstract gives no overrun percentages, so none are used.",
 "Анализ 5 392 ИТ-проектов показывает, что перерасход бюджета следует степенному закону с частыми экстремумами, а не нормальному распределению. При «толстых хвостах» оценивать людей относительно «средней задержки» статистически неверно. В проверенной аннотации нет процентов перерасхода, поэтому цифры не используются.",
 "分析5,392个IT项目，报告成本超支遵循极端值频繁出现的幂律分布而非正态分布。尾部厚意味着以“平均延误”为标准评判个人在统计上不成立。核实的摘要中没有超支比例数字，故不使用数字。",
 "IT プロジェクト5,392件を分析し、コスト超過が正規分布ではなく極端値が頻繁に出るべき乗則に従うと報告した。裾が厚いなら「平均的な遅延」を基準に個人の成果を判断するのは統計的に正しくないという含意がある。確認した抄録に超過率の数値がないため数字は使わない。"],
["프로젝트 지연의 상당 부분이 개인 역량보다 분포 자체의 성질이라는 근거로 쓴다.","Used as evidence that much project delay reflects the nature of the distribution itself rather than individual competence.","Используется как довод, что значительная часть задержек отражает природу распределения, а не компетентность отдельных людей.","作为项目延误很大程度上源于分布本身性质而非个人能力的依据。","プロジェクトの遅延のかなりの部分が個人の能力より分布そのものの性質であるという根拠として使う。"]);

E(16,"C","press",2011,"Bent Flyvbjerg & Alexander Budzier, Harvard Business Review (Sep 2011)","Why Your IT Project May Be Riskier Than You Think","https://hbr.org/2011/09/why-your-it-project-may-be-riskier-than-you-think",
"the company took a $192.5 million charge against earnings",
["예산 500만 달러 미만으로 시작한 리바이스의 IT 프로젝트가 2008년 2분기 1억9,250만 달러의 손실 처리로 끝난 사례를 소개한다. 경영 잡지 기사이고, 확인 가능한 본문은 도입부뿐이라 널리 인용되는 다른 통계는 쓰지 않는다.",
 "Recounts how a Levi Strauss IT project that began with a budget under $5 million ended with a $192.5 million charge in the second quarter of 2008. It is a management-magazine article, and only the opening was verifiable, so other widely quoted statistics from it are not used.",
 "Описывает, как ИТ-проект Levi Strauss с бюджетом менее 5 млн долл. закончился списанием 192,5 млн долл. во втором квартале 2008 г. Это статья делового журнала; проверить удалось лишь начало, поэтому другие часто цитируемые цифры не используются.",
 "介绍李维斯一个预算不足500万美元的IT项目最终在2008年第二季度计提1.925亿美元损失的案例。属商业杂志文章，可核实的正文仅为开头，因此不使用其中被广泛引用的其他统计。",
 "予算500万ドル未満で始まったリーバイスのITプロジェクトが2008年第2四半期に1億9,250万ドルの損失計上で終わった事例を紹介する。経営誌の記事で、確認できた本文は導入部だけなので、広く引用される他の統計は使わない。"],
["두꺼운 꼬리가 실제 기업에서 어떤 모습인지 보여 주는 예시로만 쓴다.","Used only as an illustration of what a fat tail looks like in a real company.","Используется лишь как иллюстрация того, как «толстый хвост» выглядит в реальной компании.","仅作为厚尾在真实企业中表现的例子。","厚い裾が実際の企業でどう現れるかを示す例としてだけ使う。"]);

E(17,"A","q1",2007,"Piers Steel, Psychological Bulletin 133(1) (2007)","The nature of procrastination: a meta-analytic and theoretical review of quintessential self-regulatory failure","https://pubmed.ncbi.nlm.nih.gov/17201571/",
"Strong and consistent predictors of procrastination were task aversiveness, task delay",
["상관계수 691개를 메타분석해 과업의 혐오성, 보상까지의 지연, 자기효능감, 충동성이 미루기의 강하고 일관된 예측 요인임을 보였다. 성격 요인이 크지만, 과업 자체의 성질(혐오성·지연)도 핵심 요인이라는 점에서 '개인 결함만은 아니다'라는 해석을 받친다.",
 "A meta-analysis of 691 correlations shows task aversiveness, delay to reward, self-efficacy and impulsiveness are strong and consistent predictors of procrastination. Personality matters, but the properties of the task itself (aversiveness, delay) are also core factors, supporting the reading that it is 'not only a personal defect'.",
 "Метаанализ 691 корреляции показывает, что неприятность задачи, отсрочка вознаграждения, самоэффективность и импульсивность — сильные и устойчивые предикторы прокрастинации. Личность важна, но свойства самой задачи (неприятность, отсрочка) тоже ключевые, что поддерживает вывод «это не только личный изъян».",
 "对691个相关系数的元分析显示，任务厌恶性、回报延迟、自我效能与冲动性是拖延强而一致的预测因素。人格因素重要，但任务本身的性质（厌恶性、延迟）也是核心因素，支持“不只是个人缺陷”的解读。",
 "691の相関係数のメタ分析で、課題の嫌悪性、報酬までの遅延、自己効力感、衝動性が先延ばしの強く一貫した予測要因であることを示した。性格要因も大きいが、課題そのものの性質（嫌悪性・遅延）も核心的要因である点で「個人の欠陥だけではない」という解釈を支える。"],
["무겁고 모호한 일일수록 회피가 커진다는 주장의 메타분석 근거로 쓴다.","Used as meta-analytic support for the claim that heavier, vaguer work breeds more avoidance.","Используется как метааналитическая опора тезиса, что чем тяжелее и неопределённее работа, тем сильнее избегание.","作为“工作越沉重越模糊，回避越大”主张的元分析依据。","重く曖昧な仕事ほど回避が大きくなるという主張のメタ分析の根拠として使う。"]);

E(18,"A","q1",2026,"Z. Chen et al., eLife (2026)","Modulating task-outcome value to mitigate real-world procrastination via noninvasive brain stimulation","https://europepmc.org/article/MED/42747014",
"an imbalance between task aversiveness and the pursuit of positive task outcomes",
["만성적으로 미루는 성인을 대상으로 한 이중맹검 무작위 대조 시험에서, 뇌 자극이 6개월 뒤까지 실제 미루기를 줄였고 그 효과는 과업 혐오의 감소가 아니라 '결과 가치'의 증가로 매개됐다. 뇌 자극 자체는 조직이 쓸 방법이 아니며, 이 보고서는 '결과의 의미를 또렷하게 하면 미루기가 준다'는 기제만 참고한다.",
 "In a double-blind randomised sham-controlled trial with chronic procrastinators, brain stimulation reduced real-world procrastination up to six months later, mediated by increased outcome value rather than reduced task aversiveness. Brain stimulation is not a workplace tool; this report draws only on the mechanism that making outcomes meaningful reduces procrastination.",
 "В двойном слепом рандомизированном исследовании с хроническими прокрастинаторами стимуляция мозга снизила реальную прокрастинацию до шести месяцев, и эффект опосредовался ростом ценности результата, а не снижением неприятности задачи. Стимуляция — не инструмент для работы; доклад берёт лишь механизм: осмысленный результат уменьшает прокрастинацию.",
 "在针对慢性拖延成人的双盲随机假刺激对照试验中，脑刺激使现实中的拖延减少并持续到6个月后，其效果由“结果价值”提升而非任务厌恶下降所中介。脑刺激本身并非职场手段，本报告只借鉴“让结果意义清晰可减少拖延”的机制。",
 "慢性的に先延ばしをする成人を対象とした二重盲検無作為化比較試験で、脳刺激が6か月後まで実際の先延ばしを減らし、その効果は課題の嫌悪の減少ではなく「結果の価値」の増加で媒介された。脳刺激自体は組織が使う方法ではなく、本報告は「結果の意味をはっきりさせると先延ばしが減る」という機序だけを参考にする。"],
["모호한 과업의 목적을 분명히 하는 관리가 회피를 줄일 수 있다는 기제 근거로 쓴다.","Used as mechanistic evidence that management which clarifies the purpose of vague tasks can reduce avoidance.","Используется как механистическое свидетельство, что прояснение цели размытых задач может снижать избегание.","作为“明确模糊任务目的的管理可减少回避”的机制依据。","曖昧な課題の目的を明確にする管理が回避を減らしうるという機序の根拠として使う。"]);

E(19,"B","q1",2026,"A. Garg & J. W. Schooler, Behavioral Sciences (2026)","Breaking Procrastination Down: Differential Effects of Subtasking and Reinforcement on Engagement and Persistence","https://europepmc.org/article/MED/42938550",
"breaking a task into subtasks increased immediate engagement relative to control",
["참가자 238명이 실제로 미루던 일을 골라 15분간 작업한 실험에서, 일을 하위 과업으로 쪼개면 즉시 몰입이 늘었고 보상은 지속 의지를 높였다. 짧은 실험이고 학술지 등급이 최상위가 아니어서 B로 둔다.",
 "In an experiment where 238 participants picked a task they had been delaying and worked for 15 minutes, splitting it into subtasks raised immediate engagement, while reinforcement raised willingness to persist. It is a short experiment in a journal below the top tier, so it is graded B.",
 "В эксперименте 238 участников выбрали откладываемую задачу и работали 15 минут: разбиение на подзадачи повысило немедленную вовлечённость, а подкрепление — готовность продолжать. Эксперимент короткий, журнал не верхнего уровня — класс B.",
 "在238名参与者选择自己一直拖延的事并工作15分钟的实验中，把任务拆成子任务即时提高了投入，奖励则提高了坚持意愿。实验时间短、期刊非顶级，故定为B。",
 "参加者238人が実際に先延ばししていた仕事を選んで15分作業した実験で、仕事を下位課題に分けると即時の没入が増え、報酬は継続の意志を高めた。短い実験で学術誌も最上位ではないためBとする。"],
["실무자가 스스로 쓸 수 있는 '일 쪼개기' 처방의 실험 근거로 쓴다.","Used as experimental support for the 'break it down' practice that workers can use themselves.","Используется как экспериментальная опора приёма «разбить задачу», доступного самим работникам.","作为实务者可自行使用的“拆分任务”做法的实验依据。","実務者が自分で使える「仕事を分ける」処方の実験的根拠として使う。"]);

E(20,"A","q1",2004,"R. Westrum, Quality & Safety in Health Care 13 (Suppl 2) (2004)","A typology of organisational cultures","https://europepmc.org/article/MED/15576687",
"information culture is indeed associated with error reporting and with performance",
["조직 문화를 정보 흐름 방식에 따라 병리형·관료형·생성형으로 나누고, 정보 문화가 오류 보고·성과·안전과 연관된다고 주장했다. 저자 스스로 '확정하려면 더 탐구가 필요하다'고 밝힌 사례 중심 논문이며, 이후 소프트웨어 업계 조사(근거 27·28)가 이 유형론을 차용했다.",
 "Classifies organisational cultures by how information flows — pathological, bureaucratic and generative — and argues that information culture is associated with error reporting, performance and safety. It is case-based, and the author says the link needs more exploration; software-industry surveys (evidence 27, 28) later borrowed the typology.",
 "Классифицирует культуры организаций по движению информации — патологическая, бюрократическая, генеративная — и утверждает связь информационной культуры с сообщениями об ошибках, результатами и безопасностью. Работа опирается на кейсы, и автор признаёт нужду в проверке; отраслевые опросы ПО (источники 27, 28) позже заимствовали типологию.",
 "按信息流动方式将组织文化分为病理型、官僚型与生成型，主张信息文化与错误报告、绩效与安全相关。这是以案例为主的论文，作者自称需更多探索才能确定；软件业调查（依据27、28）后来沿用了此类型论。",
 "組織文化を情報の流れ方で病理型・官僚型・生成型に分け、情報文化がエラー報告・成果・安全と関連すると主張した。著者自身が「確定するにはさらに探究が必要」と述べる事例中心の論文で、後にソフトウェア業界の調査（根拠27・28）がこの類型論を借用した。"],
["나쁜 소식을 전하는 사람이 처벌받는가가 조직 문화의 핵심 지표라는 근거로 쓴다.","Used as support for the idea that whether bearers of bad news are punished is a core indicator of organisational culture.","Используется как довод, что наказывают ли гонцов с плохими вестями — ключевой показатель культуры организации.","作为“带来坏消息的人是否受罚是组织文化核心指标”的依据。","悪い知らせを伝える人が罰せられるかが組織文化の核心的指標だという根拠として使う。"]);

// ===== Evidence 21–40: blameless review, change-order law, AI productivity, automation bias, blame attribution, accident inquiries =====
E(21,"C","ind",2017,"Google SRE book, ch. 15 'Postmortem Culture: Learning from Failure' (John Lunney & Sue Lueder; O'Reilly, 2017)","Postmortem Culture: Learning from Failure","https://sre.google/sre-book/postmortem-culture/",
"Writing a postmortem is not punishment",
["장애 뒤 사후 검토를 '처벌이 아닌 학습'으로 쓰고, 관련자 모두가 가진 정보로 선의에 따라 행동했다고 가정하는 '비난 없는' 원칙을 제시한다. 한 기업의 실무 지침이라 효과의 정량 근거는 없으며, 비난 없음이 '책임 없음'을 뜻하지 않는다는 점이 함께 강조된다.",
 "Presents the 'blameless' principle that a post-incident review is learning, not punishment, and assumes everyone acted in good faith with the information they had. It is one company's practice guide without quantitative evidence of effect, and it stresses that blameless does not mean unaccountable.",
 "Излагает «безобвинительный» принцип: разбор инцидента — обучение, а не наказание, и все действовали добросовестно с той информацией, что имели. Это практическое руководство одной компании без количественных данных об эффекте; подчёркивается, что «без обвинений» не значит «без ответственности».",
 "提出“无责”原则：事故后的复盘是学习而非惩罚，并假设所有相关人员都依其所掌握的信息出于善意行事。这是一家企业的实务指南，没有效果的定量依据，并强调无责不等于不负责任。",
 "障害後の事後検証を「処罰ではなく学習」とし、関係者全員が持っていた情報で善意に基づき行動したと仮定する「非難なし」の原則を示す。一企業の実務指針で効果の定量的根拠はなく、非難しないことが「責任がない」ことを意味しない点も強調される。"],
["실무 수준에서 '사람 대신 과정을 묻는' 사후 검토 방법의 예시로 쓴다.","Used as a practice-level example of post-incident review that questions the process rather than the person.","Используется как практический пример разбора, где спрашивают о процессе, а не о человеке.","作为在实务层面“追问过程而非个人”的复盘方法示例。","実務レベルで「人ではなく過程を問う」事後検証の方法の例として使う。"]);

E(22,"B","io",2026,"대한민국 국가법령정보센터, 「소프트웨어 진흥법」 제50조 (2026. 8. 11. 개정, 2027. 2. 12. 시행분 포함)","소프트웨어 진흥법 제50조(소프트웨어사업 과업심의위원회)","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%86%8C%ED%94%84%ED%8A%B8%EC%9B%A8%EC%96%B4%EC%A7%84%ED%9D%A5%EB%B2%95/%EC%A0%9C50%EC%A1%B0",
"과업내용 변경의 확정 및 이에 따른 계약금액ㆍ계약기간 조정",
["공공 소프트웨어 사업에서 발주기관이 과업심의위원회를 두고 과업 변경과 그에 따른 금액·기간 조정을 심의하며, 사업자도 개최를 요청할 수 있게 한 조항이다. 2026년 8월 개정으로 설계 완료 등 일정 공정에서 위원회 개최를 의무화하고 재원 확보 의무를 더했으며 2027년 2월 12일 시행된다. 법이 있어도 실제 운영과 비용 반영이 어떻게 되는지는 별도 통계로 확인하지 못했다.",
 "This article requires public bodies running public software projects to set up a task deliberation committee that decides scope changes and the resulting adjustments to price and schedule, and lets the contractor request a meeting. An August 2026 amendment makes meetings mandatory at set milestones such as design completion and adds a duty to secure funds, effective 12 February 2027. How it works in practice could not be confirmed with separate statistics.",
 "Статья обязывает заказчиков государственных проектов ПО создавать комиссию по рассмотрению задания, которая утверждает изменения объёма работ и связанные корректировки цены и сроков; подрядчик может требовать её созыва. Поправка августа 2026 г. делает созыв обязательным на этапах вроде завершения проектирования и добавляет обязанность обеспечить финансирование; вступает в силу 12 февраля 2027 г. Практику подтвердить статистикой не удалось.",
 "该条规定公共软件项目的发包机关须设立任务审议委员会，审议任务变更及相应的金额与工期调整，承包方也可请求召开。2026年8月修订规定在设计完成等特定进度时必须召开委员会并增加确保资金的义务，于2027年2月12日施行。实际运作与费用落实情况未能以单独统计核实。",
 "公共ソフトウェア事業で発注機関が課業審議委員会を置いて課業の変更とそれに伴う金額・期間の調整を審議し、事業者も開催を要請できるようにした条文である。2026年8月の改正で設計完了など一定の工程で委員会の開催を義務化し財源確保の義務を加え、2027年2月12日に施行される。実際の運用と費用反映がどうなっているかは別の統計で確認できなかった。"],
["사양 변경의 책임과 비용을 개인이 아니라 계약 절차로 분리하려는 한국의 제도 사례로 쓴다.","Used as Korea's institutional example of separating responsibility and cost for specification changes from individuals and placing them in contract procedure.","Используется как корейский институциональный пример отделения ответственности и затрат за изменения требований от людей и переноса их в договорную процедуру.","作为韩国将规格变更的责任与费用从个人分离、交由合同程序处理的制度案例。","仕様変更の責任と費用を個人ではなく契約手続きに切り分けようとする韓国の制度例として使う。"]);

E(23,"A","q1",2025,"Erik Brynjolfsson, Danielle Li & Lindsey Raymond, Quarterly Journal of Economics 140(2) (2025); NBER WP 31161","Generative AI at Work","https://www.nber.org/papers/w31161",
"by 14% on average, including a 34% improvement for novice and low-skilled workers",
["고객지원 상담원 5,179명(학술지판 5,172명)의 실제 업무 자료에서 AI 도우미 도입 뒤 시간당 해결 건수가 평균 14%, 초보·저숙련자는 34% 늘었고 숙련자에게는 효과가 미미했다. 학술지판은 15%·30%로 보고해 판본 간 수치가 다르므로, 이 보고서는 확인한 워킹페이퍼 초록의 수치를 쓴다.",
 "In field data on 5,179 customer-support agents (5,172 in the journal version), issues resolved per hour rose 14% on average after an AI assistant was introduced, 34% for novice and low-skilled workers, with minimal effect on the most skilled. The journal version reports 15% and 30%, so figures differ by version; this report uses the verified working-paper abstract.",
 "В полевых данных о 5 179 операторах поддержки (5 172 в журнальной версии) после внедрения ИИ-помощника число решённых обращений в час выросло в среднем на 14%, у новичков и низкоквалифицированных — на 34%, у самых опытных эффект минимален. Журнальная версия даёт 15% и 30%; доклад использует проверенную аннотацию рабочей версии.",
 "在5,179名客服人员（期刊版为5,172名）的实际工作数据中，引入AI助手后每小时解决的问题平均增加14%，新手与低技能者增加34%，对最熟练者效果甚微。期刊版报告为15%与30%，版本间数字不同，本报告采用已核实的工作论文摘要数字。",
 "カスタマーサポート担当者5,179人（学術誌版は5,172人）の実際の業務データで、AIアシスタント導入後に1時間あたり解決件数が平均14%、初心者・低熟練者は34%増え、熟練者には効果がわずかだった。学術誌版は15%・30%と報告し版で数値が異なるため、本報告は確認したワーキングペーパーの抄録の数値を使う。"],
["AI가 정형화된 일에서는 실제로 부담을 덜어 준다는 가장 강한 현장 근거로 쓴다.","Used as the strongest field evidence that AI genuinely lightens routine work.","Используется как самое сильное полевое свидетельство, что ИИ действительно облегчает рутинную работу.","作为AI在常规工作中确实减轻负担的最有力现场依据。","AIが定型的な仕事では実際に負担を軽くするという最も強い現場の根拠として使う。"]);

E(24,"A","q1",2023,"Shakked Noy & Whitney Zhang, Science 381(6654) (2023)","Experimental evidence on the productivity effects of generative artificial intelligence","https://pubmed.ncbi.nlm.nih.gov/37440646/",
"The average time taken decreased by 40% and output quality rose by 18%",
["대졸 전문직 453명에게 직무별 글쓰기 과제를 주고 절반에게 ChatGPT를 쓰게 한 사전등록 실험에서 소요 시간이 40% 줄고 품질이 18% 올랐으며 노동자 간 격차도 줄었다. 짧고 잘 정의된 과제라는 점에서, 모호하고 긴 프로젝트에 그대로 적용하기는 어렵다.",
 "In a preregistered experiment giving 453 college-educated professionals occupation-specific writing tasks and ChatGPT to half, time taken fell 40%, quality rose 18% and inequality between workers shrank. Because the tasks were short and well-defined, the result does not transfer directly to long, ambiguous projects.",
 "В предрегистрированном эксперименте 453 специалиста с высшим образованием получили профессиональные письменные задания, половина — с ChatGPT: время сократилось на 40%, качество выросло на 18%, неравенство уменьшилось. Задания короткие и чёткие, поэтому перенос на длинные неопределённые проекты затруднён.",
 "在一项预先注册的实验中，453名受过大学教育的专业人员完成与职业相关的写作任务，其中一半使用ChatGPT：耗时减少40%，质量提高18%，劳动者间差距缩小。由于任务短且界定清晰，难以直接套用于冗长模糊的项目。",
 "大卒専門職453人に職種別の文章課題を与え、半数にChatGPTを使わせた事前登録実験で、所要時間が40%減り品質が18%上がり、労働者間の格差も縮んだ。短く明確に定義された課題なので、曖昧で長いプロジェクトにそのまま当てはめるのは難しい。"],
["AI 효과가 '잘 정의된 과업'에서 가장 크다는 점을 보여 주는 실험 근거로 쓴다.","Used as experimental evidence that AI's effect is largest on well-defined tasks.","Используется как экспериментальное свидетельство, что эффект ИИ наибольший на чётко определённых задачах.","作为AI效果在“界定清晰的任务”上最大的实验依据。","AIの効果が「よく定義された課題」で最も大きいことを示す実験的根拠として使う。"]);

E(25,"B","io",2025,"METR (Joel Becker, Nate Rush, Beth Barnes & David Rein), 10 Jul 2025; arXiv 2507.09089","Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity","https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/",
"they take 19% longer to complete issues",
["숙련 오픈소스 개발자 16명이 실제 과제 246개를 무작위로 AI 허용·불허 조건에서 처리한 결과, AI를 쓸 때 19% 더 오래 걸렸다. 개발자들은 사전에 24% 빨라질 것으로 예상했고, 끝난 뒤에도 20% 빨라졌다고 믿었다. 표본이 작고 2025년 초 도구 기준이며, 연구기관도 결과가 낡았다고 표시하고 2026년 후속 결과를 따로 냈다.",
 "When 16 experienced open-source developers worked 246 real issues randomly assigned to AI-allowed or AI-disallowed conditions, they took 19% longer with AI. They had expected a 24% speed-up and afterwards still believed AI had sped them up by 20%. The sample is small and reflects early-2025 tools; the organisation now marks the results as out of date and published a 2026 update separately.",
 "16 опытных разработчиков открытого ПО выполнили 246 реальных задач, случайно распределённых по условиям с ИИ и без: с ИИ работа заняла на 19% дольше. Они ожидали ускорения на 24% и после всё ещё считали, что ИИ ускорил их на 20%. Выборка мала, инструменты начала 2025 г.; организация пометила результаты как устаревшие и выпустила обновление 2026 г.",
 "16名资深开源开发者把246个真实任务随机分配到允许或禁止AI的条件下处理，使用AI时耗时多19%。他们事先预期会快24%，结束后仍相信AI让自己快了20%。样本小、基于2025年初的工具，该机构已标注结果过时并另行发布2026年更新。",
 "熟練したオープンソース開発者16人が実際の課題246件をAI許可・不許可の条件に無作為に割り当てて処理した結果、AIを使うと19%長くかかった。開発者は事前に24%速くなると予想し、終了後も20%速くなったと信じていた。標本が小さく2025年初めの道具に基づき、研究機関も結果が古いと表示し2026年の続報を別に出した。"],
["체감 생산성과 실측 생산성이 엇갈릴 수 있으며, 그 간극이 기대치와 평가를 왜곡할 수 있다는 근거로 쓴다.","Used as evidence that perceived and measured productivity can diverge, and that the gap can distort expectations and evaluations.","Используется как довод, что ощущаемая и измеренная производительность могут расходиться, искажая ожидания и оценки.","作为体感与实测生产率可能背离、且这一差距会扭曲预期与评价的依据。","体感の生産性と実測の生産性が食い違いうること、その差が期待と評価を歪めうることの根拠として使う。"]);

E(26,"B","io",2026,"Anders Humlum & Emilie Vestergaard, NBER Working Paper 33777 (May 2025; rev. Mar 2026)","Still Waters, Rapid Currents: Early Labor Market Transformation under Generative AI (previously 'Large Language Models, Small Labor Market Effects')","https://www.nber.org/papers/w33777",
"we estimate precise null effects on earnings and recorded hours",
["덴마크의 설문과 행정 자료를 연결해 생성형 AI 노출 직종에서 ChatGPT 출시 2년 뒤까지 임금과 기록된 근로시간에 2%를 넘는 효과가 없다는 정밀한 영(0) 효과를 추정했다. 동료심사 전 워킹페이퍼이고 덴마크 노동시장 특성이 반영됐다.",
 "Linking Danish surveys to administrative records, it estimates precise null effects on earnings and recorded hours in AI-exposed occupations up to two years after ChatGPT's launch, ruling out effects above 2%. It is a working paper before peer review and reflects Denmark's labour market.",
 "Связав датские опросы с административными данными, оценивает точные нулевые эффекты на заработки и учтённые часы в профессиях, подверженных ИИ, в течение двух лет после выхода ChatGPT, исключая эффекты выше 2%. Это рабочий документ до рецензирования, отражающий датский рынок труда.",
 "将丹麦调查与行政数据相连，估计在ChatGPT推出两年内，受AI影响职业的工资与记录工时的效应为精确的零，排除了超过2%的效应。属同行评审前的工作论文，反映丹麦劳动市场特征。",
 "デンマークの調査と行政データを結び、生成AIにさらされる職種でChatGPT公開から2年後まで賃金と記録された労働時間に2%を超える効果がないという精密なゼロ効果を推定した。査読前のワーキングペーパーで、デンマークの労働市場の特徴が反映されている。"],
["개인이 아낀 시간이 임금·근로시간 같은 노동시장 결과로 아직 옮겨 가지 않았다는 근거로 쓴다.","Used as evidence that individual time savings have not yet carried over into labour-market outcomes such as pay and hours.","Используется как довод, что сэкономленное время пока не перешло в рыночные результаты — оплату и часы.","作为个人节省的时间尚未转化为工资、工时等劳动市场结果的依据。","個人が節約した時間がまだ賃金・労働時間のような労働市場の結果に移っていないという根拠として使う。"]);

E(27,"B","survey",2024,"DORA (Google Cloud), Accelerate State of DevOps Report 2024","DORA Research: 2024","https://dora.dev/research/2024/dora-report/",
"negatively impacts software delivery stability and throughput",
["소프트웨어 조직 대규모 설문에서 AI 도입이 개인 생산성 체감에는 도움이 되지만 소프트웨어 배포의 안정성과 처리량에는 부정적 영향을 준다고 보고했다. 설문 기반 상관 분석이며 확인한 것은 요약 페이지뿐이라, 보고서 본문의 세부 퍼센트 수치는 쓰지 않는다.",
 "A large survey of software organisations reports that AI adoption helps perceived individual productivity but negatively affects software delivery stability and throughput. It is survey-based correlational analysis, and only the summary page was verified, so detailed percentages from the full report are not used.",
 "Крупный опрос софтверных организаций сообщает, что внедрение ИИ улучшает ощущаемую личную продуктивность, но ухудшает стабильность и пропускную способность поставки ПО. Это корреляционный анализ опроса; проверена лишь страница-резюме, поэтому детальные проценты отчёта не используются.",
 "对软件组织的大规模调查报告称，AI引入有助于体感的个人生产率，但对软件交付的稳定性与吞吐量有负面影响。属基于调查的相关分析，仅核实了摘要页，因此不使用报告正文的详细百分比。",
 "ソフトウェア組織の大規模調査で、AIの導入は個人の生産性の体感には役立つが、ソフトウェアのデリバリーの安定性と処理量には負の影響を与えると報告した。調査に基づく相関分析で、確認したのは要約ページだけなので本文の詳細な百分率は使わない。"],
["개인의 속도 향상이 팀·시스템 차원의 불안정으로 바뀔 수 있다는 근거로 쓴다.","Used as evidence that individual speed-ups can turn into instability at team and system level.","Используется как довод, что ускорение отдельных людей может обернуться нестабильностью на уровне команды и системы.","作为个人提速可能转化为团队与系统层面不稳定的依据。","個人の速度向上がチーム・システムの次元の不安定さに変わりうるという根拠として使う。"]);

E(28,"B","survey",2025,"DORA (Google Cloud with IT Revolution and research partners), State of AI-assisted Software Development 2025","State of AI-assisted Software Development 2025","https://dora.dev/research/2025/dora-report/",
"magnifying an organization’s existing strengths and weaknesses",
["AI는 조직이 원래 가진 강점과 약점을 증폭하며, 투자 효과는 도구 자체보다 조직 체계에서 나온다고 요약했다. 업계 협력 설문이고 확인한 것은 요약 페이지뿐이다.",
 "Summarises that AI magnifies an organisation's existing strengths and weaknesses, and that returns come less from the tools than from the organisational system. It is an industry-partnered survey and only the summary page was verified.",
 "Резюмирует, что ИИ усиливает уже существующие сильные и слабые стороны организации, а отдача зависит больше от организационной системы, чем от инструментов. Опрос с отраслевыми партнёрами; проверена лишь страница-резюме.",
 "总结称AI会放大组织原有的优势与弱点，投资回报更多来自组织体系而非工具本身。属业界合作调查，仅核实了摘要页。",
 "AIは組織がもともと持つ強みと弱みを増幅し、投資効果は道具そのものより組織の仕組みから生まれると要約した。業界協力の調査で、確認したのは要約ページだけである。"],
["비난 문화가 강한 조직에서는 AI가 비난을 키울 수 있다는 추론(D)의 근거로 쓴다.","Used to support the inference (D) that in blame-heavy organisations AI may amplify blame.","Используется для вывода (D), что в организациях с культурой обвинения ИИ может усиливать обвинения.","用作“在指责文化强的组织中AI可能放大指责”这一推论（D）的依据。","非難の文化が強い組織ではAIが非難を大きくしうるという推論（D）の根拠として使う。"]);

E(29,"B","survey",2025,"한국은행 (Bank of Korea), BOK 이슈노트 제2025-22호 (18 Aug 2025)","AI의 빠른 확산과 생산성 효과: 가계조사를 바탕으로","https://www.bok.or.kr/portal/bbs/P0002353/view.do?nttId=10093071&searchCnd=1&searchKwd=&depth=201150&pageUnit=10&pageIndex=1&programType=newsData&menuNo=200433&oldMenuNo=201150",
"생성형 AI 활용으로 업무시간이 평균 3.8% 단축",
["직업 분포를 반영한 대표 표본 가계조사로 근로자의 63.5%가 생성형 AI를 쓰고 업무용은 51.8%이며, 업무시간이 평균 3.8%(주 40시간 기준 1.5시간) 줄어 잠재 생산성 향상을 1.0%로 추정했다. 시간 단축은 자기 보고이고, 경력이 짧은 근로자에게 효과가 더 컸다.",
 "A representative household survey reflecting the occupational distribution found 63.5% of workers use generative AI, 51.8% for work, and that working time fell 3.8% on average (1.5 hours of a 40-hour week), implying a potential productivity gain of 1.0%. Time savings are self-reported, and effects were larger for less experienced workers.",
 "Репрезентативный опрос домохозяйств с учётом структуры профессий показал: 63,5% работников используют генеративный ИИ, 51,8% — для работы; рабочее время сократилось в среднем на 3,8% (1,5 часа при 40-часовой неделе), потенциальный рост производительности — 1,0%. Экономия времени — самооценка; эффект сильнее у менее опытных.",
 "以反映职业分布的代表性家庭调查发现，63.5%的劳动者使用生成式AI，工作用途为51.8%，工作时间平均缩短3.8%（以每周40小时计为1.5小时），潜在生产率提升估计为1.0%。时间缩短为自我报告，资历短者效果更大。",
 "職業分布を反映した代表標本の家計調査で、労働者の63.5%が生成AIを使い業務用は51.8%で、業務時間が平均3.8%（週40時間で1.5時間）減り、潜在的な生産性向上を1.0%と推定した。時間短縮は自己申告で、経歴の短い労働者ほど効果が大きかった。"],
["한국에서 AI가 업무 부담을 덜어 준 규모의 공식 기준선으로 쓴다.","Used as the official Korean baseline for how much AI has lightened workloads.","Используется как официальная корейская точка отсчёта облегчения нагрузки благодаря ИИ.","作为韩国AI减轻工作负担规模的官方基线。","韓国でAIが業務負担を軽くした規模の公式な基準線として使う。"]);

E(30,"B","io",2026,"한국은행 조사국 고용연구팀 (서동현·오삼일·윤종원), BOK 블로그 (18 Jun 2026)","AI 도입은 생산성을 높이는가?","https://www.bok.or.kr/portal/bbs/B0000347/view.do?menuNo=201106&nttId=10098529",
"업무시간 절감과 업무처리량 증가 사이의 상관계수는 0에 불과했습니다",
["2025년 조사를 다시 분석해 AI로 아낀 시간과 업무처리량 증가 사이의 상관이 0이었다며 이를 'AI 생산성 단절'이라 불렀다. 원인으로 작업 단위에 머문 활용(20% 이상 단축된 작업은 4.4%), 업무 흐름의 경직성, 결재 같은 병목, 보상 구조의 불일치를 들었다. 공식 연구 보고서가 아닌 해설 블로그라 B로 둔다.",
 "Reanalysing the 2025 survey, it finds zero correlation between time saved with AI and increased throughput, calling it an 'AI productivity disconnect'. It cites use confined to tasks (only 4.4% of tasks cut by 20% or more), rigid workflows, bottlenecks such as approval chains, and misaligned rewards. As an explanatory blog rather than a formal report it is graded B.",
 "Повторный анализ опроса 2025 г.: корреляция между сэкономленным с ИИ временем и ростом объёма работы равна нулю — «разрыв производительности ИИ». Причины: применение на уровне отдельных операций (лишь 4,4% задач сократились на 20% и более), жёсткость процессов, узкие места вроде согласований, несогласованность вознаграждения. Это пояснительный блог, а не доклад, — класс B.",
 "重新分析2025年调查，发现用AI节省的时间与业务处理量增长的相关系数为0，称之为“AI生产率脱节”。原因包括停留在单项作业层面的应用（缩短20%以上的作业仅占4.4%）、业务流程僵化、审批等瓶颈以及激励结构不一致。属解读性博客而非正式报告，故定为B。",
 "2025年の調査を再分析し、AIで節約した時間と業務処理量の増加の相関が0だったとして、これを「AI生産性の断絶」と呼んだ。原因として作業単位にとどまる活用（20%以上短縮した作業は4.4%）、業務の流れの硬直性、決裁のようなボトルネック、報酬構造の不一致を挙げた。正式な報告書ではなく解説ブログなのでBとする。"],
["아낀 시간이 성과로 이어지지 않는 이유가 개인이 아니라 조직 흐름에 있다는 근거로 쓴다.","Used as evidence that the reason saved time does not become output lies in organisational workflow, not individuals.","Используется как довод, что сэкономленное время не превращается в результат из-за организационных процессов, а не людей.","作为节省的时间未转化为成果的原因在于组织流程而非个人的依据。","節約した時間が成果につながらない理由が個人ではなく組織の流れにあるという根拠として使う。"]);

E(31,"B","io",2026,"KDI 경제교육·정보센터, summary of 한국은행 report (17 Nov 2026)","AI 확산과 생산성 효과: 더 널리, 더 효율적으로, 그러나 아직 얕게","https://eiec.kdi.re.kr/policy/domesticView.do?ac=0000208191",
"평균 업무 시간 절감률은 지난해 3.8%(주 40시간 기준 1.5시간)에서 올해 9.2%(3.7시간)로",
["2026년 11월 17일 한국은행 보고서 요약으로, 업무용 AI 활용률이 51.8%에서 66.5%로, 평균 시간 절감률이 3.8%에서 9.2%로 올랐지만 시간 절감과 처리량·품질 개선의 상관은 여전히 약하고 핵심 업무 활용은 낮다고 정리했다. 한국은행 원문 페이지는 직접 열지 못해 공공 연구기관의 요약을 인용하며, 언론이 보도한 상관계수 값은 이 요약에 없어 쓰지 않는다.",
 "A summary of the Bank of Korea report of 17 November 2026: work use of AI rose from 51.8% to 66.5% and average time saved from 3.8% to 9.2%, yet the correlation between time saved and throughput or quality gains remains weak and use in core tasks is low. The BOK original page could not be opened directly, so a public research institute's summary is cited; correlation values reported by the press are not in this summary and are not used.",
 "Резюме доклада Банка Кореи от 17 ноября 2026 г.: доля использования ИИ в работе выросла с 51,8% до 66,5%, средняя экономия времени — с 3,8% до 9,2%, но связь экономии времени с объёмом и качеством работы остаётся слабой, а применение в ключевых задачах — низким. Оригинал Банка открыть не удалось, поэтому цитируется резюме государственного исследовательского института; значения корреляции из СМИ в нём нет и не используются.",
 "这是韩国银行2026年11月17日报告的摘要：工作用AI使用率从51.8%升至66.5%，平均时间节省率从3.8%升至9.2%，但时间节省与处理量、质量改善的相关性仍弱，核心业务中的使用仍低。未能直接打开韩国银行原文页面，故引用公共研究机构的摘要；媒体报道的相关系数不在该摘要中，故不使用。",
 "2026年11月17日の韓国銀行報告書の要約で、業務用AIの活用率が51.8%から66.5%に、平均時間節約率が3.8%から9.2%に上がったが、時間節約と処理量・品質改善の相関は依然として弱く、中核業務での活用は低いとまとめた。韓国銀行の原文ページを直接開けなかったため公共研究機関の要約を引用し、報道された相関係数の値はこの要約にないので使わない。"],
["보고서 작성 시점 2주 안의 최신 근거(뉴스 걸이)로, 한국에서 '시간은 아끼는데 성과로는 아직'이라는 현실을 보여 준다.","Used as the most recent evidence within two weeks of writing (news hook), showing Korea's 'time saved, not yet output' reality.","Используется как свежайшее свидетельство (в пределах двух недель до написания), показывающее корейскую реальность «время сэкономлено, результата пока нет».","作为撰写前两周内的最新依据（新闻引子），显示韩国“省了时间、尚未变成成果”的现实。","執筆時点の2週間以内の最新の根拠（ニュースの導入）として、韓国の「時間は節約するが成果にはまだ」という現実を示す。"]);

E(32,"B","io",2026,"OECD, OECD Artificial Intelligence Papers (17 Nov 2026)","Artificial intelligence and work organisation","https://www.oecd.org/en/publications/artificial-intelligence-and-work-organisation_5a208f6b-en.html",
"occupations more exposed to AI have seen a smaller increase in monotonous tasks",
["성인역량조사(PIAAC)와 유럽근로조건조사(EWCS)로 2011~2024년 직업별 AI 노출과 업무 조직 변화를 분석해, 노출이 큰 직업에서 단조로운 과업 증가가 작고 일부 정보처리 과업은 더 빨리 늘었다고 보고했다. 교육 수준 상승의 영향이 더 컸다고 스스로 밝히며, 책임 배분을 직접 다루지는 않는다.",
 "Using PIAAC and the European Working Conditions Survey for roughly 2011–2024, it finds that occupations more exposed to AI saw a smaller rise in monotonous tasks and a faster rise in some information-processing tasks. It notes rising education played a larger role, and it does not directly address how responsibility is allocated.",
 "По данным PIAAC и Европейского обследования условий труда за ~2011–2024 гг. показывает, что в профессиях, сильнее подверженных ИИ, монотонных задач прибавилось меньше, а некоторых задач обработки информации — быстрее. Признаёт, что рост образования сыграл большую роль; распределение ответственности прямо не рассматривает.",
 "利用成人能力调查（PIAAC）与欧洲工作条件调查（EWCS）分析约2011–2024年间职业AI暴露与工作组织变化，发现暴露程度高的职业单调任务增幅较小，部分信息处理任务增长更快。报告自称教育水平提高的影响更大，且未直接讨论责任分配。",
 "成人技能調査（PIAAC）と欧州労働条件調査（EWCS）で2011〜2024年の職業別AI露出と仕事の組織の変化を分析し、露出の大きい職業で単調な課題の増加が小さく、一部の情報処理課題はより速く増えたと報告した。教育水準の上昇の影響の方が大きかったと自ら述べ、責任の配分は直接扱わない。"],
["보고서 작성 2주 전에 나온 국제기구 근거로, AI가 일의 '구성'을 바꾸고 있음을 보여 준다.","Used as international-organisation evidence published two weeks before writing, showing AI is changing how work is composed.","Используется как свидетельство международной организации, вышедшее за две недели до написания: ИИ меняет состав работы.","作为撰写前两周发布的国际组织依据，显示AI正在改变工作的“构成”。","執筆の2週間前に出た国際機関の根拠として、AIが仕事の「構成」を変えていることを示す。"]);

E(33,"A","stat",2026,"ИСИЭЗ НИУ ВШЭ (HSE ISSEK), «Искусственный интеллект» № 22/2026, on Rosstat survey of large and medium AI-using organisations (2025)","Искусственный интеллект: использование ИИ в организациях разной величины","https://issek.hse.ru/mirror/pubs/share/1139128903.pdf",
"Средняя доля организаций, использующих технологии ИИ, составляет 4.8%",
["로스스타트가 고등경제대 방법론으로 2025년 실시한 중대형 조직 조사에 따르면 AI를 쓰는 조직은 평균 4.8%이고, 500명 넘는 조직은 14.9%, 100명 이하는 4.1%였다. 조직 단위 통계라 개인 노동자의 AI 사용과는 다르며, 러시아의 직무 스트레스 공식 통계는 이번 조사에서 확인하지 못했다.",
 "According to Rosstat's 2025 survey of large and medium organisations using HSE methodology, 4.8% of organisations use AI on average — 14.9% of those with over 500 staff and 4.1% of those with 100 or fewer. These are organisation-level figures, not individual workers' use, and no official Russian statistics on job stress were found in this research.",
 "По обследованию Росстата 2025 г. крупных и средних организаций (методология ВШЭ), ИИ используют в среднем 4,8% организаций: 14,9% среди организаций свыше 500 человек и 4,1% — до 100 человек. Это данные по организациям, а не по работникам; официальной российской статистики стресса на работе в этом исследовании найти не удалось.",
 "据俄罗斯联邦统计局以高等经济大学方法于2025年开展的大中型组织调查，使用AI的组织平均占4.8%，500人以上组织为14.9%，100人以下为4.1%。属组织层面统计，不同于个人劳动者的AI使用；本次调查未能找到俄罗斯工作压力的官方统计。",
 "ロシア連邦統計局が高等経済学院の方法論で2025年に実施した中・大規模組織の調査によると、AIを使う組織は平均4.8%で、500人超の組織は14.9%、100人以下は4.1%だった。組織単位の統計で個々の労働者のAI使用とは異なり、ロシアの職務ストレスの公式統計は今回の調査で確認できなかった。"],
["러시아의 AI 업무 침투 수준을 보여 주는 공식 통계 기반 근거로 쓴다.","Used as official-statistics-based evidence of the level of AI penetration into work in Russia.","Используется как основанное на официальной статистике свидетельство уровня проникновения ИИ в работу в России.","作为显示俄罗斯AI进入工作程度的官方统计依据。","ロシアのAIの業務への浸透水準を示す公式統計に基づく根拠として使う。"]);

E(34,"A","q1",2010,"Raja Parasuraman & Dietrich H. Manzey, Human Factors 52(3) (2010)","Complacency and bias in human use of automation: an attentional integration","https://pubmed.ncbi.nlm.nih.gov/21077562/",
"cannot be prevented by training or instructions",
["자동화 안주(complacency)와 자동화 편향을 통합한 문헌 검토로, 편향은 초보·전문가 모두에게 나타나고 훈련이나 지시로 막을 수 없으며 개인과 팀의 결정 모두에 영향을 준다고 정리했다. 실험실 연구가 많아 현장 빈도는 따로 따져야 한다.",
 "An integrative review of automation complacency and automation bias concluding that the bias appears in novices and experts alike, cannot be prevented by training or instructions, and affects individual and team decisions. Much of the base is laboratory work, so field frequency needs separate assessment.",
 "Обзор, объединяющий самоуспокоенность и смещение в пользу автоматики: смещение проявляется у новичков и экспертов, не предотвращается обучением или инструкциями и влияет на решения людей и команд. Основа — во многом лабораторные исследования, частоту в реальной практике нужно оценивать отдельно.",
 "整合自动化自满与自动化偏差的文献综述，结论是偏差在新手与专家身上都会出现，无法靠培训或指示防止，并影响个人与团队决策。多为实验室研究，现场频率需另行评估。",
 "自動化への安住（コンプレイセンシー）と自動化バイアスを統合した文献レビューで、バイアスは初心者・専門家の双方に現れ、訓練や指示では防げず、個人とチームの決定の双方に影響すると整理した。実験室研究が多く、現場での頻度は別に検討する必要がある。"],
["'사람이 최종 확인하라'는 규칙만으로는 책임 있는 감독이 되지 않는다는 근거로 쓴다.","Used as evidence that a rule saying 'a human must check at the end' does not by itself make oversight responsible.","Используется как довод, что правило «человек проверяет в конце» само по себе не делает надзор ответственным.","作为“仅靠‘由人最终确认’的规则无法形成负责任监督”的依据。","「人が最終確認せよ」という規則だけでは責任ある監督にならないという根拠として使う。"]);

E(35,"A","q1",2014,"K. Goddard, A. Roudsari & J. C. Wyatt, International Journal of Medical Informatics (2014)","Automation bias: empirical results assessing influencing factors","https://europepmc.org/article/MED/24581700",
"Participants changed prescriptions in 22.5% of scenarios.",
["영국 일반의 26명이 처방 시나리오 20개에서 모의 의사결정 지원 조언을 받은 실험에서, 조언 뒤 처방을 바꾼 비율은 22.5%, 정답률은 50.38%에서 58.27%로 올랐지만 맞는 처방을 틀린 조언 때문에 바꾼 자동화 편향은 전체의 5.2%였다. 표본이 작고 가상 시나리오다.",
