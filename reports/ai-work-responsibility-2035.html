 s("D",[3,4,1],["이 관점에서 AI의 역할은 판단을 대신하는 것이 아니라, 누가 무엇을 언제 알았고 무엇을 통제할 수 있었는지를 기록해 책임의 해상도를 높이는 '증언자'가 되는 것이어야 한다—다만 그 기록을 누가 쓰느냐에 따라 증언은 고발장으로도 바뀔 수 있다.",

SEC("compare",["국가·지역 비교: 한국·일본·미국·유럽(EU·영국)·러시아","Country and Regional Comparison: Korea, Japan, US, Europe (EU, UK), Russia","Сравнение стран и регионов: Корея, Япония, США, Европа (ЕС, Великобритания), Россия","国家与地区比较：韩国、日本、美国、欧洲（欧盟、英国）、俄罗斯","国・地域比較：韓国・日本・米国・欧州（EU・英国）・ロシア"],
[P(

  "欧洲在为“人的监督”配上权限与保护方面走得最远：监督者能力与权限要求（AI法）、禁止对监督者不利对待（平台劳动指令）、“有意义的参与”标准（英国）都已入法。",

 s("D",[52,22,29,31],["한국은 AI 활용률이 가장 빠르게 오르는 나라 가운데 하나이며, 고영향 AI의 사람 감독 의무와 공공 소프트웨어의 과업 변경 심의라는 고유한 제도를 갖췄지만, 감독자의 권한·보호와 민간 프로젝트의 변경 책임 분리는 비어 있다.",

  "韩国是AI使用率上升最快的国家之一，拥有高影响AI人的监督义务与公共软件任务变更审议等独特制度，但监督者的权限与保护、民间项目中变更责任的分离仍是空白。",
  "韓国はAI活用率が最も速く上がる国の一つで、高影響AIの人の監督義務と公共ソフトウェアの課業変更審議という独自の制度を備えたが、監督者の権限・保護と民間プロジェクトの変更責任の切り分けは空白である。"]),
 s("D",[53,14,11],["일본은 AI 법제를 진흥 중심으로 두고, 책임 문제를 괴롭힘 방지와 산재 인정 같은 노동 안전 제도로 다룬다: 업무량 변화가 산재 원인으로 집계되는 점은 강점이지만, AI 감독자에 대한 규칙은 아직 없다.",
  "Japan keeps AI law promotion-oriented and handles responsibility through labour-safety systems such as harassment prevention and compensation recognition: counting workload change as a cause of injury is a strength, but there are no rules yet on AI overseers.",
  "Япония оставляет законодательство об ИИ ориентированным на продвижение и решает вопросы ответственности через системы охраны труда — профилактику притеснений и признание профзаболеваний: учёт изменения нагрузки как причины — сильная сторона, но правил о надзирающих за ИИ пока нет.",
  "日本把AI法制定位为促进型，以防止骚扰与工伤认定等劳动安全制度处理责任问题：把工作量变化计为工伤原因是优点，但尚无关于AI监督者的规则。",
  "日本はAI法制を推進中心に置き、責任の問題をハラスメント防止と労災認定のような労働安全の制度で扱う。業務量の変化が労災原因として集計される点は強みだが、AIの監督者に関する規則はまだない。"]),
 s("D",[49,50,51,25],["미국은 연방 차원의 구속력 있는 규칙 없이 주·도시 단위로 배치자 의무와 편향 감사를 쌓고 있으며, AI 생산성 연구가 가장 활발해 체감-실측 격차 같은 근거가 가장 먼저 나오는 곳이기도 하다.",
  "The US is building deployer duties and bias audits at state and city level without binding federal rules, and as the hub of AI-productivity research it is also where evidence such as the perception–measurement gap emerges first.",
  "США без обязательных федеральных правил наращивают обязанности эксплуатантов и аудиты предвзятости на уровне штатов и городов; как центр исследований производительности ИИ, именно там первыми появляются данные вроде разрыва ощущений и измерений.",
  "美国在缺乏联邦层面约束性规则的情况下，以州与城市为单位累积部署者义务与偏差审计；作为AI生产率研究最活跃之地，体感—实测差距等依据也最先在此出现。",
  "米国は連邦レベルの拘束力ある規則なしに州・都市単位で導入者の義務とバイアス監査を積み上げており、AI生産性の研究が最も盛んで、体感と実測の差のような根拠が最初に出る場所でもある。"]),
 s("D",[54,33],["러시아는 AI 피해 책임을 실험적 법제도 안의 의무보험으로 다루고 조직의 AI 사용은 아직 낮지만, 이번 조사에서는 직무 스트레스·번아웃의 공식 통계나 노동 현장의 AI 책임 규칙을 확인하지 못해 비교의 신뢰도가 가장 낮다.",

  "Россия решает ответственность за вред от ИИ через обязательное страхование в экспериментальных режимах, а использование ИИ организациями пока низкое; однако официальной статистики стресса и выгорания и правил ответственности за ИИ на рабочем месте найти не удалось, поэтому сравнение здесь наименее надёжно.",
  "俄罗斯以实验性法律制度内的强制保险处理AI损害责任，组织的AI使用仍低；但本次调查未能找到工作压力与倦怠的官方统计或劳动现场的AI责任规则，因此比较的可信度最低。",
  "ロシアはAIによる被害の責任を実験的法制度の中の義務保険で扱い、組織のAI使用はまだ低いが、今回の調査では職務ストレス・バーンアウトの公式統計や職場のAI責任規則を確認できず、比較の信頼度が最も低い。"]),
 s("B",[55],["국가 간 알고리즘 관리 실태를 같은 방식으로 잰 OECD 기업 조사는 프랑스·독일·이탈리아·일본·스페인·미국 6개국만 다뤄, 한국과 러시아는 같은 기준의 비교 자료가 없다.",

  "Опрос фирм ОЭСР, одинаково измеривший алгоритмическое управление в разных странах, охватил лишь Францию, Германию, Италию, Японию, Испанию и США, поэтому сопоставимых данных по Корее и России нет.",
  "以相同方式测量各国算法管理状况的经合组织企业调查只涵盖法、德、意、日、西、美6国，韩国与俄罗斯缺乏同一标准的比较资料。",
  "国ごとのアルゴリズム管理の実態を同じ方法で測ったOECDの企業調査はフランス・ドイツ・イタリア・日本・スペイン・米国の6か国だけを扱い、韓国とロシアには同じ基準の比較資料がない。"])

SEC("scen",["미래 전망: 2035년 4대 시나리오","Outlook: Four Scenarios for 2035","Прогноз: четыре сценария на 2035 год","未来展望：2035年四大情景","将来展望：2035年の4つのシナリオ"],
[P(
 s("D",[],["네 시나리오는 2035년 A(AI의 업무·관리 침투), L(추적 가능성: 기록·설명·의미 있는 검토·이의 제기), I(제도적 책임 대응: 배치자 의무·감독자 권한과 보호·변경 절차·공정 문화)가 임계값을 넘는지로 판정한다.",
  "The four scenarios are decided by whether in 2035 A (AI permeation into work and management), L (traceability: records, explanation, meaningful review, contestability) and I (institutional accountability response: deployer duties, overseer authority and protection, change procedures, just culture) cross thresholds.",
  "Четыре сценария определяются тем, превысят ли в 2035 г. пороги A (проникновение ИИ в работу и управление), L (прослеживаемость: записи, объяснения, значимая проверка, оспаривание) и I (институциональный ответ: обязанности эксплуатантов, полномочия и защита надзирающих, процедуры изменений, справедливая культура).",
  "四个情景依2035年A（AI对工作与管理的渗透）、L（可追溯性：记录、解释、有意义的复核、可申诉）、I（制度性问责回应：部署者义务、监督者权限与保护、变更程序、公正文化）是否越过阈值判定。",
  "4つのシナリオは、2035年のA（AIの業務・管理への浸透）、L（追跡可能性：記録・説明・意味のある審査・異議申し立て）、I（制度的な責任対応：導入者の義務・監督者の権限と保護・変更手続き・公正な文化）がしきい値を超えるかで判定する。"]),
 s("D",[1,3,2],["침투가 낮으면 S4(제자리의 책임), 침투했지만 추적 가능성이 무너지면 S3(책임 증발), 추적 가능성이 있어도 제도가 약하면 기록이 개인 추궁에 쓰이는 S2(정밀 추궁), 둘 다 갖추면 S1(책임의 재설계)이다.",
  "Low permeation gives S4 (old blame, little change); permeation with collapsed traceability gives S3 (accountability evaporates); traceability with weak institutions gives S2 (precision blame), where records are used against individuals; both together give S1 (responsibility redesigned).",
  "Низкое проникновение — S4 (старая вина без перемен); проникновение при рухнувшей прослеживаемости — S3 (испарение ответственности); прослеживаемость при слабых институтах — S2 (точечное обвинение), где записи используют против людей; и то и другое — S1 (перестройка ответственности).",
  "渗透低为S4（原地踏步的责任）；渗透而可追溯性崩溃为S3（责任蒸发）；有可追溯性但制度薄弱为S2（精准追责），记录被用来追究个人；两者兼备为S1（责任的重新设计）。",
  "浸透が低ければS4（変わらない責任）、浸透したが追跡可能性が崩れればS3（責任の蒸発）、追跡可能性があっても制度が弱ければ記録が個人の追及に使われるS2（精密な責任追及）、両方が備わればS1（責任の再設計）である。"]),
 s("D",[28,55,44],["이 구조에서 S2는 '기술은 성공했지만 책임은 실패한' 경로라는 점이 중요하다: 로그와 설명 기능이 갖춰져도, 그 기록을 누가 어떤 규칙으로 쓰는지가 정해지지 않으면 AI는 책임을 덜기보다 잘게 쪼개어 개인에게 돌려준다.",
  "What matters in this structure is that S2 is the path where 'the technology succeeds but responsibility fails': even with logs and explanation features, if it is not settled who uses the records under what rules, AI slices responsibility finely and returns it to individuals rather than lightening it.",
  "Важно, что S2 — путь, где «технология преуспела, а ответственность провалилась»: даже при наличии журналов и объяснений, если не определено, кто и по каким правилам пользуется записями, ИИ не облегчает ответственность, а дробит её и возвращает людям.",
  "在这一结构中，重要的是S2是“技术成功而责任失败”的路径：即使有日志与解释功能，如果没有规定谁、按什么规则使用这些记录，AI不会减轻责任，而是把责任切细后返还给个人。",
  "この構造で重要なのは、S2が「技術は成功したが責任は失敗した」経路だという点である。ログと説明の機能が備わっても、その記録を誰がどんな規則で使うかが決まらなければ、AIは責任を軽くするより細かく刻んで個人に返す。"])
),SCN,TB("timeline")],
[P(
 s("D",[],["네 시나리오는 AI 침투·추적 가능성·제도적 책임 대응의 임계값으로 판정한다.","The four scenarios are decided by thresholds on AI permeation, traceability and institutional accountability response.","Четыре сценария определяются порогами проникновения ИИ, прослеживаемости и институционального ответа.","四个情景依AI渗透、可追溯性与制度性问责回应的阈值判定。","4つのシナリオはAIの浸透・追跡可能性・制度的な責任対応のしきい値で判定する。"]),
 s("D",[1,3,2],["추적 가능성이 있어도 제도가 약하면 S2(정밀 추궁)가 된다.","Traceability with weak institutions leads to S2 (precision blame).","Прослеживаемость при слабых институтах ведёт к S2 (точечное обвинение).","有可追溯性但制度薄弱则成为S2（精准追责）。","追跡可能性があっても制度が弱ければS2（精密な責任追及）になる。"])

SEC("mcmc",["MCMC 시뮬레이션: 시나리오 확률분포","MCMC Simulation: Scenario Probability Distribution","MCMC-симуляция: распределение вероятностей сценариев","MCMC模拟：情景概率分布","MCMCシミュレーション：シナリオ確率分布"],
[P(
 s("D",[],["모형은 15개 지표(0~1 코딩, 근거 등급에 따라 오차 σ 부여)로 2026년 A·I·L의 잠재 수준을 추정하고, 연간 변화율의 사전분포를 더해 4개 체인 메트로폴리스 MCMC로 사후분포를 구한 뒤 2035년까지 9년을 투영한다(고정 seed 20261128).",
  "The model estimates 2026 latent levels of A, I and L from 15 indicators (coded 0–1, with error σ by evidence grade), adds priors on annual change, obtains the posterior with four-chain Metropolis MCMC and projects nine years to 2035 (fixed seed 20261128).",
  "Модель оценивает латентные уровни A, I и L в 2026 г. по 15 индикаторам (кодировка 0–1, ошибка σ по классу доказательности), добавляет априорные распределения годовых изменений, получает апостериор методом Метрополиса с четырьмя цепями и проецирует девять лет до 2035 г. (фиксированный seed 20261128).",

 ["D",[2,6,37],["결정이 여러 모델·공급사·하청 단계를 거치며 블랙박스가 되고, '알고리즘이 정했다'는 해명이 통해 아무도 책임지지 않는다.","Decisions pass through many models, vendors and subcontracting tiers and become black boxes; 'the algorithm decided' is accepted and no one is accountable.","Решения проходят через множество моделей, поставщиков и уровней субподряда и становятся «чёрными ящиками»; объяснение «решил алгоритм» принимается, и никто не отвечает.","决策经过众多模型、供应商与分包层级而成为黑箱，“算法决定的”说辞被接受，无人负责。","決定が多くのモデル・供給会社・下請けの段階を経てブラックボックスになり、「アルゴリズムが決めた」という弁明が通って誰も責任を負わない。"]],

// ===== MCMC engine =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNorm(r){let sp=null;return function(){if(sp!==null){const v=sp;sp=null;return v;}let u=0,v=0;while(u===0)u=r();v=r();const m=Math.sqrt(-2*Math.log(u));sp=m*Math.sin(2*Math.PI*v);return m*Math.cos(2*Math.PI*v);}}
const sig=x=>1/(1+Math.exp(-x)), logit=p=>Math.log(p/(1-p));
function runMCMC(opt){
 const o=Object.assign({},DEFAULTS,opt||{}); const reg=REGIONS[o.region||"global"];
 const ind=INDICATORS.map(d=>({ax:d.ax,v:(reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v),s:d.s}));
 const r=mulberry32(o.seed), N=makeNorm(r);
 // params: [a,i,l (logit levels 2026), ga,gi,gl]
 const pm=[0,0,0,o.ga,o.gi,o.gl], ps=[1.5,1.5,1.5,o.gaSd,.08,.05];
 function lp(th){let s=0;for(let k=0;k<6;k++){const z=(th[k]-pm[k])/ps[k];s-=.5*z*z;}
  const lv={A:sig(th[0]),I:sig(th[1]),L:sig(th[2])};
  for(const d of ind){const z=(d.v-lv[d.ax])/d.s;s-=.5*z*z;}return s;}
 const step=[.22,.20,.22,.06,.06,.04], chains=4, iters=o.iters||14000, burn=o.burn||4000, thin=10;
 const draws=[], traces=[[],[],[],[]]; let acc=0,tot=0;
 const perChain=[];
 for(let c=0;c<chains;c++){
  let th=[N()*1.2,N()*1.2,N()*1.2,pm[3]+N()*.1,pm[4]+N()*.1,pm[5]+N()*.06], cur=lp(th); const cd=[];
  for(let t=0;t<iters;t++){
   const pr=th.map((x,k)=>x+step[k]*N()); const np=lp(pr);
   if(Math.log(r())<np-cur){th=pr;cur=np;if(t>=burn)acc++;}
   if(t>=burn)tot++;
   if(t%20===0)traces[c].push(sig(th[1]));
   if(t>=burn&&t%thin===0){cd.push(th.slice());draws.push(th.slice());}
  }
  perChain.push(cd);
 }
 // R-hat per param
 const rhat=[];for(let k=0;k<6;k++){const m=perChain.map(cd=>cd.reduce((s,x)=>s+x[k],0)/cd.length);const n=perChain[0].length;
  const W=perChain.map((cd,j)=>cd.reduce((s,x)=>s+(x[k]-m[j])**2,0)/(n-1)).reduce((a,b)=>a+b,0)/chains;
  const mm=m.reduce((a,b)=>a+b,0)/chains;const B=n*m.reduce((s,x)=>s+(x-mm)**2,0)/(chains-1);
  rhat.push(Math.sqrt(((n-1)/n*W+B/n)/W));}
 // posterior predictive 2035
 const Y=9, M=40, kD=o.kappa*reg.D; const probs=[], pts=[], post={A0:[],I0:[],L0:[],A35:[],I35:[],L35:[]};
 const tally=[0,0,0,0];
 for(let d=0;d<draws.length;d++){const th=draws[d];const cnt=[0,0,0,0];
  post.A0.push(sig(th[0]));post.I0.push(sig(th[1]));post.L0.push(sig(th[2]));
  for(let m=0;m<M;m++){
   const A=sig(th[0]+Y*th[3]+o.tau*N()), I=sig(th[1]+Y*(th[4]-kD)+o.tau*N()), L=sig(th[2]+Y*th[5]+o.tau*N());
   let s; if(A<o.thA)s=3; else if(L<o.thL)s=2; else if(I>=o.thI)s=0; else s=1;
   cnt[s]++; tally[s]++;
   if(m===0){pts.push([A,I,L,s]);post.A35.push(A);post.I35.push(I);post.L35.push(L);}
  }
  probs.push(cnt.map(x=>x/M));}
 const total=draws.length*M; const mean=tally.map(x=>x/total);

  const [v,c,lab0]=cfg.V[rw[1]],n=cfg.L[rw[1]],lab=lab0||(cfg.fmt?cfg.fmt(v):String(v));

function mcmcShell(){const sl=(k,min,max,stp,h)=>`<div class="ctrl"><label>${T(k)}<output id="o-${k}"></output></label><input type="range" id="i-${k}" min="${min}" max="${max}" step="${stp}"><div class="hint">${h?esc(T(h)):""}</div></div>`;
 return `<div class="wbox" id="mcW"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center" class="noprint"><b style="font-size:13px">${T("region")}</b><div class="seg" id="mcReg">${Object.keys(REGIONS).map(r=>`<button data-r="${r}">${X(REGIONS[r])}</button>`).join("")}</div>
 <span style="flex:1"></span><button class="iconbtn" id="mcRun">▶ ${T("run")}</button><button class="iconbtn" id="mcSeed">${T("seed")}</button><button class="iconbtn" id="mcReset">${T("reset")}</button></div>
 <div class="ctrls">${sl("ga",0,.3,.01,"hga")}${sl("gi",-.05,.3,.01,"hgi")}${sl("gl",-.15,.1,.01,"hgl")}${sl("tau",.1,1,.05,"htau")}${sl("thA",.4,.85,.01)}${sl("thL",.3,.75,.01)}${sl("thI",.3,.8,.01)}<div class="ctrl"><div class="diag" id="mcDiag"></div></div></div>
 <div class="wrow"><div class="panelc"><h5>${T("mBars")}</h5><div id="mcBars"></div></div><div class="panelc printhide"><h5>${T("mHist")}</h5><div id="mcHist"></div></div></div>
 <div class="wrow" style="margin-top:12px"><div class="panelc printhide"><h5>${T("mScatter")}</h5><div class="s">${T("mScS")}</div><div id="mcSc"></div></div><div class="panelc"><h5>${T("mReg")}</h5><div id="mcRegs"></div><div class="printhide"><h5 style="margin-top:10px">${T("mTrace")}</h5><div id="mcTr"></div></div></div></div>
 <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;font-weight:700">${T("mInd")}</summary><div id="mcInd"></div></details></div>`;}
function syncCtrls(){["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);if(!i)return;i.value=mcOpt[k];$("#o-"+k).textContent=(+mcOpt[k]).toFixed(2);});
 $$("#mcReg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===mcOpt.region));}
function drawMC(){syncCtrls();
 ["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);i.oninput=()=>{mcOpt[k]=+i.value;$("#o-"+k).textContent=(+i.value).toFixed(2);};i.onchange=()=>rerun();});
 $$("#mcReg button").forEach(b=>b.onclick=()=>{mcOpt.region=b.dataset.r;rerun();});
 $("#mcRun").onclick=rerun;$("#mcSeed").onclick=()=>{mcOpt.seed=(Math.random()*1e9)|0;rerun();};$("#mcReset").onclick=()=>{mcOpt=Object.assign({region:mcOpt.region},DEFAULTS);rerun();};
 if(MC)paintMC();}
function rerun(){const t0=performance.now();MC=runMCMC(mcOpt);MC.ms=performance.now()-t0;syncCtrls();paintMC();drawSens();}
function paintMC(){if(!MC||!$("#mcBars"))return;const sc=["--s1","--s2","--s3","--s4"],nm=SCEN.map(s=>s.key+" "+T("scs")[s.key]);
 // bars
 {const W=420,rh=40,H=4*rh+24,l=128,X=v=>l+(W-l-50)*v;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-20}"/><text class="tm" x="${X(v)}" y="${H-6}" text-anchor="middle">${v*100}%</text>`);
  MC.mean.forEach((m,k)=>{const y=6+k*rh,c=MC.ci[k];s+=`<text class="tl" x="${l-8}" y="${y+18}" text-anchor="end">${esc(nm[k])}</text>
  <rect x="${X(c[2])}" y="${y+4}" width="${Math.max(2,X(c[3])-X(c[2]))}" height="20" rx="4" fill="var(${sc[k]})" opacity=".35"/><line x1="${X(c[0])}" x2="${X(c[1])}" y1="${y+14}" y2="${y+14}" stroke="var(${sc[k]})" stroke-width="2"/>
  <rect x="${X(m)-2}" y="${y}" width="4" height="28" rx="2" fill="var(${sc[k]})" data-tip="${esc(nm[k])}: <b>${pct(m)}</b><br>50%: ${pct(c[2])}–${pct(c[3])} · 90%: ${pct(c[0])}–${pct(c[1])}"/><text class="tv" x="${Math.min(X(c[1])+6,W-34)}" y="${y+19}">${pct(m)}</text>`;});
  $("#mcBars").innerHTML=s+`</svg>`;}
 // hist small multiples
 {let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;MC.mean.forEach((m,k)=>{const bins=new Array(10).fill(0);MC.probs.forEach(p=>bins[Math.min(9,Math.floor(p[k]*10))]++);const mx=Math.max(...bins);
  let s=`<svg viewBox="0 0 220 90" width="100%"><text class="tl" x="0" y="11">${esc(nm[k])}</text>`;bins.forEach((v,i)=>{const hh=60*v/mx;s+=`<rect x="${4+i*21}" y="${78-hh}" width="19" height="${Math.max(1,hh)}" rx="3" fill="var(${sc[k]})" data-tip="${i*10}–${i*10+10}%: ${(v/MC.probs.length*100).toFixed(1)}%"/>`;});
  s+=`<line class="ax" x1="2" x2="216" y1="78" y2="78"/><text class="tm" x="4" y="89">0%</text><text class="tm" x="214" y="89" text-anchor="end">100%</text></svg>`;h+=s;});$("#mcHist").innerHTML=h+`</div>`;}
 // scatter
 {const W=440,H=290,l=36,b=30,t=8,r=10,X=v=>l+(W-l-r)*v,Y=v=>t+(H-t-b)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,.25,.5,.75,1].forEach(v=>s+=`<text class="tm" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text><text class="tm" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  MC.pts.slice(0,1400).forEach(p=>s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6" fill="var(${sc[p[3]]})" opacity=".55"/>`);
  s+=`<line x1="${X(MC.opt.thA)}" x2="${X(MC.opt.thA)}" y1="${t}" y2="${H-b}" stroke="var(--text-2)" stroke-dasharray="4 3"/><line x1="${X(MC.opt.thA)}" x2="${W-r}" y1="${Y(MC.opt.thI)}" y2="${Y(MC.opt.thI)}" stroke="var(--text-2)" stroke-dasharray="4 3"/>
  <text class="tm" x="${X(.01)}" y="${Y(.97)}">S4 ← θA</text><text class="tm" x="${W-r-4}" y="${Y(MC.opt.thI)-6}" text-anchor="end">θI ↑ S1 · ↓ S2 (S3: L&lt;θL)</text>
  <text class="tl" x="${(l+W)/2}" y="${H}" text-anchor="middle">A 2035</text><text class="tl" transform="translate(10 ${H/2}) rotate(-90)" text-anchor="middle">I 2035</text></svg>`;
  $("#mcSc").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s;}
 // trace
 {const W=440,H=110,l=30;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const tc=["--s1","--s2","--s3","--s4"];const n=MC.traces[0].length;
  [.2,.4,.6].forEach(v=>s+=`<line class="grid" x1="${l}" x2="${W}" y1="${H-10-(H-20)*v}" y2="${H-10-(H-20)*v}"/><text class="tm" x="${l-4}" y="${H-6-(H-20)*v}" text-anchor="end">${v}</text>`);
  MC.traces.forEach((tr,c)=>{s+=`<polyline fill="none" stroke="var(${tc[c]})" stroke-width="1" opacity=".8" points="${tr.map((v,i)=>(l+(W-l)*i/n).toFixed(1)+","+(H-10-(H-20)*v).toFixed(1)).join(" ")}"/>`;});
  const bx=l+(W-l)*(4000/14000);s+=`<line x1="${bx}" x2="${bx}" y1="0" y2="${H-10}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="tm" x="${bx+4}" y="10">burn-in</text></svg>`;$("#mcTr").innerHTML=s;}
 const rh=Math.max(...MC.rhat);$("#mcDiag").innerHTML=`<span>${T("rhat")} <b class="${rh<1.05?"ok":"warn"}">${rh.toFixed(3)}</b></span><span>${T("acc")} <b>${(MC.acc*100).toFixed(0)}%</b></span><span>${T("draws")} <b>${MC.n.toLocaleString()}</b></span><span>${T("time")} <b>${(MC.ms||0).toFixed(0)}ms</b></span><span>seed <b>${MC.opt.seed}</b></span>`;
 // regions
 if(ALLREG){const W=440,rh=30,H=Object.keys(ALLREG).length*rh+6,l=60;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;Object.keys(ALLREG).forEach((r,i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+16}" text-anchor="end">${X(REGIONS[r])}</text>`;
  ALLREG[r].mean.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="22" rx="4" fill="var(${sc[k]})" data-tip="${X(REGIONS[r])} · ${esc(nm[k])}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+15}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
  $("#mcRegs").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s+`</svg>`;}
 // indicators
 {const reg=REGIONS[MC.region];$("#mcInd").innerHTML=`<div class="tblwrap"><table class="t"><thead><tr><th>${T("indAx")}</th><th>${T("indH")}</th><th>${T("indV")}</th><th>${T("indS")}</th><th>${T("indE")}</th></tr></thead><tbody>`+
  INDICATORS.map(d=>{const v=reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v;return `<tr><td>${d.ax}</td><td>${esc(d[st.lang]||d.en||d.ko)}</td><td>${v.toFixed(2)}${reg.ov[d.k]!==undefined?" *":""}</td><td>${d.s.toFixed(2)}</td><td>${refB(d.refs)}</td></tr>`}).join("")+
  `<tr><td>D</td><td>${esc(T("demoInd"))}</td><td>${reg.D.toFixed(2)}</td><td>—</td><td>${refB(DREFS)}</td></tr></tbody></table></div><div class="fsub" style="font-size:11.5px;color:var(--muted)">* ${esc(T("regAdj"))} · Prior: logit level ~ N(0,1.5); g_A ~ N(${MC.opt.ga},${MC.opt.gaSd}); g_I ~ N(${MC.opt.gi},0.08); g_L ~ N(${MC.opt.gl},0.05); κ=${MC.opt.kappa}; X₂₀₃₅ = σ(logit X₀ + 9·g + τ·ε)</div>`;
  $$("#mcInd .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}
}


// ---------- sensitivity analysis ----------
let SENS=null,SENSREG=null,sensBusy=false;
const SENS_P=[["ga",.05,"g_A"],["gi",.05,"g_I"],["gl",.03,"g_L"],["tau",.15,"τ"],["thA",.05,"θA"],["thL",.05,"θL"],["thI",.05,"θI"]];
function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}
function drawSens(){const el=$("#sensW");if(!el)return;const reg=(MC&&MC.region)||"global";
 if(!SENS||SENSREG!==reg){el.innerHTML=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensRun"))}</div>`;if(MCG)computeSens(reg,()=>drawSens());return;}
 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));
 const cell=x=>{const a=Math.round(Math.min(1,Math.abs(x)/mx)*70);return `<td class="cell" style="background:color-mix(in srgb,var(${x>=0?"--pos":"--neg"}) ${a}%,var(--surface));color:${a>45?"#fff":"var(--text)"}" data-tip="${x>=0?"+":""}${x.toFixed(1)} pp">${x>=0?"+":""}${x.toFixed(1)}</td>`;};
 let h=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensS"))} · ${esc(X(REGIONS[reg]))}</div><div class="tblwrap"><table class="t hm"><thead><tr><th>${esc(T("sensP"))}</th>${SCEN.map(s=>`<th style="text-align:center">Δ${s.key}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

// ---------- persona panel ----------
function pools(){const n=PERSONAS.length;const lin=[0,1,2,3].map(k=>PERSONAS.reduce((s,p)=>s+p.p[k],0)/n);
 let lg=[0,1,2,3].map(k=>Math.exp(PERSONAS.reduce((s,p)=>s+Math.log(p.p[k]),0)/n));const z=lg.reduce((a,b)=>a+b);lg=lg.map(x=>x/z);
 const kl=(p,q)=>p.reduce((s,x,i)=>s+(x>0?x*Math.log(x/q[i]):0),0);const js=PERSONAS.reduce((s,p)=>{const m=p.p.map((x,i)=>(x+lin[i])/2);return s+.5*kl(p.p,m)+.5*kl(lin,m);},0)/n;
 const mc=MCG?MCG.mean:[.25,.25,.25,.25];const bl=mc.map((x,i)=>(x+lin[i])/2);return{lin,lg,js,mc,bl};}
function drawPanel(){const el=$("#panelW");const sc=["--s1","--s2","--s3","--s4"];const L=st.lang;const PL=p=>p[L]||p.en;
 let h=`<div class="wrow"><div class="panelc"><h5>${T("pHeat")}</h5><div class="tblwrap"><table class="t hm"><thead><tr><th>${T("persona")}</th>${SCEN.map(s=>`<th style="text-align:center">${s.key}</th>`).join("")}</tr></thead><tbody>`;
 PERSONAS.forEach((p,i)=>{h+=`<tr data-p="${i}" class="${i===selP?"sel":""}"><td class="pn">${esc(PL(p).n)}<div style="font-weight:400;font-size:11px;color:var(--muted)">${esc(PL(p).r)}</div></td>`+p.p.map((v,k)=>`<td class="cell" style="background:color-mix(in srgb,var(${sc[k]}) ${Math.round(v*100*1.3)}%,var(--surface));color:${v>.4?"#fff":"var(--text)"}" data-tip="${esc(PL(p).n)} · ${SCEN[k].key}: <b>${pct(v)}</b>">${pct(v)}</td>`).join("")+`</tr>`;});
 h+=`</tbody></table></div></div><div class="panelc"><h5>${T("pAgg")}</h5><div id="pAgg"></div><div class="persona-detail" id="pDet"></div></div></div>`;
 el.innerHTML=h;$$("#panelW tr[data-p]").forEach(tr=>tr.onclick=()=>{selP=+tr.dataset.p;drawPanel();});paintAgg();paintPDet();}
function paintAgg(){const P=pools();const sc=["--s1","--s2","--s3","--s4"];const rows=[[T("mc"),P.mc],[T("lin"),P.lin],[T("logp"),P.lg],[T("blend"),P.bl]];
 const W=440,rh=34,l=150,H=rows.length*rh+6;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 rows.forEach(([n,v],i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+17}" text-anchor="end">${esc(n)}</text>`;v.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="24" rx="4" fill="var(${sc[k]})" data-tip="${esc(n)} · ${SCEN[k].key}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+16}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
 $("#pAgg").innerHTML=leg(SCEN.map((s,k)=>[`var(${sc[k]})`,s.key+" "+T("sc")[s.key]]))+s+`</svg><div class="diag" style="margin-top:4px"><span>${T("dis")} <b>${P.js.toFixed(3)}</b></span></div>`;}
function paintPDet(){const p=PERSONAS[selP],d=p[st.lang]||p.en;$("#pDet").innerHTML=`<b>${esc(d.n)}</b> <span class="rl">· ${esc(d.r)}</span>
 <div class="pgrid"><div><b>${T("pLens")}</b>${esc(d.lens)}</div><div><b>${T("pSig")}</b>${esc(d.sig)}</div><div style="grid-column:1/-1"><b>${T("pView")}</b>${esc(d.v)}</div><div style="grid-column:1/-1"><b>${T("pMove")}</b>${esc(d.mv)}</div></div>
 <div style="margin-top:6px;font-size:12px"><span class="g D" style="vertical-align:0">D</span> ${refB(p.refs)}</div>`;
 $$("#pDet .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}

// boot: run global default MCMC (fixed seed) so numbers in text are reproducible
render();
if(autoLang)setTimeout(()=>toast(T("langAuto")+" · "+I18N[st.lang].langName),600);
setTimeout(()=>{const t0=performance.now();MCG=runMCMC({region:"global"});MCG.ms=performance.now()-t0;MC=MCG;
