 "这是汇总104项研究、437个效应量的元分析。失业者的心理与身体幸福感低于就业者；失业持续时间与样本类型调节了这一关系，但当时的失业率与失业救济水平没有。在失业者中，工作角色中心性、包括时间结构在内的应对资源、认知评价与应对策略，比人力资本或人口学变量与心理健康的关联更强。许多研究是相关研究，因果方向只能从纵向研究判断。",
 "104件の研究、437の効果量をまとめたメタ分析である。失業者の心理的・身体的ウェルビーイングは就業者より低く、失業期間と標本の種類はこの関係を調整したが、当時の失業率と失業給付の水準は調整しなかった。失業者の中では、仕事役割の中心性、時間の構造を含む対処資源、認知的評価と対処戦略が、人的資本や人口学的変数より精神的健康と強く関連した。相関研究が多く、因果の方向は縦断研究でしか判断できない。"],
["일이 소득 외의 재화(시간 구조·역할)를 공급한다는 입장 5의 핵심 근거로 쓴다.","Used as the core evidence for Position 5: work supplies goods beyond income, such as time structure and role.","Используется как ключевое свидетельство позиции 5: труд даёт блага помимо дохода — структуру времени и роль.","作为立场五的核心依据：工作在收入之外提供时间结构与角色等好处。","仕事が所得以外の財（時間の構造・役割）を供給するという立場5の中心的な根拠として使う。"]);

E(78,"A","q1",2017,"David Cesarini, Erik Lindqvist, Matthew J. Notowidigdo & Robert Östling, American Economic Review 107(12) (2017), pp. 3917–46","The Effect of Wealth on Individual and Household Labor Supply: Evidence from Swedish Lotteries","https://www.aeaweb.org/articles?id=10.1257/aer.20151589",
"Winning a lottery prize modestly reduces earnings",
["무작위로 배정되는 복권 당첨을 이용해 부가 노동 공급에 미치는 인과 효과를 추정했다. 당첨은 근로소득을 완만하게 줄였고, 그 감소는 즉각적·지속적이며 나이·학력·성별에 따라 비슷했고, 당첨자 본인의 반응이 배우자보다 컸다. 스웨덴의 복권 구매자 표본이라 다른 나라와 계층으로 일반화하는 데는 한계가 있다.",
 "Uses the random assignment of lottery prizes to estimate the causal effect of wealth on labour supply. Winning modestly reduced earnings; the reduction was immediate, persistent and similar across age, education and sex, and winners responded more than their spouses. The sample is Swedish lottery players, which limits generalisation to other countries and groups.",
 "Использует случайное распределение лотерейных выигрышей для оценки причинного влияния богатства на предложение труда. Выигрыш умеренно снижал заработки; снижение было немедленным, устойчивым и сходным по возрасту, образованию и полу, причём сами выигравшие реагировали сильнее супругов. Выборка — шведские игроки в лотерею, что ограничивает обобщение.",
 "利用彩票奖金的随机分配，估计财富对劳动供给的因果效应。中奖使劳动收入温和下降，下降是即时且持久的，在年龄、学历与性别之间相似，中奖者本人的反应大于其配偶。样本为瑞典彩票购买者，推广到其他国家与群体有局限。",
 "無作為に割り当てられる宝くじの当選を使い、富が労働供給に与える因果効果を推定した。当選は勤労所得を緩やかに減らし、その減少は即時的・持続的で、年齢・学歴・性別で似通っており、当選者本人の反応が配偶者より大きかった。スウェーデンの宝くじ購入者の標本なので、他国・他の層への一般化には限界がある。"],
["돈이 생겨도 사람들은 일을 크게 놓지 않는다는 근거로 쓴다.","Used as evidence that people do not largely give up work when they come into money.","Используется как свидетельство того, что, получив деньги, люди в основном не бросают работу.","用作证据：人们即使有了钱，也大多不会放下工作。","お金が入っても人々は仕事を大きく手放さないという根拠として使う。"]);

E(79,"B","survey",2026,"Eva Vivalt, Elizabeth Rhodes, Alexander W. Bartik, David E. Broockman, Patrick Krause & Sarah Miller, NBER Working Paper 32719 (Jul 2024; rev. Aug 2026)","The Employment Effects of a Guaranteed Income: Experimental Evidence from Two U.S. States","https://www.nber.org/papers/w32719",
"4.2 percentage point decrease in labor market participation",
["미국 두 주에서 저소득층 1,000명에게 3년간 매달 1,000달러를 조건 없이 주고, 대조군 2,000명에게는 매달 50달러를 준 무작위 실험이다. 이전소득을 뺀 개인 소득은 연 약 1,900달러, 노동시장 참여는 4.2%포인트 줄었고, 근로시간은 본인과 배우자 모두 주 1~2시간 줄었으며 늘어난 시간은 주로 여가로 갔다. 일자리의 질 개선은 없었고 주관적 웰빙은 첫해에만 높았다. 동료심사 전 워킹페이퍼라 B로 둔다.",
 "A randomised experiment in two US states giving 1,000 low-income people $1,000 a month unconditionally for three years, with 2,000 controls receiving $50 a month. Individual income excluding transfers fell by about $1,900 a year and labour-market participation by 4.2 percentage points; participants and their partners cut work by 1–2 hours a week, with the time going mainly to leisure. There was no improvement in job quality, and subjective well-being was higher only in the first year. A working paper before peer review, so graded B.",
 "Рандомизированный эксперимент в двух штатах США: 1000 малообеспеченных получали безусловно по 1000 долларов в месяц три года, 2000 контрольных — по 50 долларов. Доход без учёта трансфертов снизился примерно на 1900 долларов в год, участие на рынке труда — на 4,2 п.п.; участники и их партнёры сократили работу на 1–2 часа в неделю, время ушло в основном на досуг. Качество работы не улучшилось, субъективное благополучие было выше лишь в первый год. Рабочий доклад до рецензирования, поэтому оценка B.",
 "这是在美国两个州进行的随机实验：1,000名低收入者三年内每月无条件领取1,000美元，2,000名对照组每月领取50美元。扣除转移支付的个人收入每年减少约1,900美元，劳动市场参与率下降4.2个百分点；参与者及其伴侣每周工作时间减少1至2小时，增加的时间主要用于休闲。工作质量没有改善，主观幸福感仅在第一年较高。属同行评审前的工作论文，故定为B。",
 "米国の2州で低所得者1,000人に3年間毎月1,000ドルを無条件で支給し、対照群2,000人には毎月50ドルを支給した無作為化実験である。移転を除く個人所得は年約1,900ドル、労働市場参加は4.2ポイント減り、本人と配偶者の労働時間は週1〜2時間減って、増えた時間は主に余暇に回った。仕事の質の改善はなく、主観的ウェルビーイングは1年目だけ高かった。査読前のワーキングペーパーなのでBとする。"],
["보장소득이 노동을 없애지도, 해방을 가져오지도 않는다는 근거로 쓴다.","Used as evidence that a guaranteed income neither abolishes work nor brings liberation.","Используется как свидетельство того, что гарантированный доход не отменяет труд и не приносит освобождения.","用作证据：保障收入既没有消灭劳动，也没有带来解放。","保障所得が労働をなくしもせず、解放ももたらさないという根拠として使う。"]);

E(80,"A","q1",2025,"Suqing Wu, Yukun Liu, Mengqi Ruan, Siyu Chen & Xiao-Yun Xie, Scientific Reports 15 (2025), published 29 Apr 2025","Human-generative AI collaboration enhances task performance but undermines human's intrinsic motivation","https://www.nature.com/articles/s41598-025-98385-2",
"significant decreases in intrinsic motivation and increases in feelings of boredom",
["총 3,562명이 참여한 네 차례 온라인 실험에서 생성형 AI와의 협업은 당장의 과제 성과를 높였지만 그 효과는 이어진 혼자 하는 과제로 이어지지 않았고, 협업에서 혼자 일하기로 옮긴 사람들은 통제감이 커진 반면 내재적 동기가 유의하게 줄고 지루함이 커졌다. 짧은 과제를 쓴 온라인 실험이라 실제 직장의 장기 효과로 옮기려면 현장 연구가 필요하다.",
 "In four online experiments with 3,562 participants in total, collaborating with generative AI raised immediate task performance, but the gain did not carry over to subsequent solo tasks; people moving from AI collaboration to solo work felt more in control but showed significant drops in intrinsic motivation and rises in boredom. These are online experiments with short tasks, so field research is needed before extrapolating to long-term effects at work.",
 "В четырёх онлайн-экспериментах с общим числом 3562 участника сотрудничество с генеративным ИИ повышало немедленную результативность, но эффект не переносился на последующие самостоятельные задачи; перешедшие от работы с ИИ к самостоятельной ощущали больше контроля, но их внутренняя мотивация значимо снижалась, а скука росла. Это онлайн-эксперименты с короткими задачами, и для выводов о долгосрочных эффектах на работе нужны полевые исследования.",
 "在共3,562人参与的四项在线实验中，与生成式AI协作提高了即时任务表现，但效果未延续到随后的独立任务；从协作转为独自工作的人控制感增强，但内在动机显著下降、无聊感增加。这是使用短任务的在线实验，要推及职场的长期效果还需现场研究。",
 "計3,562人が参加した4回のオンライン実験で、生成AIとの協働は当面の課題成績を高めたが、その効果は続く単独の課題には持ち越されず、協働から単独作業に移った人は統制感が高まる一方、内発的動機づけが有意に下がり退屈さが増した。短い課題を使ったオンライン実験なので、実際の職場の長期的効果に移すには現場研究が必要である。"],
["AI가 일의 경제적 필요보다 의미 공급을 먼저 건드린다는 논평의 실험 근거로 쓴다.","Used as experimental evidence for the commentary that AI touches work's supply of meaning before its economic necessity.","Используется как экспериментальное основание комментария о том, что ИИ затрагивает смысл труда раньше, чем его экономическую необходимость.","作为评论的实验依据：AI先触及工作的意义供给，而非其经济必要性。","AIが仕事の経済的必要より先に意味の供給に触れるという論評の実験的根拠として使う。"]);

E(81,"A","q1",2023,"Sarah Bankins & Paul Formosa, Journal of Business Ethics 185 (2023), pp. 725–740","The Ethical Implications of Artificial Intelligence (AI) For Meaningful Work","https://link.springer.com/article/10.1007/s10551-023-05339-7",
"the deployment of AI can enhance or diminish employees’ experiences of meaningful work",
["의미 있는 일을 '일이 가치·중요성·더 높은 목적을 가진다는 지각'으로 정의하고, AI 배치를 일부 과업의 대체, '기계 돌보기', 인간 역량의 증폭이라는 세 경로로 나눠 의미 있는 일의 다섯 차원에 미치는 영향과 윤리적 함의를 분석한 개념 연구다. 실증 자료가 아니라 분석 틀이다.",
 "A conceptual paper defining meaningful work as the perception that one's work has worth, significance or a higher purpose, and analysing how three paths of AI deployment — replacing some tasks, 'tending the machine' and amplifying human skills — affect five dimensions of meaningful work, with their ethical implications. It is an analytical framework, not empirical data.",
 "Концептуальная статья: осмысленный труд определён как восприятие ценности, значимости или высшей цели своей работы; анализируется, как три пути внедрения ИИ — замена части задач, «обслуживание машины» и усиление человеческих навыков — влияют на пять измерений осмысленного труда, и каковы этические последствия. Это аналитическая рамка, а не эмпирические данные.",
 "这是一篇概念性研究：把有意义的工作定义为“认为自己的工作有价值、有意义或有更高目的”的感知，并分析AI部署的三条路径——替代部分任务、“照看机器”、放大人的技能——对有意义工作五个维度的影响及其伦理含义。这是分析框架而非实证数据。",
 "意味のある仕事を「仕事が価値・重要性・より高い目的を持つという知覚」と定義し、AIの導入を一部の課題の代替、「機械の世話」、人間の能力の増幅という3つの経路に分け、意味のある仕事の5つの次元への影響と倫理的含意を分析した概念研究である。実証データではなく分析の枠組みである。"],
["AI가 일의 의미를 늘릴 수도 줄일 수도 있다는 균형 잡힌 틀로 쓴다.","Used as a balanced framework: AI can either enlarge or shrink the meaning of work.","Используется как сбалансированная рамка: ИИ может и увеличить, и уменьшить смысл труда.","作为平衡的框架：AI既可能增加也可能减少工作的意义。","AIが仕事の意味を増やすことも減らすこともありうるという均衡の取れた枠組みとして使う。"]);

E(82,"C","survey",2026,"Gallup, State of the Global Workplace 2026 (report page, accessed Nov 2026)","State of the Global Workplace 2026","https://www.gallup.com/workplace/349484/state-of-the-global-workplace.aspx",
"global employee engagement fell to 20% in 2025",
["세계 최대 규모로 꾸준히 이어지는 직원 경험 조사로, 2025년 세계 직원 몰입도가 20%로 2020년 이후 최저였고 처음으로 2년 연속 떨어졌으며, 관리자 몰입도는 1년 새 27%에서 22%로 떨어졌다고 밝혔다. 몰입 지표는 회사의 독자 척도이고 컨설팅 상품과 연결돼 있어 C로 둔다.",
 "From what Gallup calls the world's largest ongoing study of employee experience: global employee engagement fell to 20% in 2025, the lowest since 2020 and the first decline in two consecutive years, while manager engagement fell from 27% to 22% in a year. The engagement measure is the company's proprietary scale linked to its consulting products, so it is graded C.",
 "Из крупнейшего, по словам Gallup, регулярного исследования опыта сотрудников: глобальная вовлечённость в 2025 г. упала до 20% — минимум с 2020 г. и впервые снижение два года подряд; вовлечённость руководителей за год упала с 27% до 22%. Показатель — собственная шкала компании, связанная с её консалтингом, поэтому оценка C.",
 "来自盖洛普所称全球规模最大的持续性员工体验调查：2025年全球员工敬业度降至20%，为2020年以来最低，且首次连续两年下降；管理者敬业度一年内从27%降至22%。敬业度指标是该公司的自有量表并与其咨询产品相关，因此定为C。",
 "世界最大規模で続く従業員経験の調査として、2025年の世界の従業員エンゲージメントが20%と2020年以降で最低になり、初めて2年連続で下がり、管理職のエンゲージメントは1年で27%から22%に下がったと明らかにした。エンゲージメントの指標は同社独自の尺度でコンサルティング商品と結びついているのでCとする。"],
["일이 대다수에게 '몰입하는 소명'이 아니라는 기준선으로 쓴다.","Used as a baseline: for most people, work is not an engaging vocation.","Используется как точка отсчёта: для большинства работа — не увлекающее призвание.","作为基线：对大多数人而言，工作并不是投入其中的召命。","大多数の人にとって仕事は「没頭する召命」ではないという基準線として使う。"]);

// ===== §0 Executive summary =====
SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[3,1,4],["'책임'이라는 한 단어에는 맡은 일(responsibility), 해명할 의무(accountability), 법적 배상(liability), 비난(blame)이 뭉쳐 있고, 실패가 생기면 이 넷이 한꺼번에 통제권이 가장 적은 개인에게 떨어지기 쉽다; 이 보고서의 결론은 개인의 책임을 지우자는 것이 아니라 책임의 해상도를 높이자는 것이다.",
  "The single word 'responsibility' bundles the task one owns, the duty to explain (accountability), legal liability and blame; when failure comes, all four tend to land together on the individual with the least control. This report's conclusion is not to erase individual responsibility but to raise its resolution.",
  "Одно слово «ответственность» объединяет порученную работу, обязанность объясняться (подотчётность), правовую ответственность и порицание; при провале все четыре обычно разом падают на человека с наименьшим контролем. Вывод доклада — не снять с людей ответственность, а повысить её «разрешение».",
  "“责任”一词捆绑了承担的工作、解释的义务（问责）、法律赔偿与指责；失败发生时，这四者往往一并落到控制权最少的个人身上。本报告的结论不是抹去个人责任，而是提高责任的分辨率。",
  "「責任」という一語には、引き受けた仕事、説明する義務（アカウンタビリティ）、法的賠償、非難がまとまっており、失敗が起きるとこの4つが一度に統制権の最も少ない個人に落ちやすい。本報告の結論は個人の責任を消すことではなく、責任の解像度を高めることである。"],
  ["네 갈래 구분은 철학 문헌(근거 3)의 정리를 노동 맥락에 옮긴 이 보고서의 분석 틀이다.","The four-way split adapts the philosophical literature (evidence 3) to the work context as this report's analytical frame.","Четырёхчастное деление — аналитическая рамка доклада, переносящая философскую литературу (источник 3) в контекст труда.","四分法是本报告将哲学文献（依据3）的梳理移用到劳动语境的分析框架。","4つの区分は哲学文献（根拠3）の整理を労働の文脈に移した本報告の分析枠組みである。"],"H"),
 s("A",[9,12,11],["통제 없는 책임은 몸과 마음을 해친다: 요구는 높고 재량은 낮은 직무 긴장은 관상동맥질환 위험을 23% 높이고, 유럽 노동자의 46%가 심한 시간 압박을, 18%가 업무 속도 통제 부족을 겪으며, 일본에서는 2024년도 정신장애 산재 인정이 1,056건으로 늘었고 '업무 내용·업무량의 큰 변화'가 원인 2위였다.",
  "Responsibility without control harms body and mind: job strain — high demands, low latitude — raises coronary risk by 23%; 46% of European workers face severe time pressure and 18% lack control over the pace of work; and in Japan approved mental-disorder claims rose to 1,056 in fiscal 2024, with 'a major change in work content or workload' the second cause.",
  "Ответственность без контроля вредит телу и психике: «напряжение на работе» (высокие требования при низкой свободе) повышает риск ИБС на 23%; 46% европейских работников испытывают сильный дефицит времени, 18% не контролируют темп работы; в Японии признанные психические расстройства выросли до 1 056 в 2024 ф. г., а «резкое изменение содержания или объёма работы» — вторая причина.",
  "无控制的责任损害身心：需求高、自主低的工作紧张使冠心病风险提高23%；46%的欧洲劳动者面临严重时间压力，18%缺乏对工作节奏的控制；日本2024财年精神障碍工伤认定增至1,056件，“工作内容与工作量的重大变化”居原因第二。",
  "統制なき責任は心身を損なう。要求が高く裁量が低い職務緊張は冠動脈疾患のリスクを23%高め、欧州の労働者の46%が強い時間的圧迫を、18%が作業ペースの統制の不足を経験し、日本では2024年度の精神障害の労災認定が1,056件に増え、「仕事内容・仕事量の大きな変化」が原因の2位だった。"],null,"H"),
 s("A",[7,8,15],["실패의 평가는 구조적으로 결과에 끌려간다: 사람들은 같은 정보로 내린 같은 결정도 결과가 나쁘면 더 나쁜 판단으로 평가하고, 결과를 안 뒤에는 '미리 알 수 있었다'고 과대평가하며, IT 프로젝트 비용 초과는 극단값이 잦은 멱법칙을 따르므로 '평균적 일정'을 기준으로 개인을 재는 것 자체가 불공정해지기 쉽다.",
  "Evaluating failure is structurally pulled by outcomes: people rate the same decision made with the same information as worse when the outcome is bad, overestimate after the fact what could have been foreseen, and since IT cost overruns follow a power law with frequent extremes, measuring individuals against an 'average schedule' is itself prone to unfairness.",
  "Оценка провала структурно тянется за исходом: одно и то же решение при той же информации считают хуже при плохом исходе, задним числом переоценивают предсказуемость, а поскольку перерасход в ИТ-проектах следует степенному закону с частыми экстремумами, мерить людей «средним графиком» само по себе несправедливо.",
  "对失败的评价在结构上被结果牵引：同样信息下的同一决定，结果不好时被评为更差，事后人们高估“本可预见”的程度；且IT项目成本超支遵循极端值频发的幂律，以“平均进度”衡量个人本身就容易不公。",
  "失敗の評価は構造的に結果に引っ張られる。同じ情報で下した同じ決定でも結果が悪ければ悪い判断と評価され、結果を知った後は「事前に分かったはず」と過大評価され、ITプロジェクトのコスト超過は極端値が頻繁なべき乗則に従うので、「平均的な日程」で個人を測ること自体が不公正になりやすい。"],null,"H"),
 s("D",[23,24,25,29,31],["AI는 일을 덜어 주기도 하고 늘리기도 한다: 잘 정의된 과업에서는 생산성이 14~40% 올랐고 한국 노동자의 업무시간 절감률은 3.8%에서 9.2%로 커졌지만, 숙련 개발자 실험에서는 AI를 쓴 쪽이 19% 더 느렸는데도 본인들은 20% 빨라졌다고 믿었고, 한국에서도 아낀 시간이 처리량·품질로 이어지는 연결은 아직 약하다.",
  "AI both lightens and adds to work: on well-defined tasks productivity rose 14–40% and Korean workers' time savings grew from 3.8% to 9.2%, but in an experiment with skilled developers those using AI were 19% slower while believing they were 20% faster, and in Korea the link from time saved to throughput and quality is still weak.",
  "ИИ и облегчает, и добавляет работу: в чётких задачах производительность выросла на 14–40%, экономия времени у корейских работников — с 3,8% до 9,2%, но в эксперименте с опытными разработчиками использующие ИИ работали на 19% медленнее, считая, что стали на 20% быстрее, а в Корее связь сэкономленного времени с объёмом и качеством пока слаба.",
  "AI既减轻也增加工作：在界定清晰的任务上生产率提高14–40%，韩国劳动者的时间节省率从3.8%升至9.2%；但在资深开发者实验中，使用AI者慢了19%却相信自己快了20%，韩国节省的时间转化为处理量与质量的关联也仍弱。",
  "AIは仕事を軽くもし、増やしもする。よく定義された課題では生産性が14〜40%上がり、韓国の労働者の業務時間の節約率は3.8%から9.2%に拡大したが、熟練開発者の実験ではAIを使った側が19%遅かったのに本人たちは20%速くなったと信じ、韓国でも節約した時間が処理量・品質につながる結びつきはまだ弱い。"],
  ["수치마다 과업·대상·측정 방식이 달라 하나로 합치지 않는다.","Each figure differs in task, population and measurement, so they are not merged.","Цифры различаются по задачам, выборкам и измерению, поэтому не объединяются.","各数字的任务、对象与测量方式不同，不合并。","数値ごとに課題・対象・測定方法が異なるため一つにまとめない。"],"H"),
 s("D",[1,34,35,38],["'사람의 감독'은 책임을 덜어 주는 장치가 아니라 비난을 빨아들이는 장치가 되기 쉽다: 자동화 편향은 훈련으로 막을 수 없고, 맞는 처방을 틀린 조언 때문에 바꾸는 오류가 5.2% 생기며, 4개국 실험에서 해로운 결과의 비난은 어떤 AI를 썼든 사용자에게 돌아갔다.",
  "'Human oversight' easily becomes a device for soaking up blame rather than easing responsibility: automation bias cannot be trained away, switches from correct to wrong prescriptions occur in 5.2% of cases, and in a four-country experiment blame for harmful outputs fell on users whatever AI they used.",
  "«Человеческий надзор» легко становится не облегчением ответственности, а поглотителем вины: смещение в пользу автоматики не устраняется обучением, смены верного назначения на неверное случаются в 5,2% случаев, а в эксперименте в четырёх странах вину за вредный результат возлагали на пользователя при любом ИИ.",
  "“人的监督”很容易成为吸收指责而非减轻责任的装置：自动化偏差无法靠培训消除，因错误建议把正确处方改错的情况占5.2%，四国实验中无论使用何种AI，有害结果的指责都落在使用者身上。",
  "「人の監督」は責任を軽くする装置ではなく非難を吸い込む装置になりやすい。自動化バイアスは訓練で防げず、正しい処方を誤った助言で変える誤りが5.2%生じ、4か国の実験では有害な結果の非難はどのAIを使っても利用者に向かった。"],null,"H"),
 s("B",[40,41,42],["사고 조사들은 같은 패턴을 보여 준다: 우버 자율주행 사고의 추정 원인은 안전 운전자의 감시 실패였지만 조사기관은 회사의 '부적절한 안전 문화'와 감독기관의 부족을 기여 요인으로 꼽았고, 영국 호라이즌 사건에서는 시스템 결함이 운영자 수백 명의 절도 혐의로 바뀌어 가족에 따르면 13명이 목숨을 끊었으며, 호주 로보데트 왕립위원회는 알고리즘 공개와 현장 직원 협의를 권고했다.",
  "Accident inquiries show the same pattern: the probable cause of the Uber automated-vehicle crash was the safety operator's failure to monitor, but investigators named the company's 'inadequate safety culture' and the regulator's shortcomings as contributing; in the UK Horizon case system faults became theft accusations against hundreds of operators and, according to families, 13 people took their own lives; Australia's Robodebt royal commission recommended published algorithms and consultation with frontline staff.",
  "Расследования показывают одну схему: вероятной причиной аварии беспилотника Uber назван недосмотр оператора, но «неадекватная культура безопасности» компании и недочёты регулятора — сопутствующими факторами; в британском деле Horizon сбои системы превратились в обвинения сотен операторов в краже, и, по словам семей, 13 человек покончили с собой; королевская комиссия по «Рободолгу» рекомендовала раскрывать алгоритмы и советоваться с сотрудниками.",
  "事故调查呈现同一模式：优步自动驾驶事故的可能原因是安全驾驶员监视失败，但调查机构把公司“不当的安全文化”与监管机构的不足列为促成因素；英国Horizon事件中系统缺陷变成对数百名经营者的盗窃指控，据家属称有13人轻生；澳大利亚“机器人追债”皇家委员会建议公开算法并与一线员工协商。",
  "事故調査は同じパターンを示す。ウーバー自動運転事故の推定原因は安全運転者の監視の失敗だったが、調査機関は会社の「不適切な安全文化」と監督機関の不足を寄与要因に挙げ、英国のホライズン事件ではシステムの欠陥が数百人の運営者への窃盗容疑に変わり、家族によれば13人が命を絶ち、豪州のロボデット王立委員会はアルゴリズムの公開と現場職員との協議を勧告した。"],null,"H"),
 s("D",[44,45,52,22],["제도는 방향을 틀기 시작했다: EU는 감독자에게 역량·훈련·권한을 요구하고 플랫폼 노동에서는 감독자를 불이익으로부터 보호하며, 한국은 고영향 AI에 사람의 관리·감독을 의무로 정하고 공공 소프트웨어의 과업 변경을 계약·재원 조정으로 처리하는 절차를 강화했지만, 감독자의 권한과 보호는 대부분의 나라에서 아직 비어 있다.",
  "Institutions have begun to turn: the EU requires overseers to have competence, training and authority and, in platform work, protects them from reprisal; Korea has made human oversight of high-impact AI a duty and strengthened procedures that handle scope changes in public software through contract and funding adjustment — yet overseers' authority and protection remain empty in most countries.",
  "Институты начали поворот: ЕС требует от надзирающих компетенции, подготовки и полномочий, а в платформенном труде защищает их от наказания; Корея сделала надзор за ИИ высокого воздействия обязанностью и усилила процедуры, переводящие изменения задания в госпроектах ПО в корректировку договоров и финансирования, — но полномочия и защита надзирающих в большинстве стран не урегулированы.",
  "制度已开始转向：欧盟要求监督者具备能力、培训与权限，并在平台劳动中保护其免受不利对待；韩国把对高影响AI的人的管理监督定为义务，并强化了以合同与资金调整处理公共软件任务变更的程序——但在多数国家，监督者的权限与保护仍是空白。",
  "制度は向きを変え始めた。EUは監督者に能力・訓練・権限を求め、プラットフォーム労働では監督者を不利益から守り、韓国は高影響AIの人の管理・監督を義務とし、公共ソフトウェアの課業変更を契約・財源の調整で処理する手続きを強化したが、監督者の権限と保護はほとんどの国でまだ空白である。"],null,"M"),
 s("D",[],["MCMC 시뮬레이션의 2035년 글로벌 확률은 정밀 추궁(S2) {S2}, 책임 증발(S3) {S3}, 책임의 재설계(S1) {S1}, 제자리의 책임(S4) {S4}로, AI가 책임을 덜어 줄지 키울지는 기술이 아니라 기록을 누가 어떻게 쓰느냐에 달려 있다.",
  "The MCMC simulation gives 2035 global probabilities of precision blame (S2) {S2}, accountability evaporates (S3) {S3}, responsibility redesigned (S1) {S1} and old blame, little change (S4) {S4}: whether AI eases or enlarges responsibility depends not on the technology but on who uses the records, and how.",
  "MCMC-симуляция даёт глобальные вероятности на 2035 г.: точечное обвинение (S2) {S2}, испарение ответственности (S3) {S3}, перестройка ответственности (S1) {S1}, старая вина без перемен (S4) {S4}; облегчит ли ИИ ответственность или увеличит её, зависит не от технологии, а от того, кто и как использует записи.",
  "MCMC模拟给出的2035年全球概率为：精准追责（S2）{S2}、责任蒸发（S3）{S3}、责任的重新设计（S1）{S1}、原地踏步的责任（S4）{S4}；AI会减轻还是加重责任，不取决于技术，而取决于谁、如何使用这些记录。",
  "MCMCシミュレーションの2035年のグローバル確率は、精密な責任追及（S2）{S2}、責任の蒸発（S3）{S3}、責任の再設計（S1）{S1}、変わらない責任（S4）{S4}で、AIが責任を軽くするか重くするかは技術ではなく、記録を誰がどう使うかにかかっている。"],
  ["확률은 지표 코딩과 사전분포라는 판단에 의존한다(15장).","The probabilities depend on judgements about indicator coding and priors (section 15).","Вероятности зависят от суждений о кодировке индикаторов и априорных распределениях (раздел 15).","概率依赖于指标编码与先验分布的判断（第15章）。","確率は指標の符号化と事前分布という判断に依存する（15章）。"],"M"),
 s("D",[59,77,82,22],["8장 '노동은 신성한가'의 결론: 노동은 신성하지 않다—그 말은 노동을 확보해야 하는 쪽의 처방이었고 일이 주는 인정·소속·시간 구조는 일의 독점일 뿐이며, 노동 신성론은 책임의 경계를 지워 통제할 수 없는 실패까지 헌신 부족으로 만들기 때문에 일은 덜 신성하게, 더 계약답게 다뤄야 한다.",
  "The conclusion of Chapter 8, 'Is work sacred?': work is not sacred — the word was a prescription from those who needed to secure labour, and the recognition, belonging and time structure work provides are only work's monopoly; because the sacredness of work erases the boundaries of responsibility and turns even uncontrollable failures into a lack of devotion, work should be treated less as sacred and more as contract.",
  "Вывод главы 8 «Священен ли труд?»: труд не священен — это слово было предписанием тех, кому нужно было обеспечить труд, а признание, принадлежность и структура времени, которые даёт работа, — лишь её монополия; поскольку идея святости труда стирает границы ответственности и превращает даже неподконтрольные провалы в недостаток преданности, к работе нужно относиться менее как к святыне и более как к договору.",
  "第8章“劳动是神圣的吗”的结论：劳动并不神圣——这个词是需要确保劳动的一方开出的处方，工作提供的认可、归属与时间结构只是工作的垄断；由于劳动神圣论抹去了责任的边界，连无法控制的失败也变成奉献不足，工作应当少当作神圣之事、多当作契约。",
  "第8章「労働は神聖か」の結論：労働は神聖ではない。その言葉は労働を確保しなければならない側の処方であり、仕事が与える承認・所属・時間の構造は仕事の独占にすぎず、労働神聖論は責任の境界を消して統制できない失敗まで献身不足にするので、仕事はより神聖でなく、より契約らしく扱うべきである。"])
)],
[KJ(
 s("D",[3,1],["'책임'에는 맡은 일·해명·배상·비난이 뭉쳐 있어, 실패하면 통제권이 가장 적은 개인에게 한꺼번에 떨어지기 쉽다; 필요한 것은 책임의 해상도를 높이는 일이다.","'Responsibility' bundles task, explanation, liability and blame, which tend to land together on the person with least control when things fail; what is needed is higher resolution of responsibility.","«Ответственность» объединяет работу, объяснение, возмещение и порицание, которые при провале разом падают на человека с наименьшим контролем; нужно повысить её «разрешение».","“责任”捆绑了工作、解释、赔偿与指责，失败时往往一并落到控制权最少者身上；需要的是提高责任的分辨率。","「責任」には仕事・説明・賠償・非難がまとまり、失敗すると統制権の最も少ない個人に一度に落ちやすい。必要なのは責任の解像度を高めることである。"]),
 s("A",[9,12,11],["요구는 높고 재량은 낮은 일은 심장병 위험을 23% 높이고, 유럽 노동자 46%가 심한 시간 압박을 겪으며, 일본에서는 업무량 변화가 정신장애 산재 원인 2위다.","High-demand, low-control work raises heart-disease risk by 23%, 46% of European workers face severe time pressure, and in Japan workload change is the second cause of approved mental-disorder claims.","Работа с высокими требованиями и низким контролем повышает риск болезней сердца на 23%, 46% европейских работников испытывают сильный дефицит времени, а в Японии изменение нагрузки — вторая причина признанных психических расстройств.","需求高而控制低的工作使心脏病风险提高23%，46%的欧洲劳动者面临严重时间压力，日本工作量变化是精神障碍工伤认定的第二大原因。","要求が高く統制の低い仕事は心臓病のリスクを23%高め、欧州の労働者の46%が強い時間的圧迫を受け、日本では業務量の変化が精神障害の労災原因の2位である。"]),
 s("A",[7,8,15],["결과가 나쁘면 같은 결정도 더 나쁘게 평가되고, IT 프로젝트 초과는 극단값이 잦은 분포를 따라 '평균 일정'으로 개인을 재기 어렵다.","The same decision is judged worse when outcomes are bad, and IT overruns follow a distribution with frequent extremes, making an 'average schedule' a poor yardstick for individuals.","Одно и то же решение оценивают хуже при плохом исходе, а перерасход в ИТ следует распределению с частыми экстремумами — «средний график» плохая мерка для людей.","结果不好时同一决定被评得更差，IT超支遵循极端值频发的分布，难以用“平均进度”衡量个人。","結果が悪いと同じ決定でも悪く評価され、ITの超過は極端値の多い分布に従うので「平均的な日程」で個人を測るのは難しい。"]),
 s("D",[25,29,31],["AI는 정형 업무를 덜어 주지만, 체감과 실측이 엇갈리고 아낀 시간이 성과로 이어지지 않아 기대만 높아질 수 있다.","AI lightens routine work, but perception and measurement diverge and saved time does not become output, so only expectations may rise.","ИИ облегчает рутину, но ощущения и измерения расходятся, а сэкономленное время не превращается в результат — растут лишь ожидания.","AI减轻常规工作，但体感与实测背离，节省的时间未转化为成果，可能只有期望在升高。","AIは定型業務を軽くするが、体感と実測が食い違い、節約した時間が成果につながらず、期待だけが高まりうる。"]),
 s("D",[1,34,38],["'사람의 감독'은 권한과 보호가 없으면 비난 스펀지가 되며, 해로운 결과의 비난은 어떤 AI를 썼든 사용자에게 돌아갔다.","Without authority and protection, 'human oversight' becomes a blame sponge, and blame for harmful outputs fell on users whatever AI they used.","Без полномочий и защиты «человеческий надзор» становится губкой вины, а вину за вредный результат возлагали на пользователя при любом ИИ.","没有权限与保护，“人的监督”就会成为指责海绵；有害结果的指责不论使用何种AI都落在使用者身上。","権限と保護がなければ「人の監督」は非難のスポンジになり、有害な結果の非難はどのAIを使っても利用者に向かった。"]),
 s("D",[],["2035년 확률은 S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}이다.","2035 probabilities: S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","Вероятности на 2035 г.: S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","2035年概率为S2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}。","2035年の確率はS2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}である。"]),
 s("D",[59,77,22],["8장의 결론: 노동은 신성하지 않으며, 노동 신성론은 책임의 경계를 지우므로 일은 더 계약답게 다뤄야 한다.",
  "Chapter 8 concludes that work is not sacred and that, because the sacredness of work erases the boundaries of responsibility, work should be treated more as contract.",
  "Вывод главы 8: труд не священен, а поскольку идея его святости стирает границы ответственности, к работе нужно относиться скорее как к договору.",
  "第8章的结论：劳动并不神圣；劳动神圣论抹去责任的边界，因此工作应更多地当作契约来对待。",
  "第8章の結論：労働は神聖ではなく、労働神聖論は責任の境界を消すので、仕事はより契約らしく扱うべきである。"])
)]);

SEC("frame",["문제 정의와 분석 틀: 책임의 네 갈래와 '통제-책임 불일치'","Problem Definition and Framework: Four Strands of Responsibility and the Control–Responsibility Mismatch","Постановка проблемы и рамка: четыре нити ответственности и несоответствие контроля и ответственности","问题界定与分析框架：责任的四个维度与“控制—责任错配”","問題の定義と分析の枠組み：責任の4つの筋と「統制と責任の不一致」"],
[P(
 s("D",[3],["이 보고서는 '책임'을 네 갈래로 나눈다: 맡은 일(responsibility), 결정과 과정을 설명할 의무(accountability), 피해를 배상할 법적 책임(liability), 그리고 비난(blame)이다.",
  "This report splits 'responsibility' into four strands: the task one owns (responsibility), the duty to explain decisions and processes (accountability), legal liability to compensate harm (liability), and blame.",
  "Доклад делит «ответственность» на четыре нити: порученная работа (responsibility), обязанность объяснять решения и процесс (accountability), правовая обязанность возместить вред (liability) и порицание (blame).",
  "本报告把“责任”分为四个维度：承担的工作（responsibility）、解释决定与过程的义务（accountability）、赔偿损害的法律责任（liability）以及指责（blame）。",
  "本報告は「責任」を4つの筋に分ける。引き受けた仕事（レスポンシビリティ）、決定と過程を説明する義務（アカウンタビリティ）、被害を賠償する法的責任（ライアビリティ）、そして非難（ブレーム）である。"]),
 s("D",[3,9],["이 넷은 서로 다른 조건을 필요로 한다: 맡은 일은 자원과 권한이, 해명은 정보가, 배상은 인과관계가, 비난은 '다르게 할 수 있었음'이 전제돼야 정당하다.",
  "Each needs different conditions to be fair: owning a task needs resources and authority, explaining needs information, liability needs causation, and blame needs that one could have done otherwise.",
  "Каждая требует своих условий: для работы нужны ресурсы и полномочия, для объяснения — информация, для возмещения — причинная связь, для порицания — возможность поступить иначе.",
  "四者的正当性条件不同：承担工作需要资源与权限，解释需要信息，赔偿需要因果关系，指责则须以“本可以不同做法”为前提。",
  "この4つは公正であるために異なる条件を要する。仕事には資源と権限、説明には情報、賠償には因果関係、非難には「別のやり方ができた」ことが前提となる。"]),
 s("D",[1,9,12],["이 보고서의 중심 축은 '통제와 책임의 불일치'다: 사양·일정·인력을 정할 권한이 없는 사람에게 결과의 책임이 붙을 때 고통과 왜곡이 가장 커진다.",
  "The report's central axis is the mismatch between control and responsibility: suffering and distortion are greatest when responsibility for outcomes attaches to people with no power over specifications, schedules or staffing.",
  "Центральная ось доклада — несоответствие контроля и ответственности: страдание и искажения максимальны, когда ответственность за результат возлагают на тех, кто не определяет требования, сроки и людей.",
  "本报告的核心轴是“控制与责任的错配”：当结果责任落到无权决定规格、进度与人员的人身上时，痛苦与扭曲最大。",
  "本報告の中心軸は「統制と責任の不一致」である。仕様・日程・人員を決める権限のない人に結果の責任がつくとき、苦痛と歪みが最も大きくなる。"]),
 s("A",[9],["이 축은 직무 스트레스 연구의 요구-통제 모델과 맞닿아 있으며, 유럽 19만7,473명의 개인 자료 메타분석에서 참가자의 15%가 이런 직무 긴장을 보고했고 관상동맥질환 위험비는 1.23이었다.",
  "The axis matches the demand–control model of job stress: in a meta-analysis of individual data on 197,473 Europeans, 15% reported such job strain, with a coronary hazard ratio of 1.23.",
  "Эта ось совпадает с моделью «требования–контроль»: в метаанализе индивидуальных данных 197 473 европейцев 15% сообщили о таком напряжении, отношение рисков ИБС — 1,23.",
  "这一轴与工作压力研究的需求—控制模型相契合：在对19.7万余名欧洲人个人数据的元分析中，15%报告了这种工作紧张，冠心病风险比为1.23。",
  "この軸は職務ストレス研究の要求-統制モデルと重なり、欧州19万7,473人の個人データのメタ分析で参加者の15%がこの職務緊張を報告し、冠動脈疾患のハザード比は1.23だった。"]),
 s("A",[7,8],["두 번째 축은 시점의 불일치다: 평가는 결과가 나온 뒤에 이뤄지므로, 결과가 나쁘면 같은 판단도 나쁜 판단이 되고(결과 편향) 결과를 안 사람은 '예측할 수 있었다'고 느낀다(사후확신 편향).",
  "The second axis is a mismatch in timing: evaluation happens after the outcome, so a bad outcome makes the same judgement look bad (outcome bias), and those who know the outcome feel it was predictable (hindsight bias).",
  "Вторая ось — несоответствие во времени: оценка происходит после исхода, поэтому плохой исход делает то же решение плохим (смещение исхода), а знающие исход считают его предсказуемым (ретроспективное искажение).",
  "第二轴是时点错配：评价在结果出来后进行，结果不好则同一判断也成了坏判断（结果偏差），知道结果的人会觉得“本可预测”（后见之明偏差）。",
  "第2の軸は時点の不一致である。評価は結果が出た後に行われるので、結果が悪いと同じ判断も悪い判断になり（結果バイアス）、結果を知った人は「予測できた」と感じる（後知恵バイアス）。"]),
 s("D",[5,7],["철학에서는 이를 '도덕적 운'이라 부른다: 같은 주의를 기울인 두 운전자 중 한 명만 사고를 냈을 때 그를 더 비난하는 직관처럼, 우리는 통제할 수 없는 결과로 사람을 평가하곤 한다.",
  "Philosophy calls this 'moral luck': like the intuition that of two equally careful drivers we blame more the one who had an accident, we often judge people by outcomes they could not control.",
  "В философии это называют «моральной удачей»: как интуиция, что из двух одинаково осторожных водителей мы сильнее осуждаем попавшего в аварию, мы часто судим людей по исходам, которые им неподконтрольны.",
  "哲学称之为“道德运气”：正如同样小心的两名司机中只有一人出事时我们更责备他那样，我们常以无法控制的结果评价人。",
  "哲学ではこれを「道徳的運」と呼ぶ。同じ注意を払った2人の運転者のうち1人だけが事故を起こしたときにその人をより非難する直観のように、私たちは統制できない結果で人を評価しがちである。"]),
 s("D",[6,4],["세 번째 축은 '많은 손의 문제'다: 발주자·경영진·관리자·실무자·도구 공급사가 조금씩 관여한 실패에서는 누가 무엇에 책임이 있는지 가리기 어렵고, 그래서 가장 눈에 띄는 한 사람에게 책임이 몰리거나 아무에게도 남지 않는다.",
  "The third axis is the 'problem of many hands': in failures where client, executives, managers, workers and tool vendors each played a part, it is hard to say who is responsible for what, so responsibility either piles onto the most visible person or stays with no one.",
  "Третья ось — «проблема многих рук»: когда в провале понемногу участвовали заказчик, руководство, менеджеры, исполнители и поставщики инструментов, трудно сказать, кто за что отвечает, и ответственность либо ложится на самого заметного, либо ни на кого.",
  "第三轴是“多手问题”：在发包方、高管、管理者、实务者与工具供应商都参与一部分的失败中，难以分辨谁对什么负责，于是责任要么集中到最显眼的一人身上，要么无人承担。",
  "第3の軸は「多くの手の問題」である。発注者・経営陣・管理者・実務者・道具の供給会社が少しずつ関わった失敗では誰が何に責任があるかを見分けにくく、最も目立つ一人に責任が集まるか、誰にも残らない。"]),
 s("A",[4],["영의 사회적 연결 모델은 이 상황에서 가해자를 골라내는 대신, 구조에 참여한 모두가 앞을 보며 책임을 나누고 집단적 행동으로만 그 책임을 다할 수 있다고 본다.",
  "Young's social connection model holds that, rather than singling out a culprit, everyone who participates in the structure shares a forward-looking responsibility that can be discharged only through collective action.",
  "Модель социальной связи Янг предлагает не выискивать виновника, а признать, что все участники структуры разделяют ответственность, обращённую в будущее, которую можно исполнить лишь коллективно.",
  "杨的社会连接模型认为，此时不应挑出加害者，而是所有参与结构者共同承担面向未来的责任，且只能通过集体行动来履行。",
  "ヤングの社会的つながりモデルは、この状況で加害者を選び出す代わりに、構造に参加した全員が前を向いて責任を分かち合い、集団的な行動によってのみその責任を果たせるとみる。"]),
 s("D",[4,3,17],["다만 이 틀은 '개인은 책임이 없다'는 결론이 아니다: 조기 공유, 모르는 것을 묻기, 약속의 재협상처럼 개인이 통제할 수 있는 몫은 분명히 남으며, 해상도를 높인다는 것은 그 몫을 더 정확히 가려낸다는 뜻이다.",
  "This frame does not conclude that individuals bear no responsibility: there remain parts individuals can control — sharing early, asking what they do not know, renegotiating commitments — and raising the resolution means identifying those parts more precisely.",

 s("A",[9],["요구-통제 모델의 핵심 예측—높은 요구와 낮은 재량의 결합이 해롭다—은 출판 편향을 보정한 대규모 개인 자료 분석에서도 유지됐다: 위험비는 출판 연구 1.43, 미출판 연구 1.16, 전체 1.23이었다.",
  "The core prediction of the demand–control model — that high demands combined with low latitude are harmful — held even in a large individual-data analysis corrected for publication bias: hazard ratios were 1.43 in published studies, 1.16 in unpublished ones and 1.23 overall.",
  "Главный прогноз модели «требования–контроль» — вредность сочетания высоких требований и низкой свободы — подтвердился и в крупном анализе индивидуальных данных с поправкой на публикационное смещение: ОР 1,43 в опубликованных, 1,16 в неопубликованных и 1,23 в целом.",
  "需求—控制模型的核心预测——高需求与低自主的结合有害——在校正发表偏倚的大规模个人数据分析中依然成立：风险比在已发表研究中为1.43，未发表研究为1.16，总体为1.23。",

  "The WHO treats burn-out as an occupational phenomenon resulting from chronic workplace stress that has not been successfully managed, defined by exhaustion, cynicism and reduced efficacy.",

  "世界保健機関はバーンアウトを「うまく管理されなかった慢性的な職場のストレス」から生じる職業上の現象とみて、枯渇・冷笑・効力感の低下の3次元で定義する。"]),

 s("B",[12],["유럽 2만7천여 명 조사에서 46%가 심한 시간 압박·업무 과부하를, 26%가 조직 내 소통·협력 부족을, 18%가 자율성이나 업무 속도·과정에 대한 영향력 부족을 꼽았고, 27%는 일로 생기거나 악화된 스트레스·우울·불안을 겪었다.",

 s("A",[11],["일본의 2024년도 정신장애 산재는 청구 3,780건, 인정 1,056건으로 늘었고, 인정 원인은 상사 등의 괴롭힘(224건), 업무 내용·업무량의 큰 변화(120건), 고객 등의 현저한 민폐 행위(108건) 순이었다.",

 s("A",[13],["한국 근로환경조사에서는 일하는 시간을 스스로 정할 수 있는 노동자도 여가 시간에 반복해 일하면 소진이 더 컸다(2023년 β=0.36), 즉 재량이 '경계 없는 책임'으로 바뀌면 보호 효과가 사라질 수 있다.",

  "後知恵バイアスは学習まで妨げる。結果を知る人は自分が事前に分かったはずだと過大評価し、その錯覚が過去から学ぶ能力を深刻に制限しうる。"]),

 s("A",[23],["고객지원 상담원 5천여 명의 현장 자료에서 AI 도우미는 시간당 해결 건수를 평균 14%, 초보·저숙련자는 34% 높였지만 가장 숙련된 사람에게는 효과가 미미했다.",

  "In a preregistered experiment with 453 professionals, the group using ChatGPT cut writing time by 40% and raised quality by 18%.",

 s("B",[25],["반면 숙련 오픈소스 개발자 16명이 실제 과제 246개를 처리한 무작위 실험에서는 AI를 쓴 조건이 19% 더 오래 걸렸는데, 개발자들은 사전에 24% 빨라질 것으로 예상했고 끝난 뒤에도 20% 빨라졌다고 믿었다.",
  "By contrast, in a randomised experiment where 16 experienced open-source developers worked 246 real issues, the AI condition took 19% longer, yet developers had expected a 24% speed-up and afterwards still believed they had been 20% faster.",
  "Напротив, в рандомизированном эксперименте, где 16 опытных разработчиков выполнили 246 реальных задач, условие с ИИ заняло на 19% больше времени, хотя они ожидали ускорения на 24% и после считали, что ускорились на 20%.",
  "相反，在16名资深开源开发者处理246个真实任务的随机实验中，使用AI的条件耗时多19%，而开发者事先预期快24%，结束后仍相信快了20%。",
  "一方、熟練オープンソース開発者16人が実際の課題246件を処理した無作為化実験では、AIを使う条件が19%長くかかったが、開発者は事前に24%速くなると予想し、終了後も20%速くなったと信じていた。"]),
 s("D",[25,7,9],["체감과 실측의 이 엇갈림은 책임 문제에서 특히 위험하다: 관리자와 실무자 모두 'AI로 빨라졌다'고 믿으면 일정과 기대는 올라가지만 실제 처리량은 그만큼 오르지 않아, 그 차이가 개인의 성과 부족으로 해석될 수 있다.",
  "This divergence between perception and measurement is especially dangerous for responsibility: if managers and workers both believe AI has made things faster, schedules and expectations rise while actual throughput does not, and the gap can be read as individual underperformance.",
  "Это расхождение ощущений и измерений особенно опасно для ответственности: если и руководители, и исполнители верят, что ИИ всё ускорил, сроки и ожидания растут, а реальная производительность — нет, и разрыв может быть истолкован как недоработка человека.",
  "体感与实测的这种背离在责任问题上尤其危险：若管理者与实务者都相信“AI让工作变快了”，进度与期望就会提高，但实际处理量并未同步提高，差距可能被解读为个人绩效不足。",

 s("B",[29],["한국은행의 2025년 대표 표본 조사에서 근로자의 51.8%가 생성형 AI를 업무에 썼고, 업무시간은 평균 3.8%(주 40시간 기준 1.5시간) 줄었으며 효과는 경력이 짧은 근로자에게 더 컸다.",

  "In a follow-up report on 17 November 2026, work use rose to 66.5% and average time saved to 9.2% (3.7 hours a week), but the correlation between time saved and gains in throughput and quality remained weak and use in core tasks low.",

 s("D",[30,31,26],["아낀 시간이 어디로 가는지가 책임 문제의 핵심이다: 성과로 바뀌지 않은 시간은 더 많은 일, 더 촘촘한 일정, 혹은 결재 대기로 흡수되며, 이를 개인의 몫으로 돌리면 AI는 부담을 덜기보다 기준을 높이는 도구가 된다.",
  "Where saved time goes is the heart of the responsibility problem: time not converted into output is absorbed by more work, tighter schedules or waiting for approvals, and if this is attributed to individuals, AI becomes a tool for raising the bar rather than lightening the load.",

  "A Danish administrative-data study likewise estimates no effect larger than 2% on earnings or recorded hours in AI-exposed occupations two years after ChatGPT's launch, showing individual time savings have not yet translated into labour-market outcomes.",
  "Датское исследование административных данных также не находит эффектов выше 2% на заработки и учтённые часы в профессиях, подверженных ИИ, через два года после выхода ChatGPT: индивидуальная экономия времени ещё не отразилась на рынке труда.",

 s("B",[27,28],["소프트웨어 조직 조사는 AI 도입이 배포의 안정성과 처리량에 부정적 영향을 준다고 보고했고, 이듬해 보고서는 AI가 조직이 원래 가진 강점과 약점을 증폭한다고 정리했다.",

  "ソフトウェア組織の調査はAIの導入がデリバリーの安定性と処理量に負の影響を与えると報告し、翌年の報告書はAIが組織のもともとの強みと弱みを増幅するとまとめた。"]),
 s("D",[28,20,32],["이 '증폭' 명제를 책임 문제에 적용하면, 실패를 학습으로 다루는 조직에서 AI는 기록과 분석으로 책임을 정밀하게 나눠 주지만, 비난 문화가 강한 조직에서는 같은 기록이 개인을 추궁하는 증거가 될 가능성이 크다.",

 s("D",[25,7,9],["체감과 실측이 엇갈리면 기대만 올라가고 차이는 개인의 성과 부족으로 해석될 수 있다.","When perception and measurement diverge, only expectations rise and the gap can be read as individual underperformance.","Когда ощущения и измерения расходятся, растут лишь ожидания, а разрыв трактуется как недоработка человека.","体感与实测背离时只有期望升高，差距可能被解读为个人绩效不足。","体感と実測が食い違うと期待だけが上がり、その差が個人の成果不足と解釈されうる。"])

// ===== §5 Now ④: who is responsible in human–AI work? =====
SEC("humanai",["현재 ④: 사람-AI 협업에서 누가 책임지나 — 도덕적 완충지대와 책임 공백","Now ④: Who Is Responsible in Human–AI Work? — Moral Crumple Zones and Responsibility Gaps","Сейчас ④: кто отвечает в работе человека и ИИ — зоны моральной деформации и разрывы ответственности","现状④：人机协作中谁负责——道德吸能区与责任空白","現在④：人とAIの協働で誰が責任を負うか——道徳的衝撃吸収ゾーンと責任の空白"],
[P(
 s("A",[1],["엘리시는 자동화 시스템에서 통제권이 제한된 사람이 도덕적·법적 책임을 떠안아 기술 시스템의 무결성을 지켜 주는 구조를 '도덕적 완충지대(moral crumple zone)'라고 불렀다.",
  "Elish called the structure in which a person with limited control over an automated system absorbs moral and legal responsibility, protecting the technological system's integrity, a 'moral crumple zone'.",
  "Элиш назвала «зоной моральной деформации» структуру, в которой человек с ограниченным контролем над автоматизированной системой принимает моральную и правовую ответственность, защищая целостность технической системы.",
  "埃利什把自动化系统中控制权有限的人承担道德与法律责任、从而保护技术系统完整性的结构称为“道德吸能区”。",
  "エリッシュは、自動化システムで統制権の限られた人が道徳的・法的責任を負い、技術システムの無欠性を守る構造を「道徳的衝撃吸収ゾーン（モラル・クランプル・ゾーン）」と呼んだ。"]),
 s("A",[2,3],["반대 방향의 위험도 있다: 학습하는 기계의 행동은 누구도 예측할 수 없어 책임이 아무에게도 귀속되지 않는 '책임 공백'이 생기며, 후속 연구는 이 공백이 비난 가능성·도덕적 해명·공적 해명·능동적 책임의 네 갈래로 나타나고 조직·법적 원인에서도 생긴다고 정리했다.",
  "There is also the opposite risk: because no one can predict a learning machine's behaviour, a 'responsibility gap' opens in which responsibility attaches to no one; later work shows the gap appears in four forms — culpability, moral and public accountability, active responsibility — with organisational and legal causes too.",
  "Есть и обратный риск: поведение обучающейся машины никто не может предсказать, и возникает «разрыв ответственности», когда она не приписывается никому; позднейшие работы показывают четыре его формы — виновность, моральная и публичная подотчётность, активная ответственность — с организационными и правовыми причинами.",
  "也存在相反方向的风险：学习型机器的行为无人能预测，于是出现责任无法归于任何人的“责任空白”；后续研究指出这种空白表现为可谴责性、道德问责、公共问责与积极责任四类，并源于组织与法律原因。",
  "逆方向の危険もある。学習する機械の行動は誰にも予測できないため、責任が誰にも帰属しない「責任の空白」が生じ、後続研究はこの空白が非難可能性・道徳的説明責任・公的説明責任・能動的責任の4つで現れ、組織的・法的な原因からも生じると整理した。"]),
 s("D",[1,2,3],["두 위험은 동시에 일어날 수 있다: 법적·도덕적 책임은 현장의 개인에게 과잉 귀속되고(완충지대), 시스템을 설계·구매·배치한 결정의 책임은 증발한다(공백).",
  "Both risks can happen at once: legal and moral responsibility is over-attributed to the individual on the front line (crumple zone) while responsibility for the decisions to design, buy and deploy the system evaporates (gap).",
  "Оба риска могут реализоваться одновременно: правовая и моральная ответственность чрезмерно ложится на человека на передовой (зона деформации), а ответственность за решения о проектировании, покупке и внедрении системы испаряется (разрыв).",
  "两种风险可能同时发生：法律与道德责任被过度归于一线个人（吸能区），而设计、采购与部署系统之决定的责任则蒸发（空白）。",
  "2つの危険は同時に起こりうる。法的・道徳的責任は現場の個人に過剰に帰属し（衝撃吸収ゾーン）、システムを設計・購入・配置した決定の責任は蒸発する（空白）。"]),
 s("A",[34],["자동화 편향은 이 구조를 심리적으로 뒷받침한다: 문헌 검토에 따르면 편향은 초보자와 전문가 모두에게 나타나고 훈련이나 지시로 막을 수 없으며 팀의 결정에도 영향을 준다.",
  "Automation bias underpins this structure psychologically: a literature review finds it appears in novices and experts alike, cannot be prevented by training or instructions, and also affects team decisions.",
  "Психологически эту структуру поддерживает смещение в пользу автоматики: по обзору литературы, оно проявляется у новичков и экспертов, не предотвращается обучением или инструкциями и влияет и на командные решения.",
  "自动化偏差在心理上支撑了这一结构：文献综述显示，偏差在新手与专家身上都会出现，无法靠培训或指示防止，也影响团队决策。",
  "自動化バイアスがこの構造を心理的に支える。文献レビューによれば、バイアスは初心者にも専門家にも現れ、訓練や指示では防げず、チームの決定にも影響する。"]),
 s("A",[35],["영국 일반의 26명 실험에서 의사결정 지원 조언은 정답률을 50.38%에서 58.27%로 높였지만, 틀린 조언 때문에 맞는 처방을 틀리게 바꾼 경우도 전체의 5.2%였다.",
  "In an experiment with 26 UK general practitioners, decision-support advice raised accuracy from 50.38% to 58.27%, yet in 5.2% of all cases wrong advice led them to change a correct prescription to an incorrect one.",
  "В эксперименте с 26 британскими врачами общей практики подсказки системы повысили точность с 50,38% до 58,27%, но в 5,2% всех случаев ошибочная подсказка заставила сменить верное назначение на неверное.",
  "在26名英国全科医生的实验中，决策支持建议使正确率从50.38%升至58.27%，但也有占全部病例5.2%的情况因错误建议把正确处方改错。",
  "英国の一般医26人の実験で、意思決定支援の助言は正答率を50.38%から58.27%に高めたが、誤った助言のせいで正しい処方を誤りに変えた場合も全体の5.2%あった。"]),
 s("D",[35,1,36],["이 5.2%의 오류는 AI 없이는 생기지 않았을 오류인데도 서명한 사람의 실수로 기록되며, 사람들은 알고리즘의 실수를 사람의 같은 실수보다 더 가혹하게 보기 때문에 감독자는 'AI를 믿은 죄'와 'AI를 안 쓴 죄' 사이에 끼인다.",
  "Those 5.2% of errors would not have occurred without the AI, yet they are recorded as mistakes of the person who signed; and because people judge an algorithm's errors more harshly than a human's identical ones, overseers are caught between the 'sin' of trusting AI and the 'sin' of not using it.",
  "Эти 5,2% ошибок не возникли бы без ИИ, но записываются как промахи подписавшего; а поскольку ошибки алгоритма судят строже, чем такие же ошибки человека, надзирающий зажат между «грехом» доверия ИИ и «грехом» отказа от него.",
  "这5.2%的错误没有AI就不会发生，却被记为签字者的失误；而人们对算法错误比对人的同样错误更苛刻，监督者被夹在“信了AI之罪”与“没用AI之罪”之间。",
  "この5.2%の誤りはAIがなければ生じなかった誤りなのに署名した人の失敗として記録され、人はアルゴリズムの誤りを人の同じ誤りより厳しく見るので、監督者は「AIを信じた罪」と「AIを使わなかった罪」の間に挟まれる。"]),
 s("A",[38],["미국·영국·중국·싱가포르의 대표 표본 1,802명 실험에서, 개인화된 AI를 쓴 사람에게는 좋은 결과의 공을 더 주었지만 해로운 결과의 비난은 AI 종류와 관계없이 사용자에게 돌아갔다.",
  "In an experiment with representative samples of 1,802 people in the US, UK, China and Singapore, users of personalised AI received more credit for good outputs, but blame for harmful outputs fell on users regardless of the type of AI.",
  "В эксперименте на репрезентативных выборках 1 802 человек в США, Великобритании, Китае и Сингапуре пользователям персонализированного ИИ приписывали больше заслуг за хорошее, но вину за вредное возлагали на пользователя независимо от типа ИИ.",
  "在美、英、中、新加坡代表性样本1,802人的实验中，使用个性化AI者在好结果上获得更多功劳，但有害结果的指责不论AI类型都落到使用者身上。",
  "米・英・中・シンガポールの代表標本1,802人の実験で、個人化されたAIを使った人には良い結果の功績をより多く与えたが、有害な結果の非難はAIの種類に関係なく利用者に向かった。"]),
 s("A",[37],["반대로 AI에 사람 같은 마음이 있다고 지각할수록 AI를 더 비난하고 관련 회사 같은 인간 이해관계자는 덜 비난하는 경향도 실험으로 확인돼, 'AI가 정했다'는 해명이 책임을 흐리는 희생양 효과를 경고한다.",
  "Conversely, experiments show that the more people perceive a human-like mind in AI, the more they blame the AI and the less they blame human stakeholders such as the company — a warning about AI used as a scapegoat through claims that 'the AI decided'.",
  "И наоборот, эксперименты показывают: чем сильнее люди приписывают ИИ человекоподобный разум, тем больше винят ИИ и тем меньше — людей, например компанию; это предупреждение об использовании ИИ как козла отпущения («решил ИИ»).",
  "反之，实验也证实，人们越认为AI具有类人心智，就越责怪AI而越少责怪相关公司等人类利益相关者，这警示“AI决定的”说辞会造成替罪羊效应。",
  "反対に、AIに人のような心があると知覚するほどAIをより非難し、関与した会社のような人間の利害関係者はあまり非難しない傾向も実験で確認され、「AIが決めた」という弁明が責任をぼかすスケープゴート効果を警告する。"]),
 s("B",[39],["독일의 인사 결정 실험에서는 해고 같은 불쾌한 결정을 알고리즘에 맡기려는 경향이 관찰됐지만, 알고리즘 회피가 이를 압도해 '비난 회피를 위한 위임'은 조건부로만 나타났다.",
  "In a German HR experiment, a tendency to delegate unpleasant decisions such as dismissals to algorithms was observed, but algorithm aversion dominated, so delegation to avoid blame appeared only conditionally.",
  "В немецком эксперименте с кадровыми решениями наблюдалась склонность передавать алгоритму неприятные решения вроде увольнений, но неприятие алгоритмов перевешивало, и делегирование ради избегания вины проявлялось лишь при условиях.",
  "在德国的人事决定实验中，观察到把解雇等不愉快决定交给算法的倾向，但算法厌恶压倒了它，“为回避指责而委托”只在特定条件下出现。",
  "ドイツの人事決定の実験では解雇のような不快な決定をアルゴリズムに任せる傾向が見られたが、アルゴリズム回避がそれを上回り、「非難回避のための委任」は条件付きでしか現れなかった。"]),
 s("B",[40],["2018년 우버 자율주행 시험차 사고에서 NTSB는 추정 원인을 휴대전화에 시선을 빼앗긴 안전 운전자의 감시 실패로 봤지만, 시스템이 충돌 5.6초 전에 보행자를 감지하고도 설계상 비상제동을 하지 않고 운전자에게 의존했다는 점, 회사의 '부적절한 안전 문화'와 주 교통부의 감독 부족을 기여 요인으로 함께 적었다.",
  "In the 2018 Uber test-vehicle crash, the NTSB found the probable cause to be the phone-distracted safety operator's failure to monitor, but also recorded that the system detected the pedestrian 5.6 seconds before impact yet by design did not brake and relied on the operator, and listed the company's 'inadequate safety culture' and the state transport department's insufficient oversight as contributing factors.",
  "В аварии тестового автомобиля Uber в 2018 г. NTSB назвал вероятной причиной недосмотр отвлечённого телефоном оператора, но отметил, что система обнаружила пешехода за 5,6 с до удара, однако по конструкции не тормозила, полагаясь на оператора, и указал «неадекватную культуру безопасности» компании и недостаточный надзор транспортного ведомства штата как сопутствующие факторы.",
  "在2018年优步测试车事故中，NTSB把可能原因认定为因手机分心的安全驾驶员监视失败，但同时记录系统在撞击前5.6秒就检测到行人、却按设计不进行紧急制动而依赖驾驶员，并把公司“不当的安全文化”与州交通部监管不足列为促成因素。",
  "2018年のウーバー試験車の事故で、NTSBは推定原因を携帯電話に気を取られた安全運転者の監視の失敗としたが、システムが衝突5.6秒前に歩行者を検知しながら設計上緊急ブレーキをかけず運転者に頼った点、会社の「不適切な安全文化」と州交通局の監督不足も寄与要因として併記した。"]),
 s("B",[41,42],["영국 호라이즌 사건에서는 회계 시스템의 결함이 수백 명 운영자의 절도·사기 혐의로 바뀌었고, 조사 1권은 가족에 따르면 '허상의 부족분' 때문에 13명이 목숨을 끊었다고 기록했으며, 호주 로보데트 왕립위원회는 자동화 결정의 이의 경로·알고리즘 공개·감사 기구와 현장 직원 협의를 권고했다.",
  "In the UK Horizon case, accounting-system faults became theft and fraud accusations against hundreds of operators; Volume 1 of the inquiry records that, according to families, 13 people took their own lives because of illusory shortfalls; Australia's Robodebt royal commission recommended review paths, published algorithms and an audit body for automated decisions, and consultation with frontline staff.",
  "В британском деле Horizon сбои учётной системы превратились в обвинения сотен операторов в краже и мошенничестве; первый том расследования фиксирует, что, по словам семей, 13 человек покончили с собой из-за мнимых недостач; королевская комиссия по «Рободолгу» рекомендовала пути обжалования, раскрытие алгоритмов, орган аудита и консультации с сотрудниками.",
  "在英国Horizon事件中，会计系统缺陷变成对数百名经营者的盗窃与欺诈指控，调查第一卷记录据家属称有13人因“虚假短缺”轻生；澳大利亚“机器人追债”皇家委员会建议为自动化决定设立申诉途径、公开算法、设立审计机构并与一线员工协商。",
  "英国のホライズン事件では会計システムの欠陥が数百人の運営者の窃盗・詐欺の容疑に変わり、調査の第1巻は家族によれば「見かけの不足額」のために13人が命を絶ったと記録し、豪州のロボデット王立委員会は自動化された決定の異議の経路・アルゴリズムの公開・監査機関と現場職員との協議を勧告した。"]),
 s("B",[41],["호라이즌 조사 1권은 또 최소 59명이 호라이즌이나 우체국과의 경험 때문에 자살을 생각했고 그중 10명이 시도했다고 기록했으며, 이는 기소된 사람과 기소되지 않은 사람 모두에게서 나타났다.",
  "Volume 1 of the Horizon inquiry also records that at least 59 people contemplated suicide because of their experiences with Horizon or the Post Office and ten attempted it — among both those prosecuted and those not.",
  "Первый том расследования Horizon также фиксирует, что не менее 59 человек думали о самоубийстве из-за Horizon или почты, и 10 пытались, — как среди обвинённых, так и среди не обвинённых.",
  "Horizon调查第一卷还记录，至少59人因与Horizon或邮局的经历而想过自杀，其中10人尝试过，这在被起诉者与未被起诉者中都有出现。",
  "ホライズン調査の第1巻はまた、少なくとも59人がホライズンや郵便局との経験のために自殺を考え、うち10人が試みたと記録し、これは起訴された人にもされなかった人にも見られた。"]),
 s("D",[40,41,42,1],["세 사건의 공통점은 '추정 원인'이나 처벌은 가장 가까운 개인에게 향했지만, 조사가 깊어질수록 원인은 설계·조직 문화·감독·정책 결정 쪽으로 옮겨 갔다는 점이며, 이는 사후 조사 없이 내려지는 직장의 '책임' 판단이 얼마나 얕을 수 있는지 보여 준다.",
  "What the three cases share is that probable cause or punishment pointed at the nearest individual, but the deeper the inquiry went, the more the causes shifted to design, organisational culture, oversight and policy decisions — showing how shallow workplace judgements of 'responsibility' can be when made without inquiry.",
  "Общее у трёх дел: вероятная причина или наказание указывали на ближайшего человека, но чем глубже шло расследование, тем больше причины смещались к проектированию, культуре организации, надзору и политическим решениям — это показывает, насколько поверхностны суждения об «ответственности» на работе без расследования.",
  "三起事件的共同点是：“可能原因”或处罚指向最近的个人，但调查越深入，原因越向设计、组织文化、监管与政策决定转移，这显示没有事后调查的职场“责任”判断可能多么肤浅。",
  "3つの事件の共通点は、「推定原因」や処罰は最も近い個人に向かったが、調査が深まるほど原因が設計・組織文化・監督・政策決定の側に移ったことで、事後調査なしに下される職場の「責任」判断がいかに浅くなりうるかを示す。"]),
 s("B",[57],["반대 방향의 판단도 있다: 캐나다 브리티시컬럼비아주 민사분쟁심판소는 2024년, 항공사 웹사이트 챗봇이 유족 할인 운임을 잘못 안내한 사건에서 챗봇이 스스로 책임지는 별개의 실체라는 취지의 항공사 주장을 '놀라운 주장'이라며 물리치고, 회사가 웹사이트의 모든 정보에 책임진다며 650.88캐나다달러 배상을 명했다.",
  "There are rulings in the other direction: in 2024 British Columbia's Civil Resolution Tribunal, in a case where an airline's website chatbot misstated a bereavement-fare policy, rejected as 'remarkable' the airline's suggestion that the chatbot was a separate entity responsible for its own actions, held that the company is responsible for all information on its website and awarded C$650.88.",
  "Есть и решения в обратную сторону: в 2024 г. Трибунал гражданских споров Британской Колумбии по делу, где чат-бот на сайте авиакомпании неверно изложил правила льготного тарифа по случаю утраты, отверг как «примечательное» предположение авиакомпании, что чат-бот — отдельная сущность, отвечающая за свои действия, признал компанию ответственной за всю информацию на сайте и присудил 650,88 канадского доллара.",
  "也有方向相反的裁决：2024年，加拿大不列颠哥伦比亚省民事纠纷审裁处在航空公司网站聊天机器人错误说明丧亲优惠票价政策的案件中，驳回了航空公司“聊天机器人是对自身行为负责的独立实体”的说法，称之为“令人吃惊的主张”，认定公司对其网站上的所有信息负责，并判赔650.88加元。",
  "逆方向の判断もある。カナダ・ブリティッシュコロンビア州の民事紛争審判所は2024年、航空会社のウェブサイトのチャットボットが忌引運賃の規定を誤って案内した事件で、チャットボットが自らの行為に責任を負う別個の存在だとする趣旨の航空会社の主張を「驚くべき主張」として退け、会社はウェブサイト上のすべての情報に責任を負うとして650.88カナダドルの賠償を命じた。"]),
 s("D",[57,58,1],["이 결정은 '책임 싱크'에 대한 법의 답이 의외로 단순할 수 있음을 보여 준다: AI를 배치한 조직이 그 출력에 책임지며, 그 책임을 화면 앞의 직원이나 'AI 자신'에게 떠넘길 수 없다.",
  "The decision shows that the law's answer to the accountability sink can be surprisingly simple: the organisation that deploys AI answers for its output and cannot pass that responsibility to the employee at the screen or to 'the AI itself'.",
  "Решение показывает, что ответ права на «поглотитель ответственности» может быть неожиданно простым: организация, развернувшая ИИ, отвечает за его вывод и не может переложить эту ответственность ни на сотрудника у экрана, ни на «сам ИИ».",
  "这一决定表明，法律对“责任黑洞”的回答可以出人意料地简单：部署AI的组织要为其输出负责，不能把这一责任推给屏幕前的员工或“AI本身”。",
  "この決定は「責任の吸い込み口」に対する法の答えが意外に単純でありうることを示す。AIを導入した組織がその出力に責任を負い、その責任を画面の前の従業員や「AI自身」に押しつけることはできない。"])

 s("A",[1],["통제권이 제한된 사람이 시스템 대신 책임을 떠안는 구조를 '도덕적 완충지대'라 한다.","The structure in which someone with limited control absorbs responsibility for the system is called a 'moral crumple zone'.","Структура, где человек с ограниченным контролем принимает ответственность за систему, называется «зоной моральной деформации».","控制权有限的人代替系统承担责任的结构被称为“道德吸能区”。","統制権の限られた人がシステムの代わりに責任を負う構造を「道徳的衝撃吸収ゾーン」という。"]),

SEC("algo",["현재 ⑤: 알고리즘 관리와 평가 — 나라별 '사람의 감독'과 책임 규칙","Now ⑤: Algorithmic Management and Evaluation — Human Oversight and Accountability Rules by Country","Сейчас ⑤: алгоритмическое управление и оценка — правила надзора и ответственности по странам","现状⑤：算法管理与评价——各国“人的监督”与责任规则","現在⑤：アルゴリズム管理と評価——国別の「人の監督」と責任の規則"],
[P(
 s("B",[55],["OECD의 6개국 6천여 기업 조사에 따르면 업무 배분·감시·평가를 자동화하는 알고리즘 관리 도구는 대부분 나라에서 이미 흔하고, 관리자들은 결정의 질이 좋아졌다고 느끼면서도 '불분명한 책임'과 도구 논리를 따라가기 어려움을 우려한다.",
  "According to an OECD survey of over 6,000 firms in six countries, algorithmic-management tools that automate task allocation, monitoring and evaluation are already common in most countries, and managers feel decisions have improved yet worry about unclear accountability and difficulty following the tools' logic.",
  "По опросу ОЭСР более 6000 фирм в шести странах, инструменты алгоритмического управления, автоматизирующие распределение задач, мониторинг и оценку, уже распространены в большинстве стран; менеджеры считают, что решения улучшились, но тревожатся о неясной подотчётности и непрозрачной логике.",
  "据经合组织对6国6000余家企业的调查，自动化任务分配、监控与评价的算法管理工具在多数国家已很普遍，管理者感到决策质量提高，同时担忧“责任不清”与难以理解工具逻辑。",
  "OECDの6か国6千社超の調査によれば、業務配分・監視・評価を自動化するアルゴリズム管理のツールはほとんどの国ですでに一般的で、管理者は決定の質が良くなったと感じつつ「不明確な責任」とツールの論理を追いにくいことを懸念する。"]),
 s("B",[44,56],["EU AI법은 고용 관련 고위험 AI에 대해 감독자가 자동화 편향 가능성을 인식하고 출력을 무시·번복하거나 시스템을 멈출 수 있게 설계하도록 하고, 배치자는 역량·훈련·권한과 지원을 갖춘 사람에게 감독을 맡기도록 했는데, 2026년 7월 개정으로 고용 등 부속서 III 분야에서 이 의무들의 적용은 2027년 12월 2일로 미뤄졌다.",
  "The EU AI Act requires high-risk AI, including employment uses, to be designed so overseers are aware of possible automation bias and can disregard, override or reverse outputs or stop the system, and requires deployers to assign oversight to people with the necessary competence, training, authority and support — though a July 2026 amendment postponed these duties for Annex III areas such as employment to 2 December 2027.",
  "Закон ЕС об ИИ требует, чтобы высокорисковый ИИ, в том числе в занятости, позволял надзирающим осознавать возможное смещение в пользу автоматики, игнорировать или отменять результаты и останавливать систему, а эксплуатанты поручали надзор людям с компетенцией, подготовкой, полномочиями и поддержкой; поправка июля 2026 г. перенесла эти обязанности для сфер приложения III, включая занятость, на 2 декабря 2027 г.",
  "欧盟AI法要求包括雇佣用途在内的高风险AI在设计上使监督者意识到自动化偏差的可能，并能无视、推翻输出或停止系统；部署者须把监督交给具备能力、培训、权限与支持的人；但2026年7月的修订把就业等附件III领域这些义务的适用推迟至2027年12月2日。",
  "EU AI法は雇用関連を含む高リスクAIについて、監督者が自動化バイアスの可能性を認識し、出力を無視・覆したりシステムを止めたりできるよう設計させ、導入者は能力・訓練・権限と支援を備えた人に監督を任せるよう定めたが、2026年7月の改正で雇用など附属書III分野でのこれらの義務の適用は2027年12月2日に延期された。"]),
 s("B",[45],["EU 플랫폼노동지침은 한 걸음 더 나아가, 자동 결정을 뒤집을 권한을 가진 감독자가 그 기능을 행사했다는 이유로 해고·징계 등 불이익을 받지 않도록 보호하고, 노동자에게 설명과 서면 사유를 보장한다(이행 기한 2026년 12월 2일).",
  "The EU Platform Work Directive goes further, protecting overseers with authority to override automated decisions from dismissal, discipline and other adverse treatment for exercising that function, and guaranteeing workers explanations and written reasons (transposition deadline 2 December 2026).",
  "Директива ЕС о платформенном труде идёт дальше: защищает надзирающих с правом отменять автоматические решения от увольнения, дисциплинарных мер и иного ущерба за выполнение этой функции и гарантирует работникам объяснения и письменные причины (срок транспонирования — 2 декабря 2026 г.).",
  "欧盟平台劳动指令更进一步：保护有权推翻自动决定的监督者，使其不因行使该职能而遭解雇、纪律处分等不利对待，并保障劳动者获得解释与书面理由（转化期限2026年12月2日）。",
  "EUプラットフォーム労働指令はさらに一歩進み、自動決定を覆す権限を持つ監督者がその機能を行使したことを理由に解雇・懲戒などの不利益を受けないよう保護し、労働者に説明と書面の理由を保障する（国内法化期限2026年12月2日）。"]),
 s("B",[46,47],["배상 쪽에서는 개정 제조물책임지침이 소프트웨어를 '제조물'에 포함했지만(이행 기한 2026년 12월 9일), AI 피해의 인과관계 추정을 담은 AI 책임지침안은 2025년 10월 철회돼 민사 책임 규칙에는 빈자리가 남았다.",
  "On liability, the revised Product Liability Directive includes software in 'product' (transposition deadline 9 December 2026), but the proposed AI Liability Directive with its presumption of causation was withdrawn in October 2025, leaving a gap in civil-liability rules.",
  "В части возмещения обновлённая директива об ответственности за продукцию включила ПО в понятие «продукт» (срок — 9 декабря 2026 г.), но проект директивы об ответственности за ИИ с презумпцией причинной связи отозван в октябре 2025 г., оставив пробел.",
  "在赔偿方面，修订后的产品责任指令把软件纳入“产品”（转化期限2026年12月9日），但含因果推定的AI责任指令草案已于2025年10月撤回，民事责任规则留下空缺。",
  "賠償の面では改正製造物責任指令がソフトウェアを「製造物」に含めたが（国内法化期限2026年12月9日）、AIによる被害の因果関係の推定を盛り込んだAI責任指令案は2025年10月に撤回され、民事責任の規則に空白が残った。"]),
 s("B",[48],["영국은 2025년 데이터법으로 '의미 있는 사람의 관여'가 없는 결정을 자동 결정으로 정의하고, 정보 제공·의견 진술·사람의 개입·이의 제기라는 안전장치를 요구했다.",
  "The UK's 2025 data act defines automated decisions as those with no meaningful human involvement and requires safeguards: information, representations, human intervention and the right to contest.",
  "Закон Великобритании о данных 2025 г. определяет автоматические решения как принятые без значимого участия человека и требует гарантий: информирования, права высказаться, вмешательства человека и оспаривания.",
  "英国2025年数据法把没有“有意义的人类参与”的决定定义为自动决定，并要求提供信息、陈述意见、人类干预与提出异议等保障。",
  "英国は2025年のデータ法で「意味のある人の関与」がない決定を自動決定と定義し、情報提供・意見陳述・人の介入・異議申し立てという安全装置を求めた。"]),
 s("B",[49,50,51],["미국은 연방 차원에서는 자발적 위험관리 체계에 머물지만, 콜로라도주는 고용 등 중대한 결정에 쓰이는 고위험 AI의 배치자에게 영향평가와 사람의 검토를 통한 이의 기회를 의무로 정했고, 뉴욕시는 채용 도구에 연 1회 편향 감사와 공개를 요구한다.",
  "The US stays with a voluntary risk framework at federal level, but Colorado requires deployers of high-risk AI in consequential decisions such as employment to do impact assessments and offer appeals with human review, and New York City requires annual bias audits and disclosure for hiring tools.",
  "США на федеральном уровне ограничиваются добровольной рамкой, но Колорадо обязывает эксплуатантов высокорискового ИИ в значимых решениях, включая занятость, оценивать воздействие и давать возможность обжалования с проверкой человеком, а Нью-Йорк требует ежегодного аудита предвзятости и раскрытия для инструментов найма.",
  "美国在联邦层面停留于自愿性风险框架，但科罗拉多州要求在雇佣等重大决定中使用高风险AI的部署者进行影响评估并提供人工复核的申诉机会，纽约市要求招聘工具每年接受偏差审计并公开。",
  "米国は連邦レベルでは自主的なリスク管理の枠組みにとどまるが、コロラド州は雇用など重大な決定に使う高リスクAIの導入者に影響評価と人の審査による異議の機会を義務づけ、ニューヨーク市は採用ツールに年1回のバイアス監査と公開を求める。"]),
 s("B",[52],["한국 AI 기본법(2026년 1월 22일 시행)은 채용처럼 개인의 권리·의무에 중대한 영향을 주는 판단을 고영향 AI로 정하고 사람의 관리·감독과 설명 방안을 의무화했지만, 영향평가는 노력 의무이고 감독자의 권한·보호 조항은 없다.",
  "Korea's AI Basic Act (in force 22 January 2026) defines judgements that significantly affect individuals' rights, such as hiring, as high-impact AI and mandates human management and oversight and explanation measures, but impact assessment is best-effort and there are no provisions on overseers' authority or protection.",
  "Базовый закон Кореи об ИИ (в силе с 22 января 2026 г.) относит к ИИ высокого воздействия решения, существенно влияющие на права людей, например при найме, и требует человеческого надзора и мер объяснения, но оценка воздействия — лишь «стремление», а норм о полномочиях и защите надзирающих нет.",
  "韩国AI基本法（2026年1月22日施行）把招聘等对个人权利义务有重大影响的判断定为高影响AI，并规定人的管理监督与说明方案为义务，但影响评估只是努力义务，也没有关于监督者权限与保护的条款。",
  "韓国のAI基本法（2026年1月22日施行）は採用のように個人の権利・義務に重大な影響を与える判断を高影響AIと定め、人の管理・監督と説明方策を義務化したが、影響評価は努力義務で、監督者の権限・保護の条項はない。"]),
 s("B",[52],["이 법의 과태료(3천만 원 이하)는 고지 의무, 국내대리인 지정, 중지·시정명령 위반에만 붙고, 고영향 AI 책무 자체의 위반에는 직접 붙지 않는다.",
  "The act's fines (up to KRW 30 million) apply only to breaches of notice duties, local-representative designation and suspension or correction orders, not directly to breaches of the high-impact AI duties themselves.",

  "What Dan Davies, drawing on management cybernetics, calls an 'accountability sink' — a structure in which decisions are absorbed into rules and systems so no one can be asked to account for them — becomes easier with AI; 'because of AI' erases the responsibility of those who decided and leaves the weight only on those who bear the consequences.",
  "То, что Дэн Дэвис, опираясь на управленческую кибернетику, называет «поглотителем ответственности» — структура, где решения растворяются в правилах и системах и спросить не с кого, — с ИИ возникает легче; объяснение «из-за ИИ» стирает ответственность принявших решение и оставляет тяжесть лишь тем, кто несёт последствия.",
  "戴维斯借管理控制论命名的“责任黑洞”——决定被规则与系统吸收、无从要求任何人解释的结构——因AI而更易形成，“因为AI”的说法抹去了决策者的责任，只把重量留给承受后果的人。",
  "デイヴィスが経営サイバネティクスを借りて名づけた「責任の吸い込み口（アカウンタビリティ・シンク）」——決定が規則・システムに吸収され誰にも説明を求められない構造——はAIでより容易になり、「AIのせい」という説明は決定した人の責任を消し、結果を負う人にだけ重みを残す。"],
  ["'책임 싱크'는 데이비스의 단행본(근거 58)에서 널리 쓰인 개념이며, 이 보고서는 출판사 소개 페이지만 확인해 개념의 이름과 대략의 뜻에만 쓴다.","'Accountability sink' is a concept popularised in Dan Davies's book (evidence 58); this report verified only the publisher's page and uses it only for the term and its rough meaning.","«Поглотитель ответственности» — понятие из книги Дэна Дэвиса (источник 58); проверена лишь страница издательства, понятие используется только как название и в общем смысле.","“责任黑洞”是经戴维斯著作（依据58）普及的概念，本报告只核实了出版社介绍页，仅用于概念名称与大意。","「責任の吸い込み口」はデイヴィスの単行本（根拠58）で広まった概念で、本報告は出版社の紹介ページだけを確認し、概念の名前と大まかな意味にだけ使う。"],"M")
),

P(
 s("D",[5,7],["도덕적 운의 문제는 우리가 실제로는 결과로 사람을 판단하면서도 원칙적으로는 통제 밖의 일로 비난해서는 안 된다고 믿는 모순을 드러내며, 직장의 결과 평가는 이 모순을 제도화한 것일 수 있다.",
  "The problem of moral luck exposes a contradiction: we judge people by outcomes in practice while believing in principle that they should not be blamed for what is beyond their control; outcome-based workplace evaluation may institutionalise that contradiction.",
  "Проблема моральной удачи обнажает противоречие: на практике мы судим людей по исходам, хотя в принципе считаем, что нельзя винить за неподконтрольное; оценка работы по результату может институционализировать это противоречие.",
  "道德运气问题揭示了一个矛盾：我们实际上以结果评判人，原则上却相信不应因无法控制之事而责备他人；职场的结果评价可能正是把这一矛盾制度化。",
  "道徳的運の問題は、私たちが実際には結果で人を判断しながら原則的には統制外のことで非難すべきでないと信じる矛盾を明らかにし、職場の結果評価はこの矛盾を制度化したものでありうる。"]),
 s("D",[6,4],["많은 손의 문제와 사회적 연결 모델은 '누구 탓인가'라는 과거형 질문에서 '이 구조에 관여한 우리는 앞으로 무엇을 바꿀 것인가'라는 미래형 질문으로 옮겨 가라고 요구한다.",
  "The problem of many hands and the social connection model ask us to move from the backward-looking question 'whose fault is it?' to the forward-looking question 'what will those of us involved in this structure change from now on?'.",
  "Проблема многих рук и модель социальной связи призывают перейти от обращённого в прошлое вопроса «кто виноват?» к вопросу о будущем: «что мы, участники этой структуры, изменим дальше?».",
  "多手问题与社会连接模型要求我们从“是谁的错”这一面向过去的问题，转向“参与此结构的我们今后要改变什么”这一面向未来的问题。",
  "多くの手の問題と社会的つながりモデルは、「誰のせいか」という過去形の問いから「この構造に関わった私たちはこれから何を変えるか」という未来形の問いに移るよう求める。"]),
 s("D",[3,4,1],["이 관점에서 AI의 역할은 판단을 대신하는 것이 아니라, 누가 무엇을 언제 알았고 무엇을 통제할 수 있었는지를 기록해 책임의 해상도를 높이는 '증언자'가 되는 것이어야 한다—다만 그 기록을 누가 쓰느냐에 따라 증언은 고발장으로도 바뀔 수 있다.",
  "From this perspective, AI's role should not be to replace judgement but to be a 'witness' that raises the resolution of responsibility by recording who knew what, when, and what they could control — though, depending on who uses the record, testimony can also become an indictment.",
  "С этой точки зрения роль ИИ — не заменять суждение, а быть «свидетелем», повышающим «разрешение» ответственности, фиксируя, кто что и когда знал и что мог контролировать; однако в зависимости от того, кто пользуется записью, показания могут стать обвинением.",
  "从这一视角看，AI的角色不应是替代判断，而应成为记录“谁在何时知道什么、能控制什么”、从而提高责任分辨率的“证人”——但取决于谁使用这些记录，证词也可能变成起诉书。",
  "この観点でAIの役割は判断を代わることではなく、誰がいつ何を知り何を統制できたかを記録して責任の解像度を高める「証人」になることであるべきだ——ただし、その記録を誰が使うかによって証言は告発状にも変わりうる。"])

 s("D",[21,8,3],["공정 문화는 정직한 오류와 무모함을 구분하는 해상도 높은 책임 체계다.","Just culture is a high-resolution accountability system that separates honest error from recklessness.","Справедливая культура — система высокого «разрешения», отделяющая честную ошибку от безрассудства.","公正文化是区分诚实错误与鲁莽的高分辨率问责体系。","公正な文化は正直な誤りと無謀を区別する解像度の高い責任の体系である。"])

SEC("compare",["국가·지역 비교: 한국·일본·미국·유럽(EU·영국)·러시아","Country and Regional Comparison: Korea, Japan, US, Europe (EU, UK), Russia","Сравнение стран и регионов: Корея, Япония, США, Европа (ЕС, Великобритания), Россия","国家与地区比较：韩国、日本、美国、欧洲（欧盟、英国）、俄罗斯","国・地域比較：韓国・日本・米国・欧州（EU・英国）・ロシア"],
[P(
 s("D",[44,45,48],["유럽은 '사람의 감독'에 권한과 보호를 붙이는 방향으로 가장 멀리 갔다: 감독자의 역량·권한 요건(AI법), 감독자의 불이익 금지(플랫폼노동지침), '의미 있는 관여' 기준(영국)이 모두 법에 들어갔다.",
  "Europe has gone furthest in attaching authority and protection to human oversight: competence and authority requirements for overseers (AI Act), a ban on reprisals against overseers (Platform Work Directive) and a 'meaningful involvement' standard (UK) are all in law.",
  "Европа дальше всех продвинулась в наделении «человеческого надзора» полномочиями и защитой: требования к компетенции и полномочиям (Закон об ИИ), запрет наказания надзирающих (директива о платформенном труде) и стандарт «значимого участия» (Великобритания) закреплены в законах.",
  "欧洲在为“人的监督”配上权限与保护方面走得最远：监督者能力与权限要求（AI法）、禁止对监督者不利对待（平台劳动指令）、“有意义的参与”标准（英国）都已入法。",
  "欧州は「人の監督」に権限と保護をつける方向で最も遠くまで進んだ。監督者の能力・権限の要件（AI法）、監督者への不利益の禁止（プラットフォーム労働指令）、「意味のある関与」の基準（英国）がすべて法に入った。"]),
 s("D",[52,22,29,31],["한국은 AI 활용률이 가장 빠르게 오르는 나라 가운데 하나이며, 고영향 AI의 사람 감독 의무와 공공 소프트웨어의 과업 변경 심의라는 고유한 제도를 갖췄지만, 감독자의 권한·보호와 민간 프로젝트의 변경 책임 분리는 비어 있다.",
  "Korea is among the countries where AI use is rising fastest and has distinctive institutions — a human-oversight duty for high-impact AI and scope-change deliberation in public software — but overseers' authority and protection and the separation of change responsibility in private projects remain empty.",
  "Корея — среди стран с самым быстрым ростом использования ИИ и обладает своеобразными институтами — обязанностью человеческого надзора за ИИ высокого воздействия и рассмотрением изменений задания в госпроектах ПО, — но полномочия и защита надзирающих и разделение ответственности за изменения в частных проектах не урегулированы.",
  "韩国是AI使用率上升最快的国家之一，拥有高影响AI人的监督义务与公共软件任务变更审议等独特制度，但监督者的权限与保护、民间项目中变更责任的分离仍是空白。",
  "韓国はAI活用率が最も速く上がる国の一つで、高影響AIの人の監督義務と公共ソフトウェアの課業変更審議という独自の制度を備えたが、監督者の権限・保護と民間プロジェクトの変更責任の切り分けは空白である。"]),
 s("D",[53,14,11],["일본은 AI 법제를 진흥 중심으로 두고, 책임 문제를 괴롭힘 방지와 산재 인정 같은 노동 안전 제도로 다룬다: 업무량 변화가 산재 원인으로 집계되는 점은 강점이지만, AI 감독자에 대한 규칙은 아직 없다.",
  "Japan keeps AI law promotion-oriented and handles responsibility through labour-safety systems such as harassment prevention and compensation recognition: counting workload change as a cause of injury is a strength, but there are no rules yet on AI overseers.",
  "Япония оставляет законодательство об ИИ ориентированным на продвижение и решает вопросы ответственности через системы охраны труда — профилактику притеснений и признание профзаболеваний: учёт изменения нагрузки как причины — сильная сторона, но правил о надзирающих за ИИ пока нет.",
  "日本把AI法制定位为促进型，以防止骚扰与工伤认定等劳动安全制度处理责任问题：把工作量变化计为工伤原因是优点，但尚无关于AI监督者的规则。",
  "日本はAI法制を推進中心に置き、責任の問題をハラスメント防止と労災認定のような労働安全の制度で扱う。業務量の変化が労災原因として集計される点は強みだが、AIの監督者に関する規則はまだない。"]),
 s("D",[49,50,51,25],["미국은 연방 차원의 구속력 있는 규칙 없이 주·도시 단위로 배치자 의무와 편향 감사를 쌓고 있으며, AI 생산성 연구가 가장 활발해 체감-실측 격차 같은 근거가 가장 먼저 나오는 곳이기도 하다.",
  "The US is building deployer duties and bias audits at state and city level without binding federal rules, and as the hub of AI-productivity research it is also where evidence such as the perception–measurement gap emerges first.",
  "США без обязательных федеральных правил наращивают обязанности эксплуатантов и аудиты предвзятости на уровне штатов и городов; как центр исследований производительности ИИ, именно там первыми появляются данные вроде разрыва ощущений и измерений.",
  "美国在缺乏联邦层面约束性规则的情况下，以州与城市为单位累积部署者义务与偏差审计；作为AI生产率研究最活跃之地，体感—实测差距等依据也最先在此出现。",
  "米国は連邦レベルの拘束力ある規則なしに州・都市単位で導入者の義務とバイアス監査を積み上げており、AI生産性の研究が最も盛んで、体感と実測の差のような根拠が最初に出る場所でもある。"]),
 s("D",[54,33],["러시아는 AI 피해 책임을 실험적 법제도 안의 의무보험으로 다루고 조직의 AI 사용은 아직 낮지만, 이번 조사에서는 직무 스트레스·번아웃의 공식 통계나 노동 현장의 AI 책임 규칙을 확인하지 못해 비교의 신뢰도가 가장 낮다.",
  "Russia handles AI-harm liability through mandatory insurance within experimental legal regimes and organisational AI use is still low, but this research found no official statistics on job stress or burn-out nor workplace AI-responsibility rules, so the comparison is least reliable here.",
  "Россия решает ответственность за вред от ИИ через обязательное страхование в экспериментальных режимах, а использование ИИ организациями пока низкое; однако официальной статистики стресса и выгорания и правил ответственности за ИИ на рабочем месте найти не удалось, поэтому сравнение здесь наименее надёжно.",
  "俄罗斯以实验性法律制度内的强制保险处理AI损害责任，组织的AI使用仍低；但本次调查未能找到工作压力与倦怠的官方统计或劳动现场的AI责任规则，因此比较的可信度最低。",
  "ロシアはAIによる被害の責任を実験的法制度の中の義務保険で扱い、組織のAI使用はまだ低いが、今回の調査では職務ストレス・バーンアウトの公式統計や職場のAI責任規則を確認できず、比較の信頼度が最も低い。"]),
 s("B",[55],["국가 간 알고리즘 관리 실태를 같은 방식으로 잰 OECD 기업 조사는 프랑스·독일·이탈리아·일본·스페인·미국 6개국만 다뤄, 한국과 러시아는 같은 기준의 비교 자료가 없다.",
  "The OECD firm survey that measured algorithmic management the same way across countries covered only France, Germany, Italy, Japan, Spain and the US, so Korea and Russia lack comparable data on the same basis.",
  "Опрос фирм ОЭСР, одинаково измеривший алгоритмическое управление в разных странах, охватил лишь Францию, Германию, Италию, Японию, Испанию и США, поэтому сопоставимых данных по Корее и России нет.",
  "以相同方式测量各国算法管理状况的经合组织企业调查只涵盖法、德、意、日、西、美6国，韩国与俄罗斯缺乏同一标准的比较资料。",
  "国ごとのアルゴリズム管理の実態を同じ方法で測ったOECDの企業調査はフランス・ドイツ・イタリア・日本・スペイン・米国の6か国だけを扱い、韓国とロシアには同じ基準の比較資料がない。"])

 s("D",[],["8장의 '논평'과 '결론'은 모두 D 등급인 Claude의 판단이며, Claude를 만든 회사가 AI를 판매한다는 이해관계를 본문과 주석에 밝혔다; 철학 원전과 회칙은 사실의 근거가 아니라 각 입장의 내용을 정확히 옮기기 위한 1차 자료로만 썼다.",

 s("D",[62,59],["논평: 약점은 역사에서의 작동 방식이다: 베버가 보여 주듯 소명의 언어는 '사람을 위한 일'보다 '사람을 일에 맞추는 규율'로 더 자주 쓰였고, 회칙의 원칙에는 그것을 강제할 장치가 없다.",
  "Commentary: its weakness is how it has worked in history: as Weber shows, the language of vocation has more often served as discipline fitting people to work than as 'work for people', and the encyclical's principle has no mechanism to enforce it.",
  "Комментарий: слабость — в том, как позиция работала в истории: как показывает Вебер, язык призвания чаще служил дисциплиной, подгоняющей людей под работу, чем «трудом для человека», а у принципа энциклики нет механизма принуждения.",
  "评论：其弱点在于它在历史中的运作方式：正如韦伯所示，召命的语言更常被用作“让人适应工作”的规训，而非“为人的工作”，而通谕的原则并没有强制执行的机制。",
  "論評：弱点は歴史の中での働き方である。ヴェーバーが示すように、召命の言葉は「人のための仕事」よりも「人を仕事に合わせる規律」としてより頻繁に使われ、回勅の原則にはそれを強制する仕組みがない。"])

P(
 s("B",[63],["마르크스는 1844년 초고에서 소외된 노동을 노동이 노동자에게 '외적인' 것, 곧 일 속에서 자신을 긍정하지 못하고 부정하며 만족 대신 불행을 느끼는 상태로 정의했다.",
  "In the 1844 manuscripts Marx defined estranged labour as labour external to the worker — work in which one does not affirm but denies oneself and feels unhappy rather than content.",
  "В рукописях 1844 г. Маркс определил отчуждённый труд как внешний для рабочего: в нём человек не утверждает, а отрицает себя и чувствует себя несчастным, а не довольным.",
  "马克思在1844年手稿中把异化劳动定义为对劳动者而言“外在的”劳动：人在其中不是肯定而是否定自己，感到不幸而非满足。",
  "マルクスは1844年の草稿で、疎外された労働を労働が労働者にとって「外的」なもの、すなわち仕事の中で自分を肯定できず否定し、満足ではなく不幸を感じる状態と定義した。"]),
 s("B",[64],["그러나 『자본』 3권에서 그는 진정한 자유의 영역은 필요와 외적 목적에 따른 노동이 끝나는 곳에서야 시작되며, 노동일의 단축이 그 기본 전제라고 썼다.",
  "Yet in Capital, Volume III, he wrote that the true realm of freedom begins only where labour determined by necessity and external purpose ends, and that shortening the working day is its basic prerequisite.",
  "Однако в III томе «Капитала» он писал, что подлинное царство свободы начинается лишь там, где прекращается труд, диктуемый нуждой и внешней целесообразностью, и что сокращение рабочего дня — его основное условие.",
  "但在《资本论》第三卷中，他写道：真正的自由王国只是在由必需和外在目的规定的劳动终止的地方才开始，而工作日的缩短是其根本条件。",
  "しかし『資本論』第3巻で彼は、真の自由の国は必要と外的な目的に規定された労働が終わるところで初めて始まり、労働日の短縮がその根本条件だと書いた。"]),
 s("D",[63,64],["논평: 마르크스 안에는 두 주장이 겹쳐 있다—자유로운 활동으로서의 노동은 인간 본질이지만, 생계를 위한 노동은 자유가 아니라 필요의 영역이다; 그러니 '노동은 신성하다'는 구호를 마르크스로 정당화하는 것은 절반만 읽은 것이다.",
  "Commentary: two claims overlap in Marx — labour as free activity is the human essence, but labour for subsistence belongs to necessity, not freedom; so justifying the slogan 'labour is sacred' with Marx is reading only half of him.",
  "Комментарий: у Маркса накладываются два тезиса — труд как свободная деятельность есть сущность человека, но труд ради пропитания принадлежит необходимости, а не свободе; поэтому оправдывать лозунг «труд священен» Марксом — читать его наполовину.",
  "评论：马克思那里叠合着两个主张——作为自由活动的劳动是人的本质，但为谋生的劳动属于必然而非自由；因此用马克思为“劳动神圣”的口号辩护，只读了一半。",
  "論評：マルクスの中には2つの主張が重なっている。自由な活動としての労働は人間の本質だが、生計のための労働は自由ではなく必然の領域である。だから「労働は神聖だ」という標語をマルクスで正当化するのは半分しか読んでいないことになる。"]),
 s("D",[68,67],["논평: 아이러니하게도 이 사상을 내건 국가들이 생계 노동을 가장 강하게 신성화했다: 1936년 소련 헌법은 노동을 '의무이자 명예'로 정하고 '일하지 않는 자는 먹지 못한다'는 원칙을 헌법에 넣었고, 현행 중국 헌법도 노동을 '영광스러운 직책'이라 부른다.",
  "Commentary: ironically, the states that raised this banner sanctified subsistence labour most strongly: the 1936 Soviet constitution made work 'a duty and a matter of honour' and wrote 'he who does not work, neither shall he eat' into the constitution, and China's current constitution still calls work 'a glorious duty'.",
  "Комментарий: по иронии, именно государства под этим знаменем сильнее всех освятили труд ради пропитания: Конституция СССР 1936 г. объявила труд «обязанностью и делом чести» и внесла в текст принцип «кто не работает, тот не ест», а действующая конституция Китая называет труд «почётной обязанностью».",
  "评论：讽刺的是，打着这一思想旗号的国家把谋生劳动神圣化得最彻底：1936年苏联宪法把劳动定为“义务和光荣的事情”，并把“不劳动者不得食”写入宪法；现行中国宪法也称劳动是“光荣职责”。",
  "論評：皮肉にも、この思想を掲げた国家こそが生計のための労働を最も強く神聖化した。1936年のソ連憲法は労働を「義務であり名誉」と定め「働かざる者食うべからず」の原則を憲法に入れ、現行の中国憲法も労働を「光栄ある職責」と呼ぶ。"])
