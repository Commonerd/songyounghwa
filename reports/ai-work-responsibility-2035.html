P(
 s("B",[65],["한국 헌법 제32조는 모든 국민에게 근로의 권리와 함께 근로의 의무를 지우고, 그 내용과 조건은 민주주의 원칙에 따라 법률로 정하도록 했지만, 휴식권을 따로 명시하지는 않는다.",
  "Article 32 of Korea's constitution gives every citizen both the right and the duty to work, with the duty's content and conditions to be set by law under democratic principles, but it does not separately state a right to rest.",
  "Статья 32 Конституции Кореи даёт каждому гражданину и право, и обязанность трудиться, причём содержание и условия обязанности определяются законом по демократическим принципам, но право на отдых отдельно не закреплено.",
  "韩国宪法第32条赋予全体国民劳动的权利与义务，并规定义务的内容与条件依民主原则由法律规定，但没有另行明示休息权。",
  "韓国憲法第32条はすべての国民に勤労の権利とともに勤労の義務を課し、その内容と条件は民主主義の原則に従い法律で定めるとしたが、休息の権利を別に明記してはいない。"]),
 s("B",[66,73],["일본 헌법 제27조도 근로의 권리와 의무를 함께 정하고, 1948년 제정된 국민의 축일법은 11월 23일 근로감사의 날의 취지를 '근로를 존중하고 생산을 축하하며 국민이 서로 감사하는 것'으로 적었다.",
  "Article 27 of Japan's constitution likewise sets out both the right and the duty to work, and the 1948 National Holidays Act gives the purpose of Labour Thanksgiving Day on 23 November as 'to honour labour, celebrate production and give one another thanks'.",
  "Статья 27 Конституции Японии также закрепляет и право, и обязанность трудиться, а закон 1948 г. о национальных праздниках определяет смысл Дня благодарения труду 23 ноября как «чтить труд, праздновать производство и благодарить друг друга».",
  "日本宪法第27条同样规定勤劳的权利与义务，1948年制定的《国民节日法》把11月23日勤劳感谢日的宗旨写为“尊重勤劳、庆祝生产、国民互相感谢”。",
  "日本国憲法第27条も勤労の権利と義務をともに定め、1948年に制定された国民の祝日に関する法律は11月23日の勤労感謝の日の趣旨を「勤労をたつとび、生産を祝い、国民たがいに感謝しあう」と記した。"]),
 s("B",[71],["이탈리아 헌법은 제1조에서 공화국이 '노동 위에 세워졌다'고 선언하고, 제4조에서 모든 시민에게 자신의 가능성과 선택에 따라 사회의 물질적·정신적 진보에 기여하는 활동을 할 의무를 지운다.",
  "Italy's constitution declares in Article 1 that the Republic is 'founded on work', and in Article 4 places every citizen under a duty to carry out, according to their possibilities and choice, an activity that contributes to society's material or spiritual progress.",
  "Конституция Италии в статье 1 провозглашает Республику «основанной на труде», а в статье 4 обязывает каждого гражданина по своим возможностям и выбору заниматься деятельностью, способствующей материальному или духовному прогрессу общества.",
  "意大利宪法第1条宣告共和国“建立在劳动之上”，第4条规定每个公民有义务依自身能力与选择，从事有助于社会物质或精神进步的活动。",
  "イタリア憲法は第1条で共和国が「労働の上に築かれる」と宣言し、第4条ですべての市民に自らの可能性と選択に従い社会の物質的・精神的進歩に寄与する活動を行う義務を課す。"]),
 s("B",[69,74],["러시아의 1993년 헌법 제37조는 '노동은 자유롭다'로 시작해 강제노동을 금지하고 노동의 의무를 두지 않지만, 2013년 대통령령은 '자기희생적이고 성실한 노동의 위신을 높이기 위해' 노동 영웅 칭호를 만들었다.",
  "Article 37 of Russia's 1993 constitution opens with 'Labour is free', bans forced labour and sets no duty to work, yet a 2013 presidential decree created the title Hero of Labour 'to raise the prestige of self-sacrificing and conscientious labour'.",
  "Статья 37 Конституции России 1993 г. начинается словами «Труд свободен», запрещает принудительный труд и не устанавливает обязанности трудиться, однако указ 2013 г. учредил звание Героя Труда «в целях повышения… престижа самоотверженного и добросовестного труда».",
  "俄罗斯1993年宪法第37条以“劳动是自由的”开头，禁止强迫劳动且不设劳动义务，但2013年的总统令为“提高自我牺牲与认真劳动的声望”设立了劳动英雄称号。",
  "ロシアの1993年憲法第37条は「労働は自由である」で始まり、強制労働を禁じ労働の義務を置かないが、2013年の大統領令は「自己犠牲的で誠実な労働の威信を高めるため」労働英雄の称号を設けた。"]),
 s("B",[70],["독일 기본법 제12조는 직업 선택의 자유를 보장하고 특정 노동의 강요를 금지하며, 강제노동은 법원 판결로 자유를 박탈당한 사람에게만 허용한다.",
  "Article 12 of Germany's Basic Law guarantees free choice of occupation, bans compelling anyone to do a particular kind of work, and allows forced labour only for people deprived of liberty by a court judgment.",
  "Статья 12 Основного закона Германии гарантирует свободу выбора профессии, запрещает принуждать к определённому виду работ и допускает принудительный труд лишь для лиц, лишённых свободы по приговору суда.",
  "德国基本法第12条保障职业选择自由，禁止强迫从事特定劳动，强迫劳动只允许施加于经法院判决被剥夺自由的人。",
  "ドイツ基本法第12条は職業選択の自由を保障し、特定の労働の強制を禁じ、強制労働は裁判所の判決で自由を奪われた者にのみ認める。"]),
 s("B",[72],["세계인권선언은 제23조에서 일할 권리를 정한 바로 다음 제24조에서 노동시간의 합리적 제한과 유급휴가를 포함한 휴식과 여가의 권리를 정했고, 일할 의무는 두지 않았다.",
  "The Universal Declaration of Human Rights sets out the right to work in Article 23 and, immediately after, the right to rest and leisure — including reasonable limits on working hours and paid holidays — in Article 24, with no duty to work.",
  "Всеобщая декларация прав человека закрепляет право на труд в статье 23 и сразу за ним, в статье 24, право на отдых и досуг, включая разумное ограничение рабочего времени и оплачиваемый отпуск; обязанности трудиться нет.",
  "《世界人权宣言》在第23条规定工作权之后，紧接着在第24条规定包括合理限制工作时间与带薪休假在内的休息和闲暇的权利，且不设劳动义务。",
  "世界人権宣言は第23条で働く権利を定めたすぐ次の第24条で、労働時間の合理的な制限と有給休暇を含む休息と余暇の権利を定め、働く義務は置かなかった。"]),
 s("D",[65,66,67,68,70,71],["논평: 노동을 '의무'나 '영예'로 쓴 헌법은 혁명·국가 건설·전후 재건의 시기에 만들어진 것이 많고, '자유'와 '강제노동 금지'를 앞세운 헌법은 강제노동의 기억에 대한 반작용으로 읽힌다—헌법의 노동관은 철학이라기보다 그 나라가 노동을 동원해야 했던 역사의 흔적이다.",
  "Commentary: constitutions that write work as a 'duty' or an 'honour' were often made in times of revolution, state-building or post-war reconstruction, while those that lead with 'freedom' and a ban on forced labour read as reactions to the memory of forced labour — a constitution's view of work is less a philosophy than a trace of the history in which that country had to mobilise labour.",
  "Комментарий: конституции, называющие труд «обязанностью» или «честью», чаще создавались в эпохи революций, строительства государства или послевоенного восстановления, а ставящие во главу «свободу» и запрет принудительного труда читаются как реакция на память о принудительном труде; взгляд конституции на труд — не столько философия, сколько след истории, в которой стране приходилось мобилизовать труд.",
  "评论：把劳动写成“义务”或“荣誉”的宪法，多制定于革命、建国或战后重建时期；把“自由”和“禁止强迫劳动”放在前面的宪法，则可读作对强迫劳动记忆的反弹——宪法的劳动观与其说是哲学，不如说是该国不得不动员劳动的历史痕迹。",
  "論評：労働を「義務」や「名誉」と書いた憲法は革命・国家建設・戦後復興の時期に作られたものが多く、「自由」と「強制労働の禁止」を前面に出した憲法は強制労働の記憶への反動と読める。憲法の労働観は哲学というより、その国が労働を動員しなければならなかった歴史の痕跡である。"],
  ["제정 배경에 대한 해석은 각 헌법의 제정사를 따로 확인하지 않은 Claude의 추론이다.","The reading of each constitution's background is Claude's inference; the drafting histories were not separately verified.","Трактовка истории принятия — вывод Claude; истории разработки конституций отдельно не проверялись.","对制定背景的解读是Claude的推论，未另行核实各宪法的制定史。","制定の背景についての解釈は、各憲法の制定史を別途確認していないClaudeの推論である。"],"M"),
 s("D",[65],["논평: 한국 헌법이 쓰는 '근로(勤勞)'라는 말은 글자 그대로 '부지런히 일함'이어서, 노동을 계약이 아니라 품성의 문제로 읽게 하는 언어적 바탕이 된다.",
  "Commentary: the word Korea's constitution uses for work, geunro (勤勞), literally means 'diligent labour', which gives a linguistic basis for reading work as a matter of character rather than contract.",
  "Комментарий: слово, которым Конституция Кореи называет труд, — кынно (勤勞), буквально «усердный труд», и это создаёт языковую основу для восприятия труда как вопроса характера, а не договора.",
  "评论：韩国宪法所用的“勤劳（근로）”一词字面意思就是“勤勉地劳动”，这为把劳动理解为品性问题而非契约问题提供了语言基础。",
  "論評：韓国憲法が使う「勤労（クルロ）」という言葉は文字どおり「勤勉に働くこと」であり、労働を契約ではなく品性の問題として読ませる言語的な土台になっている。"],null,"M")

P(
 s("B",[75],["케인스는 1930년 '손자 세대의 경제적 가능성'에서 노동을 아끼는 수단이 노동의 새 쓰임을 찾는 속도를 앞지르는 '기술적 실업'을 예고하면서도, 남은 일을 넓게 나눠 하루 3시간 교대나 주 15시간 노동으로 버틸 수 있으리라 내다봤다.",
  "In 'Economic Possibilities for our Grandchildren' (1930), Keynes foresaw 'technological unemployment' — means of economising labour outrunning new uses for it — yet expected that sharing the remaining work through three-hour shifts or a fifteen-hour week could hold the problem off.",
  "В эссе «Экономические возможности наших внуков» (1930) Кейнс предсказал «технологическую безработицу» — средства экономии труда опередят поиск новых применений для него, — но ожидал, что распределение оставшейся работы через трёхчасовые смены или 15-часовую неделю отсрочит проблему.",
  "凯恩斯在1930年的《我们孙辈的经济前景》中预告了“技术性失业”——节约劳动的手段快于为劳动找到新用途的速度——同时预期把剩余工作广泛分摊，以每天三小时轮班或每周十五小时工作，或可推迟这一问题。",
  "ケインズは1930年の「孫たちの経済的可能性」で、労働を節約する手段が労働の新たな使い道を見つける速度を上回る「技術的失業」を予告しつつ、残った仕事を広く分け合い1日3時間の交代制や週15時間労働でしのげるだろうと見通した。"]),
 s("A",[76],["그레이버의 '쓸모없는 일' 이론은 많은 노동자가 스스로 쓸모없다고 여기는 일을 하고 그 수가 빠르게 늘고 있다고 주장했지만, EU 대표 표본 자료로 그 핵심 가설 다섯 가지를 검증한 연구는 자기 일을 쓸모없다고 보는 비율이 낮고 줄고 있다고 보고했다.",
  "Graeber's theory of 'bullshit jobs' claimed that many workers do jobs they themselves see as useless and that their number is growing fast, but a study testing five of its core hypotheses on representative EU data found the share describing their jobs as useless low and declining.",
  "Теория «бредовой работы» Грэбера утверждала, что многие работники заняты делом, которое сами считают бесполезным, и что их число быстро растёт, но исследование, проверившее пять её ключевых гипотез на репрезентативных данных ЕС, показало, что доля считающих свою работу бесполезной мала и снижается.",
  "格雷伯的“狗屁工作”理论声称，许多劳动者从事自己都认为无用的工作，且人数迅速增加；但一项用欧盟代表性数据检验其五个核心假设的研究发现，认为自己工作无用的比例低且在下降。",
  "グレーバーの「クソどうでもいい仕事」理論は、多くの労働者が自分でも無用と思う仕事をしており、その数が急速に増えていると主張したが、EUの代表標本データでその中核仮説5つを検証した研究は、自分の仕事を無用と見る割合は低く減少していると報告した。"]),
 s("A",[76],["같은 연구에서 자기 일이 쓸모없다고 느끼는 것은 낮은 웰빙과 강하게 연관됐고, 연구진은 그 원인을 일의 무의미함 자체보다 나쁜 관리와 해로운 직장 환경, 곧 소외에서 찾았다.",
  "In the same study, feeling one's job is useless was strongly associated with poor wellbeing, and the authors located the cause less in the work's pointlessness than in poor management and toxic workplace environments — that is, in alienation.",
  "В том же исследовании ощущение бесполезности своей работы сильно связано с плохим благополучием, а причину авторы видят не столько в бессмысленности работы, сколько в плохом управлении и токсичной рабочей среде, то есть в отчуждении.",
  "同一研究中，觉得自己工作无用与较差的幸福感强相关，作者把原因与其说归于工作本身无意义，不如说归于糟糕的管理与有毒的职场环境，即异化。",
  "同じ研究で、自分の仕事が無用だと感じることは低いウェルビーイングと強く関連し、著者らはその原因を仕事の無意味さそのものより、悪い管理と有害な職場環境、すなわち疎外に求めた。"]),
 s("C",[82],["갤럽의 2026년 보고서에 따르면 2025년 세계 직원 몰입도는 20%로 2020년 이후 가장 낮았고 처음으로 2년 연속 떨어졌으며, 관리자 몰입도는 1년 새 27%에서 22%로 내려갔다.",
  "According to Gallup's 2026 report, global employee engagement was 20% in 2025, the lowest since 2020 and the first two-year consecutive fall, and manager engagement dropped from 27% to 22% in a year.",
  "По докладу Gallup 2026 г., глобальная вовлечённость сотрудников в 2025 г. составила 20% — минимум с 2020 г. и впервые снижение два года подряд, а вовлечённость руководителей за год упала с 27% до 22%.",
  "据盖洛普2026年报告，2025年全球员工敬业度为20%，是2020年以来最低，且首次连续两年下降；管理者敬业度一年内从27%降至22%。",
  "ギャラップの2026年の報告によれば、2025年の世界の従業員エンゲージメントは20%と2020年以降で最も低く、初めて2年連続で下がり、管理職のエンゲージメントは1年で27%から22%に下がった。"]),
 s("D",[76,82,62],["논평: 탈노동론은 진단에서 강하다—대부분의 사람은 일에 몰입하지 않고, 노동의 신성함을 가장 크게 말해 온 쪽은 대개 노동을 확보해야 하는 쪽이었다; 그러나 처방에서는 과장됐다: '내 일은 쓸모없다'는 감각은 소수이고, 사람들이 싫어하는 것은 일 자체보다 일의 조건이다.",
  "Commentary: the post-work position is strong in diagnosis — most people are not engaged at work, and those who have spoken loudest of work's sacredness have usually been those who needed to secure labour; but its prescription is overstated: the sense that 'my job is useless' is a minority view, and what people dislike is less work itself than its conditions.",
  "Комментарий: посттрудовая позиция сильна в диагнозе — большинство не вовлечено в работу, а громче всех о святости труда обычно говорили те, кому нужно было обеспечить себя трудом; но рецепт преувеличен: ощущение «моя работа бесполезна» — у меньшинства, и людям не нравится не столько сама работа, сколько её условия.",
  "评论：后工作论在诊断上有力——大多数人并不投入工作，而最响亮地宣扬劳动神圣的，通常是需要确保劳动供给的一方；但其处方被夸大了：“我的工作无用”的感觉属于少数，人们讨厌的与其说是工作本身，不如说是工作的条件。",
  "論評：脱労働論は診断では強い。大半の人は仕事に没頭しておらず、労働の神聖さを最も声高に語ってきたのはたいてい労働を確保しなければならない側だった。しかし処方では誇張されている。「自分の仕事は無用だ」という感覚は少数派で、人々が嫌うのは仕事そのものより仕事の条件である。"]),
 s("D",[75],["논평: 케인스가 그린 주 15시간은 오지 않았는데, 이는 생산성이 오른 만큼 사람들이 일을 줄이지 않았다는 뜻이고, 일이 생계 수단을 넘어 지위와 인정의 수단으로 쓰이고 있음을 시사한다.",
  "Commentary: Keynes's fifteen-hour week never came, which means people did not cut work as productivity rose, and suggests that work serves not only as a livelihood but as a means of status and recognition.",
  "Комментарий: 15-часовая неделя Кейнса так и не наступила: люди не сократили работу по мере роста производительности, а это указывает, что работа служит не только средством к жизни, но и средством статуса и признания.",
  "评论：凯恩斯描绘的每周十五小时始终没有到来，这意味着人们并未随生产率提高而减少工作，也暗示工作不仅是谋生手段，还是地位与认可的手段。",
  "論評：ケインズが描いた週15時間は来なかった。これは生産性が上がった分だけ人々が仕事を減らさなかったということであり、仕事が生計の手段を超えて地位と承認の手段として使われていることを示唆する。"],null,"M")
),
SAC_H[5],
P(
 s("A",[77],["104개 연구, 437개 효과크기를 묶은 메타분석에서 실업자는 취업자보다 심리적·신체적 웰빙이 낮았고, 실업 급여 수준이나 실업률은 이 관계를 바꾸지 못했으며, 실업자 안에서는 일의 중심성과 시간 구조 같은 대처 자원이 정신건강과 강하게 연관됐다.",
  "In a meta-analysis of 104 studies and 437 effect sizes, the unemployed had lower psychological and physical well-being than the employed; neither benefit levels nor the unemployment rate changed this, and among the unemployed, work-role centrality and coping resources such as time structure related strongly to mental health.",
  "В метаанализе 104 исследований и 437 размеров эффекта у безработных психологическое и физическое благополучие было ниже, чем у занятых; ни размер пособий, ни уровень безработицы этого не меняли, а среди безработных центральность трудовой роли и ресурсы совладания, такие как структура времени, были сильно связаны с психическим здоровьем.",
  "在汇总104项研究、437个效应量的元分析中，失业者的心理与身体幸福感低于就业者；失业救济水平与失业率都没有改变这一关系，而在失业者中，工作角色中心性与时间结构等应对资源与心理健康密切相关。",
  "104件の研究、437の効果量をまとめたメタ分析で、失業者は就業者より心理的・身体的ウェルビーイングが低く、失業給付の水準や失業率はこの関係を変えず、失業者の中では仕事役割の中心性や時間の構造のような対処資源が精神的健康と強く関連した。"]),
 s("A",[78],["스웨덴 복권 당첨자를 무작위 배정 자료로 추적한 연구에서 당첨은 근로소득을 '완만하게' 줄였을 뿐이고, 그 감소는 즉각적·지속적이며 나이·학력·성별에 따라 비슷했다.",
  "In a study using the random assignment of Swedish lottery prizes, winning only 'modestly' reduced earnings, with the reduction immediate, persistent and similar across age, education and sex.",
  "В исследовании, использующем случайное распределение шведских лотерейных выигрышей, выигрыш лишь «умеренно» снижал заработки, причём снижение было немедленным, устойчивым и сходным по возрасту, образованию и полу.",
  "一项利用瑞典彩票奖金随机分配的研究发现，中奖只是“温和地”降低了劳动收入，下降是即时且持久的，在年龄、学历与性别之间相似。",
  "スウェーデンの宝くじ当選の無作為な割り当てを使った研究で、当選は勤労所得を「緩やかに」減らしただけで、その減少は即時的・持続的で、年齢・学歴・性別で似通っていた。"]),
 s("B",[79],["미국 두 주에서 저소득층 1,000명에게 3년간 매달 1,000달러를 조건 없이 준 무작위 실험에서 노동시장 참여는 4.2%포인트, 근로시간은 주 1~2시간 줄고 늘어난 시간은 주로 여가로 갔지만, 일자리의 질은 나아지지 않았고 주관적 웰빙은 첫해에만 높았다.",
  "In a randomised experiment giving 1,000 low-income people in two US states $1,000 a month unconditionally for three years, labour-market participation fell by 4.2 percentage points and working hours by 1–2 hours a week, with the time going mainly to leisure; job quality did not improve, and subjective well-being was higher only in the first year.",
  "В рандомизированном эксперименте, где 1000 малообеспеченных в двух штатах США три года безусловно получали по 1000 долларов в месяц, участие на рынке труда снизилось на 4,2 п.п., рабочее время — на 1–2 часа в неделю, освободившееся время ушло в основном на досуг; качество работы не улучшилось, а субъективное благополучие было выше лишь в первый год.",
  "在美国两个州让1,000名低收入者三年内每月无条件领取1,000美元的随机实验中，劳动市场参与率下降4.2个百分点，每周工作时间减少1至2小时，增加的时间主要用于休闲；但工作质量没有改善，主观幸福感也只在第一年较高。",
  "米国の2州で低所得者1,000人に3年間毎月1,000ドルを無条件で支給した無作為化実験で、労働市場参加は4.2ポイント、労働時間は週1〜2時間減り、増えた時間は主に余暇に回ったが、仕事の質は良くならず、主観的ウェルビーイングは1年目だけ高かった。"]),
 s("D",[77,78,79],["논평: 이 자료들은 양쪽의 기대를 모두 꺾는다—돈이 생기면 사람들이 일을 그만둔다는 공포도, 일에서 풀려나면 사람들이 해방된다는 기대도 맞지 않는다; 사람들은 돈을 받아도 대체로 계속 일하고, 일을 잃으면 돈 이상의 것을 잃는다.",
  "Commentary: these data disappoint both camps — neither the fear that people stop working once they have money nor the hope that people are liberated once freed from work holds; people mostly keep working when given money, and lose more than money when they lose work.",
  "Комментарий: эти данные разочаровывают оба лагеря — не подтверждается ни страх, что получив деньги, люди перестанут работать, ни надежда, что, освободившись от работы, они обретут свободу; получив деньги, люди в основном продолжают работать, а теряя работу, теряют больше, чем деньги.",
  "评论：这些数据让双方的期待都落空——既不是有了钱人们就不干活的恐惧，也不是摆脱工作人们就获得解放的期待；人们拿到钱后大多继续工作，失去工作时失去的不只是钱。",
  "論評：これらの資料は両方の期待をくじく。お金が入れば人々は働くのをやめるという恐れも、仕事から解放されれば人々は自由になるという期待も当たらない。人々はお金を受け取っても大抵は働き続け、仕事を失えばお金以上のものを失う。"]),
 s("D",[77,81],["논평: 다만 '일이 주는 재화'의 증거가 일이 신성하다는 증거는 아니다: 시간의 구조, 소속, 인정은 지금 일이 거의 독점해 공급할 뿐 일만 줄 수 있는 것이 아니며, 바로 그 독점 때문에 실업이 더 아프다.",
  "Commentary: but evidence of the 'goods of work' is not evidence that work is sacred: time structure, belonging and recognition are currently supplied almost exclusively by work, not things only work can give — and it is precisely that monopoly that makes unemployment hurt more.",
  "Комментарий: однако свидетельства «благ труда» не доказывают его святость: структуру времени, принадлежность и признание сейчас почти монопольно поставляет работа, хотя дать их может не только она, — и именно эта монополия делает безработицу болезненнее.",
  "评论：不过，“工作之益”的证据并不是工作神圣的证据：时间结构、归属与认可目前几乎由工作垄断供给，并非只有工作才能提供——正是这种垄断让失业更痛。",
  "論評：ただし「仕事が与える財」の証拠は仕事が神聖である証拠ではない。時間の構造、所属、承認は今は仕事がほぼ独占して供給しているだけで、仕事しか与えられないものではなく、まさにその独占のせいで失業はいっそう痛い。"])
),

P(
 s("A",[81],["AI와 의미 있는 일을 다룬 개념 연구는 AI 배치를 일부 과업의 대체, '기계 돌보기', 인간 역량의 증폭이라는 세 경로로 나누고, 같은 기술이 경로에 따라 의미 있는 일의 경험을 키울 수도 줄일 수도 있다고 분석했다.",
  "A conceptual study of AI and meaningful work divides AI deployment into three paths — replacing some tasks, 'tending the machine' and amplifying human skills — and argues that the same technology can enlarge or shrink the experience of meaningful work depending on the path.",
  "Концептуальное исследование ИИ и осмысленного труда делит внедрение ИИ на три пути — замена части задач, «обслуживание машины» и усиление человеческих навыков — и показывает, что одна и та же технология в зависимости от пути может как усилить, так и ослабить переживание осмысленности труда.",
  "一项关于AI与有意义工作的概念研究把AI部署分为三条路径——替代部分任务、“照看机器”、放大人的技能——并认为同一技术因路径不同，既可能增强也可能削弱有意义工作的体验。",
  "AIと意味のある仕事を扱った概念研究は、AIの導入を一部の課題の代替、「機械の世話」、人間の能力の増幅という3つの経路に分け、同じ技術でも経路によって意味のある仕事の経験を高めることも減らすこともありうると分析した。"]),
 s("A",[80],["3,562명이 참여한 네 차례 온라인 실험에서 생성형 AI와의 협업은 당장의 성과를 높였지만 그 효과는 혼자 하는 다음 과제로 이어지지 않았고, AI 협업 뒤 혼자 일하게 된 사람들의 내재적 동기는 유의하게 떨어지고 지루함은 커졌다.",
  "In four online experiments with 3,562 participants, working with generative AI raised immediate performance, but the gain did not carry over to the next solo task, and people who switched from AI collaboration to working alone showed significantly lower intrinsic motivation and more boredom.",
  "В четырёх онлайн-экспериментах с 3562 участниками работа с генеративным ИИ повышала немедленную результативность, но эффект не переносился на следующую самостоятельную задачу, а у перешедших от работы с ИИ к самостоятельной внутренняя мотивация значимо снижалась и росла скука.",
  "在3,562人参与的四项在线实验中，与生成式AI协作提高了即时表现，但效果没有延续到下一项独立任务；从AI协作转为独自工作的人内在动机显著下降，无聊感增加。",
  "3,562人が参加した4回のオンライン実験で、生成AIとの協働は当面の成績を高めたが、その効果は次の単独の課題には続かず、AIとの協働の後に一人で働くことになった人の内発的動機づけは有意に下がり、退屈さは増した。"]),
 s("D",[60,61],["노동을 가장 오래 신성하게 다뤄 온 교회가 새 교황의 첫 메시지와 공식 문서에서 AI를 노동 존엄의 문제로 규정한 것은, 노동 신성론이 AI 시대에 사라지기보다 새로운 근거를 찾고 있음을 보여 준다.",
  "That the Church, which has treated work as sacred longest, framed AI as a question of the dignity of labour in a new pope's first message and in an official document shows the sacredness of work looking for new grounds in the AI era rather than fading.",
  "То, что Церковь, дольше всех считающая труд священным, в первом обращении нового папы и в официальном документе определила ИИ как вопрос достоинства труда, показывает: идея святости труда в эпоху ИИ не исчезает, а ищет новые основания.",
  "最长久地视劳动为神圣的教会，在新教宗的首次讲话与正式文件中把AI界定为劳动尊严的问题，这表明劳动神圣论在AI时代并未消失，而是在寻找新的依据。",
  "労働を最も長く神聖なものとして扱ってきた教会が、新教皇の最初のメッセージと公式文書でAIを労働の尊厳の問題と位置づけたことは、労働神聖論がAI時代に消えるよりも新たな根拠を探していることを示す。"]),
 s("D",[80,81,25,30],["논평: AI는 노동의 경제적 필요보다 노동의 '의미 공급'을 먼저 건드린다: 가장 생각이 필요한 부분을 AI가 가져가면 남은 일은 덜 힘들지만 덜 내 것이 되고, 그 상태로 결과의 책임만 남으면 이 보고서가 다룬 '통제 없는 책임'이 일의 의미 차원에서 되풀이된다.",
  "Commentary: AI touches work's supply of meaning before its economic necessity: when AI takes the most thought-intensive part, the remaining work is less hard but less one's own, and if only responsibility for the outcome remains, the 'responsibility without control' this report examines recurs at the level of meaning.",
  "Комментарий: ИИ затрагивает «поставку смысла» в труде раньше, чем его экономическую необходимость: когда ИИ забирает самую мыслительную часть, оставшаяся работа легче, но меньше принадлежит человеку, и если остаётся лишь ответственность за результат, рассматриваемая в докладе «ответственность без контроля» повторяется на уровне смысла.",
  "评论：AI先触及的是工作的“意义供给”，而非其经济必要性：当最需要思考的部分被AI拿走，剩下的工作不那么辛苦，却也不那么属于自己；若此时只剩对结果的责任，本报告讨论的“无控制的责任”就会在意义层面重演。",
  "論評：AIは労働の経済的必要より先に労働の「意味の供給」に触れる。最も考える必要のある部分をAIが持っていくと、残った仕事は楽になるが自分のものではなくなり、その状態で結果の責任だけが残れば、本報告が扱った「統制なき責任」が仕事の意味の次元で繰り返される。"]),
 s("D",[57,58,37],["논평: 노동 신성론이 AI 시대에 가장 위험해지는 곳은 책임의 배분이다: 법원은 회사가 자기 챗봇의 말에 책임진다고 판단했지만, 조직 안에서 'AI가 정했다'는 책임 싱크와 '일에 헌신하라'는 신성론이 함께 작동하면 결정의 무게는 위로 사라지고 실패의 무게는 아래로 쌓인다.",
  "Commentary: where the sacredness of work becomes most dangerous in the AI era is the allocation of responsibility: a tribunal held a company responsible for what its chatbot said, but when the accountability sink of 'the AI decided' and the creed of 'devote yourself to your work' operate together inside an organisation, the weight of decisions vanishes upwards while the weight of failure piles up below.",
  "Комментарий: опаснее всего идея святости труда в эпоху ИИ там, где распределяется ответственность: трибунал признал компанию ответственной за слова её чат-бота, но когда внутри организации вместе действуют «поглотитель ответственности» («так решил ИИ») и заповедь «посвяти себя работе», вес решений исчезает наверху, а вес провалов копится внизу.",
  "评论：劳动神圣论在AI时代最危险的地方是责任的分配：审裁处判定公司要为其聊天机器人的话负责，但在组织内部，当“AI决定的”这一责任黑洞与“献身工作”的神圣论一起运作，决定的分量在上方消失，失败的分量在下方堆积。",
  "論評：労働神聖論がAI時代に最も危険になるのは責任の配分である。審判所は会社が自社のチャットボットの言葉に責任を負うと判断したが、組織の中で「AIが決めた」という責任の吸い込み口と「仕事に献身せよ」という神聖論がともに働けば、決定の重みは上へ消え、失敗の重みは下へ積もる。"])
),
SAC_H[7],
P(
 s("D",[62,68,67,74],["결론 ①: 노동은 신성하지 않다. '신성하다'는 말은 사실의 기술이 아니라 처방이며, 원전과 헌법이 보여 주듯 그 처방은 대체로 노동을 확보해야 하는 쪽—종교적 규율, 혁명 국가, 국가 건설과 산업화—의 필요와 함께 강해졌다.",
  "Conclusion ①: work is not sacred. 'Sacred' is a prescription, not a description, and as the primary texts and constitutions show, that prescription has generally grown stronger alongside the needs of those who had to secure labour — religious discipline, revolutionary states, state-building and industrialisation.",
  "Вывод ①: труд не священен. «Священный» — это предписание, а не описание, и, как показывают первоисточники и конституции, это предписание обычно усиливалось вместе с нуждами тех, кому требовалось обеспечить труд, — религиозной дисциплины, революционных государств, строительства государства и индустриализации.",
  "结论①：劳动并不神圣。“神圣”不是对事实的描述而是一种处方；正如原始文献与宪法所示，这一处方大体上随着需要确保劳动的一方——宗教规训、革命国家、国家建设与工业化——的需要而增强。",
  "結論①：労働は神聖ではない。「神聖だ」という言葉は事実の記述ではなく処方であり、原典と憲法が示すように、その処方はおおむね労働を確保しなければならない側—宗教的規律、革命国家、国家建設と工業化—の必要とともに強まった。"]),
 s("D",[77,78,79],["결론 ②: 그렇다고 노동이 하찮은 것도 아니다: 일은 소득 외에 시간의 구조, 소속, 인정, 쓸모 있다는 감각을 공급하고 사람들은 돈을 받아도 대체로 일을 놓지 않는다—그러나 이것은 신성함이 아니라 독점이다; 지금 사회에서 그 재화를 대량으로 공급하는 통로가 사실상 일밖에 없다는 뜻이다.",
  "Conclusion ②: nor is work trivial: besides income it supplies time structure, belonging, recognition and a sense of being useful, and people mostly hold on to work even when given money — but this is monopoly, not sacredness: in today's societies work is practically the only channel that supplies those goods at scale.",
  "Вывод ②: но и пустяком труд не является: помимо дохода он даёт структуру времени, принадлежность, признание и чувство полезности, и, получив деньги, люди в основном не бросают работу; однако это не святость, а монополия: в сегодняшнем обществе работа — практически единственный канал массовой поставки этих благ.",
  "结论②：但劳动也并非微不足道：工作在收入之外提供时间结构、归属、认可与“有用”的感觉，人们即使拿到钱也大多不放下工作——然而这不是神圣，而是垄断：在当今社会，大规模供给这些好处的渠道实际上只有工作。",
  "結論②：だからといって労働がつまらないものでもない。仕事は所得以外に時間の構造、所属、承認、役に立っているという感覚を供給し、人々はお金を受け取っても大抵は仕事を手放さない。しかしこれは神聖さではなく独占である。今の社会でその財を大量に供給する経路が事実上仕事しかないということだ。"]),
 s("D",[82,76],["결론 ③: 더 정확히 말하면, 대다수에게 일은 소명이 아니라 몰입하지 않으면서도 놓을 수 없는 교환이다: 세계 직원 다섯 명 중 네 명은 일에 몰입하지 않지만, 일을 잃는 순간 소득과 함께 사회적 자리도 잃는다.",
  "Conclusion ③: put more precisely, for most people work is not a vocation but an exchange they are not engaged in yet cannot let go of: four in five employees worldwide are not engaged, but the moment they lose work they lose their social place along with their income.",
  "Вывод ③: точнее говоря, для большинства работа — не призвание, а обмен, в который они не вовлечены, но от которого не могут отказаться: четверо из пяти работников в мире не вовлечены, но, теряя работу, вместе с доходом теряют и место в обществе.",
  "结论③：更准确地说，对大多数人而言，工作不是召命，而是一种并不投入却又放不下的交换：全球五名员工中有四名并不投入工作，但一旦失业，失去的不只是收入，还有社会位置。",
  "結論③：より正確に言えば、大多数にとって仕事は召命ではなく、没頭していないのに手放せない交換である。世界の従業員の5人に4人は仕事に没頭していないが、仕事を失った瞬間に所得とともに社会的な居場所も失う。"]),
 s("D",[59,3,7],["결론 ④: 노동이 신성하다는 믿음은 이 보고서의 주제인 책임의 고통을 키우는 연료다: 일이 신성하면 일의 범위에 경계가 없고, 경계가 없으면 통제할 수 없었던 실패도 '헌신이 부족한 탓'이 된다.",
  "Conclusion ④: the belief that work is sacred is fuel for the pain of responsibility that is this report's subject: if work is sacred its scope has no boundary, and without a boundary even failures that could not be controlled become 'a lack of devotion'.",
  "Вывод ④: вера в святость труда — топливо для боли ответственности, которой посвящён доклад: если труд священен, у его объёма нет границ, а без границ даже неподконтрольные провалы становятся «недостатком преданности».",
  "结论④：“劳动神圣”的信念是加剧本报告主题——责任之痛——的燃料：如果工作是神圣的，工作的范围就没有边界；没有边界，连无法控制的失败也会变成“奉献不够”。",
  "結論④：労働が神聖だという信念は、本報告の主題である責任の苦しみを大きくする燃料である。仕事が神聖なら仕事の範囲に境界はなく、境界がなければ統制できなかった失敗も「献身が足りないせい」になる。"]),
 s("D",[22,57],["결론 ⑤: 그래서 실천적 처방은 일을 '덜 신성하게, 더 계약답게' 다루는 것이다: 계약은 범위·변경·대가를 정하고 범위 밖의 실패를 인격의 실패로 만들지 않으며, 사양이 바뀌면 일정과 대가를 다시 정하는 과업 변경 절차나 회사가 자기 AI의 말에 책임진다는 판결처럼 책임을 품성의 언어에서 절차의 언어로 옮기는 장치가 고통을 줄인다.",
  "Conclusion ⑤: the practical prescription is therefore to treat work 'less as sacred, more as contract': a contract sets scope, changes and price and does not turn failures outside the scope into failures of character, and devices that move responsibility from the language of character to the language of procedure — change-of-scope procedures that reset schedule and price when specifications change, or rulings that a company answers for what its AI says — reduce the pain.",
  "Вывод ⑤: поэтому практический рецепт — относиться к работе «менее как к святыне, более как к договору»: договор определяет объём, изменения и цену и не превращает провалы за пределами объёма в провалы личности, а механизмы, переносящие ответственность с языка характера на язык процедуры, — процедуры изменения задания, пересматривающие сроки и цену при смене спецификаций, или решения о том, что компания отвечает за слова своего ИИ, — уменьшают боль.",
  "结论⑤：因此，实践上的处方是把工作“少当作神圣之事，多当作契约”：契约规定范围、变更与报酬，不把范围外的失败变成人格的失败；而像规格变更时重新确定工期与报酬的任务变更程序、判定公司要为其AI所言负责的裁决那样，把责任从品性的语言移到程序的语言的机制，能减轻痛苦。",
  "結論⑤：だから実践的な処方は仕事を「より神聖でなく、より契約らしく」扱うことである。契約は範囲・変更・対価を定め、範囲外の失敗を人格の失敗にしない。仕様が変われば日程と対価を決め直す課業変更の手続や、会社が自社のAIの言葉に責任を負うという判断のように、責任を品性の言葉から手続の言葉へ移す仕組みが苦しみを減らす。"]),
 s("D",[3,17,21],["결론 ⑥: 이것은 개인에게도 양날이다: 일의 평가를 인격에 대한 판결이 아니라 계약 이행에 대한 평가로 받아들이는 편이 더 정확하고 덜 다치지만, 계약을 지키는 일—지연을 일찍 알리고, 변경을 기록하고, 할 수 없는 것은 할 수 없다고 말하는 것—은 계약 당사자의 몫으로 남는다.",
  "Conclusion ⑥: this cuts both ways for individuals: it is more accurate and less wounding to take an evaluation of one's work as a judgement on contract performance rather than a verdict on one's character, but keeping the contract — flagging delays early, recording changes, and saying that what cannot be done cannot be done — remains the party's own share.",
  "Вывод ⑥: для человека это обоюдоострый меч: точнее и менее болезненно воспринимать оценку работы как суждение об исполнении договора, а не приговор личности, но соблюдение договора — заранее сообщать о задержках, фиксировать изменения и говорить, что невыполнимое невыполнимо, — остаётся долей самой стороны.",
  "结论⑥：这对个人也是双刃剑：把对工作的评价当作对履约的评价、而非对人格的判决，更准确也更少受伤；但守约——及早告知延误、记录变更、把做不到的事说成做不到——仍是契约当事人自己的份。",
  "結論⑥：これは個人にとっても諸刃である。仕事の評価を人格への判決ではなく契約の履行への評価として受け止める方が正確で傷つきにくいが、契約を守ること—遅れを早めに知らせ、変更を記録し、できないことはできないと言うこと—は契約当事者の取り分として残る。"]),
 s("D",[80,26,30],["결론 ⑦: AI 시대에 노동 신성론은 약해지기보다 강해질 가능성이 크다: AI가 산출을 값싸게 만들수록 '사람이 한 일'은 희소한 지위재가 되고, 일자리를 지킨 사람에게는 더 높은 헌신이, 잃은 사람에게는 '일하지 않는 자'의 낙인이 붙는 비대칭이 생길 수 있다.",
  "Conclusion ⑦: in the AI era the sacredness of work is more likely to strengthen than weaken: the cheaper AI makes output, the more 'work done by a person' becomes a scarce status good, and an asymmetry may emerge in which those who keep jobs are asked for ever more devotion while those who lose them carry the stigma of 'those who do not work'.",
  "Вывод ⑦: в эпоху ИИ идея святости труда скорее усилится, чем ослабнет: чем дешевле ИИ делает продукт, тем больше «сделанное человеком» становится редким статусным благом, и может возникнуть асимметрия, при которой от сохранивших работу требуют всё большей преданности, а потерявшие её несут клеймо «тех, кто не работает».",
  "结论⑦：在AI时代，劳动神圣论更可能增强而非减弱：AI让产出越便宜，“人做的工作”就越成为稀缺的地位品，于是可能出现一种不对称——保住工作的人被要求更高的奉献，失去工作的人则被贴上“不劳动者”的标签。",
  "結論⑦：AI時代に労働神聖論は弱まるより強まる可能性が高い。AIが産出を安くするほど「人がした仕事」は希少な地位財になり、職を守った人にはより高い献身が、失った人には「働かざる者」の烙印がつく非対称が生まれうる。"],null,"M"),
 s("D",[79,77,72],["결론 ⑧: 그러므로 '노동은 신성한가'는 잘못 세운 질문이다: 맞는 질문은 '일이 지금 독점하는 소득·인정·시간 구조를 일 없이도 누가, 어떻게 공급할 것인가'이며, 이 보고서가 살펴본 어느 나라도 그 답을 제도로 갖고 있지 않다; 그 답이 나오기 전까지 일을 신성하다고 부르는 말은 위로가 아니라 규율로 작동할 것이다.",
  "Conclusion ⑧: 'is work sacred?' is therefore the wrong question: the right one is 'who will supply, and how, the income, recognition and time structure that work now monopolises, without work?', and none of the countries examined here has an institutional answer; until there is one, calling work sacred will function not as comfort but as discipline.",
  "Вывод ⑧: поэтому «священен ли труд?» — неверно поставленный вопрос; верный — «кто и как будет без работы обеспечивать доход, признание и структуру времени, которые сейчас монополизирует работа?», и ни у одной из рассмотренных стран нет институционального ответа; пока его нет, слова о святости труда будут работать не как утешение, а как дисциплина.",
  "结论⑧：因此，“劳动是否神圣”是一个问错了的问题；正确的问题是“工作如今垄断的收入、认可与时间结构，在没有工作的情况下由谁、以何种方式供给”，而本报告考察的国家中没有一个在制度上有答案；在答案出现之前，称工作为神圣的话语将作为规训而非安慰发挥作用。",
  "結論⑧：したがって「労働は神聖か」は立て方を誤った問いである。正しい問いは「仕事が今独占している所得・承認・時間の構造を、仕事なしに誰がどう供給するのか」であり、本報告が見たどの国もその答えを制度として持っていない。その答えが出るまで、仕事を神聖と呼ぶ言葉は慰めではなく規律として働くだろう。"]),

let SENS=null,SENSREG=null,sensBusy=false;

function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}

 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));

 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

$("#langSeg").innerHTML=LANGS.map(l=>`<button data-l="${l}" title="${esc(I18N[l].langName)}">${l==="zh"?"中文":l.toUpperCase()}</button>`).join("");
$$("#langSeg button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;LS.set("rp_lang_manual",st.lang);keepPos(render);});
$("#bDetail").onclick=()=>{st.mode="detail";LS.set("rp_mode","detail");keepPos(render);};
$("#bConcise").onclick=()=>{st.mode="concise";LS.set("rp_mode","concise");keepPos(render);};
$("#bG").onclick=()=>{st.gmode=!st.gmode;LS.set("rp_g",st.gmode?"1":"0");document.body.classList.toggle("gmode",st.gmode);$("#bG").setAttribute("aria-pressed",st.gmode);};
$("#bTheme").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";LS.set("rp_theme",st.theme);document.documentElement.dataset.theme=st.theme;$("#bTheme").textContent=st.theme==="dark"?"☀︎":"☾";};
$("#bPrint").onclick=()=>{if(st.mode!=="detail"){st.mode="detail";render();}setTimeout(()=>window.print(),200);};
$("#tocbtn").onclick=()=>$("#toc").classList.toggle("mob");
$("#toc").addEventListener("click",e=>{if(e.target.closest("a"))$("#toc").classList.remove("mob");});
$("#dClose").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
// boot: run global default MCMC (fixed seed) so numbers in text are reproducible
render();
if(autoLang)setTimeout(()=>toast(T("langAuto")+" · "+I18N[st.lang].langName),600);
setTimeout(()=>{const t0=performance.now();MCG=runMCMC({region:"global"});MCG.ms=performance.now()-t0;MC=MCG;
 ALLREG={};Object.keys(REGIONS).forEach(r=>{ALLREG[r]=r==="global"?MCG:runMCMC({region:r});});render();},30);
})();
