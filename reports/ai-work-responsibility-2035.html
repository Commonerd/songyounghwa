 "In an experiment where 26 UK general practitioners saw simulated decision-support advice across 20 prescribing scenarios, they changed prescriptions in 22.5% of scenarios and accuracy rose from 50.38% to 58.27%, but automation bias — switching from a correct to an incorrect prescription because of wrong advice — occurred in 5.2% of all cases. The sample is small and the scenarios hypothetical.",
 "В эксперименте 26 британских врачей общей практики получали смоделированные подсказки системы поддержки решений в 20 сценариях назначения: они меняли назначение в 22,5% сценариев, точность выросла с 50,38% до 58,27%, но смещение в пользу автоматики — смена верного назначения на неверное из-за ошибочной подсказки — возникло в 5,2% случаев. Выборка мала, сценарии гипотетические.",
 "在26名英国全科医生于20个处方情景中接受模拟决策支持建议的实验中，接受建议后改变处方的比例为22.5%，正确率从50.38%升至58.27%，但因错误建议把正确处方改错的自动化偏差占全部病例的5.2%。样本小、情景为假设。",
 "英国の一般医26人が処方シナリオ20件で模擬の意思決定支援の助言を受けた実験で、助言後に処方を変えた割合は22.5%、正答率は50.38%から58.27%に上がったが、正しい処方を誤った助言のせいで変えた自動化バイアスは全体の5.2%だった。標本が小さく仮想シナリオである。"],
["AI가 전체 정확도를 높이면서도 새로운 오류를 만들고, 그 오류의 책임이 사람에게 돌아가는 구조의 수치 근거로 쓴다.","Used as numeric evidence of the structure in which AI raises overall accuracy yet creates new errors whose blame falls on the human.","Используется как числовое свидетельство структуры, где ИИ повышает общую точность, но порождает новые ошибки, вина за которые ложится на человека.","作为AI提高整体准确率却制造新错误、且错误责任落到人身上之结构的数字依据。","AIが全体の正確さを高めつつ新たな誤りを生み、その誤りの責任が人に帰る構造の数値的根拠として使う。"]);

E(36,"A","q1",2015,"Berkeley J. Dietvorst, Joseph P. Simmons & Cade Massey, Journal of Experimental Psychology: General 144(1) (2015)","Algorithm aversion: people erroneously avoid algorithms after seeing them err","https://pubmed.ncbi.nlm.nih.gov/25401381/",
"people more quickly lose confidence in algorithmic than human forecasters",
["5개 실험에서 사람들은 알고리즘이 실수하는 것을 본 뒤, 같은 실수를 한 사람보다 알고리즘을 더 빨리 불신했고 더 나은 알고리즘 대신 열등한 사람 예측자를 골랐다. 실험 과제가 예측에 한정된다.",
 "Across five studies, after seeing an algorithm err people lost confidence in it faster than in a human making the same mistake, and chose an inferior human forecaster over a better algorithm. The tasks are limited to forecasting.",
 "В пяти исследованиях, увидев ошибку алгоритма, люди теряли доверие к нему быстрее, чем к человеку с той же ошибкой, и выбирали худшего человека-прогнозиста вместо лучшего алгоритма. Задачи ограничены прогнозированием.",
 "五项研究显示，人们看到算法出错后，比对犯同样错误的人更快失去信任，并选择较差的人类预测者而非更好的算法。实验任务限于预测。",
 "5つの実験で、人はアルゴリズムが間違えるのを見た後、同じ間違いをした人よりアルゴリズムを早く信頼しなくなり、より良いアルゴリズムより劣った人の予測者を選んだ。実験課題は予測に限られる。"],
["사람이 AI 실패에 대해 이중 기준을 적용해, 감독자에게 'AI를 왜 믿었나'라는 비난과 'AI를 왜 안 썼나'라는 비난이 동시에 걸릴 수 있다는 추론(D)에 쓴다.","Used for the inference (D) that people apply double standards to AI failure, so supervisors can face both 'why did you trust the AI?' and 'why didn't you use it?'.","Используется для вывода (D) о двойных стандартах к ошибкам ИИ: надзирающего могут упрекать и «зачем доверился ИИ?», и «почему не использовал?».","用于推论（D）：人们对AI失败采取双重标准，监督者可能同时面临“为何信AI”与“为何不用AI”的指责。","人がAIの失敗に二重基準を当てはめ、監督者が「なぜAIを信じたのか」と「なぜAIを使わなかったのか」の両方で非難されうるという推論（D）に使う。"]);

E(37,"A","q1",2024,"M. Joo, PLOS ONE (2024)","It's the AI's fault, not mine: Mind perception increases blame attribution to AI","https://europepmc.org/article/MED/39693294",
"cautioning against the potential misuse of AI as a scapegoat",
["세 연구에서 AI에 사람 같은 마음이 있다고 지각할수록 도덕적 위반의 책임을 AI에 더 돌리고, 관련 회사 같은 인간 이해관계자의 책임은 덜 묻는 경향을 보였다. 시나리오 기반 실험이며 표본 국가는 초록에서 확인하지 못했다.",
 "Across three studies, the more people perceived a human-like mind in AI, the more they blamed AI for moral transgressions and the less they blamed human stakeholders such as the company involved. It uses scenario-based experiments; the sample country could not be confirmed from the abstract.",
 "В трёх исследованиях чем сильнее люди приписывали ИИ человекоподобный разум, тем больше винили ИИ в моральных нарушениях и тем меньше — людей, например причастную компанию. Эксперименты на сценариях; страна выборки по аннотации не установлена.",
 "三项研究显示，人们越认为AI具有类人心智，就越把道德违规的责任归于AI，并越少追究相关公司等人类利益相关者。基于情景实验；样本国家未能从摘要确认。",
 "3つの研究で、AIに人のような心があると知覚するほど道徳的違反の責任をAIに帰し、関与した会社のような人間の利害関係者の責任は問わない傾向を示した。シナリオに基づく実験で、標本の国は抄録から確認できなかった。"],
["'AI가 정했다'는 해명으로 책임이 증발하는 'AI 희생양' 위험의 실험 근거로 쓴다.","Used as experimental evidence of the 'AI scapegoat' risk, in which 'the AI decided' makes responsibility evaporate.","Используется как экспериментальное свидетельство риска «ИИ — козёл отпущения», когда фраза «решил ИИ» растворяет ответственность.","作为“AI决定的”说辞使责任蒸发之“AI替罪羊”风险的实验依据。","「AIが決めた」という弁明で責任が蒸発する「AIのスケープゴート」の危険の実験的根拠として使う。"]);

E(38,"A","q1",2024,"B. D. Earp, S. Porsdam Mann, P. Liu et al., Annals of the New York Academy of Sciences (2024)","Credit and blame for AI-generated content: Effects of personalization in four countries","https://europepmc.org/article/MED/39585780",
"LLM type did not significantly affect blame attributions for harmful outputs",
["미국·영국·중국·싱가포르의 대표 표본 1,802명 사전등록 실험에서, 개인화 LLM을 쓴 사용자에게 좋은 결과의 공은 더 주지만 해로운 결과의 비난은 LLM 종류와 관계없이 사용자에게 돌아갔다(중국 일부 예외). 영국 응답자는 LLM을 쓴 경우 더 비난했다. 시나리오 판단이라 실제 직장 평가와는 다를 수 있다.",
 "In a preregistered experiment with representative samples (N=1,802) in the US, UK, China and Singapore, users of personalised LLMs got more credit for good outputs, but blame for harmful outputs fell on users regardless of LLM type (with a partial exception in China); UK participants blamed users of any LLM more. These are scenario judgements and may differ from real workplace evaluation.",
 "В предрегистрированном эксперименте на репрезентативных выборках (N=1802) в США, Великобритании, Китае и Сингапуре пользователям персонализированных LLM приписывали больше заслуг за хорошие результаты, но вину за вредные результаты возлагали на пользователей независимо от типа LLM (частичное исключение — Китай); британцы сильнее винили использовавших любую LLM. Это оценки сценариев, на работе может быть иначе.",
 "在美、英、中、新加坡代表性样本（N=1,802）的预先注册实验中，使用个性化LLM者在好结果上获得更多功劳，但有害结果的指责不论LLM类型都落在使用者身上（中国部分例外）；英国受访者对使用任何LLM者指责更多。属情景判断，可能与真实职场评价不同。",
 "米・英・中・シンガポールの代表標本1,802人の事前登録実験で、個人化LLMを使った利用者に良い結果の功績はより多く与えたが、有害な結果の非難はLLMの種類に関係なく利用者に向かった（中国で一部例外）。英国の回答者はLLMを使った場合により非難した。シナリオ判断なので実際の職場評価とは異なりうる。"],
["AI를 쓴 노동자는 공은 나눠 갖고 비난은 혼자 지는 '비대칭'의 국제 비교 근거로 쓴다.","Used as cross-country evidence of the asymmetry whereby AI-using workers share credit but bear blame alone.","Используется как межстрановое свидетельство асимметрии: работник с ИИ делит заслуги, но вину несёт один.","作为“使用AI的劳动者功劳共享、指责独担”不对称性的国际比较依据。","AIを使った労働者は功績は分け合い非難は一人で負うという「非対称」の国際比較の根拠として使う。"]);

E(39,"B","q1",2022,"C. Maasland & K. S. Weißmüller, Frontiers in Psychology (2022)","Blame the Machine? Insights From an Experiment on Algorithm Aversion and Blame Avoidance in Computer-Aided Human Resource Management","https://europepmc.org/article/MED/35693517",
"Respondents' aversion to algorithms dominates blame avoidance by delegation.",
["독일의 고학력 청년 288명 2×2 무작위 실험에서 해고 같은 불쾌한 인사 결정을 승진보다 알고리즘에 맡기려는 경향이 있었지만, 이는 알고리즘을 미리 시험할 기회와 신뢰 수준에 크게 좌우됐고 전체적으로는 알고리즘 회피가 비난 회피를 앞섰다. 표본이 작고 학생 비중이 높다.",
 "In a 2×2 randomised experiment with 288 highly educated young people in Germany, respondents tended to delegate unpleasant HR decisions such as dismissals rather than promotions to an algorithm, but this depended strongly on the chance to pretest it and on trust; overall, algorithm aversion outweighed blame avoidance. The sample is small and student-heavy.",
 "В рандомизированном эксперименте 2×2 с 288 молодыми людьми с высшим образованием в Германии респонденты охотнее передавали алгоритму неприятные кадровые решения (увольнения), чем повышения, но это сильно зависело от возможности опробовать алгоритм и доверия; в целом неприятие алгоритмов перевесило избегание вины. Выборка мала, много студентов.",
 "在德国288名高学历年轻人参与的2×2随机实验中，受访者倾向于把解雇等不愉快的人事决定（而非晋升）交给算法，但这在很大程度上取决于能否预先测试算法和信任程度；总体上算法厌恶压过了借委托回避指责。样本小、学生占比高。",
 "ドイツの高学歴の若者288人の2×2無作為化実験で、解雇のような不快な人事決定を昇進よりアルゴリズムに任せる傾向があったが、それはアルゴリズムを事前に試す機会と信頼の水準に大きく左右され、全体ではアルゴリズム回避が非難回避を上回った。標本が小さく学生の比率が高い。"],
["불쾌한 결정을 기계에 넘겨 비난을 피하려는 유인이 실재한다는 실험 근거로 쓴다.","Used as experimental evidence that the incentive to hand unpleasant decisions to machines to avoid blame is real.","Используется как экспериментальное свидетельство реального стимула передавать неприятные решения машине, чтобы избежать вины.","作为“把不愉快决定交给机器以回避指责”的诱因确实存在的实验依据。","不快な決定を機械に渡して非難を避けようとする誘因が実在するという実験的根拠として使う。"]);

E(40,"B","io",2019,"National Transportation Safety Board (US), Highway Accident Report NTSB/HAR-19/03 (2019)","Collision Between Vehicle Controlled by Developmental Automated Driving System and Pedestrian, Tempe, Arizona, March 18, 2018","https://www.ntsb.gov/investigations/AccidentReports/Reports/HAR1903.pdf",
"all a consequence of its inadequate safety culture",
["2018년 우버 자율주행 시험차 보행자 사망 사고에서 NTSB는 휴대전화에 시선을 빼앗긴 안전 운전자의 감시 실패를 '추정 원인'으로 들었지만, 우버의 부실한 위험 평가, 운전자 감독 부실, 자동화 안주를 다루는 장치 부재를 '부적절한 안전 문화'의 결과인 기여 요인으로, 애리조나 교통부의 감독 부족도 기여 요인으로 꼽았다. 시스템은 충돌 5.6초 전 보행자를 감지했지만 설계상 비상제동을 하지 않고 운전자 개입에 의존했다.",
 "In the 2018 fatal crash of an Uber automated test vehicle, the NTSB named the safety operator's failure to monitor, due to phone distraction, as probable cause, but listed Uber's inadequate risk assessment, ineffective oversight of operators and lack of mechanisms for automation complacency — all consequences of an inadequate safety culture — as contributing, along with the Arizona transport department's insufficient oversight. The system detected the pedestrian 5.6 seconds before impact but by design did not brake, relying on the operator.",
 "В смертельной аварии беспилотного тестового автомобиля Uber в 2018 г. NTSB назвал вероятной причиной то, что оператор безопасности, отвлечённый телефоном, не следил за дорогой, но сопутствующими факторами — неадекватную оценку рисков Uber, слабый надзор за операторами и отсутствие мер против самоуспокоенности, «всё следствие неадекватной культуры безопасности», а также недостаточный надзор транспортного ведомства Аризоны. Система обнаружила пешехода за 5,6 с до удара, но по конструкции не тормозила, полагаясь на оператора.",
 "在2018年优步自动驾驶测试车撞死行人的事故中，NTSB将因手机分心的安全驾驶员监视失败列为“可能原因”，但把优步风险评估不足、对驾驶员监督无效、缺乏应对自动化自满的机制列为“均源于不当安全文化”的促成因素，并将亚利桑那州交通部监管不足列为促成因素。系统在撞击前5.6秒检测到行人，但按设计不进行紧急制动，而依赖驾驶员干预。",
 "2018年のウーバー自動運転試験車の歩行者死亡事故で、NTSBは携帯電話に気を取られた安全運転者の監視の失敗を「推定原因」としたが、ウーバーの不十分なリスク評価、運転者監督の不備、自動化への安住に対処する仕組みの欠如を「不適切な安全文化」の結果である寄与要因とし、アリゾナ州交通局の監督不足も寄与要因に挙げた。システムは衝突5.6秒前に歩行者を検知したが、設計上緊急ブレーキをかけず運転者の介入に頼った。"],
["'추정 원인은 개인, 기여 요인은 조직'이라는 책임의 층위를 보여 주는 1차 조사 보고서로 쓴다.","Used as the primary investigation report showing layered responsibility: probable cause on the individual, contributing factors in the organisation.","Используется как первичный доклад расследования, показывающий слои ответственности: вероятная причина — человек, сопутствующие факторы — организация.","作为展示“可能原因在个人、促成因素在组织”之责任层次的一手调查报告。","「推定原因は個人、寄与要因は組織」という責任の層を示す一次調査報告として使う。"]);

// ===== Evidence 41–55: inquiries, AI-attributed layoffs, laws and rules (EU, UK, US, Korea, Japan, Russia), OECD =====
E(41,"B","io",2025,"Post Office Horizon IT Inquiry (Chair: Sir Wyn Williams), Report Volume 1, HC 1119 (ordered printed 8 Jul 2025)","Post Office Horizon IT Inquiry Report: Volume 1 — Redress and the human impact of the Horizon scandal","https://www.postofficehorizoninquiry.org.uk/volume-1-post-office-horizon-it-inquirys-final-report",
"as a consequence of Horizon showing an illusory shortfall in branch accounts",
["영국 우체국 회계 시스템 호라이즌의 결함 때문에 수백 명의 우체국 운영자가 절도·사기 혐의를 받은 사건의 법정 조사 1권으로, 피해 회복과 인간적 피해를 다룬다. 가족에 따르면 호라이즌이 보여 준 '허상의 부족분' 때문에 목숨을 끊은 사람이 운영자 6명과 그 밖의 7명이고, 최소 59명이 자살을 생각했으며 그중 10명이 시도했다. 원인 규명과 책임 판단은 이후 권에서 다룬다.",
 "Volume 1 of the statutory inquiry into how hundreds of Post Office operators were accused of theft and fraud because of faults in the Horizon accounting system; it covers redress and human impact. According to families, six former postmasters and seven others took their own lives because Horizon showed an illusory shortfall; at least 59 people contemplated suicide and ten attempted it. Causes and culpability are left to later volumes.",
 "Первый том официального расследования о том, как сотни операторов почтовых отделений обвинили в краже и мошенничестве из-за сбоев учётной системы Horizon; посвящён возмещению и человеческому ущербу. По словам семей, шесть бывших почтмейстеров и ещё семь человек покончили с собой из-за «мнимой недостачи», показанной Horizon; не менее 59 человек думали о самоубийстве, 10 пытались. Причины и вина — в следующих томах.",
 "英国邮局会计系统Horizon的缺陷导致数百名邮局经营者被控盗窃与欺诈，这是该法定调查的第一卷，涉及赔偿与人身伤害。据家属称，因Horizon显示的“虚假短缺”而轻生者有前邮局经营者6人及其他7人，至少59人曾想自杀，其中10人尝试过。原因与责任认定留待后续各卷。",
 "英国郵便局の会計システム「ホライズン」の欠陥のために数百人の郵便局運営者が窃盗・詐欺の容疑をかけられた事件の法定調査の第1巻で、被害回復と人的被害を扱う。家族によれば、ホライズンが示した「見かけの不足額」のために命を絶ったのは元運営者6人とその他7人で、少なくとも59人が自殺を考え、うち10人が試みた。原因究明と責任の判断は後の巻で扱う。"],
["시스템 결함의 책임이 가장 아래 개인에게 형사 책임으로까지 전가된 최악의 사례로 쓴다.","Used as the worst case in which responsibility for a system fault was shifted to the lowest-level individuals, even as criminal liability.","Используется как худший случай, когда ответственность за сбой системы переложили на людей нижнего звена — вплоть до уголовной.","作为系统缺陷的责任被转嫁到最底层个人、甚至成为刑事责任的最严重案例。","システム欠陥の責任が最下層の個人に刑事責任まで転嫁された最悪の事例として使う。"]);

E(42,"B","io",2023,"Royal Commission into the Robodebt Scheme (Australia; Commissioner Catherine Holmes), Report (7 Jul 2023; updated 11 Jul 2023)","Report of the Royal Commission into the Robodebt Scheme","https://robodebt.royalcommission.gov.au/publications/report",
"business rules and algorithms should be made available, to enable independent expert scrutiny",
["호주 복지 수급자에게 자동 소득 대조로 부채를 매긴 '로보데트' 제도에 대한 왕립위원회 보고서로, 57개 권고를 냈다. 자동화 결정에는 이의 경로와 알고리즘 공개, 감시·감사 기구가 필요하고, 현장 직원과의 진정한 협의와 피드백 절차가 필요하다고 권고했다. 사례로만 쓰고 국가 비교표에는 넣지 않는다.",
 "The royal commission report on 'Robodebt', which raised debts against Australian welfare recipients through automated income matching, made 57 recommendations. It calls for review paths and published algorithms for automated decisions, a body to monitor and audit them, and genuine consultation and feedback processes with frontline staff. It is used as a case only, not in the country table.",
 "Доклад королевской комиссии о схеме «Рободолг», начислявшей долги австралийским получателям пособий через автоматическую сверку доходов; 57 рекомендаций. Требует путей обжалования и раскрытия алгоритмов для автоматических решений, органа мониторинга и аудита, подлинных консультаций и обратной связи с сотрудниками на передовой. Используется только как кейс, не в таблице стран.",
 "澳大利亚通过自动收入比对向福利领取者追债的“机器人追债”制度的皇家委员会报告，提出57项建议：自动化决定需要申诉途径与算法公开、监测与审计机构，并需与一线员工真诚协商和建立反馈程序。仅作为案例使用，不列入国家比较表。",
 "オーストラリアの福祉受給者に自動の所得照合で債務を課した「ロボデット」制度に関する王立委員会の報告書で、57の勧告を出した。自動化された決定には異議の経路とアルゴリズムの公開、監視・監査機関が必要で、現場職員との真の協議とフィードバック手続きが必要だと勧告した。事例としてだけ使い、国の比較表には入れない。"],
["공공 자동화에서 현장 직원과 수급자가 함께 피해자가 된 구조와 제도적 처방의 근거로 쓴다.","Used as evidence of a structure in which frontline staff and recipients both became victims of public automation, and of the institutional remedies.","Используется как свидетельство структуры, где и сотрудники, и получатели стали жертвами государственной автоматизации, и институциональных средств исправления.","作为公共自动化中一线员工与受领者一同成为受害者之结构及制度处方的依据。","公共の自動化で現場職員と受給者がともに被害者となった構造と制度的処方の根拠として使う。"]);

E(43,"C","press",2026,"SiliconANGLE (Maria Deutscher), 26 Nov 2026, citing Bloomberg","SAP reportedly plans to lay off 10,000+ employees amid AI push","https://siliconangle.com/2026/11/26/sap-reportedly-plans-to-lay-off-10000-employees-amid-ai-push",
"SAP continuously reviews its organization to ensure it remains aligned",
["블룸버그 보도를 인용해 SAP가 인력의 9%가 넘는 1만 명 이상 감원을 검토하며, 이것이 제품에 AI 기능을 더 넣으려는 노력과 연결돼 있다고 전했다. 회사의 공식 발표가 아니라 '보도에 따르면'이고 규모도 바뀔 수 있다. 원 블룸버그 기사는 열지 못했다.",
 "Citing Bloomberg, it reports SAP is weighing cuts of at least 10,000 jobs — over 9% of its workforce — linked to efforts to add more AI features to its products. It is 'reportedly', not a company announcement, and the scope may change; the original Bloomberg article was not opened.",
 "Со ссылкой на Bloomberg сообщает, что SAP рассматривает сокращение не менее 10 000 сотрудников (более 9% персонала) в связи с усилиями добавить больше функций ИИ в продукты. Это «по сообщениям», а не заявление компании, масштаб может измениться; оригинал Bloomberg не открыт.",
 "援引彭博报道称，SAP正考虑裁员至少1万人（超过员工总数的9%），这与其在产品中加入更多AI功能的努力相关。属“据报道”而非公司公告，规模可能变化；未能打开彭博原文。",
 "ブルームバーグの報道を引用し、SAPが人員の9%を超える1万人以上の削減を検討しており、それが製品にAI機能をさらに入れる取り組みと結びついていると伝えた。会社の公式発表ではなく「報道によれば」で、規模も変わりうる。ブルームバーグの原記事は開けなかった。"],
["보고서 작성 이틀 전의 뉴스 걸이로, 구조조정의 이유로 'AI'가 거론되는 흐름을 보여 주는 데만 쓴다.","Used only as a news hook from two days before writing, showing how 'AI' is cited as a reason for restructuring.","Используется лишь как новостной повод за два дня до написания — пример того, как «ИИ» называют причиной реструктуризации.","仅作为撰写前两天的新闻引子，显示“AI”被列为重组理由的趋势。","執筆2日前のニュースの導入として、構造調整の理由に「AI」が挙げられる流れを示すことにだけ使う。"]);

E(44,"B","io",2024,"European Union, Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal 12 Jul 2024","Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence","https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
"assign human oversight to natural persons who have the necessary competence, training and authority",
["제14조는 고위험 AI를 사람이 효과적으로 감독할 수 있게 설계하고, 감독자가 자동화 편향의 가능성을 인식하며 출력을 무시·번복하거나 시스템을 멈출 수 있게 하라고 정한다. 제26조는 배치자(deployer)가 역량·훈련·권한과 지원을 갖춘 사람에게 감독을 맡기고 로그를 보관하도록 한다. 원문은 2026년 8월 2일 전면 적용을 정했으나, 2026년 7월 디지털 옴니버스 개정(근거 56)으로 고용 등 부속서 III 고위험 AI 의무의 적용은 2027년 12월 2일로 미뤄졌다.",
 "Article 14 requires high-risk AI to be designed for effective human oversight, with overseers aware of possible automation bias and able to disregard, override or reverse outputs or stop the system. Article 26 requires deployers to assign oversight to people with the necessary competence, training, authority and support, and to keep logs. The original text set general application from 2 August 2026, but the July 2026 Digital Omnibus amendment (evidence 56) moved high-risk obligations for Annex III areas such as employment to 2 December 2027.",
 "Статья 14 требует проектировать высокорисковый ИИ для эффективного человеческого надзора, чтобы надзирающие знали о возможном смещении в пользу автоматики и могли игнорировать, отменять результаты или останавливать систему. Статья 26 обязывает эксплуатантов поручать надзор людям с необходимыми компетенцией, подготовкой, полномочиями и поддержкой и хранить журналы. Исходный текст установил общее применение со 2 августа 2026 г., но поправка «Цифровой омнибус» июля 2026 г. (источник 56) перенесла обязанности для высокорисковых систем приложения III, включая занятость, на 2 декабря 2027 г.",
 "第14条要求高风险AI被设计为可由人有效监督，监督者应意识到自动化偏差的可能，并能无视、推翻输出或停止系统。第26条要求部署者把监督交给具备必要能力、培训、权限与支持的人并保存日志。原文规定自2026年8月2日起全面适用，但2026年7月的“数字综合修订”（依据56）把就业等附件III高风险AI义务的适用推迟至2027年12月2日。",
 "第14条は高リスクAIを人が効果的に監督できるよう設計し、監督者が自動化バイアスの可能性を認識し、出力を無視・覆したりシステムを止めたりできるようにと定める。第26条は導入者（デプロイヤー）が能力・訓練・権限と支援を備えた人に監督を任せ、ログを保管するよう求める。原文は2026年8月2日の全面適用を定めたが、2026年7月のデジタル・オムニバス改正（根拠56）で雇用など附属書IIIの高リスクAIの義務の適用は2027年12月2日に延期された。"],
["'사람의 감독'에 권한과 자원을 붙여 비난 스펀지가 되지 않게 하려는 가장 구체적인 법 조문으로 쓴다.","Used as the most concrete legal text that attaches authority and resources to 'human oversight' so it does not become a blame sponge.","Используется как самая конкретная правовая норма, придающая «человеческому надзору» полномочия и ресурсы, чтобы он не стал «губкой вины».","作为给“人的监督”配上权限与资源、使其不成为指责海绵的最具体法律条文。","「人の監督」に権限と資源をつけ、非難のスポンジにならないようにする最も具体的な法の条文として使う。"]);

E(45,"B","io",2024,"European Union, Directive (EU) 2024/2831 on improving working conditions in platform work","Directive (EU) 2024/2831 (Platform Work Directive)","https://eur-lex.europa.eu/eli/dir/2024/2831/oj",
"shall enjoy protection from dismissal or its equivalent, disciplinary measures",
["제10조는 플랫폼이 자동 감시·결정 시스템을 감독할 충분한 인력을 두고, 감독자가 자동 결정을 뒤집을 권한을 갖되 그 기능을 행사했다고 해고·징계 등 불이익을 받지 않도록 보호하라고 정한다. 제11조는 자동 결정에 대한 설명과 담당자 접촉, 서면 사유를 보장한다. 회원국 이행 기한은 2026년 12월 2일이며 플랫폼 노동에만 적용된다.",
 "Article 10 requires platforms to have sufficient staff to oversee automated monitoring and decision systems, with authority to override automated decisions and protection from dismissal, disciplinary measures and other adverse treatment for exercising that function. Article 11 guarantees explanations, a contact person and written reasons for automated decisions. Member states must transpose it by 2 December 2026, and it applies only to platform work.",
 "Статья 10 требует от платформ достаточного персонала для надзора за автоматическими системами мониторинга и решений, с полномочием отменять автоматические решения и защитой от увольнения, дисциплинарных мер и иного ущерба за выполнение этой функции. Статья 11 гарантирует объяснения, контактное лицо и письменные причины. Срок транспонирования — 2 декабря 2026 г.; действует только для платформенного труда.",
 "第10条要求平台配备足够人员监督自动监控与决策系统，监督者有权推翻自动决定，且不因行使该职能而遭解雇、纪律处分等不利对待。第11条保障对自动决定的解释、联系负责人与书面理由。成员国转化期限为2026年12月2日，仅适用于平台劳动。",
 "第10条はプラットフォームが自動監視・決定システムを監督する十分な人員を置き、監督者が自動決定を覆す権限を持ち、その機能を行使したことで解雇・懲戒など不利益を受けないよう保護せよと定める。第11条は自動決定への説明と担当者との接触、書面の理由を保障する。加盟国の国内法化期限は2026年12月2日で、プラットフォーム労働にだけ適用される。"],
["감독자를 비난에서 보호하는 조항이 실제 법에 들어간 첫 사례로 쓴다.","Used as the first case of a provision protecting overseers from blame entering actual law.","Используется как первый случай, когда норма, защищающая надзирающих от наказания, вошла в действующее право.","作为保护监督者免受指责的条款写入实际法律的首例。","監督者を非難から守る条項が実際の法に入った最初の事例として使う。"]);

E(46,"B","io",2024,"European Union, Directive (EU) 2024/2853 on liability for defective products","Directive (EU) 2024/2853 (Product Liability Directive)","https://eur-lex.europa.eu/eli/dir/2024/2853/oj",
"it includes electricity, digital manufacturing files, raw materials and software",
["개정 제조물책임지침은 '제조물'에 소프트웨어를 명시해, 결함 있는 AI 소프트웨어로 생긴 피해에 무과실 책임의 길을 열었다. 회원국 이행 기한은 2026년 12월 9일이다. 소비자·피해자 배상 규칙이라 직장 내 평가·징계 책임은 다루지 않는다.",
 "The revised Product Liability Directive explicitly includes software in 'product', opening a no-fault route for harm caused by defective AI software. Member states must transpose it by 9 December 2026. As a rule on compensating victims it does not address workplace evaluation or discipline.",
 "Обновлённая директива об ответственности за продукцию прямо включает ПО в понятие «продукт», открывая путь безвиновной ответственности за вред от дефектного ИИ-ПО. Срок транспонирования — 9 декабря 2026 г. Это правило о возмещении вреда; оценку и дисциплину на работе оно не затрагивает.",
 "修订后的产品责任指令在“产品”中明确包括软件，为缺陷AI软件造成的损害开辟无过错责任之路。成员国转化期限为2026年12月9日。属于受害人赔偿规则，不涉及职场评价与纪律责任。",
 "改正製造物責任指令は「製造物」にソフトウェアを明記し、欠陥のあるAIソフトウェアによる被害に無過失責任の道を開いた。加盟国の国内法化期限は2026年12月9日である。被害者への賠償の規則で、職場での評価・懲戒の責任は扱わない。"],
["법적 배상(liability)을 결함 있는 시스템의 공급자에게 두는 방향의 근거로 쓴다.","Used as evidence of the direction of placing legal liability on suppliers of defective systems.","Используется как свидетельство направления, возлагающего правовую ответственность на поставщиков дефектных систем.","作为把法律赔偿责任置于缺陷系统供应者之方向的依据。","法的賠償（ライアビリティ）を欠陥のあるシステムの供給者に置く方向の根拠として使う。"]);

E(47,"B","io",2026,"European Parliament, Legislative Train Schedule — AI Liability Directive 2022/0303(COD) (updated 25 Oct 2026)","AI Liability Directive","https://www.europarl.europa.eu/legislative-train/theme-a-europe-fit-for-the-digital-age/file-ai-liability-directive",
"Proposal officially withdrew in October 2025.",
["2022년 제안된 AI 책임지침(인과관계 추정·증거 공개 명령)은 집행위원회 2025년 작업계획에서 철회가 예고됐고 2025년 10월 공식 철회됐다. 유럽의회의 진행 현황 페이지로, 철회의 구체적 이유는 상세히 적혀 있지 않다.",
 "The AI Liability Directive proposed in 2022 (rebuttable presumption of causality, court-ordered disclosure) was announced for withdrawal in the Commission's 2025 work programme and formally withdrawn in October 2025. This is the Parliament's status page and does not detail the reasons.",
 "Предложенная в 2022 г. директива об ответственности за ИИ (опровержимая презумпция причинной связи, раскрытие доказательств по решению суда) была заявлена к отзыву в программе Комиссии на 2025 г. и официально отозвана в октябре 2025 г. Это страница статуса Европарламента, причины подробно не указаны.",
 "2022年提出的AI责任指令（可反驳的因果推定、法院命令披露证据）在委员会2025年工作计划中预告撤回，并于2025年10月正式撤回。此为欧洲议会的进展页面，未详述撤回理由。",
 "2022年に提案されたAI責任指令（因果関係の推定・証拠開示命令）は欧州委員会の2025年作業計画で撤回が予告され、2025年10月に正式に撤回された。欧州議会の進捗ページで、撤回の具体的理由は詳しく書かれていない。"],
["EU에서도 AI 피해의 민사 책임 규칙이 비어 있다는 근거로 쓴다.","Used as evidence that even in the EU civil-liability rules for AI harm remain a gap.","Используется как довод, что и в ЕС правила гражданской ответственности за вред от ИИ остаются пробелом.","作为即使在欧盟AI损害的民事责任规则也存在空白的依据。","EUでもAIによる被害の民事責任の規則が空白であるという根拠として使う。"]);

E(48,"B","io",2025,"UK legislation.gov.uk, Data (Use and Access) Act 2025 c.18, section 80 (in force generally 5 Feb 2026)","Data (Use and Access) Act 2025, section 80: Automated decision-making","https://www.legislation.gov.uk/ukpga/2025/18/section/80",
"there is no meaningful human involvement in the taking of the decision",
["영국은 GDPR의 자동화 결정 조항을 새 제22A~22D조로 바꿔, '의미 있는 사람의 관여'가 없는 결정을 자동 결정으로 정의하고 정보 제공·의견 진술·사람의 개입·이의 제기 같은 안전장치를 요구했다. 금지에서 안전장치 중심으로 옮겨 간 규칙이라 보호가 약해졌다는 비판도 있을 수 있지만, 이 보고서는 그 논쟁을 따로 검증하지 않았다.",
 "The UK replaced the GDPR's automated-decision article with new Articles 22A–22D, defining automated decisions as those with no meaningful human involvement and requiring safeguards such as information, representations, human intervention and the right to contest. It moves from prohibition towards safeguards; critics may see weaker protection, but this report did not separately verify that debate.",
 "Великобритания заменила статью GDPR об автоматизированных решениях новыми статьями 22A–22D: автоматическим считается решение без значимого участия человека; требуются гарантии — информирование, право высказаться, вмешательство человека и оспаривание. Сдвиг от запрета к гарантиям могут критиковать как ослабление защиты, но этот спор в докладе отдельно не проверялся.",
 "英国以新的第22A至22D条替换GDPR的自动化决定条款，将没有“有意义的人类参与”的决定定义为自动决定，并要求提供信息、陈述意见、人类干预与提出异议等保障。规则从禁止转向保障，可能被批评为保护减弱，但本报告未单独核实这一争论。",
 "英国はGDPRの自動化された決定の条項を新しい第22A〜22D条に替え、「意味のある人の関与」がない決定を自動決定と定義し、情報提供・意見陳述・人の介入・異議申し立てなどの安全装置を求めた。禁止から安全装置中心に移った規則なので保護が弱まったとの批判もありうるが、本報告はその論争を別に検証していない。"],
["'사람이 관여했다'는 형식이 아니라 '의미 있는' 관여를 요구하는 법적 기준으로 쓴다.","Used as a legal standard requiring meaningful rather than formal human involvement.","Используется как правовой стандарт, требующий значимого, а не формального участия человека.","作为要求“有意义的”而非形式上的人类参与的法律标准。","形式的ではなく「意味のある」人の関与を求める法的基準として使う。"]);

E(49,"B","io",2023,"National Institute of Standards and Technology (US), NIST AI 100-1 (Jan 2023)","Artificial Intelligence Risk Management Framework (AI RMF 1.0)","https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf",
"Trustworthy AI depends upon accountability. Accountability presupposes transparency.",
["미국의 자발적 AI 위험관리 체계로, 신뢰할 수 있는 AI의 특성으로 '책임성과 투명성'을 들고 조직이 적절한 책임 메커니즘과 역할·책임을 유지해야 한다고 본다. 법적 구속력이 없는 지침이다.",
 "The US voluntary AI risk-management framework lists 'accountable and transparent' among the characteristics of trustworthy AI and says organisations need appropriate accountability mechanisms, roles and responsibilities. It is non-binding guidance.",
 "Американская добровольная рамка управления рисками ИИ относит «подотчётность и прозрачность» к признакам надёжного ИИ и требует от организаций механизмов подотчётности, ролей и обязанностей. Это необязательное руководство.",
 "美国自愿性的AI风险管理框架，把“问责与透明”列为可信AI的特性，认为组织应维持适当的问责机制与角色职责。属无法律约束力的指南。",
 "米国の自主的なAIリスク管理の枠組みで、信頼できるAIの特性に「説明責任と透明性」を挙げ、組織が適切な説明責任の仕組みと役割・責任を維持すべきだとする。法的拘束力のない指針である。"],
["미국 연방 차원에서는 책임성이 '권고'에 머문다는 비교 근거로 쓴다.","Used as comparative evidence that at US federal level accountability remains a recommendation.","Используется как сравнительный довод, что на федеральном уровне США подотчётность остаётся рекомендацией.","作为美国联邦层面问责仍停留在“建议”的比较依据。","米国の連邦レベルでは説明責任が「推奨」にとどまるという比較の根拠として使う。"]);

E(50,"B","io",2024,"Colorado General Assembly, SB24-205 'Consumer Protections for Artificial Intelligence' (approved 17 May 2024)","SB24-205 Consumer Protections for Artificial Intelligence","https://leg.colorado.gov/bills/sb24-205",
"Providing a consumer with an opportunity to appeal, via human review if technically feasible",
["고용 등 중대한 결정에 쓰이는 고위험 AI의 배치자에게 위험관리, 영향평가, 결정 통지, 정정 기회, 기술적으로 가능하면 사람의 검토를 통한 이의 기회를 의무로 부과한 주법이다. 확인한 의회 요약은 의무 시작을 2026년 2월 1일로 적고 있으며, 이후 시행 연기 여부는 이 페이지에서 확인되지 않았다.",
 "A state law imposing on deployers of high-risk AI used in consequential decisions such as employment duties of risk management, impact assessment, notice, a chance to correct data and an appeal via human review where technically feasible. The legislature's summary dates the duties from 1 February 2026; any later postponement was not confirmed on this page.",
 "Закон штата, обязывающий эксплуатантов высокорискового ИИ в значимых решениях, включая занятость, к управлению рисками, оценке воздействия, уведомлению, возможности исправить данные и обжаловать с проверкой человеком, если это технически осуществимо. Резюме законодателя указывает начало обязанностей с 1 февраля 2026 г.; последующая отсрочка на этой странице не подтверждена.",
 "这是一部州法，要求在雇佣等重大决定中使用高风险AI的部署者承担风险管理、影响评估、决定通知、更正机会，以及在技术可行时通过人工复核提出申诉的义务。已核实的议会摘要写明义务自2026年2月1日起，此后是否延期在该页面未能确认。",
 "雇用など重大な決定に使われる高リスクAIの導入者に、リスク管理、影響評価、決定の通知、訂正の機会、技術的に可能なら人の審査による異議の機会を義務づけた州法である。確認した議会の要約は義務の開始を2026年2月1日としており、その後の施行延期の有無はこのページで確認できなかった。"],
["미국에서는 주·도시 단위로 배치자 의무가 생기고 있다는 근거로 쓴다.","Used as evidence that in the US deployer duties are emerging at state and city level.","Используется как довод, что в США обязанности эксплуатантов появляются на уровне штатов и городов.","作为美国在州与城市层面出现部署者义务的依据。","米国では州・都市の単位で導入者の義務が生まれているという根拠として使う。"]);

E(51,"B","io",2023,"NYC Department of Consumer and Worker Protection, Automated Employment Decision Tools (Local Law 144 of 2021)","Automated Employment Decision Tools (AEDT)","https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page",
"subject to a bias audit within one year of the use of the tool",
["뉴욕시는 채용·승진에 자동화 도구를 쓰려면 1년 안에 편향 감사를 받고 그 정보를 공개하며 지원자·직원에게 사전 통지하도록 했고, 2023년 7월 5일부터 집행했다. 감독기관의 안내 페이지이며, 감사 대상이 좁다는 지적에 대한 평가는 이 보고서가 따로 검증하지 않았다.",
 "New York City requires automated tools used in hiring or promotion to have had a bias audit within one year, publish its information and give prior notice to candidates and employees, with enforcement from 5 July 2023. This is the regulator's guidance page; claims that its scope is narrow were not separately verified.",
 "Нью-Йорк требует, чтобы автоматизированные инструменты найма и продвижения проходили аудит на предвзятость в течение года до использования, сведения публиковались, а кандидаты и сотрудники уведомлялись заранее; применение — с 5 июля 2023 г. Это страница регулятора; критика узкой сферы действия отдельно не проверялась.",
 "纽约市规定，在招聘与晋升中使用自动化工具须在一年内接受偏差审计并公开信息、事先通知求职者与员工，自2023年7月5日起执行。此为监管机构的说明页面，关于审计范围过窄的批评本报告未单独核实。",
 "ニューヨーク市は採用・昇進に自動化ツールを使うには1年以内にバイアス監査を受け、その情報を公開し、応募者・従業員に事前通知するよう定め、2023年7月5日から執行した。監督機関の案内ページで、対象が狭いという指摘への評価は本報告で別に検証していない。"],
["평가 알고리즘의 책임을 '감사와 공개'로 묻는 방식의 사례로 쓴다.","Used as an example of holding evaluation algorithms accountable through audit and disclosure.","Используется как пример подотчётности алгоритмов оценки через аудит и раскрытие.","作为以“审计与公开”追究评价算法责任之方式的案例。","評価アルゴリズムの責任を「監査と公開」で問う方式の事例として使う。"]);

E(52,"B","io",2026,"대한민국 국가법령정보센터, 「인공지능 발전과 신뢰 기반 조성 등에 관한 기본법」 (법률 제20676호 2025.1.21. 제정, 2026.1.22. 시행; 최종 개정 법률 제21311호)","인공지능 발전과 신뢰 기반 조성 등에 관한 기본법","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%9D%B8%EA%B3%B5%EC%A7%80%EB%8A%A5%EB%B0%9C%EC%A0%84%EA%B3%BC%EC%8B%A0%EB%A2%B0%EA%B8%B0%EB%B0%98%EC%A1%B0%EC%84%B1%EB%93%B1%EC%97%90%EA%B4%80%ED%95%9C%EA%B8%B0%EB%B3%B8%EB%B2%95",
"고영향 인공지능에 대한 사람의 관리ㆍ감독",
["채용 등 개인의 권리·의무에 중대한 영향을 미치는 판단·평가를 '고영향 인공지능'으로 정하고(제2조), 사업자에게 위험관리, 설명 방안, 이용자 보호, 사람의 관리·감독, 문서 보관을 요구한다(제34조). 영향평가는 '노력' 의무이고, 과태료(3천만 원 이하)는 고지·국내대리인·시정명령 위반에만 붙는다(제43조). 감독자의 권한·보호에 관한 조항은 없다.",
 "It defines judgements or evaluations that significantly affect individuals' rights and duties, such as hiring, as 'high-impact AI' (Art. 2) and requires providers to run risk management, explanation measures, user protection, human management and oversight, and documentation (Art. 34). Impact assessment is a best-effort duty, and fines (up to KRW 30 million) apply only to breaches of notice, local-representative and correction-order duties (Art. 43). There is no provision on overseers' authority or protection.",
 "Закон относит к «ИИ высокого воздействия» суждения и оценки, существенно влияющие на права и обязанности людей, например при найме (ст. 2), и требует от операторов управления рисками, мер объяснения, защиты пользователей, человеческого управления и надзора, документации (ст. 34). Оценка воздействия — обязанность «стремиться», штрафы (до 30 млн вон) — лишь за нарушения уведомления, назначения представителя и предписаний (ст. 43). Норм о полномочиях и защите надзирающих нет.",
 "将招聘等对个人权利义务有重大影响的判断与评价定为“高影响人工智能”（第2条），要求经营者实施风险管理、说明方案、用户保护、人的管理监督与文件保存（第34条）。影响评估为“努力”义务，罚款（3000万韩元以下）仅针对告知、国内代理人与纠正命令的违反（第43条）。没有关于监督者权限与保护的条款。",
 "採用など個人の権利・義務に重大な影響を及ぼす判断・評価を「高影響人工知能」と定め（第2条）、事業者にリスク管理、説明方策、利用者保護、人の管理・監督、文書の保管を求める（第34条）。影響評価は「努力」義務で、過料（3千万ウォン以下）は告知・国内代理人・是正命令の違反にだけかかる（第43条）。監督者の権限・保護に関する条項はない。"],
["한국에서 '사람의 감독'이 법적 의무가 됐지만 감독자의 권한·보호는 비어 있다는 근거로 쓴다.","Used as evidence that in Korea 'human oversight' has become a legal duty while overseers' authority and protection remain unaddressed.","Используется как довод, что в Корее «человеческий надзор» стал обязанностью, а полномочия и защита надзирающих не урегулированы.","作为韩国“人的监督”已成法定义务、但监督者权限与保护仍空白的依据。","韓国で「人の監督」が法的義務になったが監督者の権限・保護は空白であるという根拠として使う。"]);

E(53,"B","io",2025,"内閣府 科学技術・イノベーション (Cabinet Office, Japan), AI法 page","人工知能関連技術の研究開発及び活用の推進に関する法律（ＡＩ法）","https://www8.cao.go.jp/cstp/ai/ai_act/ai_act.html",
"令和7年6月4日にＡＩ法が公布・一部施行され",
["일본 AI법은 2025년 6월 4일 공포·일부 시행되고 9월 1일 전면 시행된 진흥 중심 법률이다. 확인한 내각부 요약 페이지에는 벌칙 언급이 없으며, 법률 전문의 벌칙 유무는 이 보고서가 직접 검증하지 못했다.",
 "Japan's AI Act, a promotion-oriented law, was promulgated and partly enforced on 4 June 2025 and fully enforced on 1 September. The Cabinet Office summary page verified here does not mention penalties; whether the full text contains any was not verified directly.",
 "Японский закон об ИИ, ориентированный на продвижение, промульгирован и частично вступил в силу 4 июня 2025 г., полностью — 1 сентября. Проверенная страница Кабинета министров не упоминает санкций; наличие их в полном тексте напрямую не проверялось.",
 "日本AI法是以促进为主的法律，于2025年6月4日公布并部分施行，9月1日全面施行。已核实的内阁府摘要页面未提及罚则，法律全文是否有罚则本报告未能直接核实。",
 "日本のAI法は2025年6月4日に公布・一部施行され、9月1日に全面施行された推進中心の法律である。確認した内閣府の要約ページに罰則の言及はなく、法律全文の罰則の有無は本報告で直接検証できなかった。"],
["일본은 AI 책임을 법적 의무보다 지침과 기존 노동법(근거 14)으로 다룬다는 비교 근거로 쓴다.","Used as comparative evidence that Japan handles AI responsibility through guidance and existing labour law (evidence 14) more than legal duties.","Используется как сравнительный довод, что Япония регулирует ответственность за ИИ скорее руководствами и действующим трудовым правом (источник 14), чем обязанностями.","作为日本更多以指南与既有劳动法（依据14）而非法律义务处理AI责任的比较依据。","日本はAIの責任を法的義務より指針と既存の労働法（根拠14）で扱うという比較の根拠として使う。"]);

E(54,"C","press",2024,"Интерфакс (Interfax), 25 Jun 2024","Госдума приняла закон о страховании рисков от внедрения ИИ","https://www.interfax.ru/russia/967980",
"обязательном страховании вреда, причиненного искусственным интеллектом",
["러시아 하원이 디지털 혁신 실험적 법제도(ЭПР) 참가자에게 AI 사용으로 생긴 피해에 대한 책임보험을 의무화하는 법을 3독회에서 통과시켰다고 보도했다. 공포 후 180일 뒤 시행이다. 법령 공식 게시 사이트는 자동 접속에 응답하지 않아 언론 보도로 확인했으며, 법률 번호는 이 기사에 없다.",
 "Reports that the Russian State Duma passed in third reading a law making liability insurance mandatory for participants in experimental legal regimes for digital innovation, covering harm from the use of AI, effective 180 days after publication. The official legal-publication sites did not respond to automated access, so a press report was used; the law number is not in the article.",
 "Сообщает, что Госдума приняла в третьем чтении закон об обязательном страховании ответственности участников экспериментальных правовых режимов за вред от применения ИИ; вступает в силу через 180 дней после опубликования. Официальные порталы правовой информации не ответили на автоматический доступ, поэтому использовано сообщение СМИ; номера закона в статье нет.",
 "报道俄罗斯国家杜马三读通过法律，要求数字创新实验性法律制度（ЭПР）参与者对使用AI造成的损害投保责任险，公布后180天施行。法令官方发布网站未响应自动访问，故以媒体报道核实；文章中没有法律编号。",
 "ロシア下院がデジタル革新の実験的法制度（ЭПР）の参加者にAIの使用で生じた被害の責任保険を義務づける法律を第3読会で可決したと報じた。公布から180日後に施行される。法令の公式掲載サイトが自動アクセスに応答しなかったため報道で確認し、法律番号はこの記事にない。"],
["러시아가 AI 피해 책임을 개인 비난보다 보험·실험 제도로 다루는 방향의 근거로 쓴다.","Used as evidence that Russia handles AI harm through insurance and experimental regimes rather than individual blame.","Используется как довод, что Россия регулирует вред от ИИ через страхование и экспериментальные режимы, а не через персональную вину.","作为俄罗斯以保险与实验制度而非个人追责处理AI损害责任之方向的依据。","ロシアがAIの被害の責任を個人の非難より保険・実験制度で扱う方向の根拠として使う。"]);

E(55,"B","io",2025,"OECD (Anna Milanez, Annikka Lemmens & Carla Ruggiu), OECD Artificial Intelligence Papers (6 Feb 2025)","Algorithmic management in the workplace: New evidence from an OECD employer survey","https://www.oecd.org/en/publications/algorithmic-management-in-the-workplace_287c13c4-en.html",
"They cite concerns of unclear accountability",
["프랑스·독일·이탈리아·일본·스페인·미국 6개국 6천여 기업 조사로, 알고리즘 관리 도구가 대부분 나라에서 이미 흔하며 관리자는 결정의 질이 좋아졌다고 느끼지만 '불분명한 책임', 도구 논리를 따라가기 어려움, 노동자 건강 보호 부족을 우려한다고 보고했다. 확인한 것은 초록이라 나라별 수치는 쓰지 않는다.",
 "A survey of over 6,000 firms in France, Germany, Italy, Japan, Spain and the US finds algorithmic-management tools already common in most countries; managers feel decisions improved but worry about unclear accountability, difficulty following the tools' logic and inadequate protection of workers' health. Only the abstract was verified, so country figures are not used.",
 "Опрос более 6000 фирм во Франции, Германии, Италии, Японии, Испании и США: инструменты алгоритмического управления уже распространены в большинстве стран; менеджеры считают, что решения стали лучше, но тревожатся о неясной подотчётности, трудности понять логику инструментов и слабой защите здоровья работников. Проверена лишь аннотация, страновые цифры не используются.",
 "对法、德、意、日、西、美6国6000余家企业的调查显示，算法管理工具在多数国家已很普遍，管理者感到决策质量提高，但担忧“责任不清”、难以理解工具逻辑以及劳动者健康保护不足。仅核实了摘要，故不使用各国数字。",
 "フランス・ドイツ・イタリア・日本・スペイン・米国の6か国6千社超の調査で、アルゴリズム管理のツールはほとんどの国ですでに一般的で、管理者は決定の質が良くなったと感じる一方、「不明確な責任」、ツールの論理を追いにくいこと、労働者の健康保護の不足を懸念していると報告した。確認したのは抄録なので国別の数値は使わない。"],
["관리자 스스로 '책임이 불분명해진다'고 인식한다는 국제 조사 근거로 쓴다.","Used as international survey evidence that managers themselves perceive accountability becoming unclear.","Используется как международное свидетельство, что сами менеджеры видят размывание ответственности.","作为管理者自身认为“责任变得不清”的国际调查依据。","管理者自身が「責任が不明確になる」と認識しているという国際調査の根拠として使う。"]);

// ===== Evidence 56–58: review additions (AI Act omnibus, chatbot ruling, accountability sink) =====
E(56,"B","io",2026,"European Union, Regulation (EU) 2026/1744 (Digital Omnibus on AI) of 8 Jul 2026, Official Journal 24 Jul 2026","Regulation (EU) 2026/1744 amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230 as regards the simplification of the implementation of harmonised rules on artificial intelligence (Digital Omnibus on AI)","https://eur-lex.europa.eu/eli/reg/2026/1744/oj",
"set to 2 December 2027 for AI systems classified as high-risk",
["AI법 개정 규정으로, 고위험 AI 요건과 제공자·배치자 의무(제3장 1~3절)의 적용일을 부속서 III 분야(고용·노동자 관리 포함)는 2027년 12월 2일, 부속서 I 제품 분야는 2028년 8월 2일로 미뤘다. 표준·공통 사양·지침이 늦어진 것을 이유로 들었다. 이 보고서는 적용일 조항과 그 이유를 확인했으며, 제14·26조 내용의 변경 여부는 따로 검토하지 않았다.",
 "An amending regulation that moved the date of application of the high-risk requirements and provider and deployer obligations (Chapter III, Sections 1–3) to 2 December 2027 for Annex III areas, including employment and worker management, and to 2 August 2028 for Annex I products, citing delayed standards, common specifications and guidance. This report verified the application-date provision and its rationale but did not separately review whether the content of Articles 14 and 26 changed.",
 "Изменяющий регламент перенёс дату применения требований к высокорисковому ИИ и обязанностей поставщиков и эксплуатантов (глава III, разделы 1–3) на 2 декабря 2027 г. для сфер приложения III, включая занятость и управление работниками, и на 2 августа 2028 г. для продуктов приложения I, сославшись на задержку стандартов, общих спецификаций и руководств. Проверены норма о датах и её обоснование; изменения содержания статей 14 и 26 отдельно не рассматривались.",
 "这是一项修订条例，把高风险AI要求及提供者、部署者义务（第三章第1至3节）的适用日期推迟：附件III领域（含就业与劳动者管理）为2027年12月2日，附件I产品领域为2028年8月2日，理由是标准、共同规范与指南迟延。本报告核实了适用日期条款及其理由，未另行审查第14、26条内容是否变化。",
 "AI法の改正規則で、高リスクAIの要件と提供者・導入者の義務（第3章第1〜3節）の適用日を、附属書III分野（雇用・労働者管理を含む）は2027年12月2日、附属書Iの製品分野は2028年8月2日に延期した。標準・共通仕様・指針の遅れを理由に挙げた。本報告は適用日の条項とその理由を確認し、第14・26条の内容の変更の有無は別途検討していない。"],
["EU 규칙이 '사람의 감독'에 권한을 붙이는 방향에서 가장 앞서 있다는 판단은 유지하되, 고용 분야 감독 의무가 2027년 말에야 적용된다는 시간차를 반영하는 데 쓴다.","Used to keep the judgement that EU rules lead in attaching authority to 'human oversight' while reflecting the time lag: oversight duties in employment apply only from late 2027.","Используется, чтобы сохранить вывод о лидерстве ЕС в наделении «человеческого надзора» полномочиями и учесть отставание: обязанности надзора в сфере занятости применяются лишь с конца 2027 г.","用于在维持“欧盟在为人的监督配置权限方面最领先”这一判断的同时，反映时间差：就业领域的监督义务要到2027年底才适用。","EUの規則が「人の監督」に権限をつける方向で最も先行しているという判断は維持しつつ、雇用分野の監督義務が2027年末にようやく適用されるという時間差を反映するために使う。"]);

E(57,"B","io",2024,"Civil Resolution Tribunal of British Columbia (Tribunal Member Christopher C. Rivers), decision of 14 Feb 2024","Moffatt v. Air Canada, 2024 BCCRT 149","https://decisions.civilresolutionbc.ca/crt/crtd/en/item/525448/index.do",
"it is responsible for all the information on its website",
["항공사 웹사이트 챗봇이 유족 할인 운임을 사후에 신청할 수 있다고 잘못 안내한 사건에서, 심판소는 챗봇이 스스로 책임지는 별개의 법적 실체라는 취지의 항공사 주장을 '놀라운 주장'이라며 받아들이지 않고, 과실에 의한 허위 표시로 650.88캐나다달러 배상을 명했다. 소액 분쟁 심판소의 결정이라 선례로서의 구속력은 제한적이다.",
 "In a case where an airline's website chatbot wrongly said a bereavement fare could be claimed after travel, the tribunal rejected as 'remarkable' the airline's suggestion that the chatbot was a separate legal entity responsible for its own actions, and awarded C$650.88 for negligent misrepresentation. As a small-claims tribunal decision, its weight as precedent is limited.",
 "В деле, где чат-бот на сайте авиакомпании ошибочно сообщил, что льготный тариф по случаю утраты можно оформить после поездки, трибунал отверг как «примечательное» предположение авиакомпании, что чат-бот — отдельное юридическое лицо, отвечающее за свои действия, и присудил 650,88 канадского доллара за небрежное введение в заблуждение. Это решение трибунала по мелким искам, его прецедентный вес ограничен.",
 "航空公司网站聊天机器人错误地告知丧亲优惠票价可在出行后申请；审裁处驳回了航空公司“聊天机器人是对自身行为负责的独立法律实体”的说法，称之为“令人吃惊的主张”，并以过失失实陈述判赔650.88加元。作为小额争议审裁处的决定，其先例效力有限。",
 "航空会社のウェブサイトのチャットボットが忌引運賃を事後に申請できると誤って案内した事件で、審判所はチャットボットが自らの行為に責任を負う別個の法的主体だとする趣旨の航空会社の主張を「驚くべき主張」として退け、過失による不実表示として650.88カナダドルの賠償を命じた。少額紛争審判所の決定なので先例としての拘束力は限られる。"],
["AI를 배치한 조직이 그 출력에 책임진다는 원칙이 실제 분쟁에서 적용된 사례로, '책임 싱크'에 대한 법의 단순한 해답을 보여 주는 데 쓴다.","Used as a case where the principle that the deploying organisation answers for its AI's output was applied in a real dispute — the law's simple answer to the accountability sink.","Используется как случай, когда принцип ответственности развернувшей ИИ организации за его вывод применён в реальном споре, — простой ответ права на «поглотитель ответственности».","作为“部署AI的组织对其输出负责”这一原则在实际纠纷中得到适用的案例，用以展示法律对“责任黑洞”的简单回答。","AIを導入した組織がその出力に責任を負うという原則が実際の紛争で適用された事例として、「責任の吸い込み口」に対する法の単純な答えを示すために使う。"]);

E(58,"C","book",2024,"Dan Davies, The Unaccountability Machine (Profile Books, 2024), publisher's page","The Unaccountability Machine","https://profilebooks.com/work/the-unaccountability-machine/",
"systematically generate outcomes that everyone involved claims not to want",
["시장·제도·정부가 관련자 누구도 원하지 않는다고 말하는 결과를 체계적으로 낳는 이유를 스태퍼드 비어의 경영 사이버네틱스로 설명하는 단행본이다. '책임 싱크(accountability sink)'라는 개념의 출처로 널리 인용되지만, 이 보고서는 책 본문이 아니라 출판사 소개 페이지만 확인했으므로 개념의 이름과 대략의 뜻에만 쓴다.",
 "A book that uses Stafford Beer's management cybernetics to explain why markets, institutions and governments systematically produce outcomes that everyone involved says they do not want. It is widely cited as the source of the term 'accountability sink', but this report verified only the publisher's page, not the text, so it is used only for the term and its rough meaning.",
 "Книга, объясняющая с помощью управленческой кибернетики Стаффорда Бира, почему рынки, институты и правительства систематически дают результаты, которых, по словам участников, никто не хочет. Её широко цитируют как источник термина «поглотитель ответственности», но проверена лишь страница издательства, поэтому книга используется только для термина и его общего смысла.",
 "这本书借斯塔福德·比尔的管理控制论，解释市场、制度与政府为何系统性地产生所有相关者都声称不想要的结果。它常被引为“责任黑洞（accountability sink）”一词的出处，但本报告只核实了出版社介绍页而非正文，因此仅用于该概念的名称与大意。",
 "市場・制度・政府が関係者の誰も望まないと言う結果を体系的に生む理由を、スタッフォード・ビアの経営サイバネティクスで説明する単行本である。「責任の吸い込み口（accountability sink）」という概念の出典として広く引用されるが、本報告は本文ではなく出版社の紹介ページだけを確認したので、概念の名前と大まかな意味にだけ使う。"],
["'AI가 정했다'는 해명이 결정을 사람에게서 시스템으로 옮겨 해명 요구를 막는 구조에 붙일 이름의 출처로 쓴다.","Used as the source of the name for structures in which 'the AI decided' moves decisions from people to systems and blocks demands for an explanation.","Используется как источник названия для структур, где «решил ИИ» переносит решения с людей на системы и блокирует требования объяснений.","作为一个名称的出处：用来指称“AI决定的”这类说法把决定从人转到系统、从而阻断问责要求的结构。","「AIが決めた」という説明が決定を人からシステムへ移し、説明の要求を封じる構造につける名前の出典として使う。"]);

// ===== Evidence 59–82: chapter "Is work sacred?" =====
E(59,"B","book",1981,"Pope John Paul II, Encyclical Laborem Exercens (14 Sep 1981), Holy See","Laborem Exercens","https://www.vatican.va/content/john-paul-ii/en/encyclicals/documents/hf_jp-ii_enc_14091981_laborem-exercens.html",
"work is \"for man\" and not man \"for work\"",
["가톨릭 사회교리에서 노동을 다룬 핵심 회칙으로, 인간이 노동하도록 부름받았다고 보면서도 노동의 가치의 근원을 노동의 주체인 사람에게 두고, 인간의 노동을 사회 문제 전체의 '아마도 본질적인 열쇠'라 부른다. 신학적 규범 문헌이므로 사실의 근거가 아니라 노동 신성론의 가장 정교한 판본으로 읽는다.",
 "The key encyclical on work in Catholic social teaching: while holding that humans are called to work, it locates the source of work's value in the person who works and calls human work 'probably the essential key' to the whole social question. As a normative theological text it is read not as factual evidence but as the most elaborate version of the view that work is sacred.",
 "Ключевая энциклика католического социального учения о труде: признавая, что человек призван трудиться, она видит источник ценности труда в самом трудящемся и называет человеческий труд «вероятно, существенным ключом» ко всему социальному вопросу. Это нормативный богословский текст, поэтому он читается не как фактическое свидетельство, а как самая разработанная версия взгляда на святость труда.",
 "这是天主教社会训导中论劳动的核心通谕：一方面认为人被召唤去劳动，另一方面把劳动价值的根源放在劳动主体——人身上，并称人的劳动“很可能是”整个社会问题的“关键”。作为神学规范文献，它不被当作事实依据，而是被读作“劳动神圣论”最精致的版本。",
 "カトリック社会教説で労働を扱う中心的な回勅で、人間が労働へと召されているとしつつ、労働の価値の源を労働の主体である人に置き、人間の労働を社会問題全体の「おそらく本質的な鍵」と呼ぶ。神学的な規範文書なので事実の根拠ではなく、労働神聖論の最も精緻な版として読む。"],
["입장 1(소명·존엄론)의 원전으로 쓴다.","Used as the primary text for Position 1 (vocation and dignity).","Используется как первоисточник позиции 1 (призвание и достоинство).","作为立场一（召命与尊严论）的原始文献。","立場1（召命・尊厳論）の原典として使う。"]);

E(60,"B","io",2025,"Pope Leo XIV, Address to the College of Cardinals (10 May 2025), Holy See","Address of the Holy Father to the College of Cardinals","https://www.vatican.va/content/leo-xiv/en/speeches/2025/may/documents/20250510-collegio-cardinalizio.html",
"another industrial revolution and to developments in the field of artificial intelligence",
["새 교황은 이름을 고른 주된 이유로, 레오 13세가 회칙 『새로운 사태』로 첫 산업혁명기의 사회 문제를 다룬 것처럼 오늘 교회가 또 하나의 산업혁명과 AI가 인간의 존엄·정의·노동에 던지는 새 도전에 사회교리로 응답한다는 점을 들었다. 연설이므로 정책 내용이 아니라 문제 설정의 방향을 보여 준다.",
 "The new pope said the main reason for his choice of name was that, as Leo XIII addressed the social question of the first industrial revolution in Rerum Novarum, the Church today offers its social teaching in response to another industrial revolution and to AI's new challenges for human dignity, justice and labour. It is a speech, so it shows how the problem is framed rather than any policy.",
 "Новый папа назвал главной причиной выбора имени то, что, как Лев XIII в «Rerum Novarum» ответил на социальный вопрос первой промышленной революции, Церковь сегодня отвечает своим социальным учением на новую промышленную революцию и вызовы ИИ для человеческого достоинства, справедливости и труда. Это речь: она показывает постановку проблемы, а не политику.",
 "新教宗表示，取名的主要原因是：正如利奥十三世以《新事》通谕回应第一次工业革命中的社会问题，今天教会也以社会训导回应另一场工业革命以及AI给人的尊严、正义与劳动带来的新挑战。这是一篇讲话，体现的是问题的设定方向而非具体政策。",
 "新教皇は名前を選んだ主な理由として、レオ13世が回勅『レールム・ノヴァールム』で最初の産業革命期の社会問題を扱ったように、今日の教会がもう一つの産業革命とAIが人間の尊厳・正義・労働に投げかける新たな課題に社会教説で応えると述べた。演説なので政策の内容ではなく問題設定の方向を示す。"],
["노동을 가장 오래 신성하게 다뤄 온 제도가 AI를 노동 존엄의 문제로 규정했다는 근거로 쓴다.","Used as evidence that the institution with the longest record of treating work as sacred has framed AI as a question of the dignity of labour.","Используется как свидетельство того, что институт, дольше всех считающий труд священным, определил ИИ как вопрос достоинства труда.","作为证据：最长久地把劳动视为神圣的制度，已把AI界定为劳动尊严的问题。","労働を最も長く神聖なものとして扱ってきた制度が、AIを労働の尊厳の問題と位置づけた根拠として使う。"]);

E(61,"B","io",2025,"Holy See, Dicastery for the Doctrine of the Faith and Dicastery for Culture and Education, Note 'Antiqua et Nova' (28 Jan 2025)","Antiqua et nova. Note on the Relationship Between Artificial Intelligence and Human Intelligence","https://www.vatican.va/roman_curia/congregations/cfaith/documents/rc_ddf_doc_20250128_antiqua-et-nova_en.html",
"can paradoxically deskill workers, subject them to automated surveillance",
["AI와 인간 지능의 관계를 다룬 교황청 문서로, 노동 부분에서 현재의 AI 활용 방식이 광고된 이점과 달리 노동자의 숙련을 빼앗고 자동 감시에 묶으며 경직된 반복 업무로 내몰 수 있고, 기계의 속도를 따라가야 하는 압박이 노동자의 행위 주체성을 깎을 수 있다고 경고한다. 실증 연구가 아니라 규범적 판단이다.",
 "A Holy See document on AI and human intelligence; its section on work warns that, contrary to the advertised benefits, current approaches to AI can deskill workers, subject them to automated surveillance and relegate them to rigid, repetitive tasks, and that keeping pace with machines can erode workers' sense of agency. It is a normative judgement, not empirical research.",
 "Документ Святого Престола об ИИ и человеческом интеллекте; в разделе о труде он предупреждает, что, вопреки рекламируемым выгодам, нынешние подходы к ИИ могут лишать работников квалификации, подвергать автоматическому надзору и сводить к жёстким однообразным задачам, а необходимость поспевать за машинами может подтачивать чувство субъектности. Это нормативное суждение, а не эмпирическое исследование.",
 "这是教廷关于AI与人类智能关系的文件，其劳动部分警告：与宣传的好处相反，当前的AI运用方式可能使劳动者去技能化、受自动监控、被限于僵化重复的任务，追赶机器速度的压力也可能削弱劳动者的能动感。这是规范性判断而非实证研究。",
 "AIと人間の知性の関係を扱う教皇庁の文書で、労働の部分では、現在のAIの使い方が宣伝された利点とは逆に労働者の熟練を奪い、自動監視に縛り、硬直した反復作業に追いやりうること、機械の速度についていく圧力が労働者の主体性を削りうることを警告する。実証研究ではなく規範的判断である。"],
["소명·존엄론이 AI 시대에 어떤 경고로 이어지는지 보여 주는 데 쓴다.","Used to show what warning the vocation-and-dignity view issues for the AI era.","Используется, чтобы показать, какое предупреждение выносит позиция призвания и достоинства для эпохи ИИ.","用于展示召命与尊严论在AI时代引出的警告。","召命・尊厳論がAI時代にどのような警告につながるかを示すために使う。"]);

E(62,"B","book",2022,"Stanford Encyclopedia of Philosophy, entry 'Max Weber' (first published 2007; substantive revision 21 Sep 2022)","Max Weber","https://plato.stanford.edu/entries/weber/",
"an unintended consequence of the Puritan ethic of rigorous self-discipline and self-control",
["베버의 '프로테스탄트 윤리' 테제를 근대 자본주의의 비마르크스적 계보로 정리하고, 계산 가능하고 규율된 인간 통제가 엄격한 자기 규율을 요구한 청교도 직업 윤리와 '세속 안의 금욕'의 의도치 않은 결과였다는 베버의 아이러니를 설명한다. 베버 원전 대신 확인한 2차 문헌이다.",
 "Summarises Weber's 'Protestant Ethic' thesis as a non-Marxist genealogy of modern capitalism and explains his irony that calculable, disciplined control over people was an unintended consequence of the Puritan vocational ethic of rigorous self-discipline and 'innerworldly asceticism'. Secondary literature verified in place of Weber's original.",
 "Излагает тезис Вебера о «протестантской этике» как немарксистскую генеалогию современного капитализма и объясняет его иронию: исчисляемый, дисциплинированный контроль над людьми стал непреднамеренным следствием пуританской этики призвания со строгой самодисциплиной и «мирской аскезой». Вторичный источник, проверенный вместо оригинала Вебера.",
 "该条目把韦伯的“新教伦理”命题整理为现代资本主义的非马克思主义谱系，并说明韦伯的反讽：可计算、受规训的对人控制，是要求严格自律的清教职业伦理与“入世禁欲”的意外后果。这是代替韦伯原著核实的二手文献。",
 "ヴェーバーの「プロテスタンティズムの倫理」テーゼを近代資本主義の非マルクス主義的な系譜として整理し、計算可能で規律された人間の統制が、厳格な自己規律を求めたピューリタンの職業倫理と「世俗内禁欲」の意図せざる結果だったというヴェーバーの皮肉を説明する。ヴェーバーの原典の代わりに確認した二次文献である。"],
["노동 신성론이 역사적으로 규율로 작동했다는 논평의 근거로 쓴다.","Used to support the commentary that the sacredness of work has historically operated as discipline.","Используется в поддержку комментария о том, что святость труда исторически работала как дисциплина.","用于支持“劳动神圣论在历史上作为规训发挥作用”的评论。","労働神聖論が歴史的に規律として働いたという論評の根拠として使う。"]);

E(63,"B","book",1844,"Karl Marx, Economic and Philosophic Manuscripts of 1844, 'Estranged Labour' (English translation, Marxists Internet Archive)","Estranged Labour","https://www.marxists.org/archive/marx/works/1844/manuscripts/labour.htm",
"labor is external to the worker",
["소외된 노동을 노동이 노동자에게 '외적인' 것, 곧 일 속에서 자신을 긍정하지 못하고 부정하며 만족 대신 불행을 느끼고 자기 에너지를 자유롭게 펼치지 못하는 상태로 정의한다. 생전에 출판되지 않은 초고이며 영어 번역본을 확인했으므로 번역에 따른 표현 차이가 있을 수 있다.",
 "Defines estranged labour as labour that is external to the worker — work in which one does not affirm but denies oneself, feels unhappy rather than content and cannot freely develop one's energies. It is a manuscript unpublished in Marx's lifetime, verified in English translation, so wording may differ from the original.",
 "Определяет отчуждённый труд как внешний для рабочего: в нём человек не утверждает, а отрицает себя, чувствует себя несчастным, а не довольным, и не может свободно развивать свои силы. Рукопись не издавалась при жизни Маркса и проверена в английском переводе, формулировки могут отличаться.",
 "把异化劳动定义为对劳动者而言“外在的”劳动：人在劳动中不是肯定而是否定自己，感到不幸而非满足，无法自由发挥自身能量。这是马克思生前未发表的手稿，核实的是英译本，措辞可能与原文有差异。",
 "疎外された労働を、労働が労働者にとって「外的」なもの、すなわち仕事の中で自分を肯定できず否定し、満足ではなく不幸を感じ、自分の力を自由に発揮できない状態と定義する。生前に出版されなかった草稿で英訳を確認したため、訳による表現の違いがありうる。"],
["입장 2(인간 본질·소외론)의 원전으로 쓴다.","Used as the primary text for Position 2 (human essence and alienation).","Используется как первоисточник позиции 2 (сущность человека и отчуждение).","作为立场二（人的本质与异化论）的原始文献。","立場2（人間の本質・疎外論）の原典として使う。"]);

E(64,"B","book",1894,"Karl Marx, Capital, Vol. III (ed. F. Engels, 1894), ch. 48 'The Trinity Formula' (Marxists Internet Archive)","Capital, Vol. III, Chapter 48","https://www.marxists.org/archive/marx/works/1894-c3/ch48.htm",
"The shortening of the working-day is its basic prerequisite.",
["진정한 자유의 영역은 필요와 외적 목적에 따른 노동이 끝나는 곳에서야 시작되며, 필요의 영역을 바탕으로만 꽃필 수 있고, 노동일 단축이 그 기본 전제라고 쓴 대목이다. 엥겔스가 마르크스 사후 원고를 편집해 낸 판본이다.",
 "The passage holding that the true realm of freedom begins only where labour determined by necessity and external purpose ends, that it can flourish only on the basis of the realm of necessity, and that shortening the working day is its basic prerequisite. The volume was edited by Engels from Marx's manuscripts after his death.",
 "Фрагмент о том, что подлинное царство свободы начинается лишь там, где прекращается труд, диктуемый нуждой и внешней целесообразностью, что оно может расцвести лишь на основе царства необходимости и что сокращение рабочего дня — его основное условие. Том издан Энгельсом по рукописям после смерти Маркса.",
 "这段文字写道：真正的自由王国只是在由必需和外在目的所规定的劳动终止的地方才开始，只能以必然王国为基础才能繁荣，而工作日的缩短是其根本条件。该卷由恩格斯在马克思去世后据手稿编辑出版。",
 "真の自由の国は必要と外的な目的に規定された労働が終わるところで初めて始まり、必然の国を基礎としてのみ花開き、労働日の短縮がその根本条件だと書いた箇所である。マルクスの死後にエンゲルスが草稿を編集した版である。"],
["마르크스가 생계 노동 자체를 신성화하지 않았다는 논평의 근거로 쓴다.","Used to support the commentary that Marx did not sanctify labour for subsistence as such.","Используется в поддержку комментария, что Маркс не освящал труд ради пропитания как таковой.","用于支持“马克思并未把谋生劳动本身神圣化”的评论。","マルクスが生計のための労働そのものを神聖化しなかったという論評の根拠として使う。"]);

E(65,"B","io",1987,"대한민국 국가법령정보센터, 「대한민국헌법」 제12조·제32조 (1987. 10. 29. 전부개정)","대한민국헌법 제32조(근로의 권리·의무)","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EB%8C%80%ED%95%9C%EB%AF%BC%EA%B5%AD%ED%97%8C%EB%B2%95/%EC%A0%9C32%EC%A1%B0",
"모든 국민은 근로의 의무를 진다.",
["제32조는 근로의 권리와 의무를 함께 정하고, 의무의 내용과 조건을 민주주의 원칙에 따라 법률로 정하도록 하며, 근로조건의 기준이 인간의 존엄성을 보장하도록 법률로 정한다고 쓴다. 제12조는 법률과 적법한 절차에 의하지 않은 강제노역을 금지한다. 휴식권을 명시한 조항은 확인하지 못했고, 근로의 의무를 구체화한 법률도 이 보고서에서 확인하지 못했다.",
 "Article 32 sets out both the right and the duty to work, requires the content and conditions of the duty to be set by law in line with democratic principles, and requires working-condition standards to guarantee human dignity. Article 12 bars forced labour except by law and due process. No provision stating a right to rest was found, and this report did not find a statute giving concrete content to the duty to work.",
 "Статья 32 закрепляет и право, и обязанность трудиться, требует определять содержание и условия обязанности законом по демократическим принципам и устанавливать стандарты условий труда, гарантирующие человеческое достоинство. Статья 12 запрещает принудительные работы иначе как по закону и в надлежащем порядке. Нормы о праве на отдых не найдено; закона, конкретизирующего обязанность трудиться, доклад не обнаружил.",
 "第32条同时规定劳动的权利与义务，要求依民主原则以法律规定义务的内容与条件，并以法律规定保障人的尊严的劳动条件标准。第12条禁止非依法律与正当程序的强制劳役。未找到明文规定休息权的条款，本报告也未找到使劳动义务具体化的法律。",
 "第32条は勤労の権利と義務をともに定め、義務の内容と条件を民主主義の原則に従い法律で定めるとし、勤労条件の基準を人間の尊厳を保障するよう法律で定めるとする。第12条は法律と適法な手続によらない強制労役を禁じる。休息の権利を明記した条項は確認できず、勤労の義務を具体化した法律も本報告では確認できなかった。"],
["노동을 권리이자 의무로 쓰는 헌법의 한국 사례로 쓴다.","Used as Korea's example of a constitution that writes work as both a right and a duty.","Используется как корейский пример конституции, где труд — и право, и обязанность.","作为把劳动写成权利兼义务的韩国宪法案例。","労働を権利であり義務であると書く憲法の韓国の例として使う。"]);

E(66,"B","io",1946,"衆議院 (House of Representatives, Japan), 日本国憲法 (1946年11月3日公布) 第18条・第27条","日本国憲法","https://www.shugiin.go.jp/internet/itdb_annai.nsf/html/statics/shiryo/dl-constitution.htm",
"すべて国民は、勤労の権利を有し、義務を負ふ。",
["제27조는 근로의 권리와 의무, 임금·취업시간·휴식 등 근로조건 기준의 법정, 아동 혹사 금지를 정하고, 제18조는 노예적 구속을 금지하며 범죄에 대한 처벌이 아니면 의사에 반하는 고역에 복무시키지 않는다고 정한다. 중의원 누리집의 전문을 확인했다.",
 "Article 27 sets out the right and duty to work, requires standards for wages, hours, rest and other working conditions to be fixed by law and bans the exploitation of children; Article 18 prohibits bondage and involuntary servitude except as punishment for crime. The full text on the House of Representatives website was verified.",
 "Статья 27 закрепляет право и обязанность трудиться, требует установить законом нормы оплаты, рабочего времени, отдыха и других условий труда и запрещает эксплуатацию детей; статья 18 запрещает рабскую зависимость и подневольный труд, кроме наказания за преступление. Проверен полный текст на сайте Палаты представителей.",
 "第27条规定勤劳的权利与义务、以法律规定工资、工时、休息等劳动条件标准，并禁止虐使儿童；第18条禁止奴隶性拘束，除因犯罪受处罚外不得使人服违反其意志的苦役。核实了众议院网站上的全文。",
 "第27条は勤労の権利と義務、賃金・就業時間・休息その他の勤労条件の基準の法定、児童の酷使の禁止を定め、第18条は奴隷的拘束を禁じ、犯罪による処罰の場合を除いて意に反する苦役に服させないと定める。衆議院のウェブサイトの全文を確認した。"],
["한국과 같은 '권리이자 의무' 구조의 일본 사례로 쓴다.","Used as Japan's example of the same 'right and duty' structure as Korea.","Используется как японский пример той же структуры «право и обязанность», что и в Корее.","作为与韩国相同的“权利兼义务”结构的日本案例。","韓国と同じ「権利であり義務」という構造の日本の例として使う。"]);

E(67,"B","io",2018,"新华网 (Xinhua), full text of 中华人民共和国宪法 (2018年修正), 第四十二条·第四十三条","中华人民共和国宪法","https://www.xinhuanet.com/politics/2018lh/2018-03/22/c_1122572202_4.htm",
"劳动是一切有劳动能力的公民的光荣职责。",
["제42조는 노동의 권리와 의무를 정하고 노동을 능력 있는 모든 시민의 '영광스러운 직책'이라 부르며, 국가가 사회주의 노동 경쟁과 노동 모범 표창, 시민의 의무 노동을 장려한다고 쓴다. 제43조는 노동자의 휴식권을 정한다. 전국인민대표대회 누리집이 아니라 국영 통신사가 실은 전문을 확인했다.",
 "Article 42 sets out the right and duty to work, calls work 'the glorious duty' of every able-bodied citizen, and says the state promotes socialist labour emulation, rewards model workers and encourages voluntary labour; Article 43 sets out workers' right to rest. The full text carried by the state news agency, not the NPC website, was verified.",
 "Статья 42 закрепляет право и обязанность трудиться, называет труд «почётной обязанностью» каждого трудоспособного гражданина и говорит, что государство поощряет социалистическое соревнование, награждает передовиков и поощряет добровольный труд; статья 43 закрепляет право трудящихся на отдых. Проверен полный текст, опубликованный государственным информагентством, а не сайтом ВСНП.",
 "第42条规定劳动的权利与义务，称劳动是一切有劳动能力的公民的“光荣职责”，并写明国家提倡社会主义劳动竞赛、奖励劳动模范、提倡义务劳动；第43条规定劳动者的休息权。核实的是国家通讯社刊载的全文，而非全国人大网站。",
 "第42条は労働の権利と義務を定め、労働を能力あるすべての公民の「光栄ある職責」と呼び、国家が社会主義的労働競争と労働模範の表彰、公民の義務労働を奨励すると書く。第43条は労働者の休息の権利を定める。全国人民代表大会のウェブサイトではなく国営通信社が掲載した全文を確認した。"],
["노동을 명예로운 의무로 쓰는 사회주의 헌법의 현행 사례로 쓴다.","Used as a current example of a socialist constitution that writes work as an honourable duty.","Используется как действующий пример социалистической конституции, где труд — почётная обязанность.","作为把劳动写成光荣义务的现行社会主义宪法案例。","労働を名誉ある義務と書く社会主義憲法の現行の例として使う。"]);

E(68,"B","io",1936,"Конституция СССР 1936 г. (электронный текст, исторический факультет МГУ)","Конституция (Основной закон) Союза Советских Социалистических Республик (1936)","http://www.hist.msu.ru/ER/Etext/cnst1936.htm",
"Труд в СССР является обязанностью и делом чести",
["제12조는 노동을 일할 능력이 있는 모든 시민의 '의무이자 명예'로 정하고 '일하지 않는 자는 먹지 못한다'는 원칙을 명시했으며, 제118조는 보장된 일자리를 얻을 권리로서의 노동권을, 제119조는 휴식의 권리를 정했다. 모스크바국립대 역사학부의 전자 사료 텍스트를 확인했으며 관보 원본은 보지 않았다.",
 "Article 12 made work 'a duty and a matter of honour' for every able-bodied citizen on the principle 'he who does not work, neither shall he eat'; Article 118 set out the right to work as a right to guaranteed employment and Article 119 the right to rest. The electronic source text of Moscow State University's history faculty was verified, not the original gazette.",
 "Статья 12 объявляла труд «обязанностью и делом чести» каждого трудоспособного гражданина по принципу «кто не работает, тот не ест»; статья 118 закрепляла право на труд как право на гарантированную работу, статья 119 — право на отдых. Проверен электронный текст исторического факультета МГУ, а не официальная публикация.",
 "第12条把劳动定为每个有劳动能力公民的“义务和光荣的事情”，并写明“不劳动者不得食”的原则；第118条规定作为获得有保障工作之权利的劳动权，第119条规定休息权。核实的是莫斯科国立大学历史系的电子史料文本，未查阅官方公报原件。",
 "第12条は労働を働く能力のあるすべての市民の「義務であり名誉」と定め、「働かざる者食うべからず」の原則を明記し、第118条は保障された仕事を得る権利としての労働権を、第119条は休息の権利を定めた。モスクワ大学歴史学部の電子史料テキストを確認し、官報の原本は見ていない。"],
["노동의 신성화가 헌법 규범이 된 극단적 사례로 쓴다.","Used as the extreme case in which the sanctification of work became a constitutional norm.","Используется как крайний случай, когда освящение труда стало конституционной нормой.","作为劳动神圣化成为宪法规范的极端案例。","労働の神聖化が憲法規範となった極端な例として使う。"]);

E(69,"B","io",1993,"Конституция Российской Федерации 1993 г., статья 37 (constitution.ru)","Конституция Российской Федерации, глава 2, статья 37","http://www.constitution.ru/10003000/10003000-4.htm",
"Труд свободен.",
["제37조는 '노동은 자유롭다'로 시작해 능력을 자유롭게 쓰고 직업을 고를 권리, 강제노동 금지, 안전한 조건에서 일할 권리와 실업으로부터의 보호, 파업권을 포함한 노동쟁의권, 휴식권을 정한다. 노동의 의무 조항은 없다. 공식 법령 포털이 아니라 널리 쓰이는 헌법 전문 사이트를 확인했다.",
 "Article 37 opens with 'Labour is free' and sets out the right to dispose freely of one's abilities and choose an occupation, the ban on forced labour, the right to work in safe conditions with protection from unemployment, the right to labour disputes including strikes, and the right to rest. There is no duty to work. A widely used constitution text site, not the official legal portal, was verified.",
 "Статья 37 начинается словами «Труд свободен» и закрепляет право свободно распоряжаться своими способностями и выбирать профессию, запрет принудительного труда, право на труд в безопасных условиях и защиту от безработицы, право на трудовые споры, включая забастовку, и право на отдых. Обязанности трудиться нет. Проверен широко используемый сайт с текстом Конституции, а не официальный правовой портал.",
 "第37条以“劳动是自由的”开头，规定自由支配自身劳动能力与选择职业的权利、禁止强迫劳动、在安全条件下劳动并免于失业的权利、包括罢工在内的劳动争议权以及休息权。没有劳动义务条款。核实的是广泛使用的宪法文本网站，而非官方法律门户。",
 "第37条は「労働は自由である」で始まり、能力を自由に使い職業を選ぶ権利、強制労働の禁止、安全な条件で働く権利と失業からの保護、ストライキを含む労働争議の権利、休息の権利を定める。労働の義務の条項はない。公式の法令ポータルではなく広く使われる憲法の全文サイトを確認した。"],
["소련의 '노동 의무'에서 '노동의 자유'로 바뀐 러시아의 전환을 보여 주는 데 쓴다.","Used to show Russia's shift from the Soviet 'duty to work' to 'free labour'.","Используется, чтобы показать переход России от советской «обязанности трудиться» к «свободе труда».","用于展示俄罗斯从苏联的“劳动义务”转向“劳动自由”。","ソ連の「労働の義務」から「労働の自由」へ変わったロシアの転換を示すために使う。"]);

E(70,"B","io",1949,"Federal Ministry of Justice (Germany), gesetze-im-internet.de, Basic Law for the Federal Republic of Germany (official English translation), Article 12","Basic Law for the Federal Republic of Germany","https://www.gesetze-im-internet.de/englisch_gg/englisch_gg.html",
"Forced labour may be imposed only on persons deprived of their liberty",
["제12조는 모든 독일인에게 직업·직장·교육 장소를 자유롭게 고를 권리를 주고, 일반적이고 평등한 전통적 공공 봉사 의무를 빼면 특정한 종류의 노동을 강요할 수 없으며, 강제노동은 법원 판결로 자유를 박탈당한 사람에게만 부과할 수 있다고 정한다. 일할 의무나 노동을 기리는 표현은 없다. 공식 영어 번역본을 확인했다.",
 "Article 12 gives all Germans the right freely to choose their occupation, workplace and place of training, bars compelling anyone to perform work of a particular kind except within a traditional, general and equal duty of community service, and allows forced labour only for persons deprived of liberty by a court judgment. There is no duty to work and no language honouring work. The official English translation was verified.",
 "Статья 12 даёт всем немцам право свободно выбирать профессию, место работы и обучения, запрещает принуждать к определённому виду работ, кроме традиционной всеобщей и равной общественной повинности, и допускает принудительный труд лишь для лиц, лишённых свободы по приговору суда. Обязанности трудиться и слов о почёте труда нет. Проверен официальный английский перевод.",
 "第12条赋予所有德国人自由选择职业、工作场所与培训场所的权利，除普遍平等的传统公共服务义务外不得强迫任何人从事特定种类的劳动，强迫劳动只能施加于经法院判决被剥夺自由的人。没有劳动义务，也没有颂扬劳动的措辞。核实的是官方英译本。",
 "第12条はすべてのドイツ人に職業・職場・教育の場所を自由に選ぶ権利を与え、一般的で平等な伝統的公共奉仕義務を除いて特定の種類の労働を強制できず、強制労働は裁判所の判決で自由を奪われた者にのみ課しうると定める。働く義務や労働を称える表現はない。公式の英訳を確認した。"],
["노동을 의무가 아니라 자유로 쓰는 헌법의 대표 사례로 쓴다.","Used as the leading example of a constitution that writes work as a freedom rather than a duty.","Используется как главный пример конституции, где труд — свобода, а не обязанность.","作为把劳动写成自由而非义务的宪法代表案例。","労働を義務ではなく自由と書く憲法の代表例として使う。"]);

E(71,"B","io",1947,"Governo italiano (Presidenza del Consiglio dei Ministri), Costituzione della Repubblica Italiana, Principi fondamentali, artt. 1 e 4","Costituzione italiana — Principi fondamentali","https://www.governo.it/it/costituzione-italiana/principi-fondamentali/2839",
"L'Italia è una Repubblica democratica, fondata sul lavoro.",
["제1조는 공화국이 노동 위에 세워졌다고 선언하고, 제4조는 모든 시민의 노동의 권리를 인정하면서 각자의 가능성과 선택에 따라 사회의 물질적·정신적 진보에 기여하는 활동이나 기능을 수행할 의무를 지운다. 의무의 대상이 임금노동에 한정되지 않는다는 점이 한국·일본과 다르다. 이탈리아 정부 누리집의 원문을 확인했다.",
 "Article 1 declares the Republic 'founded on work'; Article 4 recognises every citizen's right to work and imposes a duty to perform, according to one's possibilities and choice, an activity or function that contributes to the material or spiritual progress of society. Unlike Korea and Japan, the duty is not limited to paid work. The original text on the Italian government website was verified.",
 "Статья 1 провозглашает Республику «основанной на труде»; статья 4 признаёт право каждого гражданина на труд и возлагает обязанность выполнять, по своим возможностям и выбору, деятельность или функцию, способствующую материальному или духовному прогрессу общества. В отличие от Кореи и Японии, обязанность не сводится к оплачиваемому труду. Проверен оригинальный текст на сайте правительства Италии.",
 "第1条宣告共和国“建立在劳动之上”；第4条承认所有公民的劳动权，并规定每个公民有义务依自身能力与选择，从事有助于社会物质或精神进步的活动或职能。与韩国、日本不同，这一义务不限于雇佣劳动。核实的是意大利政府网站上的原文。",
 "第1条は共和国が労働の上に築かれると宣言し、第4条はすべての市民の労働の権利を認めつつ、各自の可能性と選択に従い社会の物質的・精神的進歩に寄与する活動や機能を果たす義務を課す。義務の対象が賃労働に限られない点が韓国・日本と異なる。イタリア政府のウェブサイトの原文を確認した。"],
["유럽 안에서도 노동을 공동체의 기초로 쓰는 헌법이 있음을 보여 주어 '서구는 자유, 동아시아는 의무'라는 단순화를 막는 데 쓴다.","Used to show that some European constitutions also make work the foundation of the community, guarding against the simplification 'the West writes freedom, East Asia writes duty'.","Используется, чтобы показать, что и в Европе есть конституции, делающие труд основой общества, и избежать упрощения «Запад — свобода, Восточная Азия — обязанность».","用于说明欧洲也有把劳动作为共同体基础的宪法，以避免“西方写自由、东亚写义务”的简化。","欧州にも労働を共同体の基礎とする憲法があることを示し、「西洋は自由、東アジアは義務」という単純化を防ぐために使う。"]);

E(72,"B","io",1948,"United Nations, Universal Declaration of Human Rights (10 Dec 1948), Articles 4, 23 and 24","Universal Declaration of Human Rights","https://www.un.org/en/about-us/universal-declaration-of-human-rights",
"Everyone has the right to rest and leisure",
["제23조는 일할 권리, 직업 선택의 자유, 정당하고 유리한 노동 조건과 실업으로부터의 보호를, 제24조는 노동시간의 합리적 제한과 정기 유급휴가를 포함한 휴식과 여가의 권리를, 제4조는 노예와 예속의 금지를 정한다. 일할 의무는 두지 않는다. 법적 구속력이 없는 선언이다.",
 "Article 23 sets out the right to work, free choice of employment, just and favourable conditions and protection against unemployment; Article 24 the right to rest and leisure, including reasonable limits on working hours and periodic paid holidays; Article 4 the ban on slavery and servitude. There is no duty to work. It is a declaration without binding legal force.",
 "Статья 23 закрепляет право на труд, свободный выбор работы, справедливые условия и защиту от безработицы; статья 24 — право на отдых и досуг, включая разумное ограничение рабочего времени и оплачиваемый отпуск; статья 4 — запрет рабства и подневольного состояния. Обязанности трудиться нет. Декларация не имеет обязательной юридической силы.",
 "第23条规定工作权、自由选择职业、公正和合适的工作条件以及免于失业的保障；第24条规定休息和闲暇的权利，包括合理限制工作时间和定期带薪休假；第4条禁止奴隶制和奴役。没有劳动义务。这是不具法律约束力的宣言。",
 "第23条は働く権利、職業選択の自由、公正で有利な労働条件と失業からの保護を、第24条は労働時間の合理的な制限と定期的な有給休暇を含む休息と余暇の権利を、第4条は奴隷と隷属の禁止を定める。働く義務は置かない。法的拘束力のない宣言である。"],
["노동을 권리로 보되 휴식을 같은 무게의 권리로 놓는 국제 기준으로 쓴다.","Used as the international benchmark that treats work as a right while giving rest equal standing as a right.","Используется как международный эталон, где труд — право, а отдых — равноценное право.","作为把劳动视为权利、同时把休息置于同等权利地位的国际标准。","労働を権利としつつ休息を同じ重みの権利として置く国際基準として使う。"]);

E(73,"B","io",1948,"衆議院 (House of Representatives, Japan), 国民の祝日に関する法律 (法律第百七十八号, 1948年7月20日), 制定時の条文","国民の祝日に関する法律","https://www.shugiin.go.jp/internet/itdb_housei.nsf/html/houritsu/00219480720178.htm",
"勤労をたつとび、生産を祝い、国民たがいに感謝しあう。",
["11월 23일 근로감사의 날의 취지를 '근로를 존중하고 생산을 축하하며 국민이 서로 감사하는 것'으로 정한 1948년 제정 당시 조문이다. 이 보고서는 중의원 누리집의 제정 조문을 확인했으며, 내각부의 현행 축일 목록에서 11월 23일이 근로감사의 날로 유지되는 것은 따로 확인했다.",
 "The 1948 text as enacted, which gives the purpose of Labour Thanksgiving Day on 23 November as 'to honour labour, celebrate production and give one another thanks'. This report verified the enacted text on the House of Representatives website and separately confirmed that 23 November remains Labour Thanksgiving Day in the Cabinet Office's current holiday list.",
 "Текст 1948 г. в редакции принятия, определяющий смысл Дня благодарения труду 23 ноября как «чтить труд, праздновать производство и благодарить друг друга». Проверен принятый текст на сайте Палаты представителей; отдельно подтверждено, что 23 ноября остаётся Днём благодарения труду в текущем списке праздников Кабинета министров.",
 "这是1948年制定时的条文，把11月23日勤劳感谢日的宗旨定为“尊重勤劳、庆祝生产、国民互相感谢”。本报告核实了众议院网站上的制定条文，并另行确认内阁府现行节日列表中11月23日仍为勤劳感谢日。",
 "11月23日の勤労感謝の日の趣旨を「勤労をたつとび、生産を祝い、国民たがいに感謝しあう」と定めた1948年制定時の条文である。本報告は衆議院のウェブサイトで制定時の条文を確認し、内閣府の現行の祝日一覧で11月23日が勤労感謝の日として維持されていることを別途確認した。"],
["노동을 '존중할 것'으로 법에 적은 일본의 언어를 보여 주는 데 쓴다.","Used to show the Japanese legal language that writes labour as something 'to be honoured'.","Используется, чтобы показать японский правовой язык, записавший труд как то, что «следует чтить».","用于展示日本把劳动写为“应当尊重之事”的法律语言。","労働を「たつとぶべきもの」と法に書いた日本の言葉を示すために使う。"]);

E(74,"C","io",2013,"Указ Президента РФ от 29.03.2013 № 294 «Об установлении звания Героя Труда Российской Федерации» (copy on legalacts.ru)","Указ Президента РФ от 29.03.2013 N 294","https://legalacts.ru/doc/ukaz-prezidenta-rf-ot-29032013-n-294/",
"повышения общественной значимости и престижа самоотверженного и добросовестного труда",
["'자기희생적이고 성실한 노동의 사회적 의미와 위신을 높이기 위해' 국가와 국민에 대한 특별한 노동 공로에 주는 최고 등급의 칭호를 만든 대통령령이다. 공식 법령 포털이 아니라 법령 데이터베이스의 사본을 확인했으므로 C로 둔다.",
 "The presidential decree that created, 'to raise the social significance and prestige of self-sacrificing and conscientious labour', the highest distinction for special labour merit before the state and the people. A copy in a legal database, not the official legal portal, was verified, so it is graded C.",
 "Указ, учредивший «в целях повышения общественной значимости и престижа самоотверженного и добросовестного труда» высшую степень отличия за особые трудовые заслуги перед государством и народом. Проверена копия в правовой базе, а не на официальном портале, поэтому оценка C.",
 "这份总统令为“提高自我牺牲与认真劳动的社会意义与声望”，设立了授予对国家和人民有特殊劳动功绩者的最高荣誉称号。核实的是法律数据库中的副本而非官方法律门户，因此定为C。",
 "「自己犠牲的で誠実な労働の社会的意義と威信を高めるため」、国家と国民に対する特別な労働の功績に与える最高位の称号を設けた大統領令である。公式の法令ポータルではなく法令データベースの写しを確認したのでCとする。"],
["헌법은 '노동의 자유'로 바꾼 러시아가 노동의 영예를 국가 칭호로 되살린 이중성을 보여 주는 데 쓴다.","Used to show the double stance of a Russia that rewrote its constitution as 'free labour' yet revived labour's honour as a state title.","Используется, чтобы показать двойственность: Россия переписала конституцию в духе «свободы труда», но вернула почёт труда в виде государственного звания.","用于展示俄罗斯的双重性：宪法改为“劳动自由”，却以国家称号恢复了劳动的荣誉。","憲法を「労働の自由」に改めたロシアが、労働の栄誉を国家の称号として復活させた二面性を示すために使う。"]);

E(75,"B","book",1930,"John Maynard Keynes, 'Economic Possibilities for our Grandchildren' (1930), text hosted by Yale University","Economic Possibilities for our Grandchildren","http://www.econ.yale.edu/smith/econ116a/keynes1.pdf",
"Three-hour shifts or a fifteen-hour week may put off the problem",
["기술 진보로 경제 문제가 풀려 가는 과정에서 '기술적 실업'—노동을 아끼는 수단의 발견이 노동의 새 쓰임을 찾는 속도를 앞지르는 실업—이 오겠지만, 남은 일을 넓게 나눠 하루 3시간 교대나 주 15시간 노동으로 버틸 수 있으리라 내다본 에세이다. 예측 에세이이므로 실증 근거가 아니라 탈노동론의 고전적 진술로 쓴다.",
 "An essay predicting that, as technical progress solves the economic problem, 'technological unemployment' — means of economising labour outrunning new uses for it — would come, but that sharing the remaining work widely through three-hour shifts or a fifteen-hour week might hold the problem off. As a forecast essay it is used as the classic statement of post-work thinking, not as empirical evidence.",
 "Эссе с прогнозом: по мере того как технический прогресс решает экономическую проблему, придёт «технологическая безработица» — средства экономии труда опередят поиск новых применений для него, — но широкое распределение оставшейся работы через трёхчасовые смены или 15-часовую неделю может отсрочить проблему. Это прогнозное эссе, поэтому оно используется как классическое изложение посттрудовой мысли, а не как эмпирическое свидетельство.",
 "这篇文章预测：随着技术进步解决经济问题，将出现“技术性失业”——节约劳动的手段的发现快于为劳动找到新用途的速度——但把剩余工作广泛分摊，以每天三小时轮班或每周十五小时工作，或可推迟这一问题。作为预测性文章，它被用作后工作论的经典表述，而非实证依据。",
 "技術の進歩で経済問題が解決されていく過程で「技術的失業」—労働を節約する手段の発見が労働の新たな使い道を見つける速度を上回る失業—が来るが、残った仕事を広く分け合い、1日3時間の交代制や週15時間労働でしのげるだろうと見通したエッセイである。予測のエッセイなので実証の根拠ではなく脱労働論の古典的な言明として使う。"],
["입장 4(탈노동론)의 원전이자, AI 시대 '기술적 실업' 논의의 출발점으로 쓴다.","Used as the primary text for Position 4 (post-work) and as the starting point of the AI-era debate on technological unemployment.","Используется как первоисточник позиции 4 (посттрудовой) и отправная точка дискуссии о технологической безработице в эпоху ИИ.","作为立场四（后工作论）的原始文献，也是AI时代“技术性失业”讨论的起点。","立場4（脱労働論）の原典であり、AI時代の「技術的失業」の議論の出発点として使う。"]);

E(76,"A","q1",2022,"Magdalena Soffia, Alex J. Wood & Brendan Burchell, Work, Employment and Society 36(5) (2022), pp. 816–840","Alienation Is Not 'Bullshit': An Empirical Critique of Graeber's Theory of BS Jobs","https://research.birmingham.ac.uk/en/publications/alienation-is-not-bullshit-an-empirical-critique-of-graebers-theo/",
"The proportion of employees describing their jobs as useless is low and declining",
["EU 대표 표본 자료로 그레이버의 '쓸모없는 일' 이론의 핵심 가설 다섯 가지를 검증해, 자기 일을 쓸모없다고 여기는 것은 낮은 웰빙과 강하게 연관되지만 그 비율은 낮고 줄고 있으며 이론의 예측과 거의 관계가 없다고 보고했다. 연구진은 마르크스의 소외 개념과 '노동 관계' 접근으로 대안적 설명을 제시했다. 대학 저장소의 초록을 확인했으며, 본문의 세부 수치는 출판사 페이지가 자동 접속을 막아 쓰지 않았다.",
 "Testing five core hypotheses of Graeber's theory of 'bullshit jobs' on representative EU data, it found that seeing one's job as useless is strongly associated with poor wellbeing, but that the share of such workers is low, declining and bears little relation to the theory's predictions; the authors offer an alternative account drawing on Marx's concept of alienation and a 'Work Relations' approach. The abstract was verified in the university repository; detailed figures were not used because the publisher's page blocks automated access.",
 "Проверив на репрезентативных данных ЕС пять ключевых гипотез теории «бредовой работы» Грэбера, авторы нашли, что восприятие своей работы как бесполезной сильно связано с плохим благополучием, но доля таких работников мала, снижается и почти не соответствует прогнозам теории; альтернативное объяснение опирается на марксово понятие отчуждения и подход «трудовых отношений». Аннотация проверена в репозитории университета; подробные цифры не использованы, так как страница издателя блокирует автоматический доступ.",
 "该研究用欧盟代表性数据检验了格雷伯“狗屁工作”理论的五个核心假设，发现认为自己工作无用与较差的幸福感强相关，但这类员工比例低且在下降，与理论预测几乎无关；作者借马克思的异化概念与“工作关系”视角提出替代解释。核实的是大学知识库中的摘要；因出版社页面阻止自动访问，未使用正文的详细数字。",
 "EUの代表標本データでグレーバーの「クソどうでもいい仕事」理論の中核仮説5つを検証し、自分の仕事を無用だと見なすことは低いウェルビーイングと強く関連するが、その割合は低く減少しており理論の予測とほとんど関係がないと報告した。著者らはマルクスの疎外概念と「労働関係」アプローチで代替的な説明を示した。大学リポジトリの抄録を確認し、本文の詳細な数値は出版社のページが自動アクセスを遮るため使わなかった。"],
["탈노동론의 진단 일부(무의미한 일의 확산)가 실증에서 과장됐다는 근거로 쓴다.","Used as evidence that part of the post-work diagnosis — the spread of meaningless jobs — is overstated empirically.","Используется как свидетельство того, что часть посттрудового диагноза — распространение бессмысленной работы — эмпирически преувеличена.","用作证据：后工作论诊断的一部分（无意义工作的扩散）在实证上被夸大了。","脱労働論の診断の一部（無意味な仕事の拡散）が実証では誇張されているという根拠として使う。"]);

E(77,"A","q1",2005,"Frances McKee-Ryan, Zhaoli Song, Connie R. Wanberg & Angelo J. Kinicki, Journal of Applied Psychology 90(1) (2005)","Psychological and physical well-being during unemployment: a meta-analytic study","https://pubmed.ncbi.nlm.nih.gov/15641890/",
"Unemployed individuals had lower psychological and physical well-being than did their employed counterparts.",
["104개 연구, 437개 효과크기를 묶은 메타분석이다. 실업자의 심리적·신체적 웰빙이 취업자보다 낮았고, 실업 기간과 표본 유형은 이 관계를 조절했지만 당시 실업률과 실업 급여 수준은 조절하지 않았다. 실업자 안에서는 일의 중심성, 시간 구조를 포함한 대처 자원, 인지적 평가와 대처 전략이 인적 자본·인구학 변수보다 정신건강과 강하게 연관됐다. 상관 연구가 많아 인과의 방향은 종단 연구에서만 따질 수 있다.",
 "A meta-analysis of 104 studies and 437 effect sizes. The unemployed had lower psychological and physical well-being than the employed; unemployment duration and sample type moderated the relationship, but the unemployment rate and the level of benefits did not. Among the unemployed, work-role centrality, coping resources including time structure, cognitive appraisals and coping strategies related more strongly to mental health than human capital or demographics. Many studies are correlational, so causal direction can be judged only from the longitudinal ones.",
 "Метаанализ 104 исследований и 437 размеров эффекта. У безработных психологическое и физическое благополучие ниже, чем у занятых; длительность безработицы и тип выборки модерировали связь, а уровень безработицы и размер пособий — нет. Среди безработных центральность трудовой роли, ресурсы совладания, включая структуру времени, когнитивные оценки и стратегии совладания были сильнее связаны с психическим здоровьем, чем человеческий капитал и демография. Многие исследования корреляционные, так что направление причинности можно оценить лишь по лонгитюдным.",
