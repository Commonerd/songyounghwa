 "In an experiment where 26 UK general practitioners saw simulated decision-support advice across 20 prescribing scenarios, they changed prescriptions in 22.5% of scenarios and accuracy rose from 50.38% to 58.27%, but automation bias — switching from a correct to an incorrect prescription because of wrong advice — occurred in 5.2% of all cases. The sample is small and the scenarios hypothetical.",
 "В эксперименте 26 британских врачей общей практики получали смоделированные подсказки системы поддержки решений в 20 сценариях назначения: они меняли назначение в 22,5% сценариев, точность выросла с 50,38% до 58,27%, но смещение в пользу автоматики — смена верного назначения на неверное из-за ошибочной подсказки — возникло в 5,2% случаев. Выборка мала, сценарии гипотетические.",
 "在26名英国全科医生于20个处方情景中接受模拟决策支持建议的实验中，接受建议后改变处方的比例为22.5%，正确率从50.38%升至58.27%，但因错误建议把正确处方改错的自动化偏差占全部病例的5.2%。样本小、情景为假设。",
 "英国の一般医26人が処方シナリオ20件で模擬の意思決定支援の助言を受けた実験で、助言後に処方を変えた割合は22.5%、正答率は50.38%から58.27%に上がったが、正しい処方を誤った助言のせいで変えた自動化バイアスは全体の5.2%だった。標本が小さく仮想シナリオである。"],
["AI가 전체 정확도를 높이면서도 새로운 오류를 만들고, 그 오류의 책임이 사람에게 돌아가는 구조의 수치 근거로 쓴다.","Used as numeric evidence of the structure in which AI raises overall accuracy yet creates new errors whose blame falls on the human.","Используется как числовое свидетельство структуры, где ИИ повышает общую точность, но порождает новые ошибки, вина за которые ложится на человека.","作为AI提高整体准确率却制造新错误、且错误责任落到人身上之结构的数字依据。","AIが全体の正確さを高めつつ新たな誤りを生み、その誤りの責任が人に帰る構造の数値的根拠として使う。"]);

E(36,"A","q1",2015,"Berkeley J. Dietvorst, Joseph P. Simmons & Cade Massey, Journal of Experimental Psychology: General 144(1) (2015)","Algorithm aversion: people erroneously avoid algorithms after seeing them err","https://pubmed.ncbi.nlm.nih.gov/25401381/",
"people more quickly lose confidence in algorithmic than human forecasters",
["5개 실험에서 사람들은 알고리즘이 실수하는 것을 본 뒤, 같은 실수를 한 사람보다 알고리즘을 더 빨리 불신했고 더 나은 알고리즘 대신 열등한 사람 예측자를 골랐다. 실험 과제가 예측에 한정된다.",
 "Across five studies, after seeing an algorithm err people lost confidence in it faster than in a human making the same mistake, and chose an inferior human forecaster over a better algorithm. The tasks are limited to forecasting.",
 "В пяти исследованиях, увидев ошибку алгоритма, люди теряли доверие к нему быстрее, чем к человеку с той же ошибкой, и выбирали худшего человека-прогнозиста вместо лучшего алгоритма. Задачи ограничены прогнозированием.",
 "五项研究显示，人们看到算法出错后，比对犯同样错误的人更快失去信任，并选择较差的人类预测者而非更好的算法。实验任务限于预测。",
 "5つの実験で、人はアルゴリズムが間違えるのを見た後、同じ間違いをした人よりアルゴリズムを早く信頼しなくなり、より良いアルゴリズムより劣った人の予測者を選んだ。実験課題は予測に限られる。"],
["사람이 AI 실패에 대해 이중 기준을 적용해, 감독자에게 'AI를 왜 믿었나'라는 비난과 'AI를 왜 안 썼나'라는 비난이 동시에 걸릴 수 있다는 추론(D)에 쓴다.","Used for the inference (D) that people apply double standards to AI failure, so supervisors can face both 'why did you trust the AI?' and 'why didn't you use it?'.","Используется для вывода (D) о двойных стандартах к ошибкам ИИ: надзирающего могут упрекать и «зачем доверился ИИ?», и «почему не использовал?».","用于推论（D）：人们对AI失败采取双重标准，监督者可能同时面临“为何信AI”与“为何不用AI”的指责。","人がAIの失敗に二重基準を当てはめ、監督者が「なぜAIを信じたのか」と「なぜAIを使わなかったのか」の両方で非難されうるという推論（D）に使う。"]);

E(37,"A","q1",2024,"M. Joo, PLOS ONE (2024)","It's the AI's fault, not mine: Mind perception increases blame attribution to AI","https://europepmc.org/article/MED/39693294",
"cautioning against the potential misuse of AI as a scapegoat",
["세 연구에서 AI에 사람 같은 마음이 있다고 지각할수록 도덕적 위반의 책임을 AI에 더 돌리고, 관련 회사 같은 인간 이해관계자의 책임은 덜 묻는 경향을 보였다. 시나리오 기반 실험이며 표본 국가는 초록에서 확인하지 못했다.",
 "Across three studies, the more people perceived a human-like mind in AI, the more they blamed AI for moral transgressions and the less they blamed human stakeholders such as the company involved. It uses scenario-based experiments; the sample country could not be confirmed from the abstract.",
 "В трёх исследованиях чем сильнее люди приписывали ИИ человекоподобный разум, тем больше винили ИИ в моральных нарушениях и тем меньше — людей, например причастную компанию. Эксперименты на сценариях; страна выборки по аннотации не установлена.",
 "三项研究显示，人们越认为AI具有类人心智，就越把道德违规的责任归于AI，并越少追究相关公司等人类利益相关者。基于情景实验；样本国家未能从摘要确认。",
 "3つの研究で、AIに人のような心があると知覚するほど道徳的違反の責任をAIに帰し、関与した会社のような人間の利害関係者の責任は問わない傾向を示した。シナリオに基づく実験で、標本の国は抄録から確認できなかった。"],
["'AI가 정했다'는 해명으로 책임이 증발하는 'AI 희생양' 위험의 실험 근거로 쓴다.","Used as experimental evidence of the 'AI scapegoat' risk, in which 'the AI decided' makes responsibility evaporate.","Используется как экспериментальное свидетельство риска «ИИ — козёл отпущения», когда фраза «решил ИИ» растворяет ответственность.","作为“AI决定的”说辞使责任蒸发之“AI替罪羊”风险的实验依据。","「AIが決めた」という弁明で責任が蒸発する「AIのスケープゴート」の危険の実験的根拠として使う。"]);

E(38,"A","q1",2024,"B. D. Earp, S. Porsdam Mann, P. Liu et al., Annals of the New York Academy of Sciences (2024)","Credit and blame for AI-generated content: Effects of personalization in four countries","https://europepmc.org/article/MED/39585780",
"LLM type did not significantly affect blame attributions for harmful outputs",
["미국·영국·중국·싱가포르의 대표 표본 1,802명 사전등록 실험에서, 개인화 LLM을 쓴 사용자에게 좋은 결과의 공은 더 주지만 해로운 결과의 비난은 LLM 종류와 관계없이 사용자에게 돌아갔다(중국 일부 예외). 영국 응답자는 LLM을 쓴 경우 더 비난했다. 시나리오 판단이라 실제 직장 평가와는 다를 수 있다.",
 "In a preregistered experiment with representative samples (N=1,802) in the US, UK, China and Singapore, users of personalised LLMs got more credit for good outputs, but blame for harmful outputs fell on users regardless of LLM type (with a partial exception in China); UK participants blamed users of any LLM more. These are scenario judgements and may differ from real workplace evaluation.",
 "В предрегистрированном эксперименте на репрезентативных выборках (N=1802) в США, Великобритании, Китае и Сингапуре пользователям персонализированных LLM приписывали больше заслуг за хорошие результаты, но вину за вредные результаты возлагали на пользователей независимо от типа LLM (частичное исключение — Китай); британцы сильнее винили использовавших любую LLM. Это оценки сценариев, на работе может быть иначе.",
 "在美、英、中、新加坡代表性样本（N=1,802）的预先注册实验中，使用个性化LLM者在好结果上获得更多功劳，但有害结果的指责不论LLM类型都落在使用者身上（中国部分例外）；英国受访者对使用任何LLM者指责更多。属情景判断，可能与真实职场评价不同。",
 "米・英・中・シンガポールの代表標本1,802人の事前登録実験で、個人化LLMを使った利用者に良い結果の功績はより多く与えたが、有害な結果の非難はLLMの種類に関係なく利用者に向かった（中国で一部例外）。英国の回答者はLLMを使った場合により非難した。シナリオ判断なので実際の職場評価とは異なりうる。"],
["AI를 쓴 노동자는 공은 나눠 갖고 비난은 혼자 지는 '비대칭'의 국제 비교 근거로 쓴다.","Used as cross-country evidence of the asymmetry whereby AI-using workers share credit but bear blame alone.","Используется как межстрановое свидетельство асимметрии: работник с ИИ делит заслуги, но вину несёт один.","作为“使用AI的劳动者功劳共享、指责独担”不对称性的国际比较依据。","AIを使った労働者は功績は分け合い非難は一人で負うという「非対称」の国際比較の根拠として使う。"]);

E(39,"B","q1",2022,"C. Maasland & K. S. Weißmüller, Frontiers in Psychology (2022)","Blame the Machine? Insights From an Experiment on Algorithm Aversion and Blame Avoidance in Computer-Aided Human Resource Management","https://europepmc.org/article/MED/35693517",
"Respondents' aversion to algorithms dominates blame avoidance by delegation.",
["독일의 고학력 청년 288명 2×2 무작위 실험에서 해고 같은 불쾌한 인사 결정을 승진보다 알고리즘에 맡기려는 경향이 있었지만, 이는 알고리즘을 미리 시험할 기회와 신뢰 수준에 크게 좌우됐고 전체적으로는 알고리즘 회피가 비난 회피를 앞섰다. 표본이 작고 학생 비중이 높다.",
 "In a 2×2 randomised experiment with 288 highly educated young people in Germany, respondents tended to delegate unpleasant HR decisions such as dismissals rather than promotions to an algorithm, but this depended strongly on the chance to pretest it and on trust; overall, algorithm aversion outweighed blame avoidance. The sample is small and student-heavy.",
 "В рандомизированном эксперименте 2×2 с 288 молодыми людьми с высшим образованием в Германии респонденты охотнее передавали алгоритму неприятные кадровые решения (увольнения), чем повышения, но это сильно зависело от возможности опробовать алгоритм и доверия; в целом неприятие алгоритмов перевесило избегание вины. Выборка мала, много студентов.",
 "在德国288名高学历年轻人参与的2×2随机实验中，受访者倾向于把解雇等不愉快的人事决定（而非晋升）交给算法，但这在很大程度上取决于能否预先测试算法和信任程度；总体上算法厌恶压过了借委托回避指责。样本小、学生占比高。",
 "ドイツの高学歴の若者288人の2×2無作為化実験で、解雇のような不快な人事決定を昇進よりアルゴリズムに任せる傾向があったが、それはアルゴリズムを事前に試す機会と信頼の水準に大きく左右され、全体ではアルゴリズム回避が非難回避を上回った。標本が小さく学生の比率が高い。"],
["불쾌한 결정을 기계에 넘겨 비난을 피하려는 유인이 실재한다는 실험 근거로 쓴다.","Used as experimental evidence that the incentive to hand unpleasant decisions to machines to avoid blame is real.","Используется как экспериментальное свидетельство реального стимула передавать неприятные решения машине, чтобы избежать вины.","作为“把不愉快决定交给机器以回避指责”的诱因确实存在的实验依据。","不快な決定を機械に渡して非難を避けようとする誘因が実在するという実験的根拠として使う。"]);

E(40,"B","io",2019,"National Transportation Safety Board (US), Highway Accident Report NTSB/HAR-19/03 (2019)","Collision Between Vehicle Controlled by Developmental Automated Driving System and Pedestrian, Tempe, Arizona, March 18, 2018","https://www.ntsb.gov/investigations/AccidentReports/Reports/HAR1903.pdf",
"all a consequence of its inadequate safety culture",
["2018년 우버 자율주행 시험차 보행자 사망 사고에서 NTSB는 휴대전화에 시선을 빼앗긴 안전 운전자의 감시 실패를 '추정 원인'으로 들었지만, 우버의 부실한 위험 평가, 운전자 감독 부실, 자동화 안주를 다루는 장치 부재를 '부적절한 안전 문화'의 결과인 기여 요인으로, 애리조나 교통부의 감독 부족도 기여 요인으로 꼽았다. 시스템은 충돌 5.6초 전 보행자를 감지했지만 설계상 비상제동을 하지 않고 운전자 개입에 의존했다.",
 "In the 2018 fatal crash of an Uber automated test vehicle, the NTSB named the safety operator's failure to monitor, due to phone distraction, as probable cause, but listed Uber's inadequate risk assessment, ineffective oversight of operators and lack of mechanisms for automation complacency — all consequences of an inadequate safety culture — as contributing, along with the Arizona transport department's insufficient oversight. The system detected the pedestrian 5.6 seconds before impact but by design did not brake, relying on the operator.",
 "В смертельной аварии беспилотного тестового автомобиля Uber в 2018 г. NTSB назвал вероятной причиной то, что оператор безопасности, отвлечённый телефоном, не следил за дорогой, но сопутствующими факторами — неадекватную оценку рисков Uber, слабый надзор за операторами и отсутствие мер против самоуспокоенности, «всё следствие неадекватной культуры безопасности», а также недостаточный надзор транспортного ведомства Аризоны. Система обнаружила пешехода за 5,6 с до удара, но по конструкции не тормозила, полагаясь на оператора.",
 "在2018年优步自动驾驶测试车撞死行人的事故中，NTSB将因手机分心的安全驾驶员监视失败列为“可能原因”，但把优步风险评估不足、对驾驶员监督无效、缺乏应对自动化自满的机制列为“均源于不当安全文化”的促成因素，并将亚利桑那州交通部监管不足列为促成因素。系统在撞击前5.6秒检测到行人，但按设计不进行紧急制动，而依赖驾驶员干预。",
 "2018年のウーバー自動運転試験車の歩行者死亡事故で、NTSBは携帯電話に気を取られた安全運転者の監視の失敗を「推定原因」としたが、ウーバーの不十分なリスク評価、運転者監督の不備、自動化への安住に対処する仕組みの欠如を「不適切な安全文化」の結果である寄与要因とし、アリゾナ州交通局の監督不足も寄与要因に挙げた。システムは衝突5.6秒前に歩行者を検知したが、設計上緊急ブレーキをかけず運転者の介入に頼った。"],
["'추정 원인은 개인, 기여 요인은 조직'이라는 책임의 층위를 보여 주는 1차 조사 보고서로 쓴다.","Used as the primary investigation report showing layered responsibility: probable cause on the individual, contributing factors in the organisation.","Используется как первичный доклад расследования, показывающий слои ответственности: вероятная причина — человек, сопутствующие факторы — организация.","作为展示“可能原因在个人、促成因素在组织”之责任层次的一手调查报告。","「推定原因は個人、寄与要因は組織」という責任の層を示す一次調査報告として使う。"]);

// ===== Evidence 41–55: inquiries, AI-attributed layoffs, laws and rules (EU, UK, US, Korea, Japan, Russia), OECD =====
E(41,"B","io",2025,"Post Office Horizon IT Inquiry (Chair: Sir Wyn Williams), Report Volume 1, HC 1119 (ordered printed 8 Jul 2025)","Post Office Horizon IT Inquiry Report: Volume 1 — Redress and the human impact of the Horizon scandal","https://www.postofficehorizoninquiry.org.uk/volume-1-post-office-horizon-it-inquirys-final-report",
"as a consequence of Horizon showing an illusory shortfall in branch accounts",
["영국 우체국 회계 시스템 호라이즌의 결함 때문에 수백 명의 우체국 운영자가 절도·사기 혐의를 받은 사건의 법정 조사 1권으로, 피해 회복과 인간적 피해를 다룬다. 가족에 따르면 호라이즌이 보여 준 '허상의 부족분' 때문에 목숨을 끊은 사람이 운영자 6명과 그 밖의 7명이고, 최소 59명이 자살을 생각했으며 그중 10명이 시도했다. 원인 규명과 책임 판단은 이후 권에서 다룬다.",
 "Volume 1 of the statutory inquiry into how hundreds of Post Office operators were accused of theft and fraud because of faults in the Horizon accounting system; it covers redress and human impact. According to families, six former postmasters and seven others took their own lives because Horizon showed an illusory shortfall; at least 59 people contemplated suicide and ten attempted it. Causes and culpability are left to later volumes.",
 "Первый том официального расследования о том, как сотни операторов почтовых отделений обвинили в краже и мошенничестве из-за сбоев учётной системы Horizon; посвящён возмещению и человеческому ущербу. По словам семей, шесть бывших почтмейстеров и ещё семь человек покончили с собой из-за «мнимой недостачи», показанной Horizon; не менее 59 человек думали о самоубийстве, 10 пытались. Причины и вина — в следующих томах.",
 "英国邮局会计系统Horizon的缺陷导致数百名邮局经营者被控盗窃与欺诈，这是该法定调查的第一卷，涉及赔偿与人身伤害。据家属称，因Horizon显示的“虚假短缺”而轻生者有前邮局经营者6人及其他7人，至少59人曾想自杀，其中10人尝试过。原因与责任认定留待后续各卷。",
 "英国郵便局の会計システム「ホライズン」の欠陥のために数百人の郵便局運営者が窃盗・詐欺の容疑をかけられた事件の法定調査の第1巻で、被害回復と人的被害を扱う。家族によれば、ホライズンが示した「見かけの不足額」のために命を絶ったのは元運営者6人とその他7人で、少なくとも59人が自殺を考え、うち10人が試みた。原因究明と責任の判断は後の巻で扱う。"],
["시스템 결함의 책임이 가장 아래 개인에게 형사 책임으로까지 전가된 최악의 사례로 쓴다.","Used as the worst case in which responsibility for a system fault was shifted to the lowest-level individuals, even as criminal liability.","Используется как худший случай, когда ответственность за сбой системы переложили на людей нижнего звена — вплоть до уголовной.","作为系统缺陷的责任被转嫁到最底层个人、甚至成为刑事责任的最严重案例。","システム欠陥の責任が最下層の個人に刑事責任まで転嫁された最悪の事例として使う。"]);

E(42,"B","io",2023,"Royal Commission into the Robodebt Scheme (Australia; Commissioner Catherine Holmes), Report (7 Jul 2023; updated 11 Jul 2023)","Report of the Royal Commission into the Robodebt Scheme","https://robodebt.royalcommission.gov.au/publications/report",
"business rules and algorithms should be made available, to enable independent expert scrutiny",
["호주 복지 수급자에게 자동 소득 대조로 부채를 매긴 '로보데트' 제도에 대한 왕립위원회 보고서로, 57개 권고를 냈다. 자동화 결정에는 이의 경로와 알고리즘 공개, 감시·감사 기구가 필요하고, 현장 직원과의 진정한 협의와 피드백 절차가 필요하다고 권고했다. 사례로만 쓰고 국가 비교표에는 넣지 않는다.",
 "The royal commission report on 'Robodebt', which raised debts against Australian welfare recipients through automated income matching, made 57 recommendations. It calls for review paths and published algorithms for automated decisions, a body to monitor and audit them, and genuine consultation and feedback processes with frontline staff. It is used as a case only, not in the country table.",
 "Доклад королевской комиссии о схеме «Рободолг», начислявшей долги австралийским получателям пособий через автоматическую сверку доходов; 57 рекомендаций. Требует путей обжалования и раскрытия алгоритмов для автоматических решений, органа мониторинга и аудита, подлинных консультаций и обратной связи с сотрудниками на передовой. Используется только как кейс, не в таблице стран.",
 "澳大利亚通过自动收入比对向福利领取者追债的“机器人追债”制度的皇家委员会报告，提出57项建议：自动化决定需要申诉途径与算法公开、监测与审计机构，并需与一线员工真诚协商和建立反馈程序。仅作为案例使用，不列入国家比较表。",
 "オーストラリアの福祉受給者に自動の所得照合で債務を課した「ロボデット」制度に関する王立委員会の報告書で、57の勧告を出した。自動化された決定には異議の経路とアルゴリズムの公開、監視・監査機関が必要で、現場職員との真の協議とフィードバック手続きが必要だと勧告した。事例としてだけ使い、国の比較表には入れない。"],
["공공 자동화에서 현장 직원과 수급자가 함께 피해자가 된 구조와 제도적 처방의 근거로 쓴다.","Used as evidence of a structure in which frontline staff and recipients both became victims of public automation, and of the institutional remedies.","Используется как свидетельство структуры, где и сотрудники, и получатели стали жертвами государственной автоматизации, и институциональных средств исправления.","作为公共自动化中一线员工与受领者一同成为受害者之结构及制度处方的依据。","公共の自動化で現場職員と受給者がともに被害者となった構造と制度的処方の根拠として使う。"]);

E(43,"C","press",2026,"SiliconANGLE (Maria Deutscher), 26 Nov 2026, citing Bloomberg","SAP reportedly plans to lay off 10,000+ employees amid AI push","https://siliconangle.com/2026/11/26/sap-reportedly-plans-to-lay-off-10000-employees-amid-ai-push",
"SAP continuously reviews its organization to ensure it remains aligned",
["블룸버그 보도를 인용해 SAP가 인력의 9%가 넘는 1만 명 이상 감원을 검토하며, 이것이 제품에 AI 기능을 더 넣으려는 노력과 연결돼 있다고 전했다. 회사의 공식 발표가 아니라 '보도에 따르면'이고 규모도 바뀔 수 있다. 원 블룸버그 기사는 열지 못했다.",
 "Citing Bloomberg, it reports SAP is weighing cuts of at least 10,000 jobs — over 9% of its workforce — linked to efforts to add more AI features to its products. It is 'reportedly', not a company announcement, and the scope may change; the original Bloomberg article was not opened.",
 "Со ссылкой на Bloomberg сообщает, что SAP рассматривает сокращение не менее 10 000 сотрудников (более 9% персонала) в связи с усилиями добавить больше функций ИИ в продукты. Это «по сообщениям», а не заявление компании, масштаб может измениться; оригинал Bloomberg не открыт.",
 "援引彭博报道称，SAP正考虑裁员至少1万人（超过员工总数的9%），这与其在产品中加入更多AI功能的努力相关。属“据报道”而非公司公告，规模可能变化；未能打开彭博原文。",
 "ブルームバーグの報道を引用し、SAPが人員の9%を超える1万人以上の削減を検討しており、それが製品にAI機能をさらに入れる取り組みと結びついていると伝えた。会社の公式発表ではなく「報道によれば」で、規模も変わりうる。ブルームバーグの原記事は開けなかった。"],
["보고서 작성 이틀 전의 뉴스 걸이로, 구조조정의 이유로 'AI'가 거론되는 흐름을 보여 주는 데만 쓴다.","Used only as a news hook from two days before writing, showing how 'AI' is cited as a reason for restructuring.","Используется лишь как новостной повод за два дня до написания — пример того, как «ИИ» называют причиной реструктуризации.","仅作为撰写前两天的新闻引子，显示“AI”被列为重组理由的趋势。","執筆2日前のニュースの導入として、構造調整の理由に「AI」が挙げられる流れを示すことにだけ使う。"]);

E(44,"B","io",2024,"European Union, Regulation (EU) 2024/1689 (Artificial Intelligence Act), Official Journal 12 Jul 2024","Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence","https://eur-lex.europa.eu/eli/reg/2024/1689/oj",
"assign human oversight to natural persons who have the necessary competence, training and authority",
["제14조는 고위험 AI를 사람이 효과적으로 감독할 수 있게 설계하고, 감독자가 자동화 편향의 가능성을 인식하며 출력을 무시·번복하거나 시스템을 멈출 수 있게 하라고 정한다. 제26조는 배치자(deployer)가 역량·훈련·권한과 지원을 갖춘 사람에게 감독을 맡기고 로그를 보관하도록 한다. 원문은 2026년 8월 2일 전면 적용을 정했으나, 이후 적용 일정 조정 여부는 이 보고서에서 확인하지 못했다.",
 "Article 14 requires high-risk AI to be designed for effective human oversight, with overseers aware of possible automation bias and able to disregard, override or reverse outputs or stop the system. Article 26 requires deployers to assign oversight to people with the necessary competence, training, authority and support, and to keep logs. The original text set general application from 2 August 2026; whether the timetable was later adjusted was not verified for this report.",
 "Статья 14 требует проектировать высокорисковый ИИ для эффективного человеческого надзора, чтобы надзирающие знали о возможном смещении в пользу автоматики и могли игнорировать, отменять результаты или останавливать систему. Статья 26 обязывает эксплуатантов поручать надзор людям с необходимыми компетенцией, подготовкой, полномочиями и поддержкой и хранить журналы. Исходный текст установил общее применение со 2 августа 2026 г.; последующие изменения сроков в докладе не проверялись.",
 "第14条要求高风险AI被设计为可由人有效监督，监督者应意识到自动化偏差的可能，并能无视、推翻输出或停止系统。第26条要求部署者把监督交给具备必要能力、培训、权限与支持的人并保存日志。原文规定自2026年8月2日起全面适用，此后适用日程是否调整本报告未能核实。",
 "第14条は高リスクAIを人が効果的に監督できるよう設計し、監督者が自動化バイアスの可能性を認識し、出力を無視・覆したりシステムを止めたりできるようにと定める。第26条は導入者（デプロイヤー）が能力・訓練・権限と支援を備えた人に監督を任せ、ログを保管するよう求める。原文は2026年8月2日の全面適用を定めたが、その後の適用日程の調整の有無は本報告で確認できなかった。"],
["'사람의 감독'에 권한과 자원을 붙여 비난 스펀지가 되지 않게 하려는 가장 구체적인 법 조문으로 쓴다.","Used as the most concrete legal text that attaches authority and resources to 'human oversight' so it does not become a blame sponge.","Используется как самая конкретная правовая норма, придающая «человеческому надзору» полномочия и ресурсы, чтобы он не стал «губкой вины».","作为给“人的监督”配上权限与资源、使其不成为指责海绵的最具体法律条文。","「人の監督」に権限と資源をつけ、非難のスポンジにならないようにする最も具体的な法の条文として使う。"]);

E(45,"B","io",2024,"European Union, Directive (EU) 2024/2831 on improving working conditions in platform work","Directive (EU) 2024/2831 (Platform Work Directive)","https://eur-lex.europa.eu/eli/dir/2024/2831/oj",
"shall enjoy protection from dismissal or its equivalent, disciplinary measures",
["제10조는 플랫폼이 자동 감시·결정 시스템을 감독할 충분한 인력을 두고, 감독자가 자동 결정을 뒤집을 권한을 갖되 그 기능을 행사했다고 해고·징계 등 불이익을 받지 않도록 보호하라고 정한다. 제11조는 자동 결정에 대한 설명과 담당자 접촉, 서면 사유를 보장한다. 회원국 이행 기한은 2026년 12월 2일이며 플랫폼 노동에만 적용된다.",
 "Article 10 requires platforms to have sufficient staff to oversee automated monitoring and decision systems, with authority to override automated decisions and protection from dismissal, disciplinary measures and other adverse treatment for exercising that function. Article 11 guarantees explanations, a contact person and written reasons for automated decisions. Member states must transpose it by 2 December 2026, and it applies only to platform work.",
 "Статья 10 требует от платформ достаточного персонала для надзора за автоматическими системами мониторинга и решений, с полномочием отменять автоматические решения и защитой от увольнения, дисциплинарных мер и иного ущерба за выполнение этой функции. Статья 11 гарантирует объяснения, контактное лицо и письменные причины. Срок транспонирования — 2 декабря 2026 г.; действует только для платформенного труда.",
 "第10条要求平台配备足够人员监督自动监控与决策系统，监督者有权推翻自动决定，且不因行使该职能而遭解雇、纪律处分等不利对待。第11条保障对自动决定的解释、联系负责人与书面理由。成员国转化期限为2026年12月2日，仅适用于平台劳动。",
 "第10条はプラットフォームが自動監視・決定システムを監督する十分な人員を置き、監督者が自動決定を覆す権限を持ち、その機能を行使したことで解雇・懲戒など不利益を受けないよう保護せよと定める。第11条は自動決定への説明と担当者との接触、書面の理由を保障する。加盟国の国内法化期限は2026年12月2日で、プラットフォーム労働にだけ適用される。"],
["감독자를 비난에서 보호하는 조항이 실제 법에 들어간 첫 사례로 쓴다.","Used as the first case of a provision protecting overseers from blame entering actual law.","Используется как первый случай, когда норма, защищающая надзирающих от наказания, вошла в действующее право.","作为保护监督者免受指责的条款写入实际法律的首例。","監督者を非難から守る条項が実際の法に入った最初の事例として使う。"]);

E(46,"B","io",2024,"European Union, Directive (EU) 2024/2853 on liability for defective products","Directive (EU) 2024/2853 (Product Liability Directive)","https://eur-lex.europa.eu/eli/dir/2024/2853/oj",
"it includes electricity, digital manufacturing files, raw materials and software",
["개정 제조물책임지침은 '제조물'에 소프트웨어를 명시해, 결함 있는 AI 소프트웨어로 생긴 피해에 무과실 책임의 길을 열었다. 회원국 이행 기한은 2026년 12월 9일이다. 소비자·피해자 배상 규칙이라 직장 내 평가·징계 책임은 다루지 않는다.",
 "The revised Product Liability Directive explicitly includes software in 'product', opening a no-fault route for harm caused by defective AI software. Member states must transpose it by 9 December 2026. As a rule on compensating victims it does not address workplace evaluation or discipline.",
 "Обновлённая директива об ответственности за продукцию прямо включает ПО в понятие «продукт», открывая путь безвиновной ответственности за вред от дефектного ИИ-ПО. Срок транспонирования — 9 декабря 2026 г. Это правило о возмещении вреда; оценку и дисциплину на работе оно не затрагивает.",
 "修订后的产品责任指令在“产品”中明确包括软件，为缺陷AI软件造成的损害开辟无过错责任之路。成员国转化期限为2026年12月9日。属于受害人赔偿规则，不涉及职场评价与纪律责任。",
 "改正製造物責任指令は「製造物」にソフトウェアを明記し、欠陥のあるAIソフトウェアによる被害に無過失責任の道を開いた。加盟国の国内法化期限は2026年12月9日である。被害者への賠償の規則で、職場での評価・懲戒の責任は扱わない。"],
["법적 배상(liability)을 결함 있는 시스템의 공급자에게 두는 방향의 근거로 쓴다.","Used as evidence of the direction of placing legal liability on suppliers of defective systems.","Используется как свидетельство направления, возлагающего правовую ответственность на поставщиков дефектных систем.","作为把法律赔偿责任置于缺陷系统供应者之方向的依据。","法的賠償（ライアビリティ）を欠陥のあるシステムの供給者に置く方向の根拠として使う。"]);

E(47,"B","io",2026,"European Parliament, Legislative Train Schedule — AI Liability Directive 2022/0303(COD) (updated 25 Oct 2026)","AI Liability Directive","https://www.europarl.europa.eu/legislative-train/theme-a-europe-fit-for-the-digital-age/file-ai-liability-directive",
"Proposal officially withdrew in October 2025.",
["2022년 제안된 AI 책임지침(인과관계 추정·증거 공개 명령)은 집행위원회 2025년 작업계획에서 철회가 예고됐고 2025년 10월 공식 철회됐다. 유럽의회의 진행 현황 페이지로, 철회의 구체적 이유는 상세히 적혀 있지 않다.",
 "The AI Liability Directive proposed in 2022 (rebuttable presumption of causality, court-ordered disclosure) was announced for withdrawal in the Commission's 2025 work programme and formally withdrawn in October 2025. This is the Parliament's status page and does not detail the reasons.",
 "Предложенная в 2022 г. директива об ответственности за ИИ (опровержимая презумпция причинной связи, раскрытие доказательств по решению суда) была заявлена к отзыву в программе Комиссии на 2025 г. и официально отозвана в октябре 2025 г. Это страница статуса Европарламента, причины подробно не указаны.",
 "2022年提出的AI责任指令（可反驳的因果推定、法院命令披露证据）在委员会2025年工作计划中预告撤回，并于2025年10月正式撤回。此为欧洲议会的进展页面，未详述撤回理由。",
 "2022年に提案されたAI責任指令（因果関係の推定・証拠開示命令）は欧州委員会の2025年作業計画で撤回が予告され、2025年10月に正式に撤回された。欧州議会の進捗ページで、撤回の具体的理由は詳しく書かれていない。"],
["EU에서도 AI 피해의 민사 책임 규칙이 비어 있다는 근거로 쓴다.","Used as evidence that even in the EU civil-liability rules for AI harm remain a gap.","Используется как довод, что и в ЕС правила гражданской ответственности за вред от ИИ остаются пробелом.","作为即使在欧盟AI损害的民事责任规则也存在空白的依据。","EUでもAIによる被害の民事責任の規則が空白であるという根拠として使う。"]);

E(48,"B","io",2025,"UK legislation.gov.uk, Data (Use and Access) Act 2025 c.18, section 80 (in force generally 5 Feb 2026)","Data (Use and Access) Act 2025, section 80: Automated decision-making","https://www.legislation.gov.uk/ukpga/2025/18/section/80",
"there is no meaningful human involvement in the taking of the decision",
["영국은 GDPR의 자동화 결정 조항을 새 제22A~22D조로 바꿔, '의미 있는 사람의 관여'가 없는 결정을 자동 결정으로 정의하고 정보 제공·의견 진술·사람의 개입·이의 제기 같은 안전장치를 요구했다. 금지에서 안전장치 중심으로 옮겨 간 규칙이라 보호가 약해졌다는 비판도 있을 수 있지만, 이 보고서는 그 논쟁을 따로 검증하지 않았다.",
 "The UK replaced the GDPR's automated-decision article with new Articles 22A–22D, defining automated decisions as those with no meaningful human involvement and requiring safeguards such as information, representations, human intervention and the right to contest. It moves from prohibition towards safeguards; critics may see weaker protection, but this report did not separately verify that debate.",
 "Великобритания заменила статью GDPR об автоматизированных решениях новыми статьями 22A–22D: автоматическим считается решение без значимого участия человека; требуются гарантии — информирование, право высказаться, вмешательство человека и оспаривание. Сдвиг от запрета к гарантиям могут критиковать как ослабление защиты, но этот спор в докладе отдельно не проверялся.",
 "英国以新的第22A至22D条替换GDPR的自动化决定条款，将没有“有意义的人类参与”的决定定义为自动决定，并要求提供信息、陈述意见、人类干预与提出异议等保障。规则从禁止转向保障，可能被批评为保护减弱，但本报告未单独核实这一争论。",
 "英国はGDPRの自動化された決定の条項を新しい第22A〜22D条に替え、「意味のある人の関与」がない決定を自動決定と定義し、情報提供・意見陳述・人の介入・異議申し立てなどの安全装置を求めた。禁止から安全装置中心に移った規則なので保護が弱まったとの批判もありうるが、本報告はその論争を別に検証していない。"],
["'사람이 관여했다'는 형식이 아니라 '의미 있는' 관여를 요구하는 법적 기준으로 쓴다.","Used as a legal standard requiring meaningful rather than formal human involvement.","Используется как правовой стандарт, требующий значимого, а не формального участия человека.","作为要求“有意义的”而非形式上的人类参与的法律标准。","形式的ではなく「意味のある」人の関与を求める法的基準として使う。"]);

E(49,"B","io",2023,"National Institute of Standards and Technology (US), NIST AI 100-1 (Jan 2023)","Artificial Intelligence Risk Management Framework (AI RMF 1.0)","https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf",
"Trustworthy AI depends upon accountability. Accountability presupposes transparency.",
["미국의 자발적 AI 위험관리 체계로, 신뢰할 수 있는 AI의 특성으로 '책임성과 투명성'을 들고 조직이 적절한 책임 메커니즘과 역할·책임을 유지해야 한다고 본다. 법적 구속력이 없는 지침이다.",
 "The US voluntary AI risk-management framework lists 'accountable and transparent' among the characteristics of trustworthy AI and says organisations need appropriate accountability mechanisms, roles and responsibilities. It is non-binding guidance.",
 "Американская добровольная рамка управления рисками ИИ относит «подотчётность и прозрачность» к признакам надёжного ИИ и требует от организаций механизмов подотчётности, ролей и обязанностей. Это необязательное руководство.",
 "美国自愿性的AI风险管理框架，把“问责与透明”列为可信AI的特性，认为组织应维持适当的问责机制与角色职责。属无法律约束力的指南。",
 "米国の自主的なAIリスク管理の枠組みで、信頼できるAIの特性に「説明責任と透明性」を挙げ、組織が適切な説明責任の仕組みと役割・責任を維持すべきだとする。法的拘束力のない指針である。"],
["미국 연방 차원에서는 책임성이 '권고'에 머문다는 비교 근거로 쓴다.","Used as comparative evidence that at US federal level accountability remains a recommendation.","Используется как сравнительный довод, что на федеральном уровне США подотчётность остаётся рекомендацией.","作为美国联邦层面问责仍停留在“建议”的比较依据。","米国の連邦レベルでは説明責任が「推奨」にとどまるという比較の根拠として使う。"]);

E(50,"B","io",2024,"Colorado General Assembly, SB24-205 'Consumer Protections for Artificial Intelligence' (approved 17 May 2024)","SB24-205 Consumer Protections for Artificial Intelligence","https://leg.colorado.gov/bills/sb24-205",
"Providing a consumer with an opportunity to appeal, via human review if technically feasible",
["고용 등 중대한 결정에 쓰이는 고위험 AI의 배치자에게 위험관리, 영향평가, 결정 통지, 정정 기회, 기술적으로 가능하면 사람의 검토를 통한 이의 기회를 의무로 부과한 주법이다. 확인한 의회 요약은 의무 시작을 2026년 2월 1일로 적고 있으며, 이후 시행 연기 여부는 이 페이지에서 확인되지 않았다.",
 "A state law imposing on deployers of high-risk AI used in consequential decisions such as employment duties of risk management, impact assessment, notice, a chance to correct data and an appeal via human review where technically feasible. The legislature's summary dates the duties from 1 February 2026; any later postponement was not confirmed on this page.",
 "Закон штата, обязывающий эксплуатантов высокорискового ИИ в значимых решениях, включая занятость, к управлению рисками, оценке воздействия, уведомлению, возможности исправить данные и обжаловать с проверкой человеком, если это технически осуществимо. Резюме законодателя указывает начало обязанностей с 1 февраля 2026 г.; последующая отсрочка на этой странице не подтверждена.",
 "这是一部州法，要求在雇佣等重大决定中使用高风险AI的部署者承担风险管理、影响评估、决定通知、更正机会，以及在技术可行时通过人工复核提出申诉的义务。已核实的议会摘要写明义务自2026年2月1日起，此后是否延期在该页面未能确认。",
 "雇用など重大な決定に使われる高リスクAIの導入者に、リスク管理、影響評価、決定の通知、訂正の機会、技術的に可能なら人の審査による異議の機会を義務づけた州法である。確認した議会の要約は義務の開始を2026年2月1日としており、その後の施行延期の有無はこのページで確認できなかった。"],
["미국에서는 주·도시 단위로 배치자 의무가 생기고 있다는 근거로 쓴다.","Used as evidence that in the US deployer duties are emerging at state and city level.","Используется как довод, что в США обязанности эксплуатантов появляются на уровне штатов и городов.","作为美国在州与城市层面出现部署者义务的依据。","米国では州・都市の単位で導入者の義務が生まれているという根拠として使う。"]);

E(51,"B","io",2023,"NYC Department of Consumer and Worker Protection, Automated Employment Decision Tools (Local Law 144 of 2021)","Automated Employment Decision Tools (AEDT)","https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page",
"subject to a bias audit within one year of the use of the tool",
["뉴욕시는 채용·승진에 자동화 도구를 쓰려면 1년 안에 편향 감사를 받고 그 정보를 공개하며 지원자·직원에게 사전 통지하도록 했고, 2023년 7월 5일부터 집행했다. 감독기관의 안내 페이지이며, 감사 대상이 좁다는 지적에 대한 평가는 이 보고서가 따로 검증하지 않았다.",
 "New York City requires automated tools used in hiring or promotion to have had a bias audit within one year, publish its information and give prior notice to candidates and employees, with enforcement from 5 July 2023. This is the regulator's guidance page; claims that its scope is narrow were not separately verified.",
 "Нью-Йорк требует, чтобы автоматизированные инструменты найма и продвижения проходили аудит на предвзятость в течение года до использования, сведения публиковались, а кандидаты и сотрудники уведомлялись заранее; применение — с 5 июля 2023 г. Это страница регулятора; критика узкой сферы действия отдельно не проверялась.",
 "纽约市规定，在招聘与晋升中使用自动化工具须在一年内接受偏差审计并公开信息、事先通知求职者与员工，自2023年7月5日起执行。此为监管机构的说明页面，关于审计范围过窄的批评本报告未单独核实。",
 "ニューヨーク市は採用・昇進に自動化ツールを使うには1年以内にバイアス監査を受け、その情報を公開し、応募者・従業員に事前通知するよう定め、2023年7月5日から執行した。監督機関の案内ページで、対象が狭いという指摘への評価は本報告で別に検証していない。"],
["평가 알고리즘의 책임을 '감사와 공개'로 묻는 방식의 사례로 쓴다.","Used as an example of holding evaluation algorithms accountable through audit and disclosure.","Используется как пример подотчётности алгоритмов оценки через аудит и раскрытие.","作为以“审计与公开”追究评价算法责任之方式的案例。","評価アルゴリズムの責任を「監査と公開」で問う方式の事例として使う。"]);

E(52,"B","io",2026,"대한민국 국가법령정보센터, 「인공지능 발전과 신뢰 기반 조성 등에 관한 기본법」 (법률 제20676호 2025.1.21. 제정, 2026.1.22. 시행; 최종 개정 법률 제21311호)","인공지능 발전과 신뢰 기반 조성 등에 관한 기본법","https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EC%9D%B8%EA%B3%B5%EC%A7%80%EB%8A%A5%EB%B0%9C%EC%A0%84%EA%B3%BC%EC%8B%A0%EB%A2%B0%EA%B8%B0%EB%B0%98%EC%A1%B0%EC%84%B1%EB%93%B1%EC%97%90%EA%B4%80%ED%95%9C%EA%B8%B0%EB%B3%B8%EB%B2%95",
"고영향 인공지능에 대한 사람의 관리ㆍ감독",
["채용 등 개인의 권리·의무에 중대한 영향을 미치는 판단·평가를 '고영향 인공지능'으로 정하고(제2조), 사업자에게 위험관리, 설명 방안, 이용자 보호, 사람의 관리·감독, 문서 보관을 요구한다(제34조). 영향평가는 '노력' 의무이고, 과태료(3천만 원 이하)는 고지·국내대리인·시정명령 위반에만 붙는다(제43조). 감독자의 권한·보호에 관한 조항은 없다.",
 "It defines judgements or evaluations that significantly affect individuals' rights and duties, such as hiring, as 'high-impact AI' (Art. 2) and requires providers to run risk management, explanation measures, user protection, human management and oversight, and documentation (Art. 34). Impact assessment is a best-effort duty, and fines (up to KRW 30 million) apply only to breaches of notice, local-representative and correction-order duties (Art. 43). There is no provision on overseers' authority or protection.",
 "Закон относит к «ИИ высокого воздействия» суждения и оценки, существенно влияющие на права и обязанности людей, например при найме (ст. 2), и требует от операторов управления рисками, мер объяснения, защиты пользователей, человеческого управления и надзора, документации (ст. 34). Оценка воздействия — обязанность «стремиться», штрафы (до 30 млн вон) — лишь за нарушения уведомления, назначения представителя и предписаний (ст. 43). Норм о полномочиях и защите надзирающих нет.",
 "将招聘等对个人权利义务有重大影响的判断与评价定为“高影响人工智能”（第2条），要求经营者实施风险管理、说明方案、用户保护、人的管理监督与文件保存（第34条）。影响评估为“努力”义务，罚款（3000万韩元以下）仅针对告知、国内代理人与纠正命令的违反（第43条）。没有关于监督者权限与保护的条款。",
 "採用など個人の権利・義務に重大な影響を及ぼす判断・評価を「高影響人工知能」と定め（第2条）、事業者にリスク管理、説明方策、利用者保護、人の管理・監督、文書の保管を求める（第34条）。影響評価は「努力」義務で、過料（3千万ウォン以下）は告知・国内代理人・是正命令の違反にだけかかる（第43条）。監督者の権限・保護に関する条項はない。"],
["한국에서 '사람의 감독'이 법적 의무가 됐지만 감독자의 권한·보호는 비어 있다는 근거로 쓴다.","Used as evidence that in Korea 'human oversight' has become a legal duty while overseers' authority and protection remain unaddressed.","Используется как довод, что в Корее «человеческий надзор» стал обязанностью, а полномочия и защита надзирающих не урегулированы.","作为韩国“人的监督”已成法定义务、但监督者权限与保护仍空白的依据。","韓国で「人の監督」が法的義務になったが監督者の権限・保護は空白であるという根拠として使う。"]);

E(53,"B","io",2025,"内閣府 科学技術・イノベーション (Cabinet Office, Japan), AI法 page","人工知能関連技術の研究開発及び活用の推進に関する法律（ＡＩ法）","https://www8.cao.go.jp/cstp/ai/ai_act/ai_act.html",
"令和7年6月4日にＡＩ法が公布・一部施行され",
["일본 AI법은 2025년 6월 4일 공포·일부 시행되고 9월 1일 전면 시행된 진흥 중심 법률이다. 확인한 내각부 요약 페이지에는 벌칙 언급이 없으며, 법률 전문의 벌칙 유무는 이 보고서가 직접 검증하지 못했다.",
 "Japan's AI Act, a promotion-oriented law, was promulgated and partly enforced on 4 June 2025 and fully enforced on 1 September. The Cabinet Office summary page verified here does not mention penalties; whether the full text contains any was not verified directly.",
 "Японский закон об ИИ, ориентированный на продвижение, промульгирован и частично вступил в силу 4 июня 2025 г., полностью — 1 сентября. Проверенная страница Кабинета министров не упоминает санкций; наличие их в полном тексте напрямую не проверялось.",
 "日本AI法是以促进为主的法律，于2025年6月4日公布并部分施行，9月1日全面施行。已核实的内阁府摘要页面未提及罚则，法律全文是否有罚则本报告未能直接核实。",
 "日本のAI法は2025年6月4日に公布・一部施行され、9月1日に全面施行された推進中心の法律である。確認した内閣府の要約ページに罰則の言及はなく、法律全文の罰則の有無は本報告で直接検証できなかった。"],
["일본은 AI 책임을 법적 의무보다 지침과 기존 노동법(근거 14)으로 다룬다는 비교 근거로 쓴다.","Used as comparative evidence that Japan handles AI responsibility through guidance and existing labour law (evidence 14) more than legal duties.","Используется как сравнительный довод, что Япония регулирует ответственность за ИИ скорее руководствами и действующим трудовым правом (источник 14), чем обязанностями.","作为日本更多以指南与既有劳动法（依据14）而非法律义务处理AI责任的比较依据。","日本はAIの責任を法的義務より指針と既存の労働法（根拠14）で扱うという比較の根拠として使う。"]);

E(54,"C","press",2024,"Интерфакс (Interfax), 25 Jun 2024","Госдума приняла закон о страховании рисков от внедрения ИИ","https://www.interfax.ru/russia/967980",
"обязательном страховании вреда, причиненного искусственным интеллектом",
["러시아 하원이 디지털 혁신 실험적 법제도(ЭПР) 참가자에게 AI 사용으로 생긴 피해에 대한 책임보험을 의무화하는 법을 3독회에서 통과시켰다고 보도했다. 공포 후 180일 뒤 시행이다. 법령 공식 게시 사이트는 자동 접속에 응답하지 않아 언론 보도로 확인했으며, 법률 번호는 이 기사에 없다.",
 "Reports that the Russian State Duma passed in third reading a law making liability insurance mandatory for participants in experimental legal regimes for digital innovation, covering harm from the use of AI, effective 180 days after publication. The official legal-publication sites did not respond to automated access, so a press report was used; the law number is not in the article.",
 "Сообщает, что Госдума приняла в третьем чтении закон об обязательном страховании ответственности участников экспериментальных правовых режимов за вред от применения ИИ; вступает в силу через 180 дней после опубликования. Официальные порталы правовой информации не ответили на автоматический доступ, поэтому использовано сообщение СМИ; номера закона в статье нет.",
 "报道俄罗斯国家杜马三读通过法律，要求数字创新实验性法律制度（ЭПР）参与者对使用AI造成的损害投保责任险，公布后180天施行。法令官方发布网站未响应自动访问，故以媒体报道核实；文章中没有法律编号。",
 "ロシア下院がデジタル革新の実験的法制度（ЭПР）の参加者にAIの使用で生じた被害の責任保険を義務づける法律を第3読会で可決したと報じた。公布から180日後に施行される。法令の公式掲載サイトが自動アクセスに応答しなかったため報道で確認し、法律番号はこの記事にない。"],
["러시아가 AI 피해 책임을 개인 비난보다 보험·실험 제도로 다루는 방향의 근거로 쓴다.","Used as evidence that Russia handles AI harm through insurance and experimental regimes rather than individual blame.","Используется как довод, что Россия регулирует вред от ИИ через страхование и экспериментальные режимы, а не через персональную вину.","作为俄罗斯以保险与实验制度而非个人追责处理AI损害责任之方向的依据。","ロシアがAIの被害の責任を個人の非難より保険・実験制度で扱う方向の根拠として使う。"]);

E(55,"B","io",2025,"OECD (Anna Milanez, Annikka Lemmens & Carla Ruggiu), OECD Artificial Intelligence Papers (6 Feb 2025)","Algorithmic management in the workplace: New evidence from an OECD employer survey","https://www.oecd.org/en/publications/algorithmic-management-in-the-workplace_287c13c4-en.html",
"They cite concerns of unclear accountability",
["프랑스·독일·이탈리아·일본·스페인·미국 6개국 6천여 기업 조사로, 알고리즘 관리 도구가 대부분 나라에서 이미 흔하며 관리자는 결정의 질이 좋아졌다고 느끼지만 '불분명한 책임', 도구 논리를 따라가기 어려움, 노동자 건강 보호 부족을 우려한다고 보고했다. 확인한 것은 초록이라 나라별 수치는 쓰지 않는다.",
 "A survey of over 6,000 firms in France, Germany, Italy, Japan, Spain and the US finds algorithmic-management tools already common in most countries; managers feel decisions improved but worry about unclear accountability, difficulty following the tools' logic and inadequate protection of workers' health. Only the abstract was verified, so country figures are not used.",
 "Опрос более 6000 фирм во Франции, Германии, Италии, Японии, Испании и США: инструменты алгоритмического управления уже распространены в большинстве стран; менеджеры считают, что решения стали лучше, но тревожатся о неясной подотчётности, трудности понять логику инструментов и слабой защите здоровья работников. Проверена лишь аннотация, страновые цифры не используются.",
 "对法、德、意、日、西、美6国6000余家企业的调查显示，算法管理工具在多数国家已很普遍，管理者感到决策质量提高，但担忧“责任不清”、难以理解工具逻辑以及劳动者健康保护不足。仅核实了摘要，故不使用各国数字。",
 "フランス・ドイツ・イタリア・日本・スペイン・米国の6か国6千社超の調査で、アルゴリズム管理のツールはほとんどの国ですでに一般的で、管理者は決定の質が良くなったと感じる一方、「不明確な責任」、ツールの論理を追いにくいこと、労働者の健康保護の不足を懸念していると報告した。確認したのは抄録なので国別の数値は使わない。"],
["관리자 스스로 '책임이 불분명해진다'고 인식한다는 국제 조사 근거로 쓴다.","Used as international survey evidence that managers themselves perceive accountability becoming unclear.","Используется как международное свидетельство, что сами менеджеры видят размывание ответственности.","作为管理者自身认为“责任变得不清”的国际调查依据。","管理者自身が「責任が不明確になる」と認識しているという国際調査の根拠として使う。"]);

SEC("summary",["핵심 판단 (Executive Summary)","Key Judgements (Executive Summary)","Ключевые выводы (резюме)","核心判断（执行摘要）","主要判断（エグゼクティブサマリー）"],
[KJ(
 s("D",[3,1,4],["'책임'이라는 한 단어에는 맡은 일(responsibility), 해명할 의무(accountability), 법적 배상(liability), 비난(blame)이 뭉쳐 있고, 실패가 생기면 이 넷이 한꺼번에 통제권이 가장 적은 개인에게 떨어지기 쉽다; 이 보고서의 결론은 개인의 책임을 지우자는 것이 아니라 책임의 해상도를 높이자는 것이다.",
  "The single word 'responsibility' bundles the task one owns, the duty to explain (accountability), legal liability and blame; when failure comes, all four tend to land together on the individual with the least control. This report's conclusion is not to erase individual responsibility but to raise its resolution.",
  "Одно слово «ответственность» объединяет порученную работу, обязанность объясняться (подотчётность), правовую ответственность и порицание; при провале все четыре обычно разом падают на человека с наименьшим контролем. Вывод доклада — не снять с людей ответственность, а повысить её «разрешение».",
  "“责任”一词捆绑了承担的工作、解释的义务（问责）、法律赔偿与指责；失败发生时，这四者往往一并落到控制权最少的个人身上。本报告的结论不是抹去个人责任，而是提高责任的分辨率。",
  "「責任」という一語には、引き受けた仕事、説明する義務（アカウンタビリティ）、法的賠償、非難がまとまっており、失敗が起きるとこの4つが一度に統制権の最も少ない個人に落ちやすい。本報告の結論は個人の責任を消すことではなく、責任の解像度を高めることである。"],
  ["네 갈래 구분은 철학 문헌(근거 3)의 정리를 노동 맥락에 옮긴 이 보고서의 분석 틀이다.","The four-way split adapts the philosophical literature (evidence 3) to the work context as this report's analytical frame.","Четырёхчастное деление — аналитическая рамка доклада, переносящая философскую литературу (источник 3) в контекст труда.","四分法是本报告将哲学文献（依据3）的梳理移用到劳动语境的分析框架。","4つの区分は哲学文献（根拠3）の整理を労働の文脈に移した本報告の分析枠組みである。"],"H"),
 s("A",[9,12,11],["통제 없는 책임은 몸과 마음을 해친다: 요구는 높고 재량은 낮은 직무 긴장은 관상동맥질환 위험을 23% 높이고, 유럽 노동자의 46%가 심한 시간 압박을, 18%가 업무 속도 통제 부족을 겪으며, 일본에서는 2024년도 정신장애 산재 인정이 1,056건으로 늘었고 '업무 내용·업무량의 큰 변화'가 원인 2위였다.",
  "Responsibility without control harms body and mind: job strain — high demands, low latitude — raises coronary risk by 23%; 46% of European workers face severe time pressure and 18% lack control over the pace of work; and in Japan approved mental-disorder claims rose to 1,056 in fiscal 2024, with 'a major change in work content or workload' the second cause.",
  "Ответственность без контроля вредит телу и психике: «напряжение на работе» (высокие требования при низкой свободе) повышает риск ИБС на 23%; 46% европейских работников испытывают сильный дефицит времени, 18% не контролируют темп работы; в Японии признанные психические расстройства выросли до 1 056 в 2024 ф. г., а «резкое изменение содержания или объёма работы» — вторая причина.",
  "无控制的责任损害身心：需求高、自主低的工作紧张使冠心病风险提高23%；46%的欧洲劳动者面临严重时间压力，18%缺乏对工作节奏的控制；日本2024财年精神障碍工伤认定增至1,056件，“工作内容与工作量的重大变化”居原因第二。",
  "統制なき責任は心身を損なう。要求が高く裁量が低い職務緊張は冠動脈疾患のリスクを23%高め、欧州の労働者の46%が強い時間的圧迫を、18%が作業ペースの統制の不足を経験し、日本では2024年度の精神障害の労災認定が1,056件に増え、「仕事内容・仕事量の大きな変化」が原因の2位だった。"],null,"H"),
 s("A",[7,8,15],["실패의 평가는 구조적으로 결과에 끌려간다: 사람들은 같은 정보로 내린 같은 결정도 결과가 나쁘면 더 나쁜 판단으로 평가하고, 결과를 안 뒤에는 '미리 알 수 있었다'고 과대평가하며, IT 프로젝트 비용 초과는 극단값이 잦은 멱법칙을 따르므로 '평균적 일정'을 기준으로 개인을 재는 것 자체가 불공정해지기 쉽다.",
  "Evaluating failure is structurally pulled by outcomes: people rate the same decision made with the same information as worse when the outcome is bad, overestimate after the fact what could have been foreseen, and since IT cost overruns follow a power law with frequent extremes, measuring individuals against an 'average schedule' is itself prone to unfairness.",
  "Оценка провала структурно тянется за исходом: одно и то же решение при той же информации считают хуже при плохом исходе, задним числом переоценивают предсказуемость, а поскольку перерасход в ИТ-проектах следует степенному закону с частыми экстремумами, мерить людей «средним графиком» само по себе несправедливо.",
  "对失败的评价在结构上被结果牵引：同样信息下的同一决定，结果不好时被评为更差，事后人们高估“本可预见”的程度；且IT项目成本超支遵循极端值频发的幂律，以“平均进度”衡量个人本身就容易不公。",
  "失敗の評価は構造的に結果に引っ張られる。同じ情報で下した同じ決定でも結果が悪ければ悪い判断と評価され、結果を知った後は「事前に分かったはず」と過大評価され、ITプロジェクトのコスト超過は極端値が頻繁なべき乗則に従うので、「平均的な日程」で個人を測ること自体が不公正になりやすい。"],null,"H"),
 s("D",[23,24,25,29,31],["AI는 일을 덜어 주기도 하고 늘리기도 한다: 잘 정의된 과업에서는 생산성이 14~40% 올랐고 한국 노동자의 업무시간 절감률은 3.8%에서 9.2%로 커졌지만, 숙련 개발자 실험에서는 AI를 쓴 쪽이 19% 더 느렸는데도 본인들은 20% 빨라졌다고 믿었고, 한국에서도 아낀 시간이 처리량·품질로 이어지는 연결은 아직 약하다.",
  "AI both lightens and adds to work: on well-defined tasks productivity rose 14–40% and Korean workers' time savings grew from 3.8% to 9.2%, but in an experiment with skilled developers those using AI were 19% slower while believing they were 20% faster, and in Korea the link from time saved to throughput and quality is still weak.",
  "ИИ и облегчает, и добавляет работу: в чётких задачах производительность выросла на 14–40%, экономия времени у корейских работников — с 3,8% до 9,2%, но в эксперименте с опытными разработчиками использующие ИИ работали на 19% медленнее, считая, что стали на 20% быстрее, а в Корее связь сэкономленного времени с объёмом и качеством пока слаба.",
  "AI既减轻也增加工作：在界定清晰的任务上生产率提高14–40%，韩国劳动者的时间节省率从3.8%升至9.2%；但在资深开发者实验中，使用AI者慢了19%却相信自己快了20%，韩国节省的时间转化为处理量与质量的关联也仍弱。",
  "AIは仕事を軽くもし、増やしもする。よく定義された課題では生産性が14〜40%上がり、韓国の労働者の業務時間の節約率は3.8%から9.2%に拡大したが、熟練開発者の実験ではAIを使った側が19%遅かったのに本人たちは20%速くなったと信じ、韓国でも節約した時間が処理量・品質につながる結びつきはまだ弱い。"],
  ["수치마다 과업·대상·측정 방식이 달라 하나로 합치지 않는다.","Each figure differs in task, population and measurement, so they are not merged.","Цифры различаются по задачам, выборкам и измерению, поэтому не объединяются.","各数字的任务、对象与测量方式不同，不合并。","数値ごとに課題・対象・測定方法が異なるため一つにまとめない。"],"H"),
 s("D",[1,34,35,38],["'사람의 감독'은 책임을 덜어 주는 장치가 아니라 비난을 빨아들이는 장치가 되기 쉽다: 자동화 편향은 훈련으로 막을 수 없고, 맞는 처방을 틀린 조언 때문에 바꾸는 오류가 5.2% 생기며, 4개국 실험에서 해로운 결과의 비난은 어떤 AI를 썼든 사용자에게 돌아갔다.",
  "'Human oversight' easily becomes a device for soaking up blame rather than easing responsibility: automation bias cannot be trained away, switches from correct to wrong prescriptions occur in 5.2% of cases, and in a four-country experiment blame for harmful outputs fell on users whatever AI they used.",
  "«Человеческий надзор» легко становится не облегчением ответственности, а поглотителем вины: смещение в пользу автоматики не устраняется обучением, смены верного назначения на неверное случаются в 5,2% случаев, а в эксперименте в четырёх странах вину за вредный результат возлагали на пользователя при любом ИИ.",
  "“人的监督”很容易成为吸收指责而非减轻责任的装置：自动化偏差无法靠培训消除，因错误建议把正确处方改错的情况占5.2%，四国实验中无论使用何种AI，有害结果的指责都落在使用者身上。",
  "「人の監督」は責任を軽くする装置ではなく非難を吸い込む装置になりやすい。自動化バイアスは訓練で防げず、正しい処方を誤った助言で変える誤りが5.2%生じ、4か国の実験では有害な結果の非難はどのAIを使っても利用者に向かった。"],null,"H"),
 s("B",[40,41,42],["사고 조사들은 같은 패턴을 보여 준다: 우버 자율주행 사고의 추정 원인은 안전 운전자의 감시 실패였지만 조사기관은 회사의 '부적절한 안전 문화'와 감독기관의 부족을 기여 요인으로 꼽았고, 영국 호라이즌 사건에서는 시스템 결함이 운영자 수백 명의 절도 혐의로 바뀌어 가족에 따르면 13명이 목숨을 끊었으며, 호주 로보데트 왕립위원회는 알고리즘 공개와 현장 직원 협의를 권고했다.",
  "Accident inquiries show the same pattern: the probable cause of the Uber automated-vehicle crash was the safety operator's failure to monitor, but investigators named the company's 'inadequate safety culture' and the regulator's shortcomings as contributing; in the UK Horizon case system faults became theft accusations against hundreds of operators and, according to families, 13 people took their own lives; Australia's Robodebt royal commission recommended published algorithms and consultation with frontline staff.",
  "Расследования показывают одну схему: вероятной причиной аварии беспилотника Uber назван недосмотр оператора, но «неадекватная культура безопасности» компании и недочёты регулятора — сопутствующими факторами; в британском деле Horizon сбои системы превратились в обвинения сотен операторов в краже, и, по словам семей, 13 человек покончили с собой; королевская комиссия по «Рободолгу» рекомендовала раскрывать алгоритмы и советоваться с сотрудниками.",
  "事故调查呈现同一模式：优步自动驾驶事故的可能原因是安全驾驶员监视失败，但调查机构把公司“不当的安全文化”与监管机构的不足列为促成因素；英国Horizon事件中系统缺陷变成对数百名经营者的盗窃指控，据家属称有13人轻生；澳大利亚“机器人追债”皇家委员会建议公开算法并与一线员工协商。",
  "事故調査は同じパターンを示す。ウーバー自動運転事故の推定原因は安全運転者の監視の失敗だったが、調査機関は会社の「不適切な安全文化」と監督機関の不足を寄与要因に挙げ、英国のホライズン事件ではシステムの欠陥が数百人の運営者への窃盗容疑に変わり、家族によれば13人が命を絶ち、豪州のロボデット王立委員会はアルゴリズムの公開と現場職員との協議を勧告した。"],null,"H"),
 s("D",[44,45,52,22],["제도는 방향을 틀기 시작했다: EU는 감독자에게 역량·훈련·권한을 요구하고 플랫폼 노동에서는 감독자를 불이익으로부터 보호하며, 한국은 고영향 AI에 사람의 관리·감독을 의무로 정하고 공공 소프트웨어의 과업 변경을 계약·재원 조정으로 처리하는 절차를 강화했지만, 감독자의 권한과 보호는 대부분의 나라에서 아직 비어 있다.",
  "Institutions have begun to turn: the EU requires overseers to have competence, training and authority and, in platform work, protects them from reprisal; Korea has made human oversight of high-impact AI a duty and strengthened procedures that handle scope changes in public software through contract and funding adjustment — yet overseers' authority and protection remain empty in most countries.",
  "Институты начали поворот: ЕС требует от надзирающих компетенции, подготовки и полномочий, а в платформенном труде защищает их от наказания; Корея сделала надзор за ИИ высокого воздействия обязанностью и усилила процедуры, переводящие изменения задания в госпроектах ПО в корректировку договоров и финансирования, — но полномочия и защита надзирающих в большинстве стран не урегулированы.",
  "制度已开始转向：欧盟要求监督者具备能力、培训与权限，并在平台劳动中保护其免受不利对待；韩国把对高影响AI的人的管理监督定为义务，并强化了以合同与资金调整处理公共软件任务变更的程序——但在多数国家，监督者的权限与保护仍是空白。",
  "制度は向きを変え始めた。EUは監督者に能力・訓練・権限を求め、プラットフォーム労働では監督者を不利益から守り、韓国は高影響AIの人の管理・監督を義務とし、公共ソフトウェアの課業変更を契約・財源の調整で処理する手続きを強化したが、監督者の権限と保護はほとんどの国でまだ空白である。"],null,"M"),
 s("D",[],["MCMC 시뮬레이션의 2035년 글로벌 확률은 정밀 추궁(S2) {S2}, 책임 증발(S3) {S3}, 책임의 재설계(S1) {S1}, 제자리의 책임(S4) {S4}로, AI가 책임을 덜어 줄지 키울지는 기술이 아니라 기록을 누가 어떻게 쓰느냐에 달려 있다.",
  "The MCMC simulation gives 2035 global probabilities of precision blame (S2) {S2}, accountability evaporates (S3) {S3}, responsibility redesigned (S1) {S1} and old blame, little change (S4) {S4}: whether AI eases or enlarges responsibility depends not on the technology but on who uses the records, and how.",
  "MCMC-симуляция даёт глобальные вероятности на 2035 г.: точечное обвинение (S2) {S2}, испарение ответственности (S3) {S3}, перестройка ответственности (S1) {S1}, старая вина без перемен (S4) {S4}; облегчит ли ИИ ответственность или увеличит её, зависит не от технологии, а от того, кто и как использует записи.",
  "MCMC模拟给出的2035年全球概率为：精准追责（S2）{S2}、责任蒸发（S3）{S3}、责任的重新设计（S1）{S1}、原地踏步的责任（S4）{S4}；AI会减轻还是加重责任，不取决于技术，而取决于谁、如何使用这些记录。",
  "MCMCシミュレーションの2035年のグローバル確率は、精密な責任追及（S2）{S2}、責任の蒸発（S3）{S3}、責任の再設計（S1）{S1}、変わらない責任（S4）{S4}で、AIが責任を軽くするか重くするかは技術ではなく、記録を誰がどう使うかにかかっている。"],
  ["확률은 지표 코딩과 사전분포라는 판단에 의존한다(14장).","The probabilities depend on judgements about indicator coding and priors (section 14).","Вероятности зависят от суждений о кодировке индикаторов и априорных распределениях (раздел 14).","概率依赖于指标编码与先验分布的判断（第14章）。","確率は指標の符号化と事前分布という判断に依存する（14章）。"],"M")
)],
[KJ(
 s("D",[3,1],["'책임'에는 맡은 일·해명·배상·비난이 뭉쳐 있어, 실패하면 통제권이 가장 적은 개인에게 한꺼번에 떨어지기 쉽다; 필요한 것은 책임의 해상도를 높이는 일이다.","'Responsibility' bundles task, explanation, liability and blame, which tend to land together on the person with least control when things fail; what is needed is higher resolution of responsibility.","«Ответственность» объединяет работу, объяснение, возмещение и порицание, которые при провале разом падают на человека с наименьшим контролем; нужно повысить её «разрешение».","“责任”捆绑了工作、解释、赔偿与指责，失败时往往一并落到控制权最少者身上；需要的是提高责任的分辨率。","「責任」には仕事・説明・賠償・非難がまとまり、失敗すると統制権の最も少ない個人に一度に落ちやすい。必要なのは責任の解像度を高めることである。"]),
 s("A",[9,12,11],["요구는 높고 재량은 낮은 일은 심장병 위험을 23% 높이고, 유럽 노동자 46%가 심한 시간 압박을 겪으며, 일본에서는 업무량 변화가 정신장애 산재 원인 2위다.","High-demand, low-control work raises heart-disease risk by 23%, 46% of European workers face severe time pressure, and in Japan workload change is the second cause of approved mental-disorder claims.","Работа с высокими требованиями и низким контролем повышает риск болезней сердца на 23%, 46% европейских работников испытывают сильный дефицит времени, а в Японии изменение нагрузки — вторая причина признанных психических расстройств.","需求高而控制低的工作使心脏病风险提高23%，46%的欧洲劳动者面临严重时间压力，日本工作量变化是精神障碍工伤认定的第二大原因。","要求が高く統制の低い仕事は心臓病のリスクを23%高め、欧州の労働者の46%が強い時間的圧迫を受け、日本では業務量の変化が精神障害の労災原因の2位である。"]),
 s("A",[7,8,15],["결과가 나쁘면 같은 결정도 더 나쁘게 평가되고, IT 프로젝트 초과는 극단값이 잦은 분포를 따라 '평균 일정'으로 개인을 재기 어렵다.","The same decision is judged worse when outcomes are bad, and IT overruns follow a distribution with frequent extremes, making an 'average schedule' a poor yardstick for individuals.","Одно и то же решение оценивают хуже при плохом исходе, а перерасход в ИТ следует распределению с частыми экстремумами — «средний график» плохая мерка для людей.","结果不好时同一决定被评得更差，IT超支遵循极端值频发的分布，难以用“平均进度”衡量个人。","結果が悪いと同じ決定でも悪く評価され、ITの超過は極端値の多い分布に従うので「平均的な日程」で個人を測るのは難しい。"]),
 s("D",[25,29,31],["AI는 정형 업무를 덜어 주지만, 체감과 실측이 엇갈리고 아낀 시간이 성과로 이어지지 않아 기대만 높아질 수 있다.","AI lightens routine work, but perception and measurement diverge and saved time does not become output, so only expectations may rise.","ИИ облегчает рутину, но ощущения и измерения расходятся, а сэкономленное время не превращается в результат — растут лишь ожидания.","AI减轻常规工作，但体感与实测背离，节省的时间未转化为成果，可能只有期望在升高。","AIは定型業務を軽くするが、体感と実測が食い違い、節約した時間が成果につながらず、期待だけが高まりうる。"]),
 s("D",[1,34,38],["'사람의 감독'은 권한과 보호가 없으면 비난 스펀지가 되며, 해로운 결과의 비난은 어떤 AI를 썼든 사용자에게 돌아갔다.","Without authority and protection, 'human oversight' becomes a blame sponge, and blame for harmful outputs fell on users whatever AI they used.","Без полномочий и защиты «человеческий надзор» становится губкой вины, а вину за вредный результат возлагали на пользователя при любом ИИ.","没有权限与保护，“人的监督”就会成为指责海绵；有害结果的指责不论使用何种AI都落在使用者身上。","権限と保護がなければ「人の監督」は非難のスポンジになり、有害な結果の非難はどのAIを使っても利用者に向かった。"]),
 s("D",[],["2035년 확률은 S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}이다.","2035 probabilities: S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","Вероятности на 2035 г.: S2 {S2}, S3 {S3}, S1 {S1}, S4 {S4}.","2035年概率为S2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}。","2035年の確率はS2 {S2}、S3 {S3}、S1 {S1}、S4 {S4}である。"])
)]);

// ===== §1 Problem definition =====
SEC("frame",["문제 정의와 분석 틀: 책임의 네 갈래와 '통제-책임 불일치'","Problem Definition and Framework: Four Strands of Responsibility and the Control–Responsibility Mismatch","Постановка проблемы и рамка: четыре нити ответственности и несоответствие контроля и ответственности","问题界定与分析框架：责任的四个维度与“控制—责任错配”","問題の定義と分析の枠組み：責任の4つの筋と「統制と責任の不一致」"],
[P(
 s("D",[3],["이 보고서는 '책임'을 네 갈래로 나눈다: 맡은 일(responsibility), 결정과 과정을 설명할 의무(accountability), 피해를 배상할 법적 책임(liability), 그리고 비난(blame)이다.",
  "This report splits 'responsibility' into four strands: the task one owns (responsibility), the duty to explain decisions and processes (accountability), legal liability to compensate harm (liability), and blame.",
  "Доклад делит «ответственность» на четыре нити: порученная работа (responsibility), обязанность объяснять решения и процесс (accountability), правовая обязанность возместить вред (liability) и порицание (blame).",
  "本报告把“责任”分为四个维度：承担的工作（responsibility）、解释决定与过程的义务（accountability）、赔偿损害的法律责任（liability）以及指责（blame）。",
  "本報告は「責任」を4つの筋に分ける。引き受けた仕事（レスポンシビリティ）、決定と過程を説明する義務（アカウンタビリティ）、被害を賠償する法的責任（ライアビリティ）、そして非難（ブレーム）である。"]),
 s("D",[3,9],["이 넷은 서로 다른 조건을 필요로 한다: 맡은 일은 자원과 권한이, 해명은 정보가, 배상은 인과관계가, 비난은 '다르게 할 수 있었음'이 전제돼야 정당하다.",
  "Each needs different conditions to be fair: owning a task needs resources and authority, explaining needs information, liability needs causation, and blame needs that one could have done otherwise.",
  "Каждая требует своих условий: для работы нужны ресурсы и полномочия, для объяснения — информация, для возмещения — причинная связь, для порицания — возможность поступить иначе.",
  "四者的正当性条件不同：承担工作需要资源与权限，解释需要信息，赔偿需要因果关系，指责则须以“本可以不同做法”为前提。",
  "この4つは公正であるために異なる条件を要する。仕事には資源と権限、説明には情報、賠償には因果関係、非難には「別のやり方ができた」ことが前提となる。"]),
 s("D",[1,9,12],["이 보고서의 중심 축은 '통제와 책임의 불일치'다: 사양·일정·인력을 정할 권한이 없는 사람에게 결과의 책임이 붙을 때 고통과 왜곡이 가장 커진다.",
  "The report's central axis is the mismatch between control and responsibility: suffering and distortion are greatest when responsibility for outcomes attaches to people with no power over specifications, schedules or staffing.",
  "Центральная ось доклада — несоответствие контроля и ответственности: страдание и искажения максимальны, когда ответственность за результат возлагают на тех, кто не определяет требования, сроки и людей.",
  "本报告的核心轴是“控制与责任的错配”：当结果责任落到无权决定规格、进度与人员的人身上时，痛苦与扭曲最大。",
  "本報告の中心軸は「統制と責任の不一致」である。仕様・日程・人員を決める権限のない人に結果の責任がつくとき、苦痛と歪みが最も大きくなる。"]),
 s("A",[9],["이 축은 직무 스트레스 연구의 요구-통제 모델과 맞닿아 있으며, 유럽 19만7,473명의 개인 자료 메타분석에서 참가자의 15%가 이런 직무 긴장을 보고했고 관상동맥질환 위험비는 1.23이었다.",
  "The axis matches the demand–control model of job stress: in a meta-analysis of individual data on 197,473 Europeans, 15% reported such job strain, with a coronary hazard ratio of 1.23.",
  "Эта ось совпадает с моделью «требования–контроль»: в метаанализе индивидуальных данных 197 473 европейцев 15% сообщили о таком напряжении, отношение рисков ИБС — 1,23.",
  "这一轴与工作压力研究的需求—控制模型相契合：在对19.7万余名欧洲人个人数据的元分析中，15%报告了这种工作紧张，冠心病风险比为1.23。",
  "この軸は職務ストレス研究の要求-統制モデルと重なり、欧州19万7,473人の個人データのメタ分析で参加者の15%がこの職務緊張を報告し、冠動脈疾患のハザード比は1.23だった。"]),
 s("A",[7,8],["두 번째 축은 시점의 불일치다: 평가는 결과가 나온 뒤에 이뤄지므로, 결과가 나쁘면 같은 판단도 나쁜 판단이 되고(결과 편향) 결과를 안 사람은 '예측할 수 있었다'고 느낀다(사후확신 편향).",
  "The second axis is a mismatch in timing: evaluation happens after the outcome, so a bad outcome makes the same judgement look bad (outcome bias), and those who know the outcome feel it was predictable (hindsight bias).",
  "Вторая ось — несоответствие во времени: оценка происходит после исхода, поэтому плохой исход делает то же решение плохим (смещение исхода), а знающие исход считают его предсказуемым (ретроспективное искажение).",
  "第二轴是时点错配：评价在结果出来后进行，结果不好则同一判断也成了坏判断（结果偏差），知道结果的人会觉得“本可预测”（后见之明偏差）。",
  "第2の軸は時点の不一致である。評価は結果が出た後に行われるので、結果が悪いと同じ判断も悪い判断になり（結果バイアス）、結果を知った人は「予測できた」と感じる（後知恵バイアス）。"]),
 s("D",[5,7],["철학에서는 이를 '도덕적 운'이라 부른다: 같은 주의를 기울인 두 운전자 중 한 명만 사고를 냈을 때 그를 더 비난하는 직관처럼, 우리는 통제할 수 없는 결과로 사람을 평가하곤 한다.",
  "Philosophy calls this 'moral luck': like the intuition that of two equally careful drivers we blame more the one who had an accident, we often judge people by outcomes they could not control.",
  "В философии это называют «моральной удачей»: как интуиция, что из двух одинаково осторожных водителей мы сильнее осуждаем попавшего в аварию, мы часто судим людей по исходам, которые им неподконтрольны.",
  "哲学称之为“道德运气”：正如同样小心的两名司机中只有一人出事时我们更责备他那样，我们常以无法控制的结果评价人。",
  "哲学ではこれを「道徳的運」と呼ぶ。同じ注意を払った2人の運転者のうち1人だけが事故を起こしたときにその人をより非難する直観のように、私たちは統制できない結果で人を評価しがちである。"]),
 s("D",[6,4],["세 번째 축은 '많은 손의 문제'다: 발주자·경영진·관리자·실무자·도구 공급사가 조금씩 관여한 실패에서는 누가 무엇에 책임이 있는지 가리기 어렵고, 그래서 가장 눈에 띄는 한 사람에게 책임이 몰리거나 아무에게도 남지 않는다.",
  "The third axis is the 'problem of many hands': in failures where client, executives, managers, workers and tool vendors each played a part, it is hard to say who is responsible for what, so responsibility either piles onto the most visible person or stays with no one.",
  "Третья ось — «проблема многих рук»: когда в провале понемногу участвовали заказчик, руководство, менеджеры, исполнители и поставщики инструментов, трудно сказать, кто за что отвечает, и ответственность либо ложится на самого заметного, либо ни на кого.",
  "第三轴是“多手问题”：在发包方、高管、管理者、实务者与工具供应商都参与一部分的失败中，难以分辨谁对什么负责，于是责任要么集中到最显眼的一人身上，要么无人承担。",
  "第3の軸は「多くの手の問題」である。発注者・経営陣・管理者・実務者・道具の供給会社が少しずつ関わった失敗では誰が何に責任があるかを見分けにくく、最も目立つ一人に責任が集まるか、誰にも残らない。"]),
 s("A",[4],["영의 사회적 연결 모델은 이 상황에서 가해자를 골라내는 대신, 구조에 참여한 모두가 앞을 보며 책임을 나누고 집단적 행동으로만 그 책임을 다할 수 있다고 본다.",
  "Young's social connection model holds that, rather than singling out a culprit, everyone who participates in the structure shares a forward-looking responsibility that can be discharged only through collective action.",
  "Модель социальной связи Янг предлагает не выискивать виновника, а признать, что все участники структуры разделяют ответственность, обращённую в будущее, которую можно исполнить лишь коллективно.",
  "杨的社会连接模型认为，此时不应挑出加害者，而是所有参与结构者共同承担面向未来的责任，且只能通过集体行动来履行。",
  "ヤングの社会的つながりモデルは、この状況で加害者を選び出す代わりに、構造に参加した全員が前を向いて責任を分かち合い、集団的な行動によってのみその責任を果たせるとみる。"]),
 s("D",[4,3,17],["다만 이 틀은 '개인은 책임이 없다'는 결론이 아니다: 조기 공유, 모르는 것을 묻기, 약속의 재협상처럼 개인이 통제할 수 있는 몫은 분명히 남으며, 해상도를 높인다는 것은 그 몫을 더 정확히 가려낸다는 뜻이다.",
  "This frame does not conclude that individuals bear no responsibility: there remain parts individuals can control — sharing early, asking what they do not know, renegotiating commitments — and raising the resolution means identifying those parts more precisely.",
  "Эта рамка не означает, что люди ни за что не отвечают: остаётся подконтрольная им часть — ранний обмен информацией, вопросы о непонятном, пересогласование обязательств, — и повысить «разрешение» значит точнее её выделить.",
  "这一框架并非得出“个人没有责任”的结论：及早共享、询问不懂之处、重新协商承诺等个人可控的部分依然存在，提高分辨率意味着更准确地辨别出这部分。",
  "ただしこの枠組みは「個人に責任はない」という結論ではない。早めの共有、分からないことを尋ねること、約束の再交渉のように個人が統制できる部分ははっきり残り、解像度を高めるとはその部分をより正確に見分けることを意味する。"]),
 s("D",[1,2,37],["AI는 이 세 축 모두에 개입한다: 결정 과정에 또 하나의 '손'을 더하고, 기록을 남겨 사후 평가의 재료를 늘리며, '통제하는 척하는 사람'을 새로 만든다.",
  "AI intervenes on all three axes: it adds another 'hand' to the decision process, leaves records that supply material for after-the-fact evaluation, and creates a new role of people who appear to be in control.",
  "ИИ вмешивается во все три оси: добавляет ещё одну «руку» в процесс решения, оставляет записи — материал для ретроспективной оценки — и создаёт новую роль людей, лишь выглядящих контролирующими.",
  "AI介入了全部三个轴：它为决策过程增加了另一只“手”，留下记录从而增加事后评价的材料，并制造出“看似在控制的人”这一新角色。",
  "AIはこの3つの軸すべてに介入する。決定過程にもう一つの「手」を加え、記録を残して事後評価の材料を増やし、「統制しているように見える人」を新たに生み出す。"]),
 s("D",[],["핵심 물음은 세 가지다: AI가 '책임'이라는 뭉뚱그린 말이 주는 고통을 덜어 줄 수 있는가, 없다면 왜 없는가, 그리고 오히려 키우지는 않는가.",
  "There are three core questions: can AI ease the suffering caused by the lumped-together word 'responsibility'; if not, why not; and might it instead make it worse?",
  "Три ключевых вопроса: может ли ИИ уменьшить страдание, порождаемое обобщённым словом «ответственность»; если нет, то почему; и не усугубит ли он его?",
  "核心问题有三：AI能否减轻“责任”这一笼统词语带来的痛苦？若不能，为什么？会不会反而加重？",
  "核心的な問いは3つである。AIは「責任」というひとまとめの言葉がもたらす苦痛を軽くできるか、できないならなぜか、そしてむしろ大きくしないか。"]),
 s("D",[],["근거 등급은 A(동료심사 논문·공식 통계), B(정부·국제기구·법령·공개 방법 조사), C(언론·기업 자료), D(여러 근거를 종합한 Claude의 추론)로 나누며, 아래 그림은 이 보고서 근거의 등급 분포다.",
  "Evidence is graded A (peer-reviewed papers, official statistics), B (government, international bodies, legal texts, surveys with disclosed methods), C (press, company material) and D (Claude's inference combining several sources); the figure below shows the grade distribution of this report's evidence.",
  "Источники делятся на классы A (рецензируемые статьи, официальная статистика), B (правительства, международные организации, законы, опросы с раскрытым методом), C (СМИ, материалы компаний) и D (выводы Claude по нескольким источникам); ниже — распределение классов.",
  "依据等级分为A（同行评审论文、官方统计）、B（政府、国际组织、法令、方法公开的调查）、C（媒体、企业资料）、D（综合多项依据的Claude推论），下图为本报告依据的等级分布。",

[P(
 s("A",[15],["IT 프로젝트 5,392개를 분석한 연구는 비용 초과가 정규분포가 아니라 멱법칙 분포를 따른다고 보고했다: 대부분은 조금 넘지만, 소수는 상상 이상으로 크게 넘는다.",

 s("D",[15,7],["꼬리가 두꺼운 분포에서는 극단적 지연이 '드문 개인 실수'가 아니라 분포의 정상적 일부이므로, 늦어진 프로젝트의 담당자를 '평균'과 비교해 평가하면 운을 실력으로 오인하게 된다.",

 s("A",[20],["조직 문화 연구는 정보 흐름을 기준으로 병리형·관료형·생성형 문화를 나누고, 정보 문화가 오류 보고와 성과·안전에 연관된다고 본다: 나쁜 소식을 가져온 사람을 처벌하는 조직에서는 소식이 늦게, 혹은 오지 않는다.",

 s("A",[23],["고객지원 상담원 5천여 명의 현장 자료에서 AI 도우미는 시간당 해결 건수를 평균 14%, 초보·저숙련자는 34% 높였지만 가장 숙련된 사람에게는 효과가 미미했다.",

 s("B",[25],["반면 숙련 오픈소스 개발자 16명이 실제 과제 246개를 처리한 무작위 실험에서는 AI를 쓴 조건이 19% 더 오래 걸렸는데, 개발자들은 사전에 24% 빨라질 것으로 예상했고 끝난 뒤에도 20% 빨라졌다고 믿었다.",
  "By contrast, in a randomised experiment where 16 experienced open-source developers worked 246 real issues, the AI condition took 19% longer, yet developers had expected a 24% speed-up and afterwards still believed they had been 20% faster.",
  "Напротив, в рандомизированном эксперименте, где 16 опытных разработчиков выполнили 246 реальных задач, условие с ИИ заняло на 19% больше времени, хотя они ожидали ускорения на 24% и после считали, что ускорились на 20%.",
  "相反，在16名资深开源开发者处理246个真实任务的随机实验中，使用AI的条件耗时多19%，而开发者事先预期快24%，结束后仍相信快了20%。",
  "一方、熟練オープンソース開発者16人が実際の課題246件を処理した無作為化実験では、AIを使う条件が19%長くかかったが、開発者は事前に24%速くなると予想し、終了後も20%速くなったと信じていた。"]),
 s("D",[25,7,9],["체감과 실측의 이 엇갈림은 책임 문제에서 특히 위험하다: 관리자와 실무자 모두 'AI로 빨라졌다'고 믿으면 일정과 기대는 올라가지만 실제 처리량은 그만큼 오르지 않아, 그 차이가 개인의 성과 부족으로 해석될 수 있다.",
  "This divergence between perception and measurement is especially dangerous for responsibility: if managers and workers both believe AI has made things faster, schedules and expectations rise while actual throughput does not, and the gap can be read as individual underperformance.",
  "Это расхождение ощущений и измерений особенно опасно для ответственности: если и руководители, и исполнители верят, что ИИ всё ускорил, сроки и ожидания растут, а реальная производительность — нет, и разрыв может быть истолкован как недоработка человека.",
  "体感与实测的这种背离在责任问题上尤其危险：若管理者与实务者都相信“AI让工作变快了”，进度与期望就会提高，但实际处理量并未同步提高，差距可能被解读为个人绩效不足。",
  "体感と実測のこの食い違いは責任の問題で特に危険である。管理者も実務者も「AIで速くなった」と信じれば日程と期待は上がるが実際の処理量はそれほど上がらず、その差が個人の成果不足と解釈されうる。"]),
 s("A",[29],["한국은행의 2025년 대표 표본 조사에서 근로자의 51.8%가 생성형 AI를 업무에 썼고, 업무시간은 평균 3.8%(주 40시간 기준 1.5시간) 줄었으며 효과는 경력이 짧은 근로자에게 더 컸다.",

  "在韩国银行2025年代表性调查中，51.8%的劳动者在工作中使用生成式AI，工作时间平均缩短3.8%（以每周40小时计为1.5小时），资历短者效果更大。",
  "韓国銀行の2025年の代表標本調査で労働者の51.8%が生成AIを業務に使い、業務時間は平均3.8%（週40時間で1.5時間）減り、効果は経歴の短い労働者ほど大きかった。"]),
 s("B",[30],["같은 조사를 다시 분석한 한국은행 연구진은 아낀 시간과 업무처리량 증가 사이의 상관이 0이었다며 'AI 생산성 단절'이라 부르고, 원인으로 결재 같은 병목, 업무 흐름의 경직성, 보상 구조의 불일치를 들었다.",
  "Reanalysing the same survey, Bank of Korea researchers found zero correlation between time saved and increased throughput, calling it an 'AI productivity disconnect' and citing bottlenecks such as approval chains, rigid workflows and misaligned rewards.",

 s("B",[31],["2026년 11월 17일 후속 보고서에서는 업무용 활용률이 66.5%로, 평균 시간 절감률이 9.2%(주 3.7시간)로 올랐지만, 시간 절감과 처리량·품질 개선의 상관은 여전히 약하고 핵심 업무 활용은 낮았다.",
  "In a follow-up report on 17 November 2026, work use rose to 66.5% and average time saved to 9.2% (3.7 hours a week), but the correlation between time saved and gains in throughput and quality remained weak and use in core tasks low.",

  "在2026年11月17日的后续报告中，工作用使用率升至66.5%，平均时间节省率升至9.2%（每周3.7小时），但时间节省与处理量、质量改善的相关性仍弱，核心业务中的使用仍低。",
  "2026年11月17日の続報では業務用の活用率が66.5%に、平均時間節約率が9.2%（週3.7時間）に上がったが、時間節約と処理量・品質改善の相関は依然として弱く、中核業務での活用は低かった。"]),
 s("D",[30,31,26],["아낀 시간이 어디로 가는지가 책임 문제의 핵심이다: 성과로 바뀌지 않은 시간은 더 많은 일, 더 촘촘한 일정, 혹은 결재 대기로 흡수되며, 이를 개인의 몫으로 돌리면 AI는 부담을 덜기보다 기준을 높이는 도구가 된다.",
  "Where saved time goes is the heart of the responsibility problem: time not converted into output is absorbed by more work, tighter schedules or waiting for approvals, and if this is attributed to individuals, AI becomes a tool for raising the bar rather than lightening the load.",

  "节省的时间去向何处是责任问题的核心：未转化为成果的时间被更多工作、更紧的进度或等待审批所吸收，若把这归咎于个人，AI就成了抬高标准而非减轻负担的工具。",
  "節約した時間がどこへ行くかが責任の問題の核心である。成果に変わらなかった時間はより多くの仕事、より詰まった日程、あるいは決裁待ちに吸収され、これを個人の責任にするとAIは負担を軽くするより基準を上げる道具になる。"]),
 s("B",[26],["덴마크의 행정 자료 연구도 ChatGPT 출시 2년 뒤까지 AI 노출 직종의 임금과 기록된 근로시간에 2%를 넘는 효과가 없다고 추정해, 개인 수준의 시간 절감이 노동시장 결과로 아직 옮겨 가지 않았음을 보여 준다.",
  "A Danish administrative-data study likewise estimates no effect larger than 2% on earnings or recorded hours in AI-exposed occupations two years after ChatGPT's launch, showing individual time savings have not yet translated into labour-market outcomes.",
  "Датское исследование административных данных также не находит эффектов выше 2% на заработки и учтённые часы в профессиях, подверженных ИИ, через два года после выхода ChatGPT: индивидуальная экономия времени ещё не отразилась на рынке труда.",
  "丹麦行政数据研究也估计，ChatGPT推出两年后，受AI影响职业的工资与记录工时没有超过2%的效应，表明个人层面的时间节省尚未转化为劳动市场结果。",
  "デンマークの行政データ研究も、ChatGPT公開2年後までAIにさらされる職種の賃金と記録された労働時間に2%を超える効果はないと推定し、個人レベルの時間節約がまだ労働市場の結果に移っていないことを示す。"]),
 s("B",[27,28],["소프트웨어 조직 조사는 AI 도입이 배포의 안정성과 처리량에 부정적 영향을 준다고 보고했고, 이듬해 보고서는 AI가 조직이 원래 가진 강점과 약점을 증폭한다고 정리했다.",

  "软件组织调查报告称AI引入对交付稳定性与吞吐量有负面影响，次年的报告则总结AI会放大组织原有的优势与弱点。",
  "ソフトウェア組織の調査はAIの導入がデリバリーの安定性と処理量に負の影響を与えると報告し、翌年の報告書はAIが組織のもともとの強みと弱みを増幅するとまとめた。"]),
 s("D",[28,20,32],["이 '증폭' 명제를 책임 문제에 적용하면, 실패를 학습으로 다루는 조직에서 AI는 기록과 분석으로 책임을 정밀하게 나눠 주지만, 비난 문화가 강한 조직에서는 같은 기록이 개인을 추궁하는 증거가 될 가능성이 크다.",
  "Applied to responsibility, the 'magnifier' thesis implies that in organisations that treat failure as learning, AI's records and analysis help divide responsibility precisely, whereas in blame-heavy organisations the same records are likely to become evidence against individuals.",

  "把“放大器”命题用于责任问题意味着：在把失败当作学习的组织里，AI以记录与分析帮助精确划分责任；而在指责文化强的组织里，同样的记录更可能成为追究个人的证据。",
  "この「増幅」の命題を責任の問題に当てはめると、失敗を学習として扱う組織ではAIが記録と分析で責任を精密に分けてくれるが、非難の文化が強い組織では同じ記録が個人を追及する証拠になる可能性が高い。"]),
 s("A",[24],["같은 실험에서 노동자 간 격차도 줄었고, ChatGPT를 경험한 참가자는 2주 뒤 실제 직장에서 그것을 쓸 가능성이 2배, 2개월 뒤에는 1.6배였다.",
  "In the same experiment inequality between workers shrank, and participants exposed to ChatGPT were twice as likely to use it in their real jobs two weeks later and 1.6 times as likely two months later.",

  "同一实验中劳动者间差距缩小，接触过ChatGPT的参与者两周后在实际工作中使用它的可能性是2倍，两个月后为1.6倍。",
  "同じ実験で労働者間の格差も縮み、ChatGPTを経験した参加者は2週間後に実際の職場でそれを使う可能性が2倍、2か月後には1.6倍だった。"])

 s("A",[23],["정형 업무에서 AI는 생산성을 평균 14%, 초보자는 34% 높였다.","On routine work AI raised productivity 14% on average and 34% for novices.","В рутинной работе ИИ повысил производительность в среднем на 14%, у новичков — на 34%.","在常规工作中AI使生产率平均提高14%，新手提高34%。","定型業務でAIは生産性を平均14%、初心者は34%高めた。"]),

SEC("humanai",["현재 ④: 사람-AI 협업에서 누가 책임지나 — 도덕적 완충지대와 책임 공백","Now ④: Who Is Responsible in Human–AI Work? — Moral Crumple Zones and Responsibility Gaps","Сейчас ④: кто отвечает в работе человека и ИИ — зоны моральной деформации и разрывы ответственности","现状④：人机协作中谁负责——道德吸能区与责任空白","現在④：人とAIの協働で誰が責任を負うか——道徳的衝撃吸収ゾーンと責任の空白"],
[P(
 s("A",[1],["엘리시는 자동화 시스템에서 통제권이 제한된 사람이 도덕적·법적 책임을 떠안아 기술 시스템의 무결성을 지켜 주는 구조를 '도덕적 완충지대(moral crumple zone)'라고 불렀다.",
  "Elish called the structure in which a person with limited control over an automated system absorbs moral and legal responsibility, protecting the technological system's integrity, a 'moral crumple zone'.",
  "Элиш назвала «зоной моральной деформации» структуру, в которой человек с ограниченным контролем над автоматизированной системой принимает моральную и правовую ответственность, защищая целостность технической системы.",
  "埃利什把自动化系统中控制权有限的人承担道德与法律责任、从而保护技术系统完整性的结构称为“道德吸能区”。",
  "エリッシュは、自動化システムで統制権の限られた人が道徳的・法的責任を負い、技術システムの無欠性を守る構造を「道徳的衝撃吸収ゾーン（モラル・クランプル・ゾーン）」と呼んだ。"]),
 s("A",[2,3],["반대 방향의 위험도 있다: 학습하는 기계의 행동은 누구도 예측할 수 없어 책임이 아무에게도 귀속되지 않는 '책임 공백'이 생기며, 후속 연구는 이 공백이 비난 가능성·도덕적 해명·공적 해명·능동적 책임의 네 갈래로 나타나고 조직·법적 원인에서도 생긴다고 정리했다.",
  "There is also the opposite risk: because no one can predict a learning machine's behaviour, a 'responsibility gap' opens in which responsibility attaches to no one; later work shows the gap appears in four forms — culpability, moral and public accountability, active responsibility — with organisational and legal causes too.",
  "Есть и обратный риск: поведение обучающейся машины никто не может предсказать, и возникает «разрыв ответственности», когда она не приписывается никому; позднейшие работы показывают четыре его формы — виновность, моральная и публичная подотчётность, активная ответственность — с организационными и правовыми причинами.",
  "也存在相反方向的风险：学习型机器的行为无人能预测，于是出现责任无法归于任何人的“责任空白”；后续研究指出这种空白表现为可谴责性、道德问责、公共问责与积极责任四类，并源于组织与法律原因。",
  "逆方向の危険もある。学習する機械の行動は誰にも予測できないため、責任が誰にも帰属しない「責任の空白」が生じ、後続研究はこの空白が非難可能性・道徳的説明責任・公的説明責任・能動的責任の4つで現れ、組織的・法的な原因からも生じると整理した。"]),
 s("D",[1,2,3],["두 위험은 동시에 일어날 수 있다: 법적·도덕적 책임은 현장의 개인에게 과잉 귀속되고(완충지대), 시스템을 설계·구매·배치한 결정의 책임은 증발한다(공백).",

 s("B",[55],["OECD의 6개국 6천여 기업 조사에 따르면 업무 배분·감시·평가를 자동화하는 알고리즘 관리 도구는 대부분 나라에서 이미 흔하고, 관리자들은 결정의 질이 좋아졌다고 느끼면서도 '불분명한 책임'과 도구 논리를 따라가기 어려움을 우려한다.",

  "据经合组织对6国6000余家企业的调查，自动化任务分配、监控与评价的算法管理工具在多数国家已很普遍，管理者感到决策质量提高，同时担忧“责任不清”与难以理解工具逻辑。",
  "OECDの6か国6千社超の調査によれば、業務配分・監視・評価を自動化するアルゴリズム管理のツールはほとんどの国ですでに一般的で、管理者は決定の質が良くなったと感じつつ「不明確な責任」とツールの論理を追いにくいことを懸念する。"]),
 s("B",[44],["EU AI법은 고용 관련 고위험 AI에 대해 감독자가 자동화 편향 가능성을 인식하고 출력을 무시·번복하거나 시스템을 멈출 수 있게 설계하도록 하고, 배치자는 역량·훈련·권한과 지원을 갖춘 사람에게 감독을 맡기도록 했다.",
  "The EU AI Act requires high-risk AI, including employment uses, to be designed so overseers are aware of possible automation bias and can disregard, override or reverse outputs or stop the system, and requires deployers to assign oversight to people with the necessary competence, training, authority and support.",
  "Закон ЕС об ИИ требует, чтобы высокорисковый ИИ, в том числе в занятости, позволял надзирающим осознавать возможное смещение в пользу автоматики, игнорировать или отменять результаты и останавливать систему, а эксплуатанты поручали надзор людям с компетенцией, подготовкой, полномочиями и поддержкой.",
  "欧盟AI法要求包括雇佣用途在内的高风险AI在设计上使监督者意识到自动化偏差的可能，并能无视、推翻输出或停止系统；部署者须把监督交给具备能力、培训、权限与支持的人。",
  "EU AI法は雇用関連を含む高リスクAIについて、監督者が自動化バイアスの可能性を認識し、出力を無視・覆したりシステムを止めたりできるよう設計させ、導入者は能力・訓練・権限と支援を備えた人に監督を任せるよう定めた。"]),
 s("B",[45],["EU 플랫폼노동지침은 한 걸음 더 나아가, 자동 결정을 뒤집을 권한을 가진 감독자가 그 기능을 행사했다는 이유로 해고·징계 등 불이익을 받지 않도록 보호하고, 노동자에게 설명과 서면 사유를 보장한다(이행 기한 2026년 12월 2일).",
  "The EU Platform Work Directive goes further, protecting overseers with authority to override automated decisions from dismissal, discipline and other adverse treatment for exercising that function, and guaranteeing workers explanations and written reasons (transposition deadline 2 December 2026).",
  "Директива ЕС о платформенном труде идёт дальше: защищает надзирающих с правом отменять автоматические решения от увольнения, дисциплинарных мер и иного ущерба за выполнение этой функции и гарантирует работникам объяснения и письменные причины (срок транспонирования — 2 декабря 2026 г.).",
  "欧盟平台劳动指令更进一步：保护有权推翻自动决定的监督者，使其不因行使该职能而遭解雇、纪律处分等不利对待，并保障劳动者获得解释与书面理由（转化期限2026年12月2日）。",
  "EUプラットフォーム労働指令はさらに一歩進み、自動決定を覆す権限を持つ監督者がその機能を行使したことを理由に解雇・懲戒などの不利益を受けないよう保護し、労働者に説明と書面の理由を保障する（国内法化期限2026年12月2日）。"]),
 s("B",[46,47],["배상 쪽에서는 개정 제조물책임지침이 소프트웨어를 '제조물'에 포함했지만(이행 기한 2026년 12월 9일), AI 피해의 인과관계 추정을 담은 AI 책임지침안은 2025년 10월 철회돼 민사 책임 규칙에는 빈자리가 남았다.",
  "On liability, the revised Product Liability Directive includes software in 'product' (transposition deadline 9 December 2026), but the proposed AI Liability Directive with its presumption of causation was withdrawn in October 2025, leaving a gap in civil-liability rules.",

  "在赔偿方面，修订后的产品责任指令把软件纳入“产品”（转化期限2026年12月9日），但含因果推定的AI责任指令草案已于2025年10月撤回，民事责任规则留下空缺。",

 s("B",[48],["영국은 2025년 데이터법으로 '의미 있는 사람의 관여'가 없는 결정을 자동 결정으로 정의하고, 정보 제공·의견 진술·사람의 개입·이의 제기라는 안전장치를 요구했다.",
  "The UK's 2025 data act defines automated decisions as those with no meaningful human involvement and requires safeguards: information, representations, human intervention and the right to contest.",

  "英国は2025年のデータ法で「意味のある人の関与」がない決定を自動決定と定義し、情報提供・意見陳述・人の介入・異議申し立てという安全装置を求めた。"]),
 s("B",[49,50,51],["미국은 연방 차원에서는 자발적 위험관리 체계에 머물지만, 콜로라도주는 고용 등 중대한 결정에 쓰이는 고위험 AI의 배치자에게 영향평가와 사람의 검토를 통한 이의 기회를 의무로 정했고, 뉴욕시는 채용 도구에 연 1회 편향 감사와 공개를 요구한다.",
  "The US stays with a voluntary risk framework at federal level, but Colorado requires deployers of high-risk AI in consequential decisions such as employment to do impact assessments and offer appeals with human review, and New York City requires annual bias audits and disclosure for hiring tools.",
  "США на федеральном уровне ограничиваются добровольной рамкой, но Колорадо обязывает эксплуатантов высокорискового ИИ в значимых решениях, включая занятость, оценивать воздействие и давать возможность обжалования с проверкой человеком, а Нью-Йорк требует ежегодного аудита предвзятости и раскрытия для инструментов найма.",
  "美国在联邦层面停留于自愿性风险框架，但科罗拉多州要求在雇佣等重大决定中使用高风险AI的部署者进行影响评估并提供人工复核的申诉机会，纽约市要求招聘工具每年接受偏差审计并公开。",
  "米国は連邦レベルでは自主的なリスク管理の枠組みにとどまるが、コロラド州は雇用など重大な決定に使う高リスクAIの導入者に影響評価と人の審査による異議の機会を義務づけ、ニューヨーク市は採用ツールに年1回のバイアス監査と公開を求める。"]),
 s("B",[52],["한국 AI 기본법(2026년 1월 22일 시행)은 채용처럼 개인의 권리·의무에 중대한 영향을 주는 판단을 고영향 AI로 정하고 사람의 관리·감독과 설명 방안을 의무화했지만, 영향평가는 노력 의무이고 감독자의 권한·보호 조항은 없다.",
  "Korea's AI Basic Act (in force 22 January 2026) defines judgements that significantly affect individuals' rights, such as hiring, as high-impact AI and mandates human management and oversight and explanation measures, but impact assessment is best-effort and there are no provisions on overseers' authority or protection.",
  "Базовый закон Кореи об ИИ (в силе с 22 января 2026 г.) относит к ИИ высокого воздействия решения, существенно влияющие на права людей, например при найме, и требует человеческого надзора и мер объяснения, но оценка воздействия — лишь «стремление», а норм о полномочиях и защите надзирающих нет.",
  "韩国AI基本法（2026年1月22日施行）把招聘等对个人权利义务有重大影响的判断定为高影响AI，并规定人的管理监督与说明方案为义务，但影响评估只是努力义务，也没有关于监督者权限与保护的条款。",

 s("B",[52],["이 법의 과태료(3천만 원 이하)는 고지 의무, 국내대리인 지정, 중지·시정명령 위반에만 붙고, 고영향 AI 책무 자체의 위반에는 직접 붙지 않는다.",
  "The act's fines (up to KRW 30 million) apply only to breaches of notice duties, local-representative designation and suspension or correction orders, not directly to breaches of the high-impact AI duties themselves.",
  "Штрафы закона (до 30 млн вон) применяются лишь за нарушения обязанности уведомления, назначения местного представителя и предписаний о приостановке или исправлении, но не напрямую за нарушение обязанностей по ИИ высокого воздействия.",

 s("B",[53,14,54,33],["일본 AI법(2025년 9월 전면 시행)은 진흥 중심이고 직장 내 책임 문제는 괴롭힘 방지 같은 기존 노동법이 다루며, 러시아는 실험적 법제도 참가자에게 AI 피해 책임보험을 의무화했지만 중대형 조직의 AI 사용률은 4.8%로 아직 낮다.",
  "Japan's AI Act (fully in force September 2025) is promotion-oriented, leaving workplace responsibility to existing labour law such as harassment prevention; Russia has made AI-harm liability insurance mandatory for participants in experimental legal regimes, but only 4.8% of large and medium organisations use AI.",

  "日本AI法（2025年9月全面施行）以促进为主，职场责任问题由防止骚扰等既有劳动法处理；俄罗斯对实验性法律制度参与者强制实施AI损害责任保险，但大中型组织的AI使用率仅4.8%。",
  "日本のAI法（2025年9月全面施行）は推進中心で、職場の責任の問題はハラスメント防止のような既存の労働法が扱い、ロシアは実験的法制度の参加者にAIによる被害の責任保険を義務づけたが、中・大規模組織のAI使用率は4.8%とまだ低い。"]),
 s("D",[44,45,52,1],["나라별 규칙을 '감독자의 권한·보호'라는 기준으로 보면, 감독 의무만 있고 권한·보호가 없는 규칙은 도덕적 완충지대를 법으로 만드는 셈이 될 위험이 있다: 서명할 의무는 있지만 거부할 힘은 없는 자리이기 때문이다.",

 s("A",[20],["웨스트럼의 유형론에서 병리형 조직은 정보를 권력의 도구로 쓰고 나쁜 소식의 전달자를 처벌하며, 생성형 조직은 정보를 사명을 위해 쓰고 실패를 탐구의 계기로 삼는다.",

  "В типологии Веструма патологические организации используют информацию как инструмент власти и наказывают гонцов, а генеративные — служат миссии и воспринимают провал как повод для исследования.",

 s("D",[17,20,12],["보고의 지연과 설계 검토의 반복은 개인의 성실성 문제이기 전에, 모호한 요구·바뀌는 사양·처벌적 반응이 만든 정서적 비용의 신호일 수 있으며, 이를 도덕적 결함으로만 다루면 회피는 더 깊어진다.",
  "Delayed reporting and repeated design reviews may be signals of the emotional cost created by vague requirements, shifting specifications and punitive reactions before they are matters of individual diligence; treating them only as moral defects deepens avoidance.",

  "报告的延迟与设计评审的反复，在成为个人勤勉问题之前，可能是模糊需求、变动规格与惩罚性反应所造成情绪成本的信号；若只当作道德缺陷处理，回避会更深。",

 s("D",[19,17,3],["그렇다고 개인의 몫이 사라지지는 않는다: 일을 하위 과업으로 쪼개고, 지연 가능성을 조기에 공유하고, '모른다'를 묻는 것은 실무자가 통제할 수 있는 영역이며, 조직은 이 행동이 처벌받지 않도록 보장해야 한다.",
  "That does not remove the individual's share: splitting work into subtasks, sharing the likelihood of delay early and asking about what one does not know are within the worker's control, and organisations must ensure these behaviours are not punished.",

  "Experiments show that projecting a mind onto AI reduces blame on the company, and that the incentive to hand unpleasant decisions to algorithms exists conditionally.",

  "实验显示，越把心智投射到AI上就越少追究公司责任，把不愉快决定交给算法的诱因也有条件地存在。",
  "実験は、AIに心を投影するほど会社の責任が問われにくくなり、不快な決定をアルゴリズムに任せる誘因も条件付きで存在することを示す。"]),

  "Two days before this report was written, a large software company was reported to be weighing over 10,000 job cuts linked to its AI push, while the company's stated basis went no further than 'continuously reviewing its organisation'.",
  "За два дня до написания доклада сообщалось, что крупная софтверная компания рассматривает сокращение более 10 000 сотрудников в связи с курсом на ИИ, а заявленное компанией основание ограничилось «постоянным пересмотром организации».",
  "在本报告撰写前两天，有报道称一家大型软件企业正考虑与强化AI功能相关的裁员1万人以上，而公司公开的依据仅是“持续审视组织”。",
  "本報告の執筆2日前にも、大手ソフトウェア企業がAI機能の強化と結びついた1万人以上の削減を検討しているとの報道が出たが、会社が示した根拠は「組織を継続的に見直している」という水準だった。"]),
 s("D",[37,43,6,2],["경영 사이버네틱스에서 말하는 '책임 싱크(accountability sink)'—결정이 규칙·시스템에 흡수돼 누구에게도 해명을 요구할 수 없는 구조—는 AI로 더 쉬워지며, 'AI 때문'이라는 설명은 결정을 내린 사람의 책임을 지우고 결과를 감당하는 사람에게만 무게를 남긴다.",
  "What management cybernetics calls an 'accountability sink' — a structure in which decisions are absorbed into rules and systems so no one can be asked to account for them — becomes easier with AI; 'because of AI' erases the responsibility of those who decided and leaves the weight only on those who bear the consequences.",
  "То, что в управленческой кибернетике называют «поглотителем ответственности» — структура, где решения растворяются в правилах и системах и спросить не с кого, — с ИИ возникает легче; объяснение «из-за ИИ» стирает ответственность принявших решение и оставляет тяжесть лишь тем, кто несёт последствия.",
  "管理控制论所说的“责任黑洞”——决定被规则与系统吸收、无从要求任何人解释的结构——因AI而更易形成，“因为AI”的说法抹去了决策者的责任，只把重量留给承受后果的人。",
  "経営サイバネティクスでいう「責任の吸い込み口（アカウンタビリティ・シンク）」——決定が規則・システムに吸収され誰にも説明を求められない構造——はAIでより容易になり、「AIのせい」という説明は決定した人の責任を消し、結果を負う人にだけ重みを残す。"],
  ["'책임 싱크'는 경영 저술가의 단행본에서 널리 쓰인 개념으로, 이 보고서는 그 책을 근거 목록에 넣지 않고 개념 설명에만 쓴다.","'Accountability sink' is a concept popularised in a management writer's book; this report uses it only as a concept and does not list that book as evidence.","«Поглотитель ответственности» — понятие, популяризованное в книге автора по менеджменту; доклад использует его лишь как понятие и не включает книгу в список источников.","“责任黑洞”是经一位管理学作者的著作普及的概念，本报告只作概念说明，未将该书列入依据。","「責任の吸い込み口」は経営の著述家の単行本で広まった概念で、本報告はその本を根拠一覧に入れず概念説明にだけ使う。"],"M")
