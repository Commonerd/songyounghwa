<head>

<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#1c1c1c;--muted:#6f6f6a;--line:#deded8;--accent:#263238;--accent-light:#eef0ef;--max:1120px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.72}
a{color:inherit;text-decoration:none}
.container{width:min(calc(100% - 40px),var(--max));margin:auto}
header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(247,247,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(222,222,216,.78)}
nav{width:min(calc(100% - 40px),var(--max));min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-size:14px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:26px}
.back{font-size:14px;font-weight:600;white-space:nowrap}.back:hover{opacity:.7}
.language-switcher{display:flex;gap:4px}
.language-switcher button{border:0;background:transparent;padding:5px 6px;font-size:10px;color:var(--muted);cursor:pointer;border-radius:3px}
.language-switcher button:hover,.language-switcher button.active{color:var(--text);background:var(--accent-light)}
main{padding:150px 0 100px}
.section-label{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:25px;line-height:1.35}
h1{font-size:clamp(36px,6vw,60px);font-weight:500;letter-spacing:-.045em;line-height:1.08;margin-bottom:28px}
.intro{color:var(--muted);font-size:15px;max-width:800px;margin-bottom:14px}
.count{font-size:13px;color:var(--muted);margin-bottom:40px}
.list{border-top:1px solid var(--line)}
.report{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:30px;align-items:start;padding:30px 0;border-bottom:1px solid var(--line)}
.date{color:var(--muted);font-size:13px;padding-top:4px}
.report h2{font-size:23px;font-weight:500;letter-spacing:-.025em;line-height:1.35;margin-bottom:8px}
.report h2 a:hover{text-decoration:underline;text-underline-offset:4px}
.report .summary{color:var(--text);font-size:15px;max-width:780px;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 10px;background:var(--accent-light);border-radius:3px;font-size:11px;color:#4d5355}
.open{display:inline-block;margin-top:4px;padding:10px 15px;border:1px solid var(--text);font-size:12px;font-weight:600;white-space:nowrap}
.open:hover{background:var(--text);color:var(--bg)}
.note{margin-top:46px;font-size:13px;color:var(--muted);max-width:800px}
footer{padding:34px 0;font-size:13px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line)}
.footer-inner{display:flex;justify-content:space-between;gap:20px}
@media(max-width:850px){
 .container{width:min(calc(100% - 30px),var(--max))}
 main{padding:120px 0 72px}
 .report{grid-template-columns:1fr;gap:6px}
 .open{margin-top:10px}
 .footer-inner{flex-direction:column}
}
@media(max-width:420px){.back{font-size:12px}.nav-right{gap:10px}}
</style>
</head>

 {file:"ai-deepfake-sexual-abuse-2035.html",date:"2026.11.27",
  title:{ko:"AI 성적 딥페이크는 얼마나 늘었고, 누가 막고 있나 — 나라별 피해·법제 비교",en:"How Fast Are AI Sexual Deepfakes Growing, and Who Is Stopping Them? Harm and Laws Compared by Country",ja:"AI性的ディープフェイクはどれだけ増え、誰が止めているのか——国別の被害・法制比較",ru:"Как быстро растут сексуальные ИИ-дипфейки и кто их останавливает? Сравнение вреда и законов по странам"},
  summary:{ko:"호주·영국·미국 성인의 7%가 AI 이미지 성적 학대를 겪었고, 아동 관련 AI 신고는 2년 새 4,700건에서 40만 건 이상으로 늘었다(다만 신고 급증의 상당 부분은 탐지 방식 변화). 한국은 가해자의 62%가 10대인 '학교형' 위기로 시청까지 처벌하는 법을 갖췄고, 미국은 48시간 삭제, 영국은 제작 처벌과 도구 금지, EU는 2027년 공통 기준으로 대응한다. 2035년 전망은 '일상화'와 '통제'가 팽팽하다.",en:"7% of adults in Australia, the UK and the US have experienced AI-image sexual abuse, and AI-related child reports rose from 4,700 to over 400,000 in two years (though much of that surge reflects changes in detection). Korea faces a school-centred crisis with 62% of suspects teenagers and now punishes even viewing; the US mandates 48-hour removal, the UK punishes creation and is moving to ban tools, and the EU sets a common floor by 2027. The 2035 outlook is finely balanced between normalisation and containment.",ja:"豪・英・米の成人の7%がAI画像による性的虐待を経験し、子どもに関するAI通報は2年で4,700件から40万件超に増えた（ただし急増のかなりの部分は検知方法の変化による）。韓国は被疑者の62%が10代の「学校型」危機で視聴まで処罰し、米国は48時間削除、英国は制作の処罰とツール禁止、EUは2027年の共通基準で対応する。2035年の見通しは「日常化」と「抑え込み」が拮抗している。",ru:"7% взрослых в Австралии, Великобритании и США пережили сексуальное насилие с ИИ-изображениями, а сообщения о детях, связанные с ИИ, за два года выросли с 4700 до более чем 400 000 (хотя во многом из-за изменений в обнаружении). В Корее «школьный» кризис — 62% подозреваемых подростки, — и наказывается даже просмотр; США требуют удаления за 48 часов, Великобритания наказывает создание и запрещает инструменты, ЕС вводит общий стандарт к 2027 году. Прогноз на 2035 год колеблется между обыденностью и сдерживанием."},

 {file:"ai-emotional-labour-2035.html",date:"2026.11.26",
  title:{ko:"AI 시대, 일터의 감정노동은 어디가 가장 무거운가 — 나라별·직군별 비교",en:"Where Does Emotional Labour Weigh Most in the AI Era? Countries and Occupations Compared",ja:"AI時代、職場の感情労働はどこが最も重いか——国別・職種別比較",ru:"Где эмоциональный труд тяжелее всего в эпоху ИИ? Сравнение стран и профессий"},
  summary:{ko:"일반 스트레스는 미국·중국·영국이 높지만, 고객·학부모의 화를 견디는 감정노동은 한국·일본이 가장 무겁다. 직군별로는 교정·경찰·추심·객실승무·응급의료가 최상위이며, AI는 쉬운 문의를 가져가고 화난 고객을 사람에게 남겨 감정노동을 집중시킬 수 있다. 동료 사이에서는 AI가 '이런 것도 모르냐'는 핀잔 없이 물을 수 있는 사수가 되었지만, 외로움과 AI 사용을 숨기는 새로운 감정노동이 따라온다.",en:"General work stress is highest in the US, China and the UK, but emotional labour — enduring customers' and parents' anger — weighs most in Korea and Japan. Corrections, police, debt collection, cabin crew and emergency medicine top the occupations, and AI may concentrate the burden by taking easy queries and leaving angry customers to people. Among colleagues, AI has become a senior you can ask without being put down, but loneliness and a new emotional labour of hiding AI use come with it.",ja:"一般的なストレスは米国・中国・英国が高いが、顧客・保護者の怒りに耐える感情労働は日韓が最も重い。職種では矯正・警察・債権回収・客室乗務・救急医療が最上位で、AIは簡単な問い合わせを引き取り怒った顧客を人に残すことで感情労働を集中させうる。 同僚どうしでは、AIが小言を言われずに聞ける先輩になったが、孤独とAI利用を隠す新しい感情労働がついてくる。",ru:"Общий рабочий стресс выше всего в США, Китае и Великобритании, но эмоциональный труд — терпеть гнев клиентов и родителей — тяжелее всего в Корее и Японии. По профессиям лидируют исправительные учреждения, полиция, взыскание долгов, бортпроводники и неотложная медицина, а ИИ может концентрировать нагрузку, оставляя людям рассерженных клиентов. Между коллегами ИИ стал наставником, которого можно спросить без упрёков, но вместе с этим приходят одиночество и новый эмоциональный труд сокрытия ИИ."},

  summary:{ko:"AI로 인한 인류 멸망 확률은 전문가마다 0.38%에서 20%까지 갈린다. 통제의 어려움은 실험으로 점점 뒷받침되지만, 멸망까지의 구체적 경로는 아직 증거가 약하다.",en:"Expert estimates of AI-caused extinction range from 0.38% to 20%. Experiments increasingly show AI is hard to control, but concrete pathways to extinction remain weakly evidenced.",ja:"AIによる人類絶滅の確率は専門家により0.38%から20%まで分かれる。制御の難しさは実験でますます裏づけられているが、絶滅に至る具体的な経路はまだ証拠が弱い。",ru:"Оценки экспертов вероятности вымирания из-за ИИ — от 0,38% до 20%. Эксперименты всё чаще показывают, что ИИ трудно контролировать, но конкретные пути к вымиранию доказаны слабо."},
  tags:{ko:["AI 안전","멸망론","정렬·통제","오용","거버넌스","2035 시나리오"],en:["AI safety","Existential risk","Alignment & control","Misuse","Governance","2035 scenarios"],ja:["AI安全","滅亡論","アライメント・制御","悪用","ガバナンス","2035年シナリオ"],ru:["Безопасность ИИ","Экзистенциальный риск","Согласование и контроль","Злоупотребления","Регулирование","Сценарии 2035"]}},

function renderList(lang){
 const d=T[lang];

 }).join("");
}
function setLanguage(language,save=true){
 if(!T[language])language="ko";
 document.documentElement.lang=language;
 const d=T[language];
 document.querySelectorAll("[data-i18n]").forEach(el=>{const v=d[el.getAttribute("data-i18n")];if(typeof v==="string")el.textContent=v;});
 document.querySelectorAll(".language-switcher button").forEach(b=>b.classList.toggle("active",b.dataset.lang===language));
 document.title=d.doc;
 renderList(language);
 if(save){try{localStorage.setItem("preferredLanguage",language);}catch(e){}}
}
(function(){
 let saved=null;try{saved=localStorage.getItem("preferredLanguage");}catch(e){}
 if(saved&&T[saved])return setLanguage(saved,false);
 const b=(navigator.language||"ko").toLowerCase();
 setLanguage(b.startsWith("ja")?"ja":b.startsWith("ru")?"ru":b.startsWith("en")?"en":"ko",false);
})();
</script>
</body>
</html>
