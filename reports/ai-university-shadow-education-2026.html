sec:{
summary:{t:"Ключевые выводы (резюме)",
 d:[[["ИИ быстро разбирает на части функции университетов и репетиторства (объяснение, практика, обратная связь, помощь с заданиями), но вряд ли заменит институты дипломов и вступительного отбора к 2035 году.","Источники по функциям (6·10) — причинные доказательства класса A, по институтам (20·23) — официальные или крупномасштабные данные класса B; вывод объединяет разницу в скорости изменения этих двух слоёв."],
  ["По результатам MCMC-моделирования (глобальный базовый вариант) наиболее вероятный путь к 2035 году — соперничество «Великой поляризации» ({S2}) и «Расширенной коэволюции» ({S1}); за ними следуют «Утрата роли диплома» ({S3}) и «Инерция/откат» ({S4}).","Цифры — средние апостериорного прогноза модели из §13 и меняются вместе с регионом и допущениями. Поскольку структура модели и кодирование индикаторов сами являются суждениями, читайте их как структурированное суждение, а не точные вероятности."],
  "Решающая переменная для обучения — не факт использования ИИ, а его дизайн (ограничители, поддержка, оценивание); бесконтрольное использование может повышать результаты, одновременно подрывая самостоятельное обучение.",
  "Главная причина кризиса университетов — не ИИ, а демография, финансы и сокращение иностранных студентов; ИИ лишь ускоряет размывание отличий вузов среднего уровня, построенных на «чтении лекций».",
  "Расходы на репетиторство в Корее впервые за пять лет снизились, но траты на одного занимающегося достигли рекорда — это фаза поляризации «меньше по объёму, сильнее по интенсивности».",
  "Сигнальная ценность диплома в краткосрочной перспективе устойчива; более реальный риск в том, что ИИ сжимает учебные задачи новичков и ослабляет «лестницу первой работы»."]],
 c:[["ИИ быстро разбирает функции образования, но институты дипломов и отбора, как ожидается, устоят до 2035 года.","В модели 2035 год — соперничество «Великой поляризации» ({S2}) и «Расширенной коэволюции» ({S1}).","Результаты обучения определяет дизайн, а не просто наличие ИИ; кризис вузов определяют демография и финансы.","Общие расходы на репетиторство в Корее падают, а траты на одного ученика рекордны — поляризация углубляется."]]},
frame:{t:"Постановка проблемы и аналитическая рамка",
 d:[["Доклад оценивает влияние генеративного ИИ на университеты (высшее образование) и частное репетиторство (подготовительные школы, репетиторы, помощь с домашними заданиями, edtech) по данным на ноябрь 2026 года и оценивает вероятности сценариев на 2035 год.",
  "Отправная точка — различение ОЭСР: успешное выполнение задания ещё не означает обучения; поэтому эффекты ИИ мы рассматриваем отдельно как «результат» и «обучение».",
  ["Будущее сводится к трём осям: ① давление ИИ на замещение и перестройку (A), ② институциональная адаптивность учебных заведений и политики (I), ③ сигнальная ценность дипломов и отбора на рынке труда (L).","Три оси объединяют независимые факторы, на которые указывают источники, в минимальное число. Демографическое давление (D) весьма определённо, поэтому оно — модератор, а не ось."],
  "Поверх этого демографическое давление (D), хорошо предсказуемое для каждой страны, действует как модератор, подтачивающий институциональную адаптивность.",
  "Каждое предложение имеет класс доказательности (A: статьи Q1 и официальная статистика; B: международные организации, правительства и репрезентативные опросы; C: СМИ, компании и отраслевые данные; D: аналитический вывод Claude) и номера источников; клик по номеру показывает цитату, критику и вывод."],0],
 c:[["Мы разделяем эффекты ИИ на «результат» и «обучение» и прогнозируем 2035 год по трём осям — техн. давление (A), инст. адаптивность (I), сигнал диплома (L) — с учётом демографического давления (D)."],0]},
adoption:{t:"Настоящее ①: ИИ стал нормой обучения",
 d:[["По опросу HEPI в Великобритании доля студентов, использующих ИИ в любой форме, за один год выросла с 66% в 2024 году до 92% в 2025-м.","В опросе 2026 года (проведён в декабре 2025-го) 95% использовали ИИ, а 94% применяли генеративный ИИ в оцениваемых работах — фактически насыщение.","В Корее 91,7% студентов с опытом использования генеративного ИИ сообщили, что искали с его помощью материалы для заданий и проектов.","HEPI отмечает более высокое использование среди юношей, студентов STEM и социально-экономически благополучных, то есть разрыв в использовании растёт даже при всеобщем распространении."],
  "Институты отстают",
  ["Напротив, лишь 36% студентов чувствуют, что вуз поощряет использование ИИ, и только 38% говорят, что вуз предоставляет ИИ-инструменты.","Согласно докладу ОЭСР со ссылкой на опрос ЮНЕСКО, официальную политику в отношении ИИ имеют лишь 19% вузов.","В 2024 году 37% учителей основной школы использовали ИИ в работе, а 72% опасались за академическую честность — внедрение со стороны преподающих идёт намного медленнее, чем у учащихся.","Исключение — система Университета штата Калифорния, предоставившая ChatGPT Edu более чем 460 тысячам студентов и объявившая о внедрении на уровне всей системы.","Минобразования Китая в руководствах 2025 года запретило младшим школьникам самостоятельно пользоваться открытым генеративным ИИ, одновременно потребовав поэтапной программы ИИ-грамотности.","Таким образом, суть нынешнего этапа — разрыв между всеобщим использованием и незрелостью институтов, и скорость его преодоления мы считаем первой переменной, разделяющей сценарии.","Этот разрыв означает и переход обучения к бесплатным потребительским инструментам вне контроля вузов, что одновременно порождает проблемы защиты данных, справедливости и надёжности оценивания."],0],
 c:[["За два года использование ИИ британскими студентами достигло насыщения (66% → 95%), но поощрение вузов ощущают лишь 36%, а официальную политику имеют 19% вузов.","Разрыв между всеобщим использованием и незрелостью институтов — суть нынешнего этапа."],0]},
learning:{t:"Настоящее ②: данные об обучении — парадокс «результат ≠ обучение»",
 d:["Положительные данные",
  ["В РКИ на курсе физики в Гарварде студенты с ИИ-тьютором, построенным на принципах науки об обучении, усвоили значительно больше за меньшее время, чем на занятии с активным обучением.","Метаанализ 51 исследования оценил эффект ChatGPT на учебные результаты в g = 0,867, а на мышление высокого порядка — в g = 0,457.","Другой метаанализ 69 экспериментальных исследований также подтвердил рост успеваемости, но не обнаружил изменения самоэффективности."],
  "Контрданные и методологическая критика",
  ["Однако критический обзор 2026 года в Computers & Education указал, что многие исследования из обоих метаанализов использовали дизайн «сравнения медиа» и могли принять различия в методике и времени за эффект ИИ.","В полевом эксперименте с примерно 1 000 турецких старшеклассников пользователи обычного инструмента наподобие ChatGPT улучшили результаты на практике, но на экзамене без инструмента набрали на 17% меньше контрольной группы.","В том же эксперименте «GPT Tutor» со встроенными подсказками, защищающими обучение, в основном нейтрализовал этот негативный эффект.","В эксперименте со 117 студентами группа ChatGPT сильнее всех улучшила оценки за эссе, но не отличалась по приросту знаний и переносу; исследователи назвали это «метакогнитивной ленью».","Обобщив эти данные, обзор ОЭСР Digital Education Outlook 2026 заключил, что преимущество универсальных чат-ботов в результатах может исчезнуть или смениться отставанием на экзамене без инструмента."],
  0,"Вывод",
  ["Поэтому вопрос «улучшает ли ИИ образование?» поставлен неверно; правильный вопрос — «при каком дизайне, что и когда мы измеряем?»","Поскольку g ≈ 0,87 необычно велик для образовательного вмешательства, с учётом публикационного смещения и краткосрочных близких измерений реальный устойчивый эффект, по нашей оценке, заметно меньше.","Так как два независимых эксперимента (школьная математика и университетское письмо) показали одну и ту же картину, путь «бесконтрольное использование → зависимость → слабее самостоятельная работа» достаточно достоверен.","Тот же вывод относится к репетиторству: ИИ, выдающий ответы, разрушает рынок помощи с домашними заданиями, а ИИ, построенный как учебный дизайн, становится новым продуктом вместе с живым наставничеством."]],
 c:[["Спроектированные ИИ-тьюторы превзошли занятия с активным обучением в РКИ, а метаанализ показал большой эффект (g = 0,867).","Но бесконтрольное использование снизило результаты экзамена без инструмента на 17%, а размеры эффектов в метаанализах, вероятно, завышены из-за искажений дизайна.","Решает дизайн, а не просто наличие ИИ."],0]},
univ:{t:"Настоящее ③: структурное давление на вузы — демография, финансы, геополитика",
 d:[["Число выпускников школ в США, по прогнозу, достигнет пика около 3,9 млн в 2025 году, а затем сократится примерно на 13% к 2041 году.","Центральный совет по образованию Японии прогнозирует сокращение поступающих в вузы примерно с 630 тыс. до 460 тыс. в 2040 году — около 73% нынешней ёмкости.","В 2025 году недобор был у 53,2% (316) частных университетов Японии — улучшение к прошлому году за счёт временного роста числа 18-летних.","В апреле 2026 года Совет по фискальной системе предложил сократить около 250 частных вузов к 2040 году, а правительственные документы предусматривают пересмотр мест в государственных вузах и реструктуризацию и слияние частных.","В Корее спад ещё круче: KDI прогнозирует сокращение когорты поступающих почти вдвое — с 442 тыс. в 2030 году до 227 тыс. в 2040-м.","Институт будущего Национального собрания предупредил: при неизменных местах и нынешних долях поступления заполняемость первых курсов к 2043 году может упасть до 39,4%.","Компенсировать демографию иностранными студентами тоже сложнее: набор новых иностранных студентов в США осенью 2025 года упал на 17%."],
  0,"Вывод: ИИ — ускоритель, а не причина",
  ["Эти данные ясно показывают, что первичные причины кризиса вузов — демография, финансы и геополитика, а не ИИ.","ИИ — ускоритель поверх них: если спроектированные ИИ-тьюторы дают эффект на уровне качественного преподавания при низкой стоимости, отличия вузов среднего уровня, построенных на «чтении лекций», размываются.","Напротив, ведущие университеты с исследованиями, сетями, брендом и очным опытом, скорее всего, впитают ИИ как инструмент производительности и увеличат отрыв.","Мы считаем, что Япония идёт по пути реструктуризации под руководством государства, где фискальные органы ставят целью число вузов, а Корея, медленно корректирующая места, рискует пойти по пути, близкому к рыночному уходу."]],
 c:[["США: −13% после пика 2025 года; Япония: 460 тыс. поступающих в 2040 году (73% мест); Корея: когорта сокращается вдвое до 227 тыс. к 2040 году.","Главная причина кризиса вузов — демография и финансы; ИИ ускоряет размывание отличий вузов среднего уровня."],0]},
labor:{t:"Настоящее ④: рынок труда и сигнальная ценность диплома",
 d:[["В среднем по ОЭСР бакалавры зарабатывают на 39%, а магистры и доктора — на 83% больше выпускников старшей школы: премия за диплом по-прежнему велика.","Несмотря на обещания компаний отказаться от требования диплома, найм по навыкам в 2023 году реально изменил менее одного из 700 наймов.","Безработица недавних выпускников вузов в США (22–27 лет) в последнем обновлении снизилась до 5,2%, но доля работающих не по квалификации достигла 42,5%.","Исследование ФРБ Нью-Йорка объясняет 64% роста безработицы молодых выпускников удалённой работой, что сдерживает утверждение «ИИ уничтожил вакансии для начинающих»."],
  "Как ИИ меняет содержание работы",
  ["Анализ подверженности LLM показал, что около 80% работников США могут ощутить влияние на не менее 10% своих задач, причём высокооплачиваемые профессии подвержены сильнее.","В экспериментах ChatGPT сократил время профессионального письма на 40% и повысил качество на 18%.","В полевом исследовании службы поддержки ИИ-помощь повысила среднюю производительность на 14%, а у новичков и низкоквалифицированных — на 34%.","ВЭФ ожидает, что к 2030 году изменятся или устареют 39% ключевых навыков работников.","Однако консервативная оценка даёт прирост совокупной факторной производительности за десятилетие не более 0,66%, так что скорость воздействия на рынок труда весьма неопределённа."],
  "Вывод",
  ["Рост производительности новичков благодаря ИИ означает сжатие кривой опыта, но и ослабляет стимул компаний поручать новичкам учебные задачи.","Поэтому мы считаем, что сигнальная ценность диплома в краткосрочной перспективе сохраняется, а более реальный риск — ослабление «лестницы первой работы», которую диплом раньше гарантировал.","Спрос на университеты сместится от «только диплома» к пакету «диплом + подтверждённые навыки работы с ИИ + практический опыт»."]],
 c:[["Премия бакалавра (+39%) и скромный эффект найма по навыкам (1 из 700) показывают устойчивость сигнала диплома.","ИИ сжимает работу начинающих (производительность новичков +34%), поэтому реальный риск — ослабление «лестницы первой работы»."]]},
shadow:{t:"Настоящее ⑤: репетиторство — что заменяется, а что усиливается",
 d:["Корея: меньше по объёму, интенсивнее",
  ["Общие расходы на школьное репетиторство в Корее в 2025 году составили 27,5 трлн вон — на 5,7% меньше рекордного 2024 года (29,2 трлн): первое снижение за пять лет.","Доля участвующих также снизилась на 4,3 п.п. — с 80,0% до 75,7%.","Однако ежемесячные расходы на одного занимающегося достигли рекорда в 604 тыс. вон, а в распределении расходов выросли только два крайних интервала.","Семьи с доходом от 8 млн вон в месяц тратят на репетиторство примерно втрое больше, чем семьи с доходом до 3 млн.","Минобразования заявило, что одно лишь сокращение числа учеников не объясняет спад; называются и другие факторы, например расширение продлённого дня.","ИИ-учебники через один семестр после введения в 2025 году были понижены до «учебных материалов», что резко сузило путь распространения персонализированного обучения с ИИ через государственные школы."],
  "Япония, Китай, США",
  ["Рынок японских дзюку и подготовительных школ поддерживают спрос на экзамены в среднюю школу и рост платы, но он стагнирует, особенно в регионах.","ИИ-система atama+ используется более чем в 4 000 классах по всей стране, распространяя в японском репетиторстве разделение труда «ИИ учит, человек наставляет».","Китай жёстко урегулировал репетиторство политикой «двойного снижения» 2021 года, но качественное исследование в журнале Q1 сообщает, что спрос на теневое образование сохраняется по мере постепенного смягчения ограничений.","Американская платформа помощи с ДЗ Chegg в октябре 2025 года сократила около 45% персонала, ссылаясь на «новые реалии ИИ» и резкое падение трафика из Google.","Мировые венчурные инвестиции в edtech в 2024 году составили около 2,4 млрд долл. — минимум с 2015 года, а капитал перетекает в ИИ и профессиональное обучение."],
  0,"Вывод: репетиторство скорее впитывает ИИ, чем заменяется им",
  ["Корейское репетиторство вступило в фазу поляризации «меньше по объёму, интенсивнее», и пока нет оснований считать падение общих расходов замещением со стороны ИИ.","Примеры показывают раскол между «заменяемым репетиторством» (ответы, разборы, выполнение ДЗ) и «усиливающимся» (стратегия поступления, мотивация, наставничество, информация).",
   ["Поскольку спрос на репетиторство порождается не нехваткой знаний, а конкуренцией за позиционное благо при рейтинговом отборе, сама конкуренция не исчезнет, даже если ИИ удешевит обучение.","Вывод объединяет данные Q1 о том, что даже жёсткое регулирование Китая («двойное снижение») не устранило спрос (38), и рост расходов корейских старшеклассников (30)."],
   "Скорее наоборот: когда ИИ пользуются все, различия смещаются к живому наставничеству, информации и связям, которые ИИ заменить трудно, и премия дорогого репетиторства может вырасти.","В Корее пробел ИИ в государственных школах (понижение AIDT) грозит отдать рынок репетиторам, превратившим ИИ-управление учёбой в продукт."]],
 c:[["Расходы на репетиторство в Корее снизились до 27,5 трлн вон (−5,7%), но траты на одного занимающегося рекордны (604 тыс. вон в месяц).","Модели «помощи с ДЗ» (Chegg) рушатся, гибриды с наставничеством (atama+) растут, а регулирование Китая не устранило спрос.","Репетиторство скорее впитает ИИ и увеличит премию за дорогое наставничество, чем будет им заменено."],0]},
assess:{t:"Кризис оценивания и доверия",
 d:[["В HEPI 2025 59% студентов сказали, что способ их оценивания «сильно» изменился из-за ИИ.","В ноябре 2025 года массовое списывание с ИИ на онлайн-курсе общего образования в Университете Ёнсе обнажило пределы дистанционного оценивания.","Детекторы ИИ систематически принимают английские тексты неносителей языка за сгенерированные, поэтому ставка на обнаружение порождает проблемы справедливости.","Поэтому центр тяжести оценивания неизбежно сместится от «проверки результата» к «доказательству процесса» (устные экзамены, очное выполнение, история версий, проектные портфолио).","Оценивание процесса требует много времени преподавателей, поэтому богатые вузы перейдут первыми и разрыв в доверии к дипломам вырастет.","В итоге ценность диплома будет переопределена вопросом: «подтвердил ли он, что умеет обладатель — с ИИ и без него?»"]],
 c:[["Детекторы ИИ ошибаются с неносителями языка, а дистанционные экзамены уязвимы для массового списывания, поэтому оценивание должно перейти к «доказательству процесса»."]]},
compare:{t:"Сравнение стран: Корея, Япония, США, Китай",d:[0,["Четыре страны испытывают одинаковый технологический шок, но различаются демографическим давлением и стилем политики, поэтому, по нашей оценке, они, скорее всего, разойдутся по разным путям."]],c:[0]},
scen:{t:"Прогноз: четыре сценария на 2035 год",d:[["Сценарии заданы правилами решения по значениям трёх осей (A, I, L) в 2035 году и взаимоисключающи; их вероятности оцениваются MCMC в следующем разделе."],0],c:[0]},
mcmc:{t:"MCMC-моделирование: распределение вероятностей сценариев",
 d:[[["Модель — байесовская модель измерения: уровни трёх осей в 2026 году — латентные переменные, а 16 индикаторов, закодированных по источникам, — наблюдения с ошибкой измерения.","Баллы индикаторов — суждения, переводящие данные источников в шкалу 0–1; стандартное отклонение (σ) каждого индикатора тем больше, чем ниже класс источника (A ≈ 0,07–0,12, C ≈ 0,15)."],
  "Годовые темпы изменения осей имеют априорные распределения на основе источников, демографическое давление (D) входит как модератор, снижающий рост институциональной адаптивности, а внешние шоки до 2035 года заданы нормальным распределением.","Апостериорные распределения получены четырьмя цепями Метрополиса–Гастингса со сходимостью по R-hat; затем для каждой апостериорной выборки многократно генерируются траектории до 2035 года, чтобы получить «распределение самой вероятности сценария».","Изменение региона (глобально, Корея, Япония, США), допущений о росте или порогов сценариев на панели ниже перезапускает MCMC прямо в браузере."],
  0,["При базовых настройках у Кореи вероятность «Великой поляризации» выше глобальной, поскольку высокое демографическое давление и отказ от AIDT снижают оценку её институциональной адаптивности.","Одна из ключевых неопределённостей модели — темп изменения сигнала диплома (L): стоит сделать это априорное распределение чуть пессимистичнее, и вероятность «утраты роли диплома» быстро растёт."]],
 c:[["Мы байесовски оценили текущие значения трёх осей по 16 индикаторам и многократно сгенерировали траектории до 2035 года, получив распределения вероятностей сценариев (можно перезапустить в браузере)."],0]},
panel:{t:"Экспертная панель из 10 персон-консультантов",
 d:[[["Чтобы дополнить модель внешними взглядами, мы задали 10 вымышленных консультантов из разных областей и построили вероятности сценариев и рекомендации, которые каждый дал бы, прочитав те же источники.","Персоны — не реальные люди, а инструмент суждения, созданный Claude с намеренным отражением типичных профессиональных искажений (например, акцент финансистов на реструктуризации, технооптимизм венчурных инвесторов)."],
  "Агрегирование панели показывает линейное (среднее) и логарифмическое (геометрическое среднее) объединение и сравнивает их с MCMC, чтобы выявить расхождение модели и экспертной интуиции."],0],
 c:[0]},
signals:{t:"Индикаторы раннего предупреждения и условия опровержения",
 d:[["Ниже — сигналы, которые первыми покажут переход между сценариями; они выбраны так, чтобы их можно было отслеживать по ежегодно обновляемой открытой статистике."],0,
  ["Ключевой вывод доклада («институты устойчивы») следует немедленно пересмотреть, если заметно вырастет доля крупных работодателей, нанимающих выпускников по ИИ-проверке навыков вместо дипломов.","Также, если вред бесконтрольного использования ИИ не воспроизведётся в долгосрочных исследованиях, вес вывода «решает дизайн» следует снизить."]],
 c:[0]},
strategy:{t:"Стратегические рекомендации для участников",
 d:["Университеты",["Вузам следует передать «чтение лекций» ИИ-тьюторам, а время преподавателей перенаправить на оценивание процесса, руководство проектами и связи с практикой.","Институциональный ИИ с защищающими обучение ограничителями вместо неограниченных универсальных чат-ботов лучше и для обучения, и для справедливости.","Вузам среднего уровня в Корее и Японии перед демографическим обрывом выгоднее заранее решиться на слияние, альянс или переход к обучению взрослых, чем пытаться выжить в одиночку."],
  "Репетиторство и edtech",["Цена продуктов «ответы и разборы» под давлением универсального ИИ стремится к нулю, поэтому им нужно переходить к услугам, сочетающим управление учёбой, мотивацию, информацию о поступлении и наставничество.","Первыми доверие родителей и госзакупки получат поставщики с независимо подтверждённой эффективностью (рандомизированные эксперименты, долгосрочное отслеживание)."],
  "Правительства",["Политика должна ставить «проверку эффекта и перестройку оценивания» выше «скорости внедрения»; опыт AIDT в Корее учит, что внедрение без проверки вызывает политический откат.","Если государственные школы не предоставят бесплатных ИИ-тьюторов с ограничителями, ИИ распространится вдоль линий дохода и усилит поляризацию репетиторства."],
  "Студенты, родители, работодатели",["Студентам и родителям стоит регулярно проверять, могут ли они объяснить и применить материал без ИИ, а не просто «быстрее закончить» с ним.","Поскольку ИИ сжимает учебные задачи новичков, компании рискуют разорвать конвейер подготовки кадров среднего звена, если не создадут осознанно программы наставничества и ротации."]],
 c:[["Вузам — передать лекции ИИ и перейти к оцениванию процесса; репетиторам — от ответов к гибридам с наставничеством; правительствам — приоритет проверки и бесплатный ИИ с ограничителями; компаниям — перестроить наставничество для новичков."]]},
method:{t:"Методология, классы доказательности и ограничения",
 d:[[["Научные источники ограничены статьями в журналах Q1 по SJR; препринты до рецензирования (например, ЭЭГ-исследования «когнитивного долга при использовании ChatGPT», рабочие документы о найме начинающих) намеренно исключены.","Классификация Q1 — по последнему квартилю SJR в предметной области и может отличаться по областям. Для некоторых статей Q1 цитата взята из аннотации рабочего документа/arXiv того же исследования; это указано у источника."],
  "Государственная статистика, доклады международных организаций и репрезентативные опросы с раскрытой методикой — класс B; сообщения СМИ, заявления компаний и отраслевые оценки — класс C и используются только для суждений о направлении.","Цитаты ограничены одной на источник и менее 15 слов; остальное пересказано.","Первое ограничение: большинство исследований эффектов ИИ в обучении краткосрочны (до двух лет), данных о долгосрочном формировании навыков нет.","Второе: кодирование индикаторов и правила решения модели MCMC сами являются суждениями аналитика, поэтому выходные вероятности — «структурированные субъективные вероятности», делающие допущения прозрачными, а не объективные частоты.","Третье: регионы вне ОЭСР, такие как Китай и Индия, а также рынки профобразования и обучения в течение жизни не удалось охватить глубоко из-за ограниченного доступа к данным."]],
 c:[["Научные источники — только статьи Q1, цитаты — одна на источник; вероятности модели следует читать как «структурированные субъективные вероятности»."]]},
refs:{t:"Список источников",d:[0],c:[0]}
},
ev:{
1:["Опрос с раскрытой методикой: 1 041 британский студент очной формы, взвешивание по полу и типу вуза, погрешность ±3%. Но «использование» указано самими респондентами, без различения интенсивности и целей, а перенос за пределы Великобритании ограничен.","Считаем, что в вузах богатых стран использование генеративного ИИ уже стало всеобщим. Перекос в пользу юношей, STEM и обеспеченных — сигнал расширения разрыва."],
2:["Проведён Savanta в декабре 2025 г., n = 1 054, третий год по той же схеме, что позволяет сравнивать тренды. Спонсор (Kortext) — компания цифровых учебников, но направление результата (слабая реакция вузов) не в его пользу.","Разрыв между 95% использования студентами и 36–38% поощрения/предоставления со стороны вузов — ключевая структура этапа; это главное основание низкой текущей оценки оси «институциональная адаптивность»."],
3:["Опрос государственного института, но генеральная совокупность ограничена «студентами с опытом использования генеративного ИИ», поэтому трактовка как доли всех студентов завышает показатель. Подтверждено через цитату в СМИ, а не по оригиналу.","Доверяем направлению — ИИ стал базовым учебным инструментом в корейских вузах, — но цифру трактуем лишь как «долю пользователей, использующих его так»."],
4:["Опрос ЮНЕСКО — удобная выборка вокруг кафедр ЮНЕСКО и сетей UNITWIN, репрезентативность слабая. В том же опросе около двух третей «имеют или разрабатывают» политику, так что подача сильно меняет впечатление.","При 19% с официальной политикой и 42% в разработке считаем институционализацию «идущей, но незавершённой»; поскольку наличие политики не гарантирует качества исполнения, оставляем оценку низкой."],
5:["Обзор литературы, а не первичное исследование; многие цитируемые работы короткие и малые. Но как обобщение международной организации он сбалансированно сводит противоречивые данные (результат растёт, обучение стоит) и добавляет репрезентативные цифры вроде TALIS 2024 (37% учителей используют ИИ).","Разделение результата и обучения принимаем аналитической осью всего доклада; ИИ, созданный для образования, нужно оценивать отдельно от универсальных чат-ботов."],
6:["Перекрёстное РКИ с высокой внутренней валидностью, но внешняя ограничена вводным курсом физики Гарварда, двумя неделями и одной темой. Сравнение с хорошо организованным активным обучением — сильная сторона, но посттест краткосрочный, долгосрочное удержание не проверено.","ИИ-тьютор, построенный на принципах науки об обучении, может быть по меньшей мере не хуже качественного преподавания — ключевое основание заменимости вузов, построенных на лекциях."],
7:["Объединяет 51 исследование (ноябрь 2022 — февраль 2025), но многие малые или квазиэкспериментальные, неоднородность велика (значимая модерация по курсу и длительности). 0,867 — необычно много для образовательного вмешательства, следует подозревать публикационное смещение и искажение «сравнения медиа» (источник 9).","Направление эффекта считаем положительным, а величину — верхней границей; в модели стандартное отклонение этого источника расширено во избежание излишней уверенности."],
8:["Лучше корреляционных работ, поскольку отобраны только эксперименты, но сильно смещён к вузам и изучению языков. Рост успеваемости и мотивации без роста самоэффективности согласуется с тем, что «внешняя помощь повышает результат, не повышая чувства компетентности».","Два независимых метаанализа (7·8) указывают в одну сторону, поэтому краткосрочный рост успеваемости устойчив; неизменная самоэффективность — тревожный сигнал, связанный с риском зависимости (10·11)."],
9:["Методологическая критика исследований из источников 7·8: сравнения «ChatGPT против отсутствия вмешательства» могли измерять различия в методике, времени и обратной связи, а не в медиа. Это препринт журнала до окончательной публикации.","Отвергаем трактовку больших эффектов метаанализов как «эффекта медиа». Это подкрепляет вывод доклада: эффект создаёт дизайн, а не сам ИИ."],
10:["Полевое РКИ с ~1 000 турецких старшеклассников, высокая экологическая валидность. Одна страна и только математика; падение на 17% у «GPT Base» после изъятия инструмента — краткосрочный эффект, долгосрочный неизвестен.","Принимаем как самое сильное причинное свидетельство парадокса бесконтрольного ИИ: «практика лучше, самостоятельная работа хуже». То, что ограничители (GPT Tutor) в основном снимают вред, — основа вывода «решает дизайн»."],
11:["Лабораторное исследование: 117 студентов случайно распределены по четырём условиям, сильная сторона — анализ логов учебного процесса (SRL). Выборка мала, задание одно — эссе на неродном (английском) языке, обобщать надо осторожно.","Результат — оценки за эссе выше, а прирост знаний и перенос не отличаются — считаем независимым свидетельством, сходящимся с источником 10; передачу метакогнитивной работы ИИ считаем фактором риска для долгосрочного развития навыков."],
12:["Прогноз по рождаемости и численности учащихся по классам — надёжный ряд, ведущийся с 1979 года. Миграция и изменение выпуска добавляют погрешность, но краткосрочная мала, так как опирается на когорты рождения 18-летней давности.","Сокращение спроса на вузы в США примерно на 13% после пика 2025 года считаем практически «предрешённым»; сильнее всего давление на вузы вне Юга."],
13:["Официальный прогноз правительственного совета (сценарий низкой рождаемости), высокая надёжность. Диапазон 460–510 тыс. в зависимости от доли поступающих; есть и отдельный сценарий с ростом иностранных студентов.","Считаем, что около четверти ёмкости японских вузов станет структурно избыточной к 2040 году; масштабная реструктуризация была неизбежна ещё до ИИ."],
14:["Подтверждено через анализ исследователя Национального института политики в образовании, а не по исходным материалам совета; автор отмечает, что неясно, как сокращение 140 тыс. мест превращается в минус 252 вуза.","Важнее точности цифр сам факт: фискальные органы начали ставить число вузов целью политики; Япония идёт путём реструктуризации под руководством государства, а не рыночного ухода."],
15:["Сообщение информагентства о почти сплошном обследовании (594 вуза) корпорацией содействия частным школам — цифра надёжна. Улучшение 2025 года вызвано временным ростом числа 18-летних и не означает разворота тренда.","Более половины частных вузов недобирают, а абитуриенты концентрируются в ведущих вузах — поляризация уже идёт."],
16:["Первичный правительственный документ, прямо показывающий намерения, но на стадии плана («будет продвигаться»); конкретные средства и масштаб определит Базовая политика, поэтому сила исполнения неопределённа.","Считаем, что реструктуризация японских вузов вероятно перейдёт в стадию политики после 2027 года — фактор, повышающий институциональную адаптивность (I) сверху вниз."],
17:["Сообщение СМИ о прогнозе государственного аналитического центра на основе допущений о рождаемости и средней доле сдающих CSAT. Направление совпадает с прогнозом Статистического управления (около 260 тыс. 18-летних в 2040 году), уровни различаются.","Корея сталкивается с одним из худших в ОЭСР обрывов спроса — поступающих почти вдвое меньше за десять лет; сильнее всего пострадают частные вузы вне столичного региона."],
18:["Сценарий «бездействия» с фиксированными местами и средней долей поступления (73,2%) — близок к худшему пути. Сокращение мест или привлечение иностранцев изменит цифру.","Используем как «предупреждающее значение»: при нынешней структуре мест система станет неустойчивой в 2040-х; не как базовый прогноз."],
19:["Срез ответов 825 вузов, не сплошное обследование; окончательные данные — в Open Doors 2026. Причина спада — геополитика, например визовая политика; её независимость от ИИ сама по себе аналитически важна.","Финансовая подушка вузов, зависящих от доходов от иностранцев, ослабла, а стратегия компенсации демографии иностранными студентами стала менее надёжной."],
20:["Сопоставимая официальная статистика стран-членов, но это поперечные разрывы в заработках, а не причинная отдача без отбора по способностям, и в основном за годы до распространения ИИ.","Премия за диплом пока устойчива на ранней стадии распространения ИИ — основание высокой текущей оценки оси сигнала (L)."],
21:["Надёжный официальный анализ на основе CPS. В том же обновлении неполная занятость выросла до 42,5%, так что снижение безработицы само по себе не означает улучшения; разложения по причинам (ИИ, цикл, удалёнка) нет.","Ухудшение качества первой работы недавних выпускников реально, но вклад ИИ оставляем неопределённым."],
22:["Вторичное изложение исследования ФРС в СМИ; оценка эффекта удалённой работы зависит от модели. Но аргумент о сроках — рост начался до ИИ — проверяем независимо.","Нарратив, винящий только ИИ в ухудшении найма начинающих, преувеличен; ИИ — будущий риск, но пока не главная причина."],
23:["Объединяет вакансии крупных компаний с данными о фактическом найме — сильная сторона в различении обещаний и практики. Крупные компании США, данные 2023 года, без учёта распространения ИИ-проверки навыков после этого.","Отказ от требования диплома во многом символичен, а реальный найм продолжает использовать диплом как сигнал — ключевая причина высокого барьера для сценария «утраты роли диплома»."],
24:["Опрос ожиданий более 1 000 крупных работодателей, а не измерение. Показатель снизился с 57% (2020) и 44% (2023) до 39%, сам прогноз изменчив и смешивает оптимизм и пессимизм работодателей.","Давление на переподготовку велико, но ближе к частичной перестройке, чем к полной замене; используем лишь как свидетельство спроса на обновление программ."],
25:["Оценка подверженности, а не реального замещения или занятости. Большинство авторов из OpenAI, а GPT-4 использовался как классификатор — риск конфликта интересов и замкнутости.","Принимаем, что влияние ИИ охватывает высокообразованные и высокооплачиваемые профессии, но не как прогноз потери рабочих мест; то, что сильнее всего подвержена работа выпускников, вынуждает вузы переосмыслить ценностное предложение."],
26:["Предрегистрированный онлайн-эксперимент (n = 453) с надёжным причинным выводом, но стандартные 20–30-минутные задания на письмо почти не требуют точности фактов и контекста, так что реальный эффект может быть меньше.","ИИ сильно сжимает рутинное письмо в «белых воротничках» с высшим образованием; то, что эта работа была обучающей для новичков, лежит в основе риска для «карьерной лестницы»."],
27:["Полевые данные высокой внешней валидности по поэтапному внедрению у 5 179 операторов. Одна компания и одна профессия; цифры журнальной и рабочей версий могут слегка различаться, поэтому указываем, что основа — рабочий документ.","ИИ передаёт неявные знания экспертов новичкам, сжимая кривую опыта; в образовательных терминах ИИ заменяет часть обучения по типу ученичества."],
28:["Опирается на модель задач и существующие оценки подверженности и экономии, критикуется за недооценку новых задач и углубления автоматизации. Тем не менее это важный консервативный ориентир против ажиотажа.","Оценку прироста СФП ≤0,66% за десять лет учитываем как основание сценария «медленного распространения» и используем как контрдовод, ограничивающий ось технологического давления (A)."],
29:["Государственная утверждённая статистика по ~74 тыс. учащихся примерно в 3 000 школ — самый надёжный источник. Но бесплатные заменители (EBS, программы после уроков, бесплатные ИИ-инструменты) не учитываются.","Снижение общих расходов в 2025 году (−5,7%) реально и больше сокращения числа учеников (−2,3%), так что примешиваются изменения поведения; оснований приписывать его замещению ИИ нет."],
30:["Отчёт о вопросах и ответах при официальной публикации статистики — факты надёжны; «закрепление поляризации» — интерпретация СМИ, требующая проверки по данным о распределении.","Рекорд 604 тыс. вон в месяц на занимающегося и +2,6% у старшеклассников показывают устойчивый спрос на подготовку к поступлению и концентрацию расходов наверху."],
31:["Официальный показатель на основе государственной статистики. Доход и регион (концентрация в Сеуле) переплетены, поэтому трактовать как чистый эффект дохода нужно осторожно.","Доступ к репетиторству сильно связан с доходом, поэтому платные ИИ-сервисы управления учёбой, вероятно, распространятся по тому же градиенту."],
32:["Сам факт поправки к закону несомненен. Цифры около 33% внедрения и менее 10% фактического доступа взяты из выступлений в парламенте и требуют независимой проверки; следует учитывать и политическую позицию издания.","Корея — пример политического отказа от распространения персонализированного обучения с ИИ через госшколы; это фактор снижения институциональной адаптивности (I). Пустоту, вероятно, заполнят репетиторы и платформы."],
33:["Раскрытие информации компанией в пересказе СМИ: факты (388 мест, около 45%) проверяемы, но причины — собственное объяснение компании. ИИ-сводки Google тоже изменили поиск, поэтому эффект нельзя свести к «замещению ИИ-тьютором».","Рынок «помощи с ДЗ» в виде ответов и разборов — первый сегмент, обрушенный универсальным ИИ."],
34:["Данные частной исследовательской компании с нераскрытым охватом. Другая её публикация говорит о «минимуме с 2014 года», так что базовый год непоследователен; в 2025 году — небольшой отскок до ~2,6 млрд долл.","После пандемического пузыря капитал edtech переместился от объёма к ИИ и профобучению; потребительские школьные модели менее привлекательны для инвесторов."],
35:["Частная оценка по выручке поставщиков, детали методики — в платном отчёте. Оценки размера рынка сильно расходятся (например, ~985 млрд иен), поэтому доверяем направлению больше, чем уровню.","Японский рынок дзюку — в фазе «поляризации внутри стагнации», держится на росте цен и экзаменах в среднюю школу при низкой рождаемости; рост корпоративного обучения показывает смещение спроса на переподготовку."],
36:["Собственное заявление компании без независимой проверки и рецензированных данных об эффекте; впрочем, число классов как бизнес-показатель вряд ли ложно.","Разделение «ИИ учит, человек наставляет» становится основной моделью отрасли — репетиторство впитывает ИИ, а не заменяется им."],
37:["Сообщение государственных СМИ: содержание политики передано точно, исполнение — нет; сверено с оригиналом (руководство 2025 г. по генеративному ИИ в школах) и переводом CSET.","Китай выбрал нисходящую модель «ограничения по возрасту + всеобщая ИИ-грамотность»: быстрая институциональная адаптация при ограниченной автономии и разнообразии оценивания."],
38:["Опубликовано в журнале Q1, но это трёхлетнее качественное исследование 10 пекинских репетиторов — размер рынка не оценить. Наблюдение о смягчении регулирования совпадает с другой литературой.","Даже жёсткое государственное регулирование не устранило спрос на теневое образование, порождаемый конкуренцией при поступлении; корень спроса — структура отбора, а не технологии или предложение."],
39:["Рекламный материал поставщика: «крупнейшее» — его собственное утверждение, условия контракта и фактическое использование не раскрыты. Стоит учитывать и контекст: CSU внедряла ИИ под угрозой сокращения бюджета на 375 млн долл. (Axios).","Крупные государственные системы начали внедрять ИИ как экономичную инфраструктуру поддержки обучения; доступ расширяется, но учебный эффект требует отдельной проверки."],
40:["Малая выборка — 91 эссе TOEFL и 88 эссе американских восьмиклассников, версии детекторов 2023 года, поэтому последующие улучшения не проверены. Но механизм — структурный предел обнаружения по перплексии — надёжен.","Борьба с нарушениями с опорой на детекторы неустойчива и по справедливости, и по точности; переход оценивания к «доказательству процесса» неизбежен."],
41:["Сообщение об отдельном инциденте — масштаб и частоту не обобщить. Одновременно сообщалось о списывании без ИИ (через открытые чаты в Университете Корё), что показывает: суть проблемы — дизайн дистанционного оценивания, а не только ИИ.","Используем как «доказательство-случай» того, что даже в ведущих вузах Кореи системы оценивания не поспевают за ИИ, а не как статистику."]
},
scen:{S1:{n:"Расширенная коэволюция",d:["Вузы и репетиторы внедряют ИИ с ограничителями вместе с оцениванием процесса; ИИ берёт на себя объяснение и практику, а люди перестраиваются на проектирование, наставничество и оценивание.","Спроектированные ИИ-тьюторы бесплатно или дёшево предоставляются в школах и вузах, делая прирост обучения массовым и сдерживая рост премии репетиторства.","Диплом переопределяется с включением подтверждённых навыков работы с ИИ и сохраняет сигнальную ценность."],w:"Резкий рост доли официальных политик по ИИ, распространение оценивания процесса, стабильные расходы на репетиторство на ученика"},
 S2:{n:"Великая поляризация",d:["Ведущие вузы и дорогое репетиторство впитывают ИИ как инструмент производительности и усиливаются, а вузы среднего и низшего уровня, живущие лекциями, сливаются или уходят под ударом демографии.","При сохранении сигналов диплома и отбора институты реагируют медленно, и вред бесконтрольного ИИ и недоверие к оцениванию концентрируются внизу.","Общие расходы на репетиторство падают, но растут наверху, расширяя премиальный рынок «ИИ + живое наставничество»."],w:"Продолжающийся рост расходов на ученика, недобор более 60% частных вузов, застой институциональных политик по ИИ"},
 S3:{n:"Разукрупнение / утрата роли диплома",d:["Работодатели отбирают выпускников напрямую через ИИ-проверку навыков и портфолио, ослабляя сигнальную ценность дипломов.","Функции университета распадаются на преподавание, квалификации, связи и исследования, которые делят микроквалификации, корпоративные академии и платформы ИИ-тьюторов.","Ослабление конкуренции при поступлении сокращает подготовку к экзаменам, а рынок переподготовки взрослых растёт."],w:"Найм по навыкам охватывает более 1 из 50, неполная занятость выпускников выше 47%, сжатие премии за диплом"},
 S4:{n:"Инерция / откат",d:["Накопившийся вред обучению, списывание и проблемы приватности усиливают регулирование и общественное сопротивление, и использование ИИ в образовании застопоривается.","Макроэффект на производительность оказывается меньше ожидаемого, шоки на рынке труда мягкие, и прежний порядок вузов и отбора сохраняется.","Демографическое давление действует по-прежнему, поэтому реструктуризация вузов идёт независимо от ИИ."],w:"Ужесточение законов об ИИ в образовании, застой использования ИИ учителями, воспроизведение вреда в долгосрочных исследованиях"}},
pers:{1:{n:"Стратегический партнёр A",r:"Глобальный стратегический консалтинг · лидер практики высшего образования",lens:"Перестройка портфеля и динамика «победитель получает всё»",v:"При неизбежном демографическом обрыве ИИ усиливает эффект масштаба ведущих брендов. Середина становится «безликой серединой» и первой попадает под пресс.",sig:"Доля абитуриентов у 10% ведущих вузов",mv:"Вузам среднего уровня — до 2028 года решить: специализация или альянс"},
 2:{n:"Эксперт по реструктуризации B",r:"Финансы вузов и консультирование по M&A",lens:"Денежный поток, заполняемость, структура долга",v:"Инвестировать в ИИ могут лишь финансово сильные вузы. Недобирающие не потянут даже затраты на переход, так что поляризация сначала завершится в финансах.",sig:"Доля убыточных частных вузов и заполняемость",mv:"Договаривайтесь о добровольном слиянии или сокращении, пока есть финансовые силы"},
 3:{n:"Венчурный инвестор C",r:"Партнёр венчурного фонда в образовании и профобучении",lens:"Юнит-экономика и масштабируемость платформ",v:"Предельные издержки спроектированного ИИ-тьютора близки к нулю. Если госсистемы закупят его массово, прирост обучения станет всеобщим, а разукрупнение быстро пойдёт в профобучении.",sig:"Число крупных закупок ИИ-тьюторов вузами и школьными округами",mv:"Инвестируйте в продукты с подтверждённым учебным дизайном, а не в «выдачу ответов»"},
 4:{n:"Советник по экономике труда D",r:"Консультант по HR-стратегии, бывший экономист труда",lens:"Структура найма начинающих и карьерные лестницы",v:"Сигнал диплома пока силён, но учебные задачи новичков сжимаются ИИ. Если вход на первую работу закроется, премия за диплом может переломиться в начале 2030-х.",sig:"Доля найма выпускников и неполная занятость выпускников",mv:"Компаниям — институционализировать треки ученичества, вузам — зачётную практику"},
 5:{n:"Эксперт по учебному дизайну E",r:"Консультант по дизайну обучения, бывший исследователь науки об обучении",lens:"Ограничители, поддержка, дизайн оценивания",v:"Данные последовательно показывают, что решает дизайн. Если образовательный ИИ станет стандартом, возможна коэволюция; если долгосрочный вред воспроизведётся — последует откат.",sig:"Доля вузов, внедривших образовательный ИИ с ограничителями",mv:"Тратьте бюджет на ИИ с ограничителями и оценивание процесса, а не на разрешение универсальных чат-ботов"},
 6:{n:"Консультант по поступлению и репетиторству F",r:"Консультант по корейской отрасли поступления и репетиторства",lens:"Рейтинговый отбор и поведение родителей",v:"Пока отбор в Корее рейтинговый, спрос на репетиторство не исчезнет. ИИ впитается в премиальные услуги в стиле Тэчхи и усилит поляризацию расходов.",sig:"Расходы на занимающегося и доля тратящих более 1 млн вон в месяц",mv:"Школам — перейти к гибридам «ИИ-управление учёбой + наставничество по поступлению»"},
 7:{n:"Консультант по управлению вузами G",r:"Консультант по управлению японскими университетами",lens:"Реструктуризация силами государства и региональный доступ",v:"В Японии реструктуризацию ведёт государство, а не рынок. Упорядоченная перестройка может смягчить поляризацию, но сокращение региональных вузов вызовет политическое сопротивление.",sig:"Инструменты сокращения мест в Базовой политике и распределение субсидий частным вузам",mv:"Региональным вузам — обосновать своё существование специализацией под местный спрос на кадры"},
 8:{n:"Советник по госполитике H",r:"Советник по образовательной политике международной организации",lens:"Управление, справедливость, госзакупки",v:"Разрыв в политике велик, но быстро сокращается. Если государства предоставят ИИ с ограничителями как общественное благо, победит коэволюция.",sig:"Доля вузов с официальной политикой по ИИ",mv:"Правительствам — пакетом продвигать исследования эффективности и госзакупки ИИ-тьюторов"},
 9:{n:"Советник по регулированию и рискам I",r:"Консультант по регулированию ИИ и рискам приватности",lens:"Накопительный эффект инцидентов, исков и регулирования",v:"По мере накопления проблем списывания, предвзятости детекторов и данных детей регулирование догонит технологии. Отказ от AIDT в Корее показывает, как быстро возникает политический откат.",sig:"Число законов и исков об ИИ в образовании",mv:"До внедрения публикуйте оценку влияния на приватность и план проверки эффекта"},
 10:{n:"Консультант по подтверждению навыков J",r:"Консультант по корпоративному обучению и сертификации навыков",lens:"Заменимость сигналов найма",v:"Если ИИ удешевит прямое измерение навыков, ценность диплома как прокси упадёт. Найм по навыкам идёт медленно, но после порога распространяется быстро.",sig:"Доля крупных компаний, использующих ИИ-оценку навыков при найме",mv:"Вузам — выдавать проверяемые записи о навыках вместе с дипломом"}},
ind:{a1:"Всеобщее использование ИИ студентами (95%) — снижено до 0,80, так как использование ≠ замещение",a2:"Учителя используют ИИ в работе: 37% (TALIS)",a3:"Учебное преимущество спроектированных ИИ-тьюторов (РКИ, метаанализ; с учётом искажений)",a4:"Обвал рынка помощи с ДЗ (Chegg −45%)",a5:"Ограниченный макроэффект на производительность (СФП ≤0,66% за 10 лет)",i1:"Вузы с официальной политикой по ИИ: 19%",i2:"Поощрение / инструменты от вуза: 36–38%",i3:"Оценивание изменилось «сильно»: 59%",i4:"Внедрение на уровне систем (CSU, руководства Китая)",i5:"Последовательность политики (откат Кореи / реструктуризация Японии)",i6:"Надёжность оценивания (предвзятость детекторов, списывание)",l1:"Премия за диплом (бакалавр +39%)",l2:"Найм по навыкам затрагивает < 1 из 700",l3:"Неполная занятость недавних выпускников 42,5%",l4:"Устойчивый спрос на подготовку к поступлению",l5:"Ожидаемое изменение 39% ключевых навыков"},

sec:{
summary:{t:"核心判断（执行摘要）",
 d:[[["AI正在迅速拆解大学与课外辅导的“功能”（讲解、练习、反馈、作业辅助），但到2035年取代学位与升学选拔这一“制度”的可能性很低。","功能层面的证据（6·10）属A级因果证据，制度层面的证据（20·23）属B级官方或大规模数据；本判断结合了两个层面变化速度的差异。"],
  ["MCMC模拟（全球基准）显示，至2035年最可能的路径是“大分化”（{S2}）与“增强型共同进化”（{S1}）之间的竞争，其后为“去学历化”（{S3}）与“惯性/反弹”（{S4}）。","数值为§13模型后验预测分布的均值，会随地区和假设而变化。模型结构与指标编码本身即判断，因此应将其理解为“结构化判断”而非精确概率。"],
  "决定学习效果的变量不是“是否使用AI”，而是“设计”（护栏、支架、评估方式）；无护栏的使用可能在提高成绩的同时损害自主学习。",
  "大学危机的首要驱动因素不是AI，而是人口、财政与留学生减少；AI是加速器，侵蚀依赖“讲授”的中层大学的差异化基础。",
  "韩国课外辅导总支出五年来首次下降，但参与学生人均支出创历史新高，进入“规模收缩—强度加深”的两极分化阶段。",
  "学历的信号价值短期内依然稳固；更现实的风险是AI压缩了原本交给新人的训练性工作，削弱“第一份工作的阶梯”。"]],
 c:[["AI迅速拆解教育的“功能”，但学位与升学这一“制度”预计到2035年仍将稳固。","模拟显示，2035年是“大分化”（{S2}）与“增强型共同进化”（{S1}）的竞争。","学习效果取决于设计而非AI的有无；大学危机的主因是人口与财政。","韩国课外辅导总支出下降而人均支出创新高，两极分化加深。"]]},
frame:{t:"问题界定与分析框架",
 d:[["本报告以截至2026年11月的证据，诊断生成式AI对大学（高等教育）和课外辅导（补习班、家教、作业辅助、教育科技）的影响，并以2035年为目标年估计情景概率。",
  "分析的出发点是OECD提出的区分：成功完成任务并不等于学习；因此我们将AI的效果分为“表现（performance）”与“学习（learning）”分别解读。",
  ["未来可概括为三条轴：①AI的技术替代与重构压力（A），②教育机构与政策的制度适应力（I），③学位与升学在劳动力市场上的信号价值（L）。","三条轴是把证据所指向的独立驱动因素压缩到最少数量。人口压力（D）确定性很高，因此作为调节变量而非轴。"],
  "此外，各国确定性很高的人口压力（D）作为调节变量，会侵蚀制度适应力。",
  "每句话都标注了证据等级（A：Q1论文与官方统计；B：国际组织、政府与代表性调查；C：媒体、企业与行业资料；D：Claude的分析性推断）和证据编号，点击编号即可查看原文引文、批判与判断。"],0],
 c:[["我们将AI效果分为“表现”和“学习”，以技术压力（A）、制度适应力（I）、学历信号（L）三条轴加上人口压力（D）展望2035年。"],0]},
adoption:{t:"现状①：AI已成为学习的默认工具",
 d:[["英国HEPI调查中，以任何形式使用AI的本科生比例在一年内从2024年的66%跃升至2025年的92%。","在2026年调查（2025年12月实施）中，95%使用AI，94%在计分作业中使用生成式AI，实际已接近饱和。","在韩国，有生成式AI使用经验的大学生中，91.7%表示曾用AI为作业和项目检索资料。","HEPI报告称男生、STEM专业和社会经济地位较高者的使用率更高，表明使用普及的同时使用差距也在扩大。"],
  "制度滞后",
  ["相比之下，只有36%的学生感到所在机构鼓励使用AI，只有38%表示机构提供AI工具。","据引用UNESCO调查的OECD报告，仅有19%的高等教育机构制定了正式的AI政策。","2024年37%的初中教师在工作中使用AI，72%担心学术诚信受损，教学一方的采用远慢于学生。","作为例外，加州州立大学系统向46万多名学生提供ChatGPT Edu，宣布在整个系统内部署。","中国教育部在2025年指南中禁止小学生独立使用开放式生成式AI，同时要求建立分阶段的AI素养教育体系。","因此，当前阶段的本质是“使用普及”与“制度不成熟”之间的差距，我们判断弥合这一差距的速度是区分各情景的第一个变量。","这一差距也意味着学习正转向机构无法管控的免费消费级工具，数据保护、公平与评估可靠性问题同时出现。"],0],
 c:[["英国本科生AI使用率两年内从66%升至95%趋于饱和，但只有36%感到机构鼓励，只有19%的机构有正式政策。","“使用普及”与“制度不成熟”之间的差距是当前阶段的核心。"],0]},
learning:{t:"现状②：学习效果的证据——“表现≠学习”的悖论",
 d:["正面证据",
  ["在哈佛物理课程的随机对照试验中，基于学习科学原理设计的AI导师组比主动学习课堂组用更少时间学到了显著更多的内容。","整合51项研究的元分析估计ChatGPT对学习表现的效应为g=0.867，对高阶思维的效应为g=0.457。","另一项分析69项实验研究的元分析也确认了学业成绩提升，但未发现自我效能感的变化。"],
  "反面证据与方法论批判",
  ["然而，2026年《Computers & Education》的一篇批判性综述指出，两项元分析纳入的许多研究采用“媒介比较”设计，可能把教学设计和时间的差异误认为AI效应。","在一项约1,000名土耳其高中生参与的实地实验中，使用普通ChatGPT式工具的学生练习成绩提高，但在撤除工具后的考试中比对照组低17%。","在同一实验中，嵌入保护学习提示词的“GPT Tutor”基本抵消了这一负面效应。","在117名大学生的实验中，ChatGPT组的作文分数提升最多，但知识获得与迁移并无差异，研究者称之为“元认知惰性”。","OECD《2026数字教育展望》综合上述证据指出，通用聊天机器人带来的表现优势在不使用工具的考试中可能消失甚至逆转。"],
  0,"判断",
  ["因此，“AI能否改善教育”是一个设问错误的问题，正确的问题是“在何种设计下、测量什么、在何时测量”。","g≈0.87对教育干预而言异常之大，考虑到发表偏倚和短期近端测量的高估，实际的持续效果应明显更小。","鉴于两项独立实验（高中数学与大学写作）呈现相同模式，“无护栏使用→依赖→自主表现下降”这一路径相当可信。","这一结论同样适用于课外辅导：提供答案型AI侵蚀作业辅助市场，而学习设计型AI则与人工辅导结合成为新产品。"]],
 c:[["设计良好的AI导师在随机对照试验中优于主动学习课堂，元分析也报告了较大效应（g=0.867）。","但无护栏使用使撤除工具后的考试成绩下降17%，元分析的效应量很可能因设计混杂而被高估。","决定性变量是设计，而非AI的有无。"],0]},
univ:{t:"现状③：大学的结构性压力——人口、财政与地缘政治",
 d:[["美国高中毕业生预计在2025年达到约390万人的峰值，之后至2041年减少约13%。","日本中央教育审议会推算，大学升学者将从约63万人降至2040年的约46万人，约为现有招生规模的73%。","2025年度日本53.2%（316所）的私立大学招生不足，因18岁人口暂时增加，较上年有所改善。","财政制度等审议会于2026年4月提出到2040年削减约250所私立大学的方案，政府文件也明确将重审国立大学招生名额并推进私立大学重组整合。","韩国的下降更为陡峭：KDI预测大学可入学人数将从2030年的44.2万人减至2040年的22.7万人，几乎减半。","国会未来研究院警告，若招生名额不变并沿用近期升学率，2043年新生满员率可能降至39.4%。","以留学生弥补人口缺口的策略也变得不稳定：美国2025年秋季新入学国际学生减少了17%。"],
  0,"判断：AI是加速器而非原因",
  ["这些数据清楚表明，大学危机的首要驱动因素是人口、财政和地缘政治，而不是AI。","AI是叠加其上的加速器：若设计良好的AI导师能以低成本提供与高质量教学相当的效果，以“讲授”为核心价值的中层大学的差异化基础将被侵蚀。","相反，拥有科研、网络、品牌和线下体验的顶尖大学很可能把AI吸收为生产力工具，进一步拉大差距。","我们判断，日本将走由财政部门把大学数量作为政策目标的“政策主导重组”路径，而招生名额调整迟缓的韩国则面临接近“市场退出”的风险。"]],
 c:[["美国在2025年峰值后减少13%，日本2040年升学者为46万人（招生规模的73%），韩国可入学人数到2040年减半至22.7万人。","大学危机的主因是人口与财政，AI加速侵蚀中层大学的差异化。"],0]},
labor:{t:"现状④：劳动力市场与学历的信号价值",
 d:[["OECD平均而言，学士学历者收入比高中学历者高39%，硕博学历者高83%，学历溢价依然很大。","尽管企业承诺取消学历要求，技能导向招聘在2023年实际改变的招聘不足七百分之一。","另一方面，美国近期大学毕业生（22–27岁）的失业率在最新数据中回落至5.2%，但从事无需学位工作的不充分就业率达42.5%。","纽约联储研究将年轻大学毕业生失业上升的64%归因于远程办公的普及，对“AI消灭了入门岗位”的论断构成制约。"],
  "AI如何改变工作内容",
  ["LLM暴露度分析估计，约80%的美国劳动者至少有10%的工作任务可能受到影响，且收入越高的职业暴露越大。","实验研究中，ChatGPT将专业写作时间缩短40%，质量提高18%。","在客服现场研究中，AI辅助使平均生产率提高14%，新手和低技能员工的生产率提高34%。","WEF预计到2030年劳动者39%的核心技能将发生变化或过时。","但也有保守估计认为未来十年全要素生产率的提升不超过0.66%，劳动力市场冲击的速度存在很大不确定性。"],
  "判断",
  ["AI提升新手生产率意味着经验曲线被压缩，但同时也削弱了企业把训练性工作交给新人的动机。","因此我们判断，学历的“信号价值”短期内得以维持，而学历过去所保障的“第一份工作的阶梯”被削弱才是更现实的风险。","对大学的需求将从“单一学历”转向“学历+经验证的AI协作能力+实践经验”的组合。"]],
 c:[["学士工资溢价（+39%）与技能导向招聘的微小成效（1/700）表明学历信号依然稳固。","AI压缩入门工作（新手生产率+34%），真正的风险是“第一份工作阶梯”的削弱。"]]},
shadow:{t:"现状⑤：课外辅导——被替代的与被强化的",
 d:["韩国：规模收缩、强度加深",
  ["韩国2025年中小学课外辅导总支出为27.5万亿韩元，比创纪录的2024年（29.2万亿韩元）减少5.7%，为五年来首次下降。","参与率也从80.0%降至75.7%，下降4.3个百分点。","然而，参与学生的月均人均支出达到创纪录的60.4万韩元，支出分布中只有两端区间在增长。","月收入800万韩元以上家庭的课外辅导支出约为月收入不足300万韩元家庭的3倍。","教育部表示仅凭学生人数减少无法解释总额下降，照护政策加强等多重因素被提及。","AI数字教科书在2025年引入仅一个学期后就被降级为“教育资料”，通过公立教育推广AI个性化学习的路径大幅收窄。"],
  "日本、中国、美国",
  ["日本补习班与预备校市场靠初中升学考试需求和学费上涨支撑，但以地方为中心呈停滞趋势。","AI教材atama+已在全国4,000多个教室使用，“AI讲授、真人辅导”的分工模式正在日本补习行业扩散。","中国于2021年以“双减”政策严格监管补习行业，但一项Q1质性研究报告称，随着限制逐步放松，K-12影子教育需求仍在持续。","美国作业辅助平台Chegg以“AI的新现实”和来自谷歌的流量骤降为由，于2025年10月裁员约45%。","全球教育科技风险投资2024年约为24亿美元，为2015年以来最低，资本正重新配置到AI与职业培训领域。"],
  0,"判断：课外辅导更可能吸收AI而非被AI取代",
  ["韩国课外辅导已进入“规模收缩—强度加深”的两极分化阶段，目前尚无依据将总额下降解读为AI替代效应。","这些案例显示，“被替代的辅导”（答案、解析、代写作业）与“被强化的辅导”（升学策略、动机管理、辅导、信息）正在分化。",
   ["课外辅导需求的根源不是知识不足，而是相对评价升学中对地位商品的竞争，因此即使AI降低学习成本，竞争本身也不会消失。","该推断结合了Q1证据——即便中国的强力监管（双减）也未能消除需求（38）——以及韩国高中参与学生支出增加（30）。"],
   "反而，当人人都使用AI时，差异化会转向AI难以替代的人工辅导、信息和人脉，高端课外辅导的溢价可能扩大。","在韩国，公立教育的AI空白（AIDT降级）有可能把市场拱手让给已将AI学习管理产品化的课外辅导机构。"]],
 c:[["韩国课外辅导支出降至27.5万亿韩元（−5.7%），但参与学生人均支出创新高（月均60.4万韩元）。","作业代办型（Chegg）崩塌，辅导结合型（atama+）扩张，中国的监管也未能消除需求。","课外辅导更可能吸收AI并扩大高端辅导溢价，而非被AI取代。"],0]},
assess:{t:"评估与信任的危机",
 d:[["在HEPI 2025中，59%的学生表示评估方式因AI而“大幅”改变。","2025年11月，延世大学一门线上通识课出现利用AI的集体作弊，暴露了远程评估的局限。","AI检测器会一贯地把非母语者的英语写作误判为AI生成，以检测为中心的应对会造成公平问题。","因此，评估的重心必然从“检查成果”转向“证明过程”（口试、现场完成、版本记录、项目作品集）。","过程性评估耗费大量教师时间，财力充裕的大学将率先转型，学位可信度的差距将扩大。","最终，学位的价值将被重新定义为：“是否验证了持有者在使用AI与不使用AI时各能做什么。”"]],
 c:[["AI检测器误判非母语者，远程考试易受集体作弊冲击，评估必然转向“过程证明”。"]]},
compare:{t:"国家比较：韩国、日本、美国、中国",d:[0,["四国面临同样的技术冲击，但人口压力与政策风格不同，我们判断它们很可能分化到不同路径。"]],c:[0]},
scen:{t:"未来展望：2035年四大情景",d:[["各情景由三条轴（A、I、L）2035年取值的决策规则定义，相互排斥；其概率由下一节的MCMC估计。"],0],c:[0]},
mcmc:{t:"MCMC模拟：情景概率分布",
 d:[[["该模型是贝叶斯测量模型：以三条轴2026年的水平为潜变量，以从证据中编码的16个指标作为带测量误差的观测值。","指标分值是将证据数值换算到0–1尺度的判断值；证据等级越低，各指标的标准差（σ）设得越大（A≈0.07–0.12，C≈0.15）。"],
  "各轴的年变化率采用基于证据的先验分布，人口压力（D）作为削减制度适应力增长的调节项，至2035年的外生冲击以正态分布表示。","以4条Metropolis–Hastings链抽取后验分布并用R-hat确认收敛后，对每个后验样本反复生成至2035年的路径，计算“情景概率本身的分布”。","在下方面板中更改地区（全球、韩国、日本、美国）、增速假设或情景阈值，MCMC会在浏览器中重新运行。"],
  0,["在默认设置下，韩国因人口压力高且撤回AIDT，制度适应力估计偏低，“大分化”的概率高于全球基准。","模型的关键不确定性之一是学历信号（L）的变化率，只要把该先验稍微调得悲观一些，“去学历化”的概率就会迅速上升。"]],
 c:[["我们以16个证据指标对三条轴的当前值进行贝叶斯估计，并反复生成至2035年的路径，得到情景概率分布（可在浏览器中重新运行）。"],0]},
panel:{t:"10位专业咨询顾问角色小组",
 d:[[["为补充模型之外的视角，我们设定了10位来自不同专业领域的虚构顾问，构建了每人读过同样证据后会给出的情景概率与建议。","这些角色并非真实人物，而是Claude刻意反映典型职业偏见（如财务专家重视重组、风投偏向技术乐观）而设计的判断工具。"],
  "小组汇总同时给出线性汇总（平均）与对数汇总（几何平均），并与MCMC结果比较，以揭示模型与专家直觉之间的差距。"],0],
 c:[0]},
signals:{t:"预警指标与证伪条件",
 d:[["以下指标是最早显示情景转换的信号，选取时确保可以用每年更新的公开统计加以跟踪。"],0,
  ["若以AI能力验证代替学历招聘毕业生的大型雇主比例显著上升，本报告的核心判断（“制度依然稳固”）应立即修正。","同样，若无护栏AI使用的危害在长期跟踪研究中未能复现，应降低“设计才是变量”这一判断的权重。"]],
 c:[0]},
strategy:{t:"各利益相关方的战略建议",
 d:["大学",["大学应把“讲授”交给AI导师，将教师时间重新配置到过程性评估、项目指导和产学对接上。","提供带有学习保护护栏的机构用AI，而非无限制开放通用聊天机器人，对学习和公平都更有利。","面临人口断崖的韩日中层大学，与其单独求生，不如及早决定合并、联盟或转向成人再教育，以获得更强的谈判力。"],
  "补习机构与教育科技",["答案与解析类产品的价格将被通用AI压至趋近于零，应转向结合学习管理、动机激励、升学信息与辅导的服务。","拥有经独立验证效果证据（随机实验、长期跟踪）的供应商，将率先赢得家长信任和公共采购市场。"],
  "政府",["政策应把“效果验证与评估重设计”置于“导入速度”之上；韩国AIDT的教训是，未经验证的全面推行会招致政治回调。","若公立教育不免费提供护栏式AI导师，AI将沿收入差距扩散，加剧课外辅导的两极分化。"],
  "学生、家长与企业",["学生和家长应定期检查自己能否在不借助AI的情况下解释和应用所学，而不只是用AI“更快完成”。","随着AI压缩新人的训练性工作，企业若不刻意设计学徒制与轮岗计划，中坚人才的培养管道可能中断。"]],
 c:[["大学应把讲授交给AI并转向过程评估；补习机构应从答案提供转向辅导结合型；政府应优先验证并免费提供护栏式AI；企业应重新设计新人学徒制。"]]},
method:{t:"方法论、证据等级与局限",
 d:[[["学术证据仅限SJR Q1期刊论文，并刻意排除了同行评审前的预印本（如基于脑电的“使用ChatGPT时的认知负债”研究、关于入门就业的工作论文）。","Q1分类依据期刊最新的SJR学科分区，不同学科可能不同。部分Q1论文的引文取自同一研究的工作论文/arXiv摘要而非正式发表版，已在相应证据中注明。"],
  "政府统计、国际组织报告及方法公开的代表性调查为B级；媒体报道、企业公告和行业估计为C级，仅用于方向性判断。","引文限定为每个来源一条且少于15个词，其余内容均为概括或改写。","局限之一：AI学习效果研究大多为两年以内的短期研究，缺乏关于长期能力形成的证据。","其二：MCMC模型的指标编码与决策规则本身就是分析者的判断，因此输出概率不是客观频率，而是使假设透明化的“结构化主观概率”。","其三：受数据获取所限，未能深入覆盖中国、印度等非OECD地区以及职业教育与终身学习市场。"]],
 c:[["学术证据仅限Q1论文，引文每个来源限一条；模拟概率应理解为“结构化主观概率”。"]]},

},
ev:{
1:["方法公开的调查：英国全日制本科生1,041人，按性别与院校类型加权，误差±3%。但“使用”为自我报告，无法区分使用强度与目的质量，向英国以外推广有局限。","我们判断，高收入国家大学中生成式AI的使用已达到“普及”。男生、STEM和高收入群体的偏向被解读为差距扩大的信号。"],
2:["由Savanta于2025年12月实施，n=1,054，连续三年采用相同设计，可比较趋势。赞助方（Kortext）为数字教材企业，但结果方向（机构应对不足）并不符合其利益。","学生95%的使用率与机构36–38%的鼓励/提供之间的差距是本阶段的核心结构，也是把“制度适应力”轴当前值设低的主要依据。"],
3:["国家研究机构的调查，但样本限定为“有生成式AI使用经验的学生”，若视为全体大学生的使用率会高估。系通过媒体引用而非原报告的二次确认。","我们相信AI已成为韩国大学学习基本工具这一方向，但数值仅解读为“使用者中的使用比例”。"],
4:["UNESCO调查以UNESCO教席与UNITWIN网络机构为中心的便利样本，代表性较弱。同一调查中约三分之二“已有或正在制定”政策，表述方式会大幅改变观感。","正式政策19%、制定中42%，我们判断制度化“正在推进但尚未完成”；考虑到有政策不等于执行质量，维持较低取值。"],
5:["属文献综合而非一手研究，所引研究多为短期、小规模。但作为国际组织的综合，它平衡整理了相互矛盾的证据（表现上升、学习停滞），并给出TALIS 2024（37%教师使用AI）等代表性数据。","我们把“表现与学习的分离”作为全报告的分析轴，并判断应将教育专用AI与通用聊天机器人区分评估。"],
6:["交叉设计的随机对照试验，内部效度高，但限于哈佛物理入门课、两周、单一主题，外部效度有限。以“设计良好的主动学习”为对照是优点，但后测为短期近端测量，长期保持未经验证。","我们判断，基于学习科学设计的AI导师至少能达到“与高质量课堂相当或更好”的效果，这是以讲授为中心的机构可被替代的核心依据。"],
7:["整合2022年11月至2025年2月的51项研究，但多为小样本或准实验，异质性大（课程和时长的调节效应显著）。0.867对教育干预而言异常之大，应怀疑发表偏倚和“媒介比较”混杂（证据9）。","我们认为效应“方向”为正，但把大小视为上限；在模拟中放宽了该证据的标准差以防过度自信。"],
8:["仅筛选实验研究，优于相关研究，但明显偏向大学和语言学习。学业与情感动机提升而自我效能未变，这与“外部帮助提高表现却不提高能力感”的解读一致。","两项独立元分析（7·8）方向一致，因此判断短期学业提升是稳健的；自我效能不变则是与依赖风险（10·11）相关的警示信号。"],
9:["对证据7·8纳入研究的方法论批判，认为“ChatGPT对比无干预”测量的可能是教学设计、时间和反馈的差异而非媒介本身。需注意其为期刊预发表版本。","我们拒绝把元分析的大效应量解读为“媒介效应”，这强化了本报告“效果来源于设计而非AI本身”的判断。"],
10:["约1,000名土耳其高中生的实地随机对照试验，生态效度高。单一国家、仅限数学；“GPT Base”组撤除工具后下降17%属短期效应，长期累积效应未知。","我们将其作为无护栏AI造成“练习表现↑、独立表现↓”悖论的最强因果证据。护栏（GPT Tutor）基本抵消危害，是“设计才是变量”这一核心判断的依据。"],
11:["117名大学生随机分到四种条件的实验室研究，优点是分析了学习过程日志（自我调节学习过程）。样本小且只有一项非母语（英语）写作任务，推广需谨慎。","作文分数提高而知识获得与迁移无差异，这一结果被视为与证据10“相互印证的独立证据”；我们判断元认知外包是长期能力形成的风险因素。"],
12:["基于出生人数和各年级在校人数的推算，是自1979年以来积累的可靠时间序列。移民与毕业率变化带来误差，但因依据18年前的出生队列，短期误差很小。","我们判断美国大学需求在2025年峰值后下降约13%几乎是“既定的未来”，南部以外地区的大学压力最大。"],
13:["政府审议会的官方推算（低出生假设），可靠性高。依升学率假设不同，范围为46万至51万，另有留学生增加情景。","我们判断到2040年日本大学约四分之一的招生规模将出现结构性过剩，即便没有AI，大规模重组也不可避免。"],
14:["系通过国立教育政策研究所研究者的分析资料而非审议会原始资料确认；作者本人指出，14万名额削减如何对应252所学校减少并不明确。","比数值精度更重要的是：财政部门已开始把大学数量作为政策目标；日本走的是政策主导而非市场退出的重组路径。"],
15:["通讯社报道私立学校振兴共济事业团近乎全数的调查（594所），数值可靠。2025年的改善来自18岁人口暂时增加，并非趋势逆转。","过半私立大学招生不足而报考者向头部集中，我们判断“两极分化”已在进行中。"],
16:["直接体现政策意图的政府一手资料，但仍处于“将推进”的计划阶段，具体手段与规模待“骨太方针”确定，执行力度不确定。","我们判断日本大学重组很可能在2027年后进入政策实施阶段，这是自上而下提升制度适应力（I）的因素。"],
17:["媒体报道的国家智库推算，依赖出生人数和平均高考应试率假设。方向与统计厅推算（2040年18岁人口约26万）一致，但水平有差异。","我们判断韩国面临OECD中最严重的需求断崖之一，十年间生源近乎减半，首都圈以外的私立大学受冲击最大。"],
18:["假设名额不变并沿用近期平均升学率（73.2%）的“不作为”情景，接近最坏路径；削减名额或吸引留学生会改变数值。","我们把它作为“若维持现有名额结构，2040年代大学体系将不可持续”的警示值，而非基准预测。"],
19:["基于825所机构回答的快照，非全数调查，将在Open Doors 2026中确定。下降源于签证政策等地缘因素，其与AI无关这一点本身在分析上很重要。","我们判断依赖留学生收入的大学财政缓冲已被削弱，以留学生弥补人口下降的策略不确定性上升。"],
20:["成员国可比的官方统计，但为横截面收入差距，并非排除能力筛选效应的因果回报，且主要反映AI普及之前年份的数据。","我们判断在AI普及初期的当下，学历溢价依然稳固，这是将信号轴（L）当前值设高的依据。"],
21:["基于CPS的官方分析，可靠性高。同一更新中不充分就业率升至42.5%，仅凭失业率下降不能断定改善；未提供按原因（AI、经济周期、远程办公）的分解。","我们判断近期毕业生“第一份工作质量”的恶化真实存在，但AI的贡献尚未确定。"],
22:["媒体对美联储研究的二手概述，远程办公效应的估计依赖模型。但“上升在AI之前已开始”这一时间论据可独立验证。","我们判断把入门岗位恶化完全归咎于AI的叙事是夸大的；AI是未来风险，但迄今并非主因。"],
23:["结合大企业招聘广告与实际招聘数据，优点是区分了“宣示与实践”。以美国大企业为主、基于2023年，未反映此后AI能力验证的普及。","我们判断取消学历要求多为象征性举措，实际招聘仍以学历为信号，这是“去学历化”情景门槛高的核心依据。"],
24:["对1,000多家大型雇主“预期”的调查，并非实测。该数值从2020年的57%、2023年的44%降至39%，预测本身波动且混有雇主的乐观或悲观偏差。","我们判断技能重组压力大，但更接近“部分重构”而非“全面替代”，仅作为课程改革需求的依据。"],
25:["属“暴露度”估计，并非实际替代或就业效应。多数作者来自OpenAI，并以GPT-4作分类器，存在利益冲突与循环性问题。","我们接受AI影响广泛覆盖高学历、高收入职业这一点，但不将其解读为就业减少的预测；大学毕业生的工作暴露最大，迫使大学重新定义其价值主张。"],
26:["预注册的在线实验（n=453），因果推断稳健；但20–30分钟的标准化写作任务对事实准确性和情境要求低，实际工作中的效果可能更小。","我们判断AI大幅压缩了大学学历白领的常规写作工作，而这些工作曾是新人的训练任务，这是“职业阶梯”风险的依据。"],
27:["基于5,179名客服人员分阶段导入数据的现场证据，外部效度高。单一企业、单一岗位；期刊版与工作论文版数值可能略有不同，故注明以工作论文为准。","我们判断AI把熟练者的隐性知识传递给新人，压缩经验曲线；从教育角度看，这意味着AI替代了部分学徒式训练。"],
28:["依赖任务模型及现有暴露度和成本节约估计，被批评低估了新任务创造和自动化深化。但它仍是对抗过度叙事的重要保守基准。","我们把十年全要素生产率增幅不超过0.66%的估计作为“缓慢扩散”情景的依据，并用作限制技术压力轴（A）上限的反向证据。"],
29:["覆盖全国约3,000所学校7.4万名学生的国家认可统计，可靠性最高。但无法捕捉EBS、课后学校、免费在线AI工具等不花钱的替代品。","2025年总额下降（−5.7%）真实存在，且大于学生数减少（−2.3%），说明混有行为变化；但没有依据断定为AI替代效应。"],
30:["报道官方统计发布现场的问答，事实可信；“分化固化”是报道的解读，需用分布数据另行核实。","依据参与学生月均60.4万韩元（历史最高）和高中参与学生支出+2.6%，我们判断升学型辅导需求坚挺，且支出向上层集中。"],
31:["基于国家统计的官方指标。收入与地区（首尔集中）相互混杂，将其解读为纯收入效应需谨慎。","课外辅导的可及性与收入强相关，因此我们判断付费AI学习管理服务也很可能沿同一梯度扩散。"],
32:["法律修订这一事实是确定的。约33%的采用率和不足10%的实际访问率引自国会发言，需独立核实；也应考虑报道媒体的政治立场。","我们判断这是韩国在政治上撤回通过公立教育推广AI个性化学习的案例，是制度适应力（I）的下行因素；空白很可能由课外辅导和民间平台填补。"],
33:["媒体转述的企业披露：事实（388人、约45%）可核实，但原因归属是企业自身说法。谷歌AI摘要改变了搜索结构，无法单独归结为“AI导师替代”。","我们判断提供答案与解析的“作业辅助”市场是最先被通用AI冲垮的细分领域。"],
34:["民间市场调研机构的数据，统计范围未公开。同一机构另一篇文章称“2014年以来最低”，基准年不一致；2025年小幅反弹至约26亿美元。","我们判断疫情泡沫后教育科技资本已从“规模”转向“AI与职业培训”，面向K-12消费者的模式对投资者吸引力较低。"],
35:["民间机构基于企业营收的估计，方法细节见付费报告。各机构市场规模数值差异很大（如约9,850亿日元），因此更相信方向而非水平。","我们判断日本补习市场处于“停滞中的分化”：在少子化中靠提价和初中升学考试支撑；企业培训市场的增长显示再培训需求在转移。"],
36:["企业自行发布，无独立核验，也未提供学习效果的同行评审证据；但作为经营指标，教室数量不太可能虚假。","我们判断“AI讲授、真人辅导”的分工正成为补习行业的主流模式，课外辅导是在吸收AI而非被AI取代。"],
37:["官方媒体报道，政策内容转述准确，但执行情况无法确认；已与原文（《中小学生成式人工智能使用指南（2025年版）》）及CSET译本交叉核对。","我们判断中国选择了“分学段限制+全面AI素养教育”的自上而下模式：制度适应快，但自主性与评估多样性有限。"],
38:["发表于Q1期刊，但为对北京10名补习教师的三年纵向质性研究，无法推算市场规模。“监管由严转松”的观察与其他政策文献一致。","我们判断即便强力的国家监管也无法消除升学竞争造成的影子教育需求，需求的根源是选拔结构而非技术或供给。"],
39:["供应商的宣传材料，“最大规模”系其自称，合同条件与实际使用率未公开。还应考虑CSU在面临3.75亿美元预算削减时导入这一背景（Axios）。","我们判断大型公立体系已开始把AI作为“高性价比的学习支持基础设施”采用；可及性扩大，但学习效果需另行验证。"],
40:["91篇托福作文与88篇美国八年级作文，样本小，且基于2023年版检测器，之后是否改进未经验证。但“基于困惑度的检测存在结构性局限”这一机制解释是稳健的。","我们判断依赖检测技术应对作弊在公平与准确两方面都不可持续，评估向“过程证明”转变是必然的。"],
41:["单一事件报道，无法推广其规模与频率。同期高丽大学通过开放聊天室作弊等非AI作弊也被报道，说明问题本质不仅是AI，而是远程评估设计。","作为韩国顶尖大学评估体系也未跟上AI环境的“案例证据”使用，不作为统计证据。"]
},
scen:{S1:{n:"增强型共同进化",d:["大学与补习机构同时导入护栏式AI与过程性评估，由AI承担“讲解与练习”，人则重组为“设计、辅导与评估”。","设计良好的AI导师在公立教育和大学中免费或低价提供，学习效果普及化，课外辅导溢价的上升得到抑制。","学位被重新定义为包含“AI协作能力验证”，信号价值得以维持。"],w:"正式AI政策比例急升、过程性评估普及、人均课外辅导支出持平"},
 S2:{n:"大分化",d:["顶尖大学与高端补习把AI吸收为生产力工具而增强竞争力，依赖讲授的中低层大学在人口断崖冲击下被合并或退出。","在学历与升学信号保持不变而制度应对迟缓的情况下，无护栏AI的危害与评估失信集中于下层。","课外辅导总额减少但上层支出增加，“AI+人工辅导”的高端市场扩大。"],w:"人均课外辅导支出持续上升、私立大学招生不足超过60%、机构AI政策停滞"},
 S3:{n:"拆分化／去学历化",d:["雇主通过AI能力验证和作品集直接选拔毕业生，学位的信号价值减弱。","大学功能被拆分为教学、资格、人脉与科研，由微证书、企业学院和AI导师平台分别承接。","升学竞争减弱使应试型辅导萎缩，成人再培训市场增长。"],w:"技能导向招聘影响超过1/50、毕业生不充分就业超过47%、学历工资溢价收窄"},
 S4:{n:"惯性／反弹",d:["学习危害、作弊与隐私问题累积，监管与社会反弹加强，教育领域的AI应用陷入停滞。","宏观生产率效应低于预期，劳动力市场冲击温和，原有的大学与升学秩序得以维持。","但人口压力照常发挥作用，大学重组与AI无关地继续推进。"],w:"强化教育AI监管的立法、教师AI使用停滞、长期研究复现危害"}},
pers:{1:{n:"战略合伙人A",r:"全球战略咨询公司·高等教育业务负责人",lens:"关注组合重组与赢家通吃的动态",v:"在人口断崖已成定局的情况下，AI会强化头部品牌的规模经济。中层沦为“无差异的中间”，最先受到挤压。",sig:"前10%大学的报考者份额",mv:"中层大学应在2028年前决定走专业化还是联盟路线"},
 2:{n:"重组专家B",r:"大学财务与并购顾问",lens:"现金流、满员率与负债结构",v:"只有财务状况好的大学才有余力投资AI。招生不足的大学连AI转型成本都负担不起，两极分化将首先在财务上完成。",sig:"亏损私立大学比例与满员率",mv:"趁还有经营实力时，主动谈判合并或缩减规模"},
 3:{n:"教育科技风投C",r:"教育与职业培训风投合伙人",lens:"单位经济与平台扩展性",v:"设计良好的AI导师的边际成本接近于零。若公共体系大规模采购，学习效果将普及化，拆分化也将在职业培训领域迅速推进。",sig:"大学与教育局批量采购AI导师的合同数",mv:"投资“经验证的学习设计”类产品，而非提供答案型产品"},
 4:{n:"劳动经济顾问D",r:"劳动经济学家出身的人力资源战略顾问",lens:"入门招聘结构与职业阶梯",v:"学历信号依然强劲，但新人的训练性工作正被AI压缩。若进入第一份工作的通道受阻，学历溢价可能在2030年代初出现拐点。",sig:"应届生招聘占比与毕业生不充分就业率",mv:"企业应制度化学徒通道，大学应制度化计学分的实习"},
 5:{n:"学习设计专家E",r:"学习科学研究者出身的教学设计顾问",lens:"护栏、支架与评估设计",v:"证据一致表明设计才是变量。若教育用AI成为标准，共同进化是可能的；若长期危害被复现，就会出现反弹。",sig:"教育用（护栏式）AI的机构导入率",mv:"把预算用于护栏式AI与过程性评估，而不是放开通用聊天机器人"},
 6:{n:"升学与补习顾问F",r:"专注韩国升学与课外辅导行业的顾问",lens:"相对评价升学与家长行为",v:"只要韩国升学采用相对评价，课外辅导需求就不会消失。AI会被大峙洞式高价管理服务吸收，扩大支出两极分化。",sig:"参与学生人均支出与月支出100万韩元以上的比例",mv:"补习班应转向“AI学习管理+升学辅导”结合型"},
 7:{n:"大学经营顾问G",r:"日本大学经营专业顾问",lens:"政策主导的重组与地方可及性",v:"在日本，主导重组的是政策而非市场。若重组有序推进，可缓和两极分化，但地方大学收缩会引发政治反弹。",sig:"“骨太方针”中的名额削减手段与私学补助分配",mv:"地方大学应结合地方人才需求进行功能特化，以确立存续依据"},
 8:{n:"公共政策顾问H",r:"国际组织教育政策顾问",lens:"治理、公平与公共采购",v:"政策差距虽大但正在迅速缩小。若国家把护栏式AI作为公共品提供，共同进化将占上风。",sig:"拥有正式AI政策的机构比例",mv:"政府应把效果验证研究与公共AI导师采购打包推进"},
 9:{n:"监管与风险顾问I",r:"AI监管与隐私风险顾问",lens:"事件、诉讼与监管的累积效应",v:"作弊、检测偏差和儿童数据问题不断累积，监管终将追上技术。韩国撤回AIDT表明政治反弹来得有多快。",sig:"教育AI相关立法与诉讼数量",mv:"导入前公开隐私影响评估与效果验证计划"},
 10:{n:"能力认证顾问J",r:"企业培训与能力认证专业顾问",lens:"招聘信号的可替代性",v:"若AI降低了直接测量能力的成本，学历这一代理指标的价值就会下降。技能导向招聘进展缓慢，但一旦越过临界点便会迅速扩散。",sig:"在招聘中使用AI能力评估的大企业比例",mv:"大学应在学位之外签发可验证的能力记录"}},

 s+=`<text class="tl" x="${(l+W-r)/2}" y="${H-10}" text-anchor="middle">${T("mapX")}</text><text class="tl" transform="translate(14 ${(t+H-b)/2}) rotate(-90)" text-anchor="middle">${T("mapY")}</text>`;
 P.forEach(([n,x,y,c,ref])=>{s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="9" fill="var(${c})" stroke="var(--surface)" stroke-width="2" data-tip="${esc(n)} [${ref}]"/><text class="tv" x="${X(x)+(x>.7?-14:14)}" y="${Y(y)+4}" text-anchor="${x>.7?"end":"start"}">${esc(n)}</text>`;});

// ---------- MCMC widget ----------
function mcmcShell(){const sl=(k,min,max,stp,h)=>`<div class="ctrl"><label>${T(k)}<output id="o-${k}"></output></label><input type="range" id="i-${k}" min="${min}" max="${max}" step="${stp}"><div class="hint">${h?esc(T(h)):""}</div></div>`;
 return `<div class="wbox" id="mcW"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center" class="noprint"><b style="font-size:13px">${T("region")}</b><div class="seg" id="mcReg">${Object.keys(REGIONS).map(r=>`<button data-r="${r}">${X(REGIONS[r])}</button>`).join("")}</div>
 <span style="flex:1"></span><button class="iconbtn" id="mcRun">▶ ${T("run")}</button><button class="iconbtn" id="mcSeed">${T("seed")}</button><button class="iconbtn" id="mcReset">${T("reset")}</button></div>
 <div class="ctrls">${sl("ga",0,.3,.01,"hga")}${sl("gi",-.05,.3,.01,"hgi")}${sl("gl",-.15,.1,.01,"hgl")}${sl("tau",.1,1,.05,"htau")}${sl("thA",.4,.85,.01)}${sl("thL",.3,.75,.01)}${sl("thI",.3,.8,.01)}<div class="ctrl"><div class="diag" id="mcDiag"></div></div></div>
 <div class="wrow"><div class="panelc"><h5>${T("mBars")}</h5><div id="mcBars"></div></div><div class="panelc printhide"><h5>${T("mHist")}</h5><div id="mcHist"></div></div></div>
 <div class="wrow" style="margin-top:12px"><div class="panelc printhide"><h5>${T("mScatter")}</h5><div class="s">${T("mScS")}</div><div id="mcSc"></div></div><div class="panelc"><h5>${T("mReg")}</h5><div id="mcRegs"></div><div class="printhide"><h5 style="margin-top:10px">${T("mTrace")}</h5><div id="mcTr"></div></div></div></div>
 <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;font-weight:700">${T("mInd")}</summary><div id="mcInd"></div></details></div>`;}
function syncCtrls(){["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);if(!i)return;i.value=mcOpt[k];$("#o-"+k).textContent=(+mcOpt[k]).toFixed(2);});
 $$("#mcReg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===mcOpt.region));}
function drawMC(){syncCtrls();
 ["ga","gi","gl","tau","thA","thL","thI"].forEach(k=>{const i=$("#i-"+k);i.oninput=()=>{mcOpt[k]=+i.value;$("#o-"+k).textContent=(+i.value).toFixed(2);};i.onchange=()=>rerun();});
 $$("#mcReg button").forEach(b=>b.onclick=()=>{mcOpt.region=b.dataset.r;rerun();});
 $("#mcRun").onclick=rerun;$("#mcSeed").onclick=()=>{mcOpt.seed=(Math.random()*1e9)|0;rerun();};$("#mcReset").onclick=()=>{mcOpt=Object.assign({region:mcOpt.region},DEFAULTS);rerun();};
 if(MC)paintMC();}
function rerun(){const t0=performance.now();MC=runMCMC(mcOpt);MC.ms=performance.now()-t0;syncCtrls();paintMC();drawSens();}
function paintMC(){if(!MC||!$("#mcBars"))return;const sc=["--s1","--s2","--s3","--s4"],nm=SCEN.map(s=>s.key+" "+T("scs")[s.key]);
 // bars
 {const W=420,rh=40,H=4*rh+24,l=128,X=v=>l+(W-l-50)*v;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;[0,.25,.5,.75,1].forEach(v=>s+=`<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H-20}"/><text class="tm" x="${X(v)}" y="${H-6}" text-anchor="middle">${v*100}%</text>`);
  MC.mean.forEach((m,k)=>{const y=6+k*rh,c=MC.ci[k];s+=`<text class="tl" x="${l-8}" y="${y+18}" text-anchor="end">${esc(nm[k])}</text>
  <rect x="${X(c[2])}" y="${y+4}" width="${Math.max(2,X(c[3])-X(c[2]))}" height="20" rx="4" fill="var(${sc[k]})" opacity=".35"/><line x1="${X(c[0])}" x2="${X(c[1])}" y1="${y+14}" y2="${y+14}" stroke="var(${sc[k]})" stroke-width="2"/>
  <rect x="${X(m)-2}" y="${y}" width="4" height="28" rx="2" fill="var(${sc[k]})" data-tip="${esc(nm[k])}: <b>${pct(m)}</b><br>50%: ${pct(c[2])}–${pct(c[3])} · 90%: ${pct(c[0])}–${pct(c[1])}"/><text class="tv" x="${Math.min(X(c[1])+6,W-34)}" y="${y+19}">${pct(m)}</text>`;});
  $("#mcBars").innerHTML=s+`</svg>`;}
 // hist small multiples
 {let h=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">`;MC.mean.forEach((m,k)=>{const bins=new Array(10).fill(0);MC.probs.forEach(p=>bins[Math.min(9,Math.floor(p[k]*10))]++);const mx=Math.max(...bins);
  let s=`<svg viewBox="0 0 220 90" width="100%"><text class="tl" x="0" y="11">${esc(nm[k])}</text>`;bins.forEach((v,i)=>{const hh=60*v/mx;s+=`<rect x="${4+i*21}" y="${78-hh}" width="19" height="${Math.max(1,hh)}" rx="3" fill="var(${sc[k]})" data-tip="${i*10}–${i*10+10}%: ${(v/MC.probs.length*100).toFixed(1)}%"/>`;});
  s+=`<line class="ax" x1="2" x2="216" y1="78" y2="78"/><text class="tm" x="4" y="89">0%</text><text class="tm" x="214" y="89" text-anchor="end">100%</text></svg>`;h+=s;});$("#mcHist").innerHTML=h+`</div>`;}
 // scatter
 {const W=440,H=290,l=36,b=30,t=8,r=10,X=v=>l+(W-l-r)*v,Y=v=>t+(H-t-b)*(1-v);let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [0,.25,.5,.75,1].forEach(v=>s+=`<text class="tm" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}</text><text class="tm" x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`);
  MC.pts.slice(0,1400).forEach(p=>s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.6" fill="var(${sc[p[3]]})" opacity=".55"/>`);
  s+=`<line x1="${X(MC.opt.thA)}" x2="${X(MC.opt.thA)}" y1="${t}" y2="${H-b}" stroke="var(--text-2)" stroke-dasharray="4 3"/><line x1="${X(MC.opt.thA)}" x2="${W-r}" y1="${Y(MC.opt.thI)}" y2="${Y(MC.opt.thI)}" stroke="var(--text-2)" stroke-dasharray="4 3"/>
  <text class="tm" x="${X(.01)}" y="${Y(.97)}">S4 ← θA</text><text class="tm" x="${W-r-4}" y="${Y(MC.opt.thI)-6}" text-anchor="end">θI ↑ S1 · ↓ S2 (S3: L&lt;θL)</text>
  <text class="tl" x="${(l+W)/2}" y="${H}" text-anchor="middle">A 2035</text><text class="tl" transform="translate(10 ${H/2}) rotate(-90)" text-anchor="middle">I 2035</text></svg>`;
  $("#mcSc").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s;}
 // trace
 {const W=440,H=110,l=30;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;const tc=["--s1","--s2","--s3","--s4"];const n=MC.traces[0].length;
  [.2,.4,.6].forEach(v=>s+=`<line class="grid" x1="${l}" x2="${W}" y1="${H-10-(H-20)*v}" y2="${H-10-(H-20)*v}"/><text class="tm" x="${l-4}" y="${H-6-(H-20)*v}" text-anchor="end">${v}</text>`);
  MC.traces.forEach((tr,c)=>{s+=`<polyline fill="none" stroke="var(${tc[c]})" stroke-width="1" opacity=".8" points="${tr.map((v,i)=>(l+(W-l)*i/n).toFixed(1)+","+(H-10-(H-20)*v).toFixed(1)).join(" ")}"/>`;});
  const bx=l+(W-l)*(4000/14000);s+=`<line x1="${bx}" x2="${bx}" y1="0" y2="${H-10}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="tm" x="${bx+4}" y="10">burn-in</text></svg>`;$("#mcTr").innerHTML=s;}
 const rh=Math.max(...MC.rhat);$("#mcDiag").innerHTML=`<span>${T("rhat")} <b class="${rh<1.05?"ok":"warn"}">${rh.toFixed(3)}</b></span><span>${T("acc")} <b>${(MC.acc*100).toFixed(0)}%</b></span><span>${T("draws")} <b>${MC.n.toLocaleString()}</b></span><span>${T("time")} <b>${(MC.ms||0).toFixed(0)}ms</b></span><span>seed <b>${MC.opt.seed}</b></span>`;
 // regions
 if(ALLREG){const W=440,rh=30,H=4*rh+6,l=60;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;Object.keys(ALLREG).forEach((r,i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+16}" text-anchor="end">${X(REGIONS[r])}</text>`;
  ALLREG[r].mean.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="22" rx="4" fill="var(${sc[k]})" data-tip="${X(REGIONS[r])} · ${esc(nm[k])}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+15}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
  $("#mcRegs").innerHTML=leg(nm.map((n,k)=>[`var(${sc[k]})`,n]))+s+`</svg>`;}
 // indicators
 {const reg=REGIONS[MC.region];$("#mcInd").innerHTML=`<div class="tblwrap"><table class="t"><thead><tr><th>${T("indAx")}</th><th>${T("indH")}</th><th>${T("indV")}</th><th>${T("indS")}</th><th>${T("indE")}</th></tr></thead><tbody>`+
  INDICATORS.map(d=>{const v=reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v;return `<tr><td>${d.ax}</td><td>${esc(d[st.lang]||d.en||d.ko)}</td><td>${v.toFixed(2)}${reg.ov[d.k]!==undefined?" *":""}</td><td>${d.s.toFixed(2)}</td><td>${refB(d.refs)}</td></tr>`}).join("")+
  `<tr><td>D</td><td>${esc(T("demoInd"))}</td><td>${reg.D.toFixed(2)}</td><td>—</td><td>${refB([12,13,17])}</td></tr></tbody></table></div><div class="fsub" style="font-size:11.5px;color:var(--muted)">* ${esc(T("regAdj"))} · Prior: logit level ~ N(0,1.5); g_A ~ N(${MC.opt.ga},${MC.opt.gaSd}); g_I ~ N(${MC.opt.gi},0.08); g_L ~ N(${MC.opt.gl},0.05); κ=${MC.opt.kappa}; X₂₀₃₅ = σ(logit X₀ + 9·g + τ·ε)</div>`;
  $$("#mcInd .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}
}


// ---------- sensitivity analysis ----------
let SENS=null,SENSREG=null,sensBusy=false;
const SENS_P=[["ga",.05,"g_A"],["gi",.05,"g_I"],["gl",.03,"g_L"],["tau",.15,"τ"],["thA",.05,"θA"],["thL",.05,"θL"],["thI",.05,"θI"]];
function computeSens(region,done){if(sensBusy)return;sensBusy=true;const base=Object.assign({},DEFAULTS,{region,iters:7000,burn:2000});
 const jobs=[["base",0]];SENS_P.forEach(([k,d])=>{jobs.push([k,-d]);jobs.push([k,d]);});const out={};let i=0;
 (function step(){if(i>=jobs.length){sensBusy=false;SENS=out;SENSREG=region;done&&done();return;}
  const [k,d]=jobs[i++];const o=Object.assign({},base);if(k!=="base")o[k]=+(o[k]+d).toFixed(3);out[k+"|"+d]={v:o[k],m:runMCMC(o).mean};setTimeout(step,0);})();}
function drawSens(){const el=$("#sensW");if(!el)return;const reg=(MC&&MC.region)||"global";
 if(!SENS||SENSREG!==reg){el.innerHTML=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensRun"))}</div>`;if(MCG)computeSens(reg,()=>drawSens());return;}
 const b=SENS["base|0"].m;let mx=0;const rows=[];SENS_P.forEach(([k,d,sym])=>[-d,d].forEach(dd=>{const r=SENS[k+"|"+dd];const del=r.m.map((x,j)=>(x-b[j])*100);del.forEach(x=>mx=Math.max(mx,Math.abs(x)));rows.push({k,sym,v:r.v,dd,del});}));
 const cell=x=>{const a=Math.round(Math.min(1,Math.abs(x)/mx)*70);return `<td class="cell" style="background:color-mix(in srgb,var(${x>=0?"--pos":"--neg"}) ${a}%,var(--surface));color:${a>45?"#fff":"var(--text)"}" data-tip="${x>=0?"+":""}${x.toFixed(1)} pp">${x>=0?"+":""}${x.toFixed(1)}</td>`;};
 let h=`<figcaption>${esc(T("sensT"))}</figcaption><div class="fsub">${esc(T("sensS"))} · ${esc(X(REGIONS[reg]))}</div><div class="tblwrap"><table class="t hm"><thead><tr><th>${esc(T("sensP"))}</th>${SCEN.map(s=>`<th style="text-align:center">Δ${s.key}</th>`).join("")}</tr></thead><tbody>`;
 rows.forEach(r=>{h+=`<tr><td>${r.sym} ${r.dd<0?"−":"+"}${Math.abs(r.dd)} <span style="font-weight:400;color:var(--muted)">(= ${r.v})</span></td>${r.del.map(cell).join("")}</tr>`;});
 el.innerHTML=h+`</tbody></table></div>`;}

// ---------- persona panel ----------
function pools(){const n=PERSONAS.length;const lin=[0,1,2,3].map(k=>PERSONAS.reduce((s,p)=>s+p.p[k],0)/n);
 let lg=[0,1,2,3].map(k=>Math.exp(PERSONAS.reduce((s,p)=>s+Math.log(p.p[k]),0)/n));const z=lg.reduce((a,b)=>a+b);lg=lg.map(x=>x/z);
 const kl=(p,q)=>p.reduce((s,x,i)=>s+(x>0?x*Math.log(x/q[i]):0),0);const js=PERSONAS.reduce((s,p)=>{const m=p.p.map((x,i)=>(x+lin[i])/2);return s+.5*kl(p.p,m)+.5*kl(lin,m);},0)/n;
 const mc=MCG?MCG.mean:[.25,.25,.25,.25];const bl=mc.map((x,i)=>(x+lin[i])/2);return{lin,lg,js,mc,bl};}
function drawPanel(){const el=$("#panelW");const sc=["--s1","--s2","--s3","--s4"];const L=st.lang;const PL=p=>p[L]||p.en;
 let h=`<div class="wrow"><div class="panelc"><h5>${T("pHeat")}</h5><div class="tblwrap"><table class="t hm"><thead><tr><th>${T("persona")}</th>${SCEN.map(s=>`<th style="text-align:center">${s.key}</th>`).join("")}</tr></thead><tbody>`;
 PERSONAS.forEach((p,i)=>{h+=`<tr data-p="${i}" class="${i===selP?"sel":""}"><td class="pn">${esc(PL(p).n)}<div style="font-weight:400;font-size:11px;color:var(--muted)">${esc(PL(p).r)}</div></td>`+p.p.map((v,k)=>`<td class="cell" style="background:color-mix(in srgb,var(${sc[k]}) ${Math.round(v*100*1.3)}%,var(--surface));color:${v>.4?"#fff":"var(--text)"}" data-tip="${esc(PL(p).n)} · ${SCEN[k].key}: <b>${pct(v)}</b>">${pct(v)}</td>`).join("")+`</tr>`;});
 h+=`</tbody></table></div></div><div class="panelc"><h5>${T("pAgg")}</h5><div id="pAgg"></div><div class="persona-detail" id="pDet"></div></div></div>`;
 el.innerHTML=h;$$("#panelW tr[data-p]").forEach(tr=>tr.onclick=()=>{selP=+tr.dataset.p;drawPanel();});paintAgg();paintPDet();}
function paintAgg(){const P=pools();const sc=["--s1","--s2","--s3","--s4"];const rows=[[T("mc"),P.mc],[T("lin"),P.lin],[T("logp"),P.lg],[T("blend"),P.bl]];
 const W=440,rh=34,l=150,H=rows.length*rh+6;let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
 rows.forEach(([n,v],i)=>{let x=l;const y=4+i*rh;s+=`<text class="tl" x="${l-8}" y="${y+17}" text-anchor="end">${esc(n)}</text>`;v.forEach((m,k)=>{const w=(W-l-4)*m;s+=`<rect x="${x}" y="${y}" width="${Math.max(0,w-2)}" height="24" rx="4" fill="var(${sc[k]})" data-tip="${esc(n)} · ${SCEN[k].key}: <b>${pct(m)}</b>"/>`;if(w>34)s+=`<text x="${x+5}" y="${y+16}" font-size="11" font-weight="700" fill="#fff">${pct(m)}</text>`;x+=w;});});
 $("#pAgg").innerHTML=leg(SCEN.map((s,k)=>[`var(${sc[k]})`,s.key+" "+T("sc")[s.key]]))+s+`</svg><div class="diag" style="margin-top:4px"><span>${T("dis")} <b>${P.js.toFixed(3)}</b></span></div>`;}
function paintPDet(){const p=PERSONAS[selP],d=p[st.lang]||p.en;$("#pDet").innerHTML=`<b>${esc(d.n)}</b> <span class="rl">· ${esc(d.r)}</span>
 <div class="pgrid"><div><b>${T("pLens")}</b>${esc(d.lens)}</div><div><b>${T("pSig")}</b>${esc(d.sig)}</div><div style="grid-column:1/-1"><b>${T("pView")}</b>${esc(d.v)}</div><div style="grid-column:1/-1"><b>${T("pMove")}</b>${esc(d.mv)}</div></div>
 <div style="margin-top:6px;font-size:12px"><span class="g D" style="vertical-align:0">D</span> ${refB(p.refs)}</div>`;
 $$("#pDet .r").forEach(b=>{b.onmouseenter=()=>showTip(b);b.onmouseleave=hideTip;b.onclick=()=>openEvidence(+b.dataset.ev,null);});}

// ---------- chrome / events ----------
function updateTocActive(){const secs=$$("section.sec");let cur=null;const y=window.scrollY+120;secs.forEach(s=>{if(s.offsetTop<=y)cur=s.id.slice(4);});
 $$("#toc a").forEach(a=>a.classList.toggle("on",a.dataset.sec===cur));
 const h=document.documentElement.scrollHeight-window.innerHeight;$("#prog").style.width=(h>0?window.scrollY/h*100:0)+"%";}
window.addEventListener("scroll",()=>{requestAnimationFrame(updateTocActive);hideTip();},{passive:true});

$("#langSeg").innerHTML=LANGS.map(l=>`<button data-l="${l}" title="${esc(I18N[l].langName)}">${l==="zh"?"中文":l.toUpperCase()}</button>`).join("");
$$("#langSeg button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.l;LS.set("rp_lang_manual",st.lang);keepPos(render);});

$("#bTheme").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";LS.set("rp_theme",st.theme);document.documentElement.dataset.theme=st.theme;$("#bTheme").textContent=st.theme==="dark"?"☀︎":"☾";};
$("#bPrint").onclick=()=>{if(st.mode!=="detail"){st.mode="detail";render();}setTimeout(()=>window.print(),200);};
$("#tocbtn").onclick=()=>$("#toc").classList.toggle("mob");
$("#toc").addEventListener("click",e=>{if(e.target.closest("a"))$("#toc").classList.remove("mob");});
$("#dClose").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
// boot: run global default MCMC (fixed seed) so numbers in text are reproducible
render();
if(autoLang)setTimeout(()=>toast(T("langAuto")+" · "+I18N[st.lang].langName),600);
setTimeout(()=>{const t0=performance.now();MCG=runMCMC({region:"global"});MCG.ms=performance.now()-t0;MC=MCG;
 ALLREG={};Object.keys(REGIONS).forEach(r=>{ALLREG[r]=r==="global"?MCG:runMCMC({region:r});});render();},30);
})();
