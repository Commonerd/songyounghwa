<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 시대 세계 대학과 사교육의 현재와 미래 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}
</style>
</head>
<body>
<div class="topbar"><button class="iconbtn" id="tocbtn">목차</button><div class="brand" id="brand"></div>
<div class="seg" id="langSeg"></div>
<div class="seg"><button id="bDetail">상세판</button><button id="bConcise">간결판</button></div>
<button class="iconbtn" id="bG" aria-pressed="false">등급</button><button class="iconbtn" id="bTheme">☾</button><button class="iconbtn" id="bPrint">PDF</button>
<div class="progress" id="prog"></div></div>
<div class="wrap"><nav class="toc" id="toc"></nav><main id="main"></main></div>

const EVIDENCE = [
{id:1,grade:"B",type:"survey",year:2025,src:"HEPI / Kortext, Policy Note 61",title:"Student Generative AI Survey 2025",url:"https://www.hepi.ac.uk/reports/student-generative-ai-survey-2025/",
quote:"almost all students (92%) now using AI in some form",
ko:{crit:"영국 전일제 학부생 1,041명, 성별·기관유형 가중, 오차 ±3%로 방법이 공개된 조사다. 다만 '사용'은 자기보고이며 사용 강도·목적의 질을 구분하지 못하고, 영국 외 일반화에는 한계가 있다.",judg:"고소득국 대학에서 생성형 AI 사용은 이미 '보편'에 도달했다고 판단한다. 남학생·STEM·고소득층 편중이 함께 보고되어 격차 확대 신호로 읽는다."},
ja:{crit:"英国のフルタイム学部生1,041人、性別・機関種別で加重、誤差±3%と方法が開示された調査である。ただし「利用」は自己申告で、利用の強度や目的の質は区別できず、英国外への一般化には限界がある。",judg:"高所得国の大学では生成AIの利用はすでに「普遍化」したと判断する。男子・STEM・高所得層への偏りも報告されており、格差拡大のシグナルと読む。"}},
{id:2,grade:"B",type:"survey",year:2026,src:"HEPI Report 199",title:"Student Generative AI Survey 2026",url:"https://www.hepi.ac.uk/reports/student-generative-ai-survey-2026/",
quote:"only 36% feel encouraged by their institution to do so",
ko:{crit:"2025년 12월 Savanta 실시, n=1,054로 3년 연속 동일 설계라 추세 비교가 가능하다. 스폰서(Kortext)가 디지털 교재 기업이라는 이해관계는 있으나 결과 방향(기관 대응 미흡)은 스폰서 이익과 무관하다.",judg:"학생 사용률 95%와 기관의 장려·도구 제공 36~38% 사이의 간극이 현 국면의 핵심 구조라고 판단한다. 이 간극이 '제도 적응력' 축의 현재값을 낮게 잡는 주된 근거다."},
ja:{crit:"2025年12月にSavantaが実施、n=1,054で3年連続同一設計のため推移比較が可能。スポンサー（Kortext）はデジタル教材企業だが、結果の方向（機関対応の遅れ）はスポンサーの利益とは無関係である。",judg:"学生の利用率95%と、機関による奨励・ツール提供36〜38%との乖離が現局面の中核構造だと判断する。この乖離が「制度適応力」軸の現在値を低く置く主な根拠である。"}},
{id:3,grade:"B",type:"survey",year:2025,src:"한국직업능력연구원 조사 (뉴시스 보도)",title:"대학생 생성형 AI 활용 실태 (n=726)",url:"https://www.newsis.com/view/NISX20251110_0003396288",
quote:"응답자의 91.7%가 과제·프로젝트 등을 위한 자료검색에 AI를 활용한 경험이 있다고",
ko:{crit:"국책연구기관 조사이나 모집단이 '생성형 AI 사용 경험자'로 한정되어 전체 대학생 사용률로 읽으면 과대추정이 된다. 원보고서가 아닌 언론 인용을 통한 2차 확인이다.",judg:"한국 대학에서도 AI가 학습 과정의 기본 도구가 되었다는 방향성은 신뢰하되, 수치는 '사용자 중 활용 비율'로 제한해 해석한다."},
ja:{crit:"国策研究機関の調査だが、母集団が「生成AI利用経験者」に限定されており、大学生全体の利用率と読むと過大推計になる。原報告ではなく報道引用による二次確認である。",judg:"韓国の大学でもAIが学習過程の基本ツールになったという方向性は信頼するが、数値は「利用者の中での活用率」に限定して解釈する。"}},
{id:4,grade:"B",type:"io",year:2026,src:"OECD (UNESCO 2025 조사 인용) / Media & Learning",title:"Policies supporting responsible and systematic GenAI adoption in higher education",url:"https://media-and-learning.eu/subject/artificial-intelligence/oecd-urges-systematic-policies-as-genai-use-in-universities-becomes-near-universal/",
quote:"only 19% of higher education institutions worldwide had a formal AI policy",
ko:{crit:"UNESCO 조사는 UNESCO 체어·UNITWIN 네트워크 기관 중심의 편의표본이라 대표성이 약하다. 같은 조사에서 '정책 보유 또는 개발 중'은 약 3분의 2로, 프레이밍에 따라 인상이 크게 달라진다.",judg:"공식 정책 보유율 19%, 개발 중 42%로 보아 '제도화는 진행 중이나 미완'으로 판단한다. 정책 존재가 실행 품질을 보장하지 않는다는 점도 감안해 낮은 값을 유지한다."},
ja:{crit:"UNESCO調査はUNESCOチェア・UNITWIN網の機関中心の便宜標本で代表性は弱い。同調査で「方針あり又は策定中」は約3分の2であり、フレーミング次第で印象が大きく変わる。",judg:"正式方針保有19%、策定中42%から「制度化は進行中だが未完」と判断する。方針の存在が実行の質を保証しない点も考慮し、低い値を維持する。"}},
{id:5,grade:"B",type:"io",year:2026,src:"OECD",title:"OECD Digital Education Outlook 2026",url:"https://www.oecd.org/en/publications/2026/01/oecd-digital-education-outlook-2026_940e0dd8.html",
quote:"Successfully performing a task with GenAI does not automatically lead to learning",
ko:{crit:"1차 연구가 아닌 문헌 종합이며, 인용 연구 다수가 단기·소규모다. 다만 국제기구 종합으로서 상반된 증거(성과↑·학습 정체)를 균형 있게 정리했고 TALIS 2024(교사 37% AI 사용) 같은 대표표본 수치를 함께 제시한다.",judg:"'성과(performance)와 학습(learning)의 분리'를 본 리포트 전체의 분석 축으로 채택한다. 교육용으로 설계된 AI와 범용 챗봇을 구분해 평가해야 한다고 판단한다."},
ja:{crit:"一次研究ではなく文献統合であり、引用研究の多くは短期・小規模。ただし国際機関の統合として相反する証拠（成果↑・学習停滞）をバランスよく整理し、TALIS 2024（教員37%がAI利用）などの代表標本の数値も示している。",judg:"「成果（performance）と学習（learning）の分離」を本レポート全体の分析軸に採用する。教育用に設計されたAIと汎用チャットボットは区別して評価すべきだと判断する。"}},
{id:6,grade:"A",type:"q1",year:2025,src:"Kestin et al., Scientific Reports 15:17458 (Q1)",title:"AI tutoring outperforms in-class active learning: an RCT",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12179260/",
quote:"students learn significantly more in less time when using the AI tutor",
ko:{crit:"교차설계 RCT로 내적타당도는 높지만, 하버드 물리학 입문 강좌·2주·단일 주제로 외적타당도가 제한된다. 비교 대상이 '잘 설계된 능동학습'이라는 점은 강점이나, 사후검사가 단기 근접 측정이라 장기 파지는 미확인이다.",judg:"학습과학 원리로 설계된 AI 튜터는 최소한 '고품질 수업과 동등 이상'의 효과를 낼 수 있다고 판단한다. 이는 강의 전달 중심 기관의 대체 가능성을 높이는 핵심 근거다."},
ja:{crit:"交差デザインのRCTで内的妥当性は高いが、ハーバードの物理入門・2週間・単一トピックで外的妥当性は限定的。比較対象が「よく設計されたアクティブラーニング」である点は強みだが、事後テストは短期の近接測定で長期保持は未確認。",judg:"学習科学に基づき設計されたAIチューターは少なくとも「質の高い授業と同等以上」の効果を出し得ると判断する。講義伝達中心の機関の代替可能性を高める中核的根拠である。"}},
{id:7,grade:"A",type:"q1",year:2025,src:"Wang & Fan, Humanities & Social Sciences Communications 12 (Q1)",title:"The effect of ChatGPT on students' learning performance… a meta-analysis",url:"https://doi.org/10.1057/s41599-025-04787-y",
quote:"ChatGPT has a large positive impact on improving learning performance (g = 0.867)",
ko:{crit:"2022.11~2025.2의 51편을 통합했으나 포함 연구 다수가 소표본·준실험이며 이질성이 크다(과목·기간 조절효과 유의). 0.867은 교육개입으로서 이례적으로 커서 출판편향과 '매체 비교' 교란을 의심해야 한다(근거 9).",judg:"효과의 '방향'은 긍정이라고 보되, 크기는 상한값으로 취급한다. 시뮬레이션에서는 이 근거의 표준편차를 넓게 잡아 과신을 방지했다."},
ja:{crit:"2022.11〜2025.2の51本を統合したが、多くが小標本・準実験で異質性が大きい（科目・期間の調整効果が有意）。0.867は教育介入として異例に大きく、出版バイアスや「メディア比較」の交絡を疑うべきである（根拠9）。",judg:"効果の「方向」は肯定的と見るが、大きさは上限値として扱う。シミュレーションではこの根拠の標準偏差を広く取り、過信を防いだ。"}},
{id:8,grade:"A",type:"q1",year:2025,src:"Deng et al., Computers & Education 227:105224 (Q1)",title:"Does ChatGPT enhance student learning? A systematic review and meta-analysis",url:"https://doi.org/10.1016/j.compedu.2024.105224",
quote:"identified 69 articles published between 2022 and 2024 for analysis",
ko:{crit:"실험연구만 선별해 상관연구보다 낫지만, 대학·언어학습 편중이 크다. 학업성취·정서적 동기는 향상되었으나 자기효능감 변화는 없었다는 결과는 '외부 도움으로 성과가 오를 뿐 자기 역량감은 그대로'라는 해석과 일치한다.",judg:"독립된 두 메타분석(근거 7·8)이 같은 방향을 보이므로 단기 성취 향상은 견고하다고 판단한다. 다만 자기효능감 무변화는 의존 위험(근거 10·11)과 연결되는 경고 신호로 본다."},
ja:{crit:"実験研究のみを選別しており相関研究より優れるが、大学・語学学習への偏りが大きい。学業成績・情意的動機は向上したが自己効力感は変化しなかったという結果は、「外部の助けで成果は上がるが自己の有能感は変わらない」という解釈と整合する。",judg:"独立した二つのメタ分析（根拠7・8）が同方向を示すため、短期の成績向上は頑健と判断する。ただし自己効力感の不変は依存リスク（根拠10・11）につながる警告と見る。"}},
{id:9,grade:"A",type:"q1",year:2026,src:"Lawson, Martella, Weidlich, Mulders & Buchner, Computers & Education (Q1, in press)",title:"Color Me Confounded: A Critical Analysis of Media Comparisons on ChatGPT in Education",url:"https://learninglab.uni-due.de/sites/default/files/1-s2.0-S0360131526001405-main.pdf",
quote:"Color Me Confounded: A Critical Analysis of Media Comparisons on ChatGPT in Education",
ko:{crit:"근거 7·8의 포함 연구를 재검토한 방법론 비판으로, 'ChatGPT 대 무처치' 비교는 매체가 아니라 교수설계·시간·피드백 차이를 측정했을 수 있다고 본다. 게재 확정 전(journal pre-proof) 판본이라는 점은 유의해야 한다.",judg:"메타분석의 큰 효과크기를 '매체 효과'로 해석하는 것을 기각한다. 효과의 원천은 AI 자체보다 설계라는 본 리포트의 판단을 강화한다."},
ja:{crit:"根拠7・8の採録研究を再検討した方法論批判で、「ChatGPT対無処置」比較はメディアではなく授業設計・時間・フィードバックの差を測っていた可能性を指摘する。掲載確定前（journal pre-proof）版である点に留意が必要。",judg:"メタ分析の大きな効果量を「メディア効果」と解釈することを退ける。効果の源泉はAIそのものより設計であるという本レポートの判断を補強する。"}},
{id:10,grade:"A",type:"q1",year:2025,src:"Bastani et al., PNAS 122(26):e2422633122 (Q1)",title:"Generative AI without guardrails can harm learning: Evidence from high school mathematics",url:"https://doi.org/10.1073/pnas.2422633122",
quote:"Without guardrails, students attempt to use GPT-4 as a crutch",
ko:{crit:"터키 고교생 약 1,000명 대상 현장 RCT로 생태학적 타당도가 높다. 단일 국가·수학 과목이며, 'GPT Base' 집단의 도구 회수 후 시험 17% 하락은 단기 효과라 장기 누적 효과는 미지수다.",judg:"무가드레일 AI는 '연습 성과↑·독립 수행↓'이라는 역설을 만든다는 가장 강한 인과 근거로 채택한다. 가드레일(GPT Tutor)로 해악이 대부분 상쇄된다는 결과는 '설계가 변수'라는 핵심 판단의 근거다."},
ja:{crit:"トルコの高校生約1,000人を対象とした現場RCTで生態学的妥当性が高い。単一国・数学のみで、「GPT Base」群のツール回収後テスト17%低下は短期効果であり、長期の累積効果は未知である。",judg:"ガードレールなしのAIは「練習成果↑・独力遂行↓」という逆説を生むという最も強い因果的根拠として採用する。ガードレール（GPT Tutor）で害がほぼ相殺された結果は「設計が変数」という中核判断の根拠である。"}},
{id:11,grade:"A",type:"q1",year:2025,src:"Fan et al., British Journal of Educational Technology 56(2):489–530 (Q1)",title:"Beware of metacognitive laziness",url:"https://arxiv.org/abs/2412.09315",
quote:"AI technologies such as ChatGPT may promote learners' dependence on technology",
ko:{crit:"대학생 117명, 4개 조건 무선배정 실험실 연구로 학습과정 로그(SRL 과정)를 분석한 점이 강점이다. 표본이 작고 비모국어(영어) 작문 과제 하나라 일반화에는 신중해야 한다.",judg:"에세이 점수는 올랐지만 지식 획득·전이는 차이가 없었다는 결과를 근거 10과 '수렴하는 독립 증거'로 본다. 메타인지 위임은 장기 역량 형성의 위험 요인이라고 판단한다."},
ja:{crit:"大学生117人、4条件の無作為割付実験で、学習過程ログ（SRLプロセス）を分析した点が強み。標本が小さく、非母語（英語）作文課題一つのため一般化には慎重であるべき。",judg:"エッセイ得点は上がったが知識獲得・転移に差がなかった結果を、根拠10と「収束する独立証拠」と見る。メタ認知の委任は長期的能力形成のリスク要因と判断する。"}},
{id:12,grade:"B",type:"io",year:2024,src:"WICHE, Knocking at the College Door (11th ed.)",title:"Projections of High School Graduates",url:"https://wiche.edu/wp-content/uploads/2024/12/Executive-Summary-Knocking-at-the-College-Door-final.pdf",
quote:"expected to peak in 2025 and then decline steadily through 2041",
ko:{crit:"출생아 수·학년별 재적 데이터 기반 추계로 1979년부터 축적된 신뢰도 높은 시계열이다. 이민·졸업률 변화에 따른 오차가 있으나 18년 전 출생 코호트에 기초해 단기 오차는 작다.",judg:"미국 대학 수요는 2025년 정점 후 약 13% 감소가 사실상 '확정된 미래'라고 판단한다. 남부를 제외한 지역 대학의 압력이 크다."},
ja:{crit:"出生数・学年別在籍データに基づく推計で、1979年から蓄積された信頼性の高い時系列。移民・卒業率の変化による誤差はあるが、18年前の出生コホートに基づくため短期誤差は小さい。",judg:"米国の大学需要は2025年をピークに約13%減少することが事実上「確定した未来」と判断する。南部以外の地域の大学への圧力が大きい。"}},
{id:13,grade:"B",type:"io",year:2025,src:"中央教育審議会 答申「知の総和」(文部科学省 解説, Recruit College Management 244)",title:"我が国の「知の総和」向上の未来像",url:"https://souken.shingakunet.com/publication/college_m/2025_RCM244/2025_RCM244_010.pdf",
quote:"2040年には約46万人となり、現在の定員規模の約73％へと大幅に減少すると予測される",
ko:{crit:"정부 심의회 공식 추계(출생 저위 가정)로 신뢰도가 높다. 진학률 상승 가정에 따라 46만~51만으로 범위가 있으며, 유학생 증가 시나리오도 별도 존재한다.",judg:"일본 대학 정원의 약 4분의 1이 2040년까지 구조적 과잉이 된다고 판단한다. AI 이전에 이미 대규모 재편이 불가피하다."},
ja:{crit:"政府審議会の公式推計（出生低位仮定）で信頼性は高い。進学率上昇の仮定により46万〜51万の幅があり、留学生増加シナリオも別途存在する。",judg:"日本の大学定員の約4分の1が2040年までに構造的過剰になると判断する。AI以前に大規模再編は不可避である。"}},
{id:14,grade:"B",type:"io",year:2026,src:"濱中義隆(国立教育政策研究所), 私学高等教育研究所 第88回公開研究会 資料",title:"財政審「私立大学250校削減案」の検討",url:"https://www.shidaikyo.or.jp/riihe/kenkyukai/pdf/88th_no3.pdf",
quote:"「私立大学 250 校削減案」は大学関係者に衝撃を与えた",
ko:{crit:"재정심 원자료가 아닌 국립교육정책연구소 연구자의 분석 자료를 통한 확인이며, 저자 스스로 14만 명 정원 감축이 어떻게 252교 감축으로 연결되는지 불명확하다고 지적한다.",judg:"수치의 정밀성보다 '재정 당국이 대학 수를 정책 목표로 삼기 시작했다'는 사실이 핵심이라고 판단한다. 일본은 시장 퇴출보다 정책 주도 재편의 경로를 밟는다."},
ja:{crit:"財政審の原資料ではなく国立教育政策研究所の研究者による分析資料での確認であり、著者自身が14万人の定員削減がどう252校減につながるのか不明だと指摘している。",judg:"数値の精度より「財政当局が大学数を政策目標にし始めた」という事実が核心だと判断する。日本は市場退出より政策主導の再編経路をたどる。"}},
{id:15,grade:"B",type:"press",year:2025,src:"日本私立学校振興・共済事業団 2025年度調査 (秋田魁新報・共同通信 報道)",title:"定員割れ私大、53%に改善",url:"https://www.sakigake.jp/news/article/20250808CO0158/",
quote:"今春の入学者が定員割れした四年制の私立大は53・2%に当たる316校",
ko:{crit:"사학사업단의 전수에 가까운 조사(594교)를 통신사가 보도한 것으로 수치 신뢰도는 높다. 2025년 개선은 18세 인구 일시 증가 효과라 추세 반전으로 볼 수 없다.",judg:"과반의 사립대가 정원 미달인 상태에서 지원자는 상위 대학으로 집중되고 있어 '양극화'는 이미 현재 진행형이라고 판단한다."},
ja:{crit:"私学事業団のほぼ悉皆に近い調査（594校）を通信社が報じたもので数値の信頼性は高い。2025年の改善は18歳人口の一時的増加によるもので、趨勢の反転とは見なせない。",judg:"過半の私立大学が定員割れの一方で志願者は上位大学に集中しており、「二極化」はすでに進行中だと判断する。"}},
{id:16,grade:"B",type:"io",year:2026,src:"内閣府 経済財政諮問会議 関連資料 (2026.4.23)",title:"国立大学の定員見直し・私立大学の再編統合",url:"https://www5.cao.go.jp/keizai-shimon/kaigi/special/reform/wg7/2026/0423shiryou3.pdf",
quote:"国立大学の定員見直しや私立大学の再編・統合などに向けた取組を、来春以降進める",
ko:{crit:"정부 1차 자료로 정책 의지를 직접 보여준다. 다만 '추진하겠다'는 계획 수준이며 구체적 수단·규모는 골태방침에서 확정될 예정이라 실행 강도는 불확실하다.",judg:"일본의 대학 구조조정은 2027년 이후 정책 단계로 진입할 가능성이 높다고 판단한다. 이는 제도 적응력(I)을 '하향식'으로 높이는 요인이다."},
ja:{crit:"政府の一次資料で政策意思を直接示す。ただし「進める」という計画段階で、具体的手段・規模は骨太方針で確定予定のため実行強度は不確実。",judg:"日本の大学再編は2027年以降に政策段階へ移行する可能性が高いと判断する。これは制度適応力（I）を「トップダウン」で高める要因である。"}},
{id:17,grade:"B",type:"io",year:2024,src:"KDI 「지역대학의 구조적 전환과 발전방안」 (한국경제 보도)",title:"2040년 대학 입학가능인원 전망",url:"https://www.hankyung.com/amp/202410171460i",
quote:"대학 입학 가능 인원은 2030년 44만2000명에서 2040년 22만7000명으로",
ko:{crit:"국책연구원 추계를 언론이 보도한 것으로, 출생아 수와 평균 수능 응시율 가정에 의존한다. 통계청 장래추계(18세 인구 2040년 약 26만)와 방향은 일치하나 수준 차이가 있다.",judg:"한국은 10년 만에 입학자원이 거의 반감하는 OECD 최악 수준의 수요 절벽에 직면했다고 판단한다. 비수도권 사립대가 최대 피해 집단이다."},
ja:{crit:"国策研究院の推計を報道したもので、出生数と平均修能受験率の仮定に依存する。統計庁の将来推計（18歳人口2040年約26万）と方向は一致するが水準に差がある。",judg:"韓国は10年で入学資源がほぼ半減するOECD最悪水準の需要の崖に直面していると判断する。非首都圏の私立大学が最大の被害集団である。"}},
{id:18,grade:"B",type:"io",year:2025,src:"국회미래연구원 보고서 (매일신문 보도)",title:"학령인구 감소와 대학교육 위기",url:"https://www.imaeil.com/page/view/2025072209551748866",
quote:"2043년 39.4%에 불과할 것으로 예측됐다",
ko:{crit:"정원 고정·최근 평균 진학률(73.2%) 적용이라는 '무대응' 시나리오여서 최악의 경로에 가깝다. 정원 감축·유학생 유치 등 대응을 반영하면 수치는 달라진다.",judg:"현 정원 구조를 유지하면 2040년대에 대학 체제가 지속 불가능하다는 '경고값'으로 사용하며, 기본 전망치로 쓰지는 않는다."},
ja:{crit:"定員固定・直近平均進学率（73.2%）適用という「無対応」シナリオで最悪に近い経路である。定員削減や留学生誘致などの対応を反映すれば数値は変わる。",judg:"現行定員構造を維持すれば2040年代に大学体制は持続不可能という「警告値」として用い、基本見通しには使わない。"}},
{id:19,grade:"B",type:"survey",year:2025,src:"IIE Fall 2025 Snapshot (AAU 정리)",title:"Fall 2025 Snapshot on International Student Enrollment",url:"https://www.aau.edu/node/36674",
quote:"new international student enrollment declined by 17% in the fall semester of 2025",
ko:{crit:"825개 기관 응답의 스냅샷으로 전수가 아니며 Open Doors 2026에서 확정된다. 감소 원인은 비자 정책 등 지정학 요인으로, AI와 무관하다는 점이 오히려 분석상 중요하다.",judg:"국제학생 수입에 의존하던 대학의 재정 버퍼가 약해졌다고 판단한다. 인구 감소를 유학생으로 메우는 전략의 불확실성이 커졌다."},
ja:{crit:"825機関の回答によるスナップショットで悉皆ではなく、Open Doors 2026で確定する。減少要因はビザ政策など地政学的要因で、AIと無関係である点がむしろ分析上重要である。",judg:"留学生収入に依存してきた大学の財政的バッファが弱まったと判断する。人口減を留学生で補う戦略の不確実性が高まった。"}},
{id:20,grade:"B",type:"io",year:2025,src:"OECD, Education at a Glance 2025",title:"What are the earnings advantages to education?",url:"https://www.oecd.org/en/publications/education-at-a-glance-2025_1c0d9c79-en/full-report/what-are-the-earnings-advantages-to-education_7a7e64e0",
quote:"This earnings advantage rises to 39% for those with a bachelor's degree",
ko:{crit:"회원국 비교 가능한 공식 통계지만 횡단면 임금 격차이며 능력 선별(selection) 효과를 제거한 인과적 수익률이 아니다. 또한 AI 확산 이전 연도 데이터가 주로 반영된다.",judg:"학위 프리미엄은 AI 확산 초기인 현재까지 견고하다고 판단한다. 신호 가치 축(L)의 현재값을 높게 두는 근거다."},
ja:{crit:"加盟国比較可能な公式統計だが横断的な賃金格差であり、能力の選抜効果を除いた因果的収益率ではない。またAI普及以前の年度データが主に反映されている。",judg:"学位プレミアムはAI普及初期の現在まで頑健だと判断する。シグナル価値軸（L）の現在値を高く置く根拠である。"}},
{id:21,grade:"B",type:"stat",year:2026,src:"Federal Reserve Bank of New York",title:"The Labor Market for Recent College Graduates",url:"https://www.newyorkfed.org/research/college-labor-market",
quote:"fell to 5.2 percent, its lowest level in more than a year",
ko:{crit:"CPS 기반 공식 분석으로 신뢰도가 높다. 같은 갱신에서 불완전고용률은 42.5%로 상승해 실업률 하락만으로 개선을 단정할 수 없다. 원인(AI·경기·재택) 분해는 제공하지 않는다.",judg:"최근 대졸자의 '첫 일자리 질' 악화가 실재한다고 판단하되, AI 기여분은 미확정으로 둔다."},
ja:{crit:"CPSに基づく公式分析で信頼性は高い。同じ更新で不完全雇用率は42.5%に上昇しており、失業率低下だけで改善とは断定できない。要因（AI・景気・在宅）の分解は示されていない。",judg:"最近の大卒者の「初職の質」の悪化は実在すると判断するが、AIの寄与分は未確定とする。"}},
{id:22,grade:"B",type:"press",year:2026,src:"New York Fed 연구 (CBS News 보도)",title:"Remote work and young graduate unemployment",url:"https://www.cbsnews.com/news/remote-work-young-workers-unemployment/",
quote:"account for 64% of the jump in unemployment among young college graduates",
ko:{crit:"연준 연구를 언론이 요약한 2차 자료이며, 재택근무 효과 추정은 모형 의존적이다. 그러나 'AI 이전부터 상승이 시작됐다'는 시점 논거는 독립적으로 검증 가능하다.",judg:"신입 일자리 악화를 AI 탓으로만 돌리는 서사는 과장이라고 판단한다. AI는 향후 위험 요인이지만 현재까지의 주원인은 아니다."},
ja:{crit:"FRB研究を報道が要約した二次資料で、在宅勤務効果の推定はモデル依存的である。ただし「AI以前から上昇が始まっていた」という時点の論拠は独立に検証可能。",judg:"新卒雇用の悪化をAIだけのせいにする物語は誇張だと判断する。AIは今後のリスク要因だが、現時点までの主因ではない。"}},
{id:23,grade:"B",type:"io",year:2024,src:"Burning Glass Institute & Harvard Business School",title:"Skills-Based Hiring: The Long Road from Pronouncements to Practice",url:"https://pw.hks.harvard.edu/post/skills-based-hiring-the-long-road-from-pronouncements-to-practice",
quote:"not even 1 in 700 hires last year",
ko:{crit:"대기업 채용공고와 실제 채용 데이터를 결합한 분석으로 '선언 대 실행'을 구분한 점이 강점이다. 미국 대기업 중심이며 2023년 기준이라 AI 기반 역량검증 확산 이후는 반영되지 않았다.",judg:"학위 요건 철폐는 상징에 그치고 실제 채용 관행은 학위를 계속 신호로 쓴다고 판단한다. '탈학위' 시나리오의 진입 장벽이 높다는 핵심 근거다."},
ja:{crit:"大企業の求人と実際の採用データを結合し「宣言対実行」を区別した点が強み。米国大企業中心で2023年基準のため、AIによる能力検証の普及後は反映されていない。",judg:"学位要件の撤廃は象徴に留まり、実際の採用慣行は学位をシグナルとして使い続けていると判断する。「脱学位」シナリオへの参入障壁が高い中核的根拠である。"}},
{id:24,grade:"B",type:"survey",year:2025,src:"World Economic Forum",title:"The Future of Jobs Report 2025",url:"https://weforum.org/publications/the-future-of-jobs-report-2025/digest/",
quote:"two-fifths (39%) of their existing skill sets will be transformed or become outdated",
ko:{crit:"1,000여 대기업 고용주의 '기대'를 묻는 설문으로 실측이 아니다. 2020년 57%, 2023년 44%에서 39%로 하락해 예측 자체가 변동적이며 고용주의 낙관·비관 편향이 섞인다.",judg:"역량 재편 압력은 크지만 '전면 대체'가 아니라 '부분 재구성'에 가깝다고 판단한다. 대학 교육과정 개편 수요의 근거로만 사용한다."},
ja:{crit:"1,000社超の大企業雇用主の「期待」を問う調査で実測ではない。2020年57%、2023年44%から39%へ低下しており予測自体が変動的で、雇用主の楽観・悲観バイアスが混在する。",judg:"スキル再編圧力は大きいが「全面代替」ではなく「部分的再構成」に近いと判断する。大学カリキュラム改編需要の根拠としてのみ用いる。"}},
{id:25,grade:"A",type:"q1",year:2024,src:"Eloundou, Manning, Mishkin & Rock, Science 384 (Q1) — 인용문은 arXiv 판본 초록",title:"GPTs are GPTs: Labor market impact potential of LLMs",url:"https://arxiv.org/abs/2303.10130",
quote:"at least 10% of their work tasks affected by the introduction of LLMs",
ko:{crit:"'노출도(exposure)' 추정으로 실제 대체·고용 효과가 아니다. 저자 다수가 OpenAI 소속이고 GPT-4를 분류기로 사용한 점은 이해상충·순환성 우려가 있다.",judg:"AI 영향이 고학력·고소득 직무에 넓게 걸친다는 점을 수용하되, 고용 감소 예측으로 읽지 않는다. 대졸 직무가 가장 노출된다는 점이 대학의 가치제안 재정의를 요구한다."},
ja:{crit:"「曝露度」の推計で、実際の代替・雇用効果ではない。著者の多くがOpenAI所属で、GPT-4を分類器に使った点は利益相反・循環性の懸念がある。",judg:"AIの影響が高学歴・高所得の職務に広く及ぶ点は受け入れるが、雇用減少の予測としては読まない。大卒職務が最も曝露されることが、大学の価値提案の再定義を迫る。"}},
{id:26,grade:"A",type:"q1",year:2023,src:"Noy & Zhang, Science 381(6654):187–192 (Q1)",title:"Experimental evidence on the productivity effects of generative AI",url:"https://cir.nii.ac.jp/crid/1360021395964348928",
quote:"The average time taken decreased by 40% and output quality rose by 18%.",
ko:{crit:"사전등록 온라인 실험(n=453)으로 인과 추론은 견고하다. 다만 20~30분짜리 표준화 글쓰기 과제로 사실 정확성·맥락 요구가 낮아 실제 업무 효과는 더 작을 수 있다.",judg:"AI는 대졸 화이트칼라의 정형 글쓰기 업무를 크게 압축한다고 판단한다. 이 업무가 신입에게 맡겨지던 훈련 과제라는 점이 '경력 사다리' 위험의 근거다."},
ja:{crit:"事前登録オンライン実験（n=453）で因果推論は堅牢。ただし20〜30分の標準化された作文課題で事実の正確性や文脈の要求が低く、実業務での効果はより小さい可能性がある。",judg:"AIは大卒ホワイトカラーの定型的な文章業務を大きく圧縮すると判断する。これらの業務が新人の訓練課題であった点が「キャリアの梯子」リスクの根拠である。"}},
{id:27,grade:"A",type:"q1",year:2025,src:"Brynjolfsson, Li & Raymond, Quarterly Journal of Economics (Q1) — 인용문은 NBER WP 31161 초록",title:"Generative AI at Work",url:"https://www.nber.org/papers/w31161",
quote:"including a 34% improvement for novice and low-skilled workers",
ko:{crit:"고객지원 상담원 5,179명의 단계적 도입 자료로 외적타당도가 높은 현장 증거다. 단일 기업·단일 직무이며, 학술지 게재본과 WP 판본의 수치가 일부 다를 수 있어 WP 기준임을 명시한다.",judg:"AI는 숙련자의 암묵지를 신입에게 전파해 경험 곡선을 압축한다고 판단한다. 이는 교육 측면에서는 'AI가 도제식 훈련의 일부를 대체'한다는 의미다."},
ja:{crit:"カスタマーサポート担当5,179人の段階的導入データによる外的妥当性の高い現場証拠。単一企業・単一職務であり、掲載版とWP版の数値が一部異なり得るためWP基準と明記する。",judg:"AIは熟練者の暗黙知を新人に伝播させ、経験曲線を圧縮すると判断する。教育面では「AIが徒弟的訓練の一部を代替する」ことを意味する。"}},
{id:28,grade:"A",type:"q1",year:2025,src:"Acemoglu, Economic Policy 40(121):13–58 (Q1)",title:"The simple macroeconomics of AI",url:"https://economics.mit.edu/sites/default/files/2024-05/The%20Simple%20Macroeconomics%20of%20AI.pdf",
quote:"these macroeconomic effects appear nontrivial but modest",
ko:{crit:"과업 기반 모형과 기존 노출도·비용절감 추정치에 의존하며, 새로운 과업 창출과 자동화 심화 경로를 과소평가했다는 비판이 있다. 그럼에도 과대 서사에 대한 중요한 보수적 기준점이다.",judg:"향후 10년 TFP 증가 0.66% 이하라는 추정을 '느린 확산' 시나리오의 근거로 반영한다. 기술 압력 축(A)의 상한을 제약하는 반대 증거로 사용했다."},
ja:{crit:"タスクベースモデルと既存の曝露度・コスト削減推計に依存し、新タスク創出や自動化深化の経路を過小評価しているとの批判がある。それでも過大な物語に対する重要な保守的基準点である。",judg:"今後10年のTFP増加0.66%以下という推計を「緩やかな普及」シナリオの根拠に反映する。技術圧力軸（A）の上限を制約する反証として用いた。"}},
{id:29,grade:"A",type:"stat",year:2026,src:"교육부·국가데이터처, 2025년 초중고 사교육비조사 (e-나라지표)",title:"2025년 초중고 사교육비조사 결과",url:"https://www.index.go.kr/unify/idx-info.do?idxCd=2697",
quote:"2025년 초중고 사교육비 총액은 약 27.5조원, 사교육 참여율은 75.7%",
ko:{crit:"전국 약 3,000개교 7.4만 명 대상 국가승인통계로 신뢰도가 가장 높다. 다만 EBS·방과후·온라인 무료 AI 도구 등 비용이 들지 않는 사교육 대체재는 포착하지 못한다.",judg:"2025년 총액 감소(-5.7%)는 실재하며, 학생 수 감소(-2.3%)보다 커서 행태 변화가 섞였다고 판단한다. 다만 AI 대체 효과로 단정할 근거는 없다."},
ja:{crit:"全国約3,000校7.4万人を対象とした国家承認統計で信頼性は最も高い。ただしEBS・放課後学校・無料のオンラインAIツールなど費用のかからない代替は捕捉できない。",judg:"2025年の総額減少（-5.7%）は実在し、児童生徒数の減少（-2.3%）より大きいため行動変化が混在していると判断する。ただしAI代替効果と断定する根拠はない。"}},
{id:30,grade:"B",type:"press",year:2026,src:"교육부 일문일답 (뉴시스 보도)",title:"1인당 사교육비 역대 최고 — 양극화 우려",url:"https://www.newsis.com/view/NISX20260312_0003545499",
quote:"양극단 구간만 전년 대비 증가한 것으로 나타나",
ko:{crit:"공식 통계 발표 현장의 일문일답을 보도한 것으로 사실 관계는 신뢰할 만하다. '양극화 고착'은 보도의 해석이므로 분포 자료로 별도 확인이 필요하다.",judg:"참여 학생 1인당 월 60.4만 원(역대 최고), 고교 참여 학생 지출 +2.6%를 근거로 입시형 사교육 수요는 견고하며 지출이 상위로 집중된다고 판단한다."},
ja:{crit:"公式統計発表時の一問一答を報じたもので事実関係は信頼できる。「二極化の固定化」は報道の解釈であり、分布資料で別途確認が必要。",judg:"参加生徒1人当たり月60.4万ウォン（過去最高）、高校参加生徒の支出+2.6%を根拠に、入試型私教育需要は堅調で支出が上位に集中していると判断する。"}},
{id:31,grade:"A",type:"stat",year:2026,src:"e-나라지표, 소득수준별 사교육비",title:"소득수준별 학생 1인당 월평균 사교육비",url:"https://www.index.go.kr/unify/idx-info.do?idxCd=4244",
quote:"약 3배의 차이를 보인다",
ko:{crit:"국가통계 기반 공식 지표다. 소득과 지역(서울 집중)이 교란되어 있어 순수 소득 효과로 해석하는 데는 주의가 필요하다.",judg:"사교육 접근은 소득에 강하게 연동되어 있어, 유료 AI 학습관리 서비스도 같은 기울기로 확산될 가능성이 높다고 판단한다."},
ja:{crit:"国家統計に基づく公式指標。所得と地域（ソウル集中）が交絡しているため、純粋な所得効果と解釈するには注意が必要。",judg:"私教育へのアクセスは所得に強く連動しており、有料のAI学習管理サービスも同じ傾きで普及する可能性が高いと判断する。"}},
{id:32,grade:"B",type:"press",year:2025,src:"경향신문 (2025.8.4, 초중등교육법 개정 국회 통과)",title:"AI 디지털교과서, 교육자료로 격하",url:"https://www.khan.co.kr/article/202508041631001",
quote:"AI 교과서가 한 학기만에 교과서 지위를 잃게 됐다",
ko:{crit:"법률 개정이라는 사실 자체는 확실하다. 채택률 약 33%, 실제 접속률 10% 미만이라는 수치는 국회 발언 인용으로 독립 검증이 필요하다. 보도 매체의 정치적 관점도 감안해야 한다.",judg:"한국은 공교육을 통한 AI 맞춤학습 확산을 정치적으로 철회한 사례로, 제도 적응력(I) 하향 요인이라고 판단한다. 빈 공간은 사교육·민간 플랫폼이 채울 가능성이 크다."},
ja:{crit:"法改正という事実自体は確実。採択率約33%、実際の接続率10%未満という数値は国会発言の引用で独立検証が必要。報道機関の政治的立場も考慮すべき。",judg:"韓国は公教育を通じたAI個別最適学習の普及を政治的に撤回した事例であり、制度適応力（I）の下方要因と判断する。空白は私教育・民間プラットフォームが埋める可能性が大きい。"}},
{id:33,grade:"C",type:"press",year:2025,src:"Fortune (2025.10.28)",title:"Chegg slashes about 45% of its workforce",url:"https://fortune.com/2025/10/28/chegg-layoffs-ceo-dan-rosensweig-poster-child-ai-slashing-staff-shares/",
quote:"“new realities of AI” and a sharp drop in Google-driven traffic",
ko:{crit:"기업 공시를 언론이 전달한 것으로 사실 관계(388명, 약 45% 감축)는 확인 가능하나, 원인 귀속은 기업의 자기 설명이다. 구글 AI 요약이라는 검색 구조 변화가 함께 작용해 'AI 튜터 대체'만의 효과로 분리할 수 없다.",judg:"정답·해설 제공형 '숙제 도움' 시장은 범용 AI에 의해 가장 먼저 붕괴하는 세그먼트라고 판단한다."},
ja:{crit:"企業開示を報道が伝えたもので事実関係（388人、約45%削減）は確認可能だが、原因帰属は企業自身の説明である。Google AI要約という検索構造の変化も作用しており、「AIチューター代替」だけの効果には分離できない。",judg:"正解・解説提供型の「宿題ヘルプ」市場は汎用AIによって最初に崩壊するセグメントだと判断する。"}},
{id:34,grade:"C",type:"ind",year:2025,src:"HolonIQ (2025.1.15)",title:"EdTech VC reached ~$2.4B for 2024",url:"https://holoniq.com/notes/edtech-vc-reached-2-4b-for-2024-representing-the-lowest-level-of-investment-in-a-decade",
quote:"the lowest level of investment since 2015",
ko:{crit:"민간 시장조사기관 데이터로 집계 범위가 비공개다. 같은 기관의 다른 글은 '2014년 이후 최저'라고 표기해 기준 연도가 일관되지 않으며, 2025년은 약 26억 달러로 소폭 반등했다.",judg:"팬데믹 버블 이후 에듀테크 자본은 '양'에서 'AI·직업훈련'으로 재배치되었다고 판단한다. K-12 소비자 대상 모델의 투자 매력은 낮다."},
ja:{crit:"民間調査機関のデータで集計範囲は非公開。同機関の別記事は「2014年以来最低」と表記しており基準年が一貫しない。2025年は約26億ドルに小幅反発した。",judg:"パンデミックバブル後、EdTech資本は「量」から「AI・職業訓練」へ再配置されたと判断する。K-12の消費者向けモデルの投資魅力は低い。"}},
{id:35,grade:"C",type:"ind",year:2026,src:"矢野経済研究所 プレスリリース No.4210 (2026.10.22)",title:"教育産業市場に関する調査を実施(2026年)",url:"https://www.yano.co.jp/press/press.php/004210",
quote:"地方を中心に停滞傾向にあり",
ko:{crit:"민간 조사기관의 사업자 매출 기준 추정으로 방법 상세가 유료 보고서에 있다. 시장 규모 수치는 기관마다 크게 달라(약 9,850억 엔 등) 수준보다 방향을 신뢰한다.",judg:"일본 학원 시장은 저출산 속에서 단가 인상과 중학 입시로 버티는 '정체 속 양극화' 국면이라고 판단한다. 기업연수 시장의 성장은 리스킬링 수요 이동을 보여준다."},
ja:{crit:"民間調査機関による事業者売上高ベースの推計で、方法の詳細は有料レポートにある。市場規模の数値は機関によって大きく異なる（約9,850億円など）ため、水準より方向を信頼する。",judg:"日本の塾市場は少子化の中で単価引き上げと中学受験で持ちこたえる「停滞の中の二極化」局面と判断する。企業研修市場の成長はリスキリング需要の移動を示す。"}},
{id:36,grade:"C",type:"ind",year:2025,src:"atama plus 株式会社 プレスリリース (2025.3.26)",title:"AI教材「atama+」導入教室",url:"https://resemom.jp/release/prtimes/20250326/139965.html",
quote:"導入教室は全国47都道府県で4,000を超えています",
ko:{crit:"기업 자체 발표로 독립 검증이 없고 학습효과에 대한 동료심사 증거도 제시되지 않았다. 다만 도입 교실 수는 사업 지표로서 허위 가능성이 낮다.",judg:"'AI가 가르치고(teaching) 사람이 코칭한다(coaching)'는 분업이 학원 산업의 주류 모델로 자리 잡고 있다고 판단한다. 사교육은 AI에 대체되기보다 AI를 흡수하고 있다."},
ja:{crit:"企業自身の発表で独立検証はなく、学習効果に関する査読済み証拠も示されていない。ただし導入教室数は事業指標として虚偽の可能性は低い。",judg:"「AIが教え（ティーチング）、人がコーチングする」という分業が塾産業の主流モデルとして定着しつつあると判断する。私教育はAIに代替されるよりAIを吸収している。"}},
{id:37,grade:"B",type:"io",year:2025,src:"China Daily (중국 교육부 지침 보도, 2025.5.16)",title:"Guideline to regulate use of AI in schools",url:"https://govt.chinadaily.com.cn/s/202505/16/WS6826de33498eec7e1f736de6/guideline-to-regulate-use-of-artificial-intelligence-in-schools.html",
quote:"primary school students are not allowed to independently use open-ended AI content generators",
ko:{crit:"관영매체 보도로 정책 내용 전달은 정확하나 실행 실태는 확인할 수 없다. 원문(中小学生成式人工智能使用指南 2025)과 CSET 번역으로 교차 확인했다.",judg:"중국은 '발달 단계별 제한 + 전면적 AI 소양교육'의 하향식 모델을 택했다고 판단한다. 제도 적응 속도는 빠르나 자율성·평가 다양성은 제한적이다."},
ja:{crit:"官製メディアの報道で政策内容の伝達は正確だが、実施実態は確認できない。原文（中小学生成式人工智能使用指南2025）とCSET翻訳で相互確認した。",judg:"中国は「発達段階別の制限＋全面的なAIリテラシー教育」のトップダウン型を選んだと判断する。制度適応は速いが、自律性・評価の多様性は限定的である。"}},
{id:38,grade:"A",type:"q1",year:2025,src:"Wang & Chang, Humanities & Social Sciences Communications 12 (Q1)",title:"Shadow education teachers' professional identity under China's Double Reduction Policy",url:"https://research-information.bris.ac.uk/en/publications/i-can-survive-and-thrive-in-this-field-changes-in-shadow-educatio/",
quote:"the ongoing demand within the K-12 shadow education market",
ko:{crit:"Q1 학술지 게재이나 베이징 학원 강사 10명 대상 3년 종단 질적연구로 시장 규모를 추정할 수 없다. 다만 '규제가 엄격→완화로 이동했다'는 관찰은 다른 정책 문헌과 일치한다.",judg:"강력한 국가 규제조차 입시 경쟁이 만드는 그림자교육 수요를 없애지 못했다고 판단한다. 수요의 근원은 기술이나 공급이 아니라 선발 구조다."},
ja:{crit:"Q1誌掲載だが、北京の塾講師10人を対象とした3年間の縦断的質的研究で市場規模は推定できない。ただし「規制が厳格→緩和へ移った」との観察は他の政策文献と一致する。",judg:"強力な国家規制でさえ、入試競争が生む影の教育需要を消せなかったと判断する。需要の源泉は技術や供給ではなく選抜構造である。"}},
{id:39,grade:"C",type:"ind",year:2025,src:"OpenAI (2025.2.4)",title:"OpenAI and the California State University system",url:"https://openai.com/index/openai-and-the-csu-system",
quote:"the largest implementation of ChatGPT by any single organization",
ko:{crit:"공급 기업의 홍보 자료로 '최대 규모'는 자기 주장이며 계약 조건·실사용률은 비공개다. CSU가 3.75억 달러 예산 삭감 위기 속에서 도입했다는 맥락(Axios)도 함께 고려해야 한다.",judg:"대형 공립 시스템이 AI를 '비용 효율적 학습지원 인프라'로 채택하기 시작했다고 판단한다. 접근은 확대되나 학습효과는 별도 검증이 필요하다."},
ja:{crit:"提供企業の広報資料で「最大規模」は自己主張であり、契約条件・実利用率は非公開。CSUが3.75億ドルの予算削減危機の中で導入したという文脈（Axios）も考慮すべき。",judg:"大規模な公立システムがAIを「費用効率的な学習支援インフラ」として採用し始めたと判断する。アクセスは拡大するが学習効果は別途検証が必要である。"}},
{id:40,grade:"A",type:"q1",year:2023,src:"Liang et al., Patterns 4(7) (Cell Press, Q1)",title:"GPT detectors are biased against non-native English writers",url:"https://arxiv.org/abs/2304.02819",
quote:"these detectors consistently misclassify non-native English writing samples as AI-generated",
ko:{crit:"TOEFL 에세이 91편과 미국 중학생 에세이 88편으로 표본이 작고, 2023년 탐지기 버전 기준이라 이후 개선 여부는 미확인이다. 그러나 '퍼플렉서티 기반 탐지'의 구조적 한계라는 메커니즘 설명은 견고하다.",judg:"탐지 기술에 의존한 부정행위 대응은 공정성·정확성 양면에서 지속 불가능하다고 판단한다. 평가의 '과정 증명' 전환이 필연적이다."},
ja:{crit:"TOEFLエッセイ91本と米国中学生のエッセイ88本で標本は小さく、2023年版の検出器基準のためその後の改善は未確認。ただし「パープレキシティに基づく検出」の構造的限界というメカニズムの説明は堅牢である。",judg:"検出技術に依存した不正対策は公正性・正確性の両面で持続不可能と判断する。評価の「プロセス証明」への転換は必然である。"}},
{id:41,grade:"C",type:"press",year:2025,src:"뉴시스 (2025.11.11)",title:"연세대 비대면 강좌 AI 집단 부정행위",url:"https://www.newsis.com/view/NISX20251111_0003398229",
quote:"비대면 시험 환경이 AI 커닝을 제어하지 못하면서",
ko:{crit:"개별 사건 보도로 규모·빈도를 일반화할 수 없다. 같은 시기 고려대 오픈채팅 커닝 등 비(非)AI 부정행위도 함께 보도되어, 문제의 본질이 AI만이 아니라 비대면 평가 설계임을 보여준다.",judg:"한국 상위 대학에서도 평가 체계가 AI 환경을 따라가지 못하고 있다는 '사건 증거'로 사용한다. 통계적 근거로는 쓰지 않는다."},
ja:{crit:"個別事件の報道で規模・頻度を一般化できない。同時期の高麗大のオープンチャットでのカンニングなど非AIの不正も報じられており、問題の本質がAIだけでなく非対面評価の設計にあることを示す。",judg:"韓国の上位大学でも評価体系がAI環境に追いついていないという「事例証拠」として用いる。統計的根拠としては使わない。"}}

{id:"summary",num:"0",ko:{t:"핵심 판단 (Executive Summary)"},ja:{t:"主要判断（エグゼクティブサマリー）"},
detail:[
 {kj:[
  ["AI는 대학과 사교육의 '기능'(설명·연습·피드백·과제지원)을 빠르게 분해하고 있지만, 학위·입시라는 '제도'를 2035년까지 대체할 가능성은 낮다.","AIは大学と私教育の「機能」（説明・演習・フィードバック・課題支援）を急速に分解しているが、学位・入試という「制度」を2035年までに代替する可能性は低い。","D",[6,10,20,23],{ko:"기능 측 근거(6·10)는 A급 인과 증거, 제도 측 근거(20·23)는 B급 공식·대규모 자료로, 두 층위의 속도 차이를 결합해 도출했다.",ja:"機能側の根拠（6・10）はA級の因果的証拠、制度側の根拠（20・23）はB級の公式・大規模資料であり、二つの層の速度差を結合して導いた。"}],
  ["MCMC 시뮬레이션(글로벌 기준) 결과 2035년 가장 가능성 높은 경로는 '거대 양극화'({S2})와 '증강 공진화'({S1})의 경합이며, '탈학위'({S3})와 '관성·반동'({S4})이 뒤를 잇는다.","MCMCシミュレーション（グローバル基準）の結果、2035年の最も可能性の高い経路は「大分極化」（{S2}）と「拡張的共進化」（{S1}）の競合であり、「脱学位」（{S3}）と「慣性・反動」（{S4}）が続く。","D",[2,4,20,23,28],{ko:"수치는 본문 §13 모형의 사후예측분포 평균이며 지역·가정 변경 시 달라진다. 모형 구조·지표 코딩 자체가 판단이므로 '정밀 확률'이 아니라 '구조화된 판단'으로 읽어야 한다.",ja:"数値は本文§13モデルの事後予測分布の平均で、地域・仮定を変えると変化する。モデル構造・指標コーディング自体が判断であるため「精密な確率」ではなく「構造化された判断」として読むべきである。"}],
  ["학습효과의 결정 변수는 'AI 사용 여부'가 아니라 '설계'(가드레일·스캐폴딩·평가 방식)이며, 무가드레일 사용은 성과를 올리면서 독립적 학습을 해칠 수 있다.","学習効果の決定変数は「AI利用の有無」ではなく「設計」（ガードレール・足場かけ・評価方法）であり、ガードレールなしの利用は成果を上げつつ自立的な学習を損ない得る。","A",[5,6,10,11]],
  ["대학 위기의 1차 동인은 AI가 아니라 인구·재정·국제학생 감소이며, AI는 '강의 전달'에 의존하는 중위권 대학의 차별화 근거를 잠식하는 가속기다.","大学危機の一次的要因はAIではなく人口・財政・留学生減少であり、AIは「講義伝達」に依存する中位大学の差別化根拠を蝕む加速器である。","D",[12,13,17,19,6]],
  ["한국 사교육은 총액이 5년 만에 감소했지만 참여 학생 1인당 지출은 역대 최고로, '규모 축소–강도 심화'의 양극화 국면에 들어섰다.","韓国の私教育は総額が5年ぶりに減少したが参加生徒1人当たり支出は過去最高で、「規模縮小－強度深化」の二極化局面に入った。","A",[29,30,31]],
  ["학위의 신호 가치는 단기적으로 견고하며, 더 실제적인 위험은 AI가 신입이 맡던 훈련성 업무를 압축하면서 '첫 일자리 사다리'가 약해지는 것이다.","学位のシグナル価値は短期的には頑健であり、より現実的なリスクはAIが新人の訓練的業務を圧縮することで「最初の職の梯子」が弱まることである。","D",[20,21,22,23,26,27]]
 ]}
],

 {kj:[
  ["AI는 교육의 '기능'은 빠르게 분해하지만 학위·입시 '제도'는 2035년까지 견고할 전망이다.","AIは教育の「機能」を急速に分解するが、学位・入試の「制度」は2035年まで頑健と見込まれる。","D",[6,10,20,23]],
  ["시뮬레이션상 2035년은 '거대 양극화'({S2})와 '증강 공진화'({S1})가 경합한다.","シミュレーション上、2035年は「大分極化」（{S2}）と「拡張的共進化」（{S1}）が競合する。","D",[2,4,28]],
  ["학습효과는 AI 유무가 아니라 설계가 좌우하며, 대학 위기의 주동인은 인구·재정이다.","学習効果はAIの有無ではなく設計が左右し、大学危機の主因は人口・財政である。","A",[10,12,13]],
  ["한국 사교육은 총액 감소에도 1인당 지출 최고치로 양극화가 심화되고 있다.","韓国の私教育は総額減少の一方で1人当たり支出が最高を記録し、二極化が深まっている。","A",[29,30]]

{id:"frame",num:"1",ko:{t:"문제 정의와 분석 틀"},ja:{t:"問題設定と分析枠組み"},
detail:[
 {p:[
  ["본 리포트는 생성형 AI가 대학(고등교육)과 사교육(학원·과외·숙제 도움·에듀테크)에 미치는 영향을 2026년 11월 시점의 증거로 진단하고, 2035년을 목표 연도로 시나리오 확률을 추정한다.","本レポートは、生成AIが大学（高等教育）と私教育（塾・家庭教師・宿題ヘルプ・EdTech）に与える影響を2026年11月時点の証拠で診断し、2035年を目標年としてシナリオ確率を推定する。","D",[]],
  ["분석의 출발점은 OECD가 정리한 '과제 수행 성공이 곧 학습은 아니다'라는 구분으로, 우리는 AI의 효과를 '성과(performance)'와 '학습(learning)'으로 분리해 읽는다.","分析の出発点はOECDが整理した「課題遂行の成功は学習そのものではない」という区別であり、AIの効果を「成果（performance）」と「学習（learning）」に分けて読む。","B",[5]],
  ["미래는 세 개의 축으로 요약된다: ① AI의 기술 대체·재구성 압력(A), ② 교육기관과 정책의 제도 적응력(I), ③ 학위·입시가 갖는 노동시장 신호 가치(L).","未来は三つの軸に要約される。①AIによる技術的代替・再構成圧力（A）、②教育機関と政策の制度適応力（I）、③学位・入試が持つ労働市場のシグナル価値（L）である。","D",[],{ko:"세 축은 근거들이 가리키는 독립 변동 요인을 최소 개수로 묶은 것이다. 인구 압력(D)은 확실성이 높아 축이 아닌 조절 변수로 두었다.",ja:"三軸は根拠が示す独立した変動要因を最小数にまとめたものである。人口圧力（D）は確実性が高いため軸ではなく調整変数とした。"}],
  ["여기에 국가별로 확실성이 높은 인구 압력(D)이 제도 적응력을 잠식하는 조절 변수로 작용한다.","これに国別に確実性の高い人口圧力（D）が、制度適応力を蝕む調整変数として作用する。","B",[12,13,17]],
  ["모든 문장에는 근거 등급(A: Q1 논문·공식통계, B: 국제기구·정부·대표표본 조사, C: 언론·기업·업계 자료, D: Claude의 분석적 추론)과 근거 번호를 붙였으며, 번호를 누르면 원문 인용·비판·판단을 확인할 수 있다.","すべての文に根拠等級（A：Q1論文・公式統計、B：国際機関・政府・代表標本調査、C：報道・企業・業界資料、D：Claudeの分析的推論）と根拠番号を付し、番号を押すと原文引用・批判・判断を確認できる。","D",[]]
 ]},
 {chart:"grades"}
],
concise:[
 {p:[
  ["AI 효과를 '성과'와 '학습'으로 분리하고, 기술 압력(A)·제도 적응력(I)·학위 신호(L)의 세 축과 인구 압력(D)으로 2035년을 전망한다.","AIの効果を「成果」と「学習」に分け、技術圧力（A）・制度適応力（I）・学位シグナル（L）の三軸と人口圧力（D）で2035年を展望する。","D",[5]]
 ]},
 {chart:"grades"}
]},

{id:"adoption",num:"2",ko:{t:"현재 ①: AI는 이미 학습의 기본값이 되었다"},ja:{t:"現在①：AIはすでに学習のデフォルトになった"},
detail:[
 {p:[
  ["영국 HEPI 조사에서 어떤 형태로든 AI를 쓰는 학부생은 2024년 66%에서 2025년 92%로 1년 만에 급증했다.","英国HEPI調査で、何らかの形でAIを使う学部生は2024年の66%から2025年の92%へと1年で急増した。","B",[1]],
  ["2026년 조사(2025년 12월 실시)에서는 95%가 AI를 사용하고 94%가 평가 대상 과제에 생성형 AI를 활용해 사실상 포화에 도달했다.","2026年調査（2025年12月実施）では95%がAIを使い、94%が評価対象課題に生成AIを活用しており、事実上飽和に達した。","B",[2]],
  ["한국에서도 생성형 AI 사용 경험이 있는 대학생의 91.7%가 과제·프로젝트 자료 검색에 AI를 활용했다고 답했다.","韓国でも生成AIの利用経験がある大学生の91.7%が課題・プロジェクトの資料検索にAIを活用したと回答した。","B",[3]],
  ["HEPI는 남학생·STEM 전공·사회경제적 상위층의 사용률이 더 높다고 보고해, 보편화와 동시에 활용 격차가 커지고 있음을 시사했다.","HEPIは男子学生・STEM専攻・社会経済的上位層の利用率がより高いと報告し、普遍化と同時に活用格差が広がっていることを示唆した。","B",[1]]
 ]},
 {h:{ko:"제도는 뒤처져 있다",ja:"制度は遅れている"}},
 {p:[
  ["반면 기관이 AI 사용을 장려한다고 느낀 학생은 36%, 기관으로부터 AI 도구를 제공받는다는 학생은 38%에 그쳤다.","一方、機関がAI利用を奨励していると感じる学生は36%、機関からAIツールを提供されている学生は38%にとどまった。","B",[2]],
  ["UNESCO 조사를 인용한 OECD 보고서에 따르면 공식 AI 정책을 갖춘 고등교육기관은 19%에 불과했다.","UNESCO調査を引用したOECD報告書によれば、正式なAI方針を持つ高等教育機関はわずか19%だった。","B",[4]],
  ["중학교 교사의 37%가 2024년 업무에 AI를 사용했고 72%는 학업윤리 훼손을 우려해, 교수자 측의 채택은 학생보다 한참 느리다.","中学校教員の37%が2024年に業務でAIを使い、72%は学業倫理の毀損を懸念しており、教える側の採用は学生よりはるかに遅い。","B",[5]],
  ["예외적으로 캘리포니아주립대(CSU)는 46만 명 이상의 학생에게 ChatGPT Edu를 일괄 제공해 시스템 단위 도입을 선언했다.","例外的にカリフォルニア州立大学（CSU）は46万人超の学生にChatGPT Eduを一括提供し、システム単位での導入を宣言した。","C",[39]],
  ["중국 교육부는 2025년 지침에서 초등학생의 개방형 생성 AI 단독 사용을 금지하는 한편 단계적 AI 소양교육 체계를 구축하도록 했다.","中国教育部は2025年の指針で小学生による開放型生成AIの単独使用を禁じる一方、段階的なAIリテラシー教育体系の構築を求めた。","B",[37]],
  ["따라서 현 국면의 본질은 '사용의 보편화'와 '제도의 미성숙' 사이의 간극이며, 이 간극을 메우는 속도가 시나리오를 가르는 첫 번째 변수라고 판단한다.","したがって現局面の本質は「利用の普遍化」と「制度の未成熟」の間の乖離であり、この乖離を埋める速度がシナリオを分ける第一の変数だと判断する。","D",[1,2,4]],
  ["이 간극은 학습이 기관이 통제하지 않는 무료 소비자용 도구로 이동한다는 뜻이기도 해, 데이터 보호·형평성·평가 신뢰성 문제가 동시에 발생한다.","この乖離は、学習が機関の管理外にある無料の消費者向けツールへ移ることも意味し、データ保護・公平性・評価の信頼性の問題が同時に生じる。","D",[4,5]]
 ]},
 {chart:"adoption"}
],
concise:[
 {p:[
  ["영국 학부생의 AI 사용률은 2년 만에 66%→95%로 포화됐지만, 기관의 장려는 36%, 공식 정책 보유 기관은 19%에 그친다.","英国学部生のAI利用率は2年で66%→95%と飽和したが、機関の奨励は36%、正式方針を持つ機関は19%にとどまる。","B",[1,2,4]],
  ["'사용의 보편화'와 '제도의 미성숙' 사이의 간극이 현 국면의 핵심이다.","「利用の普遍化」と「制度の未成熟」の乖離が現局面の核心である。","D",[2,4]]
 ]},
 {chart:"adoption"}
]},

{id:"learning",num:"3",ko:{t:"현재 ②: 학습효과의 증거 — '성과 ≠ 학습'의 역설"},ja:{t:"現在②：学習効果の証拠 —「成果≠学習」の逆説"},
detail:[
 {h:{ko:"긍정 증거",ja:"肯定的証拠"}},
 {p:[
  ["하버드 물리학 강좌 RCT에서 학습과학 원리로 설계된 AI 튜터 집단은 능동학습 수업 집단보다 더 짧은 시간에 유의하게 더 많이 학습했다.","ハーバード物理学講座のRCTで、学習科学に基づき設計されたAIチューター群はアクティブラーニング授業群より短時間で有意に多く学んだ。","A",[6]],
  ["51편을 통합한 메타분석은 ChatGPT의 학습성과 효과를 g=0.867, 고차사고력 효과를 g=0.457로 추정했다.","51本を統合したメタ分析は、ChatGPTの学習成果への効果をg=0.867、高次思考力への効果をg=0.457と推定した。","A",[7]],
  ["69편의 실험연구를 분석한 또 다른 메타분석도 학업성취 향상을 확인했지만 자기효능감의 변화는 발견하지 못했다.","69本の実験研究を分析した別のメタ分析も学業成績の向上を確認したが、自己効力感の変化は見出さなかった。","A",[8]]
 ]},
 {h:{ko:"반대 증거와 방법론 비판",ja:"反対証拠と方法論批判"}},
 {p:[
  ["그러나 2026년 Computers & Education의 비판적 검토는 두 메타분석에 포함된 상당수 연구가 '매체 비교' 설계로 인해 교수설계·시간 차이를 AI 효과로 오인했을 수 있다고 지적했다.","しかし2026年のComputers & Educationの批判的検討は、二つのメタ分析に含まれる多くの研究が「メディア比較」設計のため、授業設計や時間の差をAI効果と誤認した可能性を指摘した。","A",[9]],
  ["터키 고교생 약 1,000명의 현장실험에서 일반 ChatGPT형 도구를 쓴 학생은 연습 성적이 올랐지만, 도구를 회수한 시험에서는 통제집단보다 17% 낮은 성적을 보였다.","トルコの高校生約1,000人の現場実験で、一般的なChatGPT型ツールを使った生徒は演習成績が上がったが、ツールを回収した試験では統制群より17%低い成績だった。","A",[10]],
  ["같은 실험에서 학습 보호 프롬프트를 내장한 'GPT Tutor'는 이 부정적 효과를 대부분 상쇄했다.","同じ実験で学習保護プロンプトを組み込んだ「GPT Tutor」は、この負の効果をほぼ相殺した。","A",[10]],
  ["대학생 117명 실험에서는 ChatGPT 집단이 에세이 점수를 가장 많이 올렸지만 지식 획득·전이는 차이가 없었고, 연구진은 이를 '메타인지적 게으름'으로 명명했다.","大学生117人の実験では、ChatGPT群がエッセイ得点を最も伸ばしたが知識獲得・転移に差はなく、研究者はこれを「メタ認知的怠惰」と名付けた。","A",[11]],
  ["OECD 디지털교육전망 2026은 이 증거들을 종합해 범용 챗봇의 성과 우위가 도구를 뺀 시험에서는 사라지거나 역전될 수 있다고 정리했다.","OECDデジタル教育アウトルック2026はこれらの証拠を統合し、汎用チャットボットによる成果の優位はツールを除いた試験では消えるか逆転し得ると整理した。","B",[5]]
 ]},
 {chart:"effects"},
 {h:{ko:"판단",ja:"判断"}},
 {p:[
  ["따라서 'AI가 교육을 개선하는가'는 잘못 설정된 질문이며, 올바른 질문은 '어떤 설계에서, 무엇을, 언제 측정할 때인가'라고 판단한다.","したがって「AIは教育を改善するか」は誤って立てられた問いであり、正しい問いは「どの設計で、何を、いつ測定したときか」だと判断する。","D",[6,10,11,5]],
  ["교육 개입에서 g≈0.87은 이례적으로 큰 값이므로, 출판편향과 단기·근접 측정의 과대추정을 감안하면 실제 지속 효과는 그보다 상당히 작을 것으로 본다.","教育介入でg≈0.87は異例に大きな値であり、出版バイアスと短期・近接測定の過大推計を考慮すれば、実際の持続効果はそれよりかなり小さいと見る。","D",[7,9]],
  ["두 독립 실험(고교 수학·대학 작문)이 같은 패턴을 보였다는 점에서, '무가드레일 사용 → 의존 → 독립 수행 저하'의 경로는 상당히 신뢰할 만하다.","二つの独立した実験（高校数学・大学作文）が同じパターンを示した点から、「ガードレールなしの利用→依存→独力遂行の低下」という経路はかなり信頼できる。","D",[10,11]],
  ["이 결론은 사교육에도 그대로 적용되어, 정답 제공형 AI는 숙제 대행 시장을 잠식하지만 학습 설계형 AI는 인간 코칭과 결합한 새 상품이 된다.","この結論は私教育にもそのまま当てはまり、正解提供型AIは宿題代行市場を侵食するが、学習設計型AIは人間のコーチングと結びついた新商品になる。","D",[10,33,36]]
 ]}
],
concise:[
 {p:[
  ["설계된 AI 튜터는 RCT에서 능동학습 수업을 능가했고 메타분석도 큰 효과(g=0.867)를 보고했다.","設計されたAIチューターはRCTでアクティブラーニング授業を上回り、メタ分析も大きな効果（g=0.867）を報告した。","A",[6,7]],
  ["그러나 가드레일 없는 사용은 도구를 뺀 시험 성적을 17% 낮췄고, 메타분석의 효과크기는 설계 교란으로 과대추정됐을 가능성이 크다.","しかしガードレールなしの利用はツールを除いた試験成績を17%下げ、メタ分析の効果量は設計の交絡で過大推計された可能性が高い。","A",[10,9]],
  ["결정 변수는 AI 유무가 아니라 설계다.","決定変数はAIの有無ではなく設計である。","D",[5,10]]
 ]},
 {chart:"effects"}
]},

{id:"univ",num:"4",ko:{t:"현재 ③: 대학의 구조 압력 — 인구·재정·지정학"},ja:{t:"現在③：大学の構造的圧力 — 人口・財政・地政学"},
detail:[
 {p:[
  ["미국 고교 졸업자는 2025년 약 390만 명으로 정점을 찍은 뒤 2041년까지 약 13% 감소할 전망이다.","米国の高校卒業者は2025年に約390万人でピークを迎え、2041年までに約13%減少する見通しである。","B",[12]],
  ["일본 중앙교육심의회는 대학 진학자가 약 63만 명에서 2040년 약 46만 명으로 줄어 현재 정원의 약 73% 수준이 될 것으로 추계했다.","日本の中央教育審議会は、大学進学者が約63万人から2040年に約46万人へ減り、現在の定員の約73%水準になると推計した。","B",[13]],
  ["2025년도 일본 사립대의 53.2%(316교)가 정원 미달이었으며, 이는 18세 인구의 일시 증가로 전년보다 개선된 수치다.","2025年度に日本の私立大学の53.2%（316校）が定員割れであり、これは18歳人口の一時的増加により前年より改善した数値である。","B",[15]],
  ["재정제도등심의회는 2026년 4월 2040년까지 사립대 약 250교를 줄이는 안을 제시했고, 정부 자료도 국립대 정원 재검토와 사립대 재편·통합 추진을 명시했다.","財政制度等審議会は2026年4月に2040年までに私立大学約250校を減らす案を示し、政府資料も国立大学の定員見直しと私立大学の再編・統合の推進を明記した。","B",[14,16]],
  ["한국은 더 가팔라서, KDI는 대학 입학가능인원이 2030년 44.2만 명에서 2040년 22.7만 명으로 절반 가까이 줄 것으로 전망했다.","韓国はさらに急で、KDIは大学入学可能人員が2030年の44.2万人から2040年の22.7万人へとほぼ半減すると予測した。","B",[17]],
  ["국회미래연구원은 정원을 그대로 두고 최근 진학률을 적용하면 2043년 신입생 충원율이 39.4%까지 떨어질 수 있다고 경고했다.","国会未来研究院は、定員をそのままにして直近の進学率を適用すれば2043年の新入生充足率が39.4%まで下がり得ると警告した。","B",[18]],
  ["인구 감소를 유학생으로 메우는 전략도 불안정해져, 미국의 2025년 가을 신규 국제학생 등록은 17% 감소했다.","人口減を留学生で補う戦略も不安定になり、米国の2025年秋の新規留学生登録は17%減少した。","B",[19]]
 ]},
 {chart:"demography"},
 {h:{ko:"판단: AI는 원인이 아니라 가속기다",ja:"判断：AIは原因ではなく加速器である"}},
 {p:[
  ["이 데이터는 대학 위기의 1차 동인이 AI가 아니라 인구·재정·지정학이라는 점을 분명히 보여준다.","これらのデータは、大学危機の一次的要因がAIではなく人口・財政・地政学であることを明確に示している。","D",[12,13,17,19]],
  ["AI는 그 위에 얹히는 가속기로, 설계된 AI 튜터가 고품질 수업과 대등한 효과를 저비용으로 제공하면 '강의 전달'을 핵심 가치로 삼던 중위권 대학의 차별화 근거가 잠식된다.","AIはその上に乗る加速器であり、設計されたAIチューターが質の高い授業と同等の効果を低コストで提供すれば、「講義伝達」を中核価値としてきた中位大学の差別化根拠が侵食される。","D",[6,5]],
  ["반대로 연구·네트워크·브랜드·대면 경험을 가진 상위 대학은 AI를 생산성 도구로 흡수해 격차를 키울 가능성이 크다.","逆に研究・ネットワーク・ブランド・対面経験を持つ上位大学はAIを生産性ツールとして吸収し、格差を広げる可能性が高い。","D",[39,15]],
  ["일본은 재정 당국이 대학 수를 정책 목표로 삼아 '정책 주도 재편'의 경로를, 한국은 정원 조정이 늦어 '시장 퇴출'에 가까운 경로를 밟을 위험이 크다고 판단한다.","日本は財政当局が大学数を政策目標とする「政策主導の再編」の経路を、韓国は定員調整の遅れから「市場退出」に近い経路をたどるリスクが高いと判断する。","D",[14,16,17,18]]
 ]}
],
concise:[
 {p:[
  ["미국은 2025년 정점 후 13% 감소, 일본은 2040년 진학자 46만 명(정원의 73%), 한국은 2040년 입학가능인원 22.7만 명으로 반감한다.","米国は2025年ピーク後13%減、日本は2040年の進学者46万人（定員の73%）、韓国は2040年の入学可能人員22.7万人と半減する。","B",[12,13,17]],
  ["대학 위기의 주동인은 인구·재정이며, AI는 중위권 대학의 차별화를 잠식하는 가속기다.","大学危機の主因は人口・財政で、AIは中位大学の差別化を蝕む加速器である。","D",[13,6]]
 ]},
 {chart:"demography"}
]},

{id:"labor",num:"5",ko:{t:"현재 ④: 노동시장과 학위의 신호 가치"},ja:{t:"現在④：労働市場と学位のシグナル価値"},
detail:[
 {p:[
  ["OECD 평균으로 학사 학위자는 고졸자보다 39%, 석·박사 학위자는 83% 더 벌어 학위 프리미엄은 여전히 크다.","OECD平均で学士は高卒より39%、修士・博士は83%多く稼いでおり、学位プレミアムは依然として大きい。","B",[20]],
  ["기업들의 학위 요건 철폐 선언에도 불구하고 기술기반채용이 실제로 바꾼 채용은 2023년 700건 중 1건에도 미치지 못했다.","企業による学位要件撤廃の宣言にもかかわらず、スキルベース採用が実際に変えた採用は2023年に700件中1件にも満たなかった。","B",[23]],
  ["반면 미국 최근 대졸자(22~27세) 실업률은 최근 갱신에서 5.2%로 다소 내려왔지만 학위가 필요 없는 일자리에 종사하는 불완전고용률은 42.5%에 달했다.","一方、米国の最近の大卒者（22〜27歳）の失業率は最新更新で5.2%にやや低下したが、学位不要の仕事に就く不完全雇用率は42.5%に達した。","B",[21]],
  ["뉴욕연준 연구는 청년 대졸자 실업 상승분의 64%를 재택근무 확산으로 설명해, 'AI가 신입 일자리를 없앴다'는 단정에 제동을 건다.","NY連銀の研究は若年大卒者の失業上昇分の64%を在宅勤務の拡大で説明しており、「AIが新卒の仕事を奪った」という断定に歯止めをかける。","B",[22]]
 ]},
 {h:{ko:"AI가 바꾸는 직무의 내용",ja:"AIが変える職務の中身"}},
 {p:[
  ["LLM 노출도 분석은 미국 노동자의 약 80%가 업무의 10% 이상에서 영향을 받을 수 있으며, 고소득 직무일수록 노출이 크다고 추정했다.","LLM曝露度分析は、米国労働者の約80%が業務の10%以上で影響を受け得て、高所得職ほど曝露が大きいと推定した。","A",[25]],
  ["실험 연구에서 ChatGPT는 전문직 글쓰기 시간을 40% 줄이고 품질을 18% 높였다.","実験研究でChatGPTは専門職の文章作成時間を40%短縮し、品質を18%高めた。","A",[26]],
  ["고객지원 현장 연구에서 AI 보조는 평균 생산성을 14%, 신입·저숙련자의 생산성을 34% 끌어올렸다.","カスタマーサポートの現場研究で、AI支援は平均生産性を14%、新人・低熟練者の生産性を34%引き上げた。","A",[27]],
  ["WEF는 2030년까지 근로자 핵심 역량의 39%가 바뀌거나 낡을 것으로 예상했다.","WEFは2030年までに労働者の中核スキルの39%が変化するか陳腐化すると予想した。","B",[24]],
  ["다만 향후 10년 총요소생산성 증가가 0.66% 이하라는 보수적 추정도 있어, 노동시장 충격의 속도에는 큰 불확실성이 존재한다.","ただし今後10年の全要素生産性の伸びが0.66%以下という保守的推計もあり、労働市場への衝撃の速度には大きな不確実性がある。","A",[28]]
 ]},
 {h:{ko:"판단",ja:"判断"}},
 {p:[
  ["AI가 신입의 생산성을 끌어올린다는 것은 경험 곡선의 압축을 뜻하지만, 동시에 기업이 신입에게 훈련성 업무를 맡길 유인을 약화시킨다.","AIが新人の生産性を引き上げることは経験曲線の圧縮を意味するが、同時に企業が新人に訓練的業務を任せる誘因を弱める。","D",[26,27]],
  ["따라서 학위의 '신호 가치'는 단기적으로 유지되지만, 학위가 보장하던 '첫 일자리 사다리'가 약해지는 것이 더 실제적인 위험이라고 판단한다.","したがって学位の「シグナル価値」は短期的には維持されるが、学位が保証してきた「最初の職の梯子」が弱まることがより現実的なリスクだと判断する。","D",[20,21,22,23]],
  ["대학에 대한 수요는 '학위 단독'에서 '학위 + 검증된 AI 협업 역량 + 현장 경험'이라는 패키지로 이동할 것이다.","大学への需要は「学位単独」から「学位＋検証されたAI協働能力＋現場経験」というパッケージへ移るだろう。","D",[24,20,23]]
 ]}
],
concise:[
 {p:[
  ["학사 임금 프리미엄(+39%)과 기술기반채용의 미미한 실적(1/700)은 학위 신호가 견고함을 보여준다.","学士の賃金プレミアム（+39%）とスキルベース採用の乏しい実績（1/700）は学位シグナルの頑健さを示す。","B",[20,23]],
  ["AI는 신입 업무를 압축(신입 생산성 +34%)해, 진짜 위험은 '첫 일자리 사다리'의 약화다.","AIは新人業務を圧縮し（新人生産性+34%）、真のリスクは「最初の職の梯子」の弱体化である。","D",[27,21]]
 ]}
]},

{id:"shadow",num:"6",ko:{t:"현재 ⑤: 사교육 — 대체되는 것과 강화되는 것"},ja:{t:"現在⑤：私教育 — 代替されるものと強化されるもの"},
detail:[
 {h:{ko:"한국: 규모 축소, 강도 심화",ja:"韓国：規模縮小、強度深化"}},
 {p:[
  ["한국의 2025년 초중고 사교육비 총액은 27.5조 원으로, 역대 최고였던 2024년(29.2조 원)보다 5.7% 줄어 5년 만에 감소했다.","韓国の2025年の小中高私教育費総額は27.5兆ウォンで、過去最高だった2024年（29.2兆ウォン）より5.7%減り、5年ぶりに減少した。","A",[29]],
  ["사교육 참여율도 80.0%에서 75.7%로 4.3%p 낮아졌다.","私教育参加率も80.0%から75.7%へ4.3ポイント低下した。","A",[29]],
  ["그러나 참여 학생 1인당 월평균 지출은 60.4만 원으로 역대 최고였고, 지출 분포에서는 양극단 구간만 증가했다.","しかし参加生徒1人当たりの月平均支出は60.4万ウォンで過去最高となり、支出分布では両極端の区間だけが増加した。","B",[30]],
  ["월소득 800만 원 이상 가구의 사교육비는 300만 원 미만 가구의 약 3배에 달한다.","月所得800万ウォン以上の世帯の私教育費は、300万ウォン未満の世帯の約3倍に達する。","A",[31]],
  ["교육부는 학생 수 감소만으로 총액 감소를 설명할 수 없다고 밝혔고, 초등 돌봄 강화 등 복합 요인이 거론된다.","教育部は児童生徒数の減少だけでは総額減少を説明できないとし、小学校の放課後ケア強化など複合要因が挙げられている。","B",[30]],
  ["AI 디지털교과서는 2025년 도입 후 한 학기 만에 법적 지위가 '교육자료'로 격하되어, 공교육을 통한 AI 맞춤학습 확산 경로가 크게 좁아졌다.","AIデジタル教科書は2025年の導入後わずか1学期で法的地位が「教育資料」に格下げされ、公教育を通じたAI個別最適学習の普及経路が大きく狭まった。","B",[32]]
 ]},
 {h:{ko:"일본·중국·미국",ja:"日本・中国・米国"}},
 {p:[
  ["일본의 학습塾·予備校 시장은 중학 입시 수요와 수강료 인상으로 지탱되고 있으나 지방을 중심으로 정체 경향이다.","日本の学習塾・予備校市場は中学受験需要と授業料値上げで下支えされているが、地方を中心に停滞傾向にある。","C",[35]],
  ["AI 교재 atama+는 전국 4,000개 이상 교실에 도입되어, 'AI가 가르치고 사람이 코칭하는' 분업 모델이 일본 학원 산업에 확산되고 있다.","AI教材atama+は全国4,000超の教室に導入され、「AIが教え人がコーチングする」分業モデルが日本の塾産業に広がっている。","C",[36]],
  ["중국은 2021년 '쌍감(双減)' 정책으로 학원 산업을 강하게 규제했지만, Q1 질적연구는 규제가 점차 완화되면서 K-12 그림자교육 수요가 지속되고 있다고 보고했다.","中国は2021年の「双減」政策で塾産業を強く規制したが、Q1の質的研究は規制が徐々に緩和される中でK-12の影の教育需要が続いていると報告した。","A",[38]],
  ["미국의 숙제 도움 플랫폼 Chegg는 'AI의 새로운 현실'과 구글 유입 급감을 이유로 2025년 10월 인력의 약 45%를 감축했다.","米国の宿題ヘルププラットフォームCheggは「AIの新たな現実」とGoogle経由の流入急減を理由に、2025年10月に人員の約45%を削減した。","C",[33]],
  ["글로벌 에듀테크 벤처투자는 2024년 약 24억 달러로 2015년 이후 최저였고, 자본은 AI·직업훈련 분야로 재배치되고 있다.","世界のEdTechベンチャー投資は2024年に約24億ドルと2015年以来の最低となり、資本はAI・職業訓練分野へ再配置されている。","C",[34]]
 ]},
 {chart:"shadowmap"},
 {h:{ko:"판단: 사교육은 AI에 대체되기보다 AI를 흡수한다",ja:"判断：私教育はAIに代替されるよりAIを吸収する"}},
 {p:[
  ["한국 사교육은 '규모 축소–강도 심화'의 양극화 국면에 들어섰으며, 총액 감소를 AI 대체 효과로 해석할 근거는 아직 없다.","韓国の私教育は「規模縮小－強度深化」の二極化局面に入っており、総額減少をAI代替効果と解釈する根拠はまだない。","D",[29,30,31]],
  ["사례들은 '대체되는 사교육'(정답·해설·숙제 대행)과 '강화되는 사교육'(입시 전략·동기 관리·코칭·정보)이 갈라지고 있음을 보여준다.","事例は「代替される私教育」（正解・解説・宿題代行）と「強化される私教育」（入試戦略・動機管理・コーチング・情報）が分岐していることを示している。","D",[33,36,38,30]],
  ["사교육 수요의 근원은 지식 부족이 아니라 상대평가 입시에서의 위치재(positional good) 경쟁이므로, AI가 학습 비용을 낮춰도 경쟁 자체는 사라지지 않는다.","私教育需要の源泉は知識不足ではなく相対評価の入試における地位財（positional good）競争であるため、AIが学習コストを下げても競争そのものは消えない。","D",[38,30],{ko:"중국의 강력한 규제(쌍감)조차 수요를 제거하지 못했다는 Q1 근거(38)와, 한국 고교 참여 학생 지출 증가(30)를 결합한 추론이다.",ja:"中国の強力な規制（双減）でさえ需要を除去できなかったというQ1根拠（38）と、韓国高校の参加生徒支出増（30）を結合した推論である。"}],
  ["오히려 모두가 AI를 쓰게 되면 차별화는 AI로 대체하기 어려운 인간 코칭·정보·네트워크로 이동해, 고가 사교육의 프리미엄이 커질 수 있다.","むしろ誰もがAIを使うようになれば、差別化はAIで代替しにくい人間のコーチング・情報・ネットワークへ移り、高価格私教育のプレミアムが拡大し得る。","D",[30,36,31]],
  ["한국에서 공교육의 AI 공백(AIDT 격하)은 AI 기반 학습관리를 상품화한 사교육에 시장을 넘겨줄 위험이 있다.","韓国における公教育のAIの空白（AIDT格下げ）は、AIによる学習管理を商品化した私教育に市場を明け渡すリスクがある。","D",[32,36,31]]
 ]}
],
concise:[
 {p:[
  ["한국 사교육비는 27.5조 원(-5.7%)으로 줄었지만 참여 학생 1인당 지출은 역대 최고(월 60.4만 원)다.","韓国の私教育費は27.5兆ウォン（-5.7%）に減ったが、参加生徒1人当たり支出は過去最高（月60.4万ウォン）である。","A",[29,30]],
  ["숙제 대행형(Chegg)은 붕괴하고 코칭 결합형(atama+)은 확산되며, 중국 규제도 수요를 없애지 못했다.","宿題代行型（Chegg）は崩壊し、コーチング結合型（atama+）は拡大し、中国の規制も需要を消せなかった。","C",[33,36,38]],
  ["사교육은 AI에 대체되기보다 AI를 흡수해 고가 코칭 프리미엄을 키울 가능성이 크다.","私教育はAIに代替されるよりAIを吸収し、高価格コーチングのプレミアムを拡大する可能性が高い。","D",[30,36]]
 ]},
 {chart:"shadowmap"}
]},

{id:"assess",num:"7",ko:{t:"평가와 신뢰의 위기"},ja:{t:"評価と信頼の危機"},
detail:[
 {p:[
  ["HEPI 2025에서 학생의 59%가 AI 때문에 평가 방식이 '크게' 바뀌었다고 답했다.","HEPI 2025で学生の59%がAIのために評価方法が「大きく」変わったと回答した。","B",[1]],
  ["2025년 11월 연세대 비대면 교양강좌에서 AI를 이용한 집단 부정행위가 드러나 비대면 평가 체계의 한계가 표면화되었다.","2025年11月、延世大学の非対面教養講座でAIを使った集団不正が発覚し、非対面評価体系の限界が表面化した。","C",[41]],
  ["AI 탐지기는 비원어민의 영어 작문을 AI 생성물로 일관되게 오분류하는 편향을 보여, 탐지 중심 대응은 공정성 문제를 낳는다.","AI検出器は非母語話者の英作文をAI生成物と一貫して誤分類する偏りを示し、検出中心の対応は公正性の問題を生む。","A",[40]],
  ["따라서 평가의 무게중심은 '결과물 검사'에서 '과정 증명'(구술시험·대면 수행·버전 이력·프로젝트 포트폴리오)으로 이동할 수밖에 없다.","したがって評価の重心は「成果物の検査」から「プロセスの証明」（口述試験・対面での遂行・版の履歴・プロジェクトポートフォリオ）へ移らざるを得ない。","D",[40,41,1]],
  ["과정 중심 평가는 교수자 시간이 많이 드는 고비용 체계이므로, 재정 여력이 있는 대학일수록 먼저 전환해 학위 신뢰도의 격차가 벌어질 것이다.","プロセス中心の評価は教員の時間を多く要する高コストの体系であるため、財政余力のある大学ほど先に転換し、学位の信頼度格差が広がるだろう。","D",[15,17,2]],
  ["결국 학위의 가치는 '그 학위를 가진 사람이 AI와 함께, 그리고 AI 없이 무엇을 할 수 있는지 검증했는가'로 재정의될 것이다.","結局、学位の価値は「その学位を持つ人がAIと共に、そしてAIなしで何ができるかを検証したか」で再定義されるだろう。","D",[5,23]]
 ]}
],
concise:[
 {p:[
  ["AI 탐지기는 비원어민을 오분류하고 비대면 평가는 집단 부정에 취약해, 평가는 '과정 증명'으로 이동할 수밖에 없다.","AI検出器は非母語話者を誤分類し、非対面評価は集団不正に脆弱であり、評価は「プロセス証明」へ移らざるを得ない。","D",[40,41]]
 ]}
]},

{id:"compare",num:"8",ko:{t:"국가 비교: 한국·일본·미국·중국"},ja:{t:"国別比較：韓国・日本・米国・中国"},
detail:[{table:"countries"},{p:[
  ["네 나라는 같은 기술 충격을 받지만 인구 압력과 정책 스타일이 달라 서로 다른 경로로 갈라질 가능성이 높다고 판단한다.","4か国は同じ技術ショックを受けるが、人口圧力と政策スタイルが異なるため、異なる経路へ分岐する可能性が高いと判断する。","D",[12,13,17,37]]
]}],
concise:[{table:"countries"}]},

{id:"scen",num:"9",ko:{t:"미래 전망: 2035년 4대 시나리오"},ja:{t:"将来展望：2035年の4大シナリオ"},
detail:[
 {p:[
  ["시나리오는 세 축(A·I·L)의 2035년 값에 대한 결정 규칙으로 정의되어 상호배타적이며, 확률은 다음 절의 MCMC로 추정한다.","シナリオは三軸（A・I・L）の2035年値に対する決定規則で定義され相互排他的であり、確率は次節のMCMCで推定する。","D",[]]
 ]},
 {scen:true}
],
concise:[{scen:true}]},

{id:"mcmc",num:"10",ko:{t:"MCMC 시뮬레이션: 시나리오 확률분포"},ja:{t:"MCMCシミュレーション：シナリオの確率分布"},
detail:[
 {p:[
  ["모형은 세 축의 2026년 수준을 잠재변수로 두고, 근거에서 코딩한 16개 지표를 측정오차가 있는 관측치로 사용하는 베이지안 측정모형이다.","モデルは三軸の2026年水準を潜在変数とし、根拠からコーディングした16の指標を測定誤差付きの観測値として用いるベイズ測定モデルである。","D",[],{ko:"지표 점수는 근거의 수치를 0~1 척도로 변환한 판단값이며, 각 지표의 표준편차(σ)는 근거 등급이 낮을수록 크게 잡았다(A≈0.07~0.12, C≈0.15).",ja:"指標スコアは根拠の数値を0〜1尺度に変換した判断値であり、各指標の標準偏差（σ）は根拠等級が低いほど大きく設定した（A≈0.07〜0.12、C≈0.15）。"}],
  ["각 축의 연간 변화율에는 근거에 기반한 사전분포를 두고, 인구 압력(D)은 제도 적응력의 성장을 깎는 조절항으로 넣었으며, 2035년까지의 외생 충격은 정규분포로 반영했다.","各軸の年間変化率には根拠に基づく事前分布を置き、人口圧力（D）は制度適応力の成長を削る調整項として入れ、2035年までの外生ショックは正規分布で反映した。","D",[12,13,17]],
  ["Metropolis–Hastings 4개 체인으로 사후분포를 추출하고 R-hat으로 수렴을 확인한 뒤, 각 사후 표본마다 2035년 경로를 반복 생성해 '시나리오 확률 자체의 분포'를 계산한다.","Metropolis–Hastings法の4チェーンで事後分布を抽出し、R-hatで収束を確認した後、各事後標本ごとに2035年の経路を繰り返し生成し「シナリオ確率そのものの分布」を計算する。","D",[]],
  ["아래 패널에서 지역(글로벌·한국·일본·미국), 성장률 가정, 시나리오 임계값을 바꾸면 브라우저에서 MCMC가 다시 실행된다.","下のパネルで地域（グローバル・韓国・日本・米国）、成長率の仮定、シナリオ閾値を変えると、ブラウザ上でMCMCが再実行される。","D",[]]
 ]},
 {widget:"mcmc"},
 {p:[
  ["기본 설정에서 한국은 높은 인구 압력과 AIDT 철회로 제도 적응력이 낮게 추정되어 '거대 양극화' 확률이 글로벌보다 높게 나온다.","基本設定では韓国は高い人口圧力とAIDT撤回で制度適応力が低く推定され、「大分極化」の確率がグローバルより高く出る。","D",[17,32,30]],
  ["모형의 핵심 불확실성 중 하나는 학위 신호(L)의 변화율로, 이 사전분포를 조금만 비관적으로 바꿔도 '탈학위' 확률이 빠르게 커진다.","モデルの中核的な不確実性の一つは学位シグナル（L）の変化率であり、この事前分布を少し悲観的にするだけで「脱学位」の確率が急速に高まる。","D",[21,23]]
 ]}
],
concise:[
 {p:[
  ["16개 근거 지표로 세 축의 현재값을 베이지안 추정하고, 2035년 경로를 반복 생성해 시나리오 확률분포를 구했다(브라우저에서 재실행 가능).","16の根拠指標で三軸の現在値をベイズ推定し、2035年の経路を繰り返し生成してシナリオ確率分布を求めた（ブラウザで再実行可能）。","D",[]]
 ]},
 {widget:"mcmc"}
]},

{id:"panel",num:"11",ko:{t:"전문 컨설턴트 페르소나 10인 패널"},ja:{t:"専門コンサルタント・ペルソナ10人パネル"},
detail:[
 {p:[
  ["모형 밖의 관점을 보완하기 위해 서로 다른 전문 영역의 가상 컨설턴트 10명을 상정하고, 각자가 같은 근거를 읽었을 때의 시나리오 확률과 권고를 구성했다.","モデル外の視点を補うため、異なる専門領域の仮想コンサルタント10人を想定し、各自が同じ根拠を読んだ場合のシナリオ確率と提言を構成した。","D",[],{ko:"페르소나는 실존 인물이 아니며 Claude가 직업적 관점의 전형적 편향(예: 재무 전문가의 구조조정 중시, VC의 기술 낙관)을 의도적으로 반영해 만든 판단 장치다.",ja:"ペルソナは実在の人物ではなく、Claudeが職業的視点の典型的なバイアス（例：財務専門家の再編重視、VCの技術楽観）を意図的に反映させて作った判断装置である。"}],
  ["패널 집계는 선형 풀링(평균)과 로그 풀링(기하평균)을 함께 제시하고, MCMC 결과와 비교해 모형과 전문가 직관의 괴리를 드러낸다.","パネル集計は線形プーリング（平均）と対数プーリング（幾何平均）を併せて示し、MCMCの結果と比較してモデルと専門家の直観の乖離を明らかにする。","D",[]]
 ]},
 {widget:"panel"}
],
concise:[{widget:"panel"}]},

{id:"signals",num:"12",ko:{t:"조기경보 지표와 반증 조건"},ja:{t:"早期警戒指標と反証条件"},
detail:[
 {p:[
  ["아래 지표는 시나리오 간 전환을 가장 먼저 보여줄 신호이며, 매년 갱신되는 공개 통계로 추적할 수 있도록 골랐다.","以下の指標はシナリオ間の転換を最も早く示すシグナルであり、毎年更新される公開統計で追跡できるよう選んだ。","D",[]]
 ]},
 {table:"signals"},
 {p:[
  ["본 리포트의 핵심 판단('제도는 견고하다')은 대규모 고용주가 학위 대신 AI 기반 역량 검증으로 신입을 채용하는 비율이 유의미하게 늘면 즉시 수정되어야 한다.","本レポートの中核判断（「制度は頑健」）は、大規模雇用主が学位の代わりにAIベースの能力検証で新卒を採用する比率が有意に増えれば、直ちに修正されるべきである。","D",[23]],
  ["또한 가드레일 없는 AI 사용의 해악이 장기 추적 연구에서 재현되지 않는다면 '설계가 변수'라는 판단의 비중도 낮춰야 한다.","また、ガードレールなしのAI利用の害が長期追跡研究で再現されなければ、「設計が変数」という判断の比重も下げるべきである。","D",[10,11]]
 ]}
],
concise:[{table:"signals"}]},

{id:"strategy",num:"13",ko:{t:"이해관계자별 전략 제언"},ja:{t:"ステークホルダー別の戦略提言"},
detail:[
 {h:{ko:"대학",ja:"大学"}},
 {p:[
  ["대학은 '강의 전달'을 AI 튜터에 넘기고, 교수 시간을 과정 평가·프로젝트 지도·현장 연계로 재배치해야 한다.","大学は「講義伝達」をAIチューターに任せ、教員の時間をプロセス評価・プロジェクト指導・現場連携へ再配置すべきである。","D",[6,40]],
  ["범용 챗봇의 무제한 허용 대신 학습 보호 가드레일이 있는 기관용 AI를 제공하는 것이 학습과 형평성 모두에 유리하다.","汎用チャットボットの無制限許可ではなく、学習保護のガードレールを備えた機関向けAIを提供することが学習と公平性の双方に有利である。","D",[10,2,1]],
  ["인구 절벽이 예정된 한국·일본의 중위권 대학은 단독 생존보다 통합·연합·성인 재교육 전환을 조기에 결정하는 편이 협상력이 높다.","人口の崖が予定される韓国・日本の中位大学は、単独存続より統合・連合・成人の学び直しへの転換を早期に決める方が交渉力が高い。","D",[14,16,17,35]]
 ]},
 {h:{ko:"학원·에듀테크",ja:"塾・EdTech"}},
 {p:[
  ["정답·해설 제공형 상품은 범용 AI에 의해 가격이 0으로 수렴하므로, 학습관리·동기·입시 정보·코칭을 결합한 서비스로 전환해야 한다.","正解・解説提供型の商品は汎用AIにより価格がゼロに収束するため、学習管理・動機付け・入試情報・コーチングを結合したサービスへ転換すべきである。","D",[33,36]],
  ["효과를 독립 검증한 증거(무작위 실험·장기 추적)를 갖춘 사업자가 학부모 신뢰와 공교육 조달 시장을 선점할 것이다.","効果を独立検証した証拠（無作為化実験・長期追跡）を持つ事業者が保護者の信頼と公教育の調達市場を先取りするだろう。","D",[9,32]]
 ]},
 {h:{ko:"정부",ja:"政府"}},
 {p:[
  ["정책은 '도입 속도'보다 '효과 검증과 평가 재설계'를 우선해야 하며, 한국의 AIDT 사례는 검증 없는 전면 도입이 정치적 역진을 부른다는 교훈을 준다.","政策は「導入速度」より「効果検証と評価の再設計」を優先すべきであり、韓国のAIDTの事例は検証なき全面導入が政治的な揺り戻しを招くという教訓を与える。","D",[32,5]],
  ["공교육이 가드레일형 AI 튜터를 무상 제공하지 않으면, AI는 소득 격차를 따라 확산되어 사교육 양극화를 키울 것이다.","公教育がガードレール型AIチューターを無償提供しなければ、AIは所得格差に沿って普及し、私教育の二極化を拡大させるだろう。","D",[31,1,30]]
 ]},
 {h:{ko:"학생·학부모·기업",ja:"学生・保護者・企業"}},
 {p:[
  ["학생과 학부모는 AI로 '더 빨리 끝내는 것'보다 AI 없이도 설명·적용할 수 있는지를 주기적으로 점검해야 한다.","学生と保護者はAIで「より早く終わらせる」ことより、AIなしでも説明・応用できるかを定期的に点検すべきである。","D",[10,11]],
  ["기업은 신입 훈련 업무가 AI로 압축되는 만큼 의도적 도제·로테이션 프로그램을 설계하지 않으면 중견 인재 파이프라인이 끊길 위험이 있다.","企業は新人の訓練業務がAIで圧縮される分、意図的な徒弟・ローテーション制度を設計しなければ中堅人材のパイプラインが途切れるリスクがある。","D",[27,26,21]]
 ]}
],
concise:[
 {p:[
  ["대학은 강의를 AI에 넘기고 과정 평가로 이동, 학원은 정답 제공에서 코칭 결합형으로 전환, 정부는 검증 우선·가드레일형 AI 무상 제공, 기업은 신입 도제 프로그램을 재설계해야 한다.","大学は講義をAIに任せてプロセス評価へ移行、塾は正解提供からコーチング結合型へ転換、政府は検証優先・ガードレール型AIの無償提供、企業は新人の徒弟制度を再設計すべきである。","D",[6,33,36,32,27]]
 ]}
]},

{id:"method",num:"14",ko:{t:"방법론·근거 등급·한계"},ja:{t:"方法論・根拠等級・限界"},
detail:[
 {p:[
  ["학술 근거는 SJR 기준 Q1 학술지 게재 논문으로 한정했으며, 동료심사 전 프리프린트(예: 뇌파 기반 'ChatGPT 사용 시 인지 부채' 연구, 신입 고용 관련 워킹페이퍼)는 의도적으로 제외했다.","学術的根拠はSJR基準のQ1学術誌掲載論文に限定し、査読前のプレプリント（例：脳波に基づく「ChatGPT利用時の認知負債」研究、新卒雇用に関するワーキングペーパー）は意図的に除外した。","D",[],{ko:"Q1 분류는 학술지의 최근 SJR 분야 분위를 기준으로 했으며 분야에 따라 분위가 다를 수 있다. 일부 Q1 논문은 게재본 대신 동일 연구의 WP/arXiv 초록에서 인용문을 가져왔고 해당 근거에 명시했다.",ja:"Q1分類は学術誌の最新SJR分野四分位を基準とし、分野によって四分位が異なる場合がある。一部のQ1論文は掲載版ではなく同一研究のWP/arXiv要旨から引用文を取り、該当根拠に明記した。"}],
  ["정부 통계·국제기구 보고서·방법이 공개된 대표표본 조사는 B등급, 언론 보도·기업 발표·업계 추정은 C등급으로 두고, C등급은 방향성 판단에만 사용했다.","政府統計・国際機関報告書・方法が開示された代表標本調査はB等級、報道・企業発表・業界推計はC等級とし、C等級は方向性の判断にのみ用いた。","D",[]],
  ["근거 인용문은 출처당 1개, 15단어 미만으로 제한했으며, 나머지 내용은 모두 요약·재서술했다.","根拠の引用文は出典ごとに1つ、15語未満に制限し、残りの内容はすべて要約・言い換えとした。","D",[]],
  ["한계로는 첫째, AI 학습효과 연구 대부분이 2년 이내 단기 연구라 장기 역량 형성에 대한 증거가 없다는 점이다.","限界として第一に、AI学習効果研究の大半が2年以内の短期研究で、長期的な能力形成に関する証拠がない点である。","D",[7,8,9]],
  ["둘째, MCMC 모형의 지표 코딩과 결정 규칙 자체가 분석자의 판단이므로, 출력 확률은 객관적 빈도가 아니라 가정을 투명하게 만든 '구조화된 주관확률'이다.","第二に、MCMCモデルの指標コーディングと決定規則自体が分析者の判断であるため、出力確率は客観的頻度ではなく仮定を透明化した「構造化された主観確率」である。","D",[]],
  ["셋째, 중국·인도 등 비OECD 지역과 직업교육·평생교육 시장은 데이터 접근 한계로 깊이 다루지 못했다.","第三に、中国・インドなど非OECD地域や職業教育・生涯学習市場はデータアクセスの限界から深く扱えなかった。","D",[]]
 ]}
],
concise:[
 {p:[
  ["학술 근거는 Q1 논문만, 인용문은 출처당 1개로 제한했으며, 시뮬레이션 확률은 '구조화된 주관확률'로 읽어야 한다.","学術的根拠はQ1論文のみ、引用文は出典ごとに1つに限定し、シミュレーション確率は「構造化された主観確率」として読むべきである。","D",[]]
 ]}
]},

// ===== MCMC engine =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNorm(r){let sp=null;return function(){if(sp!==null){const v=sp;sp=null;return v;}let u=0,v=0;while(u===0)u=r();v=r();const m=Math.sqrt(-2*Math.log(u));sp=m*Math.sin(2*Math.PI*v);return m*Math.cos(2*Math.PI*v);}}
const sig=x=>1/(1+Math.exp(-x)), logit=p=>Math.log(p/(1-p));
function runMCMC(opt){
 const o=Object.assign({},DEFAULTS,opt||{}); const reg=REGIONS[o.region||"global"];
 const ind=INDICATORS.map(d=>({ax:d.ax,v:(reg.ov[d.k]!==undefined?reg.ov[d.k]:d.v),s:d.s}));
 const r=mulberry32(o.seed), N=makeNorm(r);
 // params: [a,i,l (logit levels 2026), ga,gi,gl]
 const pm=[0,0,0,o.ga,o.gi,o.gl], ps=[1.5,1.5,1.5,o.gaSd,.08,.05];
 function lp(th){let s=0;for(let k=0;k<6;k++){const z=(th[k]-pm[k])/ps[k];s-=.5*z*z;}
  const lv={A:sig(th[0]),I:sig(th[1]),L:sig(th[2])};
  for(const d of ind){const z=(d.v-lv[d.ax])/d.s;s-=.5*z*z;}return s;}
 const step=[.22,.20,.22,.06,.06,.04], chains=4, iters=o.iters||14000, burn=o.burn||4000, thin=10;
 const draws=[], traces=[[],[],[],[]]; let acc=0,tot=0;
 const perChain=[];
 for(let c=0;c<chains;c++){
  let th=[N()*1.2,N()*1.2,N()*1.2,pm[3]+N()*.1,pm[4]+N()*.1,pm[5]+N()*.06], cur=lp(th); const cd=[];
  for(let t=0;t<iters;t++){
   const pr=th.map((x,k)=>x+step[k]*N()); const np=lp(pr);
   if(Math.log(r())<np-cur){th=pr;cur=np;if(t>=burn)acc++;}
   if(t>=burn)tot++;
   if(t%20===0)traces[c].push(sig(th[1]));
   if(t>=burn&&t%thin===0){cd.push(th.slice());draws.push(th.slice());}
  }
  perChain.push(cd);
 }
 // R-hat per param
 const rhat=[];for(let k=0;k<6;k++){const m=perChain.map(cd=>cd.reduce((s,x)=>s+x[k],0)/cd.length);const n=perChain[0].length;
  const W=perChain.map((cd,j)=>cd.reduce((s,x)=>s+(x[k]-m[j])**2,0)/(n-1)).reduce((a,b)=>a+b,0)/chains;
  const mm=m.reduce((a,b)=>a+b,0)/chains;const B=n*m.reduce((s,x)=>s+(x-mm)**2,0)/(chains-1);
  rhat.push(Math.sqrt(((n-1)/n*W+B/n)/W));}
 // posterior predictive 2035
 const Y=9, M=40, kD=o.kappa*reg.D; const probs=[], pts=[], post={A0:[],I0:[],L0:[],A35:[],I35:[],L35:[]};
 const tally=[0,0,0,0];
 for(let d=0;d<draws.length;d++){const th=draws[d];const cnt=[0,0,0,0];
  post.A0.push(sig(th[0]));post.I0.push(sig(th[1]));post.L0.push(sig(th[2]));
  for(let m=0;m<M;m++){
   const A=sig(th[0]+Y*th[3]+o.tau*N()), I=sig(th[1]+Y*(th[4]-kD)+o.tau*N()), L=sig(th[2]+Y*th[5]+o.tau*N());
   let s; if(A<o.thA)s=3; else if(L<o.thL)s=2; else if(I>=o.thI)s=0; else s=1;
   cnt[s]++; tally[s]++;
   if(m===0){pts.push([A,I,L,s]);post.A35.push(A);post.I35.push(I);post.L35.push(L);}
  }
  probs.push(cnt.map(x=>x/M));}
 const total=draws.length*M; const mean=tally.map(x=>x/total);

}

{id:42,grade:"B",type:"io",year:2025,src:"World Bank, Policy Research Working Paper 11125 (De Simone et al.)",title:"From Chalkboards to Chatbots: Evaluating the Impact of Generative AI on Learning Outcomes in Nigeria",url:"https://econpapers.repec.org/RePEc:wbk:wbrwps:11125",
quote:"The effect on English, the main outcome of interest, was of 0.23 standard deviations.",
ko:{crit:"공립 고교 9곳의 무작위 실험으로 저소득 환경의 드문 인과 증거이며, 재현성 패키지도 세계은행이 검증했다. 다만 6주 단기 개입이고 동료심사 전 정책연구 보고서이며, 연구진이 프로그램 설계자이기도 하다.",judg:"교사 감독·짝 활동·추론 유도 프롬프트라는 '가드레일형 설계'에서 AI 튜터가 저자원 환경에서도 의미 있는 학습 증가를 낸다고 판단한다. 근거 10과 함께 '설계가 변수'라는 판단을 강화한다."},
ja:{crit:"公立高校9校での無作為化実験で、低所得環境における稀な因果的証拠であり、再現性パッケージも世界銀行が検証した。ただし6週間の短期介入で、査読前の政策研究報告書であり、研究者がプログラム設計者でもある。",judg:"教員の監督・ペア活動・推論を促すプロンプトという「ガードレール型設計」では、AIチューターは低資源環境でも意味のある学習向上を生むと判断する。根拠10とともに「設計が変数」という判断を補強する。"},
en:{crit:"A randomised experiment in nine public high schools — rare causal evidence from a low-income setting, with a reproducibility package verified by the World Bank. But it is a six-week intervention, a policy working paper not yet peer-reviewed, and the researchers also designed the programme.",judg:"We judge that with a guardrailed design — teacher supervision, pair work and prompts that elicit reasoning — AI tutors produce meaningful learning gains even in low-resource settings. Together with source 10, this reinforces the 'design is the variable' judgment."},
ru:{crit:"Рандомизированный эксперимент в девяти государственных старших школах — редкое причинное свидетельство из бедного контекста, пакет воспроизводимости проверен Всемирным банком. Но это шестинедельное вмешательство, рабочий документ без рецензирования, а исследователи сами разработали программу.",judg:"Считаем, что при «защищённом» дизайне — надзор учителя, работа в парах, подсказки, побуждающие к рассуждению, — ИИ-тьюторы дают ощутимый прирост обучения даже в условиях нехватки ресурсов. Вместе с источником 10 это усиливает вывод «решает дизайн»."},
zh:{crit:"在9所公立高中开展的随机实验，是低收入环境中少见的因果证据，复现包亦经世界银行核验。但这是为期6周的短期干预，属尚未同行评审的政策研究工作论文，且研究者同时是项目设计者。",judg:"我们判断，在教师监督、结对学习、引导推理的提示词等“护栏式设计”下，AI导师即便在低资源环境中也能带来可观的学习提升。它与证据10一起强化了“设计才是变量”的判断。"}},
{id:43,grade:"B",type:"io",year:2024,src:"Regulation (EU) 2024/1689 (AI Act), Annex III point 3 — European Commission AI Act Service Desk",title:"Annex III: High-risk AI systems — Education and vocational training",url:"https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3",
quote:"AI systems intended to be used to evaluate learning outcomes",
ko:{crit:"법률 원문이므로 '무엇이 규제 대상인가'에 대해서는 가장 확실한 근거다. 다만 적용 시점과 세부 의무는 후속 지침·일정 조정 논의에 따라 달라질 수 있고, 실제 집행 강도는 회원국 감독기관에 달려 있다.",judg:"EU에서는 AI 채점·배치·입학·시험 감독이 적합성 평가와 인간 감독 의무를 지는 고위험 영역이 되어, 대학의 '평가 자동화'는 비용이 커지고 과정 중심 평가로의 이동이 촉진된다고 판단한다."},
ja:{crit:"法律の原文であり「何が規制対象か」については最も確実な根拠である。ただし適用時期と詳細な義務は後続ガイダンスや日程調整の議論で変わり得て、実際の執行強度は加盟国の監督当局に依存する。",judg:"EUではAIによる採点・配置・入学・試験監視が適合性評価と人間による監督義務を負う高リスク領域となり、大学の「評価自動化」はコストが高まり、プロセス中心の評価への移行が促されると判断する。"},
en:{crit:"Being the legal text itself, it is the firmest evidence on what is regulated. But timing and detailed obligations may shift with follow-up guidance and schedule adjustments, and enforcement intensity depends on national supervisory authorities.",judg:"We judge that in the EU, AI grading, placement, admission and exam proctoring become high-risk areas with conformity-assessment and human-oversight duties, raising the cost of 'automating assessment' and pushing universities towards process-based assessment."},
ru:{crit:"Это сам текст закона, поэтому он даёт самое надёжное основание в вопросе о том, что регулируется. Однако сроки и детальные обязанности могут меняться в зависимости от последующих разъяснений и корректировки графика, а интенсивность применения зависит от национальных надзорных органов.",judg:"Считаем, что в ЕС ИИ для выставления оценок, распределения, приёма и прокторинга экзаменов становится зоной высокого риска с обязательной оценкой соответствия и человеческим надзором; это удорожает «автоматизацию оценивания» и подталкивает вузы к оцениванию процесса."},
zh:{crit:"这是法律原文，因此在“规制对象是什么”这一问题上是最可靠的依据。但适用时间和具体义务可能随后续指南与时间表调整而变化，实际执法力度取决于各成员国监管机构。",judg:"我们判断，在欧盟，AI评分、分班、录取和考试监考成为须履行合规评估与人工监督义务的高风险领域，大学“评估自动化”的成本上升，向过程性评估的转变将被加速。"}},
{id:44,grade:"C",type:"survey",year:2025,src:"Digital Education Council, Global AI Faculty Survey 2025 (Times Higher Education 보도)",title:"Academics 'fear students becoming too reliant on AI tools'",url:"https://www.timeshighereducation.com/news/academics-fear-students-becoming-too-reliant-ai-tools",
quote:"worried about students becoming overly dependent on AI tools",
ko:{crit:"28개국 52개 기관 1,681명으로 규모는 크지만 회원 기관 중심의 편의표본이라 대표성이 약하다(C등급). 같은 기관의 다른 조사와 지역별 응답 차이(북미 교수자의 비관론)도 커서 수치보다 방향을 신뢰한다.",judg:"교수자는 AI를 이미 쓰면서도 학생 의존과 기관 지침 부족을 가장 크게 우려한다고 판단한다. 공급 측의 병목은 기술이 아니라 연수·지침·평가 재설계 역량이다."},
ja:{crit:"28か国52機関の1,681人と規模は大きいが、会員機関中心の便宜標本で代表性は弱い（C等級）。同機関の別調査や地域別の回答差（北米の教員の悲観論）も大きく、数値より方向を信頼する。",judg:"教員はすでにAIを使いつつ、学生の依存と機関の指針不足を最も懸念していると判断する。供給側のボトルネックは技術ではなく研修・指針・評価再設計の能力である。"},
en:{crit:"Large (1,681 faculty from 52 institutions in 28 countries) but a convenience sample centred on member institutions, so representativeness is weak (grade C). Regional differences (pessimism among North American faculty) are also large, so we trust direction more than figures.",judg:"We judge that faculty already use AI yet worry most about student dependence and inadequate institutional guidance; the supply-side bottleneck is training, guidance and assessment-redesign capacity, not technology."},
ru:{crit:"Выборка велика (1 681 преподаватель из 52 вузов 28 стран), но это удобная выборка из организаций-членов, поэтому репрезентативность слаба (класс C). Различия по регионам (пессимизм преподавателей Северной Америки) тоже велики, поэтому мы доверяем направлению, а не цифрам.",judg:"Считаем, что преподаватели уже используют ИИ, но больше всего опасаются зависимости студентов и нехватки институциональных правил; узкое место на стороне предложения — подготовка, правила и способность перестроить оценивание, а не технологии."},
zh:{crit:"样本规模较大（28国52所机构的1,681名教师），但以会员机构为主的便利样本，代表性较弱（C级）。各地区回答差异（北美教师较悲观）也很大，因此更相信方向而非数值。",judg:"我们判断，教师已在使用AI，但最担心学生依赖与机构指引不足；供给侧的瓶颈不是技术，而是培训、指引与评估再设计能力。"}},
{id:45,grade:"B",type:"io",year:2025,src:"The White House, Executive Order 14277 (23 April 2025)",title:"Advancing Artificial Intelligence Education for American Youth",url:"https://whitehouse.gov/presidential-actions/2025/04/advancing-artificial-intelligence-education-for-american-youth",

ko:{crit:"행정명령 원문으로 정책 방향은 확실하나, 예산 규모와 실제 집행 성과는 별도 확인이 필요하다. 행정부 교체 시 정책이 바뀔 수 있는 정치적 가역성도 크다.",judg:"미국은 규제보다 '장려·민관 협력' 노선을 택해 민간 플랫폼의 학교 진입이 빠를 것이라고 판단한다. 동시에 학습효과 검증 장치는 약해 질 관리 공백이 생길 수 있다."},
