{id:46,grade:"C",type:"press",year:2025,src:"더팩트 (2025, 뉴시스 집계 인용)",title:"2025학년도 대학 등록금 인상 현황",url:"https://news.tf.co.kr/read/life/2182073.htm",
quote:"전국 190개교 중 131개교(68.9%)인 것으로 나타났다",
ko:{crit:"언론의 집계 보도로 공식 통계는 아니며 집계 기준(인상 확정 시점)에 따라 수치가 달라질 수 있다. 다만 다수 매체가 주요 사립대의 법정 상한 근접 인상을 일관되게 보도해 방향은 확실하다.",judg:"16년 넘게 이어진 등록금 동결의 붕괴는 한국 대학의 재정 압박이 임계점에 이르렀다는 신호라고 판단한다. AI 전환 투자 여력은 등록금 인상이 가능한 수도권·상위 대학에 먼저 생긴다."},
ja:{crit:"報道による集計で公式統計ではなく、集計基準（値上げ確定時点）により数値は変わり得る。ただし多くの媒体が主要私大の法定上限近くの値上げを一貫して報じており、方向は確実である。",judg:"16年以上続いた授業料凍結の崩壊は、韓国の大学の財政圧迫が臨界点に達したシグナルだと判断する。AI転換の投資余力は値上げ可能な首都圏・上位大学に先に生じる。"},
en:{crit:"A press tally, not official statistics, and the figure may vary with the counting cut-off; but many outlets consistently reported major private universities raising fees close to the legal cap, so the direction is certain.",judg:"We judge the collapse of a tuition freeze lasting more than 16 years to signal that Korean universities' financial strain has reached a tipping point; capacity to invest in an AI transition appears first at metropolitan and top universities that can raise fees."},
ru:{crit:"Это подсчёт СМИ, а не официальная статистика, и цифра может зависеть от даты отсечения; но многие издания последовательно сообщали о повышении платы ведущими частными вузами почти до законного предела, так что направление несомненно.",judg:"Считаем, что крах более чем 16-летней заморозки платы за обучение сигнализирует о критическом финансовом напряжении корейских вузов; возможность инвестировать в переход на ИИ появляется прежде всего у столичных и ведущих вузов, способных поднять плату."},
zh:{crit:"属媒体汇总而非官方统计，数值可能因统计截止时间而变；但多家媒体一致报道主要私立大学将学费上调至接近法定上限，方向是确定的。",judg:"我们判断，持续16年以上的学费冻结被打破，标志着韩国大学的财政压力已达临界点；AI转型的投资能力会首先出现在能够涨学费的首都圈与头部大学。"}},
{id:47,grade:"B",type:"io",year:2025,src:"文部科学省「初等中等教育段階における生成AIの利活用に関するガイドライン(Ver.2.0)」概要",title:"生成AIの利活用に関するガイドライン Ver.2.0",url:"https://www.mext.go.jp/content/20250212-mxt_jogai01-000039178_002.pdf",
quote:"一律に禁止・義務付けるなどの硬直的な運用は望ましくない",
ko:{crit:"정부 공식 지침이지만 법적 구속력이 없는 참고자료이며, 대상은 초중등 단계다. 대학·학원에는 직접 적용되지 않지만 일본 교육 거버넌스의 기조(인간 중심·현장 재량)를 보여 준다.",judg:"일본은 '금지도 의무도 아닌 가이드라인·현장 재량' 모델을 택했다고 판단한다. 공교육 도입 속도는 완만하고, 그 공백을 AI 교재를 갖춘 학원이 빠르게 메우는 구조와 맞물린다."},
ja:{crit:"政府の公式指針だが法的拘束力のない参考資料であり、対象は初等中等段階。大学・塾には直接適用されないが、日本の教育ガバナンスの基調（人間中心・現場裁量）を示す。",judg:"日本は「禁止でも義務でもない指針・現場裁量」モデルを選んだと判断する。公教育での導入は緩やかで、その空白をAI教材を備えた塾が素早く埋める構造と噛み合う。"},
en:{crit:"An official government guideline, but a non-binding reference for primary and secondary schools; it does not apply directly to universities or juku but shows the tone of Japanese education governance (human-centred, local discretion).",judg:"We judge Japan has chosen a 'guidance and local discretion — neither ban nor mandate' model; adoption in public schools is gradual, which dovetails with juku equipped with AI materials quickly filling the gap."},
ru:{crit:"Официальное правительственное руководство, но необязательный справочный документ для начальной и средней школы; к вузам и дзюку оно напрямую не относится, однако показывает тон японского управления образованием (человекоцентричность, свобода на местах).",judg:"Считаем, что Япония выбрала модель «рекомендаций и свободы на местах — ни запрета, ни обязательности»; внедрение в государственных школах идёт постепенно, а этот пробел быстро заполняют дзюку с ИИ-материалами."},
zh:{crit:"政府官方指南，但对中小学而言是无法律约束力的参考资料；虽不直接适用于大学和补习班，却体现了日本教育治理的基调（以人为本、尊重现场裁量）。",judg:"我们判断，日本选择了“既不禁止也不强制、以指南和现场裁量为主”的模式；公立学校的导入较为平缓，这与配备AI教材的补习班迅速填补空白的结构相互契合。"}}
);

{id:"faculty",after:"shadow",t:{ko:"현재 ⑥: 교수자·연구·대학 재정 — 공급 측의 변화",ja:"現在⑥：教員・研究・大学財政 — 供給側の変化",en:"Present ⑥: Faculty, Research and University Finance — the Supply Side",ru:"Настоящее ⑥: преподаватели, исследования и финансы вузов — сторона предложения",zh:"现状⑥：教师、科研与大学财政——供给侧的变化"},
detail:[
 {p:[
  S("C",[44],{ko:"28개국 1,681명의 교수자를 조사한 디지털교육위원회(DEC) 2025 조사에서 61%가 수업에 AI를 써 봤지만, 82%는 학생의 AI 과의존을, 83%는 학생의 AI 결과물 비판 능력을 우려했다.",ja:"28か国1,681人の教員を対象としたデジタル教育評議会（DEC）2025年調査では、61%が授業でAIを使ったことがある一方、82%が学生のAIへの過度な依存を、83%が学生のAI出力を批判的に評価する能力を懸念した。",en:"In the Digital Education Council's 2025 survey of 1,681 faculty in 28 countries, 61% had used AI in teaching, yet 82% worried about students' over-reliance on AI and 83% doubted students' ability to critically evaluate AI output.",ru:"В опросе Digital Education Council 2025 года среди 1 681 преподавателя из 28 стран 61% уже использовали ИИ в преподавании, но 82% опасались чрезмерной зависимости студентов от ИИ, а 83% сомневались в их способности критически оценивать ответы ИИ.",zh:"数字教育委员会（DEC）2025年对28个国家1,681名教师的调查显示，61%曾在教学中使用AI，但82%担心学生过度依赖AI，83%怀疑学生批判性评估AI输出的能力。"}),
  S("C",[44],{ko:"같은 조사에서 교수자의 80%는 소속 기관의 AI 지침이 충분하지 않다고 보았고, 54%는 학생 평가 방식에 큰 변화가 필요하다고 답했다.",ja:"同調査で教員の80%は所属機関のAI指針が十分でないと考え、54%は学生評価の方法に大きな変更が必要だと答えた。",en:"In the same survey, 80% of faculty found their institution's AI guidelines not comprehensive, and 54% said student assessment methods need significant change.",ru:"В том же опросе 80% преподавателей сочли правила своего вуза по ИИ неполными, а 54% заявили, что методы оценивания студентов нуждаются в серьёзных изменениях.",zh:"同一调查中，80%的教师认为所在机构的AI指引不够全面，54%表示学生评估方式需要重大改变。"}),
  S("B",[5],{ko:"OECD는 경험이 적은 튜터도 교육용 생성 AI를 쓰면 지도의 질과 학생 성과를 높일 수 있다는 견고한 연구 증거가 있으며, 연구자들도 논문 피드백 등 연구 전 과정에서 생성 AI를 점점 더 쓴다고 정리했다.",ja:"OECDは、経験の浅いチューターでも教育用生成AIを使えば指導の質と生徒の成果を高め得るという頑健な研究証拠があり、研究者も論文へのフィードバックなど研究の全過程で生成AIをますます使っていると整理した。",en:"The OECD notes robust evidence that even inexperienced tutors can raise tutoring quality and student outcomes with educational GenAI, and that researchers increasingly use GenAI across the research process, including feedback on papers.",ru:"ОЭСР отмечает надёжные данные о том, что даже неопытные тьюторы повышают качество занятий и результаты учеников с помощью образовательного генеративного ИИ, а исследователи всё шире применяют его на всех этапах работы, включая отзывы на статьи.",zh:"OECD指出，有可靠研究证据表明，即便是缺乏经验的辅导者，借助教育用生成式AI也能提升辅导质量和学生成绩；研究人员也越来越多地在包括论文反馈在内的整个研究过程中使用生成式AI。"}),
  S("B",[2],{ko:"HEPI 2026 조사에서는 학생의 16%가 AI 때문에 학업 경험이 오히려 나빠졌다고 답해, 공정성·역량 퇴화·사회적 고립에 대한 우려가 사용 확대와 공존하고 있다.",ja:"HEPI 2026調査では学生の16%がAIのせいで学業経験がむしろ悪化したと答えており、公平性・能力の衰え・社会的孤立への懸念が利用拡大と共存している。",en:"In HEPI 2026, 16% of students said AI had made their academic experience worse, so concerns about fairness, skill erosion and social isolation coexist with expanding use.",ru:"В HEPI 2026 16% студентов сказали, что ИИ ухудшил их учебный опыт, — опасения по поводу справедливости, утраты навыков и социальной изоляции сосуществуют с ростом использования.",zh:"在HEPI 2026调查中，16%的学生表示AI反而让学习体验变差，对公平、能力退化和社会孤立的担忧与使用扩大并存。"})
 ]},
 {h:{ko:"재정 제약: 투자할 수 있는 대학만 전환한다",ja:"財政制約：投資できる大学だけが転換する",en:"Financial constraint: only universities that can invest will transform",ru:"Финансовые ограничения: меняться смогут лишь вузы, способные инвестировать",zh:"财政约束：只有能投资的大学才能转型"}},
 {p:[
  S("C",[46],{ko:"한국에서는 2009년 이후 이어진 등록금 동결 기조가 2025학년도에 무너져, 전국 190개 대학 중 131곳(68.9%)이 등록금을 올렸다.",ja:"韓国では2009年以降続いた授業料凍結の基調が2025学年度に崩れ、全国190大学のうち131校（68.9%）が授業料を引き上げた。",en:"In Korea, the tuition freeze in place since 2009 broke in the 2025 academic year, with 131 of 190 universities (68.9%) raising fees.",ru:"В Корее заморозка платы за обучение, действовавшая с 2009 года, рухнула в 2025 учебном году: 131 из 190 вузов (68,9%) повысили плату.",zh:"在韩国，自2009年以来的学费冻结在2025学年被打破，全国190所大学中有131所（68.9%）上调了学费。"}),
  S("D",[46,17],{ko:"등록금 인상은 AI 전환 투자 여력을 일부 회복시키지만, 학생 수가 급감하는 비수도권 대학은 인상분보다 미충원 손실이 커 투자 여력이 구조적으로 부족하다고 판단한다.",ja:"授業料の値上げはAI転換の投資余力を一部回復させるが、学生数が急減する非首都圏の大学は値上げ分より定員割れの損失が大きく、投資余力が構造的に不足すると判断する。",en:"Fee increases partly restore capacity to invest in an AI transition, but we judge non-metropolitan universities with collapsing enrolment to be structurally short of investment capacity, as losses from unfilled seats exceed the fee gains.",ru:"Повышение платы отчасти восстанавливает возможность инвестировать в переход на ИИ, но мы считаем, что у региональных вузов с резко падающим набором инвестиционных возможностей структурно не хватает: потери от недобора превышают прибавку от платы.",zh:"上调学费在一定程度上恢复了AI转型的投资能力，但我们判断，生源锐减的非首都圈大学因招生不足造成的损失大于涨价收益，投资能力存在结构性不足。"}),
  S("D",[44,5],{ko:"교수자의 역할은 '내용 전달자'에서 '학습 설계자·코치·평가자'로 이동하고 있으며, 이 전환의 병목은 기술이 아니라 교수자 연수와 기관 지침이다.",ja:"教員の役割は「内容の伝達者」から「学習の設計者・コーチ・評価者」へ移りつつあり、この転換のボトルネックは技術ではなく教員研修と機関の指針である。",en:"The faculty role is shifting from 'content deliverer' to 'learning designer, coach and assessor', and the bottleneck in this transition is faculty training and institutional guidance, not technology.",ru:"Роль преподавателя смещается от «передатчика содержания» к «проектировщику обучения, наставнику и оценщику», и узкое место этого перехода — подготовка преподавателей и институциональные правила, а не технологии.",zh:"教师的角色正从“内容传授者”转向“学习设计者、教练和评估者”，这一转型的瓶颈不是技术，而是教师培训与机构指引。"}),
  S("D",[5,25,15],{ko:"AI가 연구 생산성을 높이는 효과는 연구 인프라와 데이터를 가진 연구중심 대학에 집중될 가능성이 커, 상위권 대학의 우위를 공고히 하는 또 하나의 경로가 된다.",ja:"AIが研究生産性を高める効果は研究基盤とデータを持つ研究型大学に集中する可能性が高く、上位大学の優位を固めるもう一つの経路となる。",en:"AI's boost to research productivity is likely to concentrate in research universities with infrastructure and data, becoming another path that entrenches the advantage of top institutions.",ru:"Прирост исследовательской продуктивности от ИИ, вероятно, сосредоточится в исследовательских университетах с инфраструктурой и данными, став ещё одним путём закрепления преимущества ведущих вузов.",zh:"AI对科研生产力的提升很可能集中于拥有科研基础设施和数据的研究型大学，成为巩固头部大学优势的又一路径。"})
 ]}
],
concise:[{p:[S("D",[44,46],{ko:"교수자 61%가 AI를 쓰지만 80%는 기관 지침이 불충분하다고 보며, 투자 여력이 있는 대학만 전환하는 재정 제약이 양극화를 키운다.",ja:"教員の61%がAIを使うが80%は機関の指針が不十分と考えており、投資余力のある大学だけが転換する財政制約が二極化を強める。",en:"61% of faculty use AI but 80% find institutional guidance inadequate, and a financial constraint whereby only universities able to invest can transform deepens bifurcation.",ru:"61% преподавателей используют ИИ, но 80% считают правила вуза недостаточными, а финансовое ограничение — меняться могут лишь вузы, способные инвестировать, — усиливает поляризацию.",zh:"61%的教师在用AI，但80%认为机构指引不足；只有具备投资能力的大学才能转型，这一财政约束加剧了两极分化。"})]}]},

{id:"equity",after:"faculty",t:{ko:"현재 ⑦: 글로벌 사우스와 형평성 — AI는 격차를 줄이는가",ja:"現在⑦：グローバルサウスと公平性 — AIは格差を縮めるか",en:"Present ⑦: The Global South and Equity — Does AI Narrow Gaps?",ru:"Настоящее ⑦: Глобальный Юг и справедливость — сокращает ли ИИ разрывы?",zh:"现状⑦：全球南方与公平——AI会缩小差距吗？"},
detail:[
 {p:[
  S("B",[42],{ko:"세계은행이 나이지리아 에도주 공립 고교 9곳에서 수행한 무작위 실험에서, 교사 감독 아래 GPT-4를 쓰는 6주 방과후 프로그램은 영어 성적을 0.23 표준편차 높였다.",ja:"世界銀行がナイジェリア・エド州の公立高校9校で行った無作為化実験では、教員の監督下でGPT-4を使う6週間の放課後プログラムが英語の成績を0.23標準偏差高めた。",en:"In a World Bank randomised experiment in nine public high schools in Edo State, Nigeria, a six-week after-school programme using GPT-4 under teacher supervision raised English scores by 0.23 standard deviations.",ru:"В рандомизированном эксперименте Всемирного банка в девяти государственных старших школах штата Эдо (Нигерия) шестинедельная программа после уроков с GPT-4 под надзором учителя повысила результаты по английскому на 0,23 стандартного отклонения.",zh:"世界银行在尼日利亚埃多州9所公立高中开展的随机实验显示，在教师监督下使用GPT-4的6周课后项目使英语成绩提高了0.23个标准差。"}),
  S("B",[42],{ko:"비용 대비 효과 분석에서 이 학습 증가는 통상적인 학교 교육 1.5~2년에 해당하는 것으로 추정되었다.",ja:"費用対効果の分析では、この学習の伸びは通常の学校教育1.5〜2年分に相当すると推定された。",en:"A cost-effectiveness analysis equated the gain to 1.5–2 years of business-as-usual schooling.",ru:"Анализ затрат и эффективности приравнял этот прирост к 1,5–2 годам обычного школьного обучения.",zh:"成本效益分析估计，这一学习提升相当于常规学校教育1.5至2年。"}),
  S("B",[42],{ko:"이 프로그램은 학생을 짝으로 묶고, 교사가 진행을 맡으며, 지름길 대신 추론을 유도하는 프롬프트를 쓰는 '가드레일형 설계'를 갖추고 있었다.",ja:"このプログラムは生徒をペアにし、教員が進行を担い、近道ではなく推論を促すプロンプトを使うという「ガードレール型設計」を備えていた。",en:"The programme had a guardrailed design: students worked in pairs, teachers facilitated, and prompts encouraged reasoning rather than shortcuts.",ru:"У программы был «защищённый» дизайн: ученики работали в парах, учитель вёл занятия, а подсказки побуждали к рассуждению, а не к коротким путям.",zh:"该项目采用“护栏式设计”：学生两两结对、由教师主持，并使用引导推理而非走捷径的提示词。"}),
  S("B",[20],{ko:"반면 OECD 평균으로 부모가 고교를 마치지 못한 청년의 고등교육 이수율은 26%로, 부모 중 한 명이라도 고등교육을 받은 청년의 70%에 크게 못 미친다.",ja:"一方、OECD平均で親が高校を修了していない若者の高等教育修了率は26%で、親の少なくとも一方が高等教育を受けた若者の70%を大きく下回る。",en:"Meanwhile, on OECD average only 26% of young adults whose parents did not complete upper secondary hold a tertiary qualification, versus 70% of those with at least one tertiary-educated parent.",ru:"При этом в среднем по ОЭСР высшее образование имеют лишь 26% молодых людей, чьи родители не окончили старшую школу, против 70% тех, у кого хотя бы один родитель с высшим образованием.",zh:"与此同时，OECD平均而言，父母未完成高中教育的年轻人中仅26%拥有高等教育学历，而父母至少一方受过高等教育的年轻人中这一比例为70%。"}),
  S("B",[1,31],{ko:"고소득국 내부에서도 AI 활용은 사회경제적 상위층에 치우치며, 한국에서는 소득 상위 가구가 하위 가구의 약 3배를 사교육에 쓴다.",ja:"高所得国の内部でもAI活用は社会経済的上位層に偏り、韓国では所得上位世帯が下位世帯の約3倍を私教育に使っている。",en:"Even within high-income countries AI use skews towards the socio-economically advantaged, and in Korea top-income households spend about three times as much on tutoring as bottom-income ones.",ru:"Даже внутри богатых стран использование ИИ смещено к обеспеченным слоям, а в Корее семьи с высоким доходом тратят на репетиторство примерно втрое больше, чем бедные.",zh:"即便在高收入国家内部，AI使用也偏向社会经济地位较高的群体；在韩国，高收入家庭的课外辅导支出约为低收入家庭的3倍。"})
 ]},
 {h:{ko:"판단",ja:"判断",en:"Judgment",ru:"Вывод",zh:"判断"}},
 {p:[
  S("D",[42,31,1],{ko:"AI 튜터의 격차 완화 잠재력은 기존에 개인지도 접근성이 가장 낮은 곳에서 가장 크지만, 공공이 설계된 도구를 무상으로 제공할 때만 실현되며 시장에 맡기면 소득 기울기를 따라 확산된다고 판단한다.",ja:"AIチューターの格差縮小の潜在力は、従来個別指導へのアクセスが最も乏しい所で最も大きいが、公共が設計されたツールを無償提供する場合にのみ実現し、市場に任せれば所得の傾きに沿って広がると判断する。",en:"We judge that AI tutors' potential to narrow gaps is greatest where access to tutoring has been lowest, but it is realised only when the public sector provides well-designed tools free of charge; left to the market, AI spreads along the income gradient.",ru:"Считаем, что потенциал ИИ-тьюторов сокращать разрывы максимален там, где доступ к репетиторству был наименьшим, но он реализуется лишь при бесплатном предоставлении хорошо спроектированных инструментов государством; на рынке ИИ распространяется вдоль градиента доходов.",zh:"我们判断，AI导师缩小差距的潜力在以往最难获得个别辅导的地方最大，但只有在公共部门免费提供设计良好的工具时才能实现；若交给市场，AI会沿收入梯度扩散。"}),
  S("D",[42,32,31],{ko:"한국·일본에 이는 공교육의 가드레일형 AI 튜터가 저소득층 사교육 부담을 낮출 핵심 정책 수단이며, 이것이 S1(공진화)과 S2(양극화)를 가르는 분기점이라는 뜻이다.",ja:"韓国・日本にとって、これは公教育のガードレール型AIチューターが低所得層の私教育負担を下げる中核的政策手段であり、S1（共進化）とS2（二極化）を分ける分岐点であることを意味する。",en:"For Korea and Japan, this means a guardrailed AI tutor in public education is a key policy lever for easing the tutoring burden on low-income families — and the fork between S1 (co-evolution) and S2 (bifurcation).",ru:"Для Кореи и Японии это означает, что «защищённый» ИИ-тьютор в государственном образовании — ключевой рычаг снижения нагрузки на малообеспеченные семьи и точка развилки между S1 (коэволюция) и S2 (поляризация).",zh:"对韩国和日本而言，这意味着公立教育中的护栏式AI导师是减轻低收入家庭课外辅导负担的关键政策工具，也是S1（共同进化）与S2（两极分化）的分岔点。"}),
  S("D",[42],{ko:"다만 이 실험은 6주 단기 개입이고 동료심사 전 정책연구 보고서이므로, 효과의 지속성과 다른 과목·국가로의 일반화는 아직 검증되지 않았다.",ja:"ただしこの実験は6週間の短期介入で査読前の政策研究報告書であるため、効果の持続性や他科目・他国への一般化はまだ検証されていない。",en:"However, the experiment was a six-week intervention reported in a policy working paper before peer review, so the durability of the effect and its generalisation to other subjects and countries remain unverified.",ru:"Однако эксперимент длился шесть недель и описан в рабочем документе до рецензирования, поэтому устойчивость эффекта и его перенос на другие предметы и страны пока не проверены.",zh:"不过，该实验为期仅6周，且报告为尚未同行评审的政策工作论文，效果的持续性以及向其他学科和国家的推广仍有待验证。"})
 ]}
],
concise:[{p:[S("D",[42,31],{ko:"나이지리아 RCT에서 교사 감독형 AI 튜터는 6주 만에 영어 성적을 0.23 표준편차 올렸지만, 격차 완화는 공공이 설계된 도구를 무상 제공할 때만 실현된다.",ja:"ナイジェリアのRCTで教員監督型AIチューターは6週間で英語の成績を0.23標準偏差高めたが、格差縮小は公共が設計されたツールを無償提供する場合にのみ実現する。",en:"In a Nigerian RCT a teacher-supervised AI tutor raised English scores by 0.23 SD in six weeks, but narrowing gaps happens only when the public sector provides well-designed tools for free.",ru:"В нигерийском РКИ ИИ-тьютор под надзором учителя за шесть недель повысил результаты по английскому на 0,23 SD, но разрывы сокращаются лишь при бесплатном предоставлении хороших инструментов государством.",zh:"尼日利亚的随机对照试验中，教师监督下的AI导师在6周内使英语成绩提升0.23个标准差，但只有公共部门免费提供设计良好的工具，差距才会缩小。"})]}]},

{id:"reg",after:"assess",t:{ko:"규제 지형: 평가·선발은 규제, 활용은 장려",ja:"規制の地形：評価・選抜は規制、活用は奨励",en:"The Regulatory Landscape: Regulate Assessment and Selection, Promote Use",ru:"Регуляторный ландшафт: регулировать оценивание и отбор, поощрять использование",zh:"监管格局：评估与选拔受监管，应用受鼓励"},
detail:[
 {p:[
  S("B",[43],{ko:"EU AI법은 교육기관의 입학·배정 결정, 학습성과 평가, 교육 수준 판정, 시험 중 부정행위 감시에 쓰이는 AI를 '고위험'으로 분류한다.",ja:"EUのAI法は、教育機関における入学・配置の決定、学習成果の評価、教育水準の判定、試験中の不正監視に用いるAIを「高リスク」に分類している。",en:"The EU AI Act classifies AI used in education for admission and assignment decisions, evaluating learning outcomes, determining the appropriate level of education and monitoring cheating during tests as 'high-risk'.",ru:"Закон ЕС об ИИ относит к «высокому риску» ИИ, применяемый в образовании для решений о приёме и распределении, оценки результатов обучения, определения уровня образования и контроля списывания на экзаменах.",zh:"欧盟《人工智能法》将教育中用于录取与分配决定、评估学习成果、判定适当教育层次以及考试期间监测作弊的AI列为“高风险”。"}),
  S("B",[45],{ko:"미국은 2025년 4월 행정명령 14277로 백악관 AI 교육 태스크포스를 설치해 K-12 AI 교육과 민관 협력을 장려하는 방향을 택했다.",ja:"米国は2025年4月の大統領令14277でホワイトハウスAI教育タスクフォースを設置し、K-12のAI教育と官民連携を奨励する方向を選んだ。",en:"The US, through Executive Order 14277 of April 2025, established a White House Task Force on AI Education and chose to promote K-12 AI education and public-private partnerships.",ru:"США указом 14277 в апреле 2025 года создали Целевую группу Белого дома по образованию в области ИИ и выбрали курс на поощрение ИИ-образования в школах и государственно-частных партнёрств.",zh:"美国于2025年4月通过第14277号行政令设立白宫人工智能教育工作组，选择鼓励K-12人工智能教育与公私合作。"}),
  S("B",[47],{ko:"일본 문부과학성의 2024년 12월 개정 지침(Ver.2.0)은 인간 중심 활용을 원칙으로 삼고, 일률적 금지나 의무화 같은 경직된 운용은 바람직하지 않다고 명시했다.",ja:"日本の文部科学省が2024年12月に改訂した指針（Ver.2.0）は人間中心の利活用を原則とし、一律の禁止や義務付けといった硬直的な運用は望ましくないと明記した。",en:"Japan's education ministry, in its revised December 2024 guideline (Ver. 2.0), made human-centred use the principle and stated that rigid practices such as uniform bans or mandates are undesirable.",ru:"Министерство образования Японии в пересмотренном в декабре 2024 года руководстве (версия 2.0) сделало принципом человекоцентричное использование и указало, что жёсткие меры вроде единообразных запретов или обязательств нежелательны.",zh:"日本文部科学省2024年12月修订的指南（2.0版）以“以人为本的利用”为原则，并明确指出一刀切的禁止或强制等僵化做法并不可取。"}),
  S("B",[37,32],{ko:"중국은 발달 단계별 제한과 전면적 AI 소양교육을 결합했고, 한국은 AI 디지털교과서를 입법으로 '교육자료'로 격하했다.",ja:"中国は発達段階別の制限と全面的なAIリテラシー教育を組み合わせ、韓国はAIデジタル教科書を立法により「教育資料」に格下げした。",en:"China has combined age-tiered restrictions with universal AI literacy, while Korea downgraded AI digital textbooks to 'educational materials' by legislation.",ru:"Китай сочетает ограничения по возрастным ступеням со всеобщей ИИ-грамотностью, а Корея законом понизила ИИ-учебники до статуса «учебных материалов».",zh:"中国将分学段限制与全面的AI素养教育相结合，韩国则通过立法将AI数字教科书降级为“教育资料”。"})
 ]},
 {table:"reg"},
 {p:[
  S("D",[43,40],{ko:"규제는 '평가·선발은 엄격히, 학습 활용은 장려'로 수렴하고 있으며, 이는 대학이 효율화를 노리는 AI 채점·감독 영역을 정면으로 겨냥해 사람이 개입하는 과정 평가로의 전환을 강제한다고 판단한다.",ja:"規制は「評価・選抜は厳格に、学習での活用は奨励」へ収束しつつあり、大学が効率化を狙うAI採点・監視の領域を正面から狙うことで、人が関与するプロセス評価への転換を強いると判断する。",en:"We judge that regulation is converging on 'strict on assessment and selection, encouraging on learning use', squarely targeting the AI grading and proctoring that universities hope will cut costs and forcing a shift to human-in-the-loop process assessment.",ru:"Считаем, что регулирование сходится к формуле «строго к оцениванию и отбору, поощрительно к использованию в обучении», прямо затрагивая ИИ-проверку и прокторинг, на которых вузы надеялись сэкономить, и вынуждая переход к оцениванию процесса с участием человека.",zh:"我们判断，监管正趋向“评估与选拔从严、学习应用鼓励”，这直接针对大学寄望于借以提效的AI评分与监考，迫使其转向有人参与的过程性评估。"}),
  S("D",[43,45,32,37],{ko:"규제 강도의 지역 차이는 '관성·반동(S4)' 확률이 EU·한국에서 더 높고 미국·중국에서 더 낮을 수 있음을 시사한다.",ja:"規制強度の地域差は、「慣性・反動（S4）」の確率がEU・韓国でより高く、米国・中国でより低い可能性を示唆する。",en:"Regional differences in regulatory intensity suggest the probability of 'Inertia/backlash' (S4) may be higher in the EU and Korea and lower in the US and China.",ru:"Региональные различия в жёсткости регулирования говорят о том, что вероятность «инерции/откате» (S4) может быть выше в ЕС и Корее и ниже в США и Китае.",zh:"监管强度的地区差异表明，“惯性/反弹（S4）”的概率在欧盟和韩国可能更高，在美国和中国可能更低。"})
 ]}
],
concise:[{table:"reg"},{p:[S("D",[43,45,37],{ko:"EU는 AI 평가·입학을 고위험으로 규제하고 미국·중국은 활용을 장려하며, 규제는 '평가는 엄격히, 학습은 장려'로 수렴한다.",ja:"EUはAIによる評価・入学を高リスクとして規制し、米国・中国は活用を奨励しており、規制は「評価は厳格に、学習は奨励」へ収束する。",en:"The EU regulates AI assessment and admission as high-risk while the US and China promote use; regulation converges on 'strict on assessment, encouraging on learning'.",ru:"ЕС регулирует ИИ в оценивании и приёме как высокорисковый, США и Китай поощряют использование; регулирование сходится к формуле «строго к оцениванию, поощрительно к обучению».",zh:"欧盟将AI评估与录取作为高风险加以监管，美中则鼓励应用；监管正趋向“评估从严、学习鼓励”。"})]}]},

{id:"redteam",after:"panel",t:{ko:"반론과 레드팀 점검: 이 리포트가 틀릴 수 있는 지점",ja:"反論とレッドチーム検証：本レポートが誤り得る点",en:"Counterarguments and Red-Team Review: Where This Report Could Be Wrong",ru:"Контраргументы и проверка «красной командой»: где отчёт может ошибаться",zh:"反方论证与红队检验：本报告可能出错之处"},
detail:[
 {p:[
  S("D",[25],{ko:"반론 ①: AI 능력이 모형 가정보다 훨씬 빠르게 발전하면(자율 에이전트 등) 대체는 점진적이 아니라 급격하게 올 수 있다.",ja:"反論①：AIの能力がモデルの仮定よりはるかに速く進歩すれば（自律エージェントなど）、代替は漸進的ではなく急激に起こり得る。",en:"Counterargument ①: if AI capabilities advance much faster than assumed (e.g. autonomous agents), substitution could be abrupt rather than gradual.",ru:"Контраргумент ①: если возможности ИИ будут расти гораздо быстрее заложенного в модель (например, автономные агенты), замещение может оказаться резким, а не постепенным.",zh:"反方①：若AI能力的进步远快于模型假设（如自主智能体），替代可能是骤然的而非渐进的。"}),
  S("D",[28,23],{ko:"응답: 거시 생산성 추정은 아직 완만하고 채용 관행의 관성도 크지만(기술기반채용 1/700 미만), 이 꼬리 위험을 반영해 기술 압력 성장률의 사전 불확실성을 넓게 잡았으며 슬라이더로 직접 검증할 수 있다.",ja:"応答：マクロの生産性推計はまだ緩やかで採用慣行の慣性も大きいが（スキルベース採用は1/700未満）、このテールリスクを反映して技術圧力の成長率の事前不確実性を広く設定しており、スライダーで直接検証できる。",en:"Response: macro productivity estimates remain modest and hiring practices are sticky (skills-based hiring under 1 in 700), but we widened the prior uncertainty on tech-pressure growth to reflect this tail risk, and readers can test it with the sliders.",ru:"Ответ: макрооценки производительности пока скромны, а практики найма инерционны (найм по навыкам — меньше 1 из 700), но мы расширили априорную неопределённость роста технологического давления, чтобы учесть этот «хвостовой» риск, и его можно проверить ползунками.",zh:"回应：宏观生产率估计仍较温和，招聘惯例惯性也大（技能导向招聘不足1/700），但我们已放宽技术压力增速的先验不确定性以反映这一尾部风险，读者可用滑块自行检验。"}),
  S("D",[29],{ko:"반론 ②: 한국 사교육비 감소는 AI 대체의 시작일 수 있다.",ja:"反論②：韓国の私教育費の減少はAI代替の始まりかもしれない。",en:"Counterargument ②: the fall in Korean tutoring spending may be the start of AI substitution.",ru:"Контраргумент ②: снижение расходов на репетиторство в Корее может быть началом замещения ИИ.",zh:"反方②：韩国课外辅导支出的下降可能是AI替代的开端。"}),
  S("D",[29,30],{ko:"응답: 참여율은 모든 소득 구간에서 하락했고 돌봄 정책 등 다른 요인이 거론되며, 참여 학생 1인당 지출은 오히려 최고치여서 현재로서는 AI 대체의 직접 증거가 없다.",ja:"応答：参加率はすべての所得区間で低下し、放課後ケア政策など他の要因が挙げられており、参加生徒1人当たり支出はむしろ最高値であるため、現時点ではAI代替の直接的な証拠はない。",en:"Response: participation fell in every income bracket, other factors such as care policy are cited, and spending per participant is at a record, so there is no direct evidence of AI substitution so far.",ru:"Ответ: участие снизилось во всех группах доходов, называются и другие факторы, например политика продлённого дня, а расходы на одного участника рекордны, поэтому прямых свидетельств замещения ИИ пока нет.",zh:"回应：参与率在所有收入组均下降，照护政策等其他因素也被提及，而参与学生人均支出反创新高，因此目前尚无AI替代的直接证据。"}),
  S("D",[9],{ko:"반론 ③: AI 튜터의 효과는 메타분석의 설계 교란으로 과장되었을 수 있다.",ja:"反論③：AIチューターの効果はメタ分析の設計上の交絡で誇張されているかもしれない。",en:"Counterargument ③: AI tutors' effects may be exaggerated by design confounds in the meta-analyses.",ru:"Контраргумент ③: эффект ИИ-тьюторов может быть преувеличен из-за искажений дизайна в метаанализах.",zh:"反方③：AI导师的效果可能因元分析中的设计混杂而被夸大。"}),
  S("D",[6,42,9],{ko:"응답: 동의하며 효과크기를 상한으로 취급했지만, 설계가 우수한 개별 무작위 실험(하버드, 나이지리아)에서도 긍정 효과가 반복되어 '방향'은 유지된다.",ja:"応答：同意し効果量を上限として扱ったが、設計の優れた個別の無作為化実験（ハーバード、ナイジェリア）でも肯定的効果が繰り返し見られ、「方向」は維持される。",en:"Response: agreed — we treat effect sizes as upper bounds — but positive effects recur in well-designed individual RCTs (Harvard, Nigeria), so the direction holds.",ru:"Ответ: согласны и считаем размеры эффекта верхней границей, но положительный эффект повторяется в хорошо спланированных отдельных РКИ (Гарвард, Нигерия), так что направление сохраняется.",zh:"回应：同意，我们已将效应量视为上限；但在设计良好的单项随机试验（哈佛、尼日利亚）中正向效果反复出现，因此“方向”依然成立。"}),
  S("D",[20],{ko:"반론 ④: 학위 프리미엄 통계는 AI 이전 자료여서 빠르게 무너질 수 있다.",ja:"反論④：学位プレミアムの統計はAI以前のデータであり、急速に崩れ得る。",en:"Counterargument ④: degree-premium statistics are pre-AI data and could collapse quickly.",ru:"Контраргумент ④: статистика премии за диплом относится к доИИ-эпохе и может быстро обрушиться.",zh:"反方④：学历溢价统计是AI之前的数据，可能迅速崩塌。"}),
  S("D",[20,21],{ko:"응답: 타당한 비판이며, 그래서 학위 신호(L)를 모형의 핵심 불확실성으로 두고 대졸 불완전고용률을 핵심 조기경보 지표로 지정했다.",ja:"応答：妥当な批判であり、だからこそ学位シグナル（L）をモデルの中核的な不確実性とし、大卒の不完全雇用率を中核の早期警戒指標に指定した。",en:"Response: a fair critique — which is why the degree signal (L) is a key uncertainty in the model and graduate underemployment is designated a core early-warning indicator.",ru:"Ответ: справедливая критика — именно поэтому сигнал диплома (L) — ключевая неопределённость модели, а неполная занятость выпускников назначена ключевым индикатором раннего предупреждения.",zh:"回应：批评合理，正因如此我们把学历信号（L）设为模型的关键不确定性，并把大学毕业生不充分就业率定为核心预警指标。"}),
  S("D",[35],{ko:"반론 ⑤: 성인 학습자와 유학생 유입이 인구 감소를 상쇄할 수 있다.",ja:"反論⑤：成人学習者と留学生の流入が人口減少を相殺し得る。",en:"Counterargument ⑤: adult learners and international students could offset demographic decline.",ru:"Контраргумент ⑤: взрослые учащиеся и иностранные студенты могут компенсировать демографический спад.",zh:"反方⑤：成人学习者与留学生的流入可能抵消人口下降。"}),
  S("D",[19,35],{ko:"응답: 미국 신규 유학생은 17% 줄었고, 일본에서 커지는 리스킬링 수요는 대학보다 기업연수 시장이 흡수하고 있어 상쇄 효과는 제한적이다.",ja:"応答：米国の新規留学生は17%減り、日本で拡大するリスキリング需要は大学より企業研修市場が吸収しているため、相殺効果は限定的である。",en:"Response: new international enrolment in the US fell 17%, and in Japan growing reskilling demand is being absorbed by corporate training rather than universities, so the offset is limited.",ru:"Ответ: набор новых иностранных студентов в США упал на 17%, а растущий спрос на переподготовку в Японии поглощает рынок корпоративного обучения, а не вузы, так что компенсация ограничена.",zh:"回应：美国新入学留学生减少17%，而日本不断增长的再培训需求主要被企业培训市场而非大学吸收，抵消效果有限。"}),
  S("D",[],{ko:"종합하면 반론들은 시나리오의 '순위'보다 '폭'을 바꾸므로 핵심 판단은 유지하되, 확신도를 '중간'으로 표기한 판단은 조기경보 지표로 매년 재검증해야 한다.",ja:"総合すると、反論はシナリオの「順位」より「幅」を変えるため中核判断は維持するが、確信度を「中」と表記した判断は早期警戒指標で毎年再検証すべきである。",en:"Overall, the counterarguments change the width rather than the ranking of the scenarios, so the core judgments stand; but judgments marked 'medium' confidence should be re-tested every year against the early-warning indicators.",ru:"В целом контраргументы меняют ширину, а не порядок сценариев, поэтому ключевые выводы сохраняются; но выводы с «средней» уверенностью следует ежегодно перепроверять по индикаторам раннего предупреждения.",zh:"综合来看，反方论证改变的是情景的“幅度”而非“排序”，因此核心判断成立；但标注为“中等”置信度的判断应每年依据预警指标重新检验。"})
 ]}
],
concise:[{p:[S("D",[25,29,9,20,19],{ko:"다섯 가지 반론(급격한 기술 발전, 사교육 대체, 효과 과장, 학위 붕괴, 인구 상쇄)은 시나리오의 순위보다 폭을 바꾸며, 확신도 '중간' 판단은 매년 재검증이 필요하다.",ja:"五つの反論（急激な技術進歩、私教育の代替、効果の誇張、学位の崩壊、人口の相殺）はシナリオの順位より幅を変え、確信度「中」の判断は毎年の再検証が必要である。",en:"Five counterarguments (rapid tech progress, tutoring substitution, exaggerated effects, degree collapse, demographic offset) change the width rather than the ranking of scenarios; 'medium'-confidence judgments need yearly re-testing.",ru:"Пять контраргументов (быстрый технологический прогресс, замещение репетиторства, преувеличенный эффект, обвал диплома, демографическая компенсация) меняют ширину, а не порядок сценариев; выводы со «средней» уверенностью требуют ежегодной перепроверки.",zh:"五项反方论证（技术骤进、辅导被替代、效果被夸大、学历崩塌、人口被抵消）改变的是情景幅度而非排序；“中等”置信度的判断需每年复核。"})]}]}

sec:{
summary:{t:"Key Judgments (Executive Summary)",
 d:[[["AI is rapidly unbundling the functions of universities and private tutoring (explanation, practice, feedback, homework help), but it is unlikely to replace the institutions of degrees and admissions by 2035.","The function-side sources (6·10) are grade-A causal evidence and the institution-side sources (20·23) are grade-B official or large-scale data; the judgment combines the difference in speed between the two layers."],
  ["In the MCMC simulation (global baseline), the most likely path to 2035 is a contest between 'Great bifurcation' ({S2}) and 'Augmented co-evolution' ({S1}), followed by 'De-credentialing' ({S3}) and 'Inertia/backlash' ({S4}).","Figures are posterior predictive means from the model in §13 and change with region and assumptions. Because the model structure and indicator coding are themselves judgments, read them as structured judgment, not precise probabilities."],
  "The decisive variable for learning is not whether AI is used but its design (guardrails, scaffolding, assessment); unguarded use can raise performance while damaging independent learning.",
  "The primary driver of the university crisis is not AI but demography, finances and falling international enrolment; AI is an accelerator that erodes the differentiation of mid-tier universities built on 'lecture delivery'.",
  "Korean private tutoring spending fell for the first time in five years, yet spending per participating student hit a record — a 'smaller but more intense' polarisation phase.",
  "The signalling value of degrees is robust in the short term; the more real risk is that AI compresses the training tasks once given to new hires, weakening the 'first-job ladder'."]],
 c:[["AI rapidly unbundles the functions of education, but the institutions of degrees and admissions are expected to hold until 2035.","In the simulation, 2035 is a contest between 'Great bifurcation' ({S2}) and 'Augmented co-evolution' ({S1}).","Design, not the mere presence of AI, drives learning outcomes; demography and finance drive the university crisis.","Korean tutoring spending is falling in total while per-student spending hits a record, deepening polarisation."]]},
frame:{t:"Problem Definition and Analytical Framework",
 d:[["This report diagnoses the impact of generative AI on universities (higher education) and private tutoring (cram schools, tutors, homework help, edtech) using evidence available as of November 2026, and estimates scenario probabilities for the target year 2035.",
  "The starting point is the OECD distinction that successfully completing a task is not the same as learning; we therefore read AI's effects separately as 'performance' and 'learning'.",
  ["The future is summarised along three axes: ① AI's pressure to substitute and reconfigure (A), ② the institutional adaptability of schools and policy (I), and ③ the labour-market signalling value of degrees and admissions (L).","The three axes bundle the independent drivers the evidence points to into the smallest number. Demographic pressure (D) is highly certain, so it is treated as a moderator rather than an axis."],
  "On top of this, demographic pressure (D), which is highly certain for each country, acts as a moderator that erodes institutional adaptability.",
  "Every sentence carries an evidence grade (A: Q1 papers and official statistics; B: international organisations, governments and representative surveys; C: press, companies and industry data; D: Claude's analytic inference) and source numbers; clicking a number shows the verbatim quote, critique and judgment."],0],
 c:[["We separate AI's effects into 'performance' and 'learning' and project 2035 with three axes — tech pressure (A), institutional adaptability (I), degree signal (L) — plus demographic pressure (D)."],0]},
adoption:{t:"Present ①: AI Has Become the Default for Learning",
 d:[["In the UK HEPI survey, the share of undergraduates using AI in any form jumped from 66% in 2024 to 92% in 2025 within a single year.","In the 2026 survey (fielded December 2025), 95% used AI and 94% used generative AI for assessed work — effectively saturation.","In Korea, 91.7% of university students with generative-AI experience said they had used AI to search for material for assignments and projects.","HEPI reported higher use among male students, STEM majors and the socio-economically advantaged, suggesting that a usage gap is widening even as use becomes universal."],
  "Institutions lag behind",
  ["By contrast, only 36% of students felt their institution encouraged AI use and only 38% said the institution provided AI tools.","According to an OECD report citing a UNESCO survey, only 19% of higher-education institutions had a formal AI policy.","37% of lower-secondary teachers used AI for work in 2024 and 72% worried about academic integrity, so adoption on the teaching side is far slower than among students.","As an exception, the California State University system gave more than 460,000 students access to ChatGPT Edu, declaring a system-wide rollout.","China's Ministry of Education, in 2025 guidelines, barred primary pupils from using open-ended generative AI on their own while requiring a tiered AI-literacy curriculum.","The essence of the current phase is therefore the gap between universal use and immature institutions, and we judge the speed of closing this gap to be the first variable that separates the scenarios.","The gap also means learning is migrating to free consumer tools outside institutional control, creating data-protection, equity and assessment-reliability problems at the same time."],0],
 c:[["UK undergraduate AI use saturated from 66% to 95% in two years, yet only 36% feel encouraged by their institution and only 19% of institutions have a formal policy.","The gap between universal use and immature institutions is the core of the current phase."],0]},
learning:{t:"Present ②: Evidence on Learning — the 'Performance ≠ Learning' Paradox",
 d:["Positive evidence",
  ["In an RCT in a Harvard physics course, students using an AI tutor designed on learning-science principles learned significantly more in less time than those in an active-learning class.","A meta-analysis of 51 studies estimated ChatGPT's effect on learning performance at g = 0.867 and on higher-order thinking at g = 0.457.","Another meta-analysis of 69 experimental studies also confirmed gains in achievement but found no change in self-efficacy."],
  "Counter-evidence and methodological critique",
  ["However, a 2026 critical review in Computers & Education pointed out that many studies in both meta-analyses used 'media comparison' designs that may have mistaken differences in instructional design and time for AI effects.","In a field experiment with about 1,000 Turkish high-school students, those using a generic ChatGPT-style tool improved in practice but scored 17% lower than the control group on an exam after the tool was removed.","In the same experiment, 'GPT Tutor', which embedded learning-protecting prompts, largely offset this negative effect.","In an experiment with 117 university students, the ChatGPT group raised essay scores the most but showed no difference in knowledge gain or transfer, which the researchers called 'metacognitive laziness'.","The OECD Digital Education Outlook 2026, synthesising this evidence, concluded that the performance advantage of general-purpose chatbots can vanish or reverse in exams without the tool."],
  0,"Judgment",
  ["'Does AI improve education?' is therefore the wrong question; the right one is 'under which design, measuring what, and when?'","Since g ≈ 0.87 is unusually large for an educational intervention, we expect the real lasting effect to be considerably smaller once publication bias and short-term proximal measurement are accounted for.","Because two independent experiments (high-school maths and university writing) showed the same pattern, the path 'unguarded use → dependence → weaker independent performance' is fairly credible.","The same conclusion applies to private tutoring: answer-giving AI erodes the homework-help market, while learning-design AI becomes a new product combined with human coaching."]],
 c:[["Designed AI tutors outperformed active-learning classes in an RCT, and a meta-analysis reported a large effect (g = 0.867).","But unguarded use lowered exam scores without the tool by 17%, and the meta-analytic effect sizes are likely inflated by design confounds.","The decisive variable is design, not the presence of AI."],0]},
univ:{t:"Present ③: Structural Pressure on Universities — Demography, Finance, Geopolitics",
 d:[["US high-school graduates are projected to peak at about 3.9 million in 2025 and then fall by about 13% through 2041.","Japan's Central Council for Education projected that university entrants will fall from about 630,000 to about 460,000 in 2040, roughly 73% of current capacity.","In FY2025, 53.2% (316) of Japan's private universities were under-enrolled — an improvement on the previous year due to a temporary rise in 18-year-olds.","In April 2026 the Fiscal System Council proposed cutting about 250 private universities by 2040, and government documents state that national-university capacity will be reviewed and private universities restructured and merged.","Korea is steeper still: KDI projects the university-eligible cohort to nearly halve from 442,000 in 2030 to 227,000 in 2040.","The National Assembly Futures Institute warned that, with capacity unchanged and recent progression rates, the freshman fill rate could fall to 39.4% by 2043.","Filling the demographic gap with international students is also less reliable: new international enrolment in the US fell 17% in autumn 2025."],
  0,"Judgment: AI is an accelerator, not the cause",
  ["These data show clearly that the primary drivers of the university crisis are demography, finance and geopolitics, not AI.","AI is an accelerator on top: if designed AI tutors deliver effects comparable to high-quality teaching at low cost, the differentiation of mid-tier universities built on 'lecture delivery' erodes.","Conversely, top universities with research, networks, brands and in-person experience are likely to absorb AI as a productivity tool and widen the gap.","We judge that Japan is on a path of policy-led restructuring, with fiscal authorities targeting the number of universities, while Korea, slow to adjust capacity, risks a path closer to market exit."]],
 c:[["The US falls 13% after a 2025 peak, Japan drops to 460,000 entrants in 2040 (73% of capacity), and Korea's eligible cohort halves to 227,000 by 2040.","The main driver of the university crisis is demography and finance; AI accelerates the erosion of mid-tier differentiation."],0]},
labor:{t:"Present ④: The Labour Market and the Signalling Value of Degrees",
 d:[["On OECD average, bachelor's graduates earn 39% and master's/doctoral graduates 83% more than upper-secondary graduates, so the degree premium remains large.","Despite corporate pledges to drop degree requirements, skills-based hiring actually changed fewer than 1 in 700 hires in 2023.","Meanwhile, the unemployment rate of recent US graduates (ages 22–27) eased to 5.2% in the latest update, but underemployment in jobs not requiring a degree reached 42.5%.","New York Fed research attributes 64% of the rise in young graduate unemployment to remote work, a check on the claim that 'AI killed entry-level jobs'."],
  "How AI changes the content of jobs",
  ["An LLM exposure analysis estimated that about 80% of US workers could see at least 10% of their tasks affected, with higher-income jobs more exposed.","In experiments, ChatGPT cut professional writing time by 40% and raised quality by 18%.","In a customer-support field study, AI assistance raised average productivity by 14% and that of novice and low-skilled workers by 34%.","The WEF expects 39% of workers' core skills to change or become outdated by 2030.","Yet a conservative estimate puts total factor productivity gains over the next decade at no more than 0.66%, so the speed of labour-market impact is highly uncertain."],
  "Judgment",
  ["AI raising novice productivity means compressing the experience curve, but it also weakens firms' incentive to give new hires training tasks.","We therefore judge that the signalling value of degrees holds in the short term, while the weakening of the 'first-job ladder' degrees used to guarantee is the more real risk.","Demand for universities will shift from 'degree alone' to a package of 'degree + verified AI-collaboration skills + field experience'."]],
 c:[["The bachelor's wage premium (+39%) and the meagre impact of skills-based hiring (1 in 700) show the degree signal is robust.","AI compresses entry-level work (novice productivity +34%), so the real risk is a weaker 'first-job ladder'."]]},
shadow:{t:"Present ⑤: Private Tutoring — What Gets Replaced and What Gets Stronger",
 d:["Korea: smaller in scale, more intense",
  ["Korea's total K-12 private tutoring spending in 2025 was KRW 27.5 trillion, down 5.7% from the record 2024 (KRW 29.2 trillion) — the first fall in five years.","The participation rate also fell 4.3 points, from 80.0% to 75.7%.","However, monthly spending per participating student hit a record KRW 604,000, and only the two extreme brackets of the spending distribution grew.","Households earning KRW 8 million or more a month spend about three times as much on tutoring as those earning under KRW 3 million.","The Ministry of Education said falling student numbers alone cannot explain the decline, and multiple factors such as expanded after-school care are cited.","AI digital textbooks were downgraded to 'educational materials' just one semester after their 2025 introduction, sharply narrowing the route for spreading AI-personalised learning through public schools."],
  "Japan, China, the US",
  ["Japan's cram-school and prep-school market is supported by middle-school entrance-exam demand and fee increases but is stagnating, especially outside major cities.","The AI learning system atama+ is used in more than 4,000 classrooms nationwide, spreading a division of labour in which 'AI teaches and people coach' across Japan's tutoring industry.","China tightly regulated the tutoring industry with its 2021 'Double Reduction' policy, but a Q1 qualitative study reports that K-12 shadow-education demand persists as restrictions gradually loosen.","US homework-help platform Chegg cut about 45% of its staff in October 2025, citing 'the new realities of AI' and a sharp drop in Google traffic.","Global edtech venture investment was about $2.4 billion in 2024, the lowest since 2015, and capital is being reallocated to AI and workforce training."],
  0,"Judgment: tutoring absorbs AI rather than being replaced by it",
  ["Korean tutoring has entered a 'smaller but more intense' polarisation phase, and there is no evidence yet to read the fall in total spending as AI substitution.","The cases show a split between 'replaced tutoring' (answers, explanations, homework services) and 'strengthened tutoring' (admissions strategy, motivation management, coaching, information).",
   ["Because tutoring demand stems not from lack of knowledge but from competition for a positional good in rank-based admissions, competition itself will not disappear even if AI lowers the cost of learning.","An inference combining the Q1 evidence that even China's strong regulation (Double Reduction) failed to remove demand (38) with the rise in spending by Korean high-school participants (30)."],
   "If anything, once everyone uses AI, differentiation shifts to human coaching, information and networks that AI cannot easily replace, so the premium for high-end tutoring may grow.","In Korea, the AI gap in public schooling (the AIDT downgrade) risks handing the market to private tutors who have productised AI-based study management."]],
 c:[["Korean tutoring spending fell to KRW 27.5 trillion (−5.7%), but spending per participating student is a record (KRW 604,000 a month).","Homework-service models (Chegg) are collapsing while coaching hybrids (atama+) spread, and China's regulation failed to remove demand.","Tutoring is more likely to absorb AI and enlarge the premium for high-end coaching than to be replaced by it."],0]},
assess:{t:"The Crisis of Assessment and Trust",
 d:[["In HEPI 2025, 59% of students said the way they are assessed had changed 'a lot' because of AI.","In November 2025, mass AI-assisted cheating in an online general-education course at Yonsei University exposed the limits of remote assessment.","AI detectors consistently misclassify non-native English writing as AI-generated, so detection-centred responses create fairness problems.","The centre of gravity of assessment must therefore shift from 'checking outputs' to 'proving the process' (oral exams, in-person performance, version histories, project portfolios).","Process-based assessment is costly in staff time, so wealthier universities will switch first and the gap in degree credibility will widen.","Ultimately the value of a degree will be redefined as 'has it verified what the holder can do with AI — and without it?'"]],
 c:[["AI detectors misclassify non-native writers and remote exams are vulnerable to mass cheating, so assessment must shift to 'proof of process'."]]},
compare:{t:"Country Comparison: Korea, Japan, US, China",d:[0,["The four countries face the same technological shock but differ in demographic pressure and policy style, so we judge they are likely to diverge onto different paths."]],c:[0]},
scen:{t:"Outlook: Four Scenarios for 2035",d:[["The scenarios are defined by decision rules on the 2035 values of the three axes (A, I, L) and are mutually exclusive; their probabilities are estimated by MCMC in the next section."],0],c:[0]},
mcmc:{t:"MCMC Simulation: Scenario Probability Distribution",
 d:[[["The model is a Bayesian measurement model that treats the 2026 levels of the three axes as latent variables and uses 16 indicators coded from the evidence as observations with measurement error.","Indicator scores are judgment values converting the evidence into a 0–1 scale; each indicator's standard deviation (σ) is larger for lower-grade evidence (A ≈ 0.07–0.12, C ≈ 0.15)."],
  "Annual change rates for each axis have evidence-based priors, demographic pressure (D) enters as a moderator that reduces growth in institutional adaptability, and exogenous shocks to 2035 are modelled as normal.","Posterior distributions are drawn with four Metropolis–Hastings chains and convergence is checked with R-hat; then 2035 paths are generated repeatedly for each posterior draw to compute the 'distribution of the scenario probability itself'.","Changing the region (global, Korea, Japan, US), growth assumptions or scenario thresholds in the panel below re-runs the MCMC in your browser."],
  0,["Under default settings Korea shows a higher probability of 'Great bifurcation' than the global baseline, because high demographic pressure and the AIDT reversal lower its estimated institutional adaptability.","One of the model's key uncertainties is the change rate of the degree signal (L); making this prior slightly more pessimistic quickly raises the probability of 'De-credentialing'."]],
 c:[["We estimated the current values of the three axes from 16 evidence indicators with Bayesian methods and generated 2035 paths repeatedly to obtain scenario probability distributions (re-runnable in the browser)."],0]},
panel:{t:"Expert Panel of 10 Consultant Personas",
 d:[[["To complement the model with outside perspectives, we posited 10 fictional consultants from different fields and constructed the scenario probabilities and recommendations each would give after reading the same evidence.","The personas are not real people; they are judgment devices Claude built to deliberately reflect typical professional biases (e.g. a restructuring focus for finance experts, technology optimism for VCs)."],
  "Panel aggregation shows linear pooling (mean) and log pooling (geometric mean) together and compares them with the MCMC result to reveal the gap between model and expert intuition."],0],
 c:[0]},
signals:{t:"Early-Warning Indicators and Falsification Conditions",
 d:[["The indicators below are the signals that will first reveal a shift between scenarios, chosen so they can be tracked with public statistics updated every year."],0,
  ["The core judgment of this report ('the institutions are robust') should be revised immediately if the share of large employers hiring graduates through AI-based skills verification instead of degrees rises meaningfully.","Likewise, if the harm of unguarded AI use is not replicated in long-term follow-up studies, the weight of the 'design is the variable' judgment should be lowered."]],
 c:[0]},
strategy:{t:"Strategic Recommendations by Stakeholder",
 d:["Universities",["Universities should hand 'lecture delivery' to AI tutors and redeploy faculty time to process assessment, project supervision and industry links.","Providing institutional AI with learning-protecting guardrails, rather than unrestricted general-purpose chatbots, is better for both learning and equity.","Mid-tier universities in Korea and Japan facing the demographic cliff gain more bargaining power by deciding early on mergers, alliances or a shift to adult re-education than by trying to survive alone."],
  "Tutoring and edtech",["Answer-and-explanation products will see their price driven to zero by general-purpose AI, so they should pivot to services combining study management, motivation, admissions information and coaching.","Providers with independently verified evidence of effectiveness (randomised experiments, long-term follow-up) will win parents' trust and public procurement first."],
  "Governments",["Policy should prioritise 'verifying effects and redesigning assessment' over 'speed of adoption'; Korea's AIDT case teaches that full rollout without verification invites a political reversal.","If public schools do not provide guardrailed AI tutors free of charge, AI will spread along income lines and deepen tutoring polarisation."],
  "Students, parents, employers",["Students and parents should regularly check whether they can explain and apply material without AI, rather than just 'finishing faster' with it.","As AI compresses the training tasks of new hires, firms risk breaking their mid-career talent pipeline unless they deliberately design apprenticeship and rotation programmes."]],
 c:[["Universities should hand lectures to AI and move to process assessment; tutors should pivot from answers to coaching hybrids; governments should prioritise verification and provide guardrailed AI for free; firms should redesign apprenticeships for new hires."]]},
method:{t:"Methodology, Evidence Grades and Limitations",
 d:[[["Academic evidence was limited to papers in SJR Q1 journals, and preprints before peer review (e.g. EEG-based 'cognitive debt when using ChatGPT' studies, working papers on entry-level employment) were deliberately excluded.","Q1 classification follows each journal's latest SJR subject quartile and may differ by field. For some Q1 papers, the quote was taken from the WP/arXiv abstract of the same study instead of the published version; this is noted on the source."],
  "Government statistics, international-organisation reports and representative surveys with disclosed methods are grade B; press reports, company announcements and industry estimates are grade C and were used only for directional judgments.","Quotes are limited to one per source and under 15 words; everything else is summarised or paraphrased.","First limitation: most studies of AI learning effects are short-term (under two years), so there is no evidence on long-term skill formation.","Second, the indicator coding and decision rules of the MCMC model are themselves the analyst's judgments, so the output probabilities are 'structured subjective probabilities' that make assumptions transparent, not objective frequencies.","Third, non-OECD regions such as China and India, and vocational and lifelong-learning markets, could not be covered in depth due to data access limits."]],
 c:[["Academic evidence is limited to Q1 papers and quotes to one per source; read the simulation probabilities as 'structured subjective probabilities'."]]},

},
ev:{
1:["A disclosed-method survey of 1,041 UK full-time undergraduates, weighted by gender and institution type, margin of error ±3%. But 'use' is self-reported, does not distinguish intensity or quality of purpose, and generalisation beyond the UK is limited.","We judge that generative-AI use in universities of high-income countries has already reached universality. The skew towards male, STEM and higher-income students is read as a signal of a widening gap."],
2:["Fielded by Savanta in December 2025, n = 1,054, with the same design three years running, allowing trend comparison. The sponsor (Kortext) is a digital-textbook company, but the direction of the result (weak institutional response) does not serve the sponsor.","We judge the gap between 95% student use and 36–38% institutional encouragement/provision to be the core structure of this phase; it is the main reason the current value of the 'institutional adaptability' axis is set low."],
3:["A national research-institute survey, but the population is limited to 'students with generative-AI experience', so reading it as the rate for all students overstates use. Confirmed second-hand via a press citation rather than the original report.","We trust the direction that AI has become a basic learning tool in Korean universities, but interpret the figure only as 'share of users who use it this way'."],
4:["The UNESCO survey is a convenience sample centred on UNESCO Chair and UNITWIN institutions, so representativeness is weak. In the same survey about two-thirds 'have or are developing' a policy, so the framing changes the impression greatly.","With 19% having a formal policy and 42% developing one, we judge institutionalisation to be 'in progress but incomplete'. Because a policy's existence does not guarantee implementation quality, we keep the value low."],
5:["A literature synthesis rather than primary research, and many cited studies are short and small. Still, as an international-organisation synthesis it balances conflicting evidence (performance up, learning flat) and adds representative figures such as TALIS 2024 (37% of teachers using AI).","We adopt the separation of performance and learning as the analytical axis of the whole report, and judge that AI designed for education must be evaluated separately from general-purpose chatbots."],
6:["A crossover RCT with high internal validity, but external validity is limited to an introductory Harvard physics course, two weeks and a single topic. Comparing against well-designed active learning is a strength, but the post-test is short-term and proximal, so long-term retention is unverified.","We judge that an AI tutor designed on learning-science principles can be at least as effective as high-quality teaching — a core basis for the substitutability of lecture-centred institutions."],
7:["Pools 51 studies from Nov 2022 to Feb 2025, but many are small or quasi-experimental and heterogeneity is large (significant moderation by course and duration). 0.867 is unusually large for an educational intervention, so publication bias and 'media comparison' confounding should be suspected (source 9).","We treat the direction of the effect as positive but its size as an upper bound; in the simulation this source's standard deviation was widened to prevent over-confidence."],
8:["Better than correlational work because it selects only experiments, but it is heavily skewed to universities and language learning. Achievement and affective motivation rose while self-efficacy did not, consistent with 'external help raises performance without raising felt competence'.","Since two independent meta-analyses (7·8) point the same way, we judge short-term achievement gains to be robust; the unchanged self-efficacy is a warning linked to dependence risk (10·11)."],
9:["A methodological critique re-examining studies included in sources 7·8, arguing that 'ChatGPT vs no treatment' comparisons may have measured differences in instructional design, time and feedback rather than the medium. Note it is a journal pre-proof.","We reject interpreting the large meta-analytic effect sizes as a 'media effect'. This strengthens the report's judgment that the effect comes from design more than from AI itself."],
10:["A field RCT with about 1,000 Turkish high-school students and high ecological validity. Single country and maths only; the 17% drop for 'GPT Base' after tool removal is short-term, and long-run cumulative effects are unknown.","We adopt it as the strongest causal evidence that unguarded AI produces the paradox 'practice performance up, independent performance down'. That guardrails (GPT Tutor) largely offset the harm underpins the core judgment that design is the variable."],
11:["A lab study randomising 117 university students to four conditions, with the strength of analysing learning-process logs (SRL processes). The sample is small and the task is a single non-native (English) essay, so generalisation needs care.","We see the result — essay scores up but no difference in knowledge gain or transfer — as independent evidence converging with source 10, and judge metacognitive offloading a risk factor for long-term skill formation."],
12:["A projection based on births and enrolment by grade, a highly reliable time series built since 1979. Migration and graduation-rate changes add error, but short-run error is small because it rests on birth cohorts from 18 years earlier.","We judge a roughly 13% decline in US university demand after the 2025 peak to be a virtually 'settled future', with heavy pressure on universities outside the South."],
13:["An official projection by a government council (low-fertility assumption), highly reliable. The range is 460,000–510,000 depending on progression-rate assumptions, and a separate scenario with more international students exists.","We judge that about a quarter of Japan's university capacity will become structurally surplus by 2040; large-scale restructuring was unavoidable even before AI."],
14:["Confirmed via an analysis by a researcher at the National Institute for Educational Policy Research rather than the Council's original materials; the author notes it is unclear how a 140,000-seat cut translates into 252 fewer universities.","More than the precision of the figures, the key fact is that fiscal authorities have begun to treat the number of universities as a policy target; Japan is following a policy-led rather than market-exit restructuring path."],
15:["A news-agency report of a near-census survey (594 universities) by the Promotion and Mutual Aid Corporation, so the figure is reliable. The 2025 improvement reflects a temporary rise in 18-year-olds and is not a trend reversal.","With more than half of private universities under-enrolled while applicants concentrate on top universities, we judge bifurcation to be already under way."],
16:["A primary government document directly showing policy intent, but at the planning stage ('will proceed'); concrete means and scale are to be set in the Basic Policy, so implementation strength is uncertain.","We judge Japan's university restructuring likely to enter the policy stage after 2027 — a factor raising institutional adaptability (I) top-down."],
17:["A press report of a national think-tank projection relying on assumptions about births and the average CSAT participation rate. Its direction matches Statistics Korea's projection (about 260,000 18-year-olds in 2040) but levels differ.","We judge Korea faces one of the worst demand cliffs in the OECD, with entrants nearly halving in ten years; non-metropolitan private universities are the most affected."],
18:["A 'no-response' scenario with fixed capacity and the recent average progression rate (73.2%), close to the worst path. Responses such as capacity cuts or attracting international students would change the figure.","We use it as a 'warning value' that the system becomes unsustainable in the 2040s if the current capacity structure is kept, not as a baseline projection."],
19:["A snapshot of responses from 825 institutions, not a census, to be finalised in Open Doors 2026. The decline stems from geopolitical factors such as visa policy — its independence from AI is itself analytically important.","We judge that the financial buffer of universities dependent on international-student revenue has weakened, and the strategy of offsetting demographic decline with international students has become more uncertain."],
20:["Comparable official statistics across member countries, but these are cross-sectional wage gaps, not causal returns net of ability selection, and mostly reflect years before AI diffusion.","We judge the degree premium to be robust so far in the early phase of AI diffusion — the basis for setting the current value of the signal axis (L) high."],
21:["A reliable official analysis based on the CPS. In the same update underemployment rose to 42.5%, so a lower unemployment rate alone does not mean improvement; no decomposition by cause (AI, cycle, remote work) is provided.","We judge the deterioration in the quality of recent graduates' first jobs to be real, but leave AI's contribution undetermined."],
22:["A secondary press summary of Fed research, and the remote-work estimate is model-dependent. However, the timing argument that the rise began before AI can be verified independently.","We judge the narrative blaming AI alone for weaker entry-level hiring to be exaggerated; AI is a future risk but not the main cause so far."],
23:["Combines large-firm job postings with actual hiring data, a strength in separating pledges from practice. Centred on large US firms and based on 2023, so it does not reflect the spread of AI-based skills verification since.","We judge that dropping degree requirements is largely symbolic while actual hiring still uses degrees as a signal — a core reason the barrier to the 'de-credentialing' scenario is high."],
24:["A survey of the expectations of 1,000+ large employers, not measurement. The figure fell from 57% (2020) and 44% (2023) to 39%, so the forecast itself is volatile and mixes employer optimism and pessimism.","We judge reskilling pressure to be large but closer to partial reconfiguration than wholesale replacement; used only as evidence of demand for curriculum reform."],
25:["An exposure estimate, not actual substitution or employment effects. Most authors are from OpenAI and GPT-4 was used as a classifier, raising conflict-of-interest and circularity concerns.","We accept that AI's impact spans highly educated, high-income jobs, but do not read it as a forecast of job losses. That graduate jobs are most exposed forces universities to redefine their value proposition."],
26:["A pre-registered online experiment (n = 453) with solid causal inference, but the 20–30-minute standardised writing tasks demand little factual accuracy or context, so real-work effects may be smaller.","We judge AI greatly compresses routine writing work of graduate white-collar jobs; that this work used to be training for new hires underpins the 'career ladder' risk."],
27:["Field evidence with high external validity from the staggered rollout to 5,179 support agents. Single firm and single job; figures may differ slightly between the journal and WP versions, so we state that the WP is the basis.","We judge AI spreads experts' tacit knowledge to novices, compressing the experience curve — in educational terms, AI replaces part of apprenticeship-style training."],
28:["Relies on a task-based model and existing exposure and cost-saving estimates, and is criticised for underestimating new-task creation and deepening automation. Still an important conservative benchmark against hype.","We reflect the estimate of ≤0.66% TFP growth over ten years as grounds for a 'slow diffusion' scenario, and use it as counter-evidence capping the tech-pressure axis (A)."],
29:["Government-approved statistics covering about 74,000 students in some 3,000 schools nationwide — the most reliable source. But it cannot capture free substitutes such as EBS, after-school programmes or free online AI tools.","The 2025 fall in total spending (−5.7%) is real and larger than the fall in student numbers (−2.3%), so behavioural change is mixed in; there is no basis to attribute it to AI substitution."],
30:["A report of the Q&A at the official statistics release, so the facts are reliable; 'entrenched polarisation' is the report's interpretation and needs checking against distribution data.","Based on record spending of KRW 604,000 a month per participant and +2.6% spending by high-school participants, we judge admissions-driven tutoring demand to be firm and spending concentrating at the top."],
31:["An official indicator based on national statistics. Income and region (concentration in Seoul) are confounded, so care is needed in reading it as a pure income effect.","Because access to tutoring is strongly tied to income, we judge paid AI study-management services are likely to spread along the same gradient."],
32:["The legal amendment itself is certain. The figures of about 33% adoption and under 10% actual access are quoted from parliamentary remarks and need independent verification; the outlet's political perspective should also be considered.","We judge Korea a case of politically withdrawing the spread of AI-personalised learning through public schools — a downward factor for institutional adaptability (I). The vacuum is likely to be filled by private tutoring and platforms."],
33:["Company disclosures relayed by the press: the facts (388 jobs, about 45%) are verifiable but the attribution is the company's own explanation. Google's AI summaries also changed search, so the effect cannot be isolated as 'AI-tutor substitution' alone.","We judge the answer-and-explanation 'homework help' market to be the first segment collapsed by general-purpose AI."],
34:["Data from a private market-research firm with undisclosed scope. Another post by the same firm says 'lowest since 2014', so the base year is inconsistent; 2025 rebounded slightly to about $2.6 billion.","We judge that after the pandemic bubble, edtech capital moved from volume to AI and workforce training, and K-12 consumer models are less attractive to investors."],
35:["A private estimate based on providers' sales, with method details in a paid report. Market-size figures vary widely across firms (e.g. about ¥985 billion), so we trust direction more than level.","We judge Japan's tutoring market to be in 'polarisation within stagnation', sustained by price increases and middle-school entrance exams amid low birth rates; growth in corporate training shows reskilling demand shifting."],
36:["A company's own announcement with no independent verification or peer-reviewed evidence on learning effects; still, the classroom count as a business metric is unlikely to be false.","We judge the split 'AI teaches, people coach' to be becoming the mainstream model of the tutoring industry — tutoring is absorbing AI rather than being replaced by it."],
37:["A state-media report: accurate in conveying policy content but not implementation; cross-checked against the original (2025 guide on generative AI use in primary and secondary schools) and the CSET translation.","We judge China has chosen a top-down model of 'age-tiered restrictions plus universal AI literacy' — fast institutional adaptation but limited autonomy and assessment diversity."],
38:["Published in a Q1 journal, but a three-year longitudinal qualitative study of 10 Beijing tutors, so market size cannot be estimated. The observation that regulation shifted from strict to looser matches other policy literature.","We judge that even strong state regulation could not eliminate shadow-education demand created by admissions competition; the root of demand is the selection structure, not technology or supply."],
39:["A vendor's promotional material: 'largest' is its own claim, and contract terms and actual usage are undisclosed. The context that CSU adopted it amid a threatened $375 million budget cut (Axios) should also be considered.","We judge large public systems have begun adopting AI as cost-efficient learning-support infrastructure; access expands, but learning effects need separate verification."],
40:["A small sample of 91 TOEFL essays and 88 US eighth-grade essays, based on 2023 detector versions, so later improvements are unverified. But the mechanism — a structural limit of perplexity-based detection — is robust.","We judge misconduct responses relying on detection technology unsustainable on both fairness and accuracy; a shift of assessment to 'proof of process' is inevitable."],
41:["A report on an individual incident, so scale and frequency cannot be generalised. Non-AI cheating (e.g. via open chat rooms at Korea University) was reported at the same time, showing the core problem is remote-assessment design, not AI alone.","Used as 'case evidence' that assessment systems even at top Korean universities have not kept up with AI, not as statistical evidence."]
},
scen:{S1:{n:"Augmented co-evolution",d:["Universities and tutors adopt guardrailed AI together with process-based assessment; AI takes on explanation and practice while people are reorganised around design, coaching and assessment.","Designed AI tutors are provided free or cheaply in public schools and universities, democratising learning gains and curbing the rise of the tutoring premium.","Degrees are redefined to include verified AI-collaboration skills, preserving their signalling value."],w:"Sharp rise in formal AI-policy adoption, spread of process assessment, flat per-student tutoring spending"},
 S2:{n:"Great bifurcation",d:["Top universities and premium tutoring absorb AI as a productivity tool and grow stronger, while mid- and lower-tier universities reliant on lecture delivery merge or exit as the demographic cliff hits.","With degree and admissions signals intact but institutions slow to respond, the harms of unguarded AI use and distrust of assessment concentrate at the bottom.","Tutoring spending shrinks in total but rises at the top, expanding a premium 'AI + human coaching' market."],w:"Continued rise in per-student tutoring spending, under-enrolment above 60% at private universities, stalled institutional AI policies"},
 S3:{n:"Unbundling / de-credentialing",d:["Employers select graduates directly through AI-based skills verification and portfolios, weakening the signalling value of degrees.","The university's functions unbundle into teaching, credentials, networks and research, divided among micro-credentials, corporate academies and AI-tutor platforms.","Weaker admissions competition shrinks exam-prep tutoring while the adult reskilling market grows."],w:"Skills-based hiring affecting more than 1 in 50 hires, graduate underemployment above 47%, shrinking degree wage premium"},
 S4:{n:"Inertia / backlash",d:["Accumulated harms to learning, cheating and privacy problems strengthen regulation and social backlash, and AI use in education stalls.","Macro productivity effects prove smaller than expected and labour-market shocks are mild, so the existing university and admissions order persists.","Demographic pressure still operates, so university restructuring proceeds regardless of AI."],w:"Tighter laws regulating AI in education, stalled teacher AI use, harms replicated in long-term studies"}},
pers:{1:{n:"Strategy Partner A",r:"Global strategy consultancy · higher-education practice lead",lens:"Portfolio restructuring and winner-take-all dynamics",v:"With the demographic cliff locked in, AI strengthens the economies of scale of top brands. The middle becomes an undifferentiated middle and is squeezed first.",sig:"Applicant share of the top 10% of universities",mv:"Mid-tier universities should decide on specialisation or alliance before 2028"},
 2:{n:"Restructuring Expert B",r:"University finance and M&A advisory",lens:"Cash flow, fill rates, debt structure",v:"Only financially strong universities can afford AI investment. Under-enrolled institutions cannot even bear the cost of an AI transition, so bifurcation completes in finance first.",sig:"Share of loss-making private universities and fill rates",mv:"Negotiate voluntary mergers or downsizing while you still have financial strength"},
 3:{n:"Edtech VC C",r:"Partner at an education and workforce-training VC",lens:"Unit economics and platform scalability",v:"The marginal cost of a designed AI tutor is close to zero. If public systems procure it at scale, learning gains are democratised and unbundling advances fast on the workforce-training side.",sig:"Number of bulk AI-tutor procurement contracts by universities and school boards",mv:"Invest in products with verified learning design, not answer-giving ones"},
 4:{n:"Labour Economics Adviser D",r:"HR strategy consultant, former labour economist",lens:"Entry-level hiring structure and career ladders",v:"The degree signal is still strong, but the training tasks of new hires are being compressed by AI. If entry into first jobs is blocked, the degree premium could break in the early 2030s.",sig:"Share of new-graduate hiring and graduate underemployment",mv:"Firms should institutionalise apprenticeship tracks and universities credit-bearing work placements"},
 5:{n:"Learning Design Expert E",r:"Instructional design consultant, former learning scientist",lens:"Guardrails, scaffolding, assessment design",v:"The evidence consistently shows design is the variable. If educational AI becomes the standard, co-evolution is possible; if long-term harms replicate, backlash follows.",sig:"Institutional adoption rate of educational (guardrailed) AI",mv:"Spend budget on guardrailed AI and process assessment rather than permitting generic chatbots"},
 6:{n:"Admissions & Tutoring Consultant F",r:"Consultant specialising in Korea's admissions and tutoring industry",lens:"Rank-based admissions and parent behaviour",v:"As long as Korean admissions are rank-based, tutoring demand will not disappear. AI will be absorbed into Daechi-style premium management services, widening spending polarisation.",sig:"Spending per participating student and share spending over KRW 1 million a month",mv:"Academies should pivot to hybrids of AI study management plus admissions coaching"},
 7:{n:"University Management Consultant G",r:"Consultant specialising in Japanese university management",lens:"Policy-led restructuring and regional access",v:"In Japan, policy rather than the market drives restructuring. Orderly restructuring could ease bifurcation, but shrinking regional universities provokes political backlash.",sig:"Capacity-cut instruments in the Basic Policy and allocation of private-school subsidies",mv:"Regional universities should secure their raison d'être by specialising in line with local talent needs"},
 8:{n:"Public Policy Adviser H",r:"Education policy adviser at an international organisation",lens:"Governance, equity, public procurement",v:"The policy gap is large but closing fast. If states provide guardrailed AI as a public good, co-evolution prevails.",sig:"Share of institutions with a formal AI policy",mv:"Governments should pursue verification research and public AI-tutor procurement as a package"},
 9:{n:"Regulation & Risk Adviser I",r:"AI regulation and privacy-risk consultant",lens:"Cumulative effect of incidents, lawsuits and regulation",v:"As cheating, detection bias and children's-data problems pile up, regulation catches up with technology. Korea's AIDT withdrawal shows how fast political backlash can move.",sig:"Number of laws and lawsuits on AI in education",mv:"Publish privacy impact assessments and evaluation plans before adoption"},
 10:{n:"Skills Credentialing Consultant J",r:"Consultant on corporate L&D and skills credentials",lens:"Substitutability of hiring signals",v:"If AI lowers the cost of measuring skills directly, the value of the degree as a proxy falls. Skills-based hiring is slow, but once it passes a threshold it spreads quickly.",sig:"Share of large firms using AI-based skills assessment in hiring",mv:"Universities should issue verifiable skills records alongside degrees"}},
