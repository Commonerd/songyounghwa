<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 발전과 인류멸망론 — 심층 리포트 (2026.11)</title>
<style>:root{
 --bg:#f6f5f2;--surface:#fcfcfb;--surface-2:#f0efeb;--line:#e2e0da;--line-2:#cfccc4;
 --text:#121211;--text-2:#52514e;--muted:#7a7873;--accent:#2a78d6;--accent-ink:#1c5cab;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
 --gA:#184f95;--gB:#2a78d6;--gC:#8a8984;--gD:#6250d6;
 --pos:#2a78d6;--neg:#eb6834;--flash:#fff3c4;--shadow:0 6px 28px rgba(20,20,18,.12);
 --seq1:#cde2fb;--seq7:#0d366b;
 --font:"Pretendard","Noto Sans KR","Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo","Yu Gothic UI","Malgun Gothic",system-ui,sans-serif;
 --serif:"Noto Serif KR","Noto Serif JP","Hiragino Mincho ProN",serif;
}
:root[data-theme="dark"]{
 --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2e2b;--line-2:#45433f;
 --text:#f0efec;--text-2:#c3c2b7;--muted:#8f8d86;--accent:#3987e5;--accent-ink:#86b6ef;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
 --gA:#86b6ef;--gB:#3987e5;--gC:#8f8d86;--gD:#9085e9;
 --pos:#3987e5;--neg:#d95926;--flash:#4a3f12;--shadow:0 6px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15.5px;line-height:1.78;-webkit-font-smoothing:antialiased;word-break:normal;overflow-wrap:anywhere}
:root[lang="ko"] body{word-break:keep-all}
:root[lang="ja"] body,:root[lang="zh"] body{line-break:strict}
:root[lang="zh"]{--font:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;--serif:"Noto Serif SC","Songti SC","SimSun",serif}
:root[lang="ja"]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
:root[lang="en"],:root[lang="ru"]{--font:"Inter","Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--serif:"Georgia","Times New Roman",serif}
:root[lang="ru"] body,:root[lang="en"] body{hyphens:auto}
a{color:var(--accent-ink)}
button{font-family:inherit}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 18px}
.topbar .brand{font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topbar .brand small{font-weight:500;color:var(--muted);margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--surface-2)}
.seg button{white-space:nowrap;border:0;background:transparent;color:var(--text-2);padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.iconbtn:hover{color:var(--text);border-color:var(--text-2)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto;gap:28px;padding:24px 20px 80px}
nav.toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 84px);overflow:auto;font-size:13px;padding-right:6px}
nav.toc .tt{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 8px}
nav.toc a{display:flex;gap:8px;padding:5px 8px;border-radius:8px;color:var(--text-2);text-decoration:none;line-height:1.4}
nav.toc a .n{color:var(--muted);min-width:18px;font-variant-numeric:tabular-nums}
nav.toc a.on{background:var(--surface-2);color:var(--text);font-weight:600}
nav.toc .legend{margin-top:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.55}
nav.toc .legend div{display:flex;gap:6px;align-items:flex-start;margin:3px 0}
main{min-width:0}
.cover{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 34px 26px;margin-bottom:22px;position:relative;overflow:hidden}
.cover .kick{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent-ink);text-transform:uppercase}
.cover h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:10px 0 8px;letter-spacing:-.02em}
.cover .sub{color:var(--text-2);font-size:15px;max-width:760px}
.cover .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:12.5px;color:var(--muted)}
.cover .meta b{color:var(--text-2);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.kpi .v i{display:inline-block;width:10px;height:10px;border-radius:3px}
.kpi .l{font-size:12px;color:var(--text-2);line-height:1.4;margin-top:2px}
section.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;margin-bottom:18px;scroll-margin-top:70px}
section.sec>h2{font-family:var(--serif);font-size:22px;margin:0 0 14px;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px}
section.sec>h2 .no{white-space:nowrap;flex:none;font-family:var(--font);font-size:13px;color:var(--accent-ink);font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px}
h3.sub{font-size:15.5px;margin:20px 0 6px;color:var(--text);font-weight:700}
p.para{margin:0 0 12px}
section.sec{counter-reset:k}
ul.kj{margin:0 0 8px;padding:0;list-style:none}
ul.kj li{position:relative;padding:12px 14px 12px 46px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
ul.kj li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
/* sentences */
.sent{border-radius:4px;transition:background .3s,box-shadow .3s;scroll-margin-top:120px}
body.gmode .sent[data-g="A"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gA) 55%,transparent)}
body.gmode .sent[data-g="B"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gB) 45%,transparent)}
body.gmode .sent[data-g="C"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gC) 60%,transparent)}
body.gmode .sent[data-g="D"]{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gD) 50%,transparent)}
.sent.flash{background:var(--flash);box-shadow:0 0 0 3px var(--flash)!important}
.conf{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface);white-space:nowrap}
.conf.cH{border-color:var(--accent);color:var(--accent-ink)}
.g{display:inline-grid;place-items:center;min-width:15px;height:15px;padding:0 3px;border-radius:4px;font-size:9.5px;font-weight:800;line-height:1;vertical-align:super;margin-left:2px;cursor:pointer;border:0;color:#fff}
.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}
:root[data-theme="dark"] .g.A{color:#0d366b}
.r{display:inline-block;font-size:10.5px;font-weight:700;line-height:1;vertical-align:super;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:2px 4px;margin-left:2px;cursor:pointer;font-variant-numeric:tabular-nums}
.r:hover,.r:focus-visible{background:var(--accent);color:#fff;outline:none}
.r.active{background:var(--accent);color:#fff}
/* tooltip */
#tip{position:fixed;z-index:60;max-width:380px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.55;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .q{font-family:var(--serif);border-left:3px solid var(--accent);padding-left:9px;margin:6px 0;color:var(--text)}
#tip .s{color:var(--muted);font-size:11.5px}
#tip .hint{color:var(--muted);font-size:11px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--text-2);background:var(--surface-2)}
.badge.gA{color:#fff;background:var(--gA);border-color:var(--gA)}.badge.gB{color:#fff;background:var(--gB);border-color:var(--gB)}.badge.gC{color:#fff;background:var(--gC);border-color:var(--gC)}.badge.gD{color:#fff;background:var(--gD);border-color:var(--gD)}
:root[data-theme="dark"] .badge.gA{color:#0d366b}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,100vw);z-index:70;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#drawer header .num{font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
#drawer header .num:hover{filter:brightness(1.1)}
#drawer header .x{margin-left:auto}
#drawer .body{padding:18px;overflow:auto;flex:1;font-size:14px;line-height:1.65}
#drawer h4{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#drawer .ttl{font-weight:700;font-size:15.5px;line-height:1.45}
#drawer .src{color:var(--text-2);font-size:13px;margin-top:4px}
#drawer blockquote{margin:6px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-family:var(--serif)}
#drawer .crit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
#drawer .judg{border:1px solid color-mix(in srgb,var(--gD) 45%,var(--line));border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--gD) 7%,var(--surface))}
#drawer .cites button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.5;cursor:pointer}
#drawer .cites button:hover{border-color:var(--accent)}
#drawer .cites button .loc{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
#drawer .note{font-size:13px;border:1px dashed var(--gD);border-radius:10px;padding:10px 12px;margin-top:8px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:none}
/* charts & figures */
figure.fig{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--surface)}
figure.fig figcaption{font-size:13px;font-weight:700;margin-bottom:2px}
figure.fig .fsub{font-size:12px;color:var(--muted);margin-bottom:10px}
figure.fig .fsrc{font-size:11.5px;color:var(--muted);margin-top:6px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line-2);stroke-width:1}
.grid{stroke:var(--line);stroke-width:1}
.tl{fill:var(--text-2);font-size:11px}
.tm{fill:var(--muted);font-size:10.5px}
.tv{fill:var(--text);font-size:11.5px;font-weight:700}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:4px 0 8px}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{display:inline-block;width:10px;height:10px;border-radius:3px}
.vtip{position:fixed;z-index:61;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;white-space:nowrap}
.vtip.on{opacity:1}
/* tables */
.tblwrap{overflow-x:auto;margin:10px 0}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
table.t th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child,table.t th:first-child{white-space:nowrap}
table.t td:first-child{font-weight:700}
table.t tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
/* scenarios */
.scgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.scard{border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;background:var(--surface);position:relative;overflow:hidden}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .hd b{font-size:16px}
.scard .hd .en{font-size:11.5px;color:var(--muted)}
.scard .pr{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.scard .rule{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin:4px 0 6px}
.scard ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.scard .w{font-size:12px;color:var(--text-2);border-top:1px dashed var(--line-2);padding-top:6px;margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:3px}
/* mcmc widget */
.wbox{border:1px solid var(--line-2);border-radius:16px;padding:16px;background:var(--surface-2);margin:14px 0}
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 16px;margin:10px 0 14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);font-weight:600}
.ctrl label{gap:6px}
.ctrl label output{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text)}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
.wrow{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.panelc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panelc h5{margin:0 0 4px;font-size:12.5px}
.panelc .s{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.diag{font-size:12px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:6px 14px}
.diag b{color:var(--text);font-variant-numeric:tabular-nums}
.ok{color:#0a7d33}.warn{color:#b35c00}
:root[data-theme="dark"] .ok{color:#5ad17f}
.persona-detail{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.persona-detail .rl{font-size:12px;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}
.pgrid div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pgrid div b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hm td.cell{white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer}
.hm tr.sel td{outline:2px solid var(--accent);outline-offset:-2px}
.hm td.pn{cursor:pointer}
/* reflist */
.reff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.reff input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.refitem{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55;scroll-margin-top:90px}
.refitem .rn{border:1px solid var(--accent);color:var(--accent-ink);background:transparent;border-radius:8px;font-weight:800;height:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.refitem .rn:hover{background:var(--accent);color:#fff}
.refitem .rt{font-weight:700}
.refitem .rs{color:var(--text-2)}
.refitem .rq{font-family:var(--serif);color:var(--text-2);margin-top:2px}
.refitem .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.refitem .ra button{border:0;background:none;color:var(--accent-ink);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.refitem .cnt{font-size:11.5px;color:var(--muted)}
.hidden{display:none!important}
.ponly{display:none}
.concise-note{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:980px){
 .wrap{grid-template-columns:1fr;padding:14px 12px 60px}
 nav.toc{display:none}
 nav.toc.mob{display:block;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--surface);z-index:45;padding:16px;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .ctrls{grid-template-columns:repeat(2,1fr)}
 .wrow,.scgrid,.pgrid{grid-template-columns:1fr}
 section.sec{padding:20px 16px}
 .cover{padding:24px 18px}
 .cover h1{font-size:25px}
 .topbar .brand small{display:none}
 .topbar{gap:6px;padding:8px 10px;overflow-x:auto}
 .topbar .brand,#bPrint{display:none}
 .seg button{padding:4px 9px}
}
@media (min-width:981px){#tocbtn{display:none}}
@media print{
 @page{size:A4;margin:16mm 15mm}
 body{background:#fff;font-size:11pt;line-height:1.6}
 .printhide,details{display:none!important}
 .ponly{display:block;font-size:8.5pt;color:#444;margin-top:2px}
 .refitem .ra{display:none}
 figure.fig svg{max-width:78%;display:block;margin:0 auto}
 .wbox svg{max-height:62mm}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .topbar,nav.toc,#drawer,#scrim,#tip,.vtip,.ctrls,.reff,.noprint,.toast{display:none!important}
 .wrap{display:block;padding:0;max-width:none}
 section.sec,.cover{border:0;padding:0;margin:0 0 6mm;break-inside:auto}
 section.sec{break-before:auto}
 #sec-refs{break-before:page}
 .scgrid,.wrow,.pgrid{grid-template-columns:1fr 1fr!important}
 .scard ul{font-size:9.5pt}
 .refitem{grid-template-columns:34px 1fr;padding:5px 0;font-size:9pt}
 figure.fig,.scard,.panelc,tr{break-inside:avoid}
 .r{border:0;background:none;padding:0}
 .g{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 a{color:inherit}
}

/* mobile: keep panel tables and reference filters inside the viewport */
.panelc{min-width:0;overflow-x:auto}.reff .seg{flex-wrap:wrap}
</style>
</head>
<body>
<div class="topbar"><button class="iconbtn" id="tocbtn">목차</button><div class="brand" id="brand"></div>
<div class="seg" id="langSeg"></div>
<div class="seg"><button id="bDetail">상세판</button><button id="bConcise">간결판</button></div>
<button class="iconbtn" id="bG" aria-pressed="false">등급</button><button class="iconbtn" id="bTheme">☾</button><button class="iconbtn" id="bPrint">PDF</button>
<div class="progress" id="prog"></div></div>

<script>
// ===== Core helpers (data authoring format) =====
// Text arrays are always in the order [ko, en, ru, zh, ja].
// grade: A/B/C = strongest evidence class behind a sentence; D = Claude's analytic inference (sentences only)
// type codes: q1 = Q1 peer-reviewed paper, stat = official statistics, io = international org / government / public research report,
//             survey = methodologically disclosed survey, press = news report, ind = industry/company data
const LANGS=["ko","en","ru","zh","ja"];
function tx(o,lang){if(!o)return "";if(typeof o==="string")return o;return o[lang]??o.en??o.ko??"";}
const L5=a=>{if(!a)return null;if(!Array.isArray(a))return a;const o={};LANGS.forEach((l,i)=>o[l]=a[i]);return o;};
// sentence: s(grade, refs, [ko,en,ru,zh,ja], note[5]?, conf?)  conf: "H" | "M" | "L"
const s=(g,refs,t,note,conf)=>({g:g,refs:refs||[],t:L5(t),note:note?L5(note):null,conf:conf||null});
const P=(...x)=>({p:x}), KJ=(...x)=>({kj:x}), H=t=>({h:L5(t)}), CH=c=>({chart:c}), TB=k=>({table:k}), SCN={scen:1}, W=w=>({widget:w}), REFL={reflist:1};
const EVIDENCE=[];
function E(id,grade,type,year,src,title,url,quote,crit,judg){const e={id,grade,type,year,src,title,url,quote};LANGS.forEach((l,i)=>e[l]={crit:crit[i],judg:judg[i]});EVIDENCE.push(e);}
const SECTIONS=[];
function SEC(id,t,detail,concise){SECTIONS.push({id:id,t:L5(t),detail:detail,concise:concise});}
// evidence behind the competition / race pressure term D in the MCMC indicator table
const DREFS=[16,42,43];

E(1,"C","ind",2023,"Center for AI Safety (CAIS), 2023-05","Statement on AI Extinction Risk","https://safe.ai/work/statement-on-ai-risk",
"Mitigating the risk of extinction from AI should be a global priority",
["한 문장짜리 공동 성명으로, 많은 AI 연구자·기업 대표가 서명했다는 점에서 '멸망 위험'을 주류 의제로 끌어올렸다. 그러나 확률·경로·시점은 제시하지 않으며, 서명이 곧 증거는 아니다.",
 "A one-sentence joint statement whose many AI-researcher and CEO signatories brought 'extinction risk' into the mainstream. It gives no probability, pathway or timing, and signatures are not evidence.",
 "Заявление из одного предложения; подписи многих исследователей ИИ и руководителей компаний вывели «риск вымирания» в мейнстрим. Но вероятности, механизма и сроков нет, а подписи — не доказательство.",
 "这份一句话的联合声明因众多AI研究者和企业负责人签名，把“灭绝风险”推入主流议程。但它没有给出概率、路径或时间，签名本身也不是证据。",
 "一文だけの共同声明で、多くのAI研究者・企業トップが署名したことで「絶滅リスク」を主流の議題に押し上げた。ただし確率・経路・時期は示しておらず、署名は証拠ではない。"],
["'멸망 위험이 진지하게 제기되고 있다'는 사실의 근거로만 쓰고, 위험의 크기에 대한 근거로는 쓰지 않는다.",
 "Used only as evidence that extinction risk is being raised seriously, never as evidence of its size.",
 "Используется лишь как свидетельство того, что риск вымирания обсуждается всерьёз, но не его величины.",
 "仅作为“灭绝风险正被严肃提出”这一事实的依据，不作为风险大小的依据。",
 "「絶滅リスクが真剣に提起されている」事実の根拠としてのみ用い、リスクの大きさの根拠には用いない。"]);

E(2,"C","press",2024,"Irish Examiner (Dan Milmo, The Guardian), 2024-12-28","'Godfather of AI' shortens odds of the technology wiping out humanity over next 30 years","https://www.irishexaminer.com/world/arid-41544136.html",
"shortened the odds of AI wiping out humanity over the next three decades",
["힌턴의 BBC 라디오 인터뷰(30년 내 10~20%)를 옮긴 2차 보도다. 노벨상 수상자의 견해라는 무게는 있지만, 추정 방법이 공개되지 않은 개인의 주관적 확률이다.",

 "ヒントンのBBCラジオインタビュー（30年以内に10〜20%）を伝える二次報道である。ノーベル賞受賞者の見解として重みはあるが、方法を開示しない個人の主観確率である。"],
["전문가 추정 분포의 '높은 쪽' 사례로만 사용하며, 기준값으로 쓰지 않는다.",

E(3,"C","ind",2025,"Eliezer Yudkowsky & Nate Soares, Little, Brown and Company, 2025-09-16","If Anyone Builds It, Everyone Dies: Why Superhuman AI Would Kill Us All","https://www.hachettebookgroup.com/titles/eliezer-yudkowsky/if-anyone-builds-it-everyone-dies/9780316595667/?lens=little-brown",
"The scramble to create superhuman AI has put us on the path to extinction",

 "A popular book setting out the strongest form of the doom argument. It rests on the logic that a superintelligence whose goals cannot be specified precisely will not be compatible with humans, and relies on theory rather than empirical estimates. Quoted from the publisher's description.",

 "这本大众读物阐述了最强形态的毁灭论，依据是“无法精确植入目标的超级智能与人类不相容”的逻辑，以理论论证为主而非经验概率。引文出自出版社介绍。",
 "最も強い形の滅亡論を一般書にまとめた本である。「目標を正確に組み込めない超知能は人間と両立しない」という論理に依拠し、経験的な確率推定より理論的論証が中心である。出版社の紹介文から引用した。"],
["멸망론의 '논리 구조'를 설명하는 데 쓰되, 그 결론의 확실성은 반대 근거(8·10·11)와 함께 평가한다.",
 "Used to explain the logical structure of the doom argument, while its certainty is weighed against counter-evidence (8, 10, 11).",
 "Используется для объяснения логики аргумента, а его уверенность сопоставляется с контраргументами (8, 10, 11).",
 "用于说明毁灭论的逻辑结构，其结论的确定性则与反面依据（8、10、11）一并评估。",
 "滅亡論の「論理構造」の説明に用い、その結論の確実性は反対の根拠（8・10・11）と合わせて評価する。"]);

E(4,"C","ind",2025,"Future of Life Institute (FLI), 2025-10-22","Statement on Superintelligence","https://superintelligence-statement.org/",
"We call for a prohibition on the development of superintelligence",
["과학적 합의와 대중 동의가 있기 전까지 초지능 개발을 금지하자는 성명이다. 서명 규모(페이지 기준 7만 9천여 명)는 여론의 신호지만, 서명자 구성이 다양해 전문가 판단으로 읽기는 어렵다.",

 "科学的合意と市民の同意が得られるまで超知能の開発を禁止せよという声明である。署名数（ページ上で7万9千超）は世論の信号だが、署名者の構成が多様で専門家の判断とは読みにくい。"],
["'개발 중단' 요구가 존재한다는 사실과 그 정치적 확산을 보여주는 근거로 쓴다.",
 "Used as evidence that calls to halt development exist and are spreading politically.",

E(5,"C","ind",2025,"Kokotajlo, Alexander, Larsen, Lifland & Dean, 2025-04-03","AI 2027","https://ai-2027.com/",

E(6,"C","ind",2024,"Joseph Carlsmith, arXiv:2206.13353 (v2, 2024-08-13)","Is Power-Seeking AI an Existential Risk?","https://arxiv.org/abs/2206.13353",
"I end up with an overall estimate of ~5%",
["멸망 경로를 여섯 개 전제로 분해해 각 확률을 곱하는 방식으로 2070년까지의 실존적 파국 확률을 추정했다(초기 ~5%, 이후 >10%로 상향). 논리가 투명하다는 장점이 있지만, 각 전제의 확률은 저자의 주관이다.",
 "Breaks the doom pathway into six premises and multiplies their probabilities to estimate existential catastrophe by 2070 (~5% initially, later raised to >10%). The logic is transparent, but each premise's probability is the author's judgement.",

 "把毁灭路径拆成六个前提并相乘各自概率，估计到2070年的生存性灾难概率（最初约5%，后上调至>10%）。逻辑透明，但每个前提的概率都是作者的主观判断。",
 "滅亡への経路を六つの前提に分解し、それぞれの確率を掛け合わせて2070年までの実存的破局の確率を推定した（当初約5%、後に10%超へ上方修正）。論理は透明だが、各前提の確率は著者の主観である。"],

 "Used as an example of decomposing doom probability; this report's scenario structure (capability, control, institutions) follows the same decomposition logic.",
 "Используется как пример декомпозиции вероятности катастрофы; структура сценариев доклада (возможности, контроль, институты) следует той же логике.",
 "作为“拆解”毁灭概率的方法示例；本报告的情景结构（能力、控制、制度）也遵循同样的拆解思路。",

E(7,"B","q1",2013,"Nick Bostrom, Global Policy 4(1): 15–31","Existential Risk Prevention as Global Priority","https://existential-risk.com/concept.html",
"Even a small probability of existential catastrophe could be highly practically significant.",
["실존적 위험 개념의 출발점이 된 철학 논문이다. 작은 확률이라도 피해가 문명 전체라면 기대 손실이 크다는 논리를 세웠지만, 이 논리는 '확률을 얼마로 보느냐'에 극도로 민감하다는 비판(파스칼의 강도 문제)을 받는다.",
 "The philosophical paper that launched the concept of existential risk. It argues that even a small probability matters when the loss is civilisation itself, but the logic is criticised as extremely sensitive to the probability assumed (the 'Pascal's mugging' problem).",
 "Философская статья, заложившая понятие экзистенциального риска: даже малая вероятность важна, если на кону цивилизация. Критика: логика крайне чувствительна к принятой вероятности (проблема «паскалевского ограбления»).",
 "这篇哲学论文奠定了“生存性风险”概念：即使概率很小，若损失是整个文明，期望损失也很大。但该逻辑被批评为对所假定的概率极度敏感（“帕斯卡抢劫”问题）。",
 "実存的リスクという概念の出発点となった哲学論文である。確率が小さくても損失が文明全体なら期待損失は大きいという論理を立てたが、想定する確率に極端に敏感だという批判（パスカルの強盗問題）を受ける。"],
["확률이 낮아도 대비할 이유가 있다는 '규범적 논리'의 근거로 쓰되, 대비의 규모는 확률 근거와 비용을 함께 따져 정한다.",
 "Used as the normative case for preparing even when probability is low; the scale of preparation is set by weighing probability evidence against cost.",
 "Используется как нормативный довод готовиться даже при малой вероятности; масштаб подготовки определяется соотношением доказательств и затрат.",
 "作为“即使概率低也有理由防范”的规范性依据；防范规模则需结合概率证据与成本来确定。",
 "確率が低くても備える理由があるという「規範的論理」の根拠として用い、備えの規模は確率の根拠と費用を併せて決める。"]);

E(8,"B","io",2025,"Arvind Narayanan & Sayash Kapoor, Knight First Amendment Institute (Columbia University), 2025-04-15","AI as Normal Technology","https://knightcolumbia.org/content/ai-as-normal-technology",
"a tool that we can and should remain in control of",
["멸망론에 대한 가장 체계적인 반론 중 하나로, AI 확산은 안전이 중요한 분야일수록 느리며 통제 가능한 도구로 다뤄야 한다고 본다. 저자들도 확률을 정량화하지 않았다고 밝혀, 낙관 쪽 역시 확률 근거가 약하다.",
 "One of the most systematic rebuttals of the doom thesis: AI diffuses slowly in safety-critical domains and should be treated as a controllable tool. The authors say they did not quantify probabilities, so the optimistic side also lacks probability evidence.",
 "Одно из самых систематических опровержений тезиса о гибели: ИИ медленно проникает в критичные для безопасности сферы и должен рассматриваться как управляемый инструмент. Авторы признают, что вероятности не оценивали, — у оптимистов тоже нет вероятностных данных.",
 "这是对毁灭论最系统的反驳之一：AI在安全关键领域扩散缓慢，应作为可控工具对待。作者也表示未量化概率，因此乐观一方同样缺乏概率依据。",
 "滅亡論に対する最も体系的な反論の一つで、安全が重要な分野ほどAIの普及は遅く、制御可能な道具として扱うべきだとする。著者も確率は定量化していないと明言しており、楽観側も確率の根拠は弱い。"],
["'확산은 느리고 제도로 다룰 수 있다'는 S1·S4 쪽 논리의 대표 근거로 쓴다.",
 "Used as the main source for the S1/S4 logic that diffusion is slow and can be handled by institutions.",
 "Используется как основной источник логики S1/S4: распространение медленное и поддаётся институциональному регулированию.",
 "作为S1、S4一侧“扩散缓慢、可由制度应对”逻辑的代表依据。",
 "「普及は遅く制度で対処できる」というS1・S4側の論理の代表的根拠として用いる。"]);

E(9,"A","q1",2025,"Grace et al., Journal of Artificial Intelligence Research 84 (2025), n=2,778","Thousands of AI Authors on the Future of AI","https://arxiv.org/abs/2401.02843",
"Between 38% and 51% of respondents gave at least a 10% chance",
["주요 AI 학회 저자 2,778명 설문으로, 질문 문구에 따라 38~51%가 '인류 멸망 수준의 나쁜 결과'에 10% 이상 확률을 주었다. 동시에 68.3%는 좋은 결과가 더 가능성이 높다고 답했다. 응답률과 문구 효과에 따른 편향이 있다.",
 "A survey of 2,778 authors at top AI venues: depending on wording, 38–51% gave at least a 10% chance to outcomes as bad as human extinction, while 68.3% thought good outcomes were more likely. Non-response and framing effects bias the results.",
 "Опрос 2778 авторов ведущих ИИ-конференций: в зависимости от формулировки 38–51% дали не менее 10% исходам уровня вымирания человечества, при этом 68,3% сочли хорошие исходы более вероятными. Есть смещения из-за неответов и формулировок.",
 "对2,778名顶级AI会议作者的调查：因问法不同，38%–51%的人给“与人类灭绝同样糟糕的结果”至少10%的概率；同时68.3%认为好结果更可能。存在无应答与措辞效应偏差。",
 "主要AI学会の著者2,778人への調査で、質問文により38〜51%が「人類絶滅級の悪い結果」に10%以上の確率を付けた。同時に68.3%は良い結果の方が可能性が高いと答えた。回答率と文言効果による偏りがある。"],
["'연구자 다수가 꼬리 위험을 무시하지 않는다'는 판단의 A급 근거이며, 동시에 '다수는 낙관적'이라는 사실도 함께 전한다.",
 "Grade-A support for the judgement that many researchers do not dismiss tail risk — reported together with the fact that most are optimistic.",
 "Доказательство класса A того, что многие исследователи не отвергают «хвостовой» риск, — вместе с фактом, что большинство настроено оптимистично.",
 "这是“多数研究者并不忽视尾部风险”判断的A级依据，同时也传达“多数人是乐观的”这一事实。",
 "「研究者の多くがテールリスクを無視していない」という判断のA級根拠であり、同時に「多数は楽観的」という事実も併せて伝える。"]);

E(10,"A","q1",2025,"Karger, Rosenberg, Jacobs, Hickman & Tetlock, International Journal of Forecasting 41(2): 499–516","Subjective-probability forecasts of existential risk: Initial results from a hybrid persuasion-forecasting tournament","https://ideas.repec.org/a/eee/intfor/v41y2025i2p499-516.html",
"Specialists were more pessimistic, especially on long-run threats posed by artificial intelligence",
["슈퍼예측가와 분야 전문가가 4개월간 토론하며 확률을 낸 토너먼트다. 전문가는 AI 위험을 훨씬 높게 보았고, 토론 뒤에도 두 집단의 견해는 거의 수렴하지 않았다. 2100년이라는 먼 시점이라 채점이 불가능하다는 한계가 있다.",
 "A tournament in which superforecasters and domain experts debated for four months and gave probabilities. Experts rated AI risk far higher, and the two groups barely converged after debate. The 2100 horizon means the forecasts cannot be scored.",
 "Турнир, где суперпрогнозисты и эксперты четыре месяца спорили и давали вероятности. Эксперты оценили риск ИИ гораздо выше, и после дискуссии группы почти не сблизились. Горизонт 2100 года не позволяет проверить прогнозы.",
 "超级预测者与领域专家辩论四个月并给出概率的锦标赛。专家对AI风险的估计远高于前者，辩论后两组几乎没有趋同。2100年的远期使预测无法评分。",
 "スーパー予測者と分野専門家が4か月議論して確率を出したトーナメントである。専門家はAIリスクをはるかに高く見積もり、議論後も両集団の見解はほとんど収束しなかった。2100年という遠い時点のため採点できない限界がある。"],
["'전문가 사이의 불일치 자체가 핵심 사실'이라는 판단의 A급 근거다. 구체적 수치는 11번 2차 자료로 확인했다.",
 "Grade-A support for the judgement that the disagreement itself is the key fact; the specific figures were confirmed via the secondary source 11.",
 "Доказательство класса A того, что ключевой факт — само расхождение; конкретные цифры подтверждены вторичным источником 11.",
 "这是“专家间的分歧本身就是关键事实”判断的A级依据；具体数值通过二手资料11确认。",
 "「専門家間の不一致そのものが核心的事実」という判断のA級根拠である。具体的な数値は二次資料11で確認した。"]);

E(11,"C","press",2024,"Luisa Rodriguez, 80,000 Hours, 2024-09-16","Why experts and forecasters disagree about AI risk","https://80000hours.org/2024/09/why-experts-and-forecasters-disagree-about-ai-risk/",
"while superforecasters put it at just 0.38%",
["토너먼트(10) 결과를 요약한 2차 자료로, 2100년까지 AI로 인한 인류 멸망 확률을 AI 전문가 3%, 슈퍼예측가 0.38%로 전한다. 작성 기관이 AI 위험 대응을 중시하는 단체라는 점을 감안해야 한다.",
 "A secondary summary of the tournament (10), reporting AI-caused extinction by 2100 at 3% for AI experts and 0.38% for superforecasters. The publishing organisation prioritises AI-risk work, which should be borne in mind.",
 "Вторичное резюме турнира (10): вероятность вымирания из-за ИИ к 2100 году — 3% у экспертов и 0,38% у суперпрогнозистов. Следует учитывать, что издатель уделяет приоритетное внимание рискам ИИ.",
 "对锦标赛（10）结果的二手摘要：到2100年AI导致人类灭绝的概率，AI专家为3%，超级预测者为0.38%。需考虑发布机构本身重视AI风险议题。",
 "トーナメント（10）の結果をまとめた二次資料で、2100年までにAIで人類が絶滅する確率をAI専門家3%、スーパー予測者0.38%と伝える。発行団体がAIリスク対応を重視する団体である点を考慮すべきである。"],
["수치 자체는 원 논문(10)의 결과를 옮긴 것으로 보고 사용하되, 등급은 2차 자료 기준(C)으로 둔다.",
 "The figures are used as a transcription of the original study (10), but graded as a secondary source (C).",
 "Цифры используются как передача результатов исходной работы (10), но класс — как у вторичного источника (C).",
 "数值视为对原论文（10）结果的转述而使用，但等级按二手资料（C）处理。",
 "数値は原論文（10）の結果を伝えたものとして用いるが、等級は二次資料（C）とする。"]);

E(12,"B","survey",2025,"Pew Research Center (McClain, Kennedy, Gottfried, Anderson, Pasquini), 2025-04-03","How the U.S. Public and AI Experts View Artificial Intelligence","https://www.pewresearch.org/internet/2025/04/03/how-the-us-public-and-ai-experts-view-artificial-intelligence/",
"Similar shares of the public and experts want more control and regulation of AI.",
["미국 성인과 AI 전문가를 비교한 조사로, 대중의 51%가 기대보다 우려가 크다고 답한 반면 전문가는 15%였다. 그러나 '더 많은 통제·규제' 요구는 두 집단에서 비슷했다. 멸망 확률을 직접 묻지는 않았다.",
 "A survey comparing US adults with AI experts: 51% of the public are more concerned than excited versus 15% of experts, yet the demand for more control and regulation is similar in both groups. It did not ask about extinction directly.",
 "Опрос взрослых американцев и экспертов по ИИ: 51% публики скорее обеспокоены, чем воодушевлены, против 15% экспертов, но запрос на больший контроль и регулирование у групп схож. Вероятность вымирания напрямую не спрашивали.",
 "比较美国成年人与AI专家的调查：公众51%担忧多于期待，专家为15%；但两组对“更多控制与监管”的诉求相近。未直接询问灭绝概率。",
 "米国の成人とAI専門家を比べた調査で、一般の51%が期待より懸念が大きいと答えたのに対し専門家は15%だった。だが「より多くの管理・規制」を求める割合は両集団で近い。絶滅確率は直接尋ねていない。"],
["멸망 확률에 대한 견해가 달라도 '규제 강화'에는 넓은 지지가 있다는 판단의 근거로 쓴다.",
 "Used to support the judgement that, whatever people think about extinction odds, there is broad support for stronger regulation.",
 "Подтверждает вывод: при разных взглядах на вероятность гибели поддержка более жёсткого регулирования широка.",
 "用于支持“即使对灭绝概率看法不同，加强监管仍获广泛支持”的判断。",
 "絶滅確率への見解が違っても「規制強化」には幅広い支持があるという判断の根拠として用いる。"]);

E(13,"B","q1",2024,"Bengio, Hinton, Yao, Song, Abbeel … Russell, Kahneman et al. (25 authors), Science 384 (2024)","Managing extreme AI risks amid rapid progress","https://arxiv.org/abs/2310.17688",
"AI safety research is lagging",
["튜링상·노벨상 수상자를 포함한 25인이 쓴 합의 논문으로, 능력 발전에 비해 안전 연구와 거버넌스가 뒤처진다고 진단하고 연구 투자·의무적 평가를 제안한다. 실증 연구가 아니라 전문가 합의 진술이다.",
 "A consensus paper by 25 authors including Turing and Nobel laureates. It diagnoses safety research and governance as lagging capability progress and proposes research investment and mandatory evaluation. It is an expert consensus statement, not an empirical study.",
 "Консенсусная статья 25 авторов, включая лауреатов премий Тьюринга и Нобелевской: исследования безопасности и управление отстают от роста возможностей; предлагаются инвестиции и обязательные оценки. Это экспертное заявление, а не эмпирика.",
 "由包括图灵奖、诺贝尔奖得主在内的25位作者撰写的共识论文，诊断安全研究与治理落后于能力发展，并建议研究投入和强制评估。它是专家共识陈述而非实证研究。",
 "チューリング賞・ノーベル賞受賞者を含む25人による合意論文で、能力の進展に比べ安全研究とガバナンスが遅れていると診断し、研究投資と義務的評価を提案する。実証研究ではなく専門家の合意声明である。"],
["'안전·제도가 능력을 따라가지 못한다'는 판단(I 축 성장률 가정)의 핵심 근거로 쓴다.",
 "A key source for the judgement that safety and institutions lag capability (the growth assumption on axis I).",
 "Ключевой источник для вывода, что безопасность и институты отстают от возможностей (допущение о росте по оси I).",
 "作为“安全与制度跟不上能力”判断（I轴增长率假设）的核心依据。",
 "「安全・制度が能力に追いつかない」という判断（I軸の成長率の仮定）の中核的根拠として用いる。"]);

E(14,"B","io",2025,"Bengio et al. (96 authors; 30 nations, UN, OECD, EU), UK DSIT, 2025-01","International AI Safety Report","https://arxiv.org/abs/2501.17805",
"synthesizes the current evidence on the capabilities, risks, and safety",
["30개국과 국제기구가 추천한 전문가 패널이 100명 가까운 연구자와 함께 만든 첫 국제 종합 보고서다. 정책 권고 없이 증거를 정리했다는 점에서 신뢰도가 높지만, 결론의 상당 부분은 '불확실성이 크다'는 진술이다.",
 "The first international synthesis, produced by a panel nominated by 30 nations and international bodies with about 100 researchers. Its neutrality (no policy recommendations) makes it credible, but much of its conclusion is that uncertainty is large.",
 "Первый международный обзор, подготовленный панелью от 30 стран и международных организаций при участии около 100 исследователей. Отсутствие рекомендаций повышает доверие, но значительная часть выводов — о большой неопределённости.",
 "由30国及国际组织推荐的专家组与约100名研究者共同完成的首份国际综合报告。不给政策建议使其可信度较高，但很多结论是“不确定性很大”。",
 "30か国と国際機関が推薦した専門家パネルが約100人の研究者と作った初の国際的な総合報告である。政策提言をせず証拠を整理した点で信頼性は高いが、結論の多くは「不確実性が大きい」という記述である。"],
["위험을 오용·오작동·체계적 위험으로 나누는 분류 틀을 본 보고서도 따른다.",
 "This report follows its classification of risks into malicious use, malfunction and systemic risk.",
 "Доклад следует его классификации рисков: злоупотребление, сбои и системные риски.",
 "本报告沿用其将风险分为恶意使用、故障与系统性风险的分类框架。",
 "本報告もリスクを悪用・誤作動・システミックリスクに分ける同報告の分類枠組みに従う。"]);

E(15,"B","io",2026,"International AI Safety Report 2026 (Bengio, chair; DSIT 2026/001), 2026-02-03","International AI Safety Report 2026 — Key findings / Second Key Update","https://internationalaisafetyreport.org/",
"the real-world effectiveness of many safeguards is uncertain",
["2026년판은 에이전트의 자율성 증가, 수학 올림피아드 금메달 수준 성능, 평가 상황을 구별하는 모델 등을 다루며 안전장치의 실효성이 불확실하다고 정리한다. 기업 안전 프레임워크 공개는 늘었지만 그 효과 검증은 부족하다.",
 "The 2026 edition covers more autonomous agents, olympiad-gold-level maths and models that can tell evaluation from deployment, and concludes that the real-world effectiveness of safeguards is uncertain. More companies publish safety frameworks, but their effect is little verified.",
 "Издание 2026 года описывает более автономных агентов, результаты уровня золота олимпиады по математике и модели, отличающие тестирование от эксплуатации; вывод — реальная эффективность защит неясна. Компаний с опубликованными рамками стало больше, но их эффект мало проверен.",
 "2026年版涉及更自主的智能体、数学奥赛金牌水平的表现以及能区分评估与部署情境的模型，结论是许多防护措施的实际效果不确定。公开安全框架的企业增多，但效果缺乏验证。",
 "2026年版はエージェントの自律性の向上、数学オリンピック金メダル水準の性能、評価状況を見分けるモデルなどを扱い、安全対策の実効性は不確実だとまとめる。安全フレームワークを公表する企業は増えたが、効果の検証は乏しい。"],
["통제·방어 회복력(L)을 '중간 이하'로 코딩하는 핵심 근거로 쓴다.",
 "A key source for coding control and defence resilience (L) as middling or below.",
 "Ключевой источник для кодирования устойчивости контроля и защиты (L) как средней или ниже.",
 "作为将控制与防御韧性（L）编码为“中等偏下”的核心依据。",
 "制御・防御の回復力（L）を「中程度以下」とコーディングする中核的根拠として用いる。"]);

E(16,"B","io",2025,"Stanford HAI, AI Index Steering Committee","The 2025 AI Index Report","https://hai.stanford.edu/ai-index/2025-ai-index-report",
"U.S. private AI investment grew to $109.1 billion",
["2024년 미국 민간 AI 투자는 1,091억 달러로 중국(93억 달러)의 약 12배였고, 주요 벤치마크에서 미·중 모델 성능 격차는 거의 사라졌다. 민간 투자 통계는 정의·집계 방식에 따라 크게 달라질 수 있다.",
 "US private AI investment reached $109.1 billion in 2024, about 12 times China's $9.3 billion, while the US–China performance gap on major benchmarks nearly closed. Private-investment statistics vary greatly with definitions.",
 "Частные инвестиции в ИИ в США в 2024 году — 109,1 млрд долл., примерно в 12 раз больше, чем в Китае (9,3 млрд), а разрыв в качестве моделей США и Китая на ключевых тестах почти исчез. Статистика сильно зависит от определений.",
 "2024年美国私人AI投资达1,091亿美元，约为中国（93亿美元）的12倍，而主要基准上的中美模型性能差距几近消失。私人投资统计因定义口径差异很大。",
 "2024年の米国の民間AI投資は1,091億ドルで中国（93億ドル）の約12倍、主要ベンチマークでの米中モデルの性能差はほぼ消えた。民間投資統計は定義や集計方法で大きく変わり得る。"],
["자본 집중과 미·중 격차 축소를 근거로 '경쟁 압력 D'를 높게 둔다.",
 "Used to set competition pressure D high, given capital concentration and a narrowing US–China gap.",
 "Обосновывает высокое давление конкуренции D: концентрация капитала и сокращение разрыва США–Китай.",
 "依据资本集中与中美差距缩小，把竞争压力D设得较高。",
 "資本の集中と米中格差の縮小を根拠に「競争圧力D」を高く置く。"]);
