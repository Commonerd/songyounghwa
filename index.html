<style>
:root{--bg:#f7f7f5;--surface:#fff;--text:#1c1c1c;--muted:#6f6f6a;--line:#deded8;--accent:#263238;--accent-light:#eef0ef;--max:1120px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.72}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
section{padding:100px 0;border-bottom:1px solid var(--line)}
.container{width:min(calc(100% - 40px),var(--max));margin:auto}
.section-label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:25px}
.section-title{font-size:clamp(32px,5vw,50px);font-weight:500;letter-spacing:-.045em;line-height:1.08;margin-bottom:36px}

/* header */
header{position:fixed;top:0;left:0;width:100%;z-index:100;background:rgba(247,247,245,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(222,222,216,.78)}
nav{width:min(calc(100% - 40px),var(--max));min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.logo{font-size:14px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
.nav-right{display:flex;align-items:center;gap:24px}
.nav-links{display:flex;gap:20px;list-style:none;font-size:12px;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.language-switcher{display:flex;gap:4px}
.language-switcher button{border:0;background:transparent;padding:5px 6px;font-size:10px;color:var(--muted);cursor:pointer;border-radius:3px}
.language-switcher button:hover,.language-switcher button.active{color:var(--text);background:var(--accent-light)}

/* hero */
.hero{min-height:100vh;padding-top:68px;display:flex;align-items:center}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,.7fr);gap:70px;align-items:end}
.hero-inner{padding:80px 0 70px}
.hero-kicker{font-size:13px;color:var(--muted);margin-bottom:24px;letter-spacing:.04em}
.hero h1{font-size:clamp(60px,10vw,112px);font-weight:500;letter-spacing:-.07em;line-height:.92;margin-bottom:34px}
.hero-description{max-width:800px;font-size:clamp(19px,2.35vw,27px);line-height:1.5;letter-spacing:-.03em;color:#333}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px}
.tag{padding:7px 11px;background:var(--accent-light);border-radius:3px;font-size:11px;color:#4d5355}

/* photos */
.photo-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.profile-frame{width:min(100%,290px);aspect-ratio:1/1.18;overflow:hidden;background:#e5e5e0;border:1px solid var(--line)}
.profile-frame img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#888;font-size:12px;background:linear-gradient(135deg,#ededeb,#dbdbd5)}
.photo-caption{font-size:11px;color:var(--muted)}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 2fr;gap:80px}
.about-text{font-size:17px;max-width:790px}
.about-text p{margin-bottom:20px}
.bio-facts{margin-top:30px;padding-top:23px;border-top:1px solid var(--line)}
.bio-row{display:grid;grid-template-columns:135px 1fr;gap:20px;padding:8px 0;border-bottom:1px solid #e7e7e1;font-size:14px}
.bio-row strong{font-weight:600}.bio-row span{color:var(--muted)}

/* research / lists */
.research-list,.publication-list,.activity-list{border-top:1px solid var(--line)}
.research-item{display:grid;grid-template-columns:60px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line)}
.research-number{font-family:Georgia,serif;font-size:19px;color:var(--muted)}
.research-item h3{font-size:21px;font-weight:500;letter-spacing:-.025em;margin-bottom:7px}
.research-item p,.publication p,.activity p{color:var(--muted);font-size:13px;max-width:800px}
.publication{display:grid;grid-template-columns:100px 1fr;gap:30px;padding:25px 0;border-bottom:1px solid var(--line)}
.publication-year,.activity-date{color:var(--muted);font-size:13px}
.publication h3{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.activity{display:grid;grid-template-columns:110px 1fr;gap:30px;padding:23px 0;border-bottom:1px solid var(--line)}
.activity h3{font-size:17px;font-weight:500;letter-spacing:-.02em;margin-bottom:4px}
.activity a{text-decoration:underline;text-underline-offset:3px}
.external-link{margin-left:8px;text-decoration:none;opacity:.6;font-size:.9em}
.external-link:hover{opacity:1}

/* book */
.book{display:grid;grid-template-columns:320px 1fr;gap:80px;align-items:center}
.book-photo-wrap{display:flex;flex-direction:column;gap:11px}
.book-photo{width:280px;overflow:hidden;background:#deded8;border:1px solid var(--line);box-shadow:14px 14px 0 #deded8}
.book-photo img{width:100%;height:auto;object-fit:contain}
.book-info h3{font-size:31px;font-weight:500;line-height:1.35;letter-spacing:-.035em;margin-bottom:20px}
.book-info p{color:var(--muted);margin-bottom:17px;max-width:760px}
.book-caption{font-size:11px;color:var(--muted)}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.project{background:var(--surface);border:1px solid var(--line);padding:32px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.project:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.06)}
.project-type{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.project h3{font-size:28px;font-weight:500;letter-spacing:-.04em;margin:18px 0 8px}
.project p{color:var(--muted);font-size:13px}
.project-link{margin-top:25px;font-size:12px;font-weight:600}

/* CV/contact */
.cv-box{background:var(--accent);color:#fff;padding:42px;display:flex;align-items:center;justify-content:space-between;gap:25px}
.cv-box h3{font-size:27px;font-weight:500;margin-bottom:5px}.cv-box p{color:#c7cccd;font-size:13px}
.button{display:inline-block;background:#fff;color:var(--text);padding:11px 17px;font-size:12px;font-weight:600;white-space:nowrap}
.contact{display:grid;grid-template-columns:1fr 2fr;gap:80px}.contact-text{font-size:20px;max-width:700px}
.contact-links{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:30px}
.contact-link{font-size:14px;border-bottom:1px solid var(--text);padding-bottom:2px}
footer{padding:32px 0;font-size:11px;color:var(--muted)}.footer-inner{display:flex;justify-content:space-between;gap:20px}

@media(max-width:850px){
 .container{width:min(calc(100% - 30px),var(--max))} section{padding:72px 0}
 .nav-links{display:none}.nav-right{gap:8px}
 .hero-grid,.about-grid,.contact{grid-template-columns:1fr;gap:35px}
 .hero-inner{padding:65px 0 55px}.hero h1{font-size:60px}
 .profile-frame{width:220px}
 .bio-row{grid-template-columns:115px 1fr}
 .publication,.activity{grid-template-columns:1fr;gap:4px}
 .research-item{grid-template-columns:45px 1fr;gap:15px}
 .book{grid-template-columns:1fr;gap:50px}.book-photo{width:220px}
 .projects{grid-template-columns:1fr}.cv-box{padding:32px 25px;flex-direction:column;align-items:flex-start}
 .footer-inner{flex-direction:column}
}
</style>

about:{label:"소개",p1:"성균관대학교 사학과에서 석사 및 박사과정을 마쳤습니다. 현재 일본 교육계 기업에서 개발자로 근무하는 한편 The Then Lab 제휴 연구자로 활동하고 있습니다.",p2:"주요 연구는 제정러시아기와 러시아 내전기의 한인 이주, 국적, 민족성과 정체성에서 출발하여 식민지 엘리트에 대한 재판과 기억, 해방 이후 한국의 기술·외국인 정치담론으로 확장되고 있습니다.",p3:"특히 역사학과 데이터베이스, 지도, 디지털 아카이브, 자연어처리와 같은 디지털 방법론을 연결하는 ‘인문학적 엔지니어링’을 실험하고 있습니다."},

research:{label:"연구",title:"연구 주제",1:{title:"이주 · 국적 · 정체성",text:"러일 경합 속 조선인의 정체성과 러시아 내전기 이념 경합 속 이동, 국적, 민족성, 소속의 문제."},2:{title:"식민지 엘리트 · 재판 · 기억",text:"식민지 엘리트에 대한 재판 기록과 언론 데이터를 통해 전후 기억과 감정이 어떻게 형성되었는지를 분석."},3:{title:"해방 이후 기술 · 외국인 정치담론",text:"해방 이후 한국 사회에서 기술, 외국인, 국제질서가 연결되는 정치·사회적 담론의 변화."},4:{title:"Digital History · 인문학적 엔지니어링",text:"데이터베이스, GIS, 네트워크, 디지털 아카이브, 자연어처리와 AI를 활용하여 역사 자료를 새롭게 읽고 서사화하는 방법."}},

about:{label:"About",p1:"I completed my M.A. and Ph.D. in History at Sungkyunkwan University. I currently work as a developer at an education-industry company in Japan and as an affiliated researcher with The Then Lab at KAIST.",p2:"My research began with Korean migration, nationality, ethnicity, and identity in the Russian Empire and during the Russian Civil War, and has expanded to trials and memory of colonial elites and post-liberation political discourse on technology and foreigners in Korea.",p3:"I am particularly interested in ‘humanistic engineering’: connecting historical scholarship with databases, maps, digital archives, natural-language processing, and other computational methods."},

hero:{kicker:"歴史学 · デジタル・ヒューマニティーズ",description:"ロシア・コリアン・ディアスポラ、移民と移動、国籍と帰化、植民地エリートと記憶を研究しています。<br>近年はデジタル・ヒューマニティーズを取り入れ、新しい歴史研究の方法と物語の構築を探究しています。"},

about:{label:"プロフィール",p1:"成均館大学校史学科で修士・博士課程を修了しました。現在は日本の教育関連企業で開発者として勤務する一方、The Then Lab at KAISTの提携研究員として活動しています。",p2:"主な研究は帝政ロシア期およびロシア内戦期のコリアンの移住、国籍、民族性とアイデンティティから出発し、植民地エリートをめぐる裁判と記憶、解放後韓国の技術・外国人をめぐる政治言説へと広がっています。",p3:"特にデータベース、地図、デジタル・アーカイブ、自然言語処理などを歴史研究と結びつける「人文学的エンジニアリング」に取り組んでいます。"},
facts:{educationLabel:"学歴",education:"成均館大学校史学科修士・博士修了",workLabel:"現在",work:"日本の教育関連企業・開発者 · <a href=\"https://thethenlab.kaist.ac.kr/\" target=\"_blank\" rel=\"noopener noreferrer\">The Then Lab at KAIST</a>提携研究員",bookLabel:"著書",book:"2025 『帰化を越えて：ロシアへ渡ったコリアンの物語』刊行",awardsLabel:"選定",awards:"セジョン図書・学術部門 · 韓国大学出版協会「今年の優秀図書」教養部門"},
research:{label:"研究",title:"研究テーマ",1:{title:"移住 · 国籍 · アイデンティティ",text:"露日競争のなかの朝鮮人のアイデンティティと、ロシア内戦期の理念的競合における移動、国籍、民族性、帰属の問題。"},2:{title:"植民地エリート · 裁判 · 記憶",text:"裁判記録と新聞データを通じて、植民地エリートをめぐる戦後の記憶と感情が形成される過程を分析。"},3:{title:"技術 · 外国人 · 政治言説",text:"解放後韓国社会において、技術、外国人、国際秩序が結びつく政治・社会的言説の変化。"},4:{title:"Digital History · 人文学的エンジニアリング",text:"データベース、GIS、ネットワーク、デジタル・アーカイブ、NLP、AIを用いて史料を新たに読み、物語化する方法。"}},

about:{label:"Обо мне",p1:"Я окончил магистратуру и докторантуру по истории в Университете Сонгюнкван. В настоящее время работаю разработчиком в японской компании в сфере образования и являюсь аффилированным исследователем The Then Lab at KAIST.",p2:"Мои исследования начинались с истории миграции корейцев, гражданства, этничности и идентичности в Российской империи и в период Гражданской войны в России и расширились до изучения судебных процессов над колониальными элитами, памяти и политического дискурса о технологиях и иностранцах в послевоенной Корее.",p3:"Особое внимание я уделяю «гуманитарной инженерии» — соединению исторических исследований с базами данных, картами, цифровыми архивами, обработкой естественного языка и ИИ."},

let currentLanguage="ko";
function getValue(obj,path){return path.split(".").reduce((c,k)=>c?c[k]:undefined,obj)}
function setLanguage(language,save=true){
 if(!translations[language]) language="ko";
 currentLanguage=language; document.documentElement.lang=language;
 const dict=translations[language];
 document.querySelectorAll("[data-i18n]").forEach(el=>{
   const value=getValue(dict,el.getAttribute("data-i18n"));
   if(value!==undefined) el.innerHTML=value;
 });
 document.querySelectorAll(".language-switcher button").forEach(b=>b.classList.toggle("active",b.dataset.lang===language));
 document.title=language==="ko"?"송영화 | 역사학 · 디지털 인문학":language==="ja"?"Song Younghwa | 歴史学 · デジタル・ヒューマニティーズ":language==="ru"?"Song Younghwa | Историк · Цифровые гуманитарные науки":"Song Younghwa | Historian · Digital Humanities";
 if(save)localStorage.setItem("preferredLanguage",language);
}
function initializeLanguage(){
 const saved=localStorage.getItem("preferredLanguage");
 if(saved&&translations[saved])return setLanguage(saved,false);
 const b=(navigator.language||"ko").toLowerCase();
 const lang=b.startsWith("ja")?"ja":b.startsWith("ru")?"ru":b.startsWith("en")?"en":"ko";
 setLanguage(lang,false);
}
document.addEventListener("DOMContentLoaded",initializeLanguage);
</script>
